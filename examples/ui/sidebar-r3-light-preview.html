/* R3 readability and placement corrections: surfaces stay distinct and accessible. */
.top-button:hover{background:#e4edff}
.nav{grid-template-columns:repeat(2,minmax(0,1fr))}
.app.catalog-surface{width:min(1060px,100%);height:min(810px,calc(100dvh - 66px))}
.catalog-surface .nav{display:none}
.catalog-surface .content{padding:25px 30px 28px}
.catalog-surface #catalog-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.catalog-surface .catalog-card{margin:0;min-height:150px}
.catalog-surface .reader{max-width:790px;margin:auto}
.catalog-surface .dock{padding:12px 27px}
.catalog-surface .heading-line h1{font-size:28px}

@media(max-width:520px){.app.catalog-surface{height:100dvh;min-height:0}.catalog-surface .content{padding:17px 14px}.catalog-surface #catalog-list{grid-template-columns:1fr}.catalog-surface .heading-line h1{font-size:23px}}

<body>
<div class="scene">
  <div class="hint-above"><span>设计纠偏 R3</span> 浅色标题提高对比度；Sidebar 只保留使用与开发；任务目录切换为完整页面</div>
  <div class="app" role="application" aria-label="OpenDesk Browser Sidebar 交互原型">
    <header class="top">
      <div class="top-line"><div class="brand-mark">O</div><div class="brand"><strong>OpenDesk Browser</strong><small>网页自动化工作台</small></div><button class="top-button" data-action="catalog" type="button" aria-label="在完整页面打开任务目录">任务目录 ↗</button></div>
      
    </header>
    <nav class="nav" aria-label="Sidebar 页面"><button data-tab="tasks" aria-selected="true" type="button">我的任务</button><button data-tab="discover" aria-selected="false" type="button">发现</button><button data-tab="develop" aria-selected="false" type="button">开发</button></nav>
    <div class="scroll" id="scroll" tabindex="-1"><main class="content" id="main"></main></div>
    <footer class="dock" id="dock"></footer>
  </div>
  <div class="demo-note">可点击交互预览。发现仅搜索本机已安装任务；完整目录仍为独立页面。模拟点击不代表真实 Chrome 运行或安装。</div>
</div>
<div id="overlay" class="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">安装确认</h2><button class="secondary" id="close-sheet" type="button">关闭 ✕</button></div><div class="sheet-body" id="sheet-body"></div><div class="sheet-actions" id="sheet-actions"></div></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const tasks=[
{id:'page.summary',title:'阅读当前网页',desc:'读取当前页面标题、网址和关键信息，生成简洁摘要。',icon:'▤',tone:'green',category:'效率',author:'本地示例',source:'内置示例',version:'1.2.0',site:'当前网页',permissions:['读取当前网页信息'],state:'可运行',installed:true,verified:true,fields:[]},
{id:'form.fill',title:'网页表单填写',desc:'在指定网站填写表单、提交并等待成功提示。',icon:'✎',tone:'amber',category:'自动化',author:'OpenDesk 示例',source:'本地任务包',version:'1.0.0',site:'example.com',permissions:['操作当前页面元素','读取运行结果'],state:'待安装',installed:false,verified:true,fields:[{name:'name',title:'姓名',placeholder:'输入姓名',value:'Alice'}]},
{id:'link.audit',title:'链接状态检查',desc:'检查页面上的链接，整理可访问与不可访问的目标。',icon:'⌁',tone:'pink',category:'效率',author:'OpenDesk 示例',source:'本地任务包',version:'0.9.0',site:'当前网页',permissions:['读取页面链接'],state:'待安装',installed:false,verified:true,fields:[]},
{id:'title.copy',title:'提取页面标题',desc:'提取当前页面标题和 URL，便于复制到笔记中。',icon:'❐',tone:'',category:'开发工具',author:'本地开发者',source:'导入草稿',version:'0.1.0',site:'当前网页',permissions:['读取页面信息'],state:'待验证',installed:false,verified:false,fields:[]}
];
let ui={tab:'tasks',selected:'page.summary',reader:null,filter:'全部',search:'',localQuery:'',localFilter:'current',runState:'idle',activeRunTask:null,runToken:0,history:[],draft:'async function main() {\n  const title = await page.title();\n  return { title, url: await page.url() };\n}',draftParams:'{}',draftSaved:false,draftResult:'',params:{}};
const main=document.getElementById('main'), dock=document.getElementById('dock'), scroller=document.getElementById('scroll'),overlay=document.getElementById('overlay'),toast=document.getElementById('toast');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const task=id=>tasks.find(x=>x.id===id);
let toastTimer;
function showToast(message){toast.textContent=message;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2800)}
function badge(t){return `<span class="pill ${t.installed?'good':t.verified?'':'warn'}">${t.installed?'已安装':t.verified?'本地可用':'待验证'}</span>`}
function goto(tab){if(!['tasks','discover','develop','catalog'].includes(tab))return;ui.tab=tab;ui.reader=null;document.querySelector('.app').classList.toggle('catalog-surface',tab==='catalog');scroller.scrollTop=0;render()}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===ui.tab)));if(ui.tab==='tasks')drawTasks();if(ui.tab==='discover')drawLocalDiscovery();if(ui.tab==='catalog')drawDiscover();if(ui.tab==='develop')drawDevelop();renderDock()}
function drawTasks(){let installed=tasks.filter(t=>t.installed),selected=task(ui.selected);if(!selected?.installed){ui.selected=installed[0]?.id??null;selected=task(ui.selected)}
main.innerHTML=`<div class="heading-line"><div><div class="eyebrow">YOUR WORKSPACE</div><h1>我的任务</h1></div><span class="pill good">${installed.length} 个已安装</span></div><p class="subcopy">选一个任务，在当前网页直接运行。</p><div class="section-title">已安装任务 <button type="button" data-action="discover">+ 发现更多</button></div><div id="installed-list">${installed.length?installed.map(t=>`<button type="button" class="task-item ${ui.selected===t.id?'selected':''}" data-select="${safe(t.id)}"><span class="symbol ${t.tone}">${t.icon}</span><span class="item-info"><strong>${safe(t.title)}</strong><small>${safe(t.desc)}</small></span>${badge(t)}<span class="chevron">›</span></button>`).join(''):`<div class="glass selected-detail">还没有安装任务。<button type="button" class="link-button" data-action="discover">去发现任务 →</button></div>`}</div>${selected?`<div class="glass selected-detail"><div class="fine-row"><h2>${safe(selected.title)}</h2><span class="pill good">适用于当前网页</span></div><p>${safe(selected.desc)}</p><div class="fine-row micro muted"><span>${safe(selected.site)} · v${safe(selected.version)}</span><button class="link-button" data-action="manage" type="button">任务详情 ›</button></div>${selected.fields.length?selected.fields.map(f=>`<label class="label" for="param-${safe(f.name)}">${safe(f.title)} <span style="color:#b66d31">*</span></label><input class="text-input" id="param-${safe(f.name)}" data-field="${safe(f.name)}" placeholder="${safe(f.placeholder)}" value="${safe(ui.params[f.name]??f.value)}" />`).join(''):`<div class="notice" style="margin-top:12px">此任务无需额外参数，可以直接运行。</div>`}</div>`:''}<div class="section-title">最近运行 <button type="button" data-action="history">查看全部</button></div><div class="glass" style="padding:5px 13px">${ui.history.filter(h=>h.id===selected?.id).length?ui.history.filter(h=>h.id===selected.id).slice(0,3).map(h=>`<div class="history-item"><span class="history-icon">●</span><div class="history-text"><strong>${safe(h.label)}</strong><small>${safe(h.time)} · 结果已保留于预览会话</small></div><span class="pill good">成功</span></div>`).join(''):`<div style="padding:13px 0;color:#8793a6;font-size:11px">尚无执行记录。运行后会在这里展示状态和结果。</div>`}</div>${ui.history.some(h=>h.id===selected?.id)?`<div class="result-card"><strong style="font-size:11px">最近一次结果 · 演示</strong><pre>${safe(ui.history.filter(h=>h.id===selected.id).at(-1)?.result)}</pre></div>`:''}`;
}
function drawLocalDiscovery(){
  const installed=tasks.filter(t=>t.installed);
  const eligible=installed.filter(t=>
    (ui.localFilter==='all'||ui.localFilter==='disabled'&&t.disabled===true||
      ui.localFilter==='current'&&!t.disabled&&['当前网页','example.com'].includes(t.site))&&
    [t.title,t.desc,t.site,t.author].join(' ').toLocaleLowerCase().includes(ui.localQuery.toLocaleLowerCase())
  );
  main.innerHTML=`<div class="heading-line"><div><div class="eyebrow">INSTALLED TASKS</div><h1>发现</h1></div><span class="pill good">${installed.length} 个已安装</span></div>
    <p class="subcopy">从本机已有任务中找出适合当前网页的操作；不会从网络搜索或自动安装。</p>
    <div class="search-wrap"><span class="search-icon">⌕</span><input id="local-search" class="search-input" aria-label="搜索已安装任务" placeholder="搜索名称、用途或网站…" value="${safe(ui.localQuery)}" /></div>
    <div class="chips">${[['current','当前网页'],['all','全部已安装'],['disabled','已停用']].map(([value,label])=>`<button type="button" class="chip ${ui.localFilter===value?'active':''}" data-local-filter="${value}">${label}</button>`).join('')}</div>
    <div class="section-title">找到 ${eligible.length} 个本地任务</div>
    <div>${eligible.map(t=>`<button type="button" class="task-item" data-local-pick="${safe(t.id)}"><span class="symbol ${t.tone}">${t.icon}</span><span class="item-info"><strong>${safe(t.title)}</strong><small>${safe(t.desc)}</small><small>${safe(t.site)} · ${t.disabled?'已停用':'已安装'}</small></span><span class="chevron">›</span></button>`).join('')||'<div class="notice">没有匹配的已安装任务，可切换筛选条件或打开完整任务目录。</div>'}</div>
    <div class="notice" style="margin-top:15px">网站匹配仅用于发现候选；正式运行仍需确认当前精确网页、权限及任务参数。</div>
    <div class="section-title">需要导入或安装新任务？ <button type="button" data-action="catalog">打开任务目录 ↗</button></div>`;
}
function catalogCards(){let list=tasks.filter(t=>(ui.filter==='全部'||ui.filter==='当前网页'&&['当前网页','example.com'].includes(t.site)||ui.filter===t.category)&&`${t.title} ${t.desc} ${t.author}`.toLowerCase().includes(ui.search.toLowerCase()));return list.map(t=>`<button type="button" data-read="${safe(t.id)}" class="catalog-card"><div class="catalog-top"><span class="symbol ${t.tone}">${t.icon}</span><div class="item-info"><span class="catalog-title">${safe(t.title)}</span><small>${safe(t.author)} · ${safe(t.site)}</small></div>${badge(t)}</div><p>${safe(t.desc)}</p><div class="metadata"><span>${safe(t.category)} · v${safe(t.version)}</span><span>查看详情 →</span></div></button>`).join('')||'<div class="notice">没有匹配的本地任务。试试其他关键字或分类。</div>'}
function drawDiscover(){if(ui.reader){const t=task(ui.reader);main.innerHTML=`<div class="reader"><button class="back" type="button" data-action="back">← 返回发现</button><div class="hero-icon">${t.icon}</div><h1>${safe(t.title)}</h1><div style="display:flex;gap:8px;margin-top:10px;align-items:center">${badge(t)}<span class="pill ash">v${safe(t.version)}</span></div><p class="reader-summary">${safe(t.desc)}</p><div class="reader-block"><h3>任务说明</h3><p>当前网页经过授权后执行这一任务，结果会在「我的任务」展示。此页面是阅读式详情，安装需额外确认权限。</p></div><div class="reader-block"><h3>来源与权限</h3><div class="reader-line"><span class="key">作者</span><span class="value">${safe(t.author)}</span></div><div class="reader-line"><span class="key">来源</span><span class="value">${safe(t.source)}</span></div><div class="reader-line"><span class="key">适用网站</span><span class="value">${safe(t.site)}</span></div><div class="reader-line"><span class="key">权限需求</span><span class="value">${t.permissions.map(safe).join('、')}</span></div><div class="reader-line"><span class="key">可信状态</span><span class="value">${t.verified?'本机候选验证通过（演示）':'未经验证，仅可进入开发草稿'}</span></div></div><div class="notice">这是离线可点击界面原型，不能据此宣称真实任务安全审核通过或 Chrome 已安装。</div></div>`;return}
main.innerHTML=`<div class="heading-line"><div><div class="eyebrow">LOCAL TASK LIBRARY</div><h1>独立任务目录</h1></div><button class="secondary" type="button" data-action="tasks">← 返回侧边栏</button></div><p class="subcopy">完整页面 · 搜索分类、阅读详情、检查权限、安装本地任务。此处仅为离线交互演示。</p><div class="search-wrap"><span class="search-icon">⌕</span><input id="catalog-search" class="search-input" aria-label="搜索任务" placeholder="搜索任务、功能或作者…" value="${safe(ui.search)}" /></div><div class="chips">${['全部','当前网页','效率','自动化','开发工具'].map(x=>`<button type="button" class="chip ${ui.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div id="catalog-list">${catalogCards()}</div><div class="section-title">本地任务包</div><button class="secondary" type="button" data-action="import" style="width:100%;margin-bottom:7px">＋ 导入 JSON 任务包 / JavaScript 草稿</button><p class="small muted">导入不等于已验证。未验证的脚本不能直接安装。</p><input id="file-import" type="file" accept=".js,.json" hidden /></div>`;}
function drawDevelop(){main.innerHTML=`<div class="heading-line"><div><div class="eyebrow">DEVELOPER WORKSPACE</div><h1>开发</h1></div><span class="pill ${ui.draftSaved?'good':'warn'}" id="draft-state">${ui.draftSaved?'已保存版本':'未保存草稿'}</span></div><p class="subcopy">写代码 → 立即运行草稿 → 查看结果 → 按需保存。</p><div class="editor-shell"><div class="editor-bar"><div class="filename"><span class="js">JS</span> 当前草稿.js</div><button type="button" data-action="save" class="secondary">保存版本</button></div><textarea id="code" aria-label="JavaScript 编辑器" class="editor-code" spellcheck="false">${safe(ui.draft)}</textarea><div class="editor-meta"><span>JavaScript · async main()</span><span>⌘ / Ctrl + Enter 运行</span></div></div><div class="glass runtime-area"><h3>执行上下文</h3><div class="fine-row"><span class="small muted">目标网页</span><span class="pill good">example.com / 当前页</span></div><details><summary>参数 JSON</summary><textarea id="draft-params" spellcheck="false" aria-label="参数 JSON">${safe(ui.draftParams)}</textarea></details><details><summary>高级设置与版本</summary><div class="small muted" style="padding-top:10px;line-height:1.8">保存版本、目标身份、SDK 入口与错误明细在正式扩展中复用已有受控运行机制；此处不模拟额外权限。</div></details></div><div class="section-title">结果与日志 <span class="muted">${ui.runState==='running'?'运行中':'最近一次'}</span></div><div class="result-card"><strong style="font-size:11px">${ui.draftResult?'输出 · 演示':'运行后显示结果'}</strong><pre id="draft-output">${safe(ui.draftResult||'等待首次草稿运行…')}</pre></div>`}
function renderDock(){if(ui.tab==='tasks'){let t=task(ui.selected),active=ui.runState==='running';dock.innerHTML=`<div class="dock-hint"><span></span>${active?'正在执行演示任务 · 可以停止':t?'当前目标已识别 · 下一次运行将冻结目标':'先安装任务，即可运行'}</div><div class="dock-row"><button class="btn-primary" type="button" data-action="run-task" ${!t||active?'disabled':''}>${active?'运行中…':'▶ 运行任务'}</button><button class="${active?'btn-danger':'btn-secondary'}" type="button" data-action="stop" ${!active?'disabled':''}>■ 停止</button></div>`}else if(ui.tab==='discover'){dock.innerHTML=`<div class="dock-hint"><span></span>发现只检索本机已安装任务，不会自动运行</div><div class="dock-row"><button class="btn-primary" type="button" data-action="tasks">返回我的任务</button><button class="btn-secondary" type="button" data-action="catalog">任务目录 ↗</button></div>`}else if(ui.tab==='catalog'){let t=task(ui.reader);dock.innerHTML=t?`<div class="dock-hint"><span></span>${t.verified?'已展示所需权限 · 安装须明确确认':'未验证脚本不能直接安装'}</div><div class="dock-row"><button class="btn-secondary" type="button" data-action="back">返回目录</button><button class="btn-primary" type="button" data-action="install" ${t.installed||!t.verified?'disabled':''}>${t.installed?'已安装':'查看权限并安装 →'}</button></div>`:`<div class="dock-hint"><span></span>先阅读任务说明，再决定是否安装</div><div class="dock-row"><button class="btn-primary" type="button" data-action="import">＋ 从本地导入任务</button></div>`}else{let active=ui.runState==='running';dock.innerHTML=`<div class="dock-hint"><span></span>${active?'正在执行草稿演示 · 可停止':ui.draftSaved?'当前脚本已有保存版本':'修改不自动保存 · 草稿可以直接运行'}</div><div class="dock-row"><button class="btn-primary" data-action="run-draft" type="button" ${active?'disabled':''}>${active?'运行中…':'▶ 运行草稿'}</button><button class="${active?'btn-danger':'btn-secondary'}" data-action="${active?'stop':'save'}" type="button">${active?'■ 停止':'保存版本'}</button></div>`}}
function openSheet(title,body,buttons){overlay.hidden=false;document.getElementById('sheet-title').textContent=title;document.getElementById('sheet-body').innerHTML=body;document.getElementById('sheet-actions').innerHTML=buttons;document.getElementById('close-sheet').focus()}
function closeSheet(){overlay.hidden=true}
function install(){let t=task(ui.reader);if(!t)return;if(!t.verified){showToast('未验证脚本只能进入开发草稿');return;}openSheet('确认安装 · '+t.title,`<p class="reader-summary" style="margin-top:0">请确认版本、网站范围与权限后继续。</p><div class="reader-block"><div class="reader-line"><span class="key">确定版本</span><strong>v${safe(t.version)}</strong></div><div class="reader-line"><span class="key">适用网站</span><strong>${safe(t.site)}</strong></div><div class="reader-line"><span class="key">作者</span><strong>${safe(t.author)}</strong></div><div class="reader-line"><span class="key">来源</span><strong>${safe(t.source)}</strong></div><div class="reader-line"><span class="key">所需权限</span><span class="value">${t.permissions.map(safe).join('、')}</span></div></div><div class="notice">预览中的安装仅改变本页模拟状态，不授予浏览器权限。正式实现必须执行后台可信验证和网站授权。</div>`,`<button class="btn-secondary" data-action="cancel-sheet" type="button">取消</button><button class="btn-primary" data-action="confirm-install" data-id="${safe(t.id)}" type="button">确认安装此版本</button>`)}
function startRun(isDraft){if(ui.runState==='running')return;ui.runState='running';let id=isDraft?'__draft':ui.selected;ui.activeRunTask=id;let token=++ui.runToken;renderDock();if(isDraft){try{JSON.parse(ui.draftParams)}catch{ui.runState='idle';showToast('参数 JSON 格式不正确');renderDock();return}ui.draftResult='运行中 · 此预览不会操作真实网页';drawDevelop()}else drawTasks();renderDock();setTimeout(()=>{if(token!==ui.runToken||ui.runState!=='running')return;ui.runState='idle';if(isDraft){ui.draftResult=JSON.stringify({demo:true,ok:true,title:'演示表单',url:'https://example.com/demo'},null,2);drawDevelop()}else{const t=task(id);const result=JSON.stringify({demo:true,ok:true,task:t?.title,parameters:ui.params,url:'https://example.com/demo'},null,2);ui.history.push({id,label:'完成 · '+t?.title,time:new Date().toLocaleTimeString('zh-CN'),result});drawTasks()}renderDock();showToast('模拟运行已完成 · 未调用真实 Chrome')},1200)}
function stopRun(){if(ui.runState!=='running')return;++ui.runToken;ui.runState='idle';if(ui.activeRunTask==='__draft'){ui.draftResult='模拟任务已停止';drawDevelop()}else drawTasks();renderDock();showToast('模拟停止完成')}
function saveDraft(){ui.draftSaved=true;render();showToast('已模拟保存版本（未写入 IndexedDB）')}
main.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.select){ui.selected=d.select;drawTasks();renderDock();return}if(d.localPick){ui.selected=d.localPick;goto('tasks');return}if(d.localFilter){ui.localFilter=d.localFilter;drawLocalDiscovery();return}if(d.read){ui.reader=d.read;scroller.scrollTop=0;drawDiscover();renderDock();return}if(d.filter){ui.filter=d.filter;drawDiscover();return}act(d.action,b)});
dock.addEventListener('click',e=>{let b=e.target.closest('button');if(b)act(b.dataset.action,b)});
function act(action,el){switch(action){case 'discover':goto('discover');break;case 'catalog':goto('catalog');break;case 'tasks':goto('tasks');break;case 'back':ui.reader=null;drawDiscover();renderDock();break;case 'import':{goto('catalog');document.getElementById('file-import')?.click();break}case 'install':install();break;case 'run-task':startRun(false);break;case 'run-draft':startRun(true);break;case 'stop':stopRun();break;case 'save':saveDraft();break;case 'manage':showToast('任务管理将在正式 Side Panel 展示停用、升级与卸载');break;case 'history':showToast('这里显示最近执行记录；完整历史由正式 Controller 提供');break;case 'cancel-sheet':closeSheet();break;case 'confirm-install':{let t=task(el.dataset.id);if(!t)return;t.installed=true;ui.selected=t.id;closeSheet();goto('tasks');showToast(t.title+' 已添加到我的任务（预览模拟）');break}}}
main.addEventListener('input',e=>{if(e.target.id==='catalog-search'){ui.search=e.target.value;document.getElementById('catalog-list').innerHTML=catalogCards()}if(e.target.id==='local-search'){ui.localQuery=e.target.value;const cursor=e.target.selectionStart;drawLocalDiscovery();const input=document.getElementById('local-search');input?.focus();input?.setSelectionRange(cursor,cursor)}if(e.target.id==='code'){ui.draft=e.target.value;ui.draftSaved=false;let pill=document.getElementById('draft-state');if(pill){pill.textContent='未保存草稿';pill.className='pill warn'}renderDock()}if(e.target.id==='draft-params')ui.draftParams=e.target.value;if(e.target.dataset.field)ui.params[e.target.dataset.field]=e.target.value});
main.addEventListener('change',async e=>{if(e.target.id==='file-import'){let f=e.target.files?.[0];if(!f)return;if(f.size>100000){showToast('文件过大');return}if(f.name.toLowerCase().endsWith('.js')){ui.draft=await f.text();ui.draftSaved=false;goto('develop');showToast('代码已进入未保存草稿 · 预览状态')}else showToast('已选择 JSON；正式扩展需完成包校验，不直接安装')}});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.tab)));
document.querySelector('.top-button').addEventListener('click',()=>goto('discover'));/* original help sheet retained for historical reference */
document.getElementById('close-sheet').addEventListener('click',closeSheet);document.getElementById('sheet-actions').addEventListener('click',e=>{let b=e.target.closest('button');if(b)act(b.dataset.action,b)});overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeSheet();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&ui.tab==='develop'&&!e.isComposing){e.preventDefault();startRun(true)}});
render();
</script>
</body>
</html>
