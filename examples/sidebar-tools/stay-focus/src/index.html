<main class="sf" aria-label="Stay Focus 保持专注">
  <header class="sf-heading">
    <div class="sf-brand"><span class="sf-brand-symbol" aria-hidden="true">◷</span><div><h2>Stay Focus</h2><p class="sf-sub">把时间留给重要的事</p></div></div>
    <span id="native-state" class="sf-state">未开启</span>
  </header>

  <section class="sf-hero" aria-label="今日娱乐共享额度">
    <div class="sf-headrow"><span>今日娱乐时间</span><time id="date-label">—</time></div>
    <div class="sf-balance"><span>今天还剩</span><strong id="total-remaining">30 分钟</strong></div>
    <div class="sf-progress" aria-hidden="true"><i id="total-progress"></i></div>
    <div class="sf-usage"><span>已使用 <strong id="total-used">0 分钟</strong></span><span>总额度 <strong id="budget-total">30 分钟</strong></span></div>
    <div class="sf-budget-controls" id="budget-controls">
      <form id="daily-budget-form" class="sf-budget-form">
        <label for="daily-budget-minutes">每日额度</label>
        <input id="daily-budget-minutes" type="number" value="30" min="1" max="1440" step="1" inputmode="numeric" required>
        <span class="sf-budget-unit">分钟</span>
        <button id="daily-budget-save" type="button" class="sf-primary" hidden>保存</button>
      </form>
      <div id="budget-presets" class="sf-budget-presets" aria-label="快捷设置每日娱乐额度">
        <button type="button" data-budget="15">15</button>
        <button type="button" data-budget="30">30</button>
        <button type="button" data-budget="45">45</button>
        <button type="button" data-budget="60">60</button>
      </div>
    </div>
    <p id="total-caption" class="sf-caption"></p>
  </section>

  <section class="sf-session" id="focus-session-controls" aria-label="临时专注">
    <div><strong>临时专注</strong><p>暂时限制娱乐网站 25 分钟</p></div>
    <div class="sf-session-action"><button type="button" id="focus-start" class="sf-secondary">开始</button><button type="button" id="focus-stop" class="sf-secondary" hidden>结束</button></div>
  </section>

  <div id="message" class="sf-message" role="status" aria-live="polite"></div>

  <section class="sf-section sf-managed" aria-label="网站管理">
    <div class="sf-headrow sf-section-head"><h3>娱乐网站</h3><div class="sf-section-actions"><span id="site-count" class="sf-hint">0 个</span><button type="button" class="sf-icon-button sf-add-trigger" id="open-add-site" aria-label="添加自定义网站" title="添加自定义网站">＋</button></div></div>
    <div class="sf-quick-add" aria-label="快速添加娱乐网站">
      <button type="button" id="quick-add" class="sf-current-button" disabled>＋ 当前网页</button>
      <div id="quick-presets" class="sf-quick-presets" aria-label="常用娱乐网站"></div>
      <details id="site-discovery" class="sf-more-recommendations" hidden><summary>更多推荐</summary><div id="more-presets" class="sf-quick-presets"></div></details>
    </div>
    <div id="sites" class="sf-list" aria-live="polite"><p class="sf-empty">还没有管理的网站</p></div>
  </section>

  <details class="sf-settings sf-manual" id="manual-site">
    <summary id="manual-site-title">自定义添加网站</summary>
    <form id="site-form" class="sf-site-form">
      <label for="site-host">网站域名</label>
      <input id="site-host" type="text" maxlength="253" required placeholder="例如 youtube.com" autocomplete="off" spellcheck="false">
      <div class="sf-two">
        <label>额度来源<select id="site-group"><option value="entertainment">娱乐共享额度</option><option value="">独立额度</option></select></label>
        <label>限制方式<select id="site-mode"><option value="limit">每日限额</option><option value="always">始终限制</option></select></label>
      </div>
      <label id="site-minutes-row" class="sf-site-minutes" hidden>网站独立额度（分钟）<input id="site-minutes" type="number" min="1" max="1440" value="30"></label>
      <label class="sf-check"><input type="checkbox" id="site-subdomains" checked>包含子域名</label>
      <div class="sf-actions"><button class="sf-primary" id="site-save" type="button">添加网站</button><button class="sf-secondary" type="button" id="site-new" hidden>取消编辑</button></div>
    </form>
  </details>

  <details class="sf-settings" id="advanced">
    <summary>更多设置 <span>工作时段 · 白名单 · 自定义额度</span></summary>
    <section class="sf-panel"><h3>工作时段</h3>
      <form id="schedule-form"><label class="sf-check"><input id="schedule-enabled" type="checkbox">在以下时间限制管理的网站</label>
        <div class="sf-weekdays" id="weekdays"><label><input type="checkbox" value="1">一</label><label><input type="checkbox" value="2">二</label><label><input type="checkbox" value="3">三</label><label><input type="checkbox" value="4">四</label><label><input type="checkbox" value="5">五</label><label><input type="checkbox" value="6">六</label><label><input type="checkbox" value="0">日</label></div>
        <div class="sf-two"><label>开始时间<input id="schedule-from" type="time" value="09:00" required></label><label>结束时间<input id="schedule-to" type="time" value="17:00" required></label></div>
        <button class="sf-secondary" id="schedule-save" type="button">保存时段</button></form>
    </section>
    <section class="sf-panel"><h3>始终允许访问</h3><p class="sf-hint">白名单域名优先于所有限制。每行填写一个域名。</p>
      <form id="whitelist-form"><label class="sf-visually-hidden" for="whitelist">白名单域名，每行一个</label><textarea id="whitelist" rows="3" placeholder="docs.example.com"></textarea><button id="whitelist-save" type="button" class="sf-secondary">保存白名单</button></form>
    </section>
    <section class="sf-panel"><h3>其他共享额度组</h3><p class="sf-hint">只用于需要独立共享限额的网站；娱乐总额度在首页修改。</p>
      <form id="group-form" class="sf-inline"><input aria-label="额度组名称" id="group-name" placeholder="例如 social" maxlength="24" required><input aria-label="每天分钟数" id="group-minutes" type="number" min="1" max="1440" value="30" required><button id="group-save" type="button" class="sf-secondary">保存组</button></form>
      <div id="groups" class="sf-groups"></div>
    </section>
    <div class="sf-actions sf-native-actions"><button type="button" id="focus-pause" class="sf-secondary" hidden>在扩展详情中停止限制</button></div>
    <p class="sf-disclaimer">Chrome 权限、全局停止和清空数据由外层可信扩展详情管理。关闭面板不会停止已开启的后台限制。</p>
  </details>
</main>
