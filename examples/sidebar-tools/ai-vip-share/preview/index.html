<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI VIP Share · 正式界面预览</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f4f6fa;color:#28354b;font-size:13px}
/* Public Shared UI also carries the Host body layout. The standalone lab
   owns its page scroll and available width; the product remains unchanged. */
html:has(.studio),body:has(>.studio){height:auto;overflow:auto}
body:has(>.studio){display:block}
.studio{display:grid;gap:12px;width:100%;max-width:680px;margin:0 auto;padding:12px}
.preview-bar{background:#fff;border:1px solid #e1e5ef;border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.preview-identity{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
.preview-identity strong{font-size:14px;letter-spacing:-.2px}
.preview-tag{font-size:11px;color:#64738a}
.preview-scene{display:flex;align-items:center;gap:6px;color:#5b6b82;font-size:12px;margin-left:auto}.preview-scene select{background:#fff;border:1px solid #d9dfeb;border-radius:7px;padding:5px 8px;font:inherit;color:#263b5b;max-width:142px;height:32px}
.preview-panel{position:relative}
.preview-panel>summary{cursor:pointer;list-style:none;color:#536381;font-size:12px;display:flex;align-items:center;gap:6px;min-height:28px;padding:3px 6px;border-radius:7px;user-select:none}
.preview-panel>summary::-webkit-details-marker{display:none}
.preview-panel>summary svg{width:14px;height:14px}
.preview-panel[open]{width:100%;margin:0}
.preview-panel[open]>summary{justify-content:flex-end}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin:8px 0 0;padding-top:10px;border-top:1px solid #e9ecf3}
.control{display:grid;gap:5px;color:#596981;font-size:12px}
.control select,.control button{height:35px;min-width:0;border:1px solid #d9dfeb;border-radius:8px;background:#fff;color:#263b5b;padding:0 10px;font:inherit}
.control button{cursor:pointer;font-weight:600}
.control button:hover{background:#f4f6fb}
.control select:focus-visible,.control button:focus-visible,.preview-panel>summary:focus-visible{outline:2px solid #4569dd;outline-offset:2px}
#preview-note{color:#63738a;font-size:11px;line-height:1.6;margin:8px 0 0}
.stage{display:grid;justify-items:center;min-width:0}
.frame{width:min(var(--frame-width,390px),100%);min-width:0;border:1px solid #e0e5ef;border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 8px 25px rgba(29,48,78,.045)}
.frame #tool-root{min-width:0}
@media(max-width:360px){.studio{padding:8px}.preview-bar{padding:8px 10px}.preview-tag{font-size:10px}}
@media(prefers-color-scheme:dark){body{background:#151b25;color:#e8eefb}.preview-bar,.frame{background:#222c39;border-color:#39475c}.preview-tag,#preview-note,.control,.preview-scene{color:#b1bfd5}.preview-scene select{background:#29374a;color:#e7eefc;border-color:#4a5970}.preview-panel>summary{color:#d4dff1}.controls{border-color:#39475c}.control select,.control button{background:#29374a;color:#e7eefc;border-color:#4a5970}.control button:hover{background:#32435a}}
/* Preview-only theme switch, never packed into the installed app. */
html[data-preview-theme="dark"]{color-scheme:dark;--od-ink:var(--od-dark-ink);--od-sub:var(--od-dark-sub);--od-line:var(--od-dark-line);--od-brand:var(--od-dark-brand);--od-paper:var(--od-dark-paper);--od-bg:var(--od-dark-bg);--od-input-border:var(--od-dark-input-border);--od-warning-bg:#392d21;--od-warning-border:#8b6841;--od-warning-ink:#f6dca8;--od-muted:var(--od-dark-muted);--od-positive:var(--od-dark-positive)}
html[data-preview-theme="light"]{color-scheme:light;--od-ink:#1b2c49;--od-sub:#53647e;--od-line:#e1e8f1;--od-brand:#365eda;--od-paper:#fff;--od-bg:#f5f7fb;--od-input-border:#7f8da1;--od-warning-bg:#fff9ec;--od-warning-border:#dcc58a;--od-warning-ink:#76501b;--od-muted:#f5f7fb;--od-positive:#117a5d}
html[data-preview-theme="dark"] body{background:#151b25;color:#e8eefb}
html[data-preview-theme="light"] body{background:#f4f6fa;color:#28354b}
</style>
</head>
<body>
<div class="studio">
  <div class="preview-bar" role="region" aria-label="预览外壳，不属于正式扩展界面">
    <div class="preview-identity"><strong>AI VIP Share</strong><span class="preview-tag">虚构数据 · 仅供评审</span></div>
    <label class="preview-scene" for="preview-scene">场景
      <select id="preview-scene">
        <option value="first">首次安装 · 无账号</option>
        <option value="empty">已绑定账号 · 无权益</option>
        <option value="unconfigured">会员服务未配置</option>
        <option value="error">会员服务连接异常</option>
        <option value="member">会员权益有效</option>
        <option value="expired">会员已到期</option>
        <option value="link">专属激活链接待确认</option>
        <option value="permission">缺少代理授权</option>
        <option value="proxy-on">代理已启用</option>
        <option value="conflict">代理控制权冲突</option>
        <option value="stop-pending">STOP 结果未知</option>
        <option value="session">网站会话待应用</option>
        <optgroup label="回归测试补充">
          <option value="redeem">兑换全流程</option><option value="quota">额度会员</option>
          <option value="guest">无账号</option><option value="offline">旧版未接入</option>
        </optgroup>
      </select>
    </label>
    <details id="preview-controls" class="preview-panel">
      <summary aria-label="展开演示场景设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/></svg>演示设置</summary>
      <div class="controls">
        <label class="control" for="preview-width">侧边栏宽度
          <select id="preview-width"><option>320</option><option>360</option><option selected>390</option><option>400</option><option>440</option><option>520</option></select>
        </label>
        <label class="control" for="preview-theme">外观
          <select id="preview-theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
        </label>
        <div class="control"><span>会员连接</span><button id="preview-member-failure" aria-pressed="false" type="button">模拟会员查询中断</button></div>
        <div class="control"><span>兑换输入</span><button id="preview-fill-code" type="button">填入体验激活码</button></div>
        <label class="control" for="preview-cookie">下一次 Cookie 回执
          <select id="preview-cookie"><option value="success">全部写入成功</option><option value="partial">部分成功</option><option value="unknown">结果未知</option></select>
        </label>
        <label class="control" for="preview-proxy">模拟代理状态
          <select id="preview-proxy"><option value="disabled">未启用</option><option value="enabled">已启用</option><option value="conflict">控制权冲突</option><option value="pending">STOP 待确认</option></select>
        </label>
        <div class="control" id="preview-release-wrap" hidden><span>模拟完成</span><button id="preview-release-stop" type="button">返回 STOP 回执</button></div>
      </div>
      <p id="preview-note" role="status" aria-live="polite">场景来自隔离数据。会员权益、Cookie 与代理操作均不涉及真实账号或浏览器设置。</p>
    </details>
  </div>
  <main class="stage" aria-label="与正式 React 相同的会员产品界面">
    <div class="frame" id="preview-frame">
      <div id="tool-root"><div id="tool-app"></div></div>
    </div>
  </main>
</div>
<script type="module" src="./main.jsx"></script>
</body>
</html>
