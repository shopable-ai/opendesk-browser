<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI VIP Share · 正式 React 同源预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f8;color:#202b3b;font:13px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}
.studio{max-width:830px;margin:0 auto;padding:16px;display:grid;gap:14px}
.toolbar{background:#fff;padding:12px 14px;border:1px solid #d9dfeb;border-radius:12px;display:grid;gap:9px}
.toolbar h1{font-size:14px;margin:0;font-weight:730}.toolbar p{margin:0;color:#60718a;font-size:12px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}select,.toolbar button{border:1px solid #d1d9e8;border-radius:8px;background:#fff;color:#23324a;padding:6px 10px;font:inherit;min-height:34px}
.toolbar button:focus-visible,select:focus-visible{outline:3px solid #7d8dec;outline-offset:2px}
.stage{display:grid;justify-items:center}.frame{width:min(var(--frame-width,390px),100%);min-width:0;overflow:hidden;border:1px solid #dce2ed;border-radius:14px;background:#fff;box-shadow:0 12px 32px #172c4b0e}
.frame #tool-root{min-width:0}.caption{font-size:12px;color:#687790}
@media(prefers-color-scheme:dark){body{background:#161a22;color:#d6dfec}.toolbar,.frame,.toolbar button,select{background:#252d39;color:#e8eef8;border-color:#3c4a5a}.toolbar p,.caption{color:#b9c6db}}
</style>
</head>
<body>
<div class="studio">
  <div class="toolbar" role="region" aria-label="只读交互预览控制台">
    <h1>AI VIP Share · 正式 React 同源预览</h1>
    <p>本页由正式 App.jsx 与原业务事务控制器构建。网络、Cookie、代理和账号均由本页隔离 Fixture 提供，不访问真实 Chrome 或商业服务。</p>
    <div class="controls">
      <label for="preview-width">宽度</label>
      <select id="preview-width"><option>320</option><option>360</option><option selected>390</option><option>400</option><option>440</option><option>520</option></select>
      <button id="preview-member" type="button">演示有效会员</button>
      <button id="preview-switch" type="button">切换分配 A/B</button>
      <label for="preview-cookie">Cookie 回执</label>
      <select id="preview-cookie"><option value="success">全部成功</option><option value="partial">部分成功</option><option value="unknown">结果未知</option></select>
      <label for="preview-proxy">代理</label>
      <select id="preview-proxy"><option value="disabled">未启用</option><option value="enabled">已启用</option><option value="conflict">控制权冲突</option><option value="pending">STOP 待确认</option></select>
      <button id="preview-release-stop" type="button" hidden>确认模拟 STOP</button>
    </div>
    <p id="preview-note" role="status" aria-live="polite">先在下方点击「连接本地开发」，再点击「演示有效会员」或输入 DEMO-VIP-01 按正式业务路径预检、确认。</p>
  </div>
  <div class="stage"><div class="frame" id="preview-frame"><div id="tool-root"><div id="tool-app"></div></div></div></div>
  <p class="caption">Source-bound fixture · 不执行真实安装、网络请求、Cookie 写入或代理启停。更改演示状态后，在产品内点击相应「刷新」查看最新服务端状态。</p>
</div>
<script type="module" src="./main.jsx"></script>
</body>
</html>
