<main class="notes-app od-page">
  <section id="note-confirm" class="note-confirm od-alert" role="alertdialog" aria-modal="true" aria-labelledby="note-confirm-message" hidden>
    <p id="note-confirm-message"></p>
    <div class="confirm-actions">
      <button id="note-confirm-cancel" type="button" class="od-button od-button--secondary">取消</button>
      <button id="note-confirm-accept" type="button" class="od-button od-button--danger">确定</button>
    </div>
  </section>
  <section id="notes-list-view" class="notes-view" aria-label="我的笔记">
    <div class="notes-heading od-page-head">
      <h2 class="od-page-title">我的笔记</h2>
      <span id="note-count" class="note-count od-technical" aria-live="polite">0 条</span>
      <button id="add-note" class="od-icon-button icon-button" type="button" title="新建笔记" aria-label="新建笔记">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="note-list" class="note-list" aria-label="已保存的笔记"></div>
    <p id="note-empty" class="note-empty od-note" hidden>还没有笔记。点击右上角的新建按钮开始记录。</p>
  </section>
  <section id="notes-edit-view" class="notes-view" aria-label="笔记编辑" hidden>
    <div class="edit-heading od-page-head">
      <h2 id="editor-title" class="od-page-title">新建笔记</h2>
      <span id="editor-unsaved" class="editor-unsaved od-technical" hidden>未保存</span>
      <button id="back-to-notes" class="od-icon-button icon-button" type="button" title="关闭编辑，返回笔记列表" aria-label="关闭编辑，返回笔记列表">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <section class="editor" aria-label="离线笔记编辑器">
    <textarea id="note-text" class="od-field" rows="8" maxlength="8192" placeholder="记录想法、摘录或待办…" aria-label="笔记内容"></textarea>
    <div class="editor-actions">
      <label class="page-attach" for="attach-page"><input id="attach-page" type="checkbox">关联当前网页</label>
      <span class="action-spacer"></span>
      <button id="delete-note" class="od-icon-button od-icon-button--danger icon-button" type="button" title="删除当前笔记" aria-label="删除当前笔记" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 4h4m-8 3 1 13h10l1-13M10 11v5m4-5v5"/></svg>
      </button>
      <button id="save-note" class="od-icon-button od-icon-button--primary icon-button" type="button" title="保存笔记" aria-label="保存笔记">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3h2Zm2 0v7h10V3M7 21v-8h10v8"/></svg>
      </button>
    </div>
    <p id="note-attachment" class="note-attachment od-note" hidden></p>
  </section>
  </section>
  <p id="note-status" class="od-note" role="status" aria-live="polite" hidden></p>
  <div class="notes-footer">
    <details class="page-context od-disclosure od-disclosure--flat">
      <summary><span class="page-caption">当前网页</span><span id="page-summary" class="page-summary od-technical">正在读取网页…</span></summary>
      <div class="page-details">
        <p id="page-url" class="page-url od-technical" hidden></p>
        <button id="refresh-page" class="od-icon-button icon-button" type="button" title="更新网页信息" aria-label="更新网页信息">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.7L3 9m0-5v5h5M4 13a8 8 0 0 0 14.5 4.7L21 15m0 5v-5h-5"/></svg>
    </button>
      </div>
    </details>
    <details class="task-shortcut od-disclosure od-disclosure--flat">
    <summary>高级操作</summary>
    <div class="task-row">
      <label class="visually-hidden" for="task-name">任务 ID</label>
      <input id="task-name" class="od-field" type="text" maxlength="60" placeholder="已安装的任务 ID" aria-label="已安装的任务 ID">
      <button id="open-task" class="od-icon-button icon-button" type="button" title="打开任务（不会自动运行）" aria-label="打开任务（不会自动运行）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6m0-6-9 9M19 13v6H5V5h6"/></svg>
      </button>
    </div>
  </details>
  </div>
</main>
