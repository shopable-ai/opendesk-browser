<section class="csv-demo" aria-label="CSV 导出演示">
  <h2>产品数据</h2>
  <p class="intro">使用官方 Papa Parse 5.7.0 导出，不访问网页或 CDN。</p>
  <div class="table-wrap"><table id="csv-table">
    <thead><tr><th scope="col">商品</th><th scope="col">价格</th><th scope="col">编号</th></tr></thead>
    <tbody><tr><td>Book</td><td>18</td><td>0000123456789012345</td></tr>
      <tr><td>Pen</td><td>3</td><td>0000002</td></tr>
      <tr><td>苹果, &quot;Pro&quot;</td><td>5</td><td>0000003</td></tr>
      <tr><td>=1+2</td><td>0</td><td>0000004</td></tr></tbody>
  </table></div>
  <button id="csv-export" type="button">导出 CSV</button>
  <p id="csv-status" role="status" aria-live="polite">点击导出后，请在可信侧边栏确认本次保存。</p>
  <p class="hint">CSV 为文本格式；Excel 可能重新识别长编号、日期及前导零。</p>
</section>
