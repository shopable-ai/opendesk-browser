<main class="mdw od-page" aria-label="Markdown 工作台">
  <header class="mdw-toolbar od-toolbar" aria-label="文件操作">
    <div class="mdw-file-actions od-toolbar">
      <button type="button" id="mdw-import" class="od-icon-button" title="导入 Markdown" aria-label="导入 Markdown"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></svg></button>
      <input id="mdw-file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden aria-label="选择 Markdown 文件">
      <button type="button" id="mdw-copy" class="od-icon-button" title="复制 Markdown 原文" aria-label="复制 Markdown 原文"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
    </div>
    <button type="button" id="mdw-download" class="od-button" title="请求浏览器下载 Markdown 文件">下载 .md</button>
    <details class="mdw-menu od-disclosure od-disclosure--flat">
      <summary aria-label="更多文件操作">更多</summary>
      <div class="mdw-menu-actions"><button type="button" id="mdw-clear" class="od-button od-button--danger" title="清空全部内容">清空编辑区</button></div>
    </details>
  </header>
  <div id="mdw-inline-review" class="mdw-inline-review" role="group" aria-label="内容替换确认" hidden>
    <p id="mdw-review-text"></p>
    <div class="mdw-inline-review-actions od-toolbar">
      <button type="button" id="mdw-review-cancel" class="od-button od-button--secondary">取消</button>
      <button type="button" id="mdw-review-confirm" class="od-button od-button--danger">继续操作</button>
    </div>
  </div>
  <div class="mdw-modes" role="group" aria-label="编辑视图">
    <button type="button" class="od-button od-button--secondary" data-mode="edit" aria-pressed="true">编辑</button>
    <button type="button" class="od-button od-button--quiet" data-mode="preview" aria-pressed="false">预览</button>
    <button type="button" class="od-button od-button--quiet" data-mode="split" aria-pressed="false">分栏</button>
  </div>
  <div class="mdw-panes" id="mdw-panes" data-mode="edit">
    <section class="mdw-pane mdw-edit" aria-label="Markdown 编辑">
      <label class="od-field-label mdw-pane-title" for="mdw-source">Markdown</label>
      <textarea id="mdw-source" class="od-field" spellcheck="false" placeholder="# 写下标题&#10;&#10;粘贴或导入 Markdown，预览会自动更新。"></textarea>
    </section>
    <section class="mdw-pane mdw-result" aria-label="安全预览">
      <h2 class="od-field-label mdw-pane-title">预览</h2>
      <div class="mdw-preview" id="mdw-preview" role="document" aria-label="Markdown 安全预览"></div>
    </section>
  </div>
  <p class="mdw-status" id="mdw-status" role="status" aria-live="polite">仅当前会话编辑；离开前请下载文件。</p>
  <span class="mdw-save-state" id="mdw-state" aria-live="polite">尚未下载</span>
</main>
