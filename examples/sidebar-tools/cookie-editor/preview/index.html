.ced42 .io-head {display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}

.ced42 .io-panel .field input[type=file]{padding:7px;min-width:0;background:var(--white)}

.ced42 .io-panel .io-confirm{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--blue-bg);display:grid;gap:8px}
.ced42 .io-panel .io-confirm .foot{justify-content:flex-start}
.ced42 .io-panel .io-help{color:var(--sub);font-size:11px;line-height:1.55}
.ced42 .io-panel .io-file-preview{font-size:10.5px;color:var(--sub);overflow-wrap:anywhere}
@media(max-width:319px){.ced42 .heading strong{font-size:12px}.ced42 .heading .actions .icon{width:31px;height:33px}.ced42 .heading .actions{gap:0}}

/* R4.6: modest refinements on the approved R4.3 visual design, not a redesign. */
.ced42 .scenarios{border:1px dashed #cbd7ed;background:#eaf0fb88;border-radius:12px;padding:10px;max-width:650px;margin:0 auto 16px}
.ced42 .scenarios [data-lab]{border-style:dashed}
.ced42 .site-select{width:100%;min-width:0}

@media(max-width:370px){.ced42 .heading .actions{gap:0}.ced42 .heading .actions .icon{width:32px}.ced42 .site{gap:7px;padding:9px}.ced42 .site-logo{width:30px;height:30px}}

<body>
<div class="ced42" id="ced42">
 <div class="show-title">Cookie Editor · 交互预览 R4.6</div>

 <div class="footer-note">仅虚构 Cookie 与模拟授权；顶部返回栏属于预览外壳，正式扩展中不得重复绘制宿主标题、返回按钮。</div>
</div>
<script>
(() => {'use strict';
 const root=document.getElementById('ced42'),panel=document.getElementById('ce-panel'),content=document.getElementById('ce-content');
 const icons={back:'<path d="m15 18-6-6 6-6"/>',refresh:'<path d="M20 11a8 8 0 0 0-14.5-4.8L3 9m0-5v5h5M4 13a8 8 0 0 0 14.5 4.7L21 15m0 5v-5h-5"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c4 4 4 14 0 18M12 3c-4 4-4 14 0 18"/>',down:'<path d="m6 9 6 6 6-6"/>',check:'<path d="m4 12 5 5L20 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',fileUp:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M12 18V11m-3 3 3-3 3 3"/>',fileDown:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M12 11v7m-3-3 3 3 3-3"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',filter:'<path d="M4 7h16M7 12h10M10 17h4"/>',delete:'<path d="M4 7h16M9 7V4h6v3m-9 0 1 14h10l1-14M10 11v6m4-6v6"/>',eye:'<path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>',eyeOff:'<path d="m3 3 18 18M9.8 6.2A13 13 0 0 1 12 6c6 0 10 6 10 6a18 18 0 0 1-3.4 3.6M6.3 6.9C3.7 8.7 2 12 2 12s4 6 10 6c1 0 2-.2 2.9-.5"/>',shield:'<path d="M12 2 4 5v6c0 5 3 8 8 11 5-3 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v5m0-9h.01"/>',x:'<path d="M6 6 18 18M18 6 6 18"/>'};

    else if(S.scenario==='empty'){S.rows=S.emptyRestoreRows||fake();S.emptyRestoreRows=null;}

    if(scene!=='blocked'){

 function ioPanel(){if(!S.io)return '';const uploading=S.io==='import';let common=`<section class="io-panel" aria-label="${uploading?'导入':'导出'} Cookie 操作区"><div class="io-head"><strong>${uploading?'导入到 '+esc(S.site):'从 '+esc(S.site)+' 导出'}</strong>${iconBtn('x','closeIO','关闭'+(uploading?'导入':'导出'))}</div>`;

 function previewImport(){S.ioError='';S.ioPreview=null;S.ioRows=null;try{const raw=S.ioText.trim();if(!raw)throw Error('请选择文件或粘贴内容');if(new Blob([raw]).size>150000)throw Error('导入文件不能超过 150 KB');let format=S.ioImportFormat;if(format==='auto'){format=/^[\[{]/.test(raw)?'json':raw.split(/\r?\n/).some(x=>x.split('\t').length===7)?'netscape':'header';}let rows=[];
 if(format==='json'){const value=JSON.parse(raw);rows=Array.isArray(value)?value:value?.cookies;if(!Array.isArray(rows))throw Error('JSON 必须为 Cookie 数组或包含 cookies 数组的对象');}
 else if(format==='header'){rows=raw.replace(/^Cookie:\s*/i,'').split(';').filter(Boolean).map(pair=>{const i=pair.indexOf('=');if(i<1)throw Error('Cookie Header 格式无效');return {name:pair.slice(0,i).trim(),value:pair.slice(i+1).trim(),domain:S.site,path:'/'}})}

 if(!rows.length||rows.length>10)throw Error('真实浏览器每批限 1–10 条');const seen=new Set();rows=rows.map(row=>{if(typeof row.name!=='string'||!row.name.trim()||typeof row.value!=='string'||typeof row.domain!=='string'||typeof row.path!=='string'||!row.path.startsWith('/'))throw Error('存在格式不正确的 Cookie');if(row.domain.replace(/^\./,'')!==S.site)throw Error('导入范围不能跨越当前网站');if(row.partitioned||row.partitionKey)throw Error('分区 Cookie 导入需精确 PartitionKey；本预览拒绝隐式降级，请使用可信 Chrome 工具');const key=row.name+'|'+row.domain+'|'+row.path;if(seen.has(key))throw Error('导入文件存在重复 Cookie');seen.add(key);return {name:row.name,domain:row.domain,path:row.path,value:row.value,secure:Boolean(row.secure),httpOnly:Boolean(row.httpOnly),session:Boolean(row.session),sameSite:row.sameSite||'Lax',partitioned:false};});
 const replaced=rows.filter(r=>S.rows.some(c=>!c.partitioned&&c.name===r.name&&c.domain===r.domain&&c.path===r.path)).length;S.ioRows=rows;S.ioPreview={total:rows.length,created:rows.length-replaced,replaced,conflictText:replaced?'将覆盖 '+rows.filter(r=>S.rows.some(c=>!c.partitioned&&c.name===r.name&&c.domain===r.domain&&c.path===r.path)).map(r=>r.name+' ('+r.path+')').join('、'):''};}catch(e){S.ioError=e?.message||'预览失败';}renderKeepScroll();}
 function applyImport(){if(!S.ioRows||!S.ioPreview){S.ioError='请先预览导入';renderKeepScroll();return;}if(!grants().write){S.ioConfirm='write';renderKeepScroll();return;}let done=0;for(const r of S.ioRows){const old=S.rows.find(c=>!c.partitioned&&c.name===r.name&&c.domain===r.domain&&c.path===r.path);const candidate={...r,id:old?.id||Math.max(0,...S.rows.map(c=>c.id))+1};if(old)S.rows=S.rows.map(c=>c.id===old.id?candidate:c);else S.rows.unshift(candidate);done++;}S.io=null;S.ioRows=null;S.ioPreview=null;S.ioText='';notify('已更新 '+done+' 条模拟 Cookie；未写入真实 Chrome');}
 function runExport(){S.ioError='';if(S.ioFormat!=='json'&&!S.includeValues){S.ioError='Cookie Header 与 Netscape 必须包含 Cookie 值，或改用 JSON 元数据格式';renderKeepScroll();return;}if(S.includeValues&&!grants().values){S.ioConfirm='values';renderKeepScroll();return;}if(S.includeValues){S.ioConfirm='export';renderKeepScroll();return;}downloadExport();}
 function downloadExport(){const cookies=scoped();let value='';let file='json';if(S.ioFormat==='json'){value=JSON.stringify(cookies.map(c=>S.includeValues?c:({...c,value:undefined,valueRedacted:true})),null,2)+'\n';}else if(S.ioFormat==='header'){value=cookies.map(c=>c.name+'='+c.value).join('; ')+'\n';file='txt';}else{if(cookies.some(c=>c.partitioned)){S.ioError='Netscape 不支持分区 Cookie；请使用 JSON 保留分区字段';renderKeepScroll();return;}value='# Netscape HTTP Cookie File\n'+cookies.map(c=>[c.domain,c.domain.startsWith('.')?'TRUE':'FALSE',c.path,c.secure?'TRUE':'FALSE',c.session?'0':'1799000000',c.name,c.value].join('\t')).join('\n')+'\n';file='txt';}const blob=new Blob([value],{type:file==='json'?'application/json':'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=S.site+'-fictional-'+(S.includeValues?'cookies':'metadata')+'.'+file;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);S.ioError='';S.ioConfirm=null;notify('已下载虚构演示数据文件；未读取真实 Chrome Cookie');}
 function list(){const rows=scoped().filter(c=>(!S.query||[c.name,c.domain,c.path].some(t=>t.toLowerCase().includes(S.query.toLowerCase())))&&(S.filter==='all'||c[S.filter])).sort((a,b)=>{const x=S.sort==='domain'?a.domain+a.path:S.sort==='secure'?(a.secure?'0':'1'):a.name;const y=S.sort==='domain'?b.domain+b.path:S.sort==='secure'?(b.secure?'0':'1'):b.name;return (S.sortReverse?-1:1)*String(x).localeCompare(String(y),'zh-CN')});return `${siteHeader()}${S.menuOpen?`<div class="menu"><button data-action="permissions">网站授权状态</button><button data-action="clear">安全清理本站</button><button data-action="observe">观察 Cookie 变化</button></div>`:''}<div class="heading"><strong>Cookie 列表 <span>(${rows.length})</span></strong><div class="actions">${iconBtn('fileUp','import','导入 Cookie 到当前网站')}${iconBtn('fileDown','export','导出当前网站 Cookie')}<span class="action-divider" aria-hidden="true"></span>${iconBtn('plus','new','新建 Cookie')}</div></div>${ioPanel()}<div class="search-area"><div class="search-wrap">${svg('search')}<input data-field="search" type="search" aria-label="搜索 Cookie" autocomplete="off" value="${esc(S.query)}" placeholder="搜索 Cookie 名称或域名"/></div>${iconBtn('filter','showFilter','筛选 Cookie')}</div>${S.filterOpen?filters():''}<div class="list">${S.expanded==='new'?`<article class="item expanded"><div class="item-summary"><span class="item-name">新建 Cookie</span></div>${editor()}</article>`:''}${S.expanded!==null&&S.expanded!=='new'&&!rows.some(r=>r.id===S.expanded)&&current()?`<p class="hint" style="padding:8px 12px 0">正在编辑的条目保持显示，不受当前筛选影响</p>${row(current())}`:''}${rows.length?rows.map(row).join(''):`<div class="empty">没有匹配的 Cookie</div>`}</div><p class="hint">点击条目可直接展开修改；一次只编辑一条。敏感值默认隐藏。</p>`;}
 function infoPage(type){const g=grants();if(type==='permissions')return `${siteHeader()}<div class="heading"><strong>本站授权</strong></div>${[['read','查看 Cookie'],['write','新增、编辑、删除'],['values','读取敏感值'],['observe','变化观察'],['clear','安全清理']].map(([cap,label])=>`<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);min-height:47px;gap:8px"><div>${label}<div class="muted">仅此网站及当前工具</div></div><button class="btn" data-action="toggleGrant" data-cap="${cap}">${g[cap]?'撤销':'授权'}</button></div>`).join('')}<p class="hint">撤销 Cookie Editor 工具级授权不应影响其他工具的 Chrome 权限。</p><button class="btn" data-action="backFromInfo">返回列表</button>`;
 return `${siteHeader()}<div class="heading"><strong>${esc(type)}</strong></div><p class="hint">次级工具在正式实现中使用现有 SDK，保持实际导入、导出、清理和观察流程，不在主列表叠加复杂按钮。</p><button class="btn" data-action="backFromInfo">返回列表</button>`;}
 function render(restoreY){panel.classList.toggle('dark',S.dark);panel.querySelector('[data-action="back"]').innerHTML=svg('back');panel.querySelector('[data-action="refresh"]').innerHTML=svg('refresh');panel.querySelector('[data-action="menu"]').innerHTML=svg('more');content.innerHTML=!S.chrome||S.site==='chrome://' ? grantPanel(true) : !grants().read ? grantPanel() : S.info?infoPage(S.info):list();root.querySelectorAll('[data-scene]').forEach(b=>{const sel=b.dataset.scene==='dark'?S.dark:b.dataset.scene===S.scenario;b.classList.toggle('is-current',sel);if(b.dataset.scene==='dark')b.setAttribute('aria-pressed',String(S.dark));});root.querySelectorAll('[data-lab="saveFailure"]').forEach(b=>{b.classList.toggle('is-current',S.simulateSaveFailure);b.setAttribute('aria-pressed',String(S.simulateSaveFailure));});const toast=panel.querySelector('.toast');if(toast)toast.remove();if(S.toast)panel.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${esc(S.toast)}</div>`);if(typeof restoreY==='number')document.getElementById('ce-scroll').scrollTop=restoreY;}
 function notify(msg){S.toast=msg;render();}
 function requestSwitch(next){if(hasChanges()){S.confirm='discard';S.pending=next;renderKeepScroll();return;}next();}
 function renderKeepScroll(){const scroll=document.getElementById('ce-scroll');render(scroll.scrollTop)}
 function expand(id){if(S.io)S.io=null;if(S.expanded===id){if(hasChanges()){S.confirm='discard';S.pending=()=>{setExpanded(null);renderKeepScroll()};renderKeepScroll();return;}setExpanded(null);}else{if(hasChanges()){S.confirm='discard';S.pending=()=>{setExpanded(id);renderKeepScroll()};renderKeepScroll();return;}setExpanded(id);}S.toast='';renderKeepScroll();}
 function save(){const d=S.draft,c=current();if(!d?.name?.trim()||!d?.domain?.trim()||!d?.path?.startsWith('/')){notify('请正确填写名称、域名和以 / 开头的路径');return;}if(!hasChanges()){setExpanded(null);notify('未修改任何内容，无需写入');return;}if(!grants().write){S.confirm='grantWrite';renderKeepScroll();return;}if(S.expanded!=='new'&&!S.valueEdited&&!grants().values){S.confirm='grantValues';renderKeepScroll();return;}S.confirm=S.expanded!=='new'&&d.name!==c.name?'renameWrite':'save';renderKeepScroll();}
 function applySave(){const old=current(),d=S.draft;if(S.expanded==='new'){const row={...d,id:Math.max(0,...S.rows.map(c=>c.id))+1,partitioned:false};S.rows.unshift(row);}else{S.rows=S.rows.map(c=>c.id===S.expanded?{...c,...d,value:S.valueEdited?d.value:old.value}:c);}setExpanded(null);notify('虚构数据已更新并完成模拟回读');}
 function doAction(action,el){S.toast='';switch(action){case'grantFull':{const g=grants();g.read=true;g.write=true;S.scenario='ready';notify('已获得本网站查看与编辑权限');break;}case'grantRead':{grants().read=true;S.scenario='readonly';notify('已授权查看，编辑可在保存时再授权');break;}case'useSite':{const site=el.dataset.site;requestSwitch(()=>{S.site=site;S.chrome=site!=='chrome://';S.siteOpen=false;S.info=null;S.query='';S.filter='all';setExpanded(null);S.scenario=S.chrome?'first':'blocked';renderKeepScroll()});break;}case'site':S.siteOpen=!S.siteOpen;renderKeepScroll();break;case'expand':expand(Number(el.dataset.id));break;case'new':requestSwitch(()=>{S.io=null;S.ioRows=null;S.ioPreview=null;expand('new');});break;case'cancelEdit':setExpanded(null);notify('编辑已取消，未保存任何修改');break;case'save':save();break;case'delete':S.confirm=grants().write?'delete':'grantWrite';S.pending='delete';renderKeepScroll();break;case'cancelConfirm':S.confirm=null;S.pending=null;renderKeepScroll();break;
 case'grantWriteConfirm':grants().write=true;S.confirm=null;if(S.pending==='delete'){S.confirm='delete';S.pending=null;renderKeepScroll();break;}save();break;
 case'grantValuesConfirm':grants().values=true;if(S.confirm==='revealValue'){S.shown=true;S.confirm=null;renderKeepScroll();break;}S.confirm=null;save();break;
 case'resetValue':if(S.expanded!==null&&S.expanded!=='new'&&S.draft){S.draft.value='';S.valueEdited=false;S.saveError='';S.confirm=null;renderKeepScroll();}break;case'reveal':{if(S.shown){S.shown=false;renderKeepScroll();break;}if(grants().values){S.shown=true;renderKeepScroll();break;}S.confirm='revealValue';renderKeepScroll();break;}
 case'commit':if(S.simulateSaveFailure){S.simulateSaveFailure=false;S.confirm=null;S.saveError='模拟写入失败：网络或权限暂时不可用。草稿已保留，请检查后重试。';renderKeepScroll();}else applySave();break;case'renameWrite':S.confirm='renameRemove';renderKeepScroll();break;
 case'commitDelete':{const id=S.expanded;S.rows=S.rows.filter(c=>c.id!==id);setExpanded(null);notify('已从虚构数据中精确删除 Cookie');break;}
 case'discardConfirm':{const next=S.pending;S.confirm=null;S.pending=null;if(typeof next==='function')next();else{setExpanded(null);renderKeepScroll()}break;}
 case'showFilter':S.filterOpen=!S.filterOpen;renderKeepScroll();break;case'filter':S.filter=el.dataset.filter;renderKeepScroll();break;case'sortDirection':S.sortReverse=!S.sortReverse;renderKeepScroll();break;
 case'menu':S.menuOpen=!S.menuOpen;renderKeepScroll();break;
 case'permissions':case'clear':case'observe':requestSwitch(()=>{setExpanded(null);S.info=action==='permissions'?'permissions':{import:'导入 Cookie',export:'导出 Cookie',clear:'安全清理本站',observe:'观察 Cookie 变化'}[action];S.menuOpen=false;renderKeepScroll()});break;
 case'import':case'export':requestSwitch(()=>{setExpanded(null);S.io=action;S.ioError='';S.ioConfirm=null;S.ioPreview=null;S.ioRows=null;S.ioText='';S.ioImportFormat='auto';S.ioFormat='json';S.includeValues=false;S.menuOpen=false;renderKeepScroll();});break;
 case'closeIO':S.io=null;S.ioRows=null;S.ioPreview=null;S.ioError='';S.ioConfirm=null;renderKeepScroll();break;
 case'previewImport':previewImport();break;
 case'applyImport':applyImport();break;
 case'cancelIOConfirm':S.ioConfirm=null;renderKeepScroll();break;
 case'allowImportWrite':grants().write=true;S.ioConfirm=null;applyImport();break;
 case'runExport':runExport();break;case'confirmExport':if(S.ioConfirm==='export'&&grants().values){S.ioConfirm=null;downloadExport();}break;
 case'allowExportValues':grants().values=true;S.ioConfirm=null;runExport();break;
 case'backFromInfo':S.info=null;renderKeepScroll();break;
 case'toggleGrant':{const cap=el.dataset.cap,g=grants();g[cap]=!g[cap];if(cap==='read'&&!g.read){g.values=false;g.write=false;}setExpanded(null);notify('已更新本站 '+cap+' 工具权限');break;}
 case'back':requestSwitch(()=>{S.info=null;setExpanded(null);notify('演示：返回「工具」列表')});break;
 case'refresh':requestSwitch(()=>{setExpanded(null);S.shown=false;notify('演示数据已刷新')});break;
 default:break;}}
 root.addEventListener('click',e=>{const btn=e.target.closest('[data-action],[data-scene],[data-lab]');if(!btn||!root.contains(btn))return;if(btn.dataset.lab==='saveFailure'){S.simulateSaveFailure=!S.simulateSaveFailure;renderKeepScroll();return;}if(btn.dataset.scene){const stage=btn.dataset.scene;if(stage==='dark'){S.dark=!S.dark;renderKeepScroll();}else requestSwitch(()=>setScene(stage));return;}doAction(btn.dataset.action,btn);});
 function updateField(el){const name=el.dataset.edit;if(!name)return;if(!S.draft)return;S.draft[name]=el.type==='checkbox'?el.checked:el.value;if(name==='value'&&S.expanded!=='new')S.valueEdited=true;S.confirm=null;S.saveError='';}
 root.addEventListener('input',e=>{const t=e.target;if(t.dataset.edit){updateField(t);return;}if(t.dataset.field==='importText'){S.ioText=t.value;S.ioRows=null;S.ioPreview=null;S.ioError='';return;}if(t.dataset.field==='search'){const pos=t.selectionStart,Sy=document.getElementById('ce-scroll').scrollTop;S.query=t.value;render(Sy);const target=content.querySelector('[data-field="search"]');target.focus();try{target.setSelectionRange(pos,pos)}catch{}}});
 root.addEventListener('change',async e=>{const t=e.target;if(t.dataset.edit){updateField(t);return;}if(t.dataset.field==='importFormat'){S.ioImportFormat=t.value;S.ioPreview=null;S.ioRows=null;renderKeepScroll();return;}if(t.dataset.field==='sort'){S.sort=t.value;renderKeepScroll();return;}if(t.dataset.field==='exportFormat'){S.ioFormat=t.value;S.ioConfirm=null;renderKeepScroll();return;}if(t.dataset.field==='exportValues'){S.includeValues=t.checked;S.ioConfirm=null;renderKeepScroll();return;}if(t.dataset.field==='importFile'){const f=t.files?.[0];if(!f)return;if(f.size>150000){S.ioError='文件不能超过 150 KB';renderKeepScroll();return;}S.ioText=await f.text();S.ioPreview=null;S.ioRows=null;S.ioError='';if(f.name.toLowerCase().endsWith('.json'))S.ioImportFormat='json';renderKeepScroll();}});
 root.addEventListener('toggle',e=>{if(e.target.matches?.('details.more'))S.advancedOpen=e.target.open;},true);
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.confirm){S.confirm=null;S.pending=null;renderKeepScroll();}else if(e.key==='Escape'&&S.ioConfirm){S.ioConfirm=null;renderKeepScroll();}});
 setScene('ready');
})();
</script>
</body></html>
