<main class="capture-app" aria-label="scrapyjs 采集">
  <section aria-labelledby="target-heading">
    <div class="toolbar"><h2 id="target-heading">当前网页</h2><button id="refresh-target" type="button">刷新目标</button></div>
    <p id="page-title" class="secondary">正在读取当前网页…</p>
    <label for="target-url">目标 URL</label>
    <input id="target-url" type="url" autocomplete="off" aria-describedby="target-help">
    <p id="target-help" class="secondary">仅允许当前可信目标同源 URL，导航还需任务 siteOrigins 批准。</p>
  </section>
  <section aria-labelledby="config-heading">
    <div class="toolbar"><h2 id="config-heading">采集配置</h2><button id="save-config" type="button">保存配置</button></div>
    <label for="config-json">JSON 配置</label>
    <textarea id="config-json" spellcheck="false" rows="10" aria-describedby="config-help config-error"></textarea>
    <p id="config-help" class="secondary">完整参数包含 url、itemConfig，可选 waitForSelector、timeoutMs。_listContainer / _listItem 定义列表；.::text 读取当前项文本。itemConfig 序列化后最多 4096 字节。</p>
    <p id="config-error" role="alert" hidden></p>
    <div id="conflict" hidden>
      <p>保存版本与草稿冲突。草稿仍保留，请先复制需要的内容再选择。</p>
      <button id="load-config" type="button">读取保存版本</button>
      <button id="use-saved" type="button" hidden>用保存版本替换草稿</button>
    </div>
    <div class="toolbar actions"><button id="start" class="primary" type="button">开始采集</button><button id="stop" type="button" disabled>停止原实例</button></div>
  </section>
  <section aria-labelledby="result-heading">
    <div class="toolbar"><h2 id="result-heading">运行结果</h2><button id="refresh-run" type="button">刷新状态</button></div>
    <dl class="status-grid" aria-live="polite">
      <dt>宿主</dt><dd id="host-status">尚未连接</dd>
      <dt>引擎</dt><dd id="engine-status">尚未运行</dd>
      <dt>停止受理</dt><dd id="stop-status">未请求</dd>
      <dt>实例退休</dt><dd id="retired-status">尚无运行</dd>
    </dl>
    <p id="app-error" role="alert" hidden></p><p id="app-notice" role="status" hidden></p>
    <pre id="result" tabindex="0" aria-label="真实任务结果">尚无结果</pre>
    <div class="toolbar"><button id="download-json" type="button" disabled>下载完整 JSON</button><button id="download-csv" type="button" disabled>下载 CSV</button></div>
  </section>
</main>
