<!doctype html>
<html lang="zh-CN" data-demo-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页剪藏 · 正式 UI 演示舞台 · 模拟数据</title>
<link rel="stylesheet" href="../src/style.css">
<style>
html[data-demo-theme=dark] body{color:#e1e6f2}
html[data-demo-theme=dark] .clip{--edge:#39435b;--sub:#a0adc3;--paper:#202633;--layer:#171e29}
html[data-demo-theme=dark] .clip button.primary{background:#4568d4;border-color:#4568d4}
html[data-demo-theme=dark] .clip-actions button[aria-pressed=true]{background:#314269;border-color:#5368a3;color:#d8e3ff}
html[data-demo-theme=dark] .clip-preview pre{background:#2a3547}
html[data-demo-theme=dark] .clip-preview a{color:#9bbaff}
html[data-demo-theme=light] body{color:#233047}
html[data-demo-theme=light] .clip{--edge:#dde5f1;--sub:#69788f;--paper:#fff;--layer:#f7f9fd}
html[data-demo-theme=light] .clip button.primary{background:#335bd0;border-color:#335bd0}
html[data-demo-theme=light] .clip-actions button[aria-pressed=true]{background:#eaf1ff;border-color:#b9c9f2;color:#2c56b7}
html[data-demo-theme=light] .clip-preview pre{background:#e9eff8}
html[data-demo-theme=light] .clip-preview a{color:#3159b9}


/* Demo-only theme and iframe zoom. Installed CSS owns all product layout. */
body{--opendesk-host-available-height:calc(100dvh / var(--preview-zoom,1))}
html[data-demo-theme=dark] .clip-note-card{background:var(--layer)}

</style>
</head>
<body>
<main class="clip" aria-label="网页剪藏">
<svg class="clip-icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
 <symbol id="clip-i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
 <symbol id="clip-i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
 <symbol id="clip-i-list" viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></symbol>
 <symbol id="clip-i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4z"/></symbol>
 <symbol id="clip-i-trash-2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 10v7"/><path d="M14 10v7"/></symbol>
 <symbol id="clip-i-refresh-cw" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.4L3 9"/><path d="M3 3v6h6"/><path d="M4 13a8 8 0 0 0 14.6 4.4L21 15"/><path d="M15 15h6v6"/></symbol>
 <symbol id="clip-i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
 <symbol id="clip-i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 17v4h14v-4"/></symbol>
 <symbol id="clip-i-save" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v6h10V3"/><path d="M7 21v-8h10v8"/></symbol>
 <symbol id="clip-i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
 <symbol id="clip-i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6.5 7.5V20l-3-2v-5.5L4 5z"/></symbol>
 <symbol id="clip-i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
 <symbol id="clip-i-code-2" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4"/><path d="m16 8 4 4-4 4"/><path d="m14 4-4 16"/></symbol>

</svg>
<header class="clip-head">
 <div class="clip-brand"><strong>网页剪藏</strong><span id="clip-site" aria-live="polite">当前网页</span></div>
 <button type="button" id="clip-my-notes" class="clip-outline" hidden tabindex="-1" aria-hidden="true">我的摘录 · 0</button>
</header>
<section id="clip-home" aria-label="当前网页摘录">
<p id="clip-title" class="clip-page-title">打开网页，提取文章或选中文字</p>
<div class="clip-modes" role="group" aria-label="剪藏范围">
 <button type="button" data-clip-mode="article" aria-pressed="true">文章</button>
 <button type="button" data-clip-mode="selection" aria-pressed="false">选区</button>
 <button type="button" data-clip-mode="quote" aria-pressed="false">引用</button>
 <button type="button" data-clip-mode="link" aria-pressed="false">链接</button>
</div>
<button type="button" id="clip-fetch" class="primary clip-fetch" aria-label="提取当前文章">提取当前文章</button>
<p id="clip-selection-hint" class="clip-hint">也可在网页选中文字后，右键选择「保存选中内容到我的摘录」；完成安装审阅后即可使用；设置仅用于主动停用或恢复。</p>
<div class="clip-actions" role="toolbar" aria-label="显示方式">
 <button type="button" id="clip-show-preview" aria-pressed="true"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-eye"></use></svg>预览</button>
 <button type="button" id="clip-show-source" aria-pressed="false"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-code-2"></use></svg>Markdown</button>
 <span class="clip-spacer"></span>
 <details class="clip-settings"><summary><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-settings-2"></use></svg>更多设置</summary>
  <label for="clip-meta">来源格式</label>
  <select id="clip-meta" aria-label="来源信息格式">
   <option value="footer">文末链接</option><option value="yaml">YAML Front Matter</option><option value="none">不添加</option>
  </select>
 </details>
</div>
<textarea id="clip-source" spellcheck="false" readonly hidden aria-label="剪藏的 Markdown 源码" placeholder="请先提取当前网页内容"></textarea>
<div id="clip-preview" class="clip-preview" role="document" aria-label="Markdown 只读预览"></div>
<div class="clip-export" role="group" aria-label="摘录操作">
 <button type="button" id="clip-save" class="primary" disabled><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-save"></use></svg>保存摘录</button>

 <button type="button" id="clip-download" aria-label="下载 Markdown" title="下载为本地 .md 文件"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-download"></use></svg>下载 .md</button>
</div>

 </div>

</section>
</section>
<section id="clip-notes" aria-label="我的摘录" data-view="list" hidden>
 <div class="clip-notes-head" id="clip-notes-head">
  <button type="button" id="clip-notes-back" class="clip-outline clip-icon-button" aria-label="返回网页剪藏" title="返回网页剪藏"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-arrow-left"></use></svg></button>
  <strong>我的摘录</strong>
  <button type="button" id="clip-note-new" class="primary clip-icon-button" aria-label="新建便签" title="新建便签"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-plus"></use></svg></button>
 </div>
 <div class="clip-notes-tools" id="clip-notes-tools">
  <label class="clip-search-wrap"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-search"></use></svg><input type="search" id="clip-search" placeholder="搜索文字或来源" aria-label="搜索我的摘录"></label>
  <label class="clip-filter-wrap"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-filter"></use></svg><select id="clip-kind-filter" aria-label="筛选摘录类型"><option value="all">全部</option><option value="clip">网页</option><option value="note">便签</option></select></label>
  <button type="button" id="clip-note-reload" class="clip-outline clip-icon-button" title="刷新摘录" aria-label="刷新摘录"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-refresh-cw"></use></svg></button>
 </div>
 <div class="clip-notes-meta" id="clip-notes-meta"><span id="clip-note-count">0 条已保存</span><button type="button" id="clip-note-backup" class="clip-link"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-archive"></use></svg>导出备份</button></div>
 <section id="clip-note-editor" class="clip-note-editor" aria-label="编辑摘录" hidden>
  <div class="clip-editor-head">
   <button type="button" id="clip-note-editor-back" class="clip-outline clip-icon-button" aria-label="返回摘录" title="返回摘录"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-arrow-left"></use></svg></button>
   <strong id="clip-note-editor-title">新建便签</strong>
  </div>
  <textarea id="clip-note-body" rows="5" aria-label="摘录正文" placeholder="写下一段想保存的话；标题自动生成"></textarea>
  <p id="clip-note-origin" class="clip-hint">手动便签不关联网页来源</p>
  <div id="clip-note-unsaved" class="clip-unsaved" role="group" aria-label="未保存更改" hidden>
   <span>有未保存的修改，确定放弃吗？</span>
   <div><button type="button" id="clip-note-continue">继续编辑</button><button type="button" id="clip-note-discard" class="clip-danger">放弃修改</button></div>
  </div>
  <div class="clip-editor-actions">
   <button type="button" id="clip-note-cancel">取消</button>
   <button type="button" id="clip-note-save" class="primary"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-save"></use></svg>保存修改</button>
  </div>
 </section>
 <div id="clip-note-list" class="clip-note-list" aria-live="polite"></div>
 <button type="button" id="clip-note-more" class="clip-outline clip-note-more" hidden><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-chevron-down"></use></svg>加载更多摘录</button>
 <section id="clip-note-reader" class="clip-note-reader" aria-label="阅读完整摘录" hidden>
  <div class="clip-read-head">
   <button type="button" id="clip-note-reader-back" class="clip-outline clip-icon-button" aria-label="返回摘录列表" title="返回摘录列表"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-arrow-left"></use></svg></button>
   <span class="clip-spacer"></span>
   <button type="button" id="clip-note-read-edit" class="clip-outline clip-icon-button" aria-label="编辑完整正文" title="编辑完整正文"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-pencil"></use></svg></button>
  </div>
  <h2 id="clip-note-read-title"></h2>
  <p id="clip-note-read-meta" class="clip-note-meta"></p>
  <p id="clip-note-read-origin" class="clip-hint"></p>
  <div id="clip-note-read-body" class="clip-preview clip-note-read-body" role="document" aria-label="摘录 Markdown 全文" tabindex="0"></div>
  <div class="clip-editor-actions clip-read-actions">
   <button type="button" id="clip-note-read-copy"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-copy"></use></svg>复制</button>
   <button type="button" id="clip-note-read-download"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-download"></use></svg>下载 .md</button>
   <button type="button" id="clip-note-read-remove" class="clip-danger"><svg class="clip-icon" aria-hidden="true" focusable="false"><use href="#clip-i-trash-2"></use></svg>删除</button>
  </div>
 </section>
 <p id="clip-notes-status" class="clip-status" role="status" aria-live="polite">仅保存在此浏览器。卸载前请导出备份。</p>
</section>
</main>

<script>
(function(){
'use strict';
const sample=[
 '# 网页剪藏示例：一篇技术文章','',
 '这是演示数据，包含 **重点内容**、[参考链接](https://example.com/docs) 和简单的段落。','',
 '## 使用要点','','- 保留标题、段落和来源','- 支持列表、引用与代码','',
 '## 代码片段','','\x60\x60\x60js','const value = 42;','console.log(value);','\x60\x60\x60','',
 '| 功能 | 状态 |','| --- | --- |','| 文章剪藏 | 演示 |','| Markdown 预览 | 演示 |','',
 '> 此内容来自预览环境，不代表真实网页。'
].join('\n')+'\n';
const selection='在网页中选中的 **示例文字**，包含 [链接](https://example.com/selection)。\n';
let source='https://example.com/articles/markdown-clipper';
const pageTitle=()=>source.includes('next-page')?'第二个网页（内容不同）':'网页剪藏示例';
const send=(name,bytes=0)=>parent.postMessage({kind:'clipper-demo',name,bytes},'*');
const enc=new TextEncoder(),size=v=>enc.encode(JSON.stringify(v)).byteLength;
let local={clips:null},caseName='normal',writes=0;
const key='opendesk.clipper.r110.simulated-session';
try{const saved=sessionStorage.getItem(key);if(saved)local=JSON.parse(saved);}catch{/* Isolated demo fallback only. */}
const persist=()=>{try{sessionStorage.setItem(key,JSON.stringify(local));}catch{/* Preview-only. */}};

if(!local.clips){
 const now='2026-10-21T08:00:00.000Z';
 const older='2026-10-20T10:00:00.000Z';
 local.clips={version:1,items:[
  {id:'sample-01',kind:'clip',title:'为什么优秀的工具需要简单的交互',source:'https://example.com/articles/product-design',createdAt:now,updatedAt:now,body:'# 为什么优秀的工具需要简单的交互\n\n复杂的功能应该被隐藏在清晰的入口之后，而不是让每一个常用动作都增加额外步骤。\n\n## 关键原则\n\n- 保存后立即能看见记录\n- 删除与编辑不占用整行\n- 不同剪藏模式保留独立内容'},
  {id:'sample-02',kind:'clip',title:'Markdown 中的引用与代码示例',source:'https://example.org/markdown/guide',createdAt:older,updatedAt:older,body:'# Markdown 中的引用与代码示例\n\n> 重要的句子应该容易回看。\n\n保存完整内容后可以再次阅读、编辑或下载。'},
  {id:'sample-03',kind:'note',title:'本周阅读整理',source:'',createdAt:older,updatedAt:older,body:'本周阅读整理\n\n查看三篇长文，整理设计笔记，保留原始来源。'},
  {id:'sample-04',kind:'clip',title:'网页剪藏的产品设计参考',source:'https://example.net/design/patterns',createdAt:older,updatedAt:older,body:'[网页剪藏的产品设计参考](https://example.net/design/patterns)\n\n简洁列表、同屏查看与可恢复的保存反馈。'},
  {id:'sample-05',kind:'clip',title:'长篇 Markdown · 28 节阅读测试',source:'https://example.com/docs/long-guide',createdAt:now,updatedAt:'2026-10-21T09:00:00.000Z',body:'# 长篇 Markdown · 阅读测试\n\n用于查看底部操作是否始终可见。\n\n'+Array.from({length:28},(_,i)=>'## 第 '+(i+1)+' 节\n\n这是第 '+(i+1)+' 节的完整正文，包含 **重点**、列表和可以继续向下滚动的段落。\n\n- 保存后可完整阅读\n- 编辑区自动增长但不推走按钮\n\n> 章节内容不会被截断。').join('\n\n')},
  {id:'sample-06',kind:'note',title:'阅读待办',source:'',createdAt:older,updatedAt:older,body:'阅读待办\n\n验证最近四条与资料库总数的区别。'}
 ]};
 persist();
}

const limit=4*1024*1024,bodyLimit=160000;
let counter=0;
const atom=()=> 'clip-demo-'+Date.now().toString(36)+'-'+(++counter).toString(36)+'-sample';
const safeLibrary=()=>local.clips||{version:1,items:[]};
const titleOf=body=>String(body).trim().split(/\r?\n/)[0].replace(/^#{1,6}\s*/,'').slice(0,42)||'新便签';
const summary=item=>({id:item.id,title:item.title,source:item.source,kind:item.kind,
 createdAt:item.createdAt,updatedAt:item.updatedAt,excerpt:item.body.slice(0,180),bodyBytes:enc.encode(item.body).length});
const etag=value=>{
 const json=JSON.stringify(value),buffer=enc.encode(json);
 let hash=2166136261;
 for(const byte of buffer)hash=Math.imul(hash^byte,16777619)>>>0;
 return hash.toString(16).padStart(8,'0').repeat(8);
};
const reason=(code,message)=>Object.assign(new Error(message),{code});
globalThis.OpenDeskTool={
 root:document.querySelector('.clip'),
 setState({dirty,busy}={}){parent.postMessage({kind:'clipper-demo-state',dirty:dirty===true,busy:busy===true},'*');},
 setNavigation({page}={}){parent.postMessage({kind:'clipper-demo-nav',page},'*');},
 async request(operation,args={}){
  if(['clip.article','clip.selection','clip.link'].includes(operation)){
   const another=source.includes('next-page');
    const markdown=operation==='clip.article'?(another?'# 新网页文章\n\n本页是新的网页快照。\n':sample):
     operation==='clip.selection'?(another?'来自新网页的选区内容。\n':selection):
     '['+pageTitle()+']('+source+')\n';
    send('提取模拟网页内容',enc.encode(markdown).length);
   return {markdown,title:pageTitle(),site:new URL(source).hostname,source,capturedAt:'2026-10-20T00:00:00.000Z',mode:operation};
  }
  if(operation==='currentPage.info')return {status:'available',title:pageTitle(),url:source};
  if(operation.startsWith('clipNotes.')){
   const method=operation.slice('clipNotes.'.length),lib=safeLibrary(),at=new Date().toISOString();
   const compare=()=>{if(args.ifMatch!==etag(lib))throw reason('E_STORAGE_CONFLICT','演示：另一窗口已修改');};
   if(method==='list'){
    const words=String(args.query||'').toLowerCase().split(/\s+/).filter(Boolean);
    const kind=args.kind||'all';
    if(!['all','clip','note'].includes(kind))throw reason('E_SCHEMA','演示：筛选类型无效');
    const matched=lib.items.filter(item=>(kind==='all'||item.kind===kind)&&words.every(w=>[item.title,item.source,item.body].some(t=>t.toLowerCase().includes(w))))
     .sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)||b.createdAt.localeCompare(a.createdAt));
    const offset=args.offset||0,page=matched.slice(offset,offset+50);
    return {items:page.map(summary),total:lib.items.length,matched:matched.length,
      nextOffset:offset+page.length<matched.length?offset+page.length:null,
      usedBytes:size(lib),limits:{bodyBytes:bodyLimit,totalBytes:limit,maxNotes:1000},etag:etag(lib)};
   }
   if(method==='get'){
    const item=lib.items.find(x=>x.id===args.id);
    if(!item)throw reason('E_NOT_FOUND','演示：摘录不存在');
    return {item,etag:etag(lib)};
   }
   if(method==='backup'){send('模拟导出备份（未生成文件）',size(lib));return {started:true,count:lib.items.length};}
   const items=lib.items.slice();
   let result;
   if(method==='save'){
    if(typeof args.body!=='string'||!args.body.trim())throw reason('E_EMPTY','正文不能为空');
    if(enc.encode(args.body).length>bodyLimit)throw reason('E_BODY_LIMIT','正文超过 160,000 字节');
    const kind=args.kind==='note'?'note':'clip',source=kind==='note'?'':args.source;
    const duplicate=items.find(x=>x.kind==='clip'&&kind==='clip'&&x.source===source&&x.body===args.body);
    if(duplicate)return {id:duplicate.id,duplicate:true};
    if(items.length>=1000)throw reason('E_QUOTA','演示：1000 条已满');
    const id=atom();
    items.push({id,kind,body:args.body,source,title:args.title||titleOf(args.body),createdAt:at,updatedAt:at});
    result={id,duplicate:false};
   }else if(method==='edit'){
    compare();
    const i=items.findIndex(x=>x.id===args.id);
    if(i<0)throw reason('E_NOT_FOUND','演示：记录不存在');
    if(enc.encode(args.body).length>bodyLimit)throw reason('E_BODY_LIMIT','正文超过 160,000 字节');
    if(!args.body.trim())throw reason('E_EMPTY','正文不能为空');
    if(items[i].body===args.body)return {id:args.id,unchanged:true};
    items[i]={...items[i],body:args.body,title:items[i].kind==='note'?titleOf(args.body):items[i].title,updatedAt:at};
    result={id:args.id,unchanged:false};
   }else if(method==='remove'){
    compare();
    const i=items.findIndex(x=>x.id===args.id);
    if(i<0)throw reason('E_NOT_FOUND','演示：记录不存在');
    items.splice(i,1);result={id:args.id,removed:true};
   }else throw reason('E_UNSUPPORTED','不支持的演示操作');
   const next={version:1,items};
   if(size(next)>limit||caseName==='quota')throw reason('E_QUOTA','演示：摘录库已达到 4 MiB');
   if(caseName==='failure')throw reason('E_HOST_STORAGE_WRITE','演示：Host 写入失败');
   local.clips=JSON.parse(JSON.stringify(next));persist();writes++;
   send('模拟摘录写入（临时演示数据，非 Chrome 工具存储）',size(next));
   if(caseName==='unknown'){caseName='normal';throw reason('E_OUTCOME_UNKNOWN','演示：回执丢失');}
   return result;
  }
  throw reason('E_UNSUPPORTED','预览不支持 '+operation);
 }
};
globalThis.OpenDeskSDK={browser:{
 launch:{async consume(){
  if(!new URLSearchParams(location.search).has('launch'))throw reason('E_LAUNCH_EXPIRED','演示未触发右键');
  send('模拟右键选区交付（非真实 Chrome）',enc.encode(selection).length);
  return {toolId:'web-markdown-clipper',actionId:'save-selection',selection,
   source:{url:source},expiresAt:Date.now()+60000};
 }},
 clipboard:{async writeText(text){
  send('模拟复制（未写入系统剪贴板）',enc.encode(text).length);
  return {copied:true};
 }},
 downloads:{async text({text}){
  send('模拟下载（未创建磁盘文件）',enc.encode(text).length);
  return {started:true};
 }}
}};
window.addEventListener('message',({source:sender,data})=>{
 if(sender!==parent)return;
 if(data?.kind==='clipper-demo-nav-action'){
  if(['back','primary'].includes(data.action))
   document.querySelector('.clip').dispatchEvent(
    new CustomEvent('opendesk-tool-navigation',{detail:{action:data.action}}));
  return;
 }
 if(data?.kind!=='clipper-demo-control')return;
 if(data.theme==='dark'||data.theme==='light')document.documentElement.dataset.demoTheme=data.theme;
 if(data.zoom===1||data.zoom===2){
  document.body.style.zoom=String(data.zoom);
  document.documentElement.style.setProperty('--preview-zoom',String(data.zoom));
  document.documentElement.dataset.demoZoom=String(data.zoom);
 }
 if(['normal','quota','failure','unknown'].includes(data.storageCase)){
  caseName=data.storageCase;
  send('模拟存储场景：'+caseName+'（非浏览器真实写入）');
 }
 if(data.reset===true){
   source=source.includes('next-page')?'https://example.com/articles/markdown-clipper':'https://example.org/next-page';
   document.querySelector('.clip').dispatchEvent(new Event('opendesk-page-changed'));
   send('模拟切换网页（四种模式旧缓存全部失效）');
  }
});
})();
</script>
