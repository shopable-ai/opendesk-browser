<main class="ps od-page">
  <section id="ps-index" aria-labelledby="ps-title">
    <header class="ps-head od-page-head"><h2 id="ps-title" class="od-title">我的提示词</h2><button id="ps-new" class="od-button od-button--primary" type="button">＋ 新建</button></header>
    <div class="ps-list-caption"><span>点击正文可直接复制，网页左侧按钮可插入草稿</span><small id="ps-count">0 个 · 0 个启用</small></div>
    <div id="ps-list" class="ps-list"></div>
    <div id="ps-empty" class="ps-empty" hidden><strong>尚未创建提示词</strong><p>点击「＋ 新建」添加第一个快捷按钮。</p></div>
    <section class="ps-settings" aria-label="使用设置">
      <div class="ps-section-heading"><h3>快捷入口</h3><small>默认开启</small></div>
      <label class="ps-setting-card od-surface"><span class="ps-setting-copy"><strong>网页左侧快捷按钮</strong><small>ChatGPT 页面直接可用，不需额外授权</small></span><span class="ps-switch"><input id="ps-web" type="checkbox" role="switch" checked aria-label="网页左侧快捷按钮"><span class="ps-switch-track" aria-hidden="true"></span></span></label>
      <p class="ps-hint">原生右键快捷添加为可选功能，需要时可在工具详情的「设置」中启用。</p>

    </section>
    <section class="ps-sites" aria-label="网站适配"><div class="ps-sites-heading"><h3>适用网站</h3><button id="ps-sites-open" class="od-button od-button--secondary" aria-controls="ps-sites-panel" aria-expanded="false" type="button">管理网站</button></div><div id="ps-sites-panel" hidden><p class="ps-hint">ChatGPT 已内置，其他网站分别选择两个目标。</p><div id="ps-sites-list" class="ps-sites-list" aria-live="polite"></div><button id="ps-site-current" class="od-button od-button--secondary" type="button">配置当前网站</button><div id="ps-site-form" class="ps-site-form od-surface" hidden><strong id="ps-site-form-title">网站适配</strong>
<p id="ps-site-origin" class="ps-site-origin"></p>
<div class="ps-compact-row"><label for="ps-site-container" class="od-field-label">按钮容器</label><input id="ps-site-container" class="od-field" placeholder="CSS 选择器"></div>
<button id="ps-pick-container" class="od-button od-button--secondary" type="button">在网页选择容器</button>
<div class="ps-compact-row"><label for="ps-site-editor" class="od-field-label">目标输入框</label><input id="ps-site-editor" class="od-field" placeholder="CSS 选择器"></div>
<button id="ps-pick-editor" class="od-button od-button--secondary" type="button">在网页选择输入框</button>
<details class="ps-site-advanced"><summary>高级 · 页面路径范围</summary><div class="ps-compact-row"><label class="od-field-label" for="ps-site-path">页面路径</label><input id="ps-site-path" class="od-field" value="/"></div></details>
<label class="ps-enabled">启用此网站的快捷按钮<span class="ps-switch"><input id="ps-site-enabled" type="checkbox" role="switch" checked><span class="ps-switch-track" aria-hidden="true"></span></span></label>
<p id="ps-site-verified" class="ps-hint" role="status" aria-live="polite">保存前请验证两个目标。</p>
<div class="ps-actions"><button id="ps-site-cancel" class="od-button od-button--secondary" type="button">取消</button><button id="ps-site-test" class="od-button od-button--secondary" type="button">测试定位</button><button id="ps-site-save" class="od-button od-button--primary" type="button">保存网站</button></div></div><p id="ps-site-status" class="ps-status" role="status" aria-live="polite" hidden></p></div></section>
<textarea id="ps-clipboard-buffer" class="ps-clipboard-buffer" readonly tabindex="-1" aria-hidden="true"></textarea>
  </section>
  <section id="ps-edit" hidden aria-labelledby="ps-form-title">
    <header class="ps-form-head"><h2 id="ps-form-title" class="od-title">新建提示词</h2></header>
    <form id="ps-form" novalidate aria-busy="false">
      <div class="ps-primary"><label for="ps-body" class="od-field-label">提示词内容 <span class="ps-required">· 唯一必填</span></label><textarea id="ps-body" class="od-field" rows="3" spellcheck="true" aria-required="true" aria-describedby="ps-body-hint ps-body-error" placeholder="在这里输入完整提示词，支持多行。仅填写此项即可保存；点击网页按钮不会自动发送。"></textarea><p id="ps-body-error" class="ps-inline-error" role="alert" hidden></p><div id="ps-quota" class="ps-quota"><span>单项存储上限 8 KiB</span><span id="ps-quota-value">— / 8192 B</span></div><p class="ps-hint" id="ps-body-hint">完整保留多行、空行和 Emoji；按整项 JSON 的 UTF-8 字节数校验。</p></div>
      <div class="ps-effective-preview" aria-label="保存后的按钮实时预览"><span>快捷按钮</span><span id="ps-preview-glyph" class="ps-preview-glyph"></span><strong id="ps-preview-name">待生成</strong></div>
      <section class="ps-optional od-surface" aria-labelledby="ps-option-title">
        <button type="button" id="ps-toggle-settings" class="ps-optional-head" aria-expanded="true" aria-controls="ps-setting-fields"><span id="ps-option-title">按钮设置</span><small>选填 · 默认即可用 <span id="ps-toggle-caret">收起</span></small></button>
        <div id="ps-setting-fields" class="ps-setting-fields">
        <div class="ps-compact-row"><label class="od-field-label" for="ps-label">按钮短标签</label><input id="ps-label" class="od-field" maxlength="24" placeholder="自动生成前 2 字" autocomplete="off"></div>
        <div class="ps-compact-row"><label class="od-field-label" for="ps-name">显示名称</label><input id="ps-name" class="od-field" maxlength="60" placeholder="留空自动生成" autocomplete="off"></div>
        <label class="ps-enabled od-surface"><span>网页显示此按钮</span><span class="ps-switch"><input id="ps-enabled" type="checkbox" role="switch" checked aria-label="显示此按钮"><span class="ps-switch-track" aria-hidden="true"></span></span></label>
        </div>
      </section>
      <p id="ps-error" class="ps-error" role="alert" hidden></p>
      <div id="ps-leave" class="ps-warning" hidden aria-label="未保存草稿确认"><strong>存在未保存的修改</strong><p>返回将放弃当前草稿。可以继续编辑或明确放弃。</p><div class="ps-actions"><button id="ps-stay" type="button" class="od-button od-button--secondary">继续编辑</button><button id="ps-discard" type="button" class="od-button od-button--danger">放弃修改</button></div></div>
      <div class="ps-actions"><button id="ps-cancel" class="od-button od-button--secondary" type="button">取消</button><button id="ps-save" class="od-button od-button--primary" type="button">保存提示词</button></div>
    </form>
  </section>
  <p id="ps-status" class="ps-status" role="status" aria-live="polite" hidden></p>
</main>
