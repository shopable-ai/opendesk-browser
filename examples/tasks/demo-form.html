<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenDesk Browser 表单任务演示</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:10vh auto;padding:16px;color:#172033}
form{display:grid;gap:10px}input,button{font:inherit;padding:12px;border-radius:8px}
button{background:#214bc0;color:white;border:0;cursor:pointer}#done{color:#17683b;font-weight:600}section{margin-top:30px;border-top:1px solid #ddd;padding-top:20px}#search-status{color:#17683b}button:disabled{opacity:.55;cursor:wait}</style></head>
<body><h1>本地任务运行演示</h1>
<p>演示页不上传数据。启动本地 HTTP 服务后，打开 Sidebar，在本页运行已验证并安装的表单任务。</p>
<form id="demo-form"><label for="name">姓名</label><input id="name" autocomplete="off" placeholder="输入姓名" required>
<button type="submit" id="submit">提交</button></form>
<section aria-labelledby="modern-title">
<h2 id="modern-title">现代 Page API：搜索任务</h2>
<form id="search-form">
<label for="keyword">搜索关键词</label>
<input id="keyword" name="keyword" type="search" value="旧的预填内容" autocomplete="off">
<button type="submit" id="search-submit">搜索</button>
</form>
<p id="search-status" role="status" hidden></p>
<div id="results"></div>
<p id="search-count" aria-live="polite">提交次数：0</p>
</section>
<script>
(() => {
  const form = document.getElementById('search-form');
  const input = document.getElementById('keyword');
  const status = document.getElementById('search-status');
  const results = document.getElementById('results');
  const count = document.getElementById('search-count');
  let submissions = 0, generation = 0;
  input.addEventListener('input', () => {
    // Deliberate same-document repaint: a Locator must re-query, not retain a
    // stale button. The temporary disabled state exercises automatic waiting.
    const old = document.getElementById('search-submit');
    const replacement = old.cloneNode(true);
    replacement.disabled = true;
    old.replaceWith(replacement);
    const current = ++generation;
    setTimeout(() => { if (current === generation) replacement.disabled = false; }, 180);
    status.hidden = true;
    results.textContent = '';
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    ++submissions;
    count.textContent = '提交次数：' + submissions;
    setTimeout(() => {
      status.textContent = '搜索完成';
      status.hidden = false;
      results.textContent = '结果：' + input.value;
    }, 120);
  });
})();
</script>
<script>
document.getElementById('demo-form').addEventListener('submit', event => {
  event.preventDefault();
  const previous = document.getElementById('done');
  previous?.remove();
  const done = document.createElement('p');
  done.id = 'done';
  done.textContent = '已提交：' + document.getElementById('name').value;
  document.body.append(done);
});
</script></body></html>
