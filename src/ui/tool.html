<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="frame-src 'self'"><title>OpenDesk Browser</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="design-system.css"><link rel="stylesheet" href="tool-shell.css"></head>
<body>
<nav class="workbench-nav" role="tablist" aria-label="工作台">
  <button type="button" id="tab-my-tasks" role="tab" tabindex="0" data-workbench-tab="tasks" aria-selected="true" aria-controls="workbench-tasks">我的</button>
  <button type="button" id="tab-discover" role="tab" tabindex="-1" data-workbench-tab="discover" aria-selected="false" aria-controls="workbench-local-discover">发现</button>
  <button type="button" id="tab-workflow" role="tab" tabindex="-1" data-workbench-tab="workflow" aria-selected="false" aria-controls="workbench-workflow">工作流</button>
  <button type="button" id="tab-develop" role="tab" tabindex="-1" data-workbench-tab="develop" aria-selected="false" aria-controls="workbench-develop">开发</button>
  <button type="button" id="tab-tools" role="tab" tabindex="-1" data-workbench-tab="tools" aria-selected="false" aria-controls="workbench-tools">工具</button>
  <button type="button" id="tab-debug" role="tab" tabindex="-1" data-workbench-tab="debug" aria-selected="false" aria-controls="workbench-debug" hidden>调试</button>
</nav>
<main id="workspace-content">
  <div id="site-access-recovery" class="row" role="status" hidden>
    <span id="site-access-recovery-message">访问受限：Chrome 已限制网站访问。</span>
    <button id="site-access-restore" type="button" aria-describedby="site-access-recovery-message">恢复全部网站访问</button>
  </div>
  <div id="workbench-tasks" role="tabpanel" aria-labelledby="tab-my-tasks" class="od-page" data-workbench-page="tasks">
      <section class="tasks-surface" aria-label="已安装任务">
      <div class="task-section-head od-toolbar">
        <strong>自动化任务</strong>
        <div class="task-section-actions"><span id="task-installed-count" aria-live="polite"></span><button type="button" id="task-open-catalog" class="od-button" aria-label="打开任务目录添加任务">＋ 添加</button></div>
      </div>
      <label for="task-installed-list" class="visually-hidden">已安装任务</label><select id="task-installed-list" hidden><option value="">读取已安装任务…</option></select>
      <div id="task-installed-cards" class="task-card-list od-stack" aria-label="已安装任务列表"></div>
      <div id="task-selected-workspace" class="task-selected-workspace">
      <p id="task-current-site" class="identity"></p>
      <form id="task-params-form" autocomplete="off" aria-label="任务参数"></form>
      <p id="task-status" role="status" aria-live="polite"></p>
      <div id="task-result-panel" class="task-result-panel" hidden>
        <div class="task-result-controls">
          <h3 class="task-result-heading">最近结果</h3>
          <button type="button" id="task-result-reveal" title="完整返回值可能包含敏感信息" hidden>查看完整原值</button>
        </div>
        <pre id="task-result" aria-label="当前任务结果">尚未运行</pre>
      </div>
      <details id="task-history-panel" class="task-history-panel" hidden><summary>运行记录</summary><div id="task-history" aria-live="polite"></div></details>
      <details class="task-scope-panel"><summary>网站与权限</summary><div id="task-installed-detail" class="task-detail" aria-live="polite"></div></details>
      <details class="task-tools"><summary>更多操作</summary>
        <div class="row"><button type="button" id="task-refresh">刷新任务</button><button type="button" id="task-fork-draft" disabled>复制草稿</button></div>
        <details><summary>任务管理</summary>
          <div class="row"><button type="button" id="task-toggle" disabled>停用 / 启用</button><button type="button" id="task-uninstall" disabled>卸载当前版本</button><button type="button" id="open-catalog" class="catalog-open" aria-label="打开完整任务目录以导入或管理任务">导入/管理任务 ↗</button></div>
          <p class="hint">卸载不删除已有结果；停用将阻止后续启动。</p>
        </details>
      </details>
      </div>
    </section>
    <details id="cloud-hosting" class="task-scope-panel"><summary>云端托管 · 已安装任务 <span id="cloud-brief" class="cloud-status-brief">未配对</span></summary>
        <label>提供者地址 <input id="cloud-url" type="url" placeholder="https://可信提供者地址"></label>
        <label>提供者身份 <input id="cloud-provider-id" autocomplete="off"></label>
        <label>配对码 <input id="cloud-pairing-code" type="password" autocomplete="off"></label>
        <label><input id="cloud-loopback" type="checkbox">明确允许固定本地测试提供者 HTTP/WS</label>
        <p class="hint">云控框架已内置，无需在「工具」中导入。开发回环服务请输入 http://127.0.0.1:43112 并明确允许本地测试；普通服务器应使用 HTTPS。</p>
        <button id="cloud-pair" type="button">配对提供者</button>
        <p>先在下方安装并选择任务。托管授权固定当前安装版本、摘要、授权代次及该任务网站范围。</p>
        <label><input id="cloud-consent" type="checkbox">批准所选固定任务和网站范围，在合法浏览器执行宿主可用时运行</label>
        <label><input id="cloud-result-consent" type="checkbox">允许该固定任务结果回传</label>
        <div><button id="cloud-approve" type="button">批准并启用托管</button><button id="cloud-stop" type="button">停止托管并请求取消</button><button id="cloud-unpair" type="button">解除配对</button><button id="cloud-refresh" type="button">核对状态</button></div>
        <p class="hint">关闭 Side Panel 后不承诺无人值守执行。停止后保留取消处理中、退休待核对和未知结果；正常重连复用已有授权。</p>
        <p id="cloud-status" role="status" aria-live="polite">尚未配对</p>
      </details>
  </div>
  <div id="workbench-tools" role="tabpanel" aria-labelledby="tab-tools" class="od-page" data-workbench-page="tools" hidden>
    <section id="sidebar-tools" class="sidebar-tools" aria-label="自定义工具">
      <div id="sidebar-tool-list-view">
        <div class="sidebar-tools-head od-toolbar">
          <strong>已安装工具</strong>
          <div class="sidebar-tools-actions od-toolbar" role="group" aria-label="添加和管理工具">
            <button type="button" id="sidebar-tool-discover-toggle" class="od-icon-button" aria-label="添加工具" title="查找并安装官方工具" aria-expanded="false" aria-controls="sidebar-tool-discover-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
            <button type="button" id="sidebar-tool-market" class="od-icon-button" aria-label="打开应用市场" title="在新标签页打开完整应用市场"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-1.5-6h-13L4 10Zm2 0v10h12V10M10 20v-6h4v6"></path></svg></button>
            <button type="button" id="sidebar-tool-import-trigger" class="od-icon-button" aria-label="导入工具文件" title="导入本地工具文件" aria-expanded="false" aria-controls="sidebar-tool-import"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"></path></svg></button>
