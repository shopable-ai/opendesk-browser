name: Scheduled Tasks R2 native immutable installed Task identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-tasks-r2-task-identity.yml'
      - 'tests/framework/scheduled-tasks-r1-native-mac.test.mjs'
      - 'src/platform/tasks/schedule-*.js'
      - 'src/platform/tasks/service.js'
      - 'src/ui/scheduled-task-*.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-tasks-r2-task-identity-${{ github.sha }}
  cancel-in-progress: false

jobs:
  chrome-task-identity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            image: ubuntu-latest
          - platform: macos
            image: macos-15
    runs-on: ${{ matrix.image }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the real WXT installed product
        run: |
          npm run build
          node scripts/verify-package.mjs dist/production
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
      - name: Native Task disable, generation rotation, uninstall and FireId fence
        env:
          OPENDESK_SCHEDULED_NATIVE: '1'
          SCHEDULE_NATIVE_TASK_IDENTITY: '1'
          SCHEDULE_NATIVE_PLATFORM: ${{ matrix.platform == 'linux' && 'linux' || 'darwin' }}
          SCHEDULE_NATIVE_CI_NO_SANDBOX: ${{ matrix.platform == 'linux' && '1' || '0' }}
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          SCHEDULE_NATIVE_OUT: artifacts/scheduled-tasks-r2-identity-${{ matrix.platform }}
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            xvfb-run -a --server-args="-screen 0 1440x900x24" node --test tests/framework/scheduled-tasks-r1-native-mac.test.mjs
          else
            node --test tests/framework/scheduled-tasks-r1-native-mac.test.mjs
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-tasks-r2-identity-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/scheduled-tasks-r2-identity-${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 14
