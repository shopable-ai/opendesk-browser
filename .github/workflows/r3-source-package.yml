name: Page userscript dependencies and package
on:
  push:
    branches:
      - agent/r3-page-script-dependencies-20261008-1533
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  r3-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: D1 metadata, immutable assets, real preview consumers and dependency UI
        run: node --test tests/environment/dependency-metadata.test.mjs tests/environment/dependency-manager.test.mjs tests/environment/user-script-dependency-flow.test.mjs tests/environment/page-dependencies-ui.test.mjs tests/environment/page-program-package.test.mjs tests/environment/page-script-preview.test.mjs tests/environment/script-editor.test.mjs tests/environment/task-workbench.test.mjs tests/environment/sidebar-product-contract.test.mjs tests/environment/boundaries.test.mjs
      - name: Canonical HTML fixture contracts and real HTTP panel DOM behavior
        run: node --test tests/environment/basic-browser-page.test.mjs
      - name: R8 backlog feature ID traceability (not native acceptance)
        run: node --test tests/environment/r8-backlog-contract.test.mjs
      - name: Source and vendor integrity
        run: npm run check
      - name: Production build and verification
        run: npm run build
      - name: Development build and verification
        run: npm run build:dev
      - name: Both packages retain exact manifest and vendored hashes
        run: npm run verify
