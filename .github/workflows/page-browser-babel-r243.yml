name: R24.3 browser Babel JSX compiler comparison
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/page-browser-babel-r243.yml'
      - 'scripts/page-browser-babel/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-exact-babel-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Babel without running package scripts
        run: npm ci --prefix scripts/page-browser-babel --ignore-scripts --no-audit --no-fund
      - name: Qualify JSX and Vue SFC transforms, exact SHA, MIT, size, CSP scan
        run: node scripts/page-browser-babel/review.mjs --emit-lock-base64 --emit-source-base64
      - name: Install the original pinned repository build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the original trusted managed UI helper from its exact source graph
        run: node scripts/build-page-ui-helper-r243.mjs
      - name: Validate audited offline browser compiler resource identity
        run: node --test tests/environment/page-browser-resource-r243.test.mjs
      - name: Check isolated worker cancellation, failing results and resource hashes
        run: node --test tests/environment/page-component-preparer-r243.test.mjs
      - name: Verify browser component linker stays pure and rejects unsafe sources
        run: node --test tests/environment/page-component-browser-linker-r243.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: r243-browser-babel-review-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/r243-browser-babel-review
