name: R24.3 browser Babel JSX compiler comparison
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/page-browser-babel-r243.yml'
      - 'scripts/page-browser-babel/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-exact-babel-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate first exact package lock only
        run: npm install --prefix scripts/page-browser-babel --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install pinned Babel without running package scripts
        run: npm ci --prefix scripts/page-browser-babel --ignore-scripts --no-audit --no-fund
      - name: Qualify JSX and Vue SFC transforms, exact SHA, MIT, size, CSP scan
        run: node scripts/page-browser-babel/review.mjs --emit-lock-base64
      - uses: actions/upload-artifact@v4
        with:
          name: r243-browser-babel-review-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/r243-browser-babel-review
