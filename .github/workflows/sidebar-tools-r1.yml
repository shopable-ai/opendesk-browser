name: Sidebar user tools R1 - package and build
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/sidebar-tools/**'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/tool.html'
      - 'src/ui/tool-shell.js'
      - 'src/ui/tool-shell.css'
      - 'src/ui/design-system.css'
      - 'src/ui/task-workbench.js'
      - 'src/sidebar-tools/**'
      - 'src/native-agent/tool-snapshot.js'
      - 'src/native-agent/workspace.js'
      - 'src/native-agent/workspace.html'
      - 'src/native-agent/workspace.css'
      - 'src/entrypoints/bridge.js'
      - 'scripts/build-sidebar-tool.mjs'
      - 'scripts/stage-sidebar-tool.mjs'
      - 'scripts/watch-sidebar-tool.mjs'
      - 'scripts/build-contract.mjs'
      - 'scripts/build.mjs'
      - 'scripts/verify-package.mjs'
      - 'scripts/check-source.mjs'
      - 'manifest.json'
      - 'wxt.config.mjs'
      - 'package.json'
      - 'examples/sidebar-tools/**'
      - 'tests/environment/sidebar-tools.test.mjs'
      - 'tests/environment/sidebar-tools-host.test.mjs'
      - 'tests/environment/tool-stage.test.mjs'
      - 'tests/environment/tool-snapshot.test.mjs'
      - 'tests/environment/tool-preview-session.test.mjs tests/environment/tool-watch.test.mjs'
      - 'tests/environment/tool-watch.test.mjs'
      - 'tests/environment/tool-ui-tab.test.mjs'
      - 'tests/framework/sidebar-tool-starter-build.mjs'
      - 'tests/environment/sidebar-quick-notes.test.mjs'
      - 'tests/environment/sidebar-product-contract.test.mjs'
      - 'tests/environment/sidebar-ui-preview.test.mjs'
      - 'tests/environment/task-workbench.test.mjs'
      - '.github/workflows/sidebar-tools-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sidebar-tool-contract-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate R14 tool isolation and all five Sidebar regressions
        run: |
          node --test tests/environment/sidebar-tools.test.mjs tests/environment/sidebar-tools-host.test.mjs tests/environment/tool-ui-tab.test.mjs tests/environment/tool-stage.test.mjs tests/environment/tool-snapshot.test.mjs tests/environment/tool-preview-session.test.mjs tests/environment/sidebar-quick-notes.test.mjs tests/environment/sidebar-product-contract.test.mjs tests/environment/sidebar-ui-preview.test.mjs tests/environment/task-workbench.test.mjs
          npm run check
      - name: Build installable offline notes tool JSON
        run: |
          npm run build:sidebar-tool -- examples/sidebar-tools/quick-notes
          cmp artifacts/sidebar-tools/quick-notes/1.1.0/quick-notes.opendesk-tool.json examples/sidebar-tools/quick-notes/quick-notes.opendesk-tool.json
          node --input-type=module -e "import {readFileSync} from 'node:fs';import {validateSidebarToolPackage} from './src/ui/sidebar-tools/package.js';const p=validateSidebarToolPackage(JSON.parse(readFileSync('artifacts/sidebar-tools/quick-notes/1.1.0/quick-notes.opendesk-tool.json','utf8')));if(!p.html.includes('data:image/png;base64,'))throw Error('Local image was not bundled');console.log('SIDEBAR_TOOL_BUILT_AND_VALIDATED',p.id,p.version)"
      - name: Compile standalone React and Vue tool source with pinned toolchain
        run: |
          set -euo pipefail
          for tool in react-starter vue-starter; do
            (
              cd "examples/sidebar-tools/$tool"
              npm install --ignore-scripts --no-audit --no-fund
              npm run build
            )
          done
          node tests/framework/sidebar-tool-starter-build.mjs
      - name: WXT production and development packages retain security boundaries
        run: |
          npm run build
          npm run build:dev
          npm run verify
      - name: Preserve native installable candidates (not Chrome acceptance)
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-tool-r1-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/sidebar-tools/quick-notes/1.1.0/quick-notes.opendesk-tool.json
            docs/framework/evidence/wxt/builds/build-production.json
            docs/framework/evidence/wxt/builds/build-development.json
