name: Sidebar R33.3.6 six-tab source-bound preview
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/tool.html'
      - 'src/ui/react/**'
      - 'src/ui/task-workbench.js'
      - 'src/ui/scheduled-task-workbench.js'
      - 'src/ui/schedule-plan-presentation.js'
      - 'src/ui/cloud-hosting.js'
      - 'src/ui/tool-shell.js'
      - 'src/ui/design-*.css'
      - 'src/ui/tool-shell.css'
      - 'src/ui/cloud-hosting.css'
      - 'src/ui/extension-center.css'
      - 'scripts/preview/build-sidebar-six-react-preview.mjs'
      - 'tests/environment/sidebar-six-react-preview-contract.test.mjs'
      - 'tests/environment/react-my-cloud-r3338.test.mjs'
      - 'scripts/tests/sidebar-six-react-preview-interaction.mjs'
      - '.github/workflows/sidebar-six-react-preview-r3336.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-tab-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build from installed DOM, CSS and real React components
        id: build_preview
        run: node scripts/preview/build-sidebar-six-react-preview.mjs
      - name: Verify R33.3.14 schedule projections and existing UI
        run: |
          node --test tests/environment/schedule-plan-presentation-r33314.test.mjs \
            tests/environment/scheduled-task-ui-r1.test.mjs
      - name: Guard source drift and React/DOM contracts
        run: |
          node scripts/preview/build-sidebar-six-react-preview.mjs --check
          node --test tests/environment/sidebar-six-react-preview-contract.test.mjs \
            tests/environment/react-sidebar-r333.test.mjs \
            tests/environment/react-sidebar-render-r3331.test.mjs \
            tests/environment/react-debug-bridge-r3337.test.mjs \
            tests/environment/react-my-cloud-r3338.test.mjs
          npm run check
      - name: Install CJK fonts for truthful Chinese visual review
        if: ${{ steps.build_preview.outcome == 'success' && !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-match -f '%{family}\n' ':lang=zh'
      - name: Render six actual panels in Chromium (UI-only, not installed extension)
        if: ${{ steps.build_preview.outcome == 'success' && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p artifacts/sidebar-six-react-preview
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --virtual-time-budget=5000 \
            --dump-dom "file://$PWD/prototypes/sidebar/react-preview/index.html" \
            > artifacts/sidebar-six-react-preview/dom.txt
          node --input-type=module <<'DIAGNOSTICS'
          import {readFileSync} from 'node:fs';
          const dom=readFileSync('artifacts/sidebar-six-react-preview/dom.txt','utf8');
          const markers=['data-sidebar-preview-ready="true"','data-preview-scenario','od-sidebar-preview-controls','od-sidebar-preview-root'];
          console.log('CHROMIUM_DIAGNOSTICS='+JSON.stringify({bytes:dom.length,markers:Object.fromEntries(markers.map(k=>[k,dom.includes(k)])),
            bodyHead:dom.slice(Math.max(0,dom.indexOf('<body')),Math.max(0,dom.indexOf('<body'))+800),
            documentTail:dom.slice(-850)}));
          DIAGNOSTICS
          grep -q 'data-sidebar-preview-ready="true"' artifacts/sidebar-six-react-preview/dom.txt
          grep -q 'data-preview-scenario' artifacts/sidebar-six-react-preview/dom.txt
          for tab in tasks tools workflow develop cloud debug; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --no-first-run --virtual-time-budget=4000 --window-size=540,950 \
              --screenshot="$PWD/artifacts/sidebar-six-react-preview/$tab-360.png" \
              "file://$PWD/prototypes/sidebar/react-preview/index.html?tab=$tab"
            test -s "artifacts/sidebar-six-react-preview/$tab-360.png"
          done
          for viewport in develop-420 cloud-520; do
            tab="${viewport%-*}"
            width="${viewport#*-}"
            window=$((width + 180))
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --no-first-run --virtual-time-budget=4000 --window-size="$window",950 \
              --screenshot="$PWD/artifacts/sidebar-six-react-preview/$tab-$width.png" \
              "file://$PWD/prototypes/sidebar/react-preview/index.html?tab=$tab&width=$width"
            test -s "artifacts/sidebar-six-react-preview/$tab-$width.png"
          done
          for width in 320 360 420 520; do
            window=$((width + 180))
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --no-first-run --virtual-time-budget=4000 --window-size="$window",1050 \
              --screenshot="$PWD/artifacts/sidebar-six-react-preview/my-schedule-$width.png" \
              "file://$PWD/prototypes/sidebar/react-preview/index.html?tab=tasks&mode=schedule&width=$width"
            test -s "artifacts/sidebar-six-react-preview/my-schedule-$width.png"
          done
          for width in 320 360 420 520; do
            window=$((width + 180))
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --no-first-run --virtual-time-budget=4000 --window-size="$window",1050 \
              --screenshot="$PWD/artifacts/sidebar-six-react-preview/workflow-$width.png" \
              "file://$PWD/prototypes/sidebar/react-preview/index.html?tab=workflow&width=$width"
            test -s "artifacts/sidebar-six-react-preview/workflow-$width.png"
          done
          echo "SOURCE_BOUND_WORKFLOW_SCREENSHOTS=320,360,420,520"
          echo "SOURCE_BOUND_SCHEDULE_MULTI_STATE_SCREENSHOTS=320,360,420,520"
          echo "SOURCE_BOUND_UI_PREVIEW_CHROMIUM=6_TAB_SCREENSHOTS_ONLY"
          echo "INSTALLED_EXTENSION_NATIVE_CHROME=NOT_TESTED"
      - name: Replay real Chromium pointer and file-import UI flows
        if: ${{ steps.build_preview.outcome == 'success' && !cancelled() }}
        run: node scripts/tests/sidebar-six-react-preview-interaction.mjs
      - name: Upload exact generated HTML and screenshots (no write to main)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-six-react-preview
          path: |
            prototypes/sidebar/react-preview/index.html
            artifacts/sidebar-six-react-preview/*.png
            artifacts/sidebar-six-react-preview/dom.txt
          retention-days: 14

  package-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Core six-tab Node regressions
        run: |
          node --test \
            tests/environment/task-workbench.test.mjs \
            tests/environment/scheduled-task-ui-r1.test.mjs \
            tests/environment/schedule-plan-presentation-r33314.test.mjs \
            tests/environment/extension-center-r4.test.mjs \
            tests/environment/workflow-ui-states.test.mjs \
            tests/environment/workflow-focus.test.mjs \
            tests/environment/cloud-control-sidebar-r28.test.mjs \
            tests/environment/react-my-cloud-r3338.test.mjs \
            tests/environment/react-debug-bridge-r3337.test.mjs \
            tests/environment/sidebar-component-contract.test.mjs \
            tests/environment/ui-layout-conventions-r27.test.mjs
      - name: React Sidebar real Chromium runner
        if: always()
        run: node scripts/tests/react-sidebar-r3331-browser.mjs
      - name: Build production candidate
        if: always()
        run: npm run build
      - name: Build development candidate
        if: always()
        run: npm run build:dev
      - name: Verify generated candidate packages
        if: always()
        run: npm run verify
      - name: Audit generated package size and limits
        if: always()
        run: npm run build:size
