name: Prune fully merged SDK branch once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-sdk-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune-one-verified-ref:
    if: github.repository == 'shopable-ai/opendesk-browser' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only exact merged PR2 branch head
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const number=2;
            const branch='codex/p1-2-sdk-target-origins-20261004';
            const sha='279f349a4afce147b6099124b3c15b61c7d6dc5d';
            const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:number});
            if(!pr.merged_at || pr.head.ref!==branch || pr.head.sha!==sha)
              throw new Error('PR2 is not merged at the exact expected head');
            const {data:ref}=await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});
            if(ref.object.sha!==sha) throw new Error('SDK branch changed since merge');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
            core.info('Deleted exact merged SDK branch at '+sha);
