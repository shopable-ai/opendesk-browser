# Temporary, source-first HTML synchronization. No native DNR claims or package promotion.
name: AdBlock R1.9.4 source-bound UI preview delivery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adblock-r194-preview-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate AdBlock preview from fixed product host and exact sandbox package
        run: |
          node scripts/preview/build-preview.mjs --tool adblock --surface side-panel --scenario success --theme light --width 360 --height 760 --out examples/sidebar-tools/adblock/adblock-r1-interactive-preview.html
          node scripts/preview/check-preview-contract.mjs
      - name: Node product and host regression (including unique settings and three views)
        run: |
          node --test tests/environment/adblock-host-controls-r13.test.mjs tests/environment/adblock-preview-contract.test.mjs tests/environment/adblock-r12.test.mjs tests/environment/stay-focus-boundary-r1.test.mjs
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Four real Chromium widths and interactive navigation
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/adblock-preview-chrome.mjs artifacts/adblock-r194-preview-chrome
      - name: Upload tested preview and Chrome screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adblock-r194-preview-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            examples/sidebar-tools/adblock/adblock-r1-interactive-preview.html
            artifacts/adblock-r194-preview-chrome/
  sync-preview-to-main:
    needs: verified-preview
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fail closed on concurrent changes to preview inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --name-only "${GITHUB_SHA}" origin/main > /tmp/adblock-preview-advance.txt
          if grep -E '^(examples/sidebar-tools/adblock/|src/ui/(tool-shell.css|tool.html|design-tokens.css|design-system.css)|scripts/(preview/|build-sidebar-tool.mjs|templates/sidebar-tool-preview-shell.html|bundle-provenance.mjs|tests/adblock-preview-chrome.mjs)|tests/environment/adblock-|contracts/ui-preview/|package(-lock)?\.json$)' /tmp/adblock-preview-advance.txt; then
            echo "::error::Preview source changed while testing; do not commit stale output."
            exit 1
          fi
          git pull --ff-only origin main
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recreate and validate exact latest-main HTML
        run: |
          node scripts/preview/build-preview.mjs --tool adblock --surface side-panel --scenario success --theme light --width 360 --height 760 --out examples/sidebar-tools/adblock/adblock-r1-interactive-preview.html
          node --test tests/environment/adblock-preview-contract.test.mjs tests/environment/adblock-host-controls-r13.test.mjs
          node scripts/preview/check-preview-contract.mjs
      - name: Commit only official HTML and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/adblock-r194-preview-sync.yml
          git add -- examples/sidebar-tools/adblock/adblock-r1-interactive-preview.html
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(adblock): sync compact settings-first source-bound preview [R1.9.4]'
          git push origin main
