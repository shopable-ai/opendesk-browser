name: Workflow AI direct send and data minimization
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/workflow/**'
      - 'src/framework/workflow/**'
      - 'src/ui/tool.html'
      - 'src/ui/tool-shell.css'
      - 'tests/environment/workflow-*.test.mjs'
      - '.github/workflows/workflow-ai-data-r16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-sharing-and-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify changed JavaScript parses
        run: |
          node --check src/ui/workflow/data-sharing.js
          node --check src/ui/workflow/workflow-view.js
          node --check src/ui/workflow/local-codex.js
          node --check src/ui/workflow/ai-plan.js
          node --check src/ui/workflow/direct-execution.js
      - name: Install locked dependencies for real build and tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Direct-send provider, payload minimization and workflow regressions
        run: |
          node --test tests/environment/workflow-direct-execution.test.mjs tests/environment/workflow-local-codex.test.mjs tests/environment/workflow-r15.test.mjs tests/environment/workflow-ai-observation.test.mjs tests/environment/workflow-ai-data-sharing.test.mjs tests/environment/workflow-ai-transport.test.mjs tests/environment/workflow-ui-states.test.mjs
      - name: Real source verification
        run: npm run check
      - name: Real development build
        run: npm run build:dev
