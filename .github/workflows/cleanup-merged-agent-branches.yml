name: Cleanup merged short-lived OpenDesk branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only verified merged or superseded refs
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const candidates = [
              {name:'agent/sidebar-ui-r2-20261008-review',pr:8,sha:'e05bcd37017ff1b30620d798f4dc534399424c3f'},
              {name:'agent/sidebar-ui-r5-20261008',pr:9,sha:'d62d7c8ff35650c0d508f1180f43ea9a799eaf0a'},
              {name:'agent/sidebar-r41-sync-20261008-x8ttm7ta',pr:10,sha:'3a877ef0e16afb660ffe21eccc43b895cfe4280b'},
              {name:'agent/site-access-once-20261008-1647',pr:7,sha:'935dcb2a28560c0dc429e3b30aeb807297dfabf7',supersededBy:12},
            ];
            async function removeWhenSafe(entry) {
              const request = await github.rest.pulls.get({owner,repo,pull_number:entry.pr});
              const pr = request.data;
              if (entry.supersededBy) {
                const replacement = (await github.rest.pulls.get({owner,repo,pull_number:entry.supersededBy})).data;
                if (pr.state !== 'closed' || !replacement.merged_at) {
                  core.info(`Keep ${entry.name}: replacement unmerged or original still open`);
                  return;
                }
              } else if (!pr.merged_at) {
                core.info(`Keep ${entry.name}: pull request is not merged`);
                return;
              }
              let existing;
              try {
                existing = (await github.rest.git.getRef({owner,repo,ref:`heads/${entry.name}`})).data;
              } catch (error) {
                if (error.status === 404) {core.info(`Already removed ${entry.name}`);return;}
                throw error;
              }
              if (entry.name === 'main' || existing.object.sha !== entry.sha) {
                core.info(`Keep ${entry.name}: HEAD changed since verified merge`);
                return;
              }
              try {
                await github.rest.git.deleteRef({owner,repo,ref:`heads/${entry.name}`});
                core.info(`Deleted completed branch ${entry.name}`);
              } catch (error) {
                if (error.status === 404) {core.info(`Already removed ${entry.name}`);return;}
                throw error;
              }
            }
            for (const entry of candidates) await removeWhenSafe(entry);
            // Future integration branches: only same-repo, merged PR close events.
            // A ref is removed iff it still points to that exact merged PR head SHA.
            const closed = context.payload.pull_request;
            if (context.eventName === 'pull_request' && closed?.merged &&
                closed.head?.repo?.full_name === `${owner}/${repo}` &&
                /^agent\\/[A-Za-z0-9._/-]+$/.test(closed.head.ref) &&
                closed.head.ref !== 'main') {
              await removeWhenSafe({name:closed.head.ref,pr:closed.number,sha:closed.head.sha});
            }
