name: Cleanup merged short-lived OpenDesk branches

on:
  push:
    branches: [main, agent/native-agent-bridge-r1-20261008]
  pull_request:
    types: [closed]
    branches: [main, agent/native-agent-bridge-r1-20261008]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# Pull-request close and main-push events can arrive at the same instant.
concurrency:
  group: opendesk-verified-branch-cleanup
  cancel-in-progress: false

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only verified merged or superseded refs
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const candidates = [
              {name:'agent/sidebar-ui-r2-20261008-review',pr:8,sha:'e05bcd37017ff1b30620d798f4dc534399424c3f'},
              {name:'agent/sidebar-ui-r5-20261008',pr:9,sha:'d62d7c8ff35650c0d508f1180f43ea9a799eaf0a'},
              {name:'agent/sidebar-r41-sync-20261008-x8ttm7ta',pr:10,sha:'a3bb8a9a82e043d165107f239c0e2e1ba8f826ec'},
              {name:'agent/site-access-once-20261008-1647',pr:7,sha:'935dcb2a28560c0dc429e3b30aeb807297dfabf7',supersededBy:12},
              // Child PR #21 is merged into the *draft* Native integration branch, not into main.
              // Its exact verified head may be deleted only AFTER GitHub records this merge.
              {name:'agent/r62-acceptance-01a11c24',pr:21,sha:'91ed579ff1ba58c52905ab4c22ffd5f0442afee5'},
            ];
            async function removeWhenSafe(entry) {
              const request = await github.rest.pulls.get({owner,repo,pull_number:entry.pr});
              const pr = request.data;
              if (entry.supersededBy) {
                const replacement = (await github.rest.pulls.get({owner,repo,pull_number:entry.supersededBy})).data;
                if (pr.state !== 'closed' || !replacement.merged_at) {
                  core.info(`Keep ${entry.name}: replacement unmerged or original still open`);
                  return;
                }
              } else if (!pr.merged_at) {
                core.info(`Keep ${entry.name}: pull request is not merged`);
                return;
              }
              let existing;
              try {
                existing = (await github.rest.git.getRef({owner,repo,ref:`heads/${entry.name}`})).data;
              } catch (error) {
                if (error.status === 404) {core.info(`Already removed ${entry.name}`);return;}
                throw error;
              }
              if (entry.name === 'main' || existing.object.sha !== entry.sha) {
                core.info(`Keep ${entry.name}: HEAD changed since verified merge`);
                return;
              }
              try {
                await github.rest.git.deleteRef({owner,repo,ref:`heads/${entry.name}`});
                core.info(`Deleted completed branch ${entry.name}`);
              } catch (error) {
                // A second workflow may have deleted this ref after getRef().
                if (error.status === 404 ||
                    (error.status === 422 && /Reference does not exist/i.test(error.message))) {
                  core.info(`Already removed ${entry.name} (concurrent cleanup)`);
                  return;
                }
                throw error;
              }
            }
            for (const entry of candidates) await removeWhenSafe(entry);
            // Recover merged branches even if their PR close or main push CI was skipped.
            // Only same-repo agent branches with the *exact* merged PR head can be removed.
            const [closedPRs, liveBranches] = await Promise.all([
              github.paginate(github.rest.pulls.list, {owner, repo, state:'closed', per_page:100}),
              github.paginate(github.rest.repos.listBranches, {owner, repo, per_page:100})
            ]);
            const liveHeads = new Map(liveBranches.map(branch => [branch.name, branch.commit.sha]));
            for (const pr of closedPRs) {
              const name = pr.head?.ref;
              const sha = pr.head?.sha;
              if (!pr.merged_at || pr.head?.repo?.full_name !== `${owner}/${repo}` ||
                  !name?.startsWith('agent/') || !sha || liveHeads.get(name) !== sha) continue;
              await removeWhenSafe({name, pr:pr.number, sha});
            }
            // Future integration branches: only same-repo, merged PR close events.
            // A ref is removed iff it still points to that exact merged PR head SHA.
            // Explicit no-PR closeout: only delete an unchanged head after main contains its entire history.
            // This ref was retained after PR #55 joined its exact commit into main.
            const completedNoPrBranches = [
              {name:'agent/local-ai-r1-final-01a12158',sha:'2921401fbfa45321f89aaca5fac39a5a1d00defa'}
            ];
            const activePRs = await github.paginate(github.rest.pulls.list, {owner, repo, state:'open', per_page:100});
            for (const entry of completedNoPrBranches) {
              if (liveHeads.get(entry.name) !== entry.sha) {
                core.info(`Keep ${entry.name}: ref absent or SHA changed`);
                continue;
              }
              if (activePRs.some(pr => pr.head?.repo?.full_name === `${owner}/${repo}` && pr.head?.ref === entry.name)) {
                core.info(`Keep ${entry.name}: still used by an open PR`);
                continue;
              }
              const comparison = await github.rest.repos.compareCommits({owner, repo, base:entry.sha, head:'main'});
              if (comparison.data.behind_by !== 0) {
                core.info(`Keep ${entry.name}: branch contains commits absent from main`);
                continue;
              }
              let latest;
              try {
                latest = (await github.rest.git.getRef({owner, repo, ref:`heads/${entry.name}`})).data;
              } catch (error) {
                if (error.status === 404) {core.info(`Already removed ${entry.name}`); continue;}
                throw error;
              }
              if (latest.object.sha !== entry.sha) {core.info(`Keep ${entry.name}: HEAD changed`); continue;}
              try {
                await github.rest.git.deleteRef({owner, repo, ref:`heads/${entry.name}`});
                core.info(`Deleted verified no-PR ancestor ${entry.name}`);
              } catch (error) {
                if (error.status === 404 || (error.status === 422 && /Reference does not exist/i.test(error.message))) {
                  core.info(`Already removed ${entry.name} (concurrent cleanup)`);
                  continue;
                }
                throw error;
              }
            }
                        const closed = context.payload.pull_request;
            if (context.eventName === 'pull_request' && closed?.merged &&
                closed.head?.repo?.full_name === `${owner}/${repo}` &&
                closed.head.ref.startsWith('agent/') &&
                closed.head.ref !== 'main') {
              await removeWhenSafe({name:closed.head.ref,pr:closed.number,sha:closed.head.sha});
            }
