name: Web Flow v0.3 - validate and promote installable Sidebar package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webflow-package.yml'
      - 'projects/webflow/tool.config.json'
      - 'projects/webflow/app.ci.json'
      - 'projects/webflow/src/ui/**'
      - 'projects/webflow/tests/webflow-ui.test.mjs'
      - '!projects/webflow/*.opendesk-tool.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webflow-package-main
  cancel-in-progress: false

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing pinned dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify isolated source, original SDK delegation and no duplicate runners
        run: |
          node --check projects/webflow/src/ui/model.js
          node --check projects/webflow/src/ui/main.js
          node --test projects/webflow/tests/webflow-ui.test.mjs tests/environment/task-delegation-package.test.mjs
      - name: Build only through the original Sidebar Tool packager
        run: |
          node scripts/build-sidebar-tool.mjs projects/webflow --out artifacts/sidebar-tools/webflow/candidate.opendesk-tool.json
      - name: Promote identical tested bytes and check canonical project package
        run: |
          node scripts/build-sidebar-tool.mjs projects/webflow --promote-from artifacts/sidebar-tools/webflow/candidate.opendesk-tool.json
          node scripts/build-sidebar-tool.mjs projects/webflow --check-project
      # Push CI validates candidate bytes only; repo publication is an explicit manual action.
      - name: Publish only the verified package via GitHub's file-conditional Contents API
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer project UI source would make this tested candidate stale.
          git fetch origin main
          if ! git diff --quiet HEAD FETCH_HEAD -- projects/webflow/tool.config.json projects/webflow/src/ui; then
            echo 'Web Flow sources advanced during packaging; reject stale package'
            exit 1
          fi
          path=projects/webflow/webflow.opendesk-tool.json
          endpoint="repos/${GITHUB_REPOSITORY}/contents/${path}"
          existing="$(gh api "${endpoint}" --jq .sha 2>/dev/null || true)"
          expected="$(git hash-object "${path}")"
          if [ "${existing}" = "${expected}" ]; then
            echo 'Tested package already committed'
          else
            content="$(base64 -w0 "${path}")"
            if [ -n "${existing}" ]; then
              jq -n --arg message 'build(webflow): promote verified Sidebar app package' \
                --arg content "${content}" --arg sha "${existing}" \
                '{message:$message,content:$content,branch:"main",sha:$sha}' \
                | gh api "${endpoint}" --method PUT --input - --jq '.commit.sha'
            else
              jq -n --arg message 'build(webflow): promote verified Sidebar app package' \
                --arg content "${content}" \
                '{message:$message,content:$content,branch:"main"}' \
                | gh api "${endpoint}" --method PUT --input - --jq '.commit.sha'
            fi
          fi
          test "$(gh api "${endpoint}" --jq .sha)" = "${expected}"
          echo 'Committed tested package SHA matches local tested bytes'
      - name: Read back package status
        run: node scripts/build-sidebar-tool.mjs projects/webflow --check-project
