name: Stay Focus R1 - independent Chrome restrictions and native evidence

on:
  push:
    branches: [main]
    paths:
      - 'src/stay-focus/**'
      - 'src/entrypoints/stay-focus-controls.js'
      - 'src/entrypoints/page-relay.js'
      - 'src/entrypoints/blocked.js'
      - 'projects/stay-focus/**'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/sidebar-tools/**'
      - 'src/ui/tool.html'
      # Native installation follows the trusted React Extension Center, not retired HTML controls.
      - 'src/ui/tool-shell.js'
      - 'src/ui/extension-center.js'
      - 'src/ui/extension-center-model.js'
      - 'src/ui/sidebar-tools-view.js'
      - 'src/ui/sidebar-tools-fields.js'
      - 'src/ui/react/**'
      - 'src/sw.js'
      - 'src/platform/chrome/browser-managed-site-policy.js'
      - 'src/platform/chrome/managed-site-lifecycle.js'
      - 'src/platform/host/managed-site-authority.js'
      - 'tests/environment/managed-site-authority-r44.test.mjs'
      - 'tests/environment/managed-site-runtime-contract-r45.test.mjs'
      - 'src/platform/host/managed-site-runtime-contract.js'
      - 'src/marketplace/page.js'
      - 'tests/environment/stay-focus-r45-marketplace-admission.test.mjs'
      - 'tests/environment/browser-managed-site-policy-r44.test.mjs'
      - 'tests/environment/stay-focus-r44-transport.test.mjs'
      - 'tests/environment/stay-focus-r44-policy-review.test.mjs'
      - 'src/sidebar-tools/bridge.js'
      - 'src/sidebar-tools/bridge.js'
      - 'scripts/prepare-public.mjs'
      - 'scripts/build-contract.mjs'
      - 'scripts/bundle-provenance.mjs'
      - 'scripts/verify-package.mjs'
      - 'manifest.json'
      - 'official-tools/catalog.json'
      - 'tests/environment/stay-focus-extraction-r2.test.mjs'
      - 'tests/environment/stay-focus-installer-v3-upgrade-r121.test.mjs'
      - 'tests/environment/stay-focus-r41-policy-package.test.mjs'
      - 'tests/environment/stay-focus-r1.test.mjs'
      - 'tests/environment/extension-runtime-r14-lifecycle.test.mjs'
      - 'tests/environment/stay-focus-service-r1.test.mjs'
      - 'tests/environment/stay-focus-boundary-r1.test.mjs'
      - 'tests/environment/fixed-entries-audit.test.mjs'
      - 'tests/framework/stay-focus-r1-native.test.mjs'
      - '.github/workflows/stay-focus-r1.yml'
  workflow_dispatch:

# Preserve each candidate's native result despite frequent parallel main pushes.
# A branch-level group replaces queued runs, even with cancel-in-progress: false;
# isolate by exact Git SHA so a pending Chrome acceptance is not silently dropped.
concurrency:
  group: stay-focus-r1-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile audited Stay Focus React IIFE with source-bound build receipt
        run: node scripts/build-stay-focus-react.mjs
      - name: Stay Focus portable preview - executable syntax and exact source parity
        run: |
          node --check projects/stay-focus/preview/build.mjs
          node projects/stay-focus/preview/build.mjs --check
          node --check projects/stay-focus/src/main.js
      - name: Strict policy, time, DNR and component assertions
        run: |
          node --test tests/environment/managed-site-runtime-contract-r45.test.mjs tests/environment/extension-runtime-r14-lifecycle.test.mjs tests/environment/stay-focus-r45-marketplace-admission.test.mjs tests/environment/managed-site-authority-r44.test.mjs tests/environment/stay-focus-r44-transport.test.mjs tests/environment/stay-focus-r44-policy-review.test.mjs tests/environment/browser-managed-site-policy-r44.test.mjs tests/environment/stay-focus-r41-policy-package.test.mjs tests/environment/stay-focus-r1.test.mjs tests/environment/stay-focus-service-r1.test.mjs tests/environment/stay-focus-boundary-r1.test.mjs tests/environment/stay-focus-extraction-r2.test.mjs tests/environment/stay-focus-build-ready-r58.test.mjs
          node --check tests/framework/stay-focus-r1-native.test.mjs
      - name: Bind actual v3 React package to existing Installer mock-Native transaction
        run: node scripts/build-stay-focus-app.mjs --reuse-compiled
      - name: Build independent user-installable Stay Focus release
        run: |
          npm run build:sidebar-tool -- projects/stay-focus
          version=$(node -p "JSON.parse(require('fs').readFileSync('projects/stay-focus/tool.config.json','utf8')).version")
          test -s "artifacts/sidebar-tools/stay-focus/$version/stay-focus.opendesk-tool.json"
          sha256sum "artifacts/sidebar-tools/stay-focus/$version/stay-focus.opendesk-tool.json"
      # Staging is confined to the throwaway CI checkout. The committed official
      # JSON is NOT published here; Native/Release retain separate acceptance.
      # Verify the already Node-tested React candidate through the original
      # promotion and source-identity gate before running WXT's official packer.
      # The reverse order wrongly checks a stale committed JSON (28393 bytes)
      # against a newly compiled candidate and blocks all independent evidence.
      - name: Stage Node-tested Stay Focus candidate for full build (CI only)
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('projects/stay-focus/tool.config.json','utf8')).version")
          candidate="artifacts/sidebar-tools/stay-focus/$version/stay-focus.opendesk-tool.json"
          npm run build:sidebar-tool -- projects/stay-focus --promote-from "$candidate"
          npm run build:sidebar-tool -- projects/stay-focus --check-project
          cmp "$candidate" projects/stay-focus/stay-focus.opendesk-tool.json
          test "$(find projects/stay-focus -maxdepth 1 -name '*.opendesk-tool.json' | wc -l)" -eq 1
          sha256sum projects/stay-focus/stay-focus.opendesk-tool.json
      - name: Full source security and both production/development WXT packages
        run: |
          npm run check
          npm run build
          npm run build:dev
          npm run verify
          sha256sum dist/production/sw.js
          wc -c dist/production/sw.js
          sha256sum dist/production/official-tools/stay-focus/stay-focus.opendesk-tool.json
          cmp "artifacts/sidebar-tools/stay-focus/$(node -p "JSON.parse(require('fs').readFileSync('projects/stay-focus/tool.config.json','utf8')).version")/stay-focus.opendesk-tool.json" \
            dist/production/official-tools/stay-focus/stay-focus.opendesk-tool.json
      - name: Preserve exact candidate for native Mac (not acceptance yet)
        uses: actions/upload-artifact@v4
        with:
          name: stay-focus-r1-validated-package-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/production/
            artifacts/sidebar-tools/stay-focus/
            projects/stay-focus/stay-focus.opendesk-tool.json
            docs/framework/evidence/wxt/builds/build-production.json
            docs/framework/evidence/wxt/builds/build-development.json
      - name: Preserve source/build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stay-focus-r1-build-failure-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/sidebar-tools/stay-focus/
            docs/framework/evidence/wxt/builds/
  cross-app-release-gate:
    # A stale AdBlock/official-catalog release MUST still fail this workflow,
    # but must not prevent independent Stay Focus source and native evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      # This cross-app gate packs actual official sources, including their
      # source-bound React build receipts. A clean checkout has no dist/ files.
      - name: Compile official React tools for the catalog audit
        run: |
          node scripts/build-adblock-react.mjs
          node scripts/build-stay-focus-react.mjs
          node scripts/build-cookie-editor-react.mjs
          npm run build --prefix examples/sidebar-tools/ai-vip-share
      - name: Audit all official tools and fixed-entry ownership (release blocker)
        run: |
          node --test tests/environment/official-tools-catalog-r45.test.mjs tests/environment/fixed-entries-audit.test.mjs
  native-mac-chrome:
    needs: source-and-build
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The native test imports Vite and the installed tool packer; an isolated
      # macOS runner cannot reuse Linux node_modules from the build job.
      - name: Install pinned packages for native acceptance
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: stay-focus-r1-validated-package-${{ github.sha }}
          path: .
      - name: Confirm actual candidate identity
        run: |
          test -s dist/production/manifest.json
          shasum -a 256 dist/production/sw.js
          shasum -a 256 dist/production/official-tools/stay-focus/stay-focus.opendesk-tool.json
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
      - name: Native Chrome real installation, HTTP DNR restriction and removal
        env:
          OPENDESK_STAY_FOCUS_NATIVE: '1'
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          OPENDESK_FOCUS_NATIVE_EVIDENCE: artifacts/stay-focus-r1-native
        run: node --test tests/framework/stay-focus-r1-native.test.mjs
      - name: Preserve raw native evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stay-focus-r1-native-chrome-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/stay-focus-r1-native/
