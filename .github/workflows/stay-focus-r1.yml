name: Stay Focus R1 - independent Chrome restrictions and native evidence

on:
  push:
    branches: [main]
    paths:
      - 'src/stay-focus/**'
      - 'src/entrypoints/stay-focus-controls.js'
      - 'src/entrypoints/page-relay.js'
      - 'src/entrypoints/blocked.js'
      - 'examples/sidebar-tools/stay-focus/**'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/sidebar-tools/**'
      - 'src/ui/tool.html'
      - 'src/sw.js'
      - 'src/sidebar-tools/bridge.js'
      - 'scripts/prepare-public.mjs'
      - 'scripts/build-contract.mjs'
      - 'scripts/verify-package.mjs'
      - 'manifest.json'
      - 'official-tools/catalog.json'
      - 'tests/environment/stay-focus-r1.test.mjs'
      - 'tests/environment/stay-focus-service-r1.test.mjs'
      - 'tests/environment/fixed-entries-audit.test.mjs'
      - 'tests/framework/stay-focus-r1-native.test.mjs'
      - '.github/workflows/stay-focus-r1.yml'
  workflow_dispatch:

# Preserve each candidate's native result despite frequent parallel main pushes.
# A branch-level group replaces queued runs, even with cancel-in-progress: false;
# isolate by exact Git SHA so a pending Chrome acceptance is not silently dropped.
concurrency:
  group: stay-focus-r1-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict policy, time, DNR and component assertions
        run: |
          node --test tests/environment/stay-focus-r1.test.mjs tests/environment/stay-focus-service-r1.test.mjs tests/environment/official-tools-catalog-r45.test.mjs tests/environment/fixed-entries-audit.test.mjs
          node --check tests/framework/stay-focus-r1-native.test.mjs
      - name: Build independent user-installable Stay Focus release
        run: |
          npm run build:sidebar-tool -- examples/sidebar-tools/stay-focus
          version=$(node -p "JSON.parse(require('fs').readFileSync('examples/sidebar-tools/stay-focus/tool.config.json','utf8')).version")
          test -s "artifacts/sidebar-tools/stay-focus/$version/stay-focus.opendesk-tool.json"
          sha256sum "artifacts/sidebar-tools/stay-focus/$version/stay-focus.opendesk-tool.json"
      - name: Full source security and both production/development WXT packages
        run: |
          npm run check
          npm run build
          npm run build:dev
          npm run verify
          sha256sum dist/production/sw.js
          wc -c dist/production/sw.js
          sha256sum dist/production/official-tools/stay-focus/stay-focus.opendesk-tool.json
      - name: Preserve exact candidate for native Mac (not acceptance yet)
        uses: actions/upload-artifact@v4
        with:
          name: stay-focus-r1-validated-package-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/production/
            artifacts/sidebar-tools/stay-focus/
            docs/framework/evidence/wxt/builds/build-production.json
            docs/framework/evidence/wxt/builds/build-development.json
      - name: Preserve source/build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stay-focus-r1-build-failure-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/sidebar-tools/stay-focus/
            docs/framework/evidence/wxt/builds/
  native-mac-chrome:
    needs: source-and-build
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: stay-focus-r1-validated-package-${{ github.sha }}
          path: .
      - name: Confirm actual candidate identity
        run: |
          test -s dist/production/manifest.json
          shasum -a 256 dist/production/sw.js
          shasum -a 256 dist/production/official-tools/stay-focus/stay-focus.opendesk-tool.json
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
      - name: Native Chrome real installation, HTTP DNR restriction and removal
        env:
          OPENDESK_STAY_FOCUS_NATIVE: '1'
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          OPENDESK_FOCUS_NATIVE_EVIDENCE: artifacts/stay-focus-r1-native
        run: node --test tests/framework/stay-focus-r1-native.test.mjs
      - name: Preserve raw native evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stay-focus-r1-native-chrome-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/stay-focus-r1-native/
