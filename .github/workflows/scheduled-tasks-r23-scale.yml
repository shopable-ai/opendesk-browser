name: Scheduled Tasks R2.3 native IndexedDB scale

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-tasks-r23-scale.yml'
      - 'tests/framework/scheduled-tasks-r23-scale-*.js'
      - 'tests/framework/scheduled-tasks-r23-scale-*.mjs'
      - 'src/platform/tasks/schedule-*.js'
      - 'src/platform/storage/idb.js'
      - 'src/platform/storage/index.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-r23-scale-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-idb-scale:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            image: ubuntu-latest
          - platform: macos
            image: macos-15
    runs-on: ${{ matrix.image }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked source dependencies for native launcher
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
      - name: Validate benchmark source syntax
        run: |
          node --check tests/framework/scheduled-tasks-r23-scale-browser.js
          node --check tests/framework/scheduled-tasks-r23-scale-native.test.mjs
      - name: Native isolated Chrome 1000, 10000 and 100000 IndexedDB
        env:
          SCHEDULE_NATIVE_SCALE: '1'
          SCHEDULE_NATIVE_PLATFORM: ${{ matrix.platform == 'linux' && 'linux' || 'darwin' }}
          SCHEDULE_NATIVE_CI_NO_SANDBOX: ${{ matrix.platform == 'linux' && '1' || '0' }}
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          SCHEDULE_NATIVE_OUT: artifacts/r23-native-idb-${{ matrix.platform }}
        run: node --test tests/framework/scheduled-tasks-r23-scale-native.test.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-r23-native-idb-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/r23-native-idb-${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 14
