name: Workflow R33.3.6 React source-bound preview
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/react/tabs/workflow.tsx'
      - 'src/ui/react/components/conversation.tsx'
      - 'src/ui/react/main.tsx'
      - 'src/ui/workflow/workflow-view.js'
      - 'src/ui/react/preview/workflow-preview.tsx'
      - 'src/ui/tool.html'
      - 'src/ui/tool-shell.css'
      - 'src/ui/design-tokens.css'
      - 'src/ui/design-system.css'
      - 'scripts/preview/build-workflow-react-preview.mjs'
      - 'scripts/preview/build-sidebar-six-react-preview.mjs'
      - 'scripts/tests/workflow-source-preview-browser.mjs'
      - 'scripts/tests/react-sidebar-r3331-browser.mjs'
      - 'tests/environment/workflow-react-preview-contract.test.mjs'
      - 'tests/environment/workflow-fixtures.test.mjs'
      - 'examples/tasks/workflow-*.html'
      - 'scripts/tests/workflow-fixtures-browser.mjs'
      - 'tests/environment/workflow-react-page.test.mjs'
      - 'tests/environment/workflow-direct-execution.test.mjs'
      - 'tests/environment/workflow-focus.test.mjs'
      - 'prototypes/sidebar/workflow/react-preview/**'
      - 'prototypes/sidebar/react-preview/**'
      - '.github/workflows/workflow-react-preview-r3336.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  workflow-react-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate exact React and tool.html offline preview
        run: node scripts/preview/build-workflow-react-preview.mjs
      - name: Source-drift guard and focused contracts
        run: |
          node scripts/preview/build-workflow-react-preview.mjs --check
          # Workflow-specific regression; generic React contracts also run in the package job.
          node --test tests/environment/workflow-react-preview-contract.test.mjs tests/environment/workflow-ui-states.test.mjs
      - name: R23.16 risk-scoped Run and AI admission regression
        run: node --test tests/environment/workflow-react-page.test.mjs tests/environment/workflow-direct-execution.test.mjs
      - name: Browser Test Lab search/commerce fixture contracts
        run: node --test tests/environment/workflow-fixtures.test.mjs
      - name: Browser Test Lab real Chromium DOM interaction (not RunHost)
        run: node scripts/tests/workflow-fixtures-browser.mjs
      - name: Six-tab React source-bound integration preview
        run: |
          node scripts/preview/build-sidebar-six-react-preview.mjs
          node scripts/preview/build-sidebar-six-react-preview.mjs --check
      - name: Source-bound Workflow HTML interaction in real Chromium
        run: node scripts/tests/workflow-source-preview-browser.mjs
      - name: Real Chrome offline preview DOM and 360px screenshot
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p artifacts/workflow-react-preview
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --virtual-time-budget=3500 \
            --dump-dom "file://$PWD/prototypes/sidebar/workflow/react-preview/index.html" \
            > artifacts/workflow-react-preview/dom.txt
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const dom=readFileSync('artifacts/workflow-react-preview/dom.txt','utf8');
          const checks=['data-workflow-preview-ready="true"','data-preview-scenario',
            'id="od-workflow-preview-stage"','id="od-workflow-preview-controls"',
            'workflow-sheet-overlay','SOURCE_BOUND_UI_PREVIEW'];
          console.log('OFFLINE_CHROME_DOM_BYTES='+Buffer.byteLength(dom));
          for(const match of checks)
            console.log('OFFLINE_DOM_'+match+'='+dom.includes(match));
          console.log('OFFLINE_DOM_ROOT='+dom.slice(0,280));
          console.log('OFFLINE_DOM_END='+dom.slice(-280));
          JS
          grep -q 'data-workflow-preview-ready="true"' artifacts/workflow-react-preview/dom.txt
          grep -q 'data-preview-scenario' artifacts/workflow-react-preview/dom.txt
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --virtual-time-budget=3500 --window-size=520,950 \
            --screenshot="$PWD/artifacts/workflow-react-preview/360.png" \
            "file://$PWD/prototypes/sidebar/workflow/react-preview/index.html"
          test -s artifacts/workflow-react-preview/360.png
      - name: Upload exact offline HTML, diagnostic DOM and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-react-r3336-offline-${{ github.sha }}
          path: |
            prototypes/sidebar/workflow/react-preview/index.html
            artifacts/workflow-react-preview/360.png
            artifacts/workflow-react-preview/dom.txt
          retention-days: 14
      - name: Publish tested HTML as detached Git blob (no main write)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const file=await readFile('prototypes/sidebar/workflow/react-preview/index.html');
          const response=await fetch(
            'https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs',{
              method:'POST',
              headers:{
                Authorization:'Bearer '+process.env.GITHUB_TOKEN,
                Accept:'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28',
                'Content-Type':'application/json'
              },
              body:JSON.stringify({content:file.toString('base64'),encoding:'base64'})
            });
          const result=await response.json();
          if(!response.ok||!(/^[0-9a-f]{40}$/.test(result.sha||'')))
            throw Error('E_PREVIEW_BLOB_UPLOAD: '+response.status+' '+JSON.stringify(result));
          console.log('R3336_VERIFIED_PREVIEW_BLOB_SHA='+result.sha);
          console.log('R3336_VERIFIED_PREVIEW_BYTES='+file.length);
          JS
      # Preserve the broad source JSX integration check. Its unrelated page
      # failures must not erase independently verified Workflow HTML evidence.
      - name: Shared source JSX in Chromium (all product tabs)
        run: node scripts/tests/react-sidebar-r3331-browser.mjs

  workflow-focused-controller:
    needs: workflow-react-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Active RunHost history is guarded in the real Workflow Controller
        run: |
          node --experimental-vm-modules --test --test-name-pattern="component: active RunHost blocks" tests/environment/workflow-focus.test.mjs
      - name: Full Workflow Controller component suite
        run: node --experimental-vm-modules --test tests/environment/workflow-focus.test.mjs

  workflow-package-regression:
    needs: workflow-focused-controller
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Source check (exact candidate)
        run: npm run check
      - name: Workflow focused Node contracts
        if: always()
        run: |
          node --test \
            tests/environment/react-sidebar-r333.test.mjs \
            tests/environment/workflow-react-preview-contract.test.mjs \
            tests/environment/workflow-ui-states.test.mjs \
            tests/environment/workflow-focus.test.mjs \
            tests/environment/workflow-ai-data-sharing.test.mjs \
            tests/environment/workflow-ai-observation.test.mjs \
            tests/environment/workflow-local-codex.test.mjs \
            tests/environment/workflow-provider-facade.test.mjs \
            tests/environment/workflow-direct-execution.test.mjs
      - name: Production WXT
        if: always()
        run: npm run build
      - name: Development WXT
        if: always()
        run: npm run build:dev
      - name: Production and development verification
        if: always()
        run: npm run verify
      - name: Fixed-entry and service worker budget
        if: always()
        run: npm run build:size
