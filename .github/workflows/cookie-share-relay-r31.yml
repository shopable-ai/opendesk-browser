name: cookie-share-relay-r31
on:
  push:
    branches: [main]
    paths:
      - 'services/cookie-share-relay/**'
      - 'examples/sidebar-tools/cookie-editor/trusted/account-share.js'
      - 'examples/sidebar-tools/cookie-editor/trusted/account-contract.js'
      - 'examples/sidebar-tools/cookie-editor/trusted/account-vault.js'
      - 'tests/environment/cookie-editor-account-share.test.mjs'
      - '.github/workflows/cookie-share-relay-r31.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test real HTTP endpoints and SQLite persistence
        run: node --test services/cookie-share-relay/server.test.mjs
      # Full trusted Host remains in the existing Cookie Editor workflow.
      # This dependency-free job checks the real Relay client and storage fences;
      # it does not stand in for TLS, Chromium or two-device login validation.
      - name: Verify configuration share integration, URL contract and account Vault
        run: |
          node --test tests/environment/cookie-editor-account-switch-url.test.mjs \
            tests/environment/cookie-editor-account-vault.test.mjs \
            tests/environment/cookie-editor-account-share.test.mjs
