      - 'projects/webflow/tests/task-intent-v2.test.mjs'
      - 'projects/webflow/tests/task-v2-live-ledger.test.mjs'
      - 'projects/webflow/tests/background-execution-view.test.mjs'
      - 'task-packs/baidu.search/src/baidu-search-top3.js'
      - 'task-packs/baidu.search/releases/baidu.search.top3.v1.opendesk-task.json'
      - 'examples/tasks/page.read.fixed.v1.opendesk-task.json'
      - 'tests/environment/chatgpt-*-bridge-*.test.mjs'
      - 'tests/environment/chatgpt-fixed-page-r11.test.mjs'
      - 'tests/environment/chatgpt-task-request-r1.test.mjs'
      - 'tests/environment/baidu-search-top3-r1.test.mjs'
      - '.github/workflows/chatgpt-baidu-bridge-r20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JS syntax check for trusted Bridge
        run: |
          node --check src/native-agent/chatgpt-bridge-trigger-gate.js
          node --check src/native-agent/chatgpt-fixed-bridge-page.js
          node --check src/native-agent/chatgpt-bridge-site.js
          node --check projects/webflow/tests/sidebar-bridge.test.mjs
          node --check projects/webflow/trusted/chatgpt-bridge-page.js
          node --check projects/webflow/trusted/legacy-chatgpt-panel.js
          node --check src/native-agent/chatgpt-fixed-bridge-host.js
          node --check projects/webflow/src/task-intent-contract.js
          node --check src/page-events/generic-task-adapter.js
          node --check src/native-agent/chatgpt-task-request.js
          node --check src/native-agent/webflow-v2-target.js
          node --check src/native-agent/webflow-v2-entry.js
          node --check src/platform/host/controller-target-retention.js
          node --check src/platform/host/controller-retained-continuation.js
          node --check src/run-host.js
          node --check projects/webflow/tests/controller-retained-continuation.test.mjs
          node --check projects/webflow/tests/runhost-retained-forward.test.mjs
          node --check src/platform/host/controller-methods.js
          node --check src/platform/tasks/contract.js
          node --check src/platform/tasks/service.js
          node --check task-packs/chatgpt.conversation.create/src/chatgpt-conversation-create.js
          node --check task-packs/chatgpt.conversation.create/src/chatgpt-conversation-create-v0.2.js
          node --check task-packs/chatgpt.conversation.create/src/chatgpt-conversation-create-v0.3.js
          node --check projects/webflow/tests/chatgpt-continuation-task.test.mjs
          node --check projects/webflow/tests/chatgpt-send-task.test.mjs
          node --check projects/webflow/src/chatgpt-conversation-result.js
          node --check projects/webflow/src/chatgpt-conversation-result-v0.3.js
          node --check projects/webflow/trusted/chatgpt-result-adapter-v0.3.js
          node --check projects/webflow/tests/chatgpt-v3-result.test.mjs
          node --check projects/webflow/trusted/chatgpt-b-prepare-stage.js
          node --check projects/webflow/tests/chatgpt-b-prepare-stage.test.mjs
          node --check projects/webflow/tests/chatgpt-b-prepare-ingress.test.mjs
          node --check projects/webflow/src/github-issue-input.js
          node --check projects/webflow/trusted/chatgpt-result-adapter.js
          node --check projects/webflow/trusted/chat-handoff-receipt.js
          node --check projects/webflow/trusted/issue-workflow-authorization.js
          node --check projects/webflow/trusted/issue-workflow-auth-host.js
          node --check projects/webflow/tests/issue-workflow-auth-host.test.mjs
          node --check src/sw.js
          node --check projects/webflow/tests/issue-workflow-authorization.test.mjs
          node --check projects/webflow/tests/chatgpt-create-result.test.mjs
          node --check projects/webflow/trusted/md-run-ledger.js
          node --check projects/webflow/tests/md-run-ledger.test.mjs
          node --check projects/webflow/trusted/md-run-receipt.js
          node --check projects/webflow/tests/md-run-receipt.test.mjs
          node --check projects/webflow/trusted/md-native-artifacts.js
          node --check projects/webflow/tests/md-native-artifacts.test.mjs
          node --check projects/webflow/trusted/md-workflow-engine.js
          node --check projects/webflow/tests/md-workflow-engine.test.mjs
          node --check projects/webflow/src/md-run-contract.js
          node --check src/native-agent/chatgpt-background-adapter.js
          node --check src/native-agent/workspace-chatgpt.js
          node --check src/page-events/web-task-ingress.js
          node --check projects/webflow/tests/task-v2-live-ledger.test.mjs
          node --check tests/environment/chatgpt-baidu-bridge-r20.test.mjs
      - name: Workflow-wide one-time reviewed GitHub A2B2A scope and revocation (Node, not Chrome)
        run: node --test projects/webflow/tests/issue-workflow-authorization.test.mjs projects/webflow/tests/issue-workflow-auth-host.test.mjs
      - name: WebFlow R10 exact source admission and original ingress regression (Node, not Chrome)
        run: |
          # The full cross-project provenance suite currently has unrelated
          # AI Proxy / Bookmark / Time Review / TOC baseline failures; never
          # loosen those safety pins or mask a failure of this workflow's pins.
          node --test --test-name-pattern='A2B2A capability grant source is pinned|R10 reviewed Issue business grant adapter' tests/environment/bundle-provenance.test.mjs
          node --test tests/environment/web-task-ingress.test.mjs
      - name: WebFlow two-step operation fences (Node, not Chrome)
        run: node --test projects/webflow/tests/serial-two-step-run.test.mjs
      - name: One-shot retained-target continuation provenance (Node, not Chrome)
        run: node --test projects/webflow/tests/controller-retained-continuation.test.mjs projects/webflow/tests/runhost-retained-forward.test.mjs
      - name: ChatGPT immutable version upgrade and send contracts (Node, not Chrome)
        run: |
          node --test \
            projects/webflow/tests/chatgpt-draft-task.test.mjs \
            projects/webflow/tests/chatgpt-send-task.test.mjs \
            projects/webflow/tests/chatgpt-continuation-task.test.mjs \
            projects/webflow/tests/chatgpt-v3-result.test.mjs \
            projects/webflow/tests/chatgpt-b-prepare-stage.test.mjs \
            projects/webflow/tests/chatgpt-b-prepare-ingress.test.mjs \
            projects/webflow/tests/chatgpt-create-result.test.mjs \
            projects/webflow/tests/chat-handoff-contract.test.mjs \
            projects/webflow/tests/github-issue-input.test.mjs \
            projects/webflow/tests/chat-handoff-receipt.test.mjs \
            projects/webflow/tests/task-intent-v2.test.mjs \
            projects/webflow/tests/md-run-ledger.test.mjs \
            projects/webflow/tests/md-run-receipt.test.mjs \
            projects/webflow/tests/md-native-artifacts.test.mjs \
            projects/webflow/tests/md-workflow-engine.test.mjs \
            projects/webflow/tests/md-run-contract.test.mjs \
            projects/webflow/tests/md-workflow.test.mjs \
            tests/environment/task-builtin-initialization.test.mjs
            # MD ledger uses only the original transaction API, no Chrome mocks in production.

      - name: Existing fixed and new Baidu business contracts (not native Chrome)
        run: |
          node --test \
            tests/environment/chatgpt-task-request-r1.test.mjs \
            tests/environment/generic-task-adapter.test.mjs \
            projects/webflow/tests/task-intent-contract.test.mjs \
            tests/environment/chatgpt-fixed-page-r11.test.mjs \
            tests/environment/baidu-search-top3-r1.test.mjs \
            tests/environment/chatgpt-fixed-bridge-r12.test.mjs \
            tests/environment/chatgpt-fixed-bridge-r13.test.mjs \
            tests/environment/chatgpt-baidu-bridge-r20.test.mjs \
            tests/environment/webflow-fixed-source.test.mjs \
            projects/webflow/tests/chatgpt-legacy-panel.test.mjs \
            projects/webflow/tests/sidebar-bridge.test.mjs \
            projects/webflow/tests/task-intent-v2.test.mjs \
            projects/webflow/tests/task-v2-live-ledger.test.mjs \
            projects/webflow/tests/background-execution-view.test.mjs \
            projects/webflow/tests/controller-retained-target.test.mjs \
            projects/webflow/tests/chatgpt-background-ingress.test.mjs \
            projects/webflow/tests/auto-grants.test.mjs \
            projects/webflow/tests/chatgpt-draft-task.test.mjs \
            projects/webflow/tests/chatgpt-send-task.test.mjs
      - name: Production extension build (not native Chrome)
        run: npm run build
      - name: Verify production package contract
        run: node scripts/verify-package.mjs dist/production

  # Independent R10 gate: preserve the historic broad bridge matrix even
  # when an unchanged ChatGPT 0.3 PREPARE/SUBMIT test currently fails.
  # Never use continue-on-error to hide a broken R10 grant or trusted source.
  r10-reviewed-fixed-task-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R10 exact business authority and original ingress contracts
        run: |
          node --test projects/webflow/tests/issue-workflow-authorization.test.mjs projects/webflow/tests/issue-workflow-auth-host.test.mjs
          node --test --test-name-pattern='A2B2A capability grant source is pinned|R10 reviewed Issue business grant adapter' tests/environment/bundle-provenance.test.mjs
          node --test tests/environment/web-task-ingress.test.mjs
      - name: R11 full reply, exact send review and read-only original A recovery
        run: |
          node --test projects/webflow/tests/chatgpt-send-task.test.mjs projects/webflow/tests/chatgpt-create-result.test.mjs projects/webflow/tests/current-task.test.mjs projects/webflow/tests/auto-settings-ui.test.mjs tests/environment/webflow-fixed-source.test.mjs
          node --test --test-name-pattern='^R11 ' projects/webflow/tests/chatgpt-background-ingress.test.mjs projects/webflow/tests/reply-admission.test.mjs projects/webflow/tests/sidebar-bridge.test.mjs
      - name: Original serial two-step no replay and ChatGPT 0.2.0 compatible Tasks
        run: node --test projects/webflow/tests/serial-two-step-run.test.mjs projects/webflow/tests/chatgpt-send-task.test.mjs projects/webflow/tests/chatgpt-create-result.test.mjs projects/webflow/tests/chat-handoff-receipt.test.mjs tests/environment/task-builtin-initialization.test.mjs
      - name: Legacy Baidu business regression (record failures independently)
        run: node --test tests/environment/baidu-search-top3-r1.test.mjs
      - name: Legacy Google business regression (not blocked by Baidu)
        if: ${{ always() }}
        run: node --test task-packs/google.search/tests/google-search-actions.test.mjs
      - name: Independent immutable Task pack and cross-consumer result contracts
        run: |
          node --test tests/environment/independent-task-pack-identity.test.mjs tests/environment/independent-chatgpt-result-provenance.test.mjs
          node --test task-packs/baidu.search/tests/search-actions.test.mjs task-packs/google.search/tests/google-search-actions.test.mjs
      - name: Original trusted fixed entry production build (not native Chrome)
        id: r10_build
        if: ${{ always() }}
        run: npm run build
      - name: Verify production package contract (not native Chrome)
        if: ${{ always() && steps.r10_build.outcome == 'success' }}
        run: node scripts/verify-package.mjs dist/production
