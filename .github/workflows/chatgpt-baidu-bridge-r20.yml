      - 'task-packs/chatgpt.conversation.create/releases/chatgpt.conversation.create.0.2.0.opendesk-task.json'
      - 'projects/webflow/tests/chatgpt-send-task.test.mjs'
      - 'projects/webflow/tests/chatgpt-continuation-task.test.mjs'
