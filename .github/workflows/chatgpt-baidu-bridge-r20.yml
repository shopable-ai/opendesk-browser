name: AI Chat Bridge R2.0 — pinned Baidu + fixed Task contracts

on:
  push:
    branches: [main]
    paths:
      - 'src/native-agent/chatgpt-bridge-trigger-gate.js'
      - 'src/native-agent/chatgpt-fixed-bridge-page.js'
      - 'projects/webflow/trusted/chatgpt-bridge-page.js'
      - 'projects/webflow/trusted/legacy-chatgpt-panel.js'
      - 'scripts/bundle-provenance.mjs'
      - 'tests/environment/webflow-fixed-source.test.mjs'
      - 'projects/webflow/tests/chatgpt-legacy-panel.test.mjs'
      - 'src/native-agent/chatgpt-fixed-bridge-host.js'
      - 'src/native-agent/chatgpt-task-request.js'
      - 'src/native-agent/webflow-v2-target.js'
      - 'src/platform/tasks/contract.js'
      - 'src/platform/host/controller-methods.js'
      - 'src/platform/host/controller-target-retention.js'
      - 'projects/webflow/tests/controller-retained-target.test.mjs'
      - 'projects/webflow/tests/chatgpt-background-ingress.test.mjs'
      - 'projects/webflow/tests/auto-grants.test.mjs'
      - 'projects/webflow/src/tasks/chatgpt-conversation-create.js'
      - 'projects/webflow/tasks/chatgpt.conversation.create.v1.opendesk-task.json'
      - 'projects/webflow/tests/chatgpt-draft-task.test.mjs'
      - 'projects/webflow/src/tasks/chatgpt-conversation-create-v0.2.js'
      - 'projects/webflow/tasks/chatgpt.conversation.create.0.2.0.opendesk-task.json'
      - 'projects/webflow/tests/chatgpt-send-task.test.mjs'
      - 'projects/webflow/src/chatgpt-conversation-result.js'
      - 'projects/webflow/src/github-issue-input.js'
      - 'projects/webflow/trusted/chat-handoff-receipt.js'
      - 'projects/webflow/tests/chat-handoff-receipt.test.mjs'
      - 'projects/webflow/tests/github-issue-input.test.mjs'
      - 'projects/webflow/src/chat-handoff-contract.js'
      - 'projects/webflow/tests/chat-handoff-contract.test.mjs'
      - 'projects/webflow/tests/chatgpt-create-result.test.mjs'
      - 'projects/webflow/trusted/md-run-ledger.js'
      - 'projects/webflow/tests/md-run-ledger.test.mjs'
      - 'projects/webflow/trusted/md-run-receipt.js'
      - 'projects/webflow/tests/md-run-receipt.test.mjs'
      - 'projects/webflow/trusted/md-native-artifacts.js'
      - 'projects/webflow/tests/md-native-artifacts.test.mjs'
      - 'projects/webflow/trusted/md-workflow-engine.js'
      - 'projects/webflow/tests/md-workflow-engine.test.mjs'
      - 'projects/webflow/src/md-run-contract.js'
      - 'projects/webflow/tests/md-run-contract.test.mjs'
      - 'projects/webflow/tests/md-workflow.test.mjs'
      - 'src/platform/tasks/builtin-releases.js'
      - 'src/platform/tasks/service.js'
      - 'tests/environment/task-builtin-initialization.test.mjs'
      - 'src/native-agent/chatgpt-background-adapter.js'
      - 'src/native-agent/workspace-chatgpt.js'
      - 'src/page-events/web-task-ingress.js'
      - 'projects/webflow/trusted/CurrentTask.tsx'
      - 'projects/webflow/tests/task-intent-v2.test.mjs'
      - 'projects/webflow/tests/task-v2-live-ledger.test.mjs'
      - 'projects/webflow/tests/background-execution-view.test.mjs'
      - 'examples/tasks/baidu-search-top3.js'
      - 'examples/tasks/baidu.search.top3.v1.opendesk-task.json'
      - 'examples/tasks/page.read.fixed.v1.opendesk-task.json'
      - 'tests/environment/chatgpt-*-bridge-*.test.mjs'
      - 'tests/environment/chatgpt-fixed-page-r11.test.mjs'
      - 'tests/environment/chatgpt-task-request-r1.test.mjs'
      - 'tests/environment/baidu-search-top3-r1.test.mjs'
      - '.github/workflows/chatgpt-baidu-bridge-r20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JS syntax check for trusted Bridge
        run: |
          node --check src/native-agent/chatgpt-bridge-trigger-gate.js
          node --check src/native-agent/chatgpt-fixed-bridge-page.js
          node --check projects/webflow/trusted/chatgpt-bridge-page.js
          node --check projects/webflow/trusted/legacy-chatgpt-panel.js
          node --check src/native-agent/chatgpt-fixed-bridge-host.js
          node --check src/native-agent/webflow-v2-target.js
          node --check src/platform/host/controller-target-retention.js
          node --check src/platform/host/controller-methods.js
          node --check src/platform/tasks/contract.js
          node --check src/platform/tasks/service.js
          node --check projects/webflow/src/tasks/chatgpt-conversation-create.js
          node --check projects/webflow/src/tasks/chatgpt-conversation-create-v0.2.js
          node --check projects/webflow/tests/chatgpt-send-task.test.mjs
          node --check projects/webflow/src/chatgpt-conversation-result.js
          node --check projects/webflow/src/github-issue-input.js
          node --check projects/webflow/trusted/chat-handoff-receipt.js
          node --check projects/webflow/tests/chatgpt-create-result.test.mjs
          node --check projects/webflow/trusted/md-run-ledger.js
          node --check projects/webflow/tests/md-run-ledger.test.mjs
          node --check projects/webflow/trusted/md-run-receipt.js
          node --check projects/webflow/tests/md-run-receipt.test.mjs
          node --check projects/webflow/trusted/md-native-artifacts.js
          node --check projects/webflow/tests/md-native-artifacts.test.mjs
          node --check projects/webflow/trusted/md-workflow-engine.js
          node --check projects/webflow/tests/md-workflow-engine.test.mjs
          node --check projects/webflow/src/md-run-contract.js
          node --check src/native-agent/chatgpt-background-adapter.js
          node --check src/native-agent/workspace-chatgpt.js
          node --check src/page-events/web-task-ingress.js
          node --check projects/webflow/tests/task-v2-live-ledger.test.mjs
          node --check tests/environment/chatgpt-baidu-bridge-r20.test.mjs
      - name: ChatGPT immutable version upgrade and send contracts (Node, not Chrome)
        run: |
          node --test \
            projects/webflow/tests/chatgpt-draft-task.test.mjs \
            projects/webflow/tests/chatgpt-send-task.test.mjs \
            projects/webflow/tests/chatgpt-create-result.test.mjs \
            projects/webflow/tests/chat-handoff-contract.test.mjs \
            projects/webflow/tests/github-issue-input.test.mjs \
            projects/webflow/tests/chat-handoff-receipt.test.mjs \
            projects/webflow/tests/task-intent-v2.test.mjs \
            projects/webflow/tests/md-run-ledger.test.mjs \
            projects/webflow/tests/md-run-receipt.test.mjs \
            projects/webflow/tests/md-native-artifacts.test.mjs \
            projects/webflow/tests/md-workflow-engine.test.mjs \
            projects/webflow/tests/md-run-contract.test.mjs \
            projects/webflow/tests/md-workflow.test.mjs \
            tests/environment/task-builtin-initialization.test.mjs
            # MD ledger uses only the original transaction API, no Chrome mocks in production.

      - name: Existing fixed and new Baidu business contracts (not native Chrome)
        run: |
          node --test \
            tests/environment/chatgpt-task-request-r1.test.mjs \
            tests/environment/chatgpt-fixed-page-r11.test.mjs \
            tests/environment/baidu-search-top3-r1.test.mjs \
            tests/environment/chatgpt-fixed-bridge-r12.test.mjs \
            tests/environment/chatgpt-fixed-bridge-r13.test.mjs \
            tests/environment/chatgpt-baidu-bridge-r20.test.mjs \
            tests/environment/webflow-fixed-source.test.mjs \
            projects/webflow/tests/chatgpt-legacy-panel.test.mjs \
            projects/webflow/tests/task-intent-v2.test.mjs \
            projects/webflow/tests/task-v2-live-ledger.test.mjs \
            projects/webflow/tests/background-execution-view.test.mjs \
            projects/webflow/tests/controller-retained-target.test.mjs \
            projects/webflow/tests/chatgpt-background-ingress.test.mjs \
            projects/webflow/tests/auto-grants.test.mjs \
            projects/webflow/tests/chatgpt-draft-task.test.mjs \
            projects/webflow/tests/chatgpt-send-task.test.mjs
      - name: Production extension build (not native Chrome)
        run: npm run build
