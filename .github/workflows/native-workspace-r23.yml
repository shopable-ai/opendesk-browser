name: Native Workspace R23 localization and existing safety
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-workspace-r23.yml'
      - 'src/i18n/**'
      - 'src/native-agent/workspace.*'
      - 'src/native-agent/workspace-domain.js'
      - 'src/native-agent/workspace-store.js'
      - 'src/native-agent/settings.*'
      - 'src/native-agent/workspace-chat-edit-ui.js'
      - 'tests/environment/workspace-i18n-r23.test.mjs'
      - 'tests/environment/workspace-domain-r231.test.mjs'
      - 'tests/environment/workspace-integration.test.mjs'
      - 'scripts/tests/native-workspace-r23-chrome.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-workspace-r23-${{ github.ref }}
  cancel-in-progress: true
jobs:
  locale-and-native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Four catalogs, locale selection and native file authorization regressions
        run: |
          node --test tests/environment/workspace-i18n-r23.test.mjs \
            tests/environment/workspace-domain-r231.test.mjs \
            tests/environment/workspace-integration.test.mjs \
            tests/environment/workspace-chat-edit.test.mjs \
            tests/environment/workspace-file-tree.test.mjs \
            tests/environment/workspace-chat-request.test.mjs
      - name: Compile official Workspace Tailwind CSS with native tokens
        run: node --input-type=module -e "import {compileWorkspaceStyle} from './scripts/build-workspace-style.mjs'; console.log(await compileWorkspaceStyle(process.env.RUNNER_TEMP));"
  package-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Audit source separately: an R35-owned test can be malformed during
      # concurrent main development. Continue to run the R23 Chrome smoke and
      # retain its evidence, but fail the job at the end if the global gate fails.
      - name: Global source syntax check
        id: source_check
        continue-on-error: true
        run: npm run check
      - run: npm run build
      - run: npm run build:dev
      - name: Real package verification (not a substitute for Mac Native E2E)
        run: npm run verify
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Real packaged Chrome locale interaction and offline safety (not Native disk E2E)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/native-workspace-r23-chrome.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-workspace-r23-ui-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/native-workspace-r23/chrome/
      - name: Enforce global source syntax check
        if: steps.source_check.outcome == 'failure'
        run: exit 1
