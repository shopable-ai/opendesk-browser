name: Bookmark Manager R2.4 - official SDK consumer and legacy removal
on:
  push:
    branches: [main]
    paths:
      - 'examples/sidebar-tools/bookmark-manager/**'
      - 'docs/framework/workstreams/bookmark-manager-r2.md'
      - 'scripts/tests/bookmark-manager-r26-preview-chrome.mjs'
      - 'scripts/preview/bookmark-manager-mock.js'
      - 'scripts/preview/bookmark-manager-lab.js'
      - 'tests/environment/bookmark-manager-r2.test.mjs'
      - 'tests/environment/bookmark-manager-r24-lifecycle.test.mjs'
      - 'tests/environment/browser-sdk-r112-full-bookmarks.test.mjs'
      - 'tests/environment/browser-sdk-r124-current-page.test.mjs'
      - 'src/platform/chrome/current-page-refs.js'
      - 'src/platform/chrome/bookmarks-full.js'
      - 'src/platform/chrome/context-menus.js'
      - 'src/framework/sdk/browser-schemas.js'
      - 'official-tools/catalog.json'
      - '.github/workflows/bookmark-manager-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bookmark-r2-source:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: SDK Full / current document and installed consumer regression
        run: node --test tests/environment/bookmark-manager-r2.test.mjs tests/environment/bookmark-manager-r24-lifecycle.test.mjs tests/environment/browser-sdk-r112-full-bookmarks.test.mjs tests/environment/browser-sdk-r124-current-page.test.mjs
      - name: Shared source and security checks
        run: npm run check
      - name: Independent v2 tool package
        run: npm run build:sidebar-tool -- examples/sidebar-tools/bookmark-manager
      # Reuse the single production-source preview runner independently of the
      # shared AdBlock preview matrix. No second UI, bridge or preview engine.
      # Browser extension building still follows, with every safety gate intact.
      - name: Install CJK fonts for readable Chinese visual evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'
      - uses: browser-actions/setup-chrome@v2
        id: bookmark-chrome
      - name: Bookmark Manager source-bound Chrome interaction (Mock, not installed)
        env:
          CHROME_BIN: ${{ steps.bookmark-chrome.outputs.chrome-path }}
        run: node scripts/tests/bookmark-manager-r26-preview-chrome.mjs artifacts/preview-chrome
      - name: Capture Bookmark source-bound HTML and Chrome screenshots (NOT Native)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-manager-r27-visual-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/previews/bookmark-manager/*.html
            artifacts/preview-chrome/bookmark-r26-*.png
            artifacts/preview-chrome/bookmark-r27-*.png
            artifacts/preview-chrome/bookmark-r26-interaction.json
      - name: Production extension build
        run: npm run build
      - name: Verify production extension
        run: node scripts/verify-package.mjs dist/production
      - name: Development extension build
        run: npm run build:dev
      - name: Verify production and development packages
        run: npm run verify
      - name: Capture independent package artifact (NOT a native Chrome pass)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-manager-r24-source-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            artifacts/sidebar-tools/bookmark-manager/*/bookmark-manager.opendesk-tool.json
            docs/framework/evidence/wxt/builds/build-production.json
            docs/framework/evidence/wxt/builds/build-development.json
  bookmark-r28-ui:
    # Independent product proof: the Full SDK / security build job above is
    # intentionally NOT skipped or relaxed when a parallel SDK change fails.
    # This job reuses the SAME production package and preview Chrome runner.
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production bookmark model and editor lifecycle tests
        run: node --test tests/environment/bookmark-manager-r2.test.mjs tests/environment/bookmark-manager-r24-lifecycle.test.mjs
      - name: Build R2.8 official isolated tool package
        run: npm run build:sidebar-tool -- examples/sidebar-tools/bookmark-manager
      - name: Confirm official package never embeds preview laboratory
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createSidebarToolPackage} from './scripts/build-sidebar-tool.mjs';
          const pkg=await createSidebarToolPackage('examples/sidebar-tools/bookmark-manager');
          assert.equal(pkg.version,'0.3.8');
          assert.doesNotMatch(pkg.html,/od-preview-bookmark-lab|预览测试辅助工具|data-bookmark-diagnostic/);
          assert.doesNotMatch(pkg.js,/opendesk\.preview\.bookmark\.command|__opendeskBookmarkMockDiagnostic/);
          assert.deepEqual(pkg.capabilities,['browser.bookmarks.full','currentPage.read']);
          console.log('BOOKMARK_R28_PACKAGE_NO_PREVIEW_LAB_PASS');
          NODE
      - name: Install Chinese fonts for source-bound screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Real headless Chrome: read-only selection, draft switching and external lab
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/bookmark-manager-r26-preview-chrome.mjs artifacts/preview-chrome
      - name: Preserve R2.8 source-bound HTML, screenshot and interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-manager-r28-ui-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/sidebar-tools/bookmark-manager/*/bookmark-manager.opendesk-tool.json
            artifacts/previews/bookmark-manager/*.html
            artifacts/preview-chrome/bookmark-r26-interaction.json
            artifacts/preview-chrome/bookmark-r26-*.png
            artifacts/preview-chrome/bookmark-r27-*.png
