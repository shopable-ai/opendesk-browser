name: Time Review R1.3 - real model, tool package and MV3 build
on:
  pull_request:
    paths:
      - 'src/time-review/**'
      - 'src/ui/sidebar-tools.js'
      - 'examples/sidebar-tools/time-review/**'
      - 'tests/environment/time-review-r12.test.mjs'
      - 'tests/environment/time-review-r13*.test.mjs'
      - 'tests/framework/time-review-r13-visual.mjs'
      - '.github/workflows/time-review-r13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  time-review-r13:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R1.2 compatibility and R1.3 real data security tests
        run: node --test tests/environment/time-review-r12.test.mjs tests/environment/time-review-host-controls-r51.test.mjs tests/environment/time-review-r13.test.mjs tests/environment/time-review-r13-service.test.mjs tests/environment/time-review-r13-consent.test.mjs tests/environment/time-review-r15-site-grants.test.mjs
      - name: Security source contract
        run: npm run check
      - name: Build versioned Time Review package without bypassing budget
        run: |
          npm run build:sidebar-tool -- examples/sidebar-tools/time-review
          node --input-type=module -e "import {readFileSync} from 'node:fs';import {validateSidebarToolPackage} from './src/ui/sidebar-tools/package.js';import {createHash} from 'node:crypto';const version=JSON.parse(readFileSync('examples/sidebar-tools/time-review/tool.config.json','utf8')).version;const file='artifacts/sidebar-tools/time-review/'+version+'/time-review.opendesk-tool.json';const b=readFileSync(file);const p=validateSidebarToolPackage(JSON.parse(b));if(p.id!=='time-review'||p.version!==version||p.capabilities.join(',')!=='time.review,user.export')throw Error('Time Review package identity drift');console.log('TIME_REVIEW_PACKAGE',b.length,createHash('sha256').update(b).digest('hex'))"
      - name: Both MV3 builds and verified packages
        run: |
          npm run build
          npm run build:dev
          npm run verify
      - name: Install Chinese fonts for readable Side Panel screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -F 'Noto Sans CJK'
      - name: Set up Chromium for real source-code rendering (synthetic fixture only)
        uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Real Chromium 320/360/400/600px and DPR2 fixture layouts + input
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/framework/time-review-r13-visual.mjs artifacts/time-review-r13-visual
      - name: Preserve fixture screenshots (not native Side Panel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-review-r13-chromium-fixture-NOT_NATIVE
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/time-review-r13-visual/
      - name: Preserve built candidates (not native Chrome evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-review-r13-built-packages
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/sidebar-tools/time-review/*/time-review.opendesk-tool.json
            dist/production/official-tools/time-review/time-review.opendesk-tool.json
            dist/development/official-tools/time-review/time-review.opendesk-tool.json
            docs/framework/evidence/wxt/builds/build-production.json
            docs/framework/evidence/wxt/builds/build-development.json
