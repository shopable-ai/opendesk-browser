# One-shot source-bound UI closure; canonical host snapshots use the real toolbar controller, not obsolete inner settings buttons.
name: AdBlock R1.9.5 same-row toolbar source preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adblock-r195-toolbar-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adblock-r195-toolbar-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verified-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate the actual source-bound AdBlock HTML, no bespoke redraw
        run: |
          node scripts/preview/build-preview.mjs --tool adblock --surface side-panel --scenario success --theme light --width 360 --height 760 --out examples/sidebar-tools/adblock/adblock-r1-interactive-preview.html
          node scripts/preview/check-preview-contract.mjs
      - name: AdBlock, shared toolbar and preview Node regressions
        run: |
          node --test tests/environment/adblock-host-controls-r13.test.mjs tests/environment/adblock-preview-contract.test.mjs tests/environment/adblock-r12.test.mjs tests/environment/stay-focus-boundary-r1.test.mjs
          node --test tests/environment/sidebar-preview-shell.test.mjs tests/environment/sidebar-preview-contract.test.mjs tests/environment/sidebar-quick-notes.test.mjs tests/environment/sidebar-preview-kit.test.mjs
          node --check examples/sidebar-tools/adblock/trusted/host-controls.js
          node --check src/ui/sidebar-tools.js
          npm run check
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Genuine Chromium same-row settings, title gutter, three views and 4 widths
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/tests/adblock-preview-chrome.mjs artifacts/adblock-r195-toolbar-chrome
          node scripts/tests/sidebar-preview-runtime-chrome.mjs artifacts/adblock-r195-toolbar-chrome
          node scripts/tests/bookmark-manager-r26-preview-chrome.mjs artifacts/adblock-r195-toolbar-chrome
      - name: Retain exact tested HTML, screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adblock-r195-toolbar-source-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            examples/sidebar-tools/adblock/adblock-r1-interactive-preview.html
            artifacts/adblock-r195-toolbar-chrome/
  sync-preview-to-main:
    needs: verified-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reject stale generation when another Agent changed any live source input
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --name-only "${GITHUB_SHA}" origin/main > /tmp/adblock-r195-advanced.txt
          if grep -E '^(src/ui/(tool.html|tool-shell.css|sidebar-tools.js|design-tokens.css|design-system.css)|scripts/(preview/|templates/sidebar-tool-preview-shell.html|build-sidebar-tool.mjs|tests/(adblock-preview-chrome|sidebar-preview-runtime-chrome|bookmark-manager-r26-preview-chrome))|tests/environment/(adblock-|sidebar-preview-|sidebar-quick-notes)|examples/sidebar-tools/(adblock/|quick-notes/|bookmark-manager/)|contracts/ui-preview/|official-tools/|package(-lock)?\.json$)' /tmp/adblock-r195-advanced.txt; then
            echo "::error::Shared source changed after Chromium evidence; refusing stale preview publication."
            exit 1
          fi
          git pull --ff-only origin main
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recreate deterministic official HTML on current main
        run: |
          node scripts/preview/build-preview.mjs --tool adblock --surface side-panel --scenario success --theme light --width 360 --height 760 --out examples/sidebar-tools/adblock/adblock-r1-interactive-preview.html
          node scripts/preview/check-preview-contract.mjs
          node --test tests/environment/adblock-host-controls-r13.test.mjs tests/environment/adblock-preview-contract.test.mjs tests/environment/sidebar-preview-shell.test.mjs
      - name: Commit single approved HTML and discard one-time CI publisher
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/adblock-r195-toolbar-sync.yml
          git add -- examples/sidebar-tools/adblock/adblock-r1-interactive-preview.html
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(adblock): publish same-row toolbar source preview after Chromium review [R1.9.5]'
          git push origin main
