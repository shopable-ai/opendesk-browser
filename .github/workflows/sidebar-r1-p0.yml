name: Sidebar R1 P0 targeted checks
on:
  push:
    branches:
      - agent/sidebar-p0-freeze-20261008-1543
      - main
  pull_request:
    branches:
      - agent/sidebar-p0-draft-20261008
permissions:
  contents: read
jobs:
  draft-and-saved-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test draft/saved transport, editor, controller authority and run recovery
        run: node --test tests/environment/sidebar-draft-runhost.test.mjs tests/environment/controller-main-entry.test.mjs tests/environment/task-package-flow.test.mjs tests/environment/task-workbench.test.mjs tests/environment/script-editor.test.mjs tests/framework/draft-native-envelope.test.mjs tests/framework/k3-controller-authority.test.mjs tests/framework/run-host-recovery.test.mjs
