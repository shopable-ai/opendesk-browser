name: Sidebar R1 P0 targeted checks
on:
  push:
    branches:
      - agent/sidebar-p0-freeze-20261008-1543
      - main
  pull_request:
    branches:
      - agent/sidebar-p0-draft-20261008
permissions:
  contents: read
jobs:
  draft-and-saved-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test draft/saved transport, editor, controller authority and run recovery
        run: node --test tests/environment/result-transfer.test.mjs tests/environment/page-content-regression.test.mjs tests/environment/sidebar-draft-runhost.test.mjs tests/environment/controller-main-entry.test.mjs tests/environment/task-package-flow.test.mjs tests/environment/agent-to-task-contract.test.mjs tests/environment/basic-browser-page.test.mjs tests/environment/task-workbench.test.mjs tests/environment/script-editor.test.mjs tests/environment/user-scripts-access.test.mjs tests/environment/task-run-diagnostics.test.mjs tests/environment/sidebar-product-contract.test.mjs tests/environment/sidebar-ui-preview.test.mjs tests/framework/draft-native-envelope.test.mjs tests/framework/k3-controller-authority.test.mjs tests/framework/run-host-recovery.test.mjs
      - name: R5.2 semantic Locator, deadlines, staged actions and observation component contract
        run: node --test tests/framework/r5-modern-page-api.test.mjs
      - name: Original native driver, worker Page injection and lifecycle regressions
        run: node --test tests/framework/k3-native-driver.test.mjs tests/framework/k3-worker-context-entry.test.mjs
