name: OpenDesk multi-file source contract
on:
  push:
    branches: [main]
    paths:
      - 'scripts/validate-program-project.mjs'
      - 'scripts/program-entry.mjs'
      - 'scripts/lock-program-remote.mjs'
      - 'tests/environment/program-entry.test.mjs'
      - 'tests/environment/remote-esm-review.test.mjs'
      - 'scripts/remote-esm-modules.mjs'
      - 'scripts/remote-esm-network.mjs'
      - 'scripts/build-program-project.mjs'
      - 'tests/environment/program-project.test.mjs'
      - 'tests/environment/page-component-entry-r243.test.mjs'
      - 'tests/environment/page-jsx-component-r243.test.mjs'
      - 'tests/environment/page-vue-sfc-compiler-r243.test.mjs'
      - 'tests/environment/page-vue-sfc-transform-r243.test.mjs'
      - 'tests/environment/page-vue-component-r243.test.mjs'
      - 'tests/environment/page-component-draft-import-r243.test.mjs'
      - 'src/ui/program-source.js'
      - 'scripts/page-vue-sfc-loader.cjs'
      - 'src/libs/page-frameworks/vue-sfc-compiler-3.5.22.mjs'
      - 'scripts/page-jsx-loader.cjs'
      - 'scripts/page-component-entry.mjs'
      - 'src/libs/page-frameworks/contract.js'
      - 'tests/environment/program-build.test.mjs'
      - 'tests/environment/remote-esm-import.test.mjs'
      - 'tests/environment/remote-esm-security.test.mjs'
      - 'tests/integration/npm-project-closure.test.mjs'
      - 'examples/programs/page-npm-lodash/**'
      - 'tests/environment/sidebar-project-demo.test.mjs'
      - 'tests/environment/script-editor.test.mjs'
      - 'src/ui/tool.html'
      - 'src/ui/script-editor.js'
      - 'src/ui/page-dependencies.js'
      - 'src/ui/esm-source-detector.js'
      - 'tests/environment/page-dependencies-ui.test.mjs'
      - 'native-agent/local-dev/provider.mjs'
      - 'schemas/opendesk-program-project.v1.schema.json'
      - 'examples/programs/**'
      - 'native-agent/wire.mjs'
      - 'native-agent/local-dev/resolver.mjs'
      - 'tests/environment/esm-r21-wire-boundary.test.mjs'
      - 'tests/integration/esm-examples-acceptance.test.mjs'
      - 'tests/framework/esm-r22-examples.mjs'
      - '.github/workflows/program-project-source.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/environment/r101-source-map.test.mjs'
      - 'scripts/remote-esm-*.mjs'
      - 'scripts/build-program-project.mjs'
      - 'scripts/program-entry.mjs'
      - 'scripts/lock-program-remote.mjs'
      - 'tests/environment/program-entry.test.mjs'
      - 'tests/environment/remote-esm-review.test.mjs'
      - 'src/ui/page-dependencies.js'
      - 'src/ui/esm-source-detector.js'
      - 'tests/environment/page-dependencies-ui.test.mjs'
      - 'native-agent/local-dev/provider.mjs'
      - 'tests/environment/remote-esm-*.test.mjs'
      - 'tests/integration/npm-project-closure.test.mjs'
      - 'examples/programs/page-npm-lodash/**'
      - 'scripts/bundle-provenance.mjs'
      - 'native-agent/wire.mjs'
      - 'native-agent/local-dev/resolver.mjs'
      - 'tests/environment/esm-r21-wire-boundary.test.mjs'
      - 'tests/integration/esm-examples-acceptance.test.mjs'
      - 'tests/framework/esm-r22-examples.mjs'
      - 'examples/programs/**'
      - '.github/workflows/program-project-source.yml'
  workflow_dispatch:
    inputs:
      live_https_smoke:
        description: Approve jsdelivr lodash-es add.js root download for compile-only smoke
        type: boolean
        default: false
      approved_transitive_urls:
        description: JSON array of separately approved exact transitive HTTPS URLs
        type: string
        default: '[]'
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate multi-file ESM source metadata
        run: |
          node --test tests/environment/page-component-draft-import-r243.test.mjs tests/environment/page-vue-component-r243.test.mjs tests/environment/page-vue-sfc-transform-r243.test.mjs tests/environment/page-vue-sfc-compiler-r243.test.mjs tests/environment/page-jsx-component-r243.test.mjs tests/environment/page-component-entry-r243.test.mjs tests/environment/page-dependencies-ui.test.mjs tests/environment/program-entry.test.mjs tests/environment/remote-esm-review.test.mjs tests/environment/local-project-connection.test.mjs tests/environment/r101-source-map.test.mjs tests/environment/program-project.test.mjs tests/environment/program-build.test.mjs tests/environment/remote-esm-import.test.mjs tests/environment/remote-esm-security.test.mjs tests/environment/script-editor.test.mjs tests/environment/sidebar-project-demo.test.mjs
          node scripts/validate-program-project.mjs examples/programs/page-heading
          node scripts/validate-program-project.mjs examples/programs/controller-title
          node scripts/validate-program-project.mjs examples/programs/sidebar-page-demo
          node scripts/validate-program-project.mjs examples/programs/sidebar-controller-demo
          node scripts/validate-program-project.mjs examples/programs/sidebar-assets-contract
          node scripts/validate-program-project.mjs examples/programs/remote-esm-page
          node scripts/build-program-project.mjs examples/programs/page-heading
          node scripts/build-program-project.mjs examples/programs/controller-title
          node scripts/build-program-project.mjs examples/programs/sidebar-page-demo
          node scripts/build-program-project.mjs examples/programs/sidebar-controller-demo
      - run: npm run check
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.1'
      - name: Node L2 Examples and OS-denied offline Mock rebuild
        run: node --test tests/integration/esm-examples-acceptance.test.mjs tests/environment/esm-r21-wire-boundary.test.mjs

      - name: Install and exercise real locked npm Page example
        run: |
          npm ci --prefix examples/programs/page-npm-lodash --ignore-scripts --no-audit --no-fund
          node --test tests/integration/npm-project-closure.test.mjs
  live-https-esm-smoke:
    # External CDN access needs the separate explicit manual approval input.
    # The downloaded third-party code is compiled, but NEVER executed in CI.
    if: github.event_name == 'workflow_dispatch' && inputs.live_https_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Explicit HTTPS pin then verified cached repeat (never execute CDN code)
        env:
          APPROVED_TRANSITIVE_URLS: ${{ inputs.approved_transitive_urls }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/r10-remote"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {lockProgramRemote} from './scripts/lock-program-remote.mjs';
          const approved=JSON.parse(process.env.APPROVED_TRANSITIVE_URLS);
          assert.ok(Array.isArray(approved)&&approved.every(url=>typeof url==='string'&&url.startsWith('https://')));
          const project='examples/programs/remote-esm-page';
          const review=await lockProgramRemote(project);
          console.log(JSON.stringify(review));
          await lockProgramRemote(project,{approve:review.reviewToken,allowURL:async url=>approved.includes(url)});
          NODE
          node scripts/build-program-project.mjs examples/programs/remote-esm-page --out "${OUT}" > "${RUNNER_TEMP}/r10-first.json"
          node scripts/build-program-project.mjs examples/programs/remote-esm-page --out "${OUT}" > "${RUNNER_TEMP}/r10-second.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {join} from 'node:path';
          import {env} from 'node:process';
          const first=JSON.parse(await readFile(join(env.RUNNER_TEMP,'r10-first.json')));
          const second=JSON.parse(await readFile(join(env.RUNNER_TEMP,'r10-second.json')));
          assert.equal(first.sourceHash,second.sourceHash);
          assert.deepEqual(first.remoteModules,second.remoteModules);
          assert.ok(first.remoteModules.length>0);
          const code=await readFile(join(env.RUNNER_TEMP,'r10-remote','program.js'),'utf8');
          assert.doesNotMatch(code,/import\s*\(\s*['"]https?:\/\//);
          console.log(JSON.stringify({sourceHash:first.sourceHash,remoteModuleCount:first.remoteModules.length,cachedRebuild:'PASS'}));
          NODE
