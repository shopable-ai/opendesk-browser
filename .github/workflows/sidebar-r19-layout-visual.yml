name: Sidebar R19 - real markup static layout audit
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/tool.html'
      - 'src/ui/tool-shell.css'
      - 'src/ui/design-system.css'
      - 'scripts/tests/sidebar-r19-layout-visual.mjs'
      - '.github/workflows/sidebar-r19-layout-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-sidebar-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Inspect 5 real-markup tabs, R21 state matrix and 4 widths
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/sidebar-r19-layout-visual.mjs artifacts/sidebar-r19-layout-visual
      - name: Preserve static-only screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-r19-static-markup-visual
          path: artifacts/sidebar-r19-layout-visual/
          if-no-files-found: warn
          retention-days: 14
