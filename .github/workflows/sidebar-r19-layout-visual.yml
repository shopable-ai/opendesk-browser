name: Sidebar R19 - real markup static layout audit
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/tool.html'
      - 'src/ui/tool-shell.css'
      - 'src/ui/design-tokens.css'
      - 'src/ui/design-system.css'
      - 'scripts/tests/sidebar-r19-layout-visual.mjs'
      - 'scripts/tests/sidebar-quick-notes-layout-visual.mjs'
      - 'official-tools/catalog.json'
      - 'examples/sidebar-tools/**'
      - 'scripts/build-official-tools.mjs'
      - 'scripts/build-sidebar-tool.mjs'
      - 'src/sidebar-tools/official-catalog.js'
      - 'src/ui/sidebar-tools/package.js'
      - 'package-lock.json'
      - '.github/workflows/sidebar-r19-layout-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-sidebar-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chinese fonts for readable UI screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Inspect 5 real-markup tabs, R21 state matrix and 4 widths
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/sidebar-r19-layout-visual.mjs artifacts/sidebar-r19-layout-visual
      - name: Inspect official Quick Notes source HTML/CSS across 12 widths and 4 states
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/sidebar-quick-notes-layout-visual.mjs artifacts/quick-notes-layout-visual
      - name: Preserve static-only screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-r19-and-quick-notes-static-visual
          path: |
            artifacts/sidebar-r19-layout-visual/
            artifacts/quick-notes-layout-visual/
          if-no-files-found: warn
          retention-days: 14
