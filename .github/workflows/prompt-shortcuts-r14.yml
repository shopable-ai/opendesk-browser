name: Prompt Shortcuts R1.5 scoped tests and portable v2 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prompt-shortcuts-r14.yml'
      - 'examples/sidebar-tools/prompt-shortcuts/**'
      - 'tests/environment/prompt-shortcuts-r14*.test.mjs'
      - 'scripts/tests/prompt-shortcuts-r111-preview-chrome.mjs'
      - 'scripts/tests/prompt-shortcuts-r113-formal-chrome.mjs'
      - 'src/ui/sidebar-tools/package.js'
      - 'src/ui/sidebar-tools/installation.js'
      - 'src/ui/sidebar-tools.js'
      - 'src/entrypoints/page-relay.js'
      - 'src/ui/sidebar-tools/lifecycle.js'
      - 'src/ui/design-tokens.css'
      - 'src/ui/design-system.css'
      - 'scripts/build-sidebar-tool.mjs'
      - 'scripts/preview/shared-tool-design.mjs'
      - 'scripts/bundle-provenance.mjs'
      - 'official-tools/catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-shortcuts-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate independent tool, storage and fixed-adapter provenance
        run: |
          node --test tests/environment/prompt-shortcuts-r14*.test.mjs
          node --test tests/environment/sidebar-tools.test.mjs
      - name: Check standalone and trusted JavaScript syntax
        run: |
          node --check examples/sidebar-tools/prompt-shortcuts/src/main.js
          node --check examples/sidebar-tools/prompt-shortcuts/trusted/model.js
          node --check examples/sidebar-tools/prompt-shortcuts/trusted/page.js
          node --check examples/sidebar-tools/prompt-shortcuts/trusted/policy.js
      - name: Build and validate real portable v2 tool package
        run: |
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/prompt-shortcuts --out artifacts/sidebar-tools/prompt-shortcuts/1.0.3/prompt-shortcuts.opendesk-tool.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import {validateSidebarToolPackage} from './src/ui/sidebar-tools/package.js';
          const path='artifacts/sidebar-tools/prompt-shortcuts/1.0.3/prompt-shortcuts.opendesk-tool.json';
          const bytes=readFileSync(path);
          const pkg=validateSidebarToolPackage(JSON.parse(bytes.toString('utf8')));
          assert.equal(pkg.id,'prompt-shortcuts');
          assert.equal(pkg.version,'1.0.3');
          assert.equal(pkg.format,'opendesk.sidebar-tool.v2');
          assert(pkg.capabilities.includes('page.prompts'));
          assert(pkg.capabilities.includes('browser.contextMenu'));
          assert.equal(pkg.contributes.contextMenus.length,1);
          assert.equal(pkg.scripts.length,1);
          console.log('PROMPT_SHORTCUTS_PORTABLE_V2_PACKAGE_PASS',bytes.length,createHash('sha256').update(bytes).digest('hex'));
          NODE
      - name: Provide readable CJK fonts for actual HTML screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - uses: browser-actions/setup-chrome@v2
        id: preview-chrome
      - name: Real Chromium HTML preview interaction and 320/360/400/440 screenshots (not installed extension)
        env:
          CHROME_BIN: ${{ steps.preview-chrome.outputs.chrome-path }}
        run: node scripts/tests/prompt-shortcuts-r111-preview-chrome.mjs artifacts/prompt-shortcuts-r111-preview
      - name: Real Chromium formal bundled UI with controlled fake Host (not installed)
        env:
          CHROME_BIN: ${{ steps.preview-chrome.outputs.chrome-path }}
        run: node scripts/tests/prompt-shortcuts-r113-formal-chrome.mjs artifacts/prompt-shortcuts-r113-formal-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-shortcuts-r113-formal-chrome-${{ github.sha }}
          path: artifacts/prompt-shortcuts-r113-formal-chrome/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-shortcuts-r111-preview-chrome-${{ github.sha }}
          path: artifacts/prompt-shortcuts-r111-preview/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-shortcuts-v2-${{ github.sha }}
          path: artifacts/sidebar-tools/prompt-shortcuts/1.0.3/prompt-shortcuts.opendesk-tool.json
          if-no-files-found: error
          retention-days: 7

  sync-project-package:
    name: Commit verified portable JSON into tool project
    needs: prompt-shortcuts-scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prompt-shortcuts-v2-${{ github.sha }}
          path: .verified-prompt-tool
      - name: Publish generated JSON at its stable project path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const repo=process.env.GITHUB_REPOSITORY;
          const sourceCommit=process.env.GITHUB_SHA;
          const path='examples/sidebar-tools/prompt-shortcuts/prompt-shortcuts.opendesk-tool.json';
          const content=readFileSync('.verified-prompt-tool/prompt-shortcuts.opendesk-tool.json');
          const pkg=JSON.parse(content.toString('utf8'));
          if(pkg.id!=='prompt-shortcuts'||pkg.version!=='1.0.3'||pkg.format!=='opendesk.sidebar-tool.v2')
            throw Error('Refusing to publish a package with mismatched tool identity');
          const expectedBlob=createHash('sha1').update('blob '+content.length+'\0').update(content).digest('hex');
          const endpoint='https://api.github.com/repos/'+repo;
          const headers={Accept:'application/vnd.github+json',
            Authorization:'Bearer '+process.env.GITHUB_TOKEN,'X-GitHub-Api-Version':'2022-11-28'};
          async function request(path,options={}){
            const response=await fetch(endpoint+path,{...options,headers:{...headers,...options.headers}});
            const data=await response.json();
            if(!response.ok&&response.status!==404)
              throw Error('GitHub API '+response.status+': '+String(data.message||'unknown error'));
            return {status:response.status,data};
          }
          // The publishing job might be delayed by other agents writing main.
          // A package from an old source candidate must never overwrite newer
          // Prompt Shortcuts or any input to the official v2 package builder.
          const head=(await request('/git/ref/heads/main')).data.object.sha;
          if(head!==sourceCommit){
            const cmp=await request('/compare/'+sourceCommit+'...main');
            const changed=cmp.data.files||[];
            const depends=new Set(['scripts/build-sidebar-tool.mjs',
              'scripts/preview/shared-tool-design.mjs','src/ui/design-tokens.css',
              'src/ui/design-system.css','src/ui/sidebar-tools/package.js',
              'official-tools/catalog.json']);
            if(cmp.data.status!=='ahead'||changed.length>=300||
              changed.some(file=>file.filename.startsWith('examples/sidebar-tools/prompt-shortcuts/')||
                depends.has(file.filename))){
              console.log('SKIP_STALE_PROMPT_PACKAGE: a newer source candidate exists on main');
              process.exit(0);
            }
          }
          const existing=await request('/contents/'+path+'?ref=main');
          let sha;
          if(existing.status===200){
            sha=existing.data.sha;
            const old=Buffer.from(existing.data.content.replace(/\s/g,''),'base64');
            if(old.equals(content)){
              console.log('PROMPT_PROJECT_PACKAGE_ALREADY_CURRENT',content.length,expectedBlob);
              process.exit(0);
            }
          }
          const published=await request('/contents/'+path,{
            method:'PUT',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:'chore(prompt-shortcuts): sync verified v2 package [skip ci]',
              content:content.toString('base64'),branch:'main',...(sha?{sha}:{})})
          });
          if(published.data.content?.sha!==expectedBlob)
            throw Error('Published Git blob does not equal the verified CI package');
          console.log('PROMPT_PROJECT_PACKAGE_COMMITTED',published.data.commit.sha,
            content.length,createHash('sha256').update(content).digest('hex'));
          NODE

      - name: Verify published source and canonical official project package
        run: |
          # A fresh checkout is required because the earlier job only downloaded
          # an artifact, then used Contents API to publish to main.
          git clone --quiet --depth 1 --branch main "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .verify-main
          cd .verify-main
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/prompt-shortcuts --check-project
