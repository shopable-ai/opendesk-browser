name: ChatGPT Mind Map original JS direct preview and browser proof
on:
  push:
    branches: [main]
    paths:
      - 'examples/programs/chatgpt-mindmap/**'
      - 'tests/environment/chatgpt-mindmap-preview.test.mjs'
      - 'tests/environment/chatgpt-mindmap-r1.test.mjs'
      - 'tests/framework/chatgpt-mindmap-xmind-probe.mjs'
      - 'tests/framework/chatgpt-mindmap-chatgpt-probe.mjs'
      - 'src/scripting/user-scripts/installed-programs.js'
      - 'src/platform/host/broker.js'
      - 'src/ui/page-program-library.js'
      - 'src/ui/tool.html'
      - 'tests/environment/page-installed-programs.test.mjs'
      - 'tests/environment/page-program-library.test.mjs'
      - '.github/workflows/chatgpt-mindmap-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify original four in-place JS before all source tests
        run: node examples/programs/chatgpt-mindmap/preview/verify-assets.mjs
      - name: Real XMind adapter and preview source/regression checks
        env:
          XMIND_REFERENCE_DIR: ${{ github.workspace }}/examples/programs/chatgpt-mindmap/preview
        run: |
          node --test --test-reporter=spec \
            tests/environment/chatgpt-mindmap-r1.test.mjs \
            tests/environment/chatgpt-mindmap-preview.test.mjs
      - name: Installed Page native lifecycle and UI regression
        run: |
          node --test --test-reporter=spec \
            tests/environment/page-installed-programs.test.mjs \
            tests/environment/page-program-library.test.mjs
      - name: Validate authoring and deterministic program build (not runtime installation)
        run: |
          node scripts/validate-program-project.mjs examples/programs/chatgpt-mindmap
          npm run build:program -- examples/programs/chatgpt-mindmap
      - name: Audit current compiled Program candidate (NOT installed)
        shell: bash
        run: |
          set -euo pipefail
          node examples/programs/chatgpt-mindmap/scripts/audit-build.mjs --out "${{ runner.temp }}/r35-program-build-audit.json"
          test -s "${{ runner.temp }}/r35-program-build-audit.json"
      - name: Upload actual candidate bytes and verified hashes (NOT Chrome installation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r35-program-build-candidate
          path: |
            artifacts/programs/opendesk.chatgpt-mindmap/**/program.js
            artifacts/programs/opendesk.chatgpt-mindmap/**/program.opendesk-draft.json
            artifacts/programs/opendesk.chatgpt-mindmap/**/artifact.json
            ${{ runner.temp }}/r35-program-build-audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Source safety checks
        run: npm run check
      - name: Declare actual evidence limitations
        run: |
          echo 'PREVIEW_DIRECT_JS_VERIFIED; native USER_SCRIPT installation / ChatGPT still NOT_TESTED'
          echo 'Checked-in preview JS are NOT declared production Program runtime assets'

  real-local-xmind-html:
    # Test four Git-tracked original JS bytes directly from preview/, not .runtime.
    # Keep these scripts out of the installed Page USER_SCRIPT.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove four original JS are Git-tracked directly in preview/
        shell: bash
        run: |
          set -euo pipefail
          dir="examples/programs/chatgpt-mindmap/preview"
          for name in jszip.min.js polyfill-45b9836beb.min.js xmind-sdk.bundle.js snowbrush-2c2b5d62b5.js; do
            git ls-files --error-unmatch "$dir/$name" > /dev/null
            test -s "$dir/$name"
          done
          test ! -d "$dir/.runtime"
          node "$dir/verify-assets.mjs"
          echo "XMIND_REFERENCE_DIR=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_ENV"
          echo 'REPOSITORY_PREVIEW_DIRECT_FOUR_JS_PASS'
      - name: Verify preview starts without external --assets parameter
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {startXmindPreview} from './examples/programs/chatgpt-mindmap/preview/serve.mjs';
          const session=await startXmindPreview();
          try{
            const urls=['/index.html','/chatgpt.html',
              '/jszip.min.js',
              '/polyfill-45b9836beb.min.js',
              '/xmind-sdk.bundle.js',
              '/snowbrush-2c2b5d62b5.js'];
            for(const suffix of urls){
              const response=await fetch(new URL(suffix,session.url));
              if(!response.ok)throw new Error('E_XMIND_PREVIEW_ROUTE:'+suffix);
            }
            console.log('REAL_XMIND_PREVIEW_ONE_COMMAND_BOOT_PASS');
          }finally{await session.close();}
          NODE
      - name: Spawn exactly the documented one-command CLI and GET its real autostart HTML
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {spawn} from 'node:child_process';
          import assert from 'node:assert/strict';
          const child=spawn(process.execPath,[
            'examples/programs/chatgpt-mindmap/preview/serve.mjs','--no-open'
          ],{env:{...process.env,CI:'true'},stdio:['ignore','pipe','pipe']});
          let output='',errors='';
          child.stderr.on('data',b=>{errors+=b;});
          try{
            const url=await new Promise((resolve,reject)=>{
              const timeout=setTimeout(()=>reject(new Error('E_XMIND_CLI_TIMEOUT '+output+' '+errors)),15000);
              child.once('error',reject);
              child.once('exit',code=>reject(new Error('E_XMIND_CLI_EXIT '+code+' '+errors)));
              child.stdout.on('data',bytes=>{
                output+=bytes.toString();
                const match=output.match(/REAL_XMIND_LOCAL_PREVIEW (http:\/\/127\.0\.0\.1:\d+\/index\.html\?autostart=1)/);
                if(match){clearTimeout(timeout);resolve(match[1]);}
              });
            });
            assert.match(output,/PREVIEW_ASSETS_READY 4/);
            const response=await fetch(url);
            assert.equal(response.status,200);
            assert.match(await response.text(),/\.\/snowbrush-2c2b5d62b5\.js/);
            console.log('REAL_XMIND_PREVIEW_SPAWNED_CLI_PASS '+url);
          }finally{child.kill('SIGTERM');}
          NODE
      - name: REAL SDK Workbook and product preview source tests
        run: |
          node --test --test-reporter=spec tests/environment/chatgpt-mindmap-r1.test.mjs tests/environment/chatgpt-mindmap-preview.test.mjs
      - name: Install and verify real CJK glyph fonts for visual evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          family="$(fc-match -f '%{family}' 'sans:lang=zh-cn')"
          echo "XMIND_CHINESE_FONT=$family"
          echo "$family" | grep -q 'Noto Sans CJK'
      - name: Prepare isolated browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          if [ -z "$browser" ]; then echo 'E_XMIND_CI_BROWSER_MISSING'; exit 1; fi
          "$browser" --version
          echo "XMIND_CHROME=$browser" >> "$GITHUB_ENV"
      - name: Chromium actual XMind HTML rendering and interaction proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/r35-xmind-proof"
          node tests/framework/chatgpt-mindmap-xmind-probe.mjs \
            --assets "$XMIND_REFERENCE_DIR" \
            --browser "$XMIND_CHROME" \
            --playwright "$GITHUB_WORKSPACE/node_modules/playwright-core/index.mjs" \
            --out "${RUNNER_TEMP}/r35-xmind-proof"
      - name: ChatGPT simulated UI with real XMind answer registry / interaction
        shell: bash
        run: |
          set -euo pipefail
          node tests/framework/chatgpt-mindmap-chatgpt-probe.mjs \
            --browser "$XMIND_CHROME" \
            --playwright "$GITHUB_WORKSPACE/node_modules/playwright-core/index.mjs" \
            --out "${RUNNER_TEMP}/r35-xmind-proof"
      - name: Preserve only screenshots and result (never SDK vendor bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r35-chatgpt-icon-toolbar-proof
          path: |
            ${{ runner.temp }}/r35-xmind-proof/*.png
            ${{ runner.temp }}/r35-xmind-proof/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Declare proof scope
        if: always()
        run: |
          echo 'LOCAL_HTML_CHROMIUM_ONLY including ChatGPT simulation. No native USER_SCRIPT install, style isolation approval or logged-in ChatGPT verified.'
          echo 'No vendor JS or installation bundles are uploaded.'
