name: ChatGPT Mind Map R2.1 local preview source contract
on:
  push:
    branches: [main]
    paths:
      - 'examples/programs/chatgpt-mindmap/**'
      - 'tests/environment/chatgpt-mindmap-preview.test.mjs'
      - 'tests/environment/chatgpt-mindmap-r1.test.mjs'
      - 'tests/framework/chatgpt-mindmap-xmind-probe.mjs'
      - '.github/workflows/chatgpt-mindmap-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real XMind adapter and preview source/regression checks
        run: |
          node --test --test-reporter=spec \
            tests/environment/chatgpt-mindmap-r1.test.mjs \
            tests/environment/chatgpt-mindmap-preview.test.mjs
      - name: Validate authoring and deterministic program build (not runtime installation)
        run: |
          node scripts/validate-program-project.mjs examples/programs/chatgpt-mindmap
          npm run build:program -- examples/programs/chatgpt-mindmap
      - name: Source safety checks
        run: npm run check
      - name: Declare actual evidence limitations
        run: |
          echo 'COMPONENT_TESTED_ONLY: vendor asset / Chrome / USER_SCRIPT installed / ChatGPT NOT_TESTED'
          echo 'No vendor redistribution or fixed production runtime admission in this workflow'

  real-local-xmind-html:
    # Only test exact historical source snapshots in a disposable CI browser.
    # Never publish vendor JS or admit it to the installed Page runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare four actual preview-local engine files using the public entrypoint
        shell: bash
        run: |
          set -euo pipefail
          # Same developer entrypoint as preview/serve.mjs. Exact four hashes
          # are verified BEFORE the browser can use any engine code.
          node examples/programs/chatgpt-mindmap/preview/prepare-assets.mjs
          echo "XMIND_REFERENCE_DIR=$GITHUB_WORKSPACE/examples/programs/chatgpt-mindmap/preview/.runtime/xmind" >> "$GITHUB_ENV"
      - name: Verify preview starts without external --assets parameter
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {startXmindPreview} from './examples/programs/chatgpt-mindmap/preview/serve.mjs';
          const session=await startXmindPreview();
          try{
            const urls=['/index.html',
              '/__fixed_xmind/jszip.min.js',
              '/__fixed_xmind/polyfill-45b9836beb.min.js',
              '/__fixed_xmind/xmind-sdk.bundle.js',
              '/__fixed_xmind/snowbrush-2c2b5d62b5.js'];
            for(const suffix of urls){
              const response=await fetch(new URL(suffix,session.url));
              if(!response.ok)throw new Error('E_XMIND_PREVIEW_ROUTE:'+suffix);
            }
            console.log('REAL_XMIND_PREVIEW_ONE_COMMAND_BOOT_PASS');
          }finally{await session.close();}
          NODE
      - name: REAL SDK Workbook and product preview source tests
        run: |
          node --test --test-reporter=spec tests/environment/chatgpt-mindmap-r1.test.mjs tests/environment/chatgpt-mindmap-preview.test.mjs
      - name: Install and verify real CJK glyph fonts for visual evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          family="$(fc-match -f '%{family}' 'sans:lang=zh-cn')"
          echo "XMIND_CHINESE_FONT=$family"
          echo "$family" | grep -q 'Noto Sans CJK'
      - name: Prepare isolated browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          if [ -z "$browser" ]; then echo 'E_XMIND_CI_BROWSER_MISSING'; exit 1; fi
          "$browser" --version
          echo "XMIND_CHROME=$browser" >> "$GITHUB_ENV"
      - name: Chromium actual XMind HTML rendering and interaction proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/r22-xmind-proof"
          node tests/framework/chatgpt-mindmap-xmind-probe.mjs \
            --assets "$XMIND_REFERENCE_DIR" \
            --browser "$XMIND_CHROME" \
            --playwright "$GITHUB_WORKSPACE/node_modules/playwright-core/index.mjs" \
            --out "${RUNNER_TEMP}/r22-xmind-proof"
      - name: Preserve only screenshots and result (never SDK vendor bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22-local-html-xmind-proof
          path: |
            ${{ runner.temp }}/r22-xmind-proof/*.png
            ${{ runner.temp }}/r22-xmind-proof/result.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Declare proof scope
        if: always()
        run: |
          echo 'LOCAL_HTML_CHROMIUM_ONLY. No native USER_SCRIPT install, style isolation approval or logged-in ChatGPT verified.'
          echo 'No vendor JS or installation bundles are uploaded.'
