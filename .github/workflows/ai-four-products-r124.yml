name: AI Four Products R1.2.4 official discovery and Page package gates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-four-products-r124.yml'
      - 'official-pages/**'
      - 'examples/programs/chatgpt-jump-top/**'
      - 'official-tools/catalog.json'
      - 'src/scripting/user-scripts/official-page-catalog.js'
      - 'src/sidebar-tools/official-catalog.js'
      - 'src/ui/extension-center.js'
      - 'src/ui/extension-center-model.js'
      - 'src/ui/sidebar-tools.js'
      - 'scripts/build-official-pages.mjs'
      - 'scripts/prepare-public.mjs'
      - 'scripts/verify-package.mjs'
      - 'tests/environment/official-page-catalog-r124.test.mjs'
      - 'tests/environment/extension-center-official-pages-r124.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-four-products-r124-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record exact commit and Node runtime
        run: |
          git rev-parse HEAD
          node --version
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse changed runtime and release modules
        run: |
          node --check src/scripting/user-scripts/official-page-catalog.js
          node --check src/ui/extension-center-model.js
          node --check src/ui/extension-center.js
          node --check src/ui/sidebar-tools.js
          node --check scripts/build-official-pages.mjs
          node --check scripts/prepare-public.mjs
          node --check scripts/verify-package.mjs
      - name: Build existing official React Sidebar Tool prerequisites
        run: |
          npm run pretest
          node scripts/build-cookie-editor-react.mjs
      - name: Validate trust, blocked discovery and old installation identity
        run: |
          node --test tests/environment/official-page-catalog-r124.test.mjs \
            tests/environment/extension-center-official-pages-r124.test.mjs \
            tests/environment/sidebar-default-preinstall-r48.test.mjs
      - name: Generate noninstalling Page discovery bundle from pinned source
        run: |
          node scripts/build-official-pages.mjs --out "$RUNNER_TEMP/opendesk-official-pages-r124"
          test -s "$RUNNER_TEMP/opendesk-official-pages-r124/official-pages/catalog.json"
      - name: Explicitly keep native Chrome and Mac installation unverified
        run: echo 'NODE_PACKAGE_CATALOG_ONLY; CHROME_PASS=NOT_TESTED'

  scroll-candidate:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Freeze Scroll candidate without installing it
        run: |
          node scripts/validate-program-project.mjs examples/programs/chatgpt-jump-top
          node scripts/build-program-project.mjs examples/programs/chatgpt-jump-top --out "$RUNNER_TEMP/scroll-r124"
          node scripts/build-page-install-package.mjs \
            --input "$RUNNER_TEMP/scroll-r124/program.opendesk-draft.json" \
            --out "$RUNNER_TEMP/scroll-r124/ai-scroll-navigation.opendesk-page.json" \
            --revision 1 --title "AI 对话滚动导航"
      - name: Validate immutable new identity and origin authorization
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {validatePageInstallPackage} from './src/scripting/user-scripts/page-install-package.js';
          const file=process.env.RUNNER_TEMP+'/scroll-r124/ai-scroll-navigation.opendesk-page.json';
          const bytes=await readFile(file),pkg=await validatePageInstallPackage(JSON.parse(bytes));
          assert.equal(pkg.programId,'opendesk.ai-scroll-navigation');
          assert.equal(pkg.version,'0.4.0');
          assert.equal(pkg.revision,1);
          assert.equal(pkg.title,'AI 对话滚动导航');
          assert.deepEqual(pkg.pageRules.matches,[
            'https://chatgpt.com/*','https://chat.deepseek.com/*','https://gemini.google.com/*'
          ]);
          assert.deepEqual(pkg.pageRules.excludeMatches,[]);
          assert.equal(pkg.pageRules.world,'USER_SCRIPT');
          assert.equal(pkg.pageRules.allFrames,false);
          assert.equal(pkg.pageRules.runAt,'document_idle');
          console.log('SCROLL_CANDIDATE_STATIC_VALIDATED',pkg.programId,pkg.version,pkg.sourceHash,pkg.packageHash,bytes.length);
          NODE

      - name: Validate committed Scroll formal package is byte-identical to current builder output
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const committed=await readFile('examples/programs/chatgpt-jump-top/ai-scroll-navigation.opendesk-page.json');
          const rebuilt=await readFile(process.env.RUNNER_TEMP+'/scroll-r124/ai-scroll-navigation.opendesk-page.json');
          assert.deepEqual(committed,rebuilt,'Page formal package differs from latest compiled source');
          console.log('SCROLL_SOURCE_REBUILD_AND_FORMAL_PACKAGE_EQUAL',committed.length);
          NODE
