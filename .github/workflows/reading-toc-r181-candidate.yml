name: Reading TOC R1.8.1 - source-derived release candidate evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reading-toc-r181-candidate.yml'
      - 'examples/sidebar-tools/reading-toc/src/style.css'
      - 'tests/framework/reading-toc-preview-r14-native.test.mjs'
      - 'tests/environment/reading-toc-localization-preview-r12.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate v1.0.8 candidate and the two exact official source previews
        run: |
          node scripts/generate-reading-toc-locales.mjs --write
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/reading-toc
          node scripts/preview/build-preview.mjs --tool reading-toc --surface side-panel --scenario success --theme light --width 360 --height 760 --out artifacts/reading-toc-r181/reading-toc-r12-interactive-preview.html
          node scripts/preview/build-preview.mjs --tool reading-toc --surface page-overlay --scenario success --theme light --width 360 --height 760 --out artifacts/reading-toc-r181/reading-toc-r12-overlay-preview.html
          sha256sum artifacts/sidebar-tools/reading-toc/1.0.8/reading-toc.opendesk-tool.json artifacts/reading-toc-r181/*.html
          wc -c artifacts/sidebar-tools/reading-toc/1.0.8/reading-toc.opendesk-tool.json artifacts/reading-toc-r181/*.html
      - name: Candidate focused sources, strict check and production builds
        run: |
          node --test tests/environment/reading-toc-ai-r18.test.mjs tests/environment/reading-toc-r41.test.mjs tests/environment/reading-toc-recovery-r48.test.mjs
          npm run check
          npm run build
          npm run build:dev
          npm run verify
      - name: Assert both committed source-derived previews are byte-reproducible
        run: node --test tests/environment/reading-toc-localization-preview-r12.test.mjs
      - name: Install Chrome for Testing (offline preview only)
        id: cft
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Real Chromium offline preview rendering and screenshot evidence
        env:
          CHROME_BIN: ${{ steps.cft.outputs.chrome-path }}
        run: xvfb-run -a node --test tests/framework/reading-toc-preview-r14-native.test.mjs
      - name: Keep true candidate and previews even if unrelated build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-toc-r181-exact-source-candidate
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/sidebar-tools/reading-toc/1.0.8/reading-toc.opendesk-tool.json
            artifacts/reading-toc-r181/
            artifacts/reading-toc-r41/
            docs/framework/evidence/wxt/builds/build-production.json

  macos-source-and-chrome:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: macOS 1.0.8 package, exact preview and source contract
        run: |
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/reading-toc
          node --test tests/environment/reading-toc-ai-r18.test.mjs tests/environment/reading-toc-localization-preview-r12.test.mjs
          npm run check
          npm run build
          npm run build:dev
          npm run verify
      - name: Install Chrome for Testing on GitHub hosted macOS
        id: cft
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Native macOS Chrome offline file previews
        env:
          CHROME_BIN: ${{ steps.cft.outputs.chrome-path }}
        run: node --test tests/framework/reading-toc-preview-r14-native.test.mjs
      - name: Native macOS Chrome installed extension TOC regression
        env:
          CHROME_BIN: ${{ steps.cft.outputs.chrome-path }}
        run: node --test tests/framework/reading-toc-native-r41.test.mjs
      - name: Retain hosted macOS Chrome screenshots (not user Mac upgrade)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-toc-r181-macos-native-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/reading-toc-r41/
            artifacts/reading-toc-r181/
            docs/framework/evidence/wxt/builds/build-production.json
