name: Sidebar R21 integrated UI quality
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/design-system.css'
      - 'src/ui/tool-shell.css'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/tool.html'
      - 'scripts/tests/sidebar-r19-layout-visual.mjs'
      - 'tests/environment/sidebar-r21-design-system.test.mjs'
      - 'docs/product/sidebar-ui-spec.zh-CN.md'
      - '.github/workflows/sidebar-r21-ui-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Print exact candidate SHA
        run: git rev-parse HEAD
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: R21 and affected Sidebar/Tools/Workflow contracts
        run: |
          node --test tests/environment/sidebar-r21-design-system.test.mjs tests/environment/sidebar-ui-preview.test.mjs tests/environment/sidebar-tools.test.mjs tests/environment/sidebar-tools-host.test.mjs tests/environment/workflow-ui-states.test.mjs tests/environment/task-workbench.test.mjs
      - name: Source, production and development package verification
        run: |
          npm run check
          npm run build
          npm run build:dev
          npm run verify
