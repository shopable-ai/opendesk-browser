name: Time Review R1.6 - trusted native macOS Chrome Side Panel

on:
  push:
    branches: [main]
    paths:
      - 'tests/framework/time-review-r13-native.test.mjs'
      - 'src/time-review/**'
      - 'src/ui/sidebar-tools.js'
      - 'tests/framework/time-review-r13-visual.mjs'
      - 'examples/sidebar-tools/time-review/**'
      - 'tests/environment/time-review-*.test.mjs'
      - '.github/workflows/time-review-r13-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/sidebar-tools/time-review/**'
      - 'src/time-review/**'
      - 'src/ui/sidebar-tools.js'
      - 'tests/framework/time-review-r13-native.test.mjs'
      - '.github/workflows/time-review-r13-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs real Node and installable-package checks even while macos-15 queues.
  # This is NOT a substitute for the separate installed Chrome acceptance job.
  node-linux-time-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real Node R1.8 Time Review and Side Panel host regressions
        id: regressions
        run: |
          mkdir -p artifacts/time-review-r18-node-build
          node --version | tee artifacts/time-review-r18-node-build/node-version.txt
          set -o pipefail
          node --test \
            tests/environment/time-review-r16-trusted-native.test.mjs \
            tests/environment/time-review-r15-site-grants.test.mjs \
            tests/environment/time-review-r13-service.test.mjs \
            tests/environment/time-review-r13-consent.test.mjs \
            tests/environment/sidebar-tools-host.test.mjs \
            tests/environment/time-review-r12.test.mjs \
            tests/environment/time-review-r13.test.mjs \
            tests/environment/time-review-host-controls-r51.test.mjs \
            tests/environment/time-review-r14-sync-outbox.test.mjs \
            2>&1 | tee artifacts/time-review-r18-node-build/node.tap
      - name: Real official tool, Source Check, Production and Development builds
        id: builds
        if: ${{ success() || steps.regressions.outcome == 'failure' }}
        run: |
          set -o pipefail
          {
            npm run build:sidebar-tool -- examples/sidebar-tools/time-review
            npm run check
            npm run build
            npm run build:dev
            npm run verify
          } 2>&1 | tee artifacts/time-review-r18-node-build/build.log
      - name: Candidate and artifact hashes, identity and byte sizes
        if: always()
        run: |
          mkdir -p artifacts/time-review-r18-node-build
          {
            printf 'git_sha=%s\n' "$GITHUB_SHA"
            node --version
            tool_version="$(node -p 'require("./examples/sidebar-tools/time-review/tool.config.json").version')"
            for file in \
              "artifacts/sidebar-tools/time-review/$tool_version/time-review.opendesk-tool.json" \
              dist/production/official-tools/time-review/time-review.opendesk-tool.json \
              dist/production/ui/tool-shell.js \
              dist/development/ui/tool-shell.js \
              dist/production/sw.js \
              dist/development/sw.js; do
              if test -f "$file"; then
                sha256sum "$file"
                wc -c "$file"
              else
                printf 'NOT_BUILT %s\n' "$file"
              fi
            done
          } > artifacts/time-review-r18-node-build/identities.txt
          cat artifacts/time-review-r18-node-build/identities.txt
      - name: Preserve raw Node and build receipts including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-review-r18-node-build-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/time-review-r18-node-build/

  native-mac-time-review:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real R1.3 model and consent regression
        run: |
          node --check tests/framework/time-review-r13-native.test.mjs
          node --test tests/environment/time-review-r12.test.mjs tests/environment/time-review-r13.test.mjs tests/environment/time-review-r13-service.test.mjs tests/environment/time-review-r13-consent.test.mjs tests/environment/time-review-host-controls-r51.test.mjs tests/environment/time-review-r14-sync-outbox.test.mjs tests/environment/time-review-r15-site-grants.test.mjs tests/environment/time-review-r16-trusted-native.test.mjs
      - name: Build standalone Time Review package and verify source/pack limits
        run: |
          npm run build:sidebar-tool -- examples/sidebar-tools/time-review
          TOOL_VERSION="$(node -p 'require("./examples/sidebar-tools/time-review/tool.config.json").version')"
          shasum -a 256 "artifacts/sidebar-tools/time-review/$TOOL_VERSION/time-review.opendesk-tool.json"
      - name: Build and verify both Production and Development Chrome MV3 packages
        run: |
          npm run check
          npm run build
          npm run build:dev
          npm run verify
          shasum -a 256 dist/production/official-tools/time-review/time-review.opendesk-tool.json
          shasum -a 256 dist/production/sw.js
          wc -c dist/production/sw.js
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
      - name: Real Chromium source-UI visual widths, pointer, keyboard, touch, DPR
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/framework/time-review-r13-visual.mjs artifacts/time-review-r13-native/visual
      - name: Real Mac CFT installed tool, native SIDE_PANEL, trusted opt-in, actual download
        env:
          OPENDESK_TIME_REVIEW_NATIVE: '1'
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          OPENDESK_TIME_NATIVE_EVIDENCE: artifacts/time-review-r13-native
        run: node --test tests/framework/time-review-r13-native.test.mjs
      - name: Keep raw Native Chrome evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-review-r13-actual-macos-chrome-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path:
            artifacts/time-review-r13-native/
