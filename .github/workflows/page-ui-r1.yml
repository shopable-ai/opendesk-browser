name: Page UI R1 - asset build and lifecycle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/page-ui-r1.yml'
      - 'scripts/program-assets.mjs'
      - 'scripts/validate-program-project.mjs'
      - 'scripts/build-program-project.mjs'
      - 'src/scripting/user-scripts/page-ui.js'
      - 'src/scripting/user-scripts/page-ui-mount.js'
      - 'examples/programs/page-ui-basic/**'
      - 'examples/programs/sidebar-assets-contract/**'
      - 'tests/environment/page-ui.test.mjs'
      - 'tests/environment/page-ui-mount.test.mjs'
      - 'examples/tasks/demo-form.html'
      - 'tests/environment/program-assets.test.mjs'
      - 'tests/environment/program-build.test.mjs'
      - 'tests/environment/sidebar-project-demo.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page-ui-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: UI ownership, asset URLs and previous program regressions
        run: |
          node --test tests/environment/page-ui.test.mjs tests/environment/page-ui-mount.test.mjs tests/environment/program-assets.test.mjs tests/environment/program-build.test.mjs tests/environment/program-project.test.mjs tests/environment/sidebar-project-demo.test.mjs
      - name: Build genuine multi-file Page UI with CSS JSON and PNG
        run: |
          node scripts/validate-program-project.mjs examples/programs/page-ui-basic
          npm run build:program -- examples/programs/page-ui-basic
          npm run build:program -- examples/programs/page-ui-basic --mode development
      - name: Verify original Page and Controller program build remains usable
        run: |
          npm run build:program -- examples/programs/page-heading
          npm run build:program -- examples/programs/controller-title
