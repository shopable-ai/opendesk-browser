name: R3.1 installed permissions real Chrome

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'wxt.config.mjs'
      - 'scripts/build-contract.mjs'
      - 'scripts/compact-schema.mjs'
      - 'scripts/verify-package.mjs'
      - 'src/sw.js'
      - 'src/run-host.js'
      - 'src/platform/chrome/permission-gate.js'
      - 'src/platform/host/**'
      - 'src/platform/tasks/**'
      - 'src/scripting/user-scripts/**'
      - 'src/ui/site-access.js'
      - 'src/ui/script-editor.js'
      - 'src/ui/page-program-library.js'
      - 'src/ui/task-workbench.js'
      - 'src/ui/tool-shell.js'
      - 'src/ui/page-candidate-source.js'
      - 'src/ui/tool.html'
      - 'tests/environment/*permission*.test.mjs'
      - 'tests/environment/page-installed-programs.test.mjs'
      - 'tests/environment/page-program-library.test.mjs'
      - 'tests/environment/task-workbench.test.mjs'
      - 'tests/environment/task-package-flow.test.mjs'
      - 'tests/framework/k3-controller-authority.test.mjs'
      - 'tests/framework/install-once-permissions-native.mjs'
      - 'tests/framework/cft-isolated-launcher.py'
      - 'tests/framework/k5-sdk-native-restart.py'
      - 'tests/framework/sidebar-native-session.mjs'
      - '.github/workflows/install-once-r31-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-page-native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Targeted authorization and lifecycle components
        run: |
          mkdir -p docs/framework/evidence/install-once-r31-native
          node --test --test-reporter=tap tests/environment/permission-gate.test.mjs tests/environment/site-access.test.mjs tests/environment/script-editor.test.mjs tests/environment/task-workbench.test.mjs tests/environment/task-package-flow.test.mjs tests/environment/page-installed-programs.test.mjs tests/environment/page-program-library.test.mjs tests/environment/page-script-preview.test.mjs tests/environment/page-program-package.test.mjs tests/environment/user-script-dependency-flow.test.mjs tests/environment/native-page-program.test.mjs tests/framework/k3-controller-authority.test.mjs | tee docs/framework/evidence/install-once-r31-native/components.log
      - run: npm run check | tee docs/framework/evidence/install-once-r31-native/check.log
      - run: npm run build:dev | tee docs/framework/evidence/install-once-r31-native/build.log
        env:
          OPENDESK_BUILD_EVIDENCE_DIR: docs/framework/evidence/install-once-r31-native
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
      - name: Copy the complete pinned CFT app into an owned CI directory
        id: owned-chrome
        env:
          SETUP_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          binary = Path(os.environ['SETUP_CHROME']).resolve()
          app = next((path for path in binary.parents if path.name == 'Google Chrome for Testing.app'), None)
          if app is None:
              raise RuntimeError('The setup action must supply the complete official CFT app')
          owned = Path(tempfile.mkdtemp(prefix='opendesk-r31-cft-', dir=os.environ['RUNNER_TEMP']))
          destination = owned / app.name
          subprocess.run(['/usr/bin/ditto', str(app), str(destination)], check=True)
          executable = destination / 'Contents/MacOS/Google Chrome for Testing'
          version = subprocess.check_output([str(executable), '--version'], text=True).strip()
          if not version.endswith('155.0.8059.39'):
              raise RuntimeError('Pinned CFT version mismatch: ' + version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('binary=' + str(executable) + '\n')
          PY
      - name: Native Install, 20 auto-runs, Worker restart and same-profile browser restart
        env:
          CHROME_FOR_TESTING_BIN: ${{ steps.owned-chrome.outputs.binary }}
          OPENDESK_R31_PACKAGE_DIR: dist/development
          OPENDESK_R31_EVIDENCE: docs/framework/evidence/install-once-r31-native
        run: node tests/framework/install-once-permissions-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-once-r31-native-${{ github.sha }}-${{ github.run_attempt }}
          path: docs/framework/evidence/install-once-r31-native
          if-no-files-found: warn
