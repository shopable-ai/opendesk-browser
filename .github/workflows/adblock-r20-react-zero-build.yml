name: AdBlock React R2 · Offline file preview
on:
  push:
    branches: [main]
    paths:
      - 'examples/sidebar-tools/adblock/preview/**'
      - 'src/libs/page-frameworks/react-19.2.0.js'
      - 'src/ui/design-tokens.css'
      - 'src/ui/design-system.css'
      - '.github/workflows/adblock-r20-react-zero-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adblock-r20-react-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-file-chrome:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and pinned HTM reproducibility without npm
        shell: bash
        run: |
          set -euo pipefail
          node --check examples/sidebar-tools/adblock/preview/app.js
          node --check examples/sidebar-tools/adblock/preview/vendor/htm-3.1.1.js
          node --check examples/sidebar-tools/adblock/preview/acceptance.mjs
          node examples/sidebar-tools/adblock/preview/vendor/rebuild-htm.mjs
          git diff --exit-code -- examples/sidebar-tools/adblock/preview/vendor/htm-3.1.1.js
      - name: Install OS CJK fonts for accurate Chinese UI screenshots (CI only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}' ':lang=zh-cn' | tee /tmp/opendesk-cjk-font.txt
          grep -Eq 'Noto (Sans|Serif) CJK' /tmp/opendesk-cjk-font.txt
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Actual React 19.2.0 Chrome file protocol E2E without build or web server
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          ADBLOCK_PREVIEW_EVIDENCE_DIR: ${{ runner.temp }}/adblock-react-r20-evidence
        shell: bash
        run: |
          set -euo pipefail
          # Some macOS-15 CFT runner builds cannot create Chromium's Mach rendezvous service.
          # Prefer the runner's separately installed stable Chrome on macOS; keep CFT for
          # Linux and as a macOS fallback. Never mock the browser or skip the assertions.
          if [[ "$RUNNER_OS" == "macOS" ]] && [[ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]]; then
            export CHROME_BIN="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          fi
          echo "CHROME_BIN=$CHROME_BIN"
          "$CHROME_BIN" --version
          node examples/sidebar-tools/adblock/preview/acceptance.mjs
      - name: Upload real file Chrome screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adblock-r20-${{ matrix.os }}-chrome-file
          path: ${{ runner.temp }}/adblock-react-r20-evidence/*.png
          if-no-files-found: warn
          retention-days: 7
