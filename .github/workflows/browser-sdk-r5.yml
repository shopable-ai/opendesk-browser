name: Browser SDK R5 implementation contracts
on:
  push:
    branches: [main]
    paths:
      - 'src/framework/sdk/browser*.js'
      - 'src/framework/sdk/browser-bindings.js'
      - 'docs/api/browser-sdk-interface-matrix.json'
      - 'docs/api/browser-sdk-execution-manual.zh-CN.md'
      - 'scripts/check-browser-sdk-interface-matrix.mjs'
      - 'scripts/generate-browser-bindings.mjs'
      - 'tests/environment/browser-sdk-interface-matrix.test.mjs'
      - 'src/platform/chrome/browser-tabs.js'
      - 'src/platform/chrome/browser-downloads.js'
      - 'src/platform/chrome/bookmarks.js'
      - 'src/platform/chrome/bookmarks-full.js'
      - 'src/platform/chrome/history.js'
      - 'src/platform/chrome/permission-gate.js'
      - 'src/platform/tasks/schedule-*.js'
      - 'src/platform/storage/index.js'
      - 'src/platform/chrome/cookies.js'
      - 'src/platform/chrome/browser-screenshot*.js'
      - 'src/platform/chrome/browser-network-observe.js'
      - 'src/platform/chrome/context-menus.js'
      - 'src/platform/chrome/browser-cookie-host.js'
      - 'src/ui/trusted-cookie-workbench.js'
      - 'src/ui/trusted-history-workbench.js'
      - 'src/entrypoints/trusted-cookie-ui.js'
      - 'src/entrypoints/context-menus.js'
      - 'src/sw.js'
      - 'src/ui/sidebar-tools/package.js'
      - 'src/ui/scheduled-task-host.js'
      - 'src/platform/host/controller-methods.js'
      - 'src/run-host.js'
      - 'src/ui/tool-shell.js'
      - 'scripts/prepare-public.mjs'
      - 'scripts/build-contract.mjs'
      - 'scripts/audit-fixed-entries.mjs'
      - 'tests/environment/sw-budget-policy.test.mjs'
      - 'tests/environment/fixed-entries-audit.test.mjs'
      - 'scripts/verify-package.mjs'
      - 'src/ui/tool.html'
      - 'src/ui/sidebar-tools.js'
      - 'src/sidebar-tools/bridge.js'
      - 'tests/environment/browser-*.test.mjs'
      - 'tests/environment/browser-sdk-*.test.mjs'
      - 'docs/framework/workstreams/browser-sdk-*'
      - 'docs/framework/workstreams/browser-framework-four-layer-ledger.json'
      - 'docs/framework/workstreams/browser-cookies-r6.md'
      - 'docs/api/browser-framework-four-layer-ledger.zh-CN.md'
      - 'docs/api/browser-sdk-full-interface-inventory.zh-CN.md'
      - 'docs/api/browser-capability-universe.zh-CN.md'
      - 'scripts/check-browser-framework-ledger.mjs'
      - 'tests/environment/browser-framework-ledger.test.mjs'
      - 'examples/sidebar-tools/browser-sdk-acceptance/**'
      - 'tests/framework/browser-sdk-r106-native.mjs'
      - 'scripts/check-browser-sdk-coverage.mjs'
      - 'tests/environment/browser-sdk-coverage.test.mjs'
      - '.github/workflows/browser-sdk-r5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-host-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Scoped Side Panel size limits and unchanged non-shell budgets
        run: node --test --test-reporter=spec tests/environment/fixed-entries-audit.test.mjs tests/environment/sw-budget-policy.test.mjs
      - name: R10.7 public SDK wrapper routes and trusted-boundary regressions
        run: node --test --test-reporter=spec tests/environment/browser-sdk-r107-public-routing.test.mjs tests/environment/browser-sdk-r11-declarative.test.mjs tests/environment/browser-sdk-r11-bindings.test.mjs tests/environment/browser-sdk-r11-native-direct.test.mjs tests/environment/browser-sdk-r11-generated-catalog.test.mjs tests/environment/browser-sdk-r116-mapping.test.mjs tests/environment/browser-sdk-r113-direct-host.test.mjs
      - name: Managed Proxy browser-wide ownership, PAC and STOP recovery (Node fixtures)
        run: node --test --test-reporter=spec tests/environment/browser-managed-proxy.test.mjs tests/environment/browser-managed-proxy-host.test.mjs tests/environment/browser-sdk-managed-proxy-r54.test.mjs
      - name: AI VIP Share local 7897 HTTP CONNECT and SOCKS5 line-probe fixtures
        run: node --test --test-reporter=spec examples/sidebar-tools/ai-vip-share/dev/local-test/proxy-line-probe.test.mjs
      - name: R11.6 generated Browser SDK Registry, bindings and developer artifact drift
        run: |
          node scripts/generate-browser-bindings.mjs --check
          node scripts/generate-browser-bindings.mjs --check-developer
      - name: R11.2 Full Bookmarks native-driver fixture, 500+ pagination and hostile-operator regression
        run: node --test --test-reporter=spec tests/environment/browser-sdk-r112-full-bookmarks.test.mjs
      - name: R10.7 installed acceptance tool public-call UI and package regression
        run: node --test --test-reporter=spec tests/environment/browser-sdk-r107-installed-acceptance.test.mjs
      - name: R10.7 native driver PREPARE (not a Native PASS)
        run: node --test --test-reporter=spec tests/framework/browser-sdk-r106-native.mjs
      - name: Preserve preflight receipt, never native success evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-sdk-r107-prepared-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: docs/framework/workstreams/evidence/browser-sdk-r106-native-driver/prepare-receipt.json
      - name: Explicit Browser SDK contracts, Host, native API mocks and denial paths
        run: |
          node --test --test-reporter=spec \
            tests/environment/browser-sdk-r8-catalog.test.mjs \
            tests/environment/browser-sdk-r8-cookies.test.mjs \
            tests/environment/browser-sdk-r7-trusted-cookies.test.mjs \
            tests/environment/browser-sdk-r7-mapping.test.mjs \
            tests/environment/browser-sdk-contract-compat.test.mjs \
            tests/environment/browser-sdk-coverage.test.mjs \
            tests/environment/browser-tabs-host.test.mjs \
            tests/environment/browser-sidepanel-host.test.mjs \
            tests/environment/browser-sdk-r2-host.test.mjs \
            tests/environment/browser-screenshot-host.test.mjs \
            tests/environment/browser-screenshot-resources.test.mjs \
            tests/environment/browser-network-observe-host.test.mjs \
            tests/environment/browser-sdk-approval-timeout.test.mjs \
            tests/environment/browser-sdk-r2-demo.test.mjs \
            tests/environment/browser-sdk-p3-implementation.test.mjs \
            tests/environment/browser-sdk-p3-bookmarks.test.mjs \
            tests/environment/browser-sdk-p4-implementation.test.mjs \
            tests/environment/browser-sdk-r9-installed-cookies.test.mjs \
            tests/environment/browser-sdk-r9-installed-host.test.mjs \
            tests/environment/browser-sdk-p5-scheduler.test.mjs \
            tests/environment/browser-sdk-r106-trusted.test.mjs \
            tests/environment/browser-sdk-r106-history-ui.test.mjs \
            tests/environment/browser-sdk-r106-host.test.mjs \
            tests/environment/browser-sdk-r106-core-contract-gaps.test.mjs \
            tests/environment/browser-sdk-r106-cookie-contract-gaps.test.mjs \
            tests/environment/scheduled-tasks-r1.test.mjs \
            tests/environment/scheduled-task-timezone-r25.test.mjs \
            tests/environment/browser-sdk-freeze.test.mjs
      - name: R8 pinned Chromium schema offline drift check
        run: node scripts/sync-chrome-api-catalog.mjs --check
      - name: R9 frozen full Chromium matrix structural and approved-operation check
        run: |
          node scripts/check-browser-sdk-interface-matrix.mjs --check
          node --test tests/environment/browser-sdk-interface-matrix.test.mjs
      - name: Browser SDK exact registry and human acceptance ledger
        run: node scripts/check-browser-sdk-coverage.mjs --check
      - name: Browser framework four-layer registry and Cookie priority ledger
        run: |
          node scripts/check-browser-framework-ledger.mjs --check
          node --test tests/environment/browser-framework-ledger.test.mjs
      - name: Source checks
        run: npm run check
  sdk-product-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run build:dev
      - run: npm run build:size
      - run: npm run verify
      - name: Save exact production candidate for manual Chrome acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: browser-sdk-r5-unpacked-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: dist/production/
