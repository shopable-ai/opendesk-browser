name: Analytics R1.12 six-type authority and HTTP checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-r10.yml'
      - 'src/analytics/**'
      - 'services/analytics/**'
      - 'tests/environment/analytics-r10*.test.mjs'
      - 'tests/environment/analytics-r11*.test.mjs'
      - 'tests/environment/analytics-r12*.test.mjs'
      - 'tests/environment/page-installed-programs.test.mjs'
      - 'tests/environment/page-program-library.test.mjs'
      - 'src/scripting/user-scripts/installed-programs.js'
      - 'src/platform/host/broker.js'
      - 'src/ui/page-program-library.js'
      - 'src/ui/develop-fields.js'
      - 'src/ui/react/tabs/develop-advanced.tsx'
      - 'src/ui/workflow/**'
      - 'src/ui/reading-toc-**'
      - 'examples/sidebar-tools/reading-toc/**'
      - 'tests/environment/workflow-direct-execution.test.mjs'
      - 'src/sw.js'
      - 'src/ui/task-workbench.js'
      - 'src/native-agent/settings.html'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/tool-shell.js'
      - 'src/native-agent/settings.js'
      - 'examples/sidebar-tools/prompt-shortcuts/src/main.js'
      - 'examples/sidebar-tools/prompt-shortcuts/trusted/page.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-http-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check production contract and all relevant integration points
        run: |
          node --check src/analytics/contract.js
          node --check src/analytics/collector.js
          node --check src/analytics/host.js
          node --check src/analytics/authority-projection.js
          node --check src/analytics/consent-ui.js
          node --check services/analytics/worker.mjs
          node --check src/sw.js
          node --check src/ui/sidebar-tools.js
          node --check src/ui/task-workbench.js
          node --check src/ui/page-program-library.js
          node --check src/ui/develop-fields.js
          node --check src/scripting/user-scripts/installed-programs.js
          node --check src/platform/host/broker.js
          node --check src/ui/workflow/workflow-view.js
          node --check src/ui/tool-shell.js
          node --check src/native-agent/settings.js
          node --check examples/sidebar-tools/prompt-shortcuts/src/main.js
          node --check examples/sidebar-tools/prompt-shortcuts/trusted/page.js
      - name: Real HTTP + SQLite persistence and privacy checks (not Chrome or deployed PostHog)
        run: node --test tests/environment/analytics-r10*.test.mjs tests/environment/analytics-r11*.test.mjs tests/environment/analytics-r12*.test.mjs tests/environment/page-installed-programs.test.mjs tests/environment/page-program-library.test.mjs
