name: Sidebar Preview Contract R1
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/design-tokens.css'
      - 'src/ui/design-system.css'
      - 'src/libs/page-frameworks/react-19.2.0.js'
      - 'scripts/build-sidebar-tool.mjs'
      - 'scripts/preview/**'
      - 'scripts/tests/bookmark-manager-r26-preview-chrome.mjs'
      - 'scripts/tests/adblock-preview-chrome.mjs'
      - 'scripts/tests/sidebar-preview-runtime-chrome.mjs'
      - 'scripts/tests/four-tools-source-preview-chrome.mjs'
      - 'scripts/templates/sidebar-tool-preview-shell.html'
      - 'scripts/templates/sidebar-preview.html'
      - 'scripts/sidebar-preview-kit.mjs'
      - 'tests/environment/sidebar-preview-kit.test.mjs'
      - 'scripts/tests/sidebar-preview-runtime-chrome.mjs'
      - 'examples/sidebar-tools/quick-notes/**'
      - 'examples/sidebar-tools/bookmark-manager/**'
      - 'examples/sidebar-tools/adblock/**'
      - 'projects/markdown-workbench/**'
      - 'examples/sidebar-tools/web-markdown-clipper/**'
      - 'examples/sidebar-tools/knowledge-inbox/**'
      - 'examples/sidebar-tools/ai-knowledge-answers/**'
      - 'tests/environment/four-tools-ux-r1.test.mjs'
      - 'tests/environment/adblock-preview-contract.test.mjs'
      - 'tests/environment/sidebar-preview-contract.test.mjs'
      - 'contracts/ui-preview/**'
      - '.github/workflows/sidebar-preview-contract.yml'
  workflow_dispatch:
jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checked-in preview-kit parser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate syntax and source freshness
        run: |
          node --check scripts/preview/shared-tool-design.mjs
          node --check scripts/preview/sidebar-shell-source.mjs
          node --check scripts/preview/build-preview.mjs
          node --check scripts/preview/check-preview-contract.mjs
          node --check scripts/preview/quick-notes-mock.js
          node --check scripts/preview/bookmark-manager-mock.js
          node --check scripts/preview/markdown-workbench-mock.js
          node --check scripts/preview/web-markdown-clipper-scenario-mock.js
          node --check scripts/preview/knowledge-inbox-mock.js
          node --check scripts/preview/ai-knowledge-answers-mock.js
          node --check tests/environment/four-tools-ux-r1.test.mjs
          node --check scripts/preview/adblock-host-source.mjs
          node --check scripts/preview/adblock-mock.js
          node --check scripts/preview/adblock-host-preview.js
          node --check scripts/tests/adblock-preview-chrome.mjs
          node --check tests/environment/adblock-preview-contract.test.mjs
          node scripts/preview/check-preview-contract.mjs
      - name: Verify lock is byte-identical to official source regeneration
        run: |
          node scripts/preview/check-preview-contract.mjs --update-lock
          git diff --exit-code -- contracts/ui-preview/quick-notes.lock.json
          node scripts/preview/check-preview-contract.mjs
      - name: Build production Shared UI before any source-bound AdBlock preview tests
        run: |
          node scripts/build-adblock-react.mjs
          # Current candidate is built from src/App.jsx; no in-src output is maintained.
          test -s examples/sidebar-tools/adblock/dist/build-ready.json
          npm run build
          test -s dist/production/sidebar-shared-ui.js
      - name: Verify package identity, mock safety and negative guards
        run: node --test tests/environment/sidebar-preview-shell.test.mjs tests/environment/sidebar-preview-contract.test.mjs tests/environment/sidebar-quick-notes.test.mjs tests/environment/sidebar-preview-kit.test.mjs tests/environment/browser-tool-creation-workflow-r21.test.mjs tests/environment/adblock-preview-contract.test.mjs tests/environment/four-tools-ux-r1.test.mjs
      - name: Build official tool and offline preview matrix
        run: |
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/quick-notes --out artifacts/quick-notes-preview-proof.opendesk-tool.json
          for width in 320 360 400 480; do
            for theme in light dark; do
              node scripts/preview/build-preview.mjs --tool quick-notes --surface side-panel --scenario success --theme "$theme" --width "$width"
            done
          done
          for scenario in empty error loading permission-denied untrusted; do
            node scripts/preview/build-preview.mjs --tool quick-notes --surface side-panel --scenario "$scenario" --theme light --width 360
          done
          for scenario in success empty error loading permission-denied untrusted; do
            node scripts/preview/build-preview.mjs --tool bookmark-manager --surface side-panel --scenario "$scenario" --theme light --width 360
            node scripts/preview/build-preview.mjs --tool adblock --surface side-panel --scenario "$scenario" --theme light --width 360
          done
      - name: Generate four official source-bound HTML previews (SDK simulation only)
        run: |
          set -euo pipefail
          for tool in markdown-workbench web-markdown-clipper knowledge-inbox ai-knowledge-answers; do
            node scripts/preview/build-preview.mjs --tool "$tool" --surface side-panel --scenario success --theme light --width 360
          done
      - uses: actions/upload-artifact@v4
        with:
          name: four-tools-source-bound-preview
          path: |
            artifacts/previews/markdown-workbench/*
            artifacts/previews/web-markdown-clipper/*
            artifacts/previews/knowledge-inbox/*
            artifacts/previews/ai-knowledge-answers/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: adblock-source-bound-preview
          path: artifacts/previews/adblock/*.html
          if-no-files-found: error
      - name: Provide CJK fonts for shared Chrome visual evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}' ':lang=zh-cn' | grep -Eq 'Noto (Sans|Serif) CJK'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Run generated offline preview in real headless Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/sidebar-preview-runtime-chrome.mjs artifacts/preview-chrome
      - name: AdBlock offline DOM and message preview in Chrome (not user gesture)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/adblock-preview-chrome.mjs artifacts/preview-chrome
      - name: R2.6 Bookmark Manager interactive source-bound preview in Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/bookmark-manager-r26-preview-chrome.mjs artifacts/preview-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: quick-notes-contract-previews
          path: |
            artifacts/previews/quick-notes/*.html
            artifacts/preview-chrome/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-manager-source-bound-preview
          path: artifacts/previews/bookmark-manager/*.html
          if-no-files-found: error

  # Independent of the unrelated quick-notes/adblock global preview lock.
  # Uses the SAME canonical build-preview.mjs and bundled production tool UI.
  four-tools-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install canonical preview dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate exact four-tool HTML and Markdown responsive variants
        run: |
          set -euo pipefail
          for tool in markdown-workbench web-markdown-clipper knowledge-inbox ai-knowledge-answers; do
            node scripts/preview/build-preview.mjs --tool "$tool" --surface side-panel --scenario success --theme light --width 360
          done
          for width in 320 400 440; do
            node scripts/preview/build-preview.mjs --tool markdown-workbench --surface side-panel --scenario success --theme light --width "$width"
          done
          for width in 320 360 400 440; do
            node scripts/preview/build-preview.mjs --tool markdown-workbench --surface side-panel --scenario success --theme dark --width "$width"
          done
      - name: Check four source-bound preview contracts
        run: |
          node --check scripts/tests/four-tools-source-preview-chrome.mjs
          node --test tests/environment/four-tools-ux-r1.test.mjs
      - name: Audit package freshness separately from source HTML
        if: always()
        shell: bash
        run: |
          set +e
          echo '### R1.2 package source matching (diagnostic, not promotion)' >> "$GITHUB_STEP_SUMMARY"
          for tool in markdown-workbench web-markdown-clipper knowledge-inbox ai-knowledge-answers; do
            node scripts/build-sidebar-tool.mjs "examples/sidebar-tools/$tool" --check-project > /tmp/four-tool-package-check.log 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "- $tool: PACKAGE_MATCH" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $tool: PACKAGE_STALE_OR_MISSING (not promoted, not installed)" >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/four-tool-package-check.log
            fi
          done
      - uses: browser-actions/setup-chrome@v2
        id: chrome-four-tools
      - name: Drive actual packaged UI in headless Chrome (SDK mock only)
        env:
          CHROME_BIN: ${{ steps.chrome-four-tools.outputs.chrome-path }}
        run: node scripts/tests/four-tools-source-preview-chrome.mjs artifacts/preview-chrome/four-tools-r12
      - name: Upload generated HTML, context and Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-tools-source-bound-r12
          path: |
            artifacts/previews/markdown-workbench/
            artifacts/previews/web-markdown-clipper/
            artifacts/previews/knowledge-inbox/
            artifacts/previews/ai-knowledge-answers/
            artifacts/preview-chrome/four-tools-r12/
          if-no-files-found: warn
