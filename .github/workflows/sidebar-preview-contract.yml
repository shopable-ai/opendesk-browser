name: Sidebar Preview Contract R1
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/design-tokens.css'
      - 'src/ui/design-system.css'
      - 'scripts/build-sidebar-tool.mjs'
      - 'scripts/preview/**'
      - 'scripts/tests/bookmark-manager-r26-preview-chrome.mjs'
      - 'scripts/templates/sidebar-tool-preview-shell.html'
      - 'scripts/templates/sidebar-preview.html'
      - 'scripts/sidebar-preview-kit.mjs'
      - 'tests/environment/sidebar-preview-kit.test.mjs'
      - 'scripts/tests/sidebar-preview-runtime-chrome.mjs'
      - 'examples/sidebar-tools/quick-notes/**'
      - 'examples/sidebar-tools/bookmark-manager/**'
      - 'tests/environment/sidebar-preview-contract.test.mjs'
      - 'contracts/ui-preview/**'
      - '.github/workflows/sidebar-preview-contract.yml'
  workflow_dispatch:
jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checked-in preview-kit parser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate syntax and source freshness
        run: |
          node --check scripts/preview/shared-tool-design.mjs
          node --check scripts/preview/sidebar-shell-source.mjs
          node --check scripts/preview/build-preview.mjs
          node --check scripts/preview/check-preview-contract.mjs
          node --check scripts/preview/quick-notes-mock.js
          node --check scripts/preview/bookmark-manager-mock.js
          node scripts/preview/check-preview-contract.mjs
      - name: Verify package identity, mock safety and negative guards
        run: node --test tests/environment/sidebar-preview-shell.test.mjs tests/environment/sidebar-preview-contract.test.mjs tests/environment/sidebar-quick-notes.test.mjs tests/environment/sidebar-preview-kit.test.mjs
      - name: Build official tool and offline preview matrix
        run: |
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/quick-notes --out artifacts/quick-notes-preview-proof.opendesk-tool.json
          for width in 320 360 400 480; do
            for theme in light dark; do
              node scripts/preview/build-preview.mjs --tool quick-notes --surface side-panel --scenario success --theme "$theme" --width "$width"
            done
          done
          for scenario in empty error loading permission-denied untrusted; do
            node scripts/preview/build-preview.mjs --tool quick-notes --surface side-panel --scenario "$scenario" --theme light --width 360
          done
          for scenario in success empty error loading permission-denied untrusted; do
            node scripts/preview/build-preview.mjs --tool bookmark-manager --surface side-panel --scenario "$scenario" --theme light --width 360
          done
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Run generated offline preview in real headless Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/sidebar-preview-runtime-chrome.mjs artifacts/preview-chrome
      - name: R2.6 Bookmark Manager interactive source-bound preview in Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/tests/bookmark-manager-r26-preview-chrome.mjs artifacts/preview-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: quick-notes-contract-previews
          path: |
            artifacts/previews/quick-notes/*.html
            artifacts/preview-chrome/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-manager-source-bound-preview
          path: artifacts/previews/bookmark-manager/*.html
          if-no-files-found: error
