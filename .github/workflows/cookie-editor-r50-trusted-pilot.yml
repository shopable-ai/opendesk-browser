name: Cookie Editor R5.12 sandbox isolation and SRC cleanup
on:
  push:
    branches: [main]
    paths:
      - 'examples/sidebar-tools/cookie-editor/ui/**'
      - 'examples/sidebar-tools/cookie-editor/preview/react/src/**'
      - 'src/ui/react/tabs/cookie-pilot.*'
      - 'src/ui/react/cookie-editor/**'
      - 'src/ui/react/main.tsx'
      - 'src/ui/trusted-cookie-admission.js'
      - 'src/ui/tool-shell.js'
      - 'tests/environment/cookie-editor-r50-trusted-pilot.test.mjs'
      - '.github/workflows/cookie-editor-r50-trusted-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cookie-trusted-source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile current official Cookie Editor React assets and build receipt
        run: node scripts/build-cookie-editor-react.mjs
      - name: Sandbox isolation, formal legacy package and shared JSX regression
        run: node --test tests/environment/cookie-editor-r50-trusted-pilot.test.mjs tests/environment/cookie-editor-ui.test.mjs tests/environment/cookie-editor-r43-parity.test.mjs
      - name: Build the existing fixed WXT production entry
        run: npm run build
