name: R25.1 local install fixed-version contracts

on:
  push:
    branches: [main]
    paths:
      - 'src/ui/script-editor.js'
      - 'src/ui/local-project.js'
      - 'src/ui/local-project-install.js'
      - 'src/ui/local-project-install-ui.js'
      - 'src/ui/installed-page-tools.js'
      - 'src/ui/tool-shell.js'
      - 'src/ui/tool.html'
      - 'src/ui/tool-shell.css'
      - 'src/ui/page-candidate-source.js'
      - 'src/platform/tasks/**'
      - 'src/ui/task-workbench.js'
      - 'tests/environment/task-workbench.test.mjs'
      - 'src/scripting/user-scripts/installed-programs.js'
      - 'tests/environment/local-project-install-r251.test.mjs'
      - 'tests/environment/local-project-install-ui-r251.test.mjs'
      - 'tests/environment/script-editor.test.mjs'
      - 'tests/environment/local-project-status-ui.test.mjs'
      - 'tests/environment/page-candidate-source.test.mjs'
      - '.github/workflows/local-project-install-r251.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r251-fixed-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-install-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact local-source Page and Task installation contracts
        run: |
          node --test \
            tests/environment/local-project-install-r251.test.mjs \
            tests/environment/local-project-install-ui-r251.test.mjs \
            tests/environment/script-editor.test.mjs \
            tests/environment/page-candidate-source.test.mjs \
            tests/environment/page-program-library.test.mjs \
            tests/environment/page-installed-programs.test.mjs \
            tests/environment/local-project-connection.test.mjs \
            tests/environment/local-project-status-ui.test.mjs \
            tests/environment/task-package-flow.test.mjs \
            tests/environment/task-workbench.test.mjs
      - name: Source and syntax boundaries
        run: npm run check
  production-package:
    needs: local-install-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production WXT build and manifest verification
        run: npm run build
      - name: Development WXT build and manifest verification
        run: npm run build:dev
      - name: Both package receipts and immutable resources
        run: npm run verify
      - name: Preserve component package receipts (not macOS Chrome acceptance)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r251-components-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            docs/framework/evidence/wxt/builds/build-production.json
            docs/framework/evidence/wxt/builds/build-development.json
