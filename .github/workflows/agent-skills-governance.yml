name: Agent Skills governance
on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.agents/workflows/**'
      - 'tests/environment/browser-tool-creation-workflow-r21.test.mjs'
      - 'docs/framework/browser-tool-creation-workflow.zh-CN.md'
      - 'docs/framework/workstreams/browser-tool-creation-workflow-r2-20261015.md'
      - '.github/workflows/extension-creation-intake.md'
      - '.github/workflows/extension-creation-intake.lock.yml'
      - 'tests/environment/agent-skills-r1.test.mjs'
      - 'scripts/agent-skills-r22-eval.mjs'
      - '.github/workflows/agent-skills-governance.yml'
      - 'docs/product/sidebar-ui-spec.zh-CN.md'
      - 'docs/architecture/ui-layout-conventions-r27.zh-CN.md'
      - 'docs/architecture/sidebar-multi-section-tab-contract-r28.zh-CN.md'
      - 'docs/architecture/sidebar-design-system-r20.zh-CN.md'
      - 'docs/api/sidebar-tools.zh-CN.md'
      - 'docs/api/sidebar-tool-development.zh-CN.md'
      - 'examples/sidebar-tools/README.zh-CN.md'
      - 'src/ui/tool.html'
      - 'src/ui/extension-center.js'
      - 'src/ui/extension-center-model.js'
      - 'src/ui/extension-center.css'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.agents/workflows/**'
      - 'tests/environment/browser-tool-creation-workflow-r21.test.mjs'
      - 'docs/framework/browser-tool-creation-workflow.zh-CN.md'
      - 'docs/framework/workstreams/browser-tool-creation-workflow-r2-20261015.md'
      - '.github/workflows/extension-creation-intake.md'
      - '.github/workflows/extension-creation-intake.lock.yml'
      - 'tests/environment/agent-skills-r1.test.mjs'
      - 'scripts/agent-skills-r22-eval.mjs'
      - '.github/workflows/agent-skills-governance.yml'
      - 'docs/product/sidebar-ui-spec.zh-CN.md'
      - 'docs/architecture/ui-layout-conventions-r27.zh-CN.md'
      - 'docs/architecture/sidebar-multi-section-tab-contract-r28.zh-CN.md'
      - 'docs/architecture/sidebar-design-system-r20.zh-CN.md'
      - 'docs/api/sidebar-tools.zh-CN.md'
      - 'docs/api/sidebar-tool-development.zh-CN.md'
      - 'examples/sidebar-tools/README.zh-CN.md'
      - 'src/ui/tool.html'
      - 'src/ui/extension-center.js'
      - 'src/ui/extension-center-model.js'
      - 'src/ui/extension-center.css'
permissions:
  contents: read
jobs:
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/environment/agent-skills-r1.test.mjs
      - run: node --test tests/environment/sidebar-r21-design-system.test.mjs
      - run: node scripts/agent-skills-r22-eval.mjs --self-test
      - run: node --test tests/environment/browser-tool-creation-workflow-r21.test.mjs
      # Compiler-only: read-only GH token, no model call, no PR, no repository write.
      - name: Install pinned gh-aw compiler
        uses: github/gh-aw/actions/setup-cli@v0.92.0
        with:
          version: v0.92.0
      - name: Compile extension creation intake with official gh-aw
        run: |
          gh aw compile extension-creation-intake
          test -s .github/workflows/extension-creation-intake.lock.yml
      - name: Reject missing or stale generated lock
        run: |
          git ls-files --error-unmatch .github/workflows/extension-creation-intake.lock.yml
          git diff --exit-code -- .github/workflows/extension-creation-intake.lock.yml
