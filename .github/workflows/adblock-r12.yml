name: AdBlock R1.2 - trusted DNR, offline release and native macOS Chrome

on:
  push:
    branches: [main]
    paths:
      - 'examples/sidebar-tools/adblock/**'
      - '!examples/sidebar-tools/adblock/adblock.opendesk-tool.json'
      - 'src/sw.js'
      - 'src/entrypoints/sidebar-tool-host.js'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/sidebar-tools/**'
      - 'src/ui/tool.html'
      - 'src/sidebar-tools/bridge.js'
      - 'official-tools/catalog.json'
      - 'scripts/bundle-provenance.mjs'
      - 'scripts/verify-package.mjs'
      - 'scripts/react-dom-input-csp.mjs'
      - 'tests/environment/react-dom-input-csp-r3331.test.mjs'
      - 'wxt.config.mjs'
      - 'src/ui/react/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.mjs'
      - 'scripts/build-contract.mjs'
      - 'tests/environment/verify-package-react-constructor.test.mjs'
      - 'scripts/preview/**'
      - 'scripts/templates/sidebar-tool-preview-shell.html'
      - 'contracts/ui-preview/**'
      - '.github/workflows/sidebar-preview-contract.yml'
      - 'tests/environment/adblock-r12.test.mjs'
      - 'tests/environment/adblock-host-controls-r13.test.mjs'
      - 'tests/framework/adblock-r12-native.test.mjs'
      - '.github/workflows/adblock-r12.yml'
  workflow_dispatch:

concurrency:
  group: adblock-r12-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact reviewed dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Independent AdBlock boundary and adversarial tests
        run: |
          node --test tests/environment/adblock-r12.test.mjs tests/environment/adblock-host-controls-r13.test.mjs tests/environment/adblock-preview-contract.test.mjs tests/environment/stay-focus-boundary-r1.test.mjs tests/environment/verify-package-react-constructor.test.mjs tests/environment/react-dom-input-csp-r3331.test.mjs
          node --check tests/framework/adblock-r12-native.test.mjs
      - name: Build independently installable official AdBlock tool
        run: |
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/adblock --out artifacts/sidebar-tools/adblock/candidate.opendesk-tool.json
          test -s artifacts/sidebar-tools/adblock/candidate.opendesk-tool.json
          sha256sum artifacts/sidebar-tools/adblock/candidate.opendesk-tool.json
          sha256sum examples/sidebar-tools/adblock/rules/domains.js
          node scripts/preview/build-preview.mjs --tool adblock --surface side-panel --scenario success --theme light --width 360 --height 760 --out artifacts/previews/adblock/candidate-source.html
      - name: Source check and complete production and development validation
        run: |
          npm run check
          npm run build
          npm run build:dev
          npm run verify
          node scripts/verify-package.mjs dist/production
          sha256sum dist/production/official-tools/adblock/adblock.opendesk-tool.json
      - name: Officially promote validated candidate and verify source identity
        run: |
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/adblock --promote-from artifacts/sidebar-tools/adblock/candidate.opendesk-tool.json
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/adblock --check-project
          cmp artifacts/sidebar-tools/adblock/candidate.opendesk-tool.json examples/sidebar-tools/adblock/adblock.opendesk-tool.json
          cmp dist/production/official-tools/adblock/adblock.opendesk-tool.json examples/sidebar-tools/adblock/adblock.opendesk-tool.json
          sha256sum examples/sidebar-tools/adblock/adblock.opendesk-tool.json
      - name: Preserve exact candidate - not native approval yet
        uses: actions/upload-artifact@v4
        with:
          name: adblock-r12-validated-production-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/production/
            artifacts/sidebar-tools/adblock/
            examples/sidebar-tools/adblock/adblock.opendesk-tool.json
            artifacts/previews/adblock/
            docs/framework/evidence/wxt/builds/build-production.json
            docs/framework/evidence/wxt/builds/build-development.json
      - name: Preserve failed source/build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adblock-r12-failed-build-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/sidebar-tools/adblock/
            artifacts/previews/adblock/
            docs/framework/evidence/wxt/builds/

  native-macos-chrome:
    needs: source-and-package
    runs-on: macos-15
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: adblock-r12-validated-production-${{ github.sha }}
          path: .
      - name: Reconfirm candidate and native identity
        run: |
          test -s dist/production/manifest.json
          shasum -a 256 dist/production/sw.js
          shasum -a 256 dist/production/official-tools/adblock/adblock.opendesk-tool.json
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
      - name: Real macOS Chrome DNR and network requests - no mocks
        env:
          OPENDESK_ADBLOCK_NATIVE: '1'
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          OPENDESK_ADBLOCK_NATIVE_EVIDENCE: artifacts/adblock-r12-native
        run: node --test tests/framework/adblock-r12-native.test.mjs
      - name: Preserve real native network and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adblock-r12-native-chrome-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/adblock-r12-native/

  # Publishing never substitutes for a macOS Native PASS. A runner-generated
  # candidate alone is NOT a trusted release and must not modify main.
  publish-official-package:
    needs: [source-and-package, native-macos-chrome]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: adblock-r12-validated-production-${{ github.sha }}
          path: .
      - name: Promote only a native-passed, drift-free official AdBlock package
        shell: bash
        env:
          REVIEWED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          candidate=artifacts/sidebar-tools/adblock/candidate.opendesk-tool.json
          official=examples/sidebar-tools/adblock/adblock.opendesk-tool.json
          test -s "$candidate"
          test -s dist/production/official-tools/adblock/adblock.opendesk-tool.json
          cmp "$candidate" dist/production/official-tools/adblock/adblock.opendesk-tool.json
          sha256sum "$candidate"

          # Parallel agents can advance main. Never publish stale runtime,
          # toolbar, DNR, sandbox, package builder, native driver or CI inputs.
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git diff --quiet "$REVIEWED_HEAD" refs/remotes/origin/main -- \
              examples/sidebar-tools/adblock \
              src/ui/tool.html \
              src/ui/sidebar-tools.js \
              src/ui/tool-shell.css \
              src/ui/sidebar-tools \
              src/sw.js \
              src/entrypoints/sidebar-tool-host.js \
              src/sidebar-tools/bridge.js \
              scripts/build-sidebar-tool.mjs \
              scripts/build-official-tools.mjs \
              scripts/bundle-provenance.mjs \
              scripts/verify-package.mjs \
              scripts/react-dom-input-csp.mjs \
              tests/environment/react-dom-input-csp-r3331.test.mjs \
              wxt.config.mjs \
              src/ui/react \
              package.json \
              package-lock.json \
              scripts/build.mjs \
              scripts/build-contract.mjs \
              tests/environment/verify-package-react-constructor.test.mjs \
              scripts/preview \
              scripts/templates/sidebar-tool-preview-shell.html \
              contracts/ui-preview \
              official-tools/catalog.json \
              tests/environment/adblock-r12.test.mjs \
              tests/environment/adblock-host-controls-r13.test.mjs \
              tests/environment/adblock-preview-contract.test.mjs \
              tests/framework/adblock-r12-native.test.mjs \
              .github/workflows/adblock-r12.yml; then
            echo "::error::AdBlock source/Host/DNR/CI inputs changed after native validation; refusing stale promotion"
            exit 1
          fi

          # Only work on the actual latest main. Do not create a feature
          # branch/worktree or replace other agents' commits.
          git switch -C main refs/remotes/origin/main
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/adblock --out artifacts/sidebar-tools/adblock/revalidated.opendesk-tool.json
          cmp "$candidate" artifacts/sidebar-tools/adblock/revalidated.opendesk-tool.json
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/adblock --promote-from "$candidate"
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/adblock --check-project
          cmp "$candidate" "$official"
          sha256sum "$official"

          git add -- "$official"
          if git diff --cached --quiet; then
            echo "Official package is already source-identical; no redundant commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(adblock): promote native-validated official 1.1.1 package'
          # Strict non-force push: a changed remote head causes rejection.
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD
