name: R24.1 React and Vue Page framework qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/page-frameworks-r241.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precompile-and-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the canonical repository build toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve framework authoring dependencies with real npm lockfiles
        run: |
          set -euo pipefail
          for project in page-ui-react page-ui-vue; do
            npm install --prefix "examples/programs/$project" --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci --prefix "examples/programs/$project" --ignore-scripts --no-audit --no-fund
          done
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for (const [label,path] of [
            ['react','examples/programs/page-ui-react/package-lock.json'],
            ['vue','examples/programs/page-ui-vue/package-lock.json']
          ]) {
            const payload=readFileSync(path).toString('base64');
            console.log('R241_LOCK_START '+label);
            for(let i=0;i<payload.length;i+=4096)
              console.log('R241_LOCK_PART '+label+' '+payload.slice(i,i+4096));
            console.log('R241_LOCK_END '+label);
          }
          NODE
      - name: Upload exact lockfile artifacts (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: r241-framework-locks
          if-no-files-found: error
          path: |
            examples/programs/page-ui-react/package-lock.json
            examples/programs/page-ui-vue/package-lock.json
      - name: Offline JSX and Vue SFC precompilation
        run: |
          npm run build:framework --prefix examples/programs/page-ui-react
          npm run build:framework --prefix examples/programs/page-ui-vue
          wc -c examples/programs/page-ui-react/src/compiled/framework.js examples/programs/page-ui-vue/src/compiled/framework.js
      - name: Existing OpenDesk Page project validator and final build budgets
        run: |
          node scripts/validate-program-project.mjs examples/programs/page-ui-react
          node scripts/validate-program-project.mjs examples/programs/page-ui-vue
          node scripts/build-program-project.mjs examples/programs/page-ui-react --mode development
          node scripts/build-program-project.mjs examples/programs/page-ui-vue --mode development
