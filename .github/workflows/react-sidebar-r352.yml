name: React Sidebar R35.2 App Shell Chromium
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/sidepanel.html'
      - 'src/ui/tool-shell.js'
      - 'src/ui/tool-shell.css'
      - 'src/ui/task-workbench.js'
      - 'scripts/bundle-provenance.mjs'
      - 'examples/sidebar-tools/stay-focus/trusted/**'
      - 'src/ui/react/**'
      - 'scripts/tests/react-sidebar-r352-browser.mjs'
      - 'scripts/tests/react-sidebar-r352-installed-chrome.mjs'
      - 'tests/environment/react-sidebar-app-shell-r351.test.mjs'
      - 'tests/environment/react-sidebar-schedule-r341.test.mjs'
      - 'tests/environment/sidebar-quick-notes-react-r21.test.mjs'
      - 'scripts/check-source.mjs'
      - '.github/workflows/react-sidebar-r352.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-shell-source-and-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: App Shell and React source contracts
        run: |
          node --test tests/environment/react-sidebar-app-shell-r351.test.mjs
          node --test tests/environment/react-sidebar-r333.test.mjs
          node --test tests/environment/react-sidebar-render-r3331.test.mjs
          node --test tests/environment/react-sidebar-schedule-r341.test.mjs
      - name: Execute appShell:true against formal HTML in real Chromium
        run: node scripts/tests/react-sidebar-r352-browser.mjs
      - name: Source checks and both production/dev candidates
        run: |
          npm run check
          npm run build
          npm run build:dev
          npm run verify
      - name: Declare evidence boundary
        if: always()
        run: |
          echo "SOURCE_UI_SIMULATION_CHROMIUM=R35.2 tests"
          echo "INSTALLED_EXTENSION_CHROME_LINUX=R35.2 real MV3 smoke; read job outcome"
          echo "NATIVE_MAC_SIDE_PANEL=NOT_TESTED"

  installed-mv3-chrome:
    # Separate evidence grade: a global source-check failure caused by concurrent
    # work must not hide whether the actual installed candidate can start.
    # Both jobs must pass to claim the R35.2 installed/build gate is green.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the real development MV3 candidate
        run: npm run build:dev
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Verify actual installed MV3 App Shell and repeated opening
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          OPENDESK_EXTENSION_DIR: dist/development
          OPENDESK_BUILD_MODE: development
        run: node scripts/tests/react-sidebar-r352-installed-chrome.mjs
      - name: Upload installed Chrome diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-sidebar-r352-installed-chrome
          path: artifacts/react-sidebar-r352-installed/
          if-no-files-found: warn
          retention-days: 14
      - name: State native Mac evidence boundary
        if: always()
        run: echo "NATIVE_MAC_SIDE_PANEL=NOT_TESTED"
