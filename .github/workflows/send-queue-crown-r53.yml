name: Send Queue R5.4 selected fit visual audit
on:
  push:
    branches: [main]
    paths:
      - 'examples/programs/chatgpt-send-queue/**'
      - '.github/workflows/send-queue-crown-r53.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Send Queue core and crown tests
        run: |
          node --check examples/programs/chatgpt-send-queue/scripts/crown-r53-chromium.mjs
          node --test examples/programs/chatgpt-send-queue/tests/*.test.mjs
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Render actual offline HTML in Chrome at deviceScaleFactor 1
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node examples/programs/chatgpt-send-queue/scripts/crown-r53-chromium.mjs artifacts/send-queue-crown-r54
      - name: Preserve before/after 1:1 screenshots and alpha measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: send-queue-r54-selected-crown-screenshots
          path: artifacts/send-queue-crown-r54/
          if-no-files-found: warn
          retention-days: 14
