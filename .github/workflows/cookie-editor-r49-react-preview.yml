name: Cookie Editor R4.9 React 19 · Chromium
on:
  push:
    branches: [main]
    paths:
      - 'examples/sidebar-tools/cookie-editor/preview/react/**'
      # The preview imports the real CookieEditorApp, not a copied UI.
      - 'examples/sidebar-tools/cookie-editor/app/**'
      - 'examples/sidebar-tools/cookie-editor/src/react.css'
      - 'examples/sidebar-tools/cookie-editor/tool.config.json'
      - 'examples/sidebar-tools/cookie-editor/cookie-editor.opendesk-tool.json'
      - 'examples/sidebar-tools/cookie-editor/ui/**'
      - 'examples/sidebar-tools/cookie-editor/app/components/CookieEditorView.jsx'
      - 'src/ui/react/cookie-editor/**'
      - '.github/workflows/cookie-editor-r49-react-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cookie-r49-react-preview-${{ github.sha }}
  cancel-in-progress: false
jobs:
  react-preview-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned React 19, Vite and Playwright
        working-directory: examples/sidebar-tools/cookie-editor/preview/react
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build existing fixed Shared UI asset (filtered WXT entry only)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          OPENDESK_BUILD_MODE=development npx wxt build --mode development --filter-entrypoint sidebar-shared-ui
          test -s dist/development/sidebar-shared-ui.js
      - name: Build and verify exact offline React HTML
        working-directory: examples/sidebar-tools/cookie-editor/preview/react
        run: |
          npm run build
          npm run check
          node --input-type=module <<'NODE'
          import {readFile,stat} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const js=await readFile('dist/cookie-react.js','utf8');
          const html=await readFile('index.html','utf8');
          assert.ok(js.length>40000,'actual React renderer required');
          assert.match(js,/createRoot/,'real react-dom/client required');
          assert.ok(html.includes('data:text/javascript;base64,'));
          assert.ok(html.includes("connect-src 'none'"));
          assert.doesNotMatch(html,/https?:\/\/(?:cdn|unpkg|jsdelivr)\./);
          console.log(JSON.stringify({result:'BUILT_REACT_19',jsCodeUnits:js.length,
            jsBudget:220000,jsFitsProductionTool:js.length<=220000,
            htmlBytes:(await stat('index.html')).size}));
          NODE
      - name: Cookie React controller regression (Node)
        run: node --test tests/environment/cookie-editor-react-controller.test.mjs
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Ensure CJK glyphs in screenshot evidence
        timeout-minutes: 3
        run: |
          # Test actual CJK glyphs; prefer installed fonts over downloading a
          # 61 MB font bundle which previously timed out.
          if ! fc-list :lang=zh-cn family | grep -Eq 'Noto Sans CJK|WenQuanYi'; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 install -y --no-install-recommends fonts-wqy-microhei
          fi
          fc-cache -f >/dev/null
          fc-match -f '%{family}\\n' 'sans:lang=zh-cn' | tee /tmp/cookie-editor-cjk-family
          grep -Eq 'Noto Sans CJK|WenQuanYi' /tmp/cookie-editor-cjk-family
      - name: Real built React 19 Chromium UI E2E
        working-directory: examples/sidebar-tools/cookie-editor/preview/react
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:chromium
      # Release identity belongs after browser evidence: the checked-in install
      # JSON may lag a compiled candidate while the separate promotion gate is blocked.
      # Do not skip Chromium merely because that guarded identity is stale.
      - name: Checked-in release identity and source regression (Node)
        run: node --test tests/environment/cookie-editor-react-source.test.mjs
      - name: Preserve exact HTML and screenshot evidence even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cookie-r49-react-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            examples/sidebar-tools/cookie-editor/preview/react/index.html
            artifacts/cookie-editor-r523/
      # Publishing is owned by cookie-editor-r56-react-candidate.yml after
      # its combined source-bound package, Node and Chromium release gates.
