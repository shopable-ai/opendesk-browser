name: R24.2 historical immutable Page draft compatibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/page-frameworks-r242-import-drafts.yml'
      - 'examples/import-ready/history/r242-page-ui-react-direct.opendesk-draft.json'
      - 'examples/import-ready/history/r242-page-ui-vue-direct.opendesk-draft.json'
      - 'examples/programs/page-ui-react-direct/src/legacy-main.js'
      - 'examples/programs/page-ui-vue-direct/src/legacy-main.js'
      - 'tests/environment/page-ui-import-drafts-r242.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-historical-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate original R24.2 review hashes and exact retained async-main source
        run: node --test tests/environment/page-ui-import-drafts-r242.test.mjs
      - name: Preserve previous receipts without generating or relabeling new R24.3 code
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          for(const name of ['react','vue']){
            const file='examples/import-ready/history/r242-page-ui-'+name+'-direct.opendesk-draft.json';
            const bytes=await readFile(file);
            console.log('R242_ARCHIVED_DRAFT '+JSON.stringify({
              file,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')
            }));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: r242-historical-immutable-drafts-${{ github.sha }}
          if-no-files-found: error
          path: |
            examples/import-ready/history/r242-page-ui-react-direct.opendesk-draft.json
            examples/import-ready/history/r242-page-ui-vue-direct.opendesk-draft.json
