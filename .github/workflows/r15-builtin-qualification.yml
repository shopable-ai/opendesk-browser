name: R15 built-in libraries qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r15-builtin-qualification.yml'
      - 'src/runtime/builtin-libraries/**'
      - 'src/libs/**'
      - 'src/ui/tool.html'
      - 'src/libs/runtime-contract.js'
      - 'src/entrypoints/lodash.js'
      - 'src/entrypoints/dayjs.js'
      - 'scripts/libs.mjs'
      - 'scripts/libs-doctor.mjs'
      - 'scripts/libs-history-audit.mjs'
      - 'docs/architecture/browser-framework/historical-library-decisions-r156.json'
      - 'src/scripting/sandbox/**'
      - 'src/scripting/user-scripts/**'
      - 'src/platform/tasks/**'
      - 'src/platform/host/controller-methods.js'
      - 'src/entrypoints/worker-runtime.js'
      - 'src/entrypoints/page-core.js'
      - 'scripts/*builtin*.mjs'
      - 'scripts/wxt-development.mjs'
      - 'scripts/verify-package.mjs'
      - 'scripts/build-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wxt.config.mjs'
      - 'tests/environment/builtin-*.mjs'
      - 'tests/environment/runtime-globals-zero-arg.test.mjs'
      - 'tests/environment/runtime-libs-trusted-worlds.test.mjs'
      - 'examples/libs/trusted-imports/**'
      - 'tests/environment/libs-doctor-r155.test.mjs'
      - 'tests/environment/libs-history-r156.test.mjs'
      - 'tests/environment/packaged-jquery-loading-r155.test.mjs'
      - 'tests/environment/builtin-loader-failures-r155.test.mjs'
      - 'tests/environment/builtin-idempotence-r155.test.mjs'
      - 'tests/environment/shipped-builtin-worlds.test.mjs'
      - 'tests/environment/task-package-flow.test.mjs'
      - 'tests/environment/page-installed-programs.test.mjs'
      - 'tests/framework/builtin-*.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r15-builtin-qualification
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run libs:check
      - name: R15.5 library doctor inventory and opt-in integrity regressions
        run: node --test tests/environment/libs-history-r156.test.mjs tests/environment/libs-doctor-r155.test.mjs tests/environment/packaged-jquery-loading-r155.test.mjs tests/environment/builtin-loader-failures-r155.test.mjs tests/environment/builtin-idempotence-r155.test.mjs
      - name: Builtin methods, consumers, compiler and development lifecycle
        run: node --test tests/environment/builtin-*.test.mjs tests/environment/controller-main-entry.test.mjs tests/environment/runtime-globals-zero-arg.test.mjs tests/environment/runtime-libs-trusted-worlds.test.mjs tests/environment/page-script-preview.test.mjs tests/environment/user-script-dependency-flow.test.mjs tests/environment/page-installed-programs.test.mjs tests/environment/wxt-development.test.mjs
      - run: npm run check
      - run: npm run build
      - run: npm run build:dev
      - name: R15.5 doctor on physical production and development WXT outputs
        run: npm run libs:doctor -- --strict
      - run: npm run verify
      - name: Exact production and development archives
        run: npm run pack && npm run pack:dev
      - name: Complete Node regression suite
        run: npm test
      - name: Preserve source and npm-installed inputs for offline diagnosis
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/r15-diagnostic"
          git rev-parse HEAD > "$RUNNER_TEMP/r15-diagnostic/source-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/r15-diagnostic/source.tar.gz"
          if test -d node_modules; then tar -czf "$RUNNER_TEMP/r15-diagnostic/npm-installed.tar.gz" node_modules; fi
          if test -d dist; then tar -czf "$RUNNER_TEMP/r15-diagnostic/dist.tar.gz" dist; fi
          if test -d docs/framework/evidence/wxt/builds; then cp docs/framework/evidence/wxt/builds/build-*.json "$RUNNER_TEMP/r15-diagnostic/"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-builtin-diagnostic-${{ github.sha }}
          retention-days: 2
          if-no-files-found: error
          path: ${{ runner.temp }}/r15-diagnostic/
