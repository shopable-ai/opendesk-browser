name: Reading TOC R4.1-R4.6 - responsive height, visibility, native and build
on:
  push:
    branches: [main]
    paths:
      - 'src/reading-toc/**'
      - 'src/entrypoints/page-relay.js'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/sidebar-tools/package.js'
      - 'src/ui/tool.html'
      - 'src/ui/tool-shell.css'
      - 'examples/sidebar-tools/reading-toc/**'
      - 'scripts/build-sidebar-tool.mjs'
      - 'scripts/generate-reading-toc-locales.mjs'
      - 'src/ui/app-localization.js'
      - 'scripts/preview/reading-toc-*.mjs'
      - 'scripts/preview/reading-toc-mock.js'
      - 'scripts/preview/build-preview.mjs'
      - 'tests/environment/sidebar-tool-localization-r12.test.mjs'
      - 'tests/environment/reading-toc-localization-preview-r12.test.mjs'
      - 'scripts/prepare-public.mjs'
      - 'scripts/verify-package.mjs'
      - 'tests/environment/reading-toc-r41.test.mjs'
      - 'tests/environment/reading-toc-lifecycle-r41.test.mjs'
      - 'tests/environment/reading-toc-placement-r42.test.mjs'
      - 'tests/environment/reading-toc-visibility-r46.test.mjs'
      - 'tests/environment/reading-toc-overview-r43.test.mjs'
      - 'tests/environment/sidebar-tools-host.test.mjs'
      - 'tests/framework/reading-toc-native-r41.test.mjs'
      - '.github/workflows/reading-toc-r41.yml'
      - 'official-tools/**'
      - 'src/sidebar-tools/**'
      - 'src/ui/sidebar-tools/**'
      - 'scripts/build-official-tools.mjs'
      - 'scripts/build.mjs'
      - 'scripts/wxt-development.mjs'
      - 'tests/helpers/official-tools.mjs'
      - 'tests/environment/official-tools-catalog-r45.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toc-contract-and-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproducible TOC tool and trusted bridge regression
        run: |
          node --test tests/environment/reading-toc-r41.test.mjs tests/environment/reading-toc-lifecycle-r41.test.mjs tests/environment/reading-toc-placement-r42.test.mjs tests/environment/reading-toc-overview-r43.test.mjs tests/environment/reading-toc-visibility-r46.test.mjs tests/environment/reading-toc-recovery-r48.test.mjs tests/environment/sidebar-tool-localization-r12.test.mjs tests/environment/reading-toc-localization-preview-r12.test.mjs
          npm run build:sidebar-tool -- examples/sidebar-tools/reading-toc --out artifacts/sidebar-tools/reading-toc/reading-toc.opendesk-tool.json
          node scripts/preview/build-preview.mjs --tool reading-toc --surface side-panel --scenario success --theme light --width 360 --out artifacts/previews/reading-toc/reading-toc-r12.html
          node scripts/preview/build-preview.mjs --tool reading-toc --surface page-overlay --scenario success --theme light --width 360 --out artifacts/previews/reading-toc/reading-toc-r12-overlay.html
          npm run check
      - name: Production and development bundles with unchanged strict packaging
        run: |
          npm run build
          npm run build:dev
          npm run verify
      - name: Install Chinese fonts for readable UI screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install Chrome for Testing (unpacked MV3 supported)
        id: cft
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Real Chrome R4.6 adaptive height, Side Panel visibility, drag and screenshot evidence
        env:
          CHROME_BIN: ${{ steps.cft.outputs.chrome-path }}
          OPENDESK_NATIVE_HEADED: '1'
        run: xvfb-run -a node --test tests/framework/reading-toc-native-r41.test.mjs
      - name: R1.4 real Chromium offline preview interaction and screenshot evidence
        if: ${{ !cancelled() }}
        env:
          CHROME_BIN: ${{ steps.cft.outputs.chrome-path }}
        run: xvfb-run -a node --test tests/framework/reading-toc-preview-r14-native.test.mjs
      - name: Existing Sidebar tool regression
        if: ${{ !cancelled() }}
        run: node --test tests/environment/sidebar-tools.test.mjs tests/environment/sidebar-tools-host.test.mjs
      - name: Full automated source suite
        if: ${{ !cancelled() }}
        run: npm test
      - name: Preserve package evidence - not Chrome native acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-toc-r41-ci-candidate
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/sidebar-tools/reading-toc/reading-toc.opendesk-tool.json
            artifacts/previews/reading-toc/
            dist/production/official-tools/
            docs/framework/evidence/wxt/builds/build-production.json
            artifacts/reading-toc-r41/
