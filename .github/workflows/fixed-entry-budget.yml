name: Fixed entry budgets (SW and Sidebar)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'wxt.config.mjs'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/environment/fixed-entries-audit.test.mjs'
      - '.github/workflows/fixed-entry-budget.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'wxt.config.mjs'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/environment/fixed-entries-audit.test.mjs'
      - '.github/workflows/fixed-entry-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-entry-budget-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit contracts, Rollup provenance and SW sizing tests
        run: node --test tests/environment/fixed-entries-audit.test.mjs tests/environment/sw-size-report.test.mjs tests/environment/bundle-provenance.test.mjs
      - run: npm run check
      - name: Build actual production WXT bundle with unchanged limits
        run: npm run build
      - name: Verify physical bytes, hashes and graphs of all 15 fixed entries
        run: node scripts/audit-fixed-entries.mjs artifacts/fixed-entry-budget.json
      - name: Preserve build-bound results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-entry-budget-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/fixed-entry-budget.json
            docs/framework/evidence/wxt/builds/build-production.json
