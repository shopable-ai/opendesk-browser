name: Native Agent R1 components and package
on:
  push:
    branches:
      - main
      - agent/native-agent-bridge-r1-20261008
      - agent/program-r31-continue-01a11c55
  pull_request:
    branches:
      - main
    paths:
      - 'native-agent/**'
      - 'src/native-agent/**'
      - 'src/entrypoints/settings.js'
      - 'src/platform/host/client.js'
      - 'src/sw.js'
      - 'src/ui/tool-shell.js'
      - 'manifest.json'
      - 'scripts/**'
      - 'wxt.config.mjs'
      - 'tests/environment/native-agent-*.test.mjs'
      - '.github/workflows/native-agent-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-components:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Frozen dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native bridge protocol, Host and request ledger components (NOT real Chrome)
        run: node --test tests/environment/native-agent-wire.test.mjs tests/environment/native-agent-host.test.mjs tests/environment/native-agent-bridge.test.mjs tests/environment/native-agent-native-host.test.mjs tests/environment/native-agent-package.test.mjs tests/environment/compact-schema.test.mjs tests/environment/agent-to-task-fixtures.test.mjs
      - name: Shared Sidebar and Controller regressions
        run: node --test tests/environment/script-editor.test.mjs tests/environment/sidebar-draft-runhost.test.mjs tests/environment/task-workbench.test.mjs tests/environment/sidebar-product-contract.test.mjs
      - name: Source and packaging contracts
        run: npm run check
      - name: Production WXT packaging
        run: npm run build
      - name: Development WXT packaging
        run: npm run build:dev
      - name: Verify actual production/development output
        run: npm run verify
      - name: Complete environment Node regression (does not replace native Chrome E2E)
        run: npm test
  macos-native-host-ipc:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated real macOS Host process and CLI IPC (simulated Chrome framing; NOT Chrome E2E)
        run: node --test tests/environment/native-agent-macos-install.test.mjs
      - name: Install Chrome for Testing for real unpacked MV3 diagnostic
        id: cft
        uses: browser-actions/setup-chrome@v2
        with:
          # Keep the same version observed in the failed stable-channel run.
          # Explicit versions retain Google Chrome for Testing.app; channel
          # installs can lose the bundle path (browser-actions/setup-chrome#658).
          chrome-version: '155.0.8059.39'
      - name: Verify intact macOS app bundle without disabling the sandbox
        env:
          CHROME_FOR_TESTING_BIN: ${{ steps.cft.outputs.chrome-path }}
        run: |
          case "$CHROME_FOR_TESTING_BIN" in
            *'.app/Contents/MacOS/'*) ;;
            *) echo 'CFT must be launched from an intact .app bundle'; exit 1 ;;
          esac
          "$CHROME_FOR_TESTING_BIN" --version
      - name: Diagnostic real Chrome Options and native handshake (not Codex or Side Panel E2E)
        env:
          CHROME_FOR_TESTING_BIN: ${{ steps.cft.outputs.chrome-path }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test tests/environment/native-agent-chrome-real.test.mjs
