name: Browser SDK targeted main verification
on:
  push:
    branches: [main]
    paths:
      - 'src/framework/sdk/browser*.js'
      - 'src/sidebar-tools/bridge.js'
      - 'src/platform/chrome/context-menus.js'
      - 'src/entrypoints/context-menus.js'
      - 'src/agents/page-relay.js'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/sidebar-tools/**'
      - 'src/ui/tool-shell.js'
      - 'src/ui/bookmark-manager.css'
      - 'scripts/prepare-public.mjs'
      - 'scripts/verify-package.mjs'
      - 'src/sw.js'
      - 'examples/sidebar-tools/browser-sdk-r13/**'
      - 'tests/environment/browser-sdk-r13.test.mjs'
      - 'tests/environment/sidebar-tools*.test.mjs'
      - 'src/platform/chrome/browser-*.js'
      - 'src/sidebar-tools/bridge.js'
      - 'tests/environment/browser-sdk-approval-timeout.test.mjs'
      - 'tests/environment/browser-sdk-r2-demo.test.mjs'
      - 'examples/sidebar-tools/browser-sdk-r2/**'
      - 'tests/environment/browser-*.test.mjs'
      - 'scripts/check-browser-sdk-coverage.mjs'
      - 'scripts/check-browser-sdk-freeze.mjs'
      - 'scripts/check-browser-sdk-interface-matrix.mjs'
      - 'scripts/sync-chrome-api-catalog.mjs'
      - 'docs/api/browser-sdk-interface-matrix.json'
      - 'docs/api/chrome-native-api-sources.json'
      - 'vendor/chromium-extension-api/**'
      - 'docs/framework/workstreams/browser-sdk-*'
      - 'examples/sidebar-tools/browser-sdk-acceptance/**'
      - 'tests/framework/browser-sdk-r106-native.mjs'
      - 'tests/environment/browser-sdk-r107-installed-acceptance.test.mjs'
      - '.github/workflows/browser-sdk-r13.yml'
  workflow_dispatch:
    inputs:
      native_macos:
        description: 'Run isolated macOS MV3 Worker smoke (does not prove native menu GUI acceptance)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Candidate identity
        run: |
          git status --short --branch
          git rev-parse HEAD
          node --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Browser SDK R1.3 and existing tool install regressions
        run: |
          node --test --test-reporter=spec tests/environment/browser-sdk-r13.test.mjs tests/environment/sidebar-tools.test.mjs tests/environment/sidebar-tools-host.test.mjs tests/environment/official-tools-catalog-r45.test.mjs tests/environment/fixed-entries-audit.test.mjs tests/framework/k4-sdk-reinjection.test.mjs tests/framework/k4-sdk.test.mjs tests/framework/k2-sdk-relay-races.test.mjs tests/environment/boundaries.test.mjs
      - name: Browser SDK schema and evidence guards
        run: |
          node --test tests/environment/browser-sdk-p3-implementation.test.mjs tests/environment/browser-sdk-p4-implementation.test.mjs tests/environment/browser-sdk-contract-compat.test.mjs tests/environment/browser-sdk-coverage.test.mjs tests/environment/browser-tabs-host.test.mjs tests/environment/browser-sidepanel-host.test.mjs tests/environment/browser-sdk-r2-host.test.mjs tests/environment/browser-network-observe-host.test.mjs tests/environment/browser-screenshot-host.test.mjs tests/environment/browser-screenshot-resources.test.mjs tests/environment/browser-sdk-approval-timeout.test.mjs tests/environment/browser-sdk-r2-demo.test.mjs
          node scripts/check-browser-sdk-coverage.mjs --check
          node --test tests/environment/browser-sdk-freeze.test.mjs
          node scripts/check-browser-sdk-freeze.mjs
          node --test tests/environment/browser-sdk-r9-installed-cookies.test.mjs tests/environment/cookie-editor-ui.test.mjs
      - name: Source and fixed entry guard
        run: npm run check
  browser-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production WXT build (strict SW gate)
        run: npm run build
      - name: Development WXT build
        if: ${{ !cancelled() }}
        run: npm run build:dev
      - name: Verify both builds (cannot pass without valid production)
        if: ${{ !cancelled() }}
        run: npm run verify
      - name: Validate actual production and development fixed MAIN/ISOLATED bundles
        if: ${{ !cancelled() }}
        run: node --test --test-reporter=spec tests/framework/k4-sdk-hello-races.test.mjs tests/framework/k4-sdk-bundle-reinjection.test.mjs
      - name: Retain exact unpacked production candidate for isolated Chrome acceptance
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-sdk-r13-unpacked-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: dist/production/
      - name: Retain candidate build receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-sdk-r13-build-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            docs/framework/evidence/wxt/builds/build-production.json
            docs/framework/evidence/wxt/builds/build-development.json

  browser-native-restart:
    if: github.event_name == 'workflow_dispatch' && inputs.native_macos
    # Real, isolated macOS Chrome/CFT service-worker registration and
    # stop/start evidence. This is NOT a native right-click menu UI PASS.
    needs: [browser-contracts, browser-bundles]
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild exact candidate and retain strict package verification
        run: npm run build
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
      - name: Preserve full macOS Chrome for Testing application Frameworks
        id: chrome-app
        env:
          SOURCE_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          case "$SOURCE_BINARY" in
            */Contents/MacOS/"Google Chrome for Testing") original="${SOURCE_BINARY%/Contents/MacOS/*}" ;;
            *) echo "Unexpected Chrome for Testing executable: $SOURCE_BINARY" >&2; exit 1 ;;
          esac
          test -d "$original/Contents/Frameworks"
          destination="$RUNNER_TEMP/browser-sdk-r13/Google Chrome for Testing.app"
          mkdir -p "${destination%/*}"
          /usr/bin/ditto "$original" "$destination"
          printf 'binary=%s\n' "$destination/Contents/MacOS/Google Chrome for Testing" >> "$GITHUB_OUTPUT"
      - name: Actual MV3 listener registration and Service Worker stop/restart
        env:
          CHROME_FOR_TESTING_BIN: ${{ steps.chrome-app.outputs.binary }}
        run: node tests/framework/r12-sw-native-smoke.mjs
      - name: Preserve raw current-candidate Chrome result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-sdk-r13-macos-worker-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/r12-sw-native-smoke.json
            docs/framework/evidence/wxt/builds/build-production.json
