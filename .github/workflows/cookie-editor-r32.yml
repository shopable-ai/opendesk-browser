name: Cookie Editor R3.3 real SDK and package verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cookie-editor-r32.yml'
      - 'examples/sidebar-tools/cookie-editor/**'
      - 'tests/environment/cookie-editor-ui.test.mjs'
      - 'tests/environment/cookie-editor-preview-r46.test.mjs'
      - 'tests/environment/cookie-editor-r43-parity.test.mjs'
      - 'tests/environment/cookie-editor-native-selection.test.mjs'
      - 'tests/framework/cookie-editor-r33-native.mjs'
      - 'tests/environment/extension-center-r47-interaction.test.mjs'
      - 'tests/environment/time-review-host-controls-r51.test.mjs'
      - 'tests/environment/static-import-drafts-ui.test.mjs'
      - 'tests/environment/browser-sdk-r106-cookie-contract-gaps.test.mjs'
      - 'tests/environment/browser-sdk-coverage.test.mjs'
      - 'scripts/check-browser-sdk-coverage.mjs'
      - 'docs/framework/workstreams/browser-sdk-acceptance.json'
      - 'src/framework/sdk/browser*.js'
      - 'src/platform/chrome/browser-cookie-host.js'
      - 'src/platform/chrome/permission-gate.js'
      - 'src/platform/chrome/cookies.js'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/tool-shell.css'
      - 'src/ui/tool.html'
      - 'src/ui/sidebar-tools/**'
      - 'src/sidebar-tools/bridge.js'
      - 'official-tools/**'
      - 'scripts/build-sidebar-tool.mjs'
      - 'scripts/build-official-tools.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve each SHA's test run despite rapid unrelated main pushes.
  group: cookie-editor-r33-${{ github.sha }}
  cancel-in-progress: false

jobs:
  node-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Candidate identity
        run: |
          git rev-parse HEAD
          git status --short --branch
          node --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute Cookie Editor and installed SDK positive/negative Node tests
        # Global official-catalog parity is intentionally checked by npm test
        # below: concurrent unrelated Sidebar Tool updates must not erase
        # Cookie Editor-specific proof or its immutable candidate artifact.
        run: |
          node --test \
            tests/environment/browser-sdk-r9-installed-cookies.test.mjs \
            tests/environment/browser-sdk-r106-cookie-contract-gaps.test.mjs \
            tests/environment/browser-sdk-r9-installed-host.test.mjs \
            tests/environment/browser-sdk-r7-trusted-cookies.test.mjs \
            tests/environment/browser-sdk-r8-cookies.test.mjs \
            tests/environment/cookie-editor-ui.test.mjs \
            tests/environment/cookie-editor-preview-r46.test.mjs \
            tests/environment/cookie-editor-r43-parity.test.mjs \
            tests/environment/cookie-editor-native-selection.test.mjs \
            tests/environment/extension-center-r47-interaction.test.mjs \
            tests/environment/sidebar-tool-enable-r26.test.mjs \
            tests/environment/browser-sdk-interface-matrix.test.mjs \
            tests/environment/browser-sdk-coverage.test.mjs \
            tests/environment/browser-sdk-contract-compat.test.mjs
      - name: Pack Cookie Editor declared version and official reviewed tools independently
        run: |
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/cookie-editor \
            --out artifacts/cookie-editor-r33/cookie-editor.opendesk-tool.json
          node scripts/build-official-tools.mjs --out artifacts/cookie-editor-r33/official
          node --input-type=module -e "
            import {readFileSync} from 'node:fs';
            import {createHash} from 'node:crypto';
            import {validateSidebarToolPackage} from './src/ui/sidebar-tools/package.js';
            const bytes=readFileSync('artifacts/cookie-editor-r33/cookie-editor.opendesk-tool.json');
            const tool=validateSidebarToolPackage(JSON.parse(bytes.toString()));
            const manifest=JSON.parse(readFileSync('examples/sidebar-tools/cookie-editor/tool.config.json','utf8'));
            if(tool.id!=='cookie-editor'||tool.version!==manifest.version)
              throw Error('Wrong Cookie Editor release version');
            const catalog=JSON.parse(readFileSync('artifacts/cookie-editor-r33/official/official-tools/catalog.json'));
            const item=catalog.apps.find(x=>x.toolId==='cookie-editor');
            if(!item||item.installationPolicy!=='preinstalled'||item.version!==tool.version)
              throw Error('Official release identity or default installation policy mismatch');
            console.log('COOKIE_EDITOR_NODE_PACKAGE_PASS',tool.version,
              'sha256='+createHash('sha256').update(bytes).digest('hex'));
          "
      - name: Verify checked-in Cookie Editor installable package is source-identical
        run: |
          node --check tests/framework/cookie-editor-r33-native.mjs
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/cookie-editor --check-project
      - name: Source guard and two production/development builds
        run: |
          npm run check
          npm run build
          npm run build:dev
          npm run verify
      - name: Retain verified Cookie Editor candidate (NOT release or native Chrome acceptance)
        # Capture only after the scoped SDK, package, source and build gates pass.
        # Full-repository regressions may fail in other workstreams; their
        # independent failure must not erase this immutable candidate evidence.
        # This artifact is NOT auto-promoted or installed in any user profile.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cookie-editor-r33-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/cookie-editor-r33/cookie-editor.opendesk-tool.json
            artifacts/cookie-editor-r33/official/official-tools/
            dist/production/official-tools/
            docs/framework/evidence/wxt/builds/build-production.json
            docs/framework/evidence/wxt/builds/build-development.json
      - name: Full repository regression against verified candidate builds
        # Complete gate remains mandatory for final release acceptance. Keep
        # unrelated failures visible without suppressing scoped PASS evidence.
        run: npm test
