name: Send Queue R5.8 Page and React candidate CI
on:
  push:
    branches: [main]
    paths:
      - 'examples/sidebar-tools/ai-send-queue/src/**'
      - 'examples/sidebar-tools/ai-send-queue/assets/**'
      - 'examples/sidebar-tools/ai-send-queue/preview/**'
      - 'examples/sidebar-tools/ai-send-queue/scripts/**'
      - 'examples/sidebar-tools/ai-send-queue/tests/**'
      - 'examples/sidebar-tools/ai-send-queue/package.json'
      - 'official-pages/sources.json'
      - '.github/workflows/send-queue-production-r55.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: send-queue-r58-source-bound-main
  cancel-in-progress: false
jobs:
  test-build-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned existing build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check actual Page Program sources
        run: |
          set -euo pipefail
          for f in main site engine view remote; do
            node --check "examples/sidebar-tools/ai-send-queue/src/page/$f.js"
          done
          node --test examples/sidebar-tools/ai-send-queue/tests/*.test.mjs
          node scripts/validate-program-project.mjs examples/sidebar-tools/ai-send-queue
          node examples/sidebar-tools/ai-send-queue/scripts/sync-crown-preview.mjs --check
      - name: Build actual React Tool and fixed install candidate
        run: |
          npm run --prefix examples/sidebar-tools/ai-send-queue build
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/ai-send-queue --out "$RUNNER_TEMP/ai-send-queue.opendesk-tool.json"
      - name: Preserve blocked React Tool candidate
        uses: actions/upload-artifact@v4
        with:
          name: send-queue-r58-blocked-react-candidate
          path: ${{ runner.temp }}/ai-send-queue.opendesk-tool.json
          if-no-files-found: error
          retention-days: 14
      - name: Resolve blocked candidate identity from official catalog
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const catalog=JSON.parse(readFileSync('official-pages/sources.json','utf8'));
          const manifest=JSON.parse(readFileSync('examples/sidebar-tools/ai-send-queue/package.json','utf8'));
          const entry=catalog.programs.find(row=>row.programId==='opendesk.ai-send-queue');
          assert.ok(entry,'missing official catalog entry');
          assert.equal(entry.version,manifest.version);
          assert.equal(entry.publication,'blocked','Mac acceptance is still required before public release');
          assert.ok(Number.isSafeInteger(entry.revision)&&entry.revision>=10,'R5.5 must not rewrite r9');
          console.log('SEND_QUEUE_REVISION='+entry.revision);
          NODE
      - name: Compile actual Program with the existing production builder
        run: npm run build:program -- examples/sidebar-tools/ai-send-queue --out "$RUNNER_TEMP/send-queue-build"
      - name: Build canonical Page install package with existing installer format
        run: |
          node scripts/build-page-install-package.mjs \
            --input "$RUNNER_TEMP/send-queue-build/program.opendesk-draft.json" \
            --out examples/sidebar-tools/ai-send-queue/ai-send-queue.opendesk-page.json \
            --revision "$SEND_QUEUE_REVISION" --title "AI 消息发送队列"
      - name: Validate package identity and compiled source integrity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {validatePageInstallPackage} from './src/scripting/user-scripts/page-install-package.js';
          const dir='examples/sidebar-tools/ai-send-queue/';
          const pkg=JSON.parse(await readFile(dir+'ai-send-queue.opendesk-page.json','utf8'));
          const manifest=JSON.parse(await readFile(dir+'package.json','utf8'));
          const catalog=JSON.parse(await readFile('official-pages/sources.json','utf8'));
          const entry=Object.values(catalog).flatMap(value=>Array.isArray(value)?value:[])
            .find(row=>row.programId==='opendesk.ai-send-queue');
          assert.ok(entry,'catalog entry');
          assert.equal(pkg.programId,'opendesk.ai-send-queue');
          assert.equal(pkg.programId,manifest.opendesk.id);
          assert.equal(pkg.version,manifest.version);
          assert.equal(pkg.version,entry.version);
          assert.equal(pkg.revision,entry.revision);
          assert.ok(pkg.revision>=10,'do not overwrite r9');
          for(const marker of ['sq-empty-mark','sq-panel sq-empty','#f7f8fa','#2e3035',
            'Packaged Send Queue crown image is missing or invalid']) {
            assert.ok(pkg.sourceUtf8.includes(marker),'missing compiled R5.5 feature: '+marker);
          }
          const crown=(await readFile(dir+'assets/crown-premium.webp')).toString('base64');
          assert.ok(pkg.sourceUtf8.includes(crown),'bundled WebP differs from official crown');
          assert.equal(pkg.sourceHash,createHash('sha256').update(pkg.sourceUtf8).digest('hex'));
          assert.equal((await validatePageInstallPackage(pkg)).packageHash,pkg.packageHash);
          assert.deepEqual(pkg.pageRules,manifest.opendesk.pageRules);
          console.log(JSON.stringify({id:pkg.programId,version:pkg.version,
            revision:pkg.revision,sourceHash:pkg.sourceHash,packageHash:pkg.packageHash}));
          NODE
      - name: Save build evidence independently of repository publication
        uses: actions/upload-artifact@v4
        with:
          name: send-queue-r58-blocked-page-candidate
          path: examples/sidebar-tools/ai-send-queue/ai-send-queue.opendesk-page.json
          if-no-files-found: error
          retention-days: 14
      # The currently blocked Page candidate is an audit artifact only.
      # A source push must never silently rewrite the frozen 0.1.12/r11 JSON.
      - name: Keep blocked install candidate unpromoted
        run: |
          echo 'BLOCKED: candidate built and uploaded for review only.'
          echo 'No git add, commit, push or implicit package upgrade.'
