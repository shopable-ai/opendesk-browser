name: Send Queue R5.5 formal source and install package
on:
  push:
    branches: [main]
    paths:
      - 'examples/programs/chatgpt-send-queue/src/**'
      - 'examples/programs/chatgpt-send-queue/tests/**'
      - 'examples/programs/chatgpt-send-queue/package.json'
      - 'official-pages/sources.json'
      - '.github/workflows/send-queue-production-r55.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: send-queue-r55-formal-main
  cancel-in-progress: false
jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned existing build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check actual Page Program sources
        run: |
          set -euo pipefail
          for f in main site engine view; do
            node --check "examples/programs/chatgpt-send-queue/src/$f.js"
          done
          node --test examples/programs/chatgpt-send-queue/tests/*.test.mjs
          node scripts/validate-program-project.mjs examples/programs/chatgpt-send-queue
          node examples/programs/chatgpt-send-queue/scripts/sync-crown-preview.mjs --check
      - name: Compile actual Program with the existing production builder
        run: npm run build:program -- examples/programs/chatgpt-send-queue --out "$RUNNER_TEMP/send-queue-build"
      - name: Build canonical Page install package with existing installer format
        run: |
          node scripts/build-page-install-package.mjs \
            --input "$RUNNER_TEMP/send-queue-build/program.opendesk-draft.json" \
            --out examples/programs/chatgpt-send-queue/ai-send-queue.opendesk-page.json \
            --revision 2 --title "AI 消息发送队列"
      - name: Validate package identity and compiled source integrity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {validatePageInstallPackage} from './src/scripting/user-scripts/page-install-package.js';
          const dir='examples/programs/chatgpt-send-queue/';
          const pkg=JSON.parse(await readFile(dir+'ai-send-queue.opendesk-page.json','utf8'));
          const manifest=JSON.parse(await readFile(dir+'package.json','utf8'));
          const catalog=JSON.parse(await readFile('official-pages/sources.json','utf8'));
          const entry=Object.values(catalog).flatMap(value=>Array.isArray(value)?value:[])
            .find(row=>row.programId==='opendesk.ai-send-queue');
          assert.ok(entry,'catalog entry');
          assert.equal(pkg.programId,'opendesk.ai-send-queue');
          assert.equal(pkg.programId,manifest.opendesk.id);
          assert.equal(pkg.version,manifest.version);
          assert.equal(pkg.version,entry.version);
          assert.equal(pkg.revision,entry.revision);
          assert.equal(pkg.revision,2);
          assert.equal(pkg.sourceHash,createHash('sha256').update(pkg.sourceUtf8).digest('hex'));
          assert.equal((await validatePageInstallPackage(pkg)).packageHash,pkg.packageHash);
          assert.deepEqual(pkg.pageRules,manifest.opendesk.pageRules);
          console.log(JSON.stringify({id:pkg.programId,version:pkg.version,
            revision:pkg.revision,sourceHash:pkg.sourceHash,packageHash:pkg.packageHash}));
          NODE
      - name: Save build evidence independently of repository publication
        uses: actions/upload-artifact@v4
        with:
          name: send-queue-r55-formal-package
          path: examples/programs/chatgpt-send-queue/ai-send-queue.opendesk-page.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit only the rebuilt install package to main (non-forcing)
        run: |
          set -euo pipefail
          FILE=examples/programs/chatgpt-send-queue/ai-send-queue.opendesk-page.json
          git add -- "$FILE"
          if git diff --cached --quiet; then
            echo 'Formal package already matches compiled source'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$FILE"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build(send-queue): sync canonical 0.1.3/r2 Page install package'
          # Rebase only our single package commit. A concurrent change to the
          # program, release manifest or package is a hard fail, never overwrite.
          BASE_SHA="$GITHUB_SHA"
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git diff --quiet "$BASE_SHA" origin/main -- \
              examples/programs/chatgpt-send-queue/src \
              examples/programs/chatgpt-send-queue/package.json \
              official-pages/sources.json "$FILE"; then
              echo 'Concurrent Send Queue source/package change; refusing publication'
              exit 1
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Page package pushed by normal fast-forward'
              exit 0
            fi
          done
          echo 'Concurrent main changes prevented safe publish; package artifact retained'
          exit 1
