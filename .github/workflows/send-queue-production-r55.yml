name: Send Queue single v2 Tool candidate CI
on:
  push:
    branches: [main]
    paths:
      - 'projects/ai-send-queue/src/**'
      - 'projects/ai-send-queue/assets/**'
      - 'projects/ai-send-queue/preview/**'
      - 'projects/ai-send-queue/scripts/**'
      - 'projects/ai-send-queue/tests/**'
      - 'projects/ai-send-queue/package.json'
      - 'official-tools/catalog.json'
      - 'src/ui/extension-center*.js'
      - 'src/ui/send-queue-product.js'
      - 'src/ui/sidebar-tools.js'
      - 'tests/environment/send-queue-product-installation.test.mjs'
      - 'projects/ai-send-queue/tool.config.json'
      - 'projects/ai-send-queue/vite.config.mjs'
      - 'projects/ai-send-queue/*.opendesk-tool.json'
      - 'scripts/build-sidebar-tool.mjs'
      - 'scripts/build-program-project.mjs'
      - 'scripts/build-page-install-package.mjs'
      - 'src/ui/sidebar-tools/package.js'
      - 'src/scripting/user-scripts/page-install-package.js'
      - '.github/workflows/send-queue-production-r55.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: send-queue-v2-source-bound-main
  cancel-in-progress: false
jobs:
  test-build-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned existing build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check actual Page Program sources
        run: |
          set -euo pipefail
          for f in main site engine view remote; do
            node --check "projects/ai-send-queue/src/page/$f.js"
          done
          node scripts/validate-program-project.mjs projects/ai-send-queue
          node projects/ai-send-queue/scripts/sync-crown-preview.mjs --check
      - name: Build one v2 Tool with embedded Page module
        run: |
          npm run --prefix projects/ai-send-queue build
          node projects/ai-send-queue/scripts/stage-react-candidate.mjs "$RUNNER_TEMP/ai-send-queue.opendesk-tool.json"
          node scripts/build-sidebar-tool.mjs projects/ai-send-queue --check-project
          node --test projects/ai-send-queue/tests/*.test.mjs
          # Canonical package validation binds the embedded Page; no implicit promotion.
          sha256sum "$RUNNER_TEMP/ai-send-queue.opendesk-tool.json"
      - name: Preserve single v2 Tool candidate
        uses: actions/upload-artifact@v4
        with:
          name: send-queue-v2-tool-candidate
          path: ${{ runner.temp }}/ai-send-queue.opendesk-tool.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve canonical R5.4 preview source for reviewed Sidebar rendering
        uses: actions/upload-artifact@v4
        with:
          name: send-queue-v2-canonical-preview
          path: projects/ai-send-queue/preview/index.html
          if-no-files-found: error
          retention-days: 14
      - name: Check single product installation projection
        run: node --test tests/environment/send-queue-product-installation.test.mjs
      # Report-only records the native gap without claiming a test pass.
      # Direct harness invocation still fails closed; no browser is launched.
      - name: Record native verification as not executed
        env:
          SEND_QUEUE_CANDIDATE_PATH: ${{ runner.temp }}/ai-send-queue.opendesk-tool.json
        run: node projects/ai-send-queue/scripts/ci-installed-chromium.mjs artifacts/send-queue-v2-installed-chromium --report-only
      - name: Preserve explicit native NOT_TESTED report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: send-queue-v2-installed-chromium-evidence
          path: artifacts/send-queue-v2-installed-chromium/
          if-no-files-found: warn
          retention-days: 14
      # This workflow never promotes, publishes, or installs the candidate.
