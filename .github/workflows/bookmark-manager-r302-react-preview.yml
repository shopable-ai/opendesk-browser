name: Bookmark Manager R3.2 · Formal React Source and Chromium
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'examples/sidebar-tools/bookmark-manager/preview/react/**'
      - 'examples/sidebar-tools/bookmark-manager/src/react/**'
      - 'examples/sidebar-tools/bookmark-manager/preview/r304-chrome.mjs'
      - 'examples/sidebar-tools/bookmark-manager/src/model.js'
      - 'examples/sidebar-tools/bookmark-manager/src/service.js'
      - 'src/ui/react/main.tsx'
      - 'src/ui/react/components/conversation.tsx'
      - 'src/ui/react/components/conversation-dock.css'
      - 'src/ui/conversation/bookmark-actions.js'
      - 'src/ui/workflow/provider.js'
      - 'src/ui/workflow/workflow-view.js'
      - 'src/ui/workflow/local-codex.js'
      - 'src/ui/workflow/ai-plan.js'
      - 'src/ui/react/tabs/workflow.tsx'
      - 'src/ui/sidebar-tools.js'
      - 'src/ui/sidebar-tools-view.js'
      - 'src/ui/trusted-bookmark-admission.js'
      - 'src/ui/tool-shell.js'
      - 'tests/environment/bookmark-manager-r31-trusted-lifecycle.test.mjs'
      - 'tests/environment/bookmark-manager-r308-clickable-detail-url.test.mjs'
      - 'tests/environment/bookmark-manager-r306-trusted-react.test.mjs'
      - 'tests/environment/bookmark-manager-r32-formal-source.test.mjs'
      - 'tests/environment/bookmark-manager-r33-default-react.test.mjs'
      - 'tests/environment/bookmark-manager-r34-write-order.test.mjs'
      - 'tests/environment/bookmark-manager-r34-transport.test.mjs'
      - 'tests/environment/bookmark-manager-r34-save-consent.test.mjs'
      - 'tests/environment/opendesk-conversation-r10.test.mjs'
      - 'tests/environment/opendesk-conversation-r16-authorization.test.mjs'
      - 'tests/environment/sidebar-tools-host.test.mjs'
      - 'tests/environment/sidebar-tools-view.test.mjs'
      - 'scripts/bundle-provenance.mjs'
      - '.github/workflows/bookmark-manager-r302-react-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bookmark-r32-react-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trusted-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Official admission, React lifecycle, clickable URL and sandbox regression
        run: |
          node --test \
            tests/environment/bookmark-manager-r308-clickable-detail-url.test.mjs \
            tests/environment/bookmark-manager-r306-trusted-react.test.mjs \
            tests/environment/bookmark-manager-r31-trusted-lifecycle.test.mjs \
            tests/environment/bookmark-manager-r32-formal-source.test.mjs \
            tests/environment/bookmark-manager-r33-default-react.test.mjs \
            tests/environment/bookmark-manager-r34-write-order.test.mjs \
            tests/environment/bookmark-manager-r34-transport.test.mjs \
            tests/environment/bookmark-manager-r34-save-consent.test.mjs \
            tests/environment/opendesk-conversation-r10.test.mjs \
            tests/environment/opendesk-conversation-r14-dock.test.mjs \
            tests/environment/opendesk-conversation-r15-closeout.test.mjs \
            tests/environment/opendesk-conversation-r16-authorization.test.mjs \
            tests/environment/sidebar-tools-view.test.mjs \
            tests/environment/extension-center-r47-interaction.test.mjs \
            tests/environment/bookmark-manager-r24-lifecycle.test.mjs \
            tests/environment/bundle-provenance.test.mjs
      - name: Build the three existing official React tool fixtures before Host integration tests
        run: |
          node scripts/build-adblock-react.mjs
          node scripts/build-stay-focus-react.mjs
          node scripts/build-cookie-editor-react.mjs
      - name: Official save intent and sandbox deletion boundaries
        run: node --test --test-name-pattern='R3.4' tests/environment/sidebar-tools-host.test.mjs
      - name: Confirm shared provider and legacy Workflow regressions
        run: node --test tests/environment/workflow-provider-facade.test.mjs tests/environment/workflow-responses.test.mjs tests/environment/workflow-local-codex.test.mjs
      - name: Check formal source
        run: npm run check
      - name: Build official WXT code without promoting or installing any tool package
        run: npm run build
      - name: Verify CSP, single packaged React runtime and immutable candidate size
        run: |
          node scripts/verify-package.mjs dist/production
          mkdir -p artifacts/bookmark-r32
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,stat,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const entry='dist/production/ui/tool-shell.js';
          const content=await readFile(entry);
          const manifest=JSON.parse(await readFile('dist/production/manifest.json','utf8'));
          const csp=manifest.content_security_policy?.extension_pages||'';
          assert.match(csp,/script-src 'self'/);
          assert.doesNotMatch(csp,/unsafe-eval|https?:\/\//);
          assert.ok(content.byteLength<1048576,'existing tool-shell production hard budget');
          const report={entry,bytes:content.byteLength,sha256:createHash('sha256').update(content).digest('hex'),csp,
            installedBookmarkPackagePromoted:false,reactRuntime:'host-shared'};
          await writeFile('artifacts/bookmark-r32/formal-bundle.json',JSON.stringify(report,null,2)+'\n');
          console.log('R32_TRUSTED_BUNDLE',JSON.stringify(report));
          NODE
      - name: Preserve fixed WXT build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-r32-trusted-source-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/bookmark-r32/formal-bundle.json
            docs/framework/evidence/wxt/builds/build-production.json
  standalone-react-package-budget:
    # The standalone sandbox bundle budget is an independent mandatory gate.
    # It must not prevent formal App visual inspection with a mock Host.
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root and preview pinned dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd examples/sidebar-tools/bookmark-manager/preview/react
          npm ci --no-audit --no-fund
      - name: Enforce existing standalone bundle byte limits
        working-directory: examples/sidebar-tools/bookmark-manager/preview/react
        run: |
          npm run preview:budget
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const report=JSON.parse(await readFile('.opendesk-preview/budget-report.json','utf8'));
          assert.equal(report.status,'SCHEMA_BUNDLE_READY_NOT_INSTALLED',report.blocker||report.error);
          NODE
      - name: Preserve independent budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-r32-formal-budget-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: examples/sidebar-tools/bookmark-manager/preview/react/.opendesk-preview/budget-report.json
  react-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing root-pinned build minifier
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned offline React 19 preview dependencies
        working-directory: examples/sidebar-tools/bookmark-manager/preview/react
        run: npm ci --no-audit --no-fund
      - name: Build and check exactly the current JSX candidate
        working-directory: examples/sidebar-tools/bookmark-manager/preview/react
        run: |
          npm run preview:build
          npm run preview:check
      - name: Install CJK font support for readable Chinese Chromium evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Real Chromium 320/360/400/440/960 with chat, details, keyboard and CRUD mock fixture
        working-directory: examples/sidebar-tools/bookmark-manager/preview/react
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run preview:chrome
      - name: Shared Chat Dock real Chromium interaction, two-turn readback and responsive regression
        working-directory: examples/sidebar-tools/bookmark-manager/preview/react
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run preview:chrome -- --conversation-r13
      - name: Preserve exact candidate and Chromium evidence (never auto-promote)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-r32-react-chromium-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            examples/sidebar-tools/bookmark-manager/preview/dev.html
            examples/sidebar-tools/bookmark-manager/preview/react/.opendesk-preview/chrome-formal/formal-mock.html
            examples/sidebar-tools/bookmark-manager/preview/react/.opendesk-preview/chrome-evidence/
            examples/sidebar-tools/bookmark-manager/preview/react/.opendesk-preview/budget-report.json
