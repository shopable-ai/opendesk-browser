name: AI VIP Share R2 source-bound React + scoped Chrome fixture

on:
  push:
    branches: [main]
    paths:
      - 'examples/sidebar-tools/ai-vip-share/**'
      - 'tests/environment/ai-vip-share-*.test.mjs'
      - '.github/workflows/ai-vip-share-r591-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-react:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile one formal sandbox React IIFE with public Shared UI externals
        run: npm run build --prefix examples/sidebar-tools/ai-vip-share
      - name: Verify old transaction, Cookie, STOP and React source contracts
        run: |
          node --test tests/environment/ai-vip-share-r5-ui.test.mjs \
            tests/environment/ai-vip-share-r51-member.test.mjs \
            tests/environment/ai-vip-share-r59-proxy-ui.test.mjs \
            tests/environment/ai-vip-share-ui-parity.test.mjs \
            tests/environment/ai-vip-share-local-development.test.mjs
          node --test examples/sidebar-tools/ai-vip-share/preview/test-r41.mjs \
            examples/sidebar-tools/ai-vip-share/preview/test-ui.mjs
      - name: Produce UNPROMOTED candidate from canonical build, keep previous release
        run: |
          node scripts/build-sidebar-tool.mjs examples/sidebar-tools/ai-vip-share \
            --out artifacts/ai-vip-share-react/candidate.opendesk-tool.json
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const filename='artifacts/ai-vip-share-react/candidate.opendesk-tool.json';
          const bytes=readFileSync(filename),pkg=JSON.parse(bytes);
          assert.equal(pkg.id,'ai-vip-share');assert.equal(pkg.version,'1.4.2');
          assert.equal(pkg.uiRuntime,'opendesk.react-ui.v1');
          assert.equal(pkg.html.trim(),'<div id="tool-app"></div>');
          console.log('UNPROMOTED_REACT_CANDIDATE',createHash('sha256').update(bytes).digest('hex'));
          CHECK
      - name: Build preview from SAME App.jsx and Shared UI source, isolated SDK fixture
        run: npm run build:preview --prefix examples/sidebar-tools/ai-vip-share
      - name: Install CJK fonts for Chinese screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-match -f '%{family}\\n' ':lang=zh'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Exercise source-bound React in real Chromium, SDK mocked, not installed
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node examples/sidebar-tools/ai-vip-share/preview/test-react-chromium.mjs
      - name: Preserve separate trusted Browser build-source gates
        run: |
          npm run build:dev
          npm run build
          npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-vip-share-react-${{ github.sha }}
          path: |
            artifacts/ai-vip-share-react/
            examples/sidebar-tools/ai-vip-share/dist/build-ready.json
            examples/sidebar-tools/ai-vip-share/preview/dist/
          if-no-files-found: warn
          retention-days: 14
