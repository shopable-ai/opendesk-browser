name: R12 SW sizing and security guard
on:
  push:
    branches:
      - agent/r12-sw-optimization-20261010-a1
  pull_request:
    branches:
      - main
    paths:
      - 'src/sw.js'
      - 'src/platform/**'
      - 'src/entrypoints/background.js'
      - 'scripts/report-sw-size.mjs'
      - 'scripts/compact-schema.mjs'
      - 'wxt.config.mjs'
      - '.github/workflows/r12-sw-size.yml'
permissions:
  contents: read
jobs:
  sw-package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build contribution reporter contracts
        run: node --test tests/environment/sw-size-report.test.mjs tests/environment/bundle-provenance.test.mjs tests/environment/compact-schema.test.mjs
      - name: Core authority, Page/SDK and package boundaries
        run: node --test tests/environment/permission-gate.test.mjs tests/environment/page-candidate-service.test.mjs tests/environment/controller-target-fragment.test.mjs tests/environment/boundaries.test.mjs
      - name: Storage, Template compatibility, Controller and download regressions
        run: node --test tests/foundation/storage.test.mjs tests/foundation/runtime.test.mjs tests/foundation/download-service.test.mjs tests/framework/k3-controller-authority.test.mjs tests/framework/k2-generic-download.test.mjs
      - name: Source and supply chain checks
        run: npm run check
      - name: One actual WXT production build; no pack or ZIP
        run: npm run build
      - name: Physically verify minified SW bytes and log module graph
        run: node scripts/report-sw-size.mjs artifacts/r12-sw-analysis.json
      - name: Preserve current-run report and raw receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-sw-measurement-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/r12-sw-analysis.json
            docs/framework/evidence/wxt/builds/build-production.json

  macos-real-chrome:
    needs: sw-package
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild exactly this production candidate, no ZIP
        run: npm run build
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
      - name: Keep actual macOS CFT app Frameworks intact
        id: app
        env:
          SOURCE_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          case "$SOURCE_BINARY" in
            */Contents/MacOS/"Google Chrome for Testing") original="${SOURCE_BINARY%/Contents/MacOS/*}" ;;
            *) echo "Unexpected pinned CFT binary: $SOURCE_BINARY" >&2; exit 1 ;;
          esac
          test -d "$original/Contents/Frameworks"
          destination="$RUNNER_TEMP/opendesk-r12-cft/Google Chrome for Testing.app"
          mkdir -p "${destination%/*}"
          /usr/bin/ditto "$original" "$destination"
          printf 'binary=%s\n' "$destination/Contents/MacOS/Google Chrome for Testing" >> "$GITHUB_OUTPUT"
      - name: Actual isolated MV3 registration, listeners and worker restart
        env:
          CHROME_FOR_TESTING_BIN: ${{ steps.app.outputs.binary }}
        run: node tests/framework/r12-sw-native-smoke.mjs
      - name: Preserve native same-candidate observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-sw-native-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/r12-sw-native-smoke.json
            docs/framework/evidence/wxt/builds/build-production.json
