<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDesk 应用市场 R2 · 交互原型</title>
<style>body{margin:0;color-scheme:light dark;background:light-dark(#f5f7fb,#111926)}#opendesk-market-r2 .cursor-interaction{cursor:pointer}#opendesk-market-r2 .m2-shell{border:0;border-radius:0}</style>
</head>
<body>
<div id="opendesk-market-r2" lang="zh-CN">
  <style>
    #opendesk-market-r2{--m-ink:light-dark(#1b2c49,#e7ecf5);--m-sub:light-dark(#53647e,#a7b5cc);--m-line:light-dark(#e1e8f1,#344154);--m-brand:light-dark(#365eda,#8ba4ff);--m-on-brand:light-dark(#fff,#15203d);--m-soft:light-dark(#eef2ff,#263552);--m-paper:light-dark(#fff,#1a2434);--m-bg:light-dark(#f5f7fb,#111926);--m-positive:light-dark(#138263,#78d0ad);--m-positive-bg:light-dark(#edf8f3,#143b30);--m-negative:light-dark(#ae3d4b,#ff9fab);--m-warning:light-dark(#805a13,#e6c883);--m-warning-bg:light-dark(#fff8e9,#393020);--m-shadow:0 20px 70px light-dark(#1b2c4926,#0007);color-scheme:light dark;background:transparent;color:var(--m-ink);font:400 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;width:100%;isolation:isolate}
    #opendesk-market-r2 *{box-sizing:border-box}
    #opendesk-market-r2 [hidden]{display:none!important}
    #opendesk-market-r2 button,#opendesk-market-r2 input,#opendesk-market-r2 select,#opendesk-market-r2 textarea{font:inherit;color:inherit}
    #opendesk-market-r2 button{touch-action:manipulation}
    #opendesk-market-r2 button:disabled{opacity:.5;cursor:not-allowed}
    #opendesk-market-r2 h1,#opendesk-market-r2 h2,#opendesk-market-r2 h3,#opendesk-market-r2 h4,#opendesk-market-r2 p{margin:0}
    #opendesk-market-r2 h1{font-size:28px;font-weight:500;line-height:1.25;letter-spacing:-.7px}
    #opendesk-market-r2 h2{font-size:18px;font-weight:500;line-height:1.4}
    #opendesk-market-r2 h3{font-size:15px;font-weight:500;line-height:1.4}
    #opendesk-market-r2 h4{font-size:13px;font-weight:500;line-height:1.45}
    #opendesk-market-r2 strong{font-weight:500}
    #opendesk-market-r2 a{color:var(--m-brand);text-underline-offset:3px;overflow-wrap:anywhere}
    #opendesk-market-r2 code{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
    #opendesk-market-r2 .m2-shell{min-height:700px;background:var(--m-bg);border:1px solid var(--m-line);border-radius:12px;overflow:clip;min-width:0}
    #opendesk-market-r2 .m2-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 28px;background:var(--m-paper);border-bottom:1px solid var(--m-line);flex-wrap:wrap}
    #opendesk-market-r2 .m2-wordmark{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--m-ink);font-size:16px;font-weight:500;white-space:nowrap}
    #opendesk-market-r2 .m2-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--m-brand);color:var(--m-on-brand);font-size:17px}
    #opendesk-market-r2 .m2-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
    #opendesk-market-r2 .m2-nav a{color:var(--m-sub);text-decoration:none;padding:8px 12px;border-radius:8px;min-height:36px;display:inline-flex;gap:6px;align-items:center}
    #opendesk-market-r2 .m2-nav a[aria-current="page"]{background:var(--m-soft);color:var(--m-brand);font-weight:500}
    #opendesk-market-r2 .m2-counter{min-width:18px;height:18px;padding:0 4px;display:inline-grid;place-items:center;border-radius:4px;background:var(--m-bg);font-size:11px;font-variant-numeric:tabular-nums}
    #opendesk-market-r2 .m2-preview-bar{padding:8px 28px;background:var(--m-paper);border-bottom:1px solid var(--m-line);display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;font-size:11px;color:var(--m-sub)}
    #opendesk-market-r2 .m2-preview-bar p{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    #opendesk-market-r2 .m2-dot{display:inline-block;width:5px;height:5px;background:currentColor;border-radius:50%;flex:none}
    #opendesk-market-r2 .m2-main{max-width:1280px;margin:0 auto;padding:24px 28px 28px;min-width:0}
    #opendesk-market-r2 .m2-page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px;flex-wrap:wrap}
    #opendesk-market-r2 .m2-page-heading p{color:var(--m-sub);margin-top:8px;max-width:650px}
    #opendesk-market-r2 .m2-kicker{font-size:11px;color:var(--m-sub);letter-spacing:.2px;margin-bottom:8px!important}
    #opendesk-market-r2 .m2-breadcrumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--m-sub);font-size:12px;margin-bottom:24px}
    #opendesk-market-r2 .m2-breadcrumb a{color:var(--m-sub);text-decoration:none}
    #opendesk-market-r2 .m2-breadcrumb a:hover{text-decoration:underline}
    #opendesk-market-r2 .m2-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;min-height:36px;border:1px solid var(--m-line);border-radius:8px;background:var(--m-paper);color:var(--m-ink);font-weight:400;text-decoration:none;white-space:nowrap;max-width:100%}
    #opendesk-market-r2 .m2-button.m2-primary{color:var(--m-on-brand);background:var(--m-brand);border-color:var(--m-brand)}
    #opendesk-market-r2 .m2-button.m2-soft{background:var(--m-soft);border-color:var(--m-soft);color:var(--m-brand)}
    #opendesk-market-r2 .m2-button.m2-quiet{border-color:transparent;background:transparent;color:var(--m-sub);padding:6px 8px}
    #opendesk-market-r2 .m2-button.m2-danger{color:var(--m-negative)}
    #opendesk-market-r2 .m2-button.m2-small{padding:6px 10px;min-height:30px;font-size:12px}
    #opendesk-market-r2 .m2-button.m2-block{width:100%}
    #opendesk-market-r2 .m2-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    #opendesk-market-r2 .m2-action-column{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
    #opendesk-market-r2 .m2-muted{color:var(--m-sub)}
    #opendesk-market-r2 .m2-small-text{font-size:12px}
    #opendesk-market-r2 .m2-tiny{font-size:11px}
    #opendesk-market-r2 .m2-badge{display:inline-flex;gap:5px;align-items:center;padding:3px 7px;border-radius:5px;background:var(--m-bg);color:var(--m-sub);font-size:11px;line-height:1.5}
    #opendesk-market-r2 .m2-badge.m2-good{color:var(--m-positive);background:var(--m-positive-bg)}
    #opendesk-market-r2 .m2-badge.m2-caution{color:var(--m-warning);background:var(--m-warning-bg)}
    #opendesk-market-r2 .m2-status-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
    #opendesk-market-r2 .m2-app-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--m-soft);border:1px solid var(--m-soft);font-size:14px;font-weight:500;color:var(--m-brand);flex:none}
    #opendesk-market-r2 .m2-app-icon.m2-mini{width:32px;height:32px;font-size:11px;border-radius:8px}
    #opendesk-market-r2 .m2-app-title{display:flex;align-items:center;gap:12px;min-width:0}
    #opendesk-market-r2 .m2-app-title>div{min-width:0}
    #opendesk-market-r2 .m2-detail-hero{display:flex;gap:24px;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
    #opendesk-market-r2 .m2-detail-hero p{color:var(--m-sub);margin-top:7px}
    #opendesk-market-r2 .m2-detail-install{flex:0 0 184px;display:flex;gap:8px;flex-direction:column;padding-top:2px}
    #opendesk-market-r2 .m2-detail-install .m2-small-text{text-align:center;color:var(--m-sub);font-size:11px;margin:0}
    #opendesk-market-r2 .m2-gallery{background:var(--m-paper);border:1px solid var(--m-line);border-radius:12px;overflow:clip;margin-bottom:24px}
    #opendesk-market-r2 .m2-media-bar{padding:10px 16px;border-bottom:1px solid var(--m-line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--m-paper);color:var(--m-sub);font-size:11px}
    #opendesk-market-r2 .m2-media-stage{background:var(--m-bg);padding:24px;min-height:296px}
    #opendesk-market-r2 .m2-media-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--m-line)}
    #opendesk-market-r2 .m2-media-caption{min-width:0;flex:1;color:var(--m-sub);font-size:12px}
    #opendesk-market-r2 .m2-media-count{font-variant-numeric:tabular-nums;font-size:11px;color:var(--m-sub);min-width:30px;text-align:center}
    #opendesk-market-r2 .m2-thumbnails{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 16px 16px}
    #opendesk-market-r2 .m2-thumbnail{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--m-line);border-radius:8px;padding:10px;background:var(--m-paper);min-width:0}
    #opendesk-market-r2 .m2-thumbnail[aria-pressed="true"]{background:var(--m-soft);border-color:var(--m-brand)}
    #opendesk-market-r2 .m2-thumbnail>span:last-child{min-width:0;font-size:12px}
    #opendesk-market-r2 .m2-thumbnail-preview{width:42px;height:32px;border-radius:5px;background:var(--m-bg);border:1px solid var(--m-line);display:flex;gap:3px;padding:5px;flex:none}
    #opendesk-market-r2 .m2-thumb-sidebar{width:9px;background:var(--m-line);border-radius:2px}
    #opendesk-market-r2 .m2-thumb-lines{flex:1;display:flex;flex-direction:column;gap:3px;padding-top:2px}
    #opendesk-market-r2 .m2-thumb-lines i{height:3px;background:var(--m-line);border-radius:1px;display:block}
    #opendesk-market-r2 .m2-thumb-lines i:last-child{width:65%}
    #opendesk-market-r2 .m2-media-alternative{border-top:1px solid var(--m-line);padding:12px 16px;font-size:12px;color:var(--m-sub)}
    #opendesk-market-r2 .m2-media-alternative summary{color:var(--m-sub);min-height:24px}
    #opendesk-market-r2 .m2-media-alternative p{margin-top:8px}
    #opendesk-market-r2 .m2-mock-browser{background:var(--m-paper);border:1px solid var(--m-line);border-radius:10px;overflow:clip;max-width:900px;margin:0 auto}
    #opendesk-market-r2 .m2-mock-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;background:var(--m-paper);border-bottom:1px solid var(--m-line);font-size:11px;color:var(--m-sub)}
    #opendesk-market-r2 .m2-mock-top .m2-window-dots{display:flex;gap:4px;align-items:center}
    #opendesk-market-r2 .m2-window-dots i{display:block;width:5px;height:5px;border-radius:50%;background:var(--m-line)}
    #opendesk-market-r2 .m2-article-layout{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:24px;padding:24px}
    #opendesk-market-r2 .m2-article-layout.m2-left-toc{grid-template-columns:190px minmax(0,1fr)}
    #opendesk-market-r2 .m2-article-layout.m2-left-toc .m2-mock-toc{order:-1}
    #opendesk-market-r2 .m2-mock-article{min-width:0}
    #opendesk-market-r2 .m2-mock-article h3{font-size:20px;font-weight:500;margin-bottom:12px}
    #opendesk-market-r2 .m2-mock-article h4{font-size:13px;margin:12px 0 5px}
    #opendesk-market-r2 .m2-mock-article p{color:var(--m-sub);font-size:12px;max-width:520px}
    #opendesk-market-r2 .m2-mock-lines{margin-top:10px;display:flex;flex-direction:column;gap:7px}
    #opendesk-market-r2 .m2-mock-lines span{height:5px;border-radius:2px;background:var(--m-line)}
    #opendesk-market-r2 .m2-mock-lines span:last-child{width:72%}
    #opendesk-market-r2 .m2-mock-highlight{background:var(--m-soft);border-left:2px solid var(--m-brand);border-radius:0 5px 5px 0;padding:10px 12px;margin:12px 0}
    #opendesk-market-r2 .m2-mock-toc{border:1px solid var(--m-line);border-radius:8px;background:var(--m-paper);align-self:start;padding:10px;box-shadow:0 6px 18px light-dark(#1b2c4908,#0002);min-width:0}
    #opendesk-market-r2 .m2-mock-toc h4{padding:4px 7px 9px;color:var(--m-sub);font-size:11px}
    #opendesk-market-r2 .m2-mock-toc button{display:block;padding:7px;border:0;border-radius:5px;width:100%;background:transparent;text-align:left;font-size:12px;min-height:30px}
    #opendesk-market-r2 .m2-mock-toc button[aria-pressed="true"]{background:var(--m-soft);color:var(--m-brand)}
    #opendesk-market-r2 .m2-mock-conversation{display:flex;flex-direction:column;gap:14px;min-width:0}
    #opendesk-market-r2 .m2-question{align-self:flex-end;background:var(--m-bg);padding:10px 14px;border-radius:10px;max-width:90%;font-size:12px}
    #opendesk-market-r2 .m2-answer{border-left:2px solid var(--m-brand);padding-left:14px}
    #opendesk-market-r2 .m2-answer p{color:var(--m-sub);font-size:12px;margin-top:5px}
    #opendesk-market-r2 .m2-note-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,.8fr);gap:20px;padding:24px}
    #opendesk-market-r2 .m2-note-panel{padding:16px;background:var(--m-bg);border:1px solid var(--m-line);border-radius:8px;min-width:0}
    #opendesk-market-r2 .m2-note-panel p{font-size:12px;margin-top:8px}
    #opendesk-market-r2 .m2-note-source{font-size:11px!important;color:var(--m-sub);margin-bottom:12px!important}
    #opendesk-market-r2 .m2-note-area{border:1px solid var(--m-line);border-radius:8px;width:100%;min-height:100px;padding:10px;background:var(--m-paper);resize:vertical}
    #opendesk-market-r2 .m2-code-layout{display:grid;grid-template-columns:1fr 1fr;gap:0;min-width:0}
    #opendesk-market-r2 .m2-code-pane{padding:20px;min-width:0}
    #opendesk-market-r2 .m2-code-pane+div{border-left:1px solid var(--m-line)}
    #opendesk-market-r2 .m2-code-pane pre{font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--m-sub);margin:12px 0 0}
    #opendesk-market-r2 .m2-code-pane h4{margin:12px 0 8px}
    #opendesk-market-r2 .m2-code-pane p{font-size:12px;color:var(--m-sub);margin-top:8px}
    #opendesk-market-r2 .m2-detail-content{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px}
    #opendesk-market-r2 .m2-content-section{margin-bottom:24px}
    #opendesk-market-r2 .m2-content-section h2{margin-bottom:12px}
    #opendesk-market-r2 .m2-feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    #opendesk-market-r2 .m2-feature{padding:16px;border:1px solid var(--m-line);border-radius:10px;background:var(--m-paper);min-width:0}
    #opendesk-market-r2 .m2-feature p{margin-top:6px;color:var(--m-sub);font-size:12px}
    #opendesk-market-r2 .m2-info-panel{background:var(--m-paper);border:1px solid var(--m-line);border-radius:12px;padding:16px;min-width:0}
    #opendesk-market-r2 .m2-info-panel h3{margin-bottom:12px}
    #opendesk-market-r2 .m2-info-panel p+p{margin-top:8px}
    #opendesk-market-r2 .m2-definition{display:flex;flex-direction:column;gap:12px;margin:0}
    #opendesk-market-r2 .m2-definition>div{min-width:0}
    #opendesk-market-r2 .m2-definition dt{font-size:11px;color:var(--m-sub);margin-bottom:3px}
    #opendesk-market-r2 .m2-definition dd{margin:0;font-size:12px;overflow-wrap:anywhere}
    #opendesk-market-r2 .m2-definition.m2-two-col{display:grid;grid-template-columns:1fr 1fr}
    #opendesk-market-r2 .m2-permission-list{padding:0;margin:0;list-style:none;display:flex;flex-direction:column;gap:10px}
    #opendesk-market-r2 .m2-permission-list li{display:flex;gap:8px;align-items:flex-start;font-size:12px}
    #opendesk-market-r2 .m2-permission-list li::before{content:'·';color:var(--m-brand);font-weight:500;flex:none}
    #opendesk-market-r2 .m2-capabilities{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
    #opendesk-market-r2 .m2-capabilities code{font-size:11px;padding:3px 5px;border-radius:4px;background:var(--m-bg);color:var(--m-sub)}
    #opendesk-market-r2 .m2-callout{padding:12px 14px;background:var(--m-soft);border-left:2px solid var(--m-brand);border-radius:0 8px 8px 0;font-size:12px;color:var(--m-sub)}
    #opendesk-market-r2 .m2-callout.m2-warning{background:var(--m-warning-bg);border-color:var(--m-warning);color:var(--m-warning)}
    #opendesk-market-r2 .m2-callout.m2-error{background:var(--m-paper);border-color:var(--m-negative);color:var(--m-negative)}
    #opendesk-market-r2 .m2-catalog-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:16px;background:var(--m-paper);border:1px solid var(--m-line);border-radius:12px;margin-bottom:24px}
    #opendesk-market-r2 .m2-field{display:flex;flex-direction:column;gap:6px;min-width:0}
    #opendesk-market-r2 .m2-field label{font-size:12px;color:var(--m-sub)}
    #opendesk-market-r2 .m2-field.m2-grow{flex:1 1 250px}
    #opendesk-market-r2 .m2-field.m2-filter{flex:0 1 160px}
    #opendesk-market-r2 .m2-input,#opendesk-market-r2 .m2-select,#opendesk-market-r2 .m2-textarea{border:1px solid var(--m-line);border-radius:8px;background:var(--m-paper);padding:9px 11px;min-height:38px;max-width:100%;min-width:0}
    #opendesk-market-r2 .m2-textarea{min-height:112px;resize:vertical;width:100%}
    #opendesk-market-r2 .m2-search-wrap{display:flex;align-items:center;gap:4px;border:1px solid var(--m-line);border-radius:8px;padding-right:4px;min-width:0}
    #opendesk-market-r2 .m2-search-wrap input{border:0;border-radius:8px;background:transparent;padding:9px 11px;min-width:0;width:100%;min-height:38px}
    #opendesk-market-r2 input::placeholder,#opendesk-market-r2 textarea::placeholder{color:var(--m-sub);opacity:.8}
    #opendesk-market-r2 input[type="checkbox"]{width:16px;height:16px;flex:none;accent-color:var(--m-brand);margin:0}
    #opendesk-market-r2 .m2-check{display:flex;gap:8px;align-items:flex-start;min-width:0;font-size:12px}
    #opendesk-market-r2 .m2-check input{margin-top:2px}
    #opendesk-market-r2 .m2-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    #opendesk-market-r2 .m2-app-card{border:1px solid var(--m-line);border-radius:12px;background:var(--m-paper);overflow:clip;min-width:0}
    #opendesk-market-r2 .m2-card-media{min-height:130px;background:var(--m-bg);border-bottom:1px solid var(--m-line);padding:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--m-ink)}
    #opendesk-market-r2 .m2-card-miniwindow{width:100%;max-width:320px;background:var(--m-paper);border:1px solid var(--m-line);border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr 75px;gap:12px;min-height:90px}
    #opendesk-market-r2 .m2-card-miniwindow strong{font-size:12px}
    #opendesk-market-r2 .m2-card-miniwindow p{font-size:11px;color:var(--m-sub);margin-top:5px}
    #opendesk-market-r2 .m2-mini-panel{background:var(--m-soft);border-radius:5px;padding:7px;font-size:11px;color:var(--m-brand);min-width:0}
    #opendesk-market-r2 .m2-mini-panel span{display:block;margin:3px 0}
    #opendesk-market-r2 .m2-card-body{padding:18px}
    #opendesk-market-r2 .m2-card-body h3 a{color:var(--m-ink);text-decoration:none}
    #opendesk-market-r2 .m2-card-body>p{color:var(--m-sub);margin-top:10px;min-height:38px}

        openDialog('确认所选恢复计划','只在本次演示中恢复，真实设备仍未连接',body,button('取消','dialog-cancel')+button('确认并逐项演示','restore-confirm',{},'m2-primary'),{kind:'restore-confirm'});

      function versionDialog(appId){

        openDialog('查看版本差异','默认保留目标设备的已有版本',`<dl class="m2-definition m2-two-col"><div><dt>目标已有版本</dt><dd>${esc(present.version)}</dd></div><div><dt>清单指定版本</dt><dd>${esc(item.version)}</dd></div></dl><h3>${esc(app.name)}</h3>${permissionList(app)}<p class="m2-callout">这里只展示目标候选版本的能力。真实安装前应重新核对发布者、包字节与权限变化，不沿用其他计划的批准。应用数据 schema 必须兼容；未确认兼容时阻止更改。</p>`,button('保留现有版本','dialog-cancel')+button('按此目标继续演示','approve-version',{id:appId},'m2-primary'),{kind:'version'});

      function reviewHeader(title,description){return`${breadcrumb('验收场景')}<div class="m2-page-heading"><div><p class="m2-kicker">人工构造的验收输入 · 非环境检测</p><h1>${esc(title)}</h1><p>${esc(description)}</p></div>${link('返回应用详情',appPath('reading-toc'),'m2-small')}</div>`;}
      function reviewPage(scenario){
        if(['partial-failure','cancel-batch'].includes(scenario)){
          const partial=scenario==='partial-failure';const active=state.batchContext?.source==='review'&&state.batchContext.key===scenario;
          return`${reviewHeader(partial?'批量安装：部分失败':'批量安装：取消剩余项目',partial?'固定演示一项跳过、一项校验失败和其他项完成；随后仅重试明确失败项。':'逐项推进后取消剩余项目。已完成项保留，进入安装阶段的项目先核对结果。')}<div class="m2-review-panel"><h3>可复现的操作顺序</h3><p>${partial?'开始场景 → 逐次点击下一步，直到出现完整结果 → 仅重试失败项。失败只对网页剪藏人工注入一次。':'开始场景 → 先让一个应用完成 → 在后续项目处理中点击取消剩余项目 → 若有在途项，继续下一步核对它的结果。'}</p>${button(active?'重新开始此验收场景':'开始此验收场景','start-review-batch',{scenario},'m2-soft')}</div>${active&&state.batch?operationHTML(state.batch):''}`;
        }
        if(['missing-package','version-difference'].includes(scenario))return`${reviewHeader(scenario==='missing-package'?'迁移预检：本地包缺失':'迁移预检：已有其他版本',scenario==='missing-package'?'清单中加入一个目标设备没有的本地应用；只显示受阻，不执行清单中的代码或回退发行。':'场景中已有较早演示版本，默认保留。查看差异并确认当前目标后，才能恢复所选版本。')}${transferPage(true)}`;
        if(scenario==='installed-apps')return`${reviewHeader('多应用管理与分享','明确载入三项本次演示安装，以检查多选、套装创建、暂停与卸载；不会触碰真实应用。')}<div class="m2-review-panel"><h3>载入演示安装</h3><p>将目录、笔记和剪藏加入本页内存，然后打开“我的应用”。</p>${button('载入并查看我的应用','seed-installed',{},'m2-primary')}</div>`;
        if(scenario==='reconnect')return`${reviewHeader('连接中断：先核对事务结果','连接丢失不等于安装失败。保留此前事务，先查询结果，不能盲目重复提交。')}<section class="m2-review-panel"><h3>已批准事务的结果暂时未知</h3><p>本场景主动构造一次已进入安装阶段、随后丢失返回结果的事务。先核对原事务，再读取同一演示回执；过程不会创建第二次安装。</p><div class="m2-actions">${button('查看恢复规则','recovery-help',{},'m2-small')}</div></section>${state.batch?operationHTML(state.batch):''}`;
        const unsupported=scenario==='unsupported';return`${reviewHeader(unsupported?'环境不支持':'无法连接 OpenDesk',unsupported?'场景设定：安装所需宿主协议不兼容；不代表已经检测你的浏览器。':'场景设定：外部安装交接没有得到有效回应；不能仅凭未响应断言扩展未安装。')}<section class="m2-handoff-card"><div class="m2-app-title">${icon(catalog['reading-toc'])}<div><h2>网页目录 TOC</h2><p class="m2-small-text m2-muted">保留所选应用与候选版本 1.0.1</p></div></div><p>${unsupported?'需要在支持的浏览器或新版宿主中继续。目标网页是否受限，不会被用来错误阻止兼容的侧边栏工具安装。':'确认 OpenDesk 是否已安装、允许当前站点交接并处于可用状态。这里没有进行真实探测。'}</p><div class="m2-actions" style="margin-top:18px">${button('查看接入步骤','installation-help',{},'m2-primary')}${link('返回公开安装页','/handoff/opendesk/reading-toc')}</div></section>`;
      }
      function setupReview(scenario){
        state.reviewActive=scenario;
        if(scenario==='reconnect'){
          state.reviewInstalled={};
          let operation=createPrototypeBatch(itemPlan([asItem('reading-toc')],state.reviewInstalled),state.reviewInstalled,{scope:'review'});
          operation=review.advanceBatch(review.advanceBatch(operation));
          operation=review.advanceBatch(operation,{outcome:'unknown',itemOperationId:operation.items[0].itemOperationId});
          state.batch=operation;state.batchContext={source:'review',key:'reconnect'};rememberBatch();
        }
        if(['version-difference','missing-package'].includes(scenario)){
          state.reviewInstalled={};
          if(scenario==='version-difference')state.reviewInstalled['reading-toc']={owner:'opendesk',version:'1.0.0',paused:false,preferences:{},artifactSha256:null,mockArtifactId:'prototype:opendesk/reading-toc@1.0.0'};
          const data=sampleTransfer(scenario==='missing-package');state.transferMode='restore';prepareTransfer(JSON.stringify(data,null,2));
        }
      }
      function notFound(route){return empty(route.type==='release-unavailable'?'所选版本暂不可用':'这个链接无法打开','不会自动替换应用、版本或安装包。请返回目录选择已知的工具候选。',link('返回应用市场','/','m2-primary'));}
      function renderRoute(routeChanged=false){
        if(rendering)return;rendering=true;
        const next=review.parseRoute(location.hash);const changed=routeChanged||!state.route||state.route.path!==next.path;
        if(changed){stopPlayback();if(dialog.open)closeDialog('route');if(next.type==='review'&&state.route?.path!==next.path)setupReview(next.scenario);else if(next.type!=='review')state.reviewActive=null;}
        state.route=next;
        const activeNav=['collections','collection','collection-install','collection-handoff','builder'].includes(next.type)?'collections':next.type==='my-apps'?'my-apps':'recommended';
        qa('[data-nav]').forEach(nav=>{if(nav.dataset.nav===activeNav)nav.setAttribute('aria-current','page');else nav.removeAttribute('aria-current');});q('#m2-installed-count').textContent=Object.keys(state.installed).length;
        let html='';let pending=null;
        if(next.type==='home')html=home();
        else if(['apps','install','handoff'].includes(next.type)){
          const app=catalog[next.appId];
          if(!app)html=notFound(next);
          else if(next.version&&next.version!==app.version)html=notFound({...next,type:'release-unavailable'});
          else if(next.type==='handoff')html=publicHandoff(app);
          else{html=appDetail(app);if(next.type==='install')pending=()=>showSingle(app);}
        }
        else if(next.type==='collections')html=collectionsPage();
        else if(next.type==='builder')html=builderPage();
        else if(['collection','collection-install','collection-handoff'].includes(next.type)){
          const info=collectionInfo(next.collectionId,next.revision);
          if(!info)html=notFound(next);
          else{activateBatch('collection',collectionKey(info.collection.id,info.revision));if(next.type==='collection-handoff')html=publicHandoff(null,info);else{html=collectionPage(info);if(next.type==='collection-install'&&(!state.batch||(state.batch.phase==='complete'&&!state.batch.needsAttention&&itemPlan(selectedCollectionItems(info)).some(item=>item.status==='ready'))))pending=()=>showCollectionConfirm(info);}}
        }else if(next.type==='my-apps')html=myApps();
        else if(next.type==='transfer'){activateBatch('transfer',state.transferKey);html=transferPage();}
        else if(next.type==='review'){if(['partial-failure','cancel-batch','reconnect'].includes(next.scenario))activateBatch('review',next.scenario);if(['missing-package','version-difference'].includes(next.scenario))activateBatch('transfer',state.transferKey);html=reviewPage(next.scenario);}
        else html=notFound(next);
        q('#m2-main').innerHTML=(state.toast?`<div class="m2-toast"><p role="status" aria-live="polite">${esc(state.toast)}</p>${button('关闭','dismiss-toast',{},'m2-small m2-quiet')}</div>`:'')+html;
        if(next.type==='home'){q('#m2-category').value=state.catalogCategory;q('#m2-scope').value=state.catalogScope;renderCatalogResults();}
        rendering=false;
        if(pending&&!dialog.open)pending();
      }
      function deploymentHelp(){

          `<ol class="m2-step-list">
             <li><span class="m2-step-number">1</span><span><strong>本地预览</strong>：用静态 HTTP 服务打开此 HTML，测试详情、套装、分享等演示交互；不会真实安装工具。</span></li>

           <p class="m2-small-text m2-muted">本原型使用 #/apps/... 等 Hash 路由；正式公网详情使用可直接访问的路径和服务器回退配置。market.opendesk.example 为未部署的示例域名，链接不可当作生产安装入口。</p>`,

      function installHelp(){openDialog('安装与实际使用','本页只演示提案，没有连接状态或真实安装结果',`<ol class="m2-step-list"><li><span class="m2-step-number">1</span>看详情与权限</li><li><span class="m2-step-number">2</span>在 OpenDesk 中确认安装</li><li><span class="m2-step-number">3</span>按应用需要实际使用</li></ol><p class="m2-small-text m2-muted">公网链接只预选应用；用户继续后，实际安装应由扩展自有可信页面确认。访问链接本身不安装、不授权、不执行业务操作。</p><p class="m2-callout">在目标网页打开 OpenDesk 侧边栏。笔记可独立使用，工作台无需网页读取；目录和剪藏按各自既有能力确认精确网站授权。</p>`,button('知道了','dialog-cancel',{},'m2-primary'),{kind:'help'});}
      function useHelp(app){openDialog('使用'+app.name,'这里无法访问或选择你正在浏览的真实网页',`<div class="m2-app-title">${icon(app,true)}<div><h3>${esc(app.name)}</h3><p class="m2-small-text m2-muted">${esc(app.location)}</p></div></div><p>${app.independent?'实际连接后，在 OpenDesk 中打开此工具。它可以独立处理内容。':'请打开希望使用工具的目标网页，再从该页的 OpenDesk 侧边栏进入此工具。'}</p><p class="m2-callout">${esc(app.notice)}</p>`,button('返回应用','dialog-cancel',{},'m2-primary'),{kind:'use'});}
      function uninstallDialog(app){openDialog('卸载'+app.name,'这里只操作本次演示的数据',`<p>卸载会删除对应工具的数据空间与应用许可。</p><p class="m2-callout m2-warning">${app.id==='quick-notes'?'网页笔记的内容会随工具数据一起删除，请先保存需要保留的笔记。':'请先保存此应用中需要保留的内容。'}已导出的文件不受影响。</p>`,button('取消','dialog-cancel')+button('确认卸载演示应用','uninstall-confirm',{id:app.id},'m2-danger'),{kind:'uninstall'});}
      root.addEventListener('click',event=>{
        const anchor=event.target.closest('a[href^="#/"]');
        if(anchor&&root.contains(anchor)){if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();if(dialog.open)closeDialog('route');go(anchor.getAttribute('href').slice(1));return;}
        const trigger=event.target.closest('button');if(!trigger||!root.contains(trigger)||trigger.disabled)return;
        const action=trigger.dataset.action;const app=trigger.dataset.id?catalog[trigger.dataset.id]:null;
        if(action==='dialog-cancel'){closeDialog('cancel');return;}

        if(action==='deployment-help'){deploymentHelp();return;}
        if(action==='installation-help'){installHelp();return;}
        if(action==='recovery-help'){openDialog('结果未知时先核对','连接状态不能代替安装回执',`<p class="m2-small-text">保留已经提交的事务与所选版本，通过原事务和真实安装记录核对结果。只有确认失败的项目才能重新尝试。</p><p class="m2-callout">已批准事务不会因来源页面关闭或未批准意图的短期凭据过期而丢失。这些持久恢复能力仍属于待实现合同。</p>`,button('知道了','dialog-cancel',{},'m2-primary'),{kind:'help'});return;}

        if(['media-select','media-prev','media-next'].includes(action)){stopPlayback();state.galleryIndex=action==='media-select'?Number(trigger.dataset.index):(state.galleryIndex+(action==='media-prev'?2:1))%3;updateGallery();return;}
        if(action==='media-play'){playGallery();return;}

        if(action==='copy-field'){copyField(trigger.dataset.field);return;}
        if(action==='share-collection'){const info=collectionInfo(trigger.dataset.id,Number(trigger.dataset.revision));if(info)shareDialog(null,info);return;}
        if(action==='export-collection'){const info=collectionInfo(trigger.dataset.id,Number(trigger.dataset.revision));if(info)exportJSON(collectionExport(info),'opendesk-prototype-collection-'+info.collection.id+'-r'+info.revision+'.json');return;}
        if(action==='single-confirm'&&app){const operation=state.single[app.id];if(operation?.phase!=='review')return;const fresh=itemPlan([asItem(app.id)])[0];if(fresh.status!=='ready'||fresh.releaseKey!==operation.plan.releaseKey||fresh.approvalKey!==operation.plan.approvalKey){delete state.single[app.id];showSingle(app);return;}operation.batch=review.advanceBatch(createPrototypeBatch([operation.plan]));operation.phase=operation.batch.items[0].status==='verifying'?'checking':operation.batch.items[0].status;showSingle(app);return;}
        if(action==='single-next'&&app){const operation=state.single[app.id];if(!operation?.batch||!['checking','installing','unknown','reconciling'].includes(operation.phase))return;operation.batch=advancePrototypeStep(operation.batch);const result=operation.batch.items[0];operation.phase=result.status==='verifying'?'checking':result.status;if(result.status==='success'){addInstalled(result);q('#m2-installed-count').textContent=Object.keys(state.installed).length;}showSingle(app);return;}
        if(action==='go-my-apps'){closeDialog('route');go('/my-apps');return;}
        if(action==='use'&&app){useHelp(app);return;}
        if(action==='pause'&&app&&state.installed[app.id]){state.installed[app.id].paused=!state.installed[app.id].paused;toast(app.name+(state.installed[app.id].paused?'已在演示中暂停，数据与许可保留。':'已在演示中恢复，已有许可保持不变。'));return;}
        if(action==='uninstall'&&app){uninstallDialog(app);return;}
        if(action==='uninstall-confirm'&&app){delete state.installed[app.id];state.selected.delete(app.id);state.exportSelection.delete(app.id);delete state.single[app.id];if(app.id==='quick-notes')state.noteText='';closeDialog('route');toast(app.name+'的本次演示安装、数据与许可已清除。');return;}
        if(action==='new-collection'){state.builder={title:'我的应用套装',description:'',selected:new Set(),optional:new Set(),editingId:null};go('/collections/new');return;}
        if(action==='collection-from-selected'){if(!state.selected.size){toast('先选择至少一个已安装应用，再创建套装。');return;}state.builder={title:'我的常用应用',description:'',selected:new Set(state.selected),optional:new Set(state.selected),editingId:null};go('/collections/new');return;}
        if(action==='edit-collection'){const info=collectionInfo(trigger.dataset.id,Number(trigger.dataset.revision));if(!info)return;state.builder={title:info.collection.title+(info.collection.custom?'':' · 我的版本'),description:info.collection.description,selected:new Set(info.items.map(item=>item.appId)),optional:new Set(info.items.filter(item=>item.optional).map(item=>item.appId)),editingId:info.collection.custom?info.collection.id:null};go('/collections/new');return;}

        if(action==='batch-confirm'){const info=collectionInfo(trigger.dataset.id,Number(trigger.dataset.revision));if(info){beginCollection(info);rememberBatch();renderRoute(false);}return;}
        if(action==='batch-next'&&state.batch){const before=state.batch;state.batch=advancePrototypeStep(before);const registry=state.batch.scope==='review'?state.reviewInstalled:state.installed;state.batch.items.forEach((item,index)=>{if(item.status==='success'&&before.items[index]?.status!=='success')addInstalled(item,registry);});rememberBatch();renderRoute(false);return;}
        if(action==='batch-cancel'&&state.batch){state.batch=review.cancelBatch(state.batch);rememberBatch();renderRoute(false);return;}
        if(action==='batch-retry'&&state.batch){const registry=state.batch.scope==='review'?state.reviewInstalled:state.installed;const rechecks=Object.fromEntries(state.batch.items.map(item=>[item.appId,review.itemDisposition(item,catalog,registry,[...state.approvedVersions],{mode:'prototype'})]));state.batch=review.retryFailures(state.batch,{rechecks,clearInjectedFailures:true});rememberBatch();renderRoute(false);return;}
        if(action==='transfer-mode'){state.transferMode=trigger.dataset.mode;renderRoute(false);return;}
        if(action==='load-transfer-example'){state.transferMode='restore';prepareTransfer(JSON.stringify(sampleTransfer(),null,2));renderRoute(false);return;}
        if(action==='preflight-transfer'){prepareTransfer(q('#m2-transfer-text')?.value||state.transferText);renderRoute(false);return;}
        if(action==='restore-review'){showRestoreConfirm();return;}
        if(action==='restore-confirm'){beginRestore();return;}
        if(action==='version-review'){versionDialog(trigger.dataset.id);return;}
        if(action==='approve-version'){const item=state.transferParsed?.apps.find(entry=>entry.appId===trigger.dataset.id);if(item){state.approvedVersions.add(review.approvalKey(item,catalog,restoreRegistry()));state.transferSelection.add(item.appId);}closeDialog('route');renderRoute(false);return;}
        if(action==='export-transfer'){const selected=[...state.exportSelection].filter(id=>state.installed[id]);if(!selected.length){toast('请选择至少一个本次演示安装的应用。');return;}const data={schemaVersion:1,kind:'opendesk-app-transfer',apps:selected.map(id=>({owner:'opendesk',appId:id,version:state.installed[id].version,preferences:{}}))};review.parseTransfer(JSON.stringify(data));exportJSON(data,'opendesk-prototype-app-transfer.json');return;}
        if(action==='start-review-batch'){
          const scenario=trigger.dataset.scenario;state.reviewActive=scenario;state.reviewInstalled={};addInstalled(asItem('quick-notes'),state.reviewInstalled);
          const plan=itemPlan(apps.map(app=>asItem(app.id)),state.reviewInstalled);state.batch=createPrototypeBatch(plan,state.reviewInstalled,{scope:'review',failIds:scenario==='partial-failure'?['web-markdown-clipper']:[]});state.batchContext={source:'review',key:scenario};rememberBatch();renderRoute(false);return;
        }
        if(action==='seed-installed'){['reading-toc','quick-notes','web-markdown-clipper'].forEach(id=>{if(!state.installed[id])addInstalled(asItem(id));});state.selected=new Set(['reading-toc','quick-notes','web-markdown-clipper']);go('/my-apps');return;}
      });
      root.addEventListener('compositionstart',event=>{if(event.target.id==='m2-search')state.composing=true;});
      root.addEventListener('compositionend',event=>{if(event.target.id==='m2-search'){state.composing=false;state.catalogQuery=event.target.value;renderCatalogResults();}});
      root.addEventListener('input',event=>{
        const element=event.target;
        if(element.id==='m2-search'){state.catalogQuery=element.value;if(!state.composing&&!event.isComposing)renderCatalogResults();}
        if(element.id==='m2-note-demo')state.noteText=element.value;
        if(element.id==='m2-builder-title'){state.builder.title=element.value;q('#m2-builder-preview-title').textContent=element.value||'未命名套装';}
        if(element.id==='m2-builder-description')state.builder.description=element.value;
        if(element.id==='m2-transfer-text'){state.transferText=element.value;state.transferParsed=null;state.transferError='';if(q('#m2-preflight-panel'))q('#m2-preflight-panel').innerHTML='';}
      });
      root.addEventListener('change',async event=>{
        const element=event.target;
        if(element.id==='m2-category'){state.catalogCategory=element.value;renderCatalogResults();return;}
        if(element.id==='m2-scope'){state.catalogScope=element.value;renderCatalogResults();return;}
        if(element.dataset.bundleItem){const key=collectionKey(element.dataset.collection,Number(element.dataset.revision));const selected=state.bundleSelections[key];if(element.checked)selected.add(element.dataset.bundleItem);else selected.delete(element.dataset.bundleItem);renderRoute(false);return;}
        if(element.dataset.builderItem){const id=element.dataset.builderItem;if(element.checked)state.builder.selected.add(id);else{state.builder.selected.delete(id);state.builder.optional.delete(id);}renderRoute(false);return;}
        if(element.dataset.builderOptional){if(element.checked)state.builder.optional.add(element.dataset.builderOptional);else state.builder.optional.delete(element.dataset.builderOptional);return;}
        if(element.dataset.myItem){if(element.checked)state.selected.add(element.dataset.myItem);else state.selected.delete(element.dataset.myItem);renderRoute(false);return;}
        if(element.id==='m2-select-all'){state.selected=element.checked?new Set(Object.keys(state.installed)):new Set();renderRoute(false);return;}
        if(element.dataset.exportItem){if(element.checked)state.exportSelection.add(element.dataset.exportItem);else state.exportSelection.delete(element.dataset.exportItem);return;}
        if(element.dataset.restoreItem){if(element.checked)state.transferSelection.add(element.dataset.restoreItem);else state.transferSelection.delete(element.dataset.restoreItem);renderRoute(false);return;}
        if(element.id==='m2-transfer-file'){
          const file=element.files?.[0];if(!file)return;
          if(file.size>65536){state.transferError='清单超过 64 KB，请缩小后重试。';state.transferParsed=null;renderRoute(false);return;}
          try{state.transferText=await file.text();state.transferParsed=null;state.transferError='';renderRoute(false);}catch(_){state.transferError='无法读取所选文件，请重新选择。';renderRoute(false);}
        }
      });
      q('#m2-dialog-close').addEventListener('click',()=>closeDialog('cancel'));
      dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog('cancel');});
      dialog.addEventListener('click',event=>{if(event.target===dialog){const box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)closeDialog('cancel');}});
      window.addEventListener('hashchange',()=>renderRoute(true));
      document.addEventListener('visibilitychange',()=>{if(document.hidden){stopPlayback();updateGallery();}});
      motionQuery.addEventListener?.('change',()=>{if(motionQuery.matches){stopPlayback();updateGallery();}});
      renderRoute(true);
    })();
  </script>
</div>
