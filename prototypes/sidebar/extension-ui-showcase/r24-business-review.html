if(cmd==='newPrompt'){st.promptId=null;st.promptDraft={body:'',label:'',name:''};openPage('promptEdit','#promptBody');return}if(cmd==='editPrompt'){st.promptId=Number(arg);st.promptDraft={...st.promptItems.find(p=>p.id===st.promptId)};openPage('promptEdit','#promptBody');return}if(cmd==='savePrompt'){const d=st.promptDraft;if(!d?.body?.trim()||new TextEncoder().encode(d.body).length>8192){setNotice('正文必填且不能超过 8192 B。','error');render();return}if(!maybeOutcome())return;if(st.promptId){st.promptItems=st.promptItems.map(p=>p.id===st.promptId?{...p,...d,label:d.label||p.label}:p)}else{st.promptItems.unshift({...d,id:Date.now(),label:d.label||[...d.body.trim()].slice(0,2).join('')})}goBack(true);setNotice('已保存到审阅页面内存。未调用正式 storage.set。');render();return}if(cmd==='usePrompt'){const p=st.promptItems.find(p=>p.id===Number(arg));setNotice('已选中「'+p.body.slice(0,14)+'…」，仅展示使用动作；未填入 AI 网站输入框。');render();return}if(cmd==='promptCopy'){setNotice('演示内容已准备；未写入操作系统剪贴板。');st.menu=null;render();return}if(cmd==='deletePrompt'){st.promptId=Number(arg);openDialog('删除提示词？','仅删除本预览中的示例条目，正式提示词数据不变。','deletePrompt','删除演示条目');return}if(cmd==='promptImport'){st.importText='';st.importContents=null;openPage('promptImport');return}if(cmd==='promptExport'){st.menu=null;setNotice('演示导出仅展示入口；没有下载真实提示词备份。');render();return}
if(cmd==='toggleFolder'){st.bookFolderOpen=!st.bookFolderOpen;render();return}if(cmd==='bookDetail'){st.bookId=Number(arg);st.bookWideDetail=true;if(st.width/st.scale>=740){st.page='root';st.menu=null;render();}else openPage('bookDetail');return}if(cmd==='closeWideBook'){st.bookWideDetail=false;render();return}if(cmd==='newBookmark'){st.bookId=null;st.bookDraft={name:'',url:''};openPage('bookEdit','#bookName');return}if(cmd==='editBook'){st.bookId=Number(arg);st.bookDraft={...st.bookItems.find(b=>b.id===st.bookId)};openPage('bookEdit','#bookName');return}if(cmd==='saveBook'){const d=st.bookDraft;if(!d.name.trim()||!/^https?:\/\//.test(d.url)){setNotice('名称必填；网址必须以 http:// 或 https:// 开头。','error');render();return}if(!maybeOutcome())return;if(st.bookId)st.bookItems=st.bookItems.map(b=>b.id===st.bookId?{...b,...d}:b);else st.bookItems.unshift({...d,id:Date.now(),folder:'产品资料'});goBack(true);setNotice('仅更新审阅列表内存。');render();return}if(cmd==='deleteBook'){st.bookId=Number(arg);openDialog('删除书签？','删除操作只影响这份虚拟示例，不会访问浏览器书签。','deleteBook','删除演示书签');return}
if(cmd==='cookieMode'){st.cookieMode=arg;render();return}if(cmd==='cookieFilter'){st.cookieFilter=arg;render();return}if(cmd==='newCookie'){st.cookieId=null;st.cookieDraft={name:'',value:'',path:'/'};openPage('cookieEdit','#cookieName');return}if(cmd==='editCookie'){st.cookieId=Number(arg);st.cookieDraft={...st.cookieItems.find(c=>c.id===st.cookieId)};openPage('cookieEdit','#cookieName');return}if(cmd==='saveCookie'){const d=st.cookieDraft;if(!d?.name.trim()||!d?.path.startsWith('/')){setNotice('Cookie 名称必填，Path 必须以 / 开头。','error');render();return}if(!maybeOutcome())return;if(st.cookieId)st.cookieItems=st.cookieItems.map(c=>c.id===st.cookieId?{...c,...d}:c);else st.cookieItems.unshift({...d,id:Date.now(),domain:'demo.example',type:'SameSite=Lax'});goBack(true);setNotice('示例 Cookie 内存已更新；真实浏览器 Cookie 未改变。');render();return}if(cmd==='deleteCookie'){st.cookieId=Number(arg);openDialog('删除 Cookie？','示例记录将被删除；真实 Cookie 和敏感值未访问。','deleteCookie','删除演示 Cookie');return}if(cmd==='cookieImport'){st.importContents=null;st.importText='';openPage('cookieImport');return}if(cmd==='cookieExport'){openPage('cookieExport');return}if(cmd==='cookieExportDone'||cmd==='cookiePrepareCopy'){setNotice('仅完成示例数据导出预览；未下载文件或修改剪贴板。');st.menu=null;render();return}
if(cmd==='localeAdvanced'){openPage('localeAdvanced');return}if(cmd==='localeImport'){st.importText='';st.importContents=null;openPage('localeImport');return}if(cmd==='localeExport'){setNotice('语言资源清单演示，不导出正式语言包。');render();return}if(cmd==='localeDelete'){openDialog('删除语言包？','仅清理虚拟导入状态，不删除真实翻译资源。','localeDelete','确认演示删除');return}
if(cmd==='verifyImport'){try{const obj=JSON.parse(st.importText||'');st.importContents={valid:true,title:Array.isArray(obj)?`数组 ${obj.length} 项`:`对象 ${Object.keys(obj).length} 个字段`,kind:'JSON'};setNotice('JSON 语法已验证；未验证真实业务 Schema。')}catch(e){st.importContents={valid:false,title:'无法解析 JSON'};setNotice('JSON 无法解析，请修改后再预览。','error')}render();return}
if(cmd==='readBack'){st.uncertain=false;st.outcome='ok';$('#saveOutcome').value='ok';setNotice('模拟读回完成：未发现已保存副本，允许人工决定是否再次保存；没有访问真实数据。');render();return}
if(cmd==='modalCancel'){st.dialog=null;const f=st.modalReturnFocus;render({focus:f||'[data-act=back]'});return}
if(cmd==='modalConfirm'){const kind=st.dialog?.kind;st.dialog=null;if(kind==='deleteExt'){st.extInstalled[st.extensionId]=false;goBack(true);setNotice('仅从本地示例列表移除。');render();return}if(kind==='revokeExt'){st.revokeMock=true;setNotice('仅修改示例权限状态。');render();return}if(kind==='deletePrompt')st.promptItems=st.promptItems.filter(p=>p.id!==st.promptId);if(kind==='deleteBook'){st.bookItems=st.bookItems.filter(b=>b.id!==st.bookId);st.page='root'}if(kind==='deleteCookie'){st.cookieItems=st.cookieItems.filter(c=>c.id!==st.cookieId);st.page='root'}if(kind==='localeDelete')st.importContents=null;if(kind==='newDev'){st.code='';st.devTouched=false;st.devResult='新草稿（仅内存）。'}st.menu=null;setNotice('演示记录已更新，真实数据不变。');render();return}
}
function bindFrom(el){const key=el.dataset.bind,d=el.dataset.draft;if(key){if(key==='code')st.devTouched=true;if(key==='count'){st.count=Math.max(1,Math.min(100,Number(el.value)||1))}else st[key]=el.value;return ['promptSearch','bookSearch','cookieSearch','extSearch','demoSearch','demoText','count','globalLocale','toolLocale','localeTool'].includes(key)?'render': 'none'}if(d){const [owner,field]=d.split(':');const target=owner==='prompt'?st.promptDraft:owner==='book'?st.bookDraft:st.cookieDraft;if(target)target[field]=el.value;return owner==='prompt'&&field==='body'?'render':'none'}return 'none'}
function preserveInput(el){let start=null,end=null;try{start=el.selectionStart;end=el.selectionEnd}catch{}return()=>{const newEl=document.getElementById(el.id);if(newEl){newEl.focus({preventScroll:true});try{if(start!=null)newEl.setSelectionRange(start,end)}catch{}}}}
let composing=false;
document.addEventListener('compositionstart',e=>{if(e.target.closest('#screen'))composing=true});document.addEventListener('compositionend',e=>{if(!e.target.closest('#screen'))return;composing=false;const restore=preserveInput(e.target);const act=bindFrom(e.target);if(act==='render'){render();queueMicrotask(restore)}});
document.addEventListener('input',e=>{if(composing||!e.target.closest('#screen'))return;const restore=preserveInput(e.target);const act=bindFrom(e.target);if(act==='render'){render();queueMicrotask(restore)}});
document.addEventListener('change',async e=>{const el=e.target;if(el.closest('.review-controls'))return;if(el.closest('#screen')){if(el.dataset.bind){bindFrom(el);render();return}if(el.type==='file'&&el.files?.[0]){const file=el.files[0];st.importFile=file.name;if(file.size>1024*1024){st.importContents={valid:false,title:'文件超出 1 MiB 演示限制'};setNotice('请选择小于 1 MiB 的 JSON 文件。','error')}else{try{const obj=JSON.parse(await file.text());st.importContents={valid:true,title:Array.isArray(obj)?`数组 ${obj.length} 项`:(obj.title||obj.name||'JSON 对象'),kind:'本地 JSON（只读）'};st.importText=JSON.stringify(obj,null,2).slice(0,8000);setNotice('已在内存中读取并解析 JSON；未安装或写入。')}catch{st.importContents={valid:false,title:'文件不是有效 JSON'};setNotice('JSON 解析失败。','error')}}render();return}}});
document.addEventListener('click',e=>{const scene=e.target.closest('[data-scene]');if(scene){st.scene=scene.dataset.scene;st.page='root';st.route=[];st.menu=null;st.guard=false;st.dialog=null;st.notice='';st.uncertain=false;render({retainScroll:false});return}const b=e.target.closest('[data-act]');if(b){if(st.dialog&& !b.closest('#modalRoot'))return;if(st.dialog&&b.dataset.act==='modalCancel'){navigateAction('modalCancel');return}if(st.dialog&&b.dataset.act==='modalConfirm'){navigateAction('modalConfirm');return}st.openedFrom=`[data-act="${b.dataset.act}"]`;st.modalReturnFocus=st.dialog?st.modalReturnFocus:st.openedFrom;navigateAction(b.dataset.act);return}if(st.menu&&!e.target.closest('.menu-pop')&&!e.target.closest('.menu-scope')){st.menu=null;render();}});
function focusTrap(e,root){const els=[...root.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')];if(!els.length)return;if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(st.dialog){e.preventDefault();navigateAction('modalCancel');return}if(st.menu){const k=st.menu;st.menu=null;render({focus:`[data-act="menu:${k}"]`});e.preventDefault();return}if(st.page!=='root'){e.preventDefault();goBack();return}}if(e.key==='Tab'&&st.dialog){focusTrap(e,$('.modal-dialog'));return}if(st.menu&&(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Home'||e.key==='End')){const els=[...document.querySelectorAll('.menu-pop button')];let cur=els.indexOf(document.activeElement);if(els.length){e.preventDefault();cur=e.key==='Home'?0:e.key==='End'?els.length-1:e.key==='ArrowDown'?(cur+1+els.length)%els.length:(cur-1+els.length)%els.length;els[cur].focus()}}});
$('#viewWidth').addEventListener('change',e=>{st.width=Number(e.target.value);render({retainScroll:false})});$('#viewTheme').addEventListener('change',e=>{st.theme=e.target.value;render()});$('#viewScale').addEventListener('change',e=>{st.scale=Number(e.target.value);render({retainScroll:false})});$('#viewLong').addEventListener('change',e=>{st.long=e.target.checked;render()});$('#saveOutcome').addEventListener('change',e=>{st.outcome=e.target.value;setNotice('下次写入将模拟：'+({ok:'成功（仅内存）',fail:'失败，保留草稿',unknown:'结果未知，需先读回'}[st.outcome]));render()});
