  --od-dark-sub:#b3c1d3;
  --od-dark-line:#374457;
  --od-dark-brand:#3566ba;
  --od-dark-paper:#151c28;
  --od-dark-bg:#101722;
  --od-dark-input-border:#6d809b;
  --od-dark-accent-ink:#9dc1ff;

/* R20/R23 Sidebar primitives and page base; semantic values are in design-tokens.css.

.hint,aside{font-size:var(--od-note-size);color:var(--od-sub)}

#workflow-provider-settings:not([open]){display:none}
#workflow-provider-settings>summary{display:none}
/* R23.11: the approved history is a dedicated React view, not the advanced manager. */
.workflow-history-react-host{display:contents}
.workflow-history-panel{flex:1;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:22px;padding:14px 2px 18px}
.workflow-history-panel[hidden]{display:none!important}
.workflow-editor[data-history-open="true"] .workflow-scroll,
.workflow-editor[data-history-open="true"] .workflow-composer{display:none!important}
.workflow-history-section{min-width:0;display:grid;align-content:start;gap:9px}
.workflow-history-section h3{font-size:13px;font-weight:700;line-height:1.4;color:var(--od-ink);margin:0}
.workflow-history-list{display:grid;gap:8px;min-width:0}
.workflow-history-row{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;min-width:0;min-height:56px;padding:11px 12px;text-align:left;border:1px solid var(--od-line);border-radius:var(--radius-surface);background:var(--od-paper);color:var(--od-ink);cursor:pointer}
.workflow-history-row:hover{border-color:var(--od-brand);background:var(--od-muted)}
.workflow-history-row:focus-visible{outline:2px solid var(--od-focus);outline-offset:2px}
.workflow-history-row:disabled{opacity:.55;cursor:wait}
.workflow-history-row-title{display:block;max-width:100%;font-size:12px;font-weight:650;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.workflow-history-row small{font-size:11px;color:var(--od-sub);line-height:1.5}
.workflow-history-empty{margin:0;padding:14px 12px;border:1px dashed var(--od-line);border-radius:var(--radius-surface);font-size:12px;line-height:1.5;color:var(--od-sub);background:var(--od-paper)}
.workflow-step-tools{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.workflow-step-tools .workflow-icon-button{width:34px;height:34px}
.workflow-composer-actions #workflow-provider-toggle{width:34px;height:34px;flex:none}
.workflow-source-react-host{display:flex;align-items:center;min-width:0;flex:1 1 auto;overflow:hidden}
.workflow-source-name{display:block;min-width:0;max-width:100%;font-size:11.5px;font-weight:600;line-height:1.35;color:var(--od-sub);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.workflow-composer-actions .workflow-send-button{margin-left:auto}
.workflow-sheet-content,.workflow-sheet-content .workflow-provider,
.workflow-sheet-content .workflow-provider>*{min-width:0;max-width:100%}
.workflow-sheet-content .workflow-provider input:not([type=checkbox]),
.workflow-sheet-content .workflow-provider select{min-width:0;width:100%;max-width:100%}
.workflow-sheet-content #workflow-ai-provider{background:var(--od-muted);border-radius:var(--radius-control);font-weight:650}
.workflow-source-switch{display:flex;align-items:stretch;gap:4px;padding:4px;min-width:0;border:1px solid var(--od-line);border-radius:11px;background:var(--od-muted)}
.workflow-source-switch button{flex:1 1 0;min-width:0;min-height:38px;padding:6px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--od-sub);font-family:inherit;font-weight:600;font-size:12px;line-height:1.4;cursor:pointer}
.workflow-source-switch button[aria-pressed="true"]{background:var(--od-paper);color:var(--od-ink);border-color:var(--od-line);box-shadow:0 1px 3px #1a2e500c}
.workflow-source-switch button:focus-visible{outline:2px solid var(--od-focus);outline-offset:2px}
.workflow-https-mode{display:grid;gap:6px;margin-top:var(--space-3);min-width:0}
.workflow-https-mode[hidden]{display:none!important}
.workflow-https-mode .od-field{width:100%;min-width:0}

.workflow-sheet-panel{width:min(100%,520px)}
@media(max-width:360px){.workflow-history-panel{padding:10px 0 14px;gap:16px}.workflow-history-row{padding:10px}}

/* R23.10: one React Portal overlays the existing workflow without remounting
 * provider inputs or adding a new scroll/theme system. Uses shared tokens. */
.workflow-sheet-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:flex-end;justify-content:center;min-width:0;overflow:hidden}
.workflow-sheet-overlay[hidden]{display:none!important}
.workflow-sheet-backdrop{position:absolute;inset:0;background:color-mix(in srgb,var(--od-ink) 40%,transparent)}
.workflow-sheet-panel{position:relative;display:flex;flex-direction:column;min-width:0;width:100%;max-height:min(72dvh,560px);background:var(--od-paper);color:var(--od-ink);border:1px solid var(--od-line);border-radius:var(--radius-surface) var(--radius-surface) 0 0;box-shadow:0 -10px 32px color-mix(in srgb,var(--od-ink) 16%,transparent);outline:none}
.workflow-sheet-heading{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--od-line);flex:none}
.workflow-sheet-heading h3{margin:0;color:var(--od-ink);font-size:var(--od-body-size);font-weight:700}
.workflow-sheet-content{min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:var(--space-3);flex:1}
.workflow-sheet-content .workflow-provider{max-height:none;overflow:visible;padding-right:0;margin:0}
.workflow-sheet-content .workflow-connection-line{padding:var(--space-2) var(--space-3);border:1px solid var(--od-line);border-radius:var(--radius-surface);background:var(--od-muted)}
.workflow-sheet-content .workflow-provider-info,.workflow-sheet-content .workflow-provider-diagnostics{margin-top:var(--space-3)}
@media(max-width:360px){.workflow-sheet-panel{max-height:min(78dvh,520px)}.workflow-sheet-content{padding:var(--space-3)}}
@media(prefers-reduced-motion:reduce){.workflow-sheet-panel,.workflow-sheet-overlay{animation:none!important;transition:none!important}}

.workflow-provider label{margin:var(--space-2) 0 var(--space-1)}
.workflow-provider input:not([type=checkbox]){min-height:36px}
.workflow-minor-note{font-size:var(--od-note-size);color:var(--od-sub);line-height:1.55;margin:var(--space-2) 0 0}
.workflow-steps{display:grid;gap:var(--space-2);max-height:min(42vh,430px);min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}

.workflow-step-body{min-width:0}
.workflow-field span{display:block;overflow-wrap:anywhere}
.workflow-field{display:block;margin:var(--space-2) 0}
.workflow-field input,.workflow-field select,.workflow-field textarea{margin-top:var(--space-1)}
.workflow-actions,.workflow-step-actions{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2)}
.workflow-actions button,.workflow-step-actions button,.workflow-secondary,.workflow-add,.workflow-advanced button,.workflow-proposal button:not(.workflow-primary){font-size:12px;min-height:34px;padding:var(--space-1) var(--space-2)}
.workflow-step-actions button:last-child{color:var(--od-negative)}
.workflow-add{display:block;margin:var(--space-2) 0 0 auto;width:auto}
.workflow-run-settings .workflow-param-row{display:flex;align-items:end;gap:6px}
.workflow-param-row>.workflow-field{flex:1 1 0;min-width:0}
.workflow-param-row>button{flex:none;margin-bottom:var(--space-2)}
.workflow-result pre{max-height:220px}
.workflow-management{display:grid;gap:var(--space-2);min-width:0;background:var(--od-muted);padding:var(--space-3)}
.workflow-management>.workflow-section-header{margin-bottom:0}
.workflow-library .workflow-actions button:not(.workflow-icon-button){flex:0 0 auto}
.workflow-manage-details[open] .workflow-icon-button{flex:none}
.workflow-manage-details{margin:0}


.workflow-param-create{display:flex;gap:var(--space-2);align-items:stretch;margin-top:var(--space-2);min-width:0}
.workflow-param-create input{flex:1 1 0;width:auto;min-width:0}
.workflow-param-create button{flex:0 1 auto;min-width:100px}
.workflow-status{flex:none;font-size:var(--od-note-size);line-height:1.55;background:var(--od-muted);color:var(--od-ink);border-radius:var(--radius-control);padding:var(--space-2) var(--space-3);margin:0 0 var(--space-2)}
.workflow-status[data-state=error]{background:var(--od-negative-bg);color:var(--od-negative)}
#workflow-dock .dock-buttons{flex-wrap:wrap}
#workflow-dock #workflow-run{flex:0 0 auto}
#workflow-dock #workflow-save{flex:0 0 auto}
#workflow-dock #workflow-stop{flex:0 0 auto}
/* No disabled Run/Save footer on the initial empty AI conversation. */
#workspace-dock:has(> #workflow-dock:not([hidden])[data-empty="true"]):not([data-stop-only="true"]){display:none}
@media(max-width:360px){
  .workflow-head{gap:var(--space-2)}
  .workflow-head-actions{gap:var(--space-2)}
  .workflow-pill{max-width:84px}
  .workflow-scroll{padding:6px 0 12px}
  .workflow-steps{max-height:38vh}
  .workflow-param-create{flex-wrap:wrap}
  .workflow-param-create button{flex:0 0 auto;margin-inline-start:auto}
}
@media(max-width:280px){
  .workflow-head{flex-wrap:wrap;row-gap:2px}
  .workflow-head-copy{flex:1 1 100%}
  .workflow-head-actions{margin-left:auto}
  .workflow-pill{max-width:78px}
}
@media(prefers-reduced-motion:reduce){.workflow-steps{scroll-behavior:auto}}

/* R16: model diagnostics stay in settings; live approvals stay beside the chat. */
.workflow-provider{max-height:min(52vh,350px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}
.workflow-provider select{font-size:12px;min-height:36px}
.workflow-provider-info,.workflow-provider-diagnostics{margin:5px 0 0}
.workflow-provider-info .workflow-minor-note{margin:5px 0 8px}
/* Connection is a one-way Native enable action, not an on/off switch. */
.workflow-connection-line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-2)}
.workflow-connection-copy{display:grid;gap:2px;min-width:0}
.workflow-connection-title{font-size:12px;line-height:1.35;font-weight:700;color:var(--od-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.workflow-connection-line .workflow-local-status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.workflow-connection-line #workflow-local-connect[hidden],.workflow-connection-line #workflow-local-connected[hidden]{display:none!important}
.workflow-connect-action{flex:none;min-width:64px;min-height:34px;border-radius:var(--radius-pill);padding:6px 13px;font-size:12px;font-weight:650}
.workflow-connect-action:disabled{opacity:.7}
.workflow-connection-connected{font-size:11px;font-weight:650;line-height:1.5;white-space:nowrap;color:var(--od-positive);padding:7px 10px;border:1px solid var(--od-line);border-radius:var(--radius-pill);background:var(--od-paper)}
.workflow-provider-diagnostics{margin-top:var(--space-1)!important}
.workflow-provider-diagnostics .workflow-minor-note{overflow-wrap:anywhere}
.workflow-provider-diagnostics .workflow-actions{justify-content:flex-end}
.workflow-provider .workflow-actions{gap:var(--space-2)}
.workflow-provider .workflow-actions button{flex:0 0 auto;min-height:34px;font-size:12px}
.workflow-local-status{font-size:11px;line-height:1.4;padding:0;border:0;background:transparent;color:var(--od-sub);margin:0}
.workflow-local-status[data-state=READY_FOR_TURN]{color:var(--od-positive)}
@media(max-width:280px){.workflow-connect-action{min-width:58px;padding-inline:9px}.workflow-connection-connected{padding-inline:7px}}
.workflow-session-actions{border-top:1px solid #e5ebf4;padding-top:8px}
.workflow-ai-progress{margin:8px 0;padding:0;list-style:none;display:grid;gap:5px}
.workflow-ai-progress li{position:relative;padding:5px 7px 5px 23px;background:#f4f7fc;border-radius:var(--radius-control);color:#526783;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.workflow-ai-progress li::before{content:'•';position:absolute;left:9px;color:#8394ac}
.workflow-ai-progress li[data-state=completed]::before{content:'✓';left:7px;color:#247758}
.workflow-ai-progress li[data-state=in_progress]{color:#315fb3;background:#eef4ff}
.workflow-ai-approval{margin:var(--space-2) 0}
.workflow-ai-approval p{font-size:var(--od-note-size);color:inherit;line-height:1.55}
.workflow-ai-approval .workflow-actions{align-items:center}
.workflow-ai-approval button{flex:0 0 auto;min-height:34px}
.workflow-ai-approval #workflow-ai-approve{background:var(--od-brand);color:var(--od-on-brand);border-color:var(--od-brand)}
.workflow-run-review{margin:var(--space-2) 0;padding:var(--space-3);border:1px solid var(--od-warning-border);border-radius:var(--radius-control);background:var(--od-warning-bg);color:var(--od-warning-ink);min-width:0}
.workflow-run-review[hidden]{display:none!important}
.workflow-run-review p{margin:0;font-size:var(--od-note-size);line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}
.workflow-run-review .workflow-actions{margin-top:var(--space-2)}
.workflow-run-review button{min-height:34px}
@media(max-width:280px){.workflow-provider{max-height:45vh}.workflow-ai-approval button{flex-basis:100%}}

/* Compact optional official catalog entries and trusted site controls. */
.sidebar-tool-official{display:flex;align-items:center;gap:7px;padding:9px 10px;margin:0 0 8px;background:#fff;border:1px solid #e1e8f1;border-radius:var(--radius-surface);font-size:12px;color:#3c506c}
.sidebar-tool-official[hidden]{display:none}
.sidebar-tool-official strong{font-size:12px;color:#253b5a}
.sidebar-tool-official span{flex:1;min-width:0;color:#65768e;font-size:11px}
[data-official-install]{min-height:34px;padding:4px 9px;color:#3157b1;border:1px solid #d8e3ff;border-radius:var(--radius-control);background:#f1f5ff;font-size:12px}
.sidebar-tool-site{border-color:transparent;background:transparent;color:#73839b;font-size:17px}
.sidebar-tool-site[data-enabled=true]{color:#3157b1;background:#eef2ff}
.sidebar-tool-site:hover:not(:disabled){border-color:#d8e3ff;background:#f2f6ff}
.sidebar-tool-site:disabled{opacity:.4;cursor:default}
.sidebar-tool-row:has(> .sidebar-tool-site-panel){flex-wrap:wrap}
.sidebar-tool-site-manage{flex:none;width:30px;min-height:34px;padding:0;border:1px solid transparent;border-radius:var(--radius-control);background:transparent;color:#6c7890;font-size:19px;line-height:1}
.sidebar-tool-site-manage:hover,.sidebar-tool-site-manage[aria-expanded=true]{background:#eef3ff;color:#365dba;border-color:#dce5fa}
.sidebar-tool-settings{flex:none;width:30px;min-height:34px;display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:var(--radius-control);background:transparent;color:#647894}
.sidebar-tool-settings svg{display:block;width:17px;height:17px;pointer-events:none}
.sidebar-tool-settings:hover,.sidebar-tool-settings[aria-expanded=true]{background:#eef3ff;color:#365dba;border-color:#dce5fa}
.sidebar-toc-settings-panel{max-height:min(62dvh,400px)}
.sidebar-toc-settings-title{display:block;font-size:12px;margin:4px 0 6px;color:#2d4566}
.sidebar-toc-settings-hint{margin:4px 0 9px;line-height:1.5;color:#697a91}
.sidebar-toc-settings-row{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:7px 0;min-height:31px}
.sidebar-toc-settings-row>span{min-width:0;flex:1}
.sidebar-toc-visibility-toggle{flex:none;min-height:34px;min-width:52px;padding:4px 9px;border:1px solid #d9e3f2;background:#fff;border-radius:var(--radius-control);font-size:11px;color:#536982;cursor:pointer}
.sidebar-toc-visibility-toggle[aria-pressed=true]{border-color:#b9c9ef;background:#edf2ff;color:#3157b1;font-weight:700}
.sidebar-toc-visibility-toggle:disabled{opacity:.5;cursor:not-allowed}
.sidebar-toc-visibility-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sidebar-tool-site-panel{flex:0 0 100%;order:10;min-width:0;max-height:180px;overflow-y:auto;overscroll-behavior:contain;padding:6px 9px 8px;border-top:1px solid var(--line);background:var(--surface-subtle,#f7f9fd);color:var(--text-secondary,#59697f);font-size:11px;line-height:1.5}
.sidebar-tool-site-panel[hidden]{display:none!important}
.sidebar-tool-site-entry{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:34px;min-width:0}
.sidebar-tool-site-entry>span{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.sidebar-tool-site-revoke{flex:0 0 auto;min-height:34px;padding:3px 7px;border:1px solid transparent;border-radius:var(--radius-control);background:transparent;color:#a04450;font-size:11px}
.sidebar-tool-site-revoke:hover:not(:disabled){background:#fff0f1;border-color:#ead8dd}
.sidebar-tool-site-revoke:focus-visible,.sidebar-tool-site-manage:focus-visible,.sidebar-tool-settings:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Full tab and Side Panel share the installed tool host, not its authority. */
.sidebar-tool-list-tab{margin-right:var(--space-1);border-color:transparent;background:transparent;color:#44669d;font-size:17px;line-height:1}
.sidebar-tool-list-tab:hover:not(:disabled){background:#eef3ff;border-color:#d4e2fa}
#sidebar-tool-open-tab{background:#f5f8ff;color:#345dac;border-color:#dce5f6}
[data-opendesk-surface=tool-page] #workspace-content{max-width:1200px;padding:20px clamp(12px,3vw,30px)}
[data-opendesk-surface=tool-page] .sidebar-tool-list{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
[data-opendesk-surface=tool-page] .sidebar-tool-iframe{height:calc(100vh - 160px);min-height:400px;max-height:none}
@media(max-width:600px){[data-opendesk-surface=tool-page] #workspace-content{padding:12px}}

/* R18: shared accessible icon actions. Hover uses title; focus exposes label. */
.sidebar-tool-icon-action{color:var(--od-sub)}
.sidebar-tool-list-remove svg,.sidebar-tool-item-open-icon svg{display:block;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidebar-tool-icon-action:hover:not(:disabled){background:var(--od-muted)}
#sidebar-tool-remove:hover:not(:disabled),.sidebar-tool-list-remove:hover:not(:disabled){background:#fff1f2}
.sidebar-tool-icon-action:focus-visible::after,.sidebar-tool-list-remove:focus-visible::after,.sidebar-tool-site:focus-visible::after,.sidebar-tool-settings:focus-visible::after,.sidebar-tool-list-tab:focus-visible::after{content:attr(aria-label);position:absolute;bottom:calc(100% + 5px);right:0;z-index:12;max-width:min(160px,calc(100vw - 24px));padding:4px 7px;background:#253951;color:#fff;font-size:11px;font-weight:500;line-height:1.45;white-space:normal;overflow-wrap:anywhere;text-align:left;border-radius:5px;box-shadow:0 2px 8px #15284a24;pointer-events:none}
/* The first toolbar action sits at the scroll container's top edge. Keep its
 * keyboard label below the button, sized by its text instead of the icon. */
#sidebar-tool-back:focus-visible::after{left:0;right:auto;top:calc(100% + 5px);bottom:auto;width:max-content}

/* Uninstalled previews cannot inherit storage, site or Task authorities. */
.sidebar-tool-status[data-state=readonly]{background:#fff8e8;color:#7d5720;border:1px solid #f1dfb1}

/* R25.1: compact confirmation in the existing Developer source area. */
.local-install-review:not([hidden]){display:grid;gap:var(--space-2);min-width:0;padding:var(--space-3);margin:var(--space-2) 0}
.local-install-review>label{font-size:12px;font-weight:500}
.local-install-review>input{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.local-install-review>p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.local-install-review>.row{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:var(--space-2)}
.local-install-review>.row>button{flex:0 0 auto;min-height:34px;padding:var(--space-1) var(--space-3);font-size:12px}
#local-install-cancel,#installed-page-tools-list button{background:var(--od-muted);color:var(--od-ink);border:1px solid var(--od-input-border)}
#local-install-warning,#local-install-status[data-state=unknown]{color:var(--od-warning)}
#local-install-status[data-state=error],#installed-page-tools-status[data-state=error]{color:var(--od-negative)}
#local-install-status[data-state=success],#installed-page-tools-status[data-state=success]{color:var(--od-positive)}
#local-install-status[data-state=pending]{color:var(--od-sub)}
#installed-page-tools-list strong{overflow-wrap:anywhere}
#sidebar-installed-page-tools{margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--od-line);min-width:0;gap:var(--space-2)}
#sidebar-installed-page-tools .sidebar-tools-head{margin:0}
#installed-page-tools-list>section{display:grid;gap:var(--space-2);min-width:0;margin:0;padding:var(--space-3)}
#installed-page-tools-list p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
#installed-page-tools-status{margin:0;font-size:12px;line-height:1.5}
.installed-page-tool-technical{margin:0;min-width:0}

.installed-page-tool-technical p{padding-top:var(--space-1);overflow-wrap:anywhere}

/* R4.9: no duplicate Tools sub-tabs; discovery expands below installed tools. */
#sidebar-tool-my-panel{display:block;min-width:0}
.sidebar-tool-discover-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--od-line);min-width:0}
.sidebar-tool-discover-section[hidden]{display:none!important}
.sidebar-tools-actions .od-icon-button:focus-visible,.sidebar-tool-official-title:focus-visible,.sidebar-tool-discovery-filters button:focus-visible{outline:2px solid var(--blue,#4169b1);outline-offset:2px}
.sidebar-tool-discovery-tools{display:flex;align-items:center;gap:6px;min-width:0;margin:0 0 10px}

/* R2: field-level validation and explicit inline approval, no native JS dialog. */
.schedule-panel .schedule-field-error{color:var(--od-negative);font-size:12px;line-height:1.4;margin:0;overflow-wrap:anywhere}
.schedule-field-error:empty{display:none}
.schedule-form [aria-invalid="true"]{border-color:var(--od-negative);outline-offset:2px}
.schedule-save-confirm{display:grid;gap:var(--space-2);padding:var(--space-3);min-width:0}
.schedule-save-confirm>p{margin:0;font-size:12px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-line}
.schedule-save-confirm>strong{font-size:13px}
.schedule-run-details{margin-top:4px;max-width:100%}


/* Scheduled R3: Fire history and deletion belong to the active detail. */
.schedule-load-more{justify-self:start;min-height:36px}


/* Scheduled R2.6: one gutter, explicit reading hierarchy and non-destructive
 * timezone search. Scoped to the existing scheduled surface only. */
.schedule-header{justify-content:flex-start;align-items:center}
.schedule-header-heading{min-width:0;flex:1 1 auto}
.schedule-header-heading strong,.schedule-header-heading .hint{overflow-wrap:anywhere}
.schedule-header .od-page-actions{flex-wrap:wrap}
.schedule-header #schedule-stop{margin-inline-start:auto}
.schedule-panel #schedule-list-summary{margin:0;color:var(--od-ink);font-size:12px;font-weight:650;line-height:1.55;overflow-wrap:anywhere}
.schedule-panel .schedule-card{gap:var(--space-2);padding:var(--space-3);overflow-wrap:anywhere}
.schedule-card-head{align-items:flex-start;flex-wrap:nowrap}
.schedule-card-head strong{font-size:14px;line-height:1.5;flex:1 1 auto;min-width:0;white-space:normal}
.schedule-card-head .schedule-plan-open{min-width:0;flex:1 1 auto;min-height:34px;padding:0;max-width:none;justify-content:flex-start;text-align:left;white-space:normal;overflow-wrap:anywhere;font-size:14px;line-height:1.5;font-weight:700}
.schedule-card-head .schedule-plan-open:hover{text-decoration:underline}
.schedule-detail-view,.schedule-detail-card{min-width:0}
.schedule-detail-summary{gap:var(--space-2)}
.schedule-detail-summary .schedule-state{justify-self:start}
.schedule-detail-summary p{margin:0;overflow-wrap:anywhere}
.schedule-detail-summary .schedule-next-time{font-size:16px;line-height:1.4;font-weight:780;color:var(--od-ink);font-variant-numeric:tabular-nums}
.schedule-detail-card .schedule-detail-actions{justify-content:flex-start}
.schedule-state{flex:0 0 auto;white-space:nowrap;font-weight:650}
.schedule-card .schedule-next-time{font-size:16px;line-height:1.4;font-weight:780;color:var(--od-ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.schedule-panel .schedule-plan-meta{margin:0;font-size:12px;line-height:1.5}
.schedule-panel .schedule-status-help{margin:0;padding:var(--space-2);border-radius:var(--radius-control);background:var(--od-muted);color:var(--od-sub);font-size:12px;line-height:1.55;overflow-wrap:anywhere}
/* R33.3.19 — single authoritative compact card projection, shared with
   the source-bound React portal. No extra card height is reserved for hover. */
.schedule-panel .schedule-card{position:relative;display:grid;gap:var(--space-1);
  min-width:0;padding:10px 12px;overflow:visible;overflow-wrap:anywhere}
.schedule-card .schedule-card-head{display:flex;align-items:center;flex-wrap:nowrap;gap:var(--space-2);
  min-width:0;margin:0;padding:0}
.schedule-card .schedule-plan-title-row{display:inline-flex;align-items:baseline;gap:6px;
  min-width:0;flex:1 1 auto;max-width:100%}
.schedule-card .schedule-plan-title-row>.schedule-plan-open{display:block;flex:0 1 auto;
  min-width:0;min-height:24px;max-width:100%;margin:0;padding:0;
  font-size:13px;line-height:1.5;font-weight:700;text-align:left;
  white-space:normal;overflow-wrap:anywhere}
.schedule-state-icon{display:inline-grid;place-items:center;vertical-align:middle;
  width:20px;height:20px;min-width:20px;min-height:20px;
  padding:0;border:0;border-radius:50%;background:transparent;font-size:0;color:var(--od-sub)}
.schedule-state-icon svg{display:block;width:16px;height:16px;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;overflow:visible}
.schedule-state[data-tone="positive"],.schedule-recent-result[data-tone="positive"]{color:var(--od-positive)}
.schedule-state[data-tone="negative"],.schedule-recent-result[data-tone="negative"]{color:var(--od-negative)}
.schedule-state[data-tone="warning"],.schedule-recent-result[data-tone="warning"]{color:var(--od-warning-ink)}
.schedule-state[data-tone="info"],.schedule-recent-result[data-tone="info"]{color:var(--od-accent-ink)}
.schedule-card .schedule-plan-meta{display:flex;align-items:baseline;flex-wrap:wrap;
  gap:0;margin:0;font-size:12px;line-height:1.5;color:var(--od-sub);
  overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.schedule-card .schedule-plan-meta>.schedule-plan-frequency,
.schedule-card .schedule-plan-meta>.schedule-next-time{margin:0;font-size:12px;
  font-weight:400;line-height:1.5;letter-spacing:0;color:inherit}
.schedule-card .schedule-timing-separator{white-space:pre;color:var(--od-sub)}
.schedule-card .schedule-recent-result{margin:0;font-size:11px;line-height:1.45;overflow-wrap:anywhere}
.schedule-card .schedule-plan-actions{display:flex;align-items:center;justify-content:flex-end;
  gap:4px;flex-wrap:nowrap}
.schedule-card .schedule-plan-actions .od-icon-button{flex:none;width:34px;height:34px;
  min-width:34px;min-height:34px}
.schedule-card .schedule-plan-actions svg{width:16px;height:16px}
.schedule-card .schedule-action-stop:not(:disabled){color:var(--od-negative)}
/* The fixed version stays behind disclosure; plan deletion has one header owner. */
.schedule-more{min-width:0}
.schedule-more>.hint{margin:var(--space-2) 0;overflow-wrap:anywhere}
.schedule-runner-secondary{margin:var(--space-2) 0}
.schedule-runner-secondary>.od-button{min-height:34px;font-size:12px}
.schedule-detail-card .schedule-delete-confirm{border-color:var(--od-negative);border-radius:var(--radius-control)}
.schedule-detail-card .schedule-delete-confirm strong{font-size:12px}
.schedule-detail-card .schedule-delete-confirm .od-button{min-height:36px}
.schedule-header #schedule-detail-delete{color:var(--od-negative)}
/* Installed tasks: first line title/status, second line version/linked plans,
   floating quick actions, low-frequency uninstall in an accessible disclosure. */
.schedule-manager-card{position:relative;overflow:visible;padding:10px 12px;gap:var(--space-1)}
.schedule-manager-card:has(.schedule-manager-menu[open]){z-index:12}
.schedule-manager-card-head{display:block;padding-inline-end:112px;min-width:0}
.schedule-manager-title-line{display:inline-flex;align-items:baseline;gap:6px;
  min-width:0;max-width:100%}
.schedule-manager-title-line strong{display:block;min-width:0;font-size:13px;
  font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.schedule-manager-identity{min-width:0;flex:1 1 auto}
.schedule-manager-identity .hint{margin:1px 0 0;font-size:11px;line-height:1.45;color:var(--od-sub)}
.schedule-manager-state{display:inline-grid;flex:0 0 20px;white-space:nowrap;
  background:transparent;border:0;padding:0;border-radius:50%;font-size:0;color:var(--od-sub)}
.schedule-manager-state[data-state="enabled"]{color:var(--od-positive)}
.schedule-manager-actions{position:absolute;top:8px;right:8px;display:flex;align-items:center;
  justify-content:flex-end;gap:4px;min-width:0;flex-wrap:nowrap}
.schedule-manager-actions .schedule-manager-action{width:32px;height:32px;
  min-width:32px;min-height:32px;padding:5px;flex:none}
.schedule-manager-actions .schedule-manager-action svg{width:16px;height:16px}
.schedule-manager-menu{position:relative;flex:none;min-width:0}
.schedule-manager-menu>summary{list-style:none;cursor:pointer}
/* Hide only the UA marker: the summary stays visible, focusable and touchable. */
.schedule-manager-menu>summary::-webkit-details-marker{display:none}
.schedule-manager-menu>summary::marker{content:""}
.schedule-manager-menu[open]>.schedule-manager-menu-trigger{background:var(--od-muted)}
.schedule-manager-menu-panel{position:absolute;right:0;top:calc(100% + 5px);z-index:20;
  display:grid;gap:4px;width:min(260px,calc(100vw - 48px));max-height:min(360px,65vh);
  overflow:auto;padding:8px;border:1px solid var(--od-line);border-radius:var(--radius-control);
  background:var(--od-paper);box-shadow:0 10px 26px #142a4c25}
.schedule-manager-menu-panel .od-button{display:flex;justify-content:flex-start;
  width:100%;min-height:36px;text-align:left;font-size:12px;white-space:normal}
.schedule-manager-menu-panel .schedule-manager-action{width:100%;height:auto;
  min-height:36px;justify-content:flex-start;text-align:left;font-size:12px}
.schedule-manager-menu-panel .schedule-manager-more{padding:0 4px;min-width:0}
.schedule-manager-menu-panel .schedule-manager-more>.hint{margin:4px 0;font-size:11px;overflow-wrap:anywhere}
.schedule-manager-menu-panel .schedule-manager-uninstall{color:var(--od-negative)}
#schedule-uninstall-confirm{margin-top:var(--space-2);border-radius:var(--radius-control)}
@media(hover:hover) and (pointer:fine){
  .schedule-card .schedule-card-head{padding-inline-end:110px}
  .schedule-card:has([data-schedule-action="stop"]) .schedule-card-head{padding-inline-end:144px}
  .schedule-card .schedule-plan-actions{position:absolute;top:7px;right:8px;z-index:2;
    padding:3px;background:var(--od-paper);border:1px solid var(--od-line);
    border-radius:var(--radius-control);box-shadow:0 5px 14px #142a4c1f;
    opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-2px);
    transition:opacity .12s ease,transform .12s ease}
  .schedule-card:is(:hover,:focus-within) .schedule-plan-actions{
    opacity:1;visibility:visible;pointer-events:auto;transform:none}
  .schedule-manager-card .schedule-manager-actions{opacity:0;pointer-events:none;
    transition:opacity .12s ease}
  .schedule-manager-card:is(:hover,:focus-within) .schedule-manager-actions{
    opacity:1;pointer-events:auto}
}
@media(hover:none), (pointer:coarse){
  .schedule-card .schedule-plan-actions{position:static;flex:0 0 auto}
  .schedule-card .schedule-plan-actions .od-icon-button,
  .schedule-manager-actions .schedule-manager-action{width:44px;height:44px;min-width:44px;min-height:44px}
  .schedule-manager-card-head{padding-inline-end:144px}
  .schedule-manager-actions{top:6px;right:6px}
}
@media(prefers-reduced-motion:reduce){
  .schedule-card .schedule-plan-actions,.schedule-manager-card .schedule-manager-actions{
    transition:none;transform:none}
}
.schedule-more{min-width:0}


.schedule-more>.hint{margin:var(--space-2) 0;overflow-wrap:anywhere}
.schedule-more>.od-button{margin-top:var(--space-2);max-width:100%;min-height:36px}
.schedule-panel .schedule-danger-link{background:transparent;border:1px solid var(--od-negative);color:var(--od-negative)}
.schedule-panel .schedule-danger-button{background:var(--od-negative);color:var(--od-paper)}
.schedule-delete-confirm .od-button{min-height:36px}
.schedule-delete-confirm{border-radius:var(--radius-control)}
.schedule-history{min-width:0}

.schedule-history>.od-stack{gap:var(--space-2)}
.schedule-history-row .schedule-status-guidance{display:block;margin-top:var(--space-1);line-height:1.5}
.schedule-form .schedule-form-section{row-gap:var(--space-3)}
.schedule-form-section .schedule-section-title{margin-bottom:var(--space-1)}
.schedule-form-section .schedule-source-field,.schedule-form-section .schedule-rule-field{gap:var(--space-2);min-width:0}
.schedule-form-section .schedule-rule-field input[type=search]{height:36px;min-height:36px}
.schedule-panel .schedule-timezone-match:empty{display:none}
.schedule-panel .schedule-timezone-match{margin:0;font-size:11px;line-height:1.5}
.schedule-form-section .schedule-timezone-help{margin:0}
.schedule-form #schedule-next{margin:0;line-height:1.55;overflow-wrap:anywhere}
.schedule-form .schedule-advanced{min-width:0}
.schedule-form .schedule-advanced>.od-field{display:grid;gap:var(--space-2)}

.schedule-form #schedule-save-confirm{border-radius:var(--radius-surface)}
.schedule-form #schedule-discard-confirm{display:grid;gap:var(--space-2);padding:var(--space-3);min-width:0;border-radius:var(--radius-surface)}
.schedule-form #schedule-discard-confirm>p{margin:0;font-size:12px;line-height:1.55;color:var(--od-sub);overflow-wrap:anywhere}
.schedule-form #schedule-discard-confirm>.schedule-actions{justify-content:flex-start;flex-wrap:wrap}
.schedule-form>.schedule-actions{justify-content:flex-start;gap:var(--space-2);padding-bottom:var(--space-2)}
.schedule-form .schedule-actions>.od-button{min-height:36px}

/* R2.7 production parity: one R27/R20-token form, without turning inputs
   carrying .od-field into grid containers. All geometry stays in this surface. */
.schedule-form{gap:var(--space-4)}
.schedule-form>.schedule-form-section{gap:var(--space-3)}
.schedule-form-section>.od-field,.schedule-form-section>.schedule-source-field{
  min-width:0;
}

.schedule-review-title{margin:0}
.schedule-form #schedule-save-confirm{border-color:var(--od-action-border);background:var(--od-action-bg)}

.ec-toolbar .ec-icon{display:grid;place-items:center;flex:none;width:var(--od-icon-size);height:var(--od-icon-size);min-height:var(--od-icon-size);padding:0;border:1px solid var(--od-line);border-radius:var(--radius-control);background:var(--od-paper);color:var(--od-sub)}

.ec-toolbar .ec-icon[aria-expanded=true],.ec-toolbar .ec-icon[data-active=true]{color:var(--od-accent-ink);border-color:var(--od-focus)}
.ec-menu-wrap{position:relative;flex:none}

.ec-language select{width:100%;min-height:34px;border:1px solid var(--od-input-border);border-radius:var(--radius-control);background:var(--od-paper);color:var(--od-ink);font:inherit;font-size:12px;padding:4px 8px}

.ec-filter-group{display:flex;flex-wrap:wrap;gap:5px}
.ec-more button{min-height:34px;padding:5px 8px;border:1px solid var(--od-line);border-radius:var(--radius-control);background:var(--od-paper);color:var(--od-sub);font-size:var(--od-note-size)}
.ec-more button[aria-pressed=true]{color:var(--od-accent-ink);border-color:var(--od-focus);background:var(--od-muted);font-weight:700}
.ec-more .ec-menu-action{display:block;width:100%;text-align:left;border:0;color:var(--od-ink);font-size:12px;padding:8px}
.ec-menu-separator{border-top:1px solid var(--od-line);padding-top:7px}
.ec-list{list-style:none;min-width:0;margin:0;padding:0;border:1px solid var(--od-line);border-radius:var(--radius-surface);overflow:hidden;background:var(--od-paper)}
.ec-list:empty{display:none}
.ec-row{position:relative;min-height:72px}
.ec-row:hover,.ec-row:focus-within{background:var(--od-muted)}
/* Full row opens the tool/detail; a single menu floats over content on hover/focus. */
.ec-row-main{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:8px;width:100%;min-height:72px;min-width:0;max-width:none;padding:9px 10px;border:0;border-radius:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.ec-row-main:hover:not(:disabled){background:transparent}
.ec-row-actions{position:absolute;top:50%;right:8px;z-index:1;display:flex;align-items:center;opacity:0;pointer-events:none;transform:translateY(-50%);transition:opacity .12s ease}
/* Exactly one pinned desktop menu follows the last pointer/focus interaction.
   Pointer exit does not clear it; touch still exposes all menu targets. */
.ec-row--action-visible .ec-row-actions{opacity:1;pointer-events:auto}
.ec-row--action-visible .ec-row-main{padding-right:52px}

.ec-row+.ec-row{border-top:1px solid var(--od-line)}
.ec-glyph{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--od-muted);color:var(--od-accent-ink)}

.ec-glyph svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}

.ec-type{flex:none;display:inline-flex;align-items:center;min-height:18px;padding:1px 5px;border:1px solid var(--od-line);border-radius:4px;white-space:nowrap;color:var(--od-sub);font-size:var(--od-note-size);line-height:1.3}

/* Only duplicate-title installed apps show their authoritative ID. Avoid truncating identity at 320px. */
.ec-identity{overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere;line-height:1.35}
.ec-row-more{display:grid;place-items:center;width:34px;min-width:34px;min-height:34px;padding:0;border:1px solid var(--od-line);border-radius:var(--radius-control);background:var(--od-paper);box-shadow:0 2px 8px #101a2a20;color:var(--od-sub)}

.ec-context-menu{position:fixed;z-index:1000;min-width:172px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow-y:auto;
  padding:5px;border:1px solid var(--od-line);border-radius:var(--radius-control);background:var(--od-paper);
  box-shadow:0 12px 32px #101a2a35}
.ec-context-menu[hidden]{display:none!important}
.ec-context-action{display:block;width:100%;min-height:36px;text-align:left;padding:7px 10px;border:0;border-radius:6px;
  background:transparent;color:var(--od-ink);font-size:12px}
.ec-context-action:hover,.ec-context-action:focus-visible{background:var(--od-muted)}
.ec-context-action[data-ec-context-action="uninstall"]{margin-top:4px;border-top:1px solid var(--od-line);color:var(--od-negative)}
.ec-context-action:focus-visible{outline:2px solid var(--od-focus);outline-offset:-2px}
.ec-empty{text-align:center;padding:27px 14px;border:1px dashed var(--od-line);border-radius:10px;color:var(--od-sub);font-size:12px}

.ec-detail-back{display:inline-grid;place-items:center;width:34px;min-width:34px;height:34px;min-height:34px;padding:0;border:0;border-radius:var(--radius-control);background:transparent;color:var(--od-accent-ink);cursor:pointer}
.ec-detail-back:hover{background:var(--od-muted)}

.ec-detail-head strong{font-size:15px}

.ec-detail p{color:var(--od-sub);font-size:12px;line-height:1.6}

.ec-detail-actions .od-button{font-size:12px;color:var(--od-accent-ink)}
/* Compact, uniform detail actions reuse the shared od-icon-button primitive. */
.ec-detail-actions .ec-detail-action{width:36px;height:36px;min-width:36px;min-height:36px;color:var(--od-accent-ink)}
.ec-detail-actions .ec-detail-action[data-ec-detail-action="uninstall"]{color:var(--od-negative)}
.ec-detail-actions .ec-detail-action[data-ec-detail-action="uninstall"]:hover:not(:disabled){background:var(--od-negative-bg);border-color:var(--od-negative)}
