<script>
// OFFLINE_INTERACTIVE_PROPOSAL: memory-only presentation, no Host/SDK or execution.
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const taskSeed = () => [
    {id:'summary',title:'提取网页摘要',description:'整理当前文章的要点与原文链接',site:'example.com',enabled:true,fields:[{key:'length',label:'摘要长度',type:'select',options:['简明','详细'],value:'简明'},{key:'includeLinks',label:'附上原文链接',type:'checkbox',value:true}]},
    {id:'links',title:'整理页面链接',description:'提取并去重当前网页中的链接',site:'example.com',enabled:true,fields:[{key:'limit',label:'最多条数',type:'number',value:20,min:1,max:100},{key:'externalOnly',label:'只保留站外链接',type:'checkbox',value:false}]},
    {id:'knowledge',title:'整理知识库页面',description:'提取文档标题、目录与正文',site:'docs.example.com',enabled:true,fields:[{key:'includeLinks',label:'附上原文链接',type:'checkbox',value:true}]},
    {id:'search',title:'站内搜索',description:'按关键词收集站内搜索结果',site:'example.com',enabled:false,fields:[{key:'keyword',label:'搜索关键词',type:'text',value:'浏览器'},{key:'limit',label:'结果数量',type:'number',value:10,min:1,max:50}]}
  ];
  let tasks=taskSeed(),selected='summary',expanded=true,activeRow='summary',scene='normal',siteAvailable=true;
  let drafts={},records={},run=null,runTimer=null,toastTimer=null,route='tasks',routeTask=null,scrollTop=0,homeTrigger=null;
  let paramsErrorField=null;
  let paramsTask=null,paramsMode='form',paramsTrigger=null,utilityTrigger=null,planDraft=null,planBaseline='',planTrigger=null,planSequence=2,planFormOrigin=null;
  let fileRevision=0,discardAction=null,managerContext=null,managerQuery='',managerFilter='all',managerTask=null,managerExpanded=new Set(),planListScroll=0,planError=null,planManagerOrigin=null,detailReturnsManager=false,planTimeDraft={recurring:'09:00',once:''};
  let plans=[{id:'plan-1',name:'每日文章摘要',task:'summary',url:'https://example.com/articles/workflows',kind:'daily',time:'09:00',paused:false},{id:'plan-2',name:'每周链接整理',task:'links',url:'https://example.com/reading',kind:'weekly',time:'18:30',paused:true}];
  const findTask = id => tasks.find(task=>task.id===id);
  const hasUnknown = id => records[id]?.[0]?.state==='unknown';
  const canRun = task => !!task&&task.enabled&&siteAvailable&&task.site==='example.com'&&!run&&!hasUnknown(task.id);
  const initialParams = task => Object.fromEntries(task.fields.map(field=>[field.key,field.value]));
  function draftFor(task){return drafts[task.id]??(drafts[task.id]={values:initialParams(task),raw:JSON.stringify(initialParams(task),null,2)});}
  function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3600);}
  // Presentation fixtures only. Product values still use the original Codec and owner.
  function resultExample(kind){
    const value={title:'日常工作流',summary:'文章围绕目标、步骤与复盘组织日常工作流。',url:'https://example.com/articles/workflows'};
    if(kind==='long')value.content='这是离线长结果示例，用于检查完整内容的展开与收起。\n'.repeat(220);
    if(kind==='sensitive')value.accessToken='DEMO_ONLY_NOT_A_REAL_TOKEN';
    const full=JSON.stringify(value,null,2),redacted=kind==='sensitive',truncated=kind==='long';
    const preview=redacted?JSON.stringify({...value,accessToken:'[已隐藏]'},null,2):truncated?full.slice(0,4096)+'\n…（内容已截断）':full;
    return {id:'preview-result-'+kind,state:'success',label:'成功 · 离线示例',time:'示例记录',result:preview,
      ...(redacted||truncated?{fullResult:full,redacted,truncated}:{})};
  }
  function resultHint(record,revealed){
    return revealed?(record.redacted?'正在显示完整结果，可能含敏感信息；分享前请检查。':'正在显示完整结果。'):
      [record.truncated?'内容已截断':null,record.redacted?'已隐藏敏感字段':null].filter(Boolean).join('；');
  }
  function resultMarkup(record,taskId,bodyId){
    const reveal=typeof record.fullResult==='string'&&record.fullResult!==record.result;
    return `<div class="result-view"><pre class="result" id="${bodyId}">${esc(record.result)}</pre>${reveal?`<div class="result-actions"><p class="note${record.redacted?' result-hint--sensitive':''}" id="${bodyId}-hint" role="status">${esc(resultHint(record,false))}</p><button type="button" class="text-button result-reveal" data-result-toggle data-result-task="${esc(taskId)}" data-result-run="${esc(record.id)}" aria-controls="${bodyId}" aria-describedby="${bodyId}-hint" aria-expanded="false">${icon('expand')}<span>查看完整结果</span></button></div>`:''}</div>`;
  }
  function toggleResult(button,hide=false){
    const record=(records[button.dataset.resultTask]||[]).find(item=>item.id===button.dataset.resultRun);
    if(!record||typeof record.fullResult!=='string')return;
    const revealed=!hide&&button.getAttribute('aria-expanded')!=='true',body=$(button.getAttribute('aria-controls'));
    if(!body)return;
    body.textContent=revealed?record.fullResult:record.result;body.scrollTop=0;

    if(button.dataset.managerCreate){const task=findTask(button.dataset.managerCreate);if(!task?.enabled||hasUnknown(task.id)||managerContext?.route==='plan-form')return;return editPlan(undefined,task.id);}
    if(button.dataset.managerPlan){
      if(managerContext?.route==='plan-form')return;
      const id=button.dataset.managerPlan;if(!plans.some(plan=>plan.id===id))return;

    }
    if(button.dataset.managerRecords){const task=findTask(button.dataset.managerRecords);if(!task)return;return openUtility('运行记录 · '+task.title,`<p class="note">原型仅展示本页记录；未知结果不会因查看而结算。</p>${(records[task.id]||[]).map(record=>`<div class="stack"><strong>${esc(record.label)} · ${esc(record.time)}</strong><pre class="result">${esc(record.result)}</pre></div>`).join('')}`,button);}
    if(button.dataset.managerMore)return managerMenu(button.dataset.managerMore,button);
    if(button.dataset.managerAction){
      const action=button.dataset.managerAction,id=managerTask,task=findTask(id);
      if(action==='scope'){$('utility-title').textContent='固定版本与网站范围';$('utility-body').innerHTML=`<p class="note">${esc(task.description)}</p><dl class="facts"><div><dt>任务名称</dt><dd>${esc(task.title)}</dd></div><div><dt>任务 ID</dt><dd>${esc(task.id)}</dd></div><div><dt>固定版本</dt><dd>v1.0.0</dd></div><div><dt>适用网站</dt><dd>https://${esc(task.site)}/*</dd></div></dl><p class="note">仅展示离线安装示例，不申请权限。</p>`;$('utility-title').focus();return;}
      if(action==='copy'){$('utility-title').textContent='复制到开发';$('utility-body').innerHTML=`<p class="note">正式工作台会读取「${esc(task.title)}」的固定版本，确认后将源码交给开发编辑器；可能覆盖尚未保存的源码。</p><p class="note">此原型不创建或传递真实草稿，不改变已安装任务和计划。</p><div class="toolbar"><button class="button" type="button" data-confirm="stay">返回管理</button><a class="button" href="../develop/index.html">查看开发入口</a></div>`;$('utility-body').querySelector('[data-confirm="stay"]').focus();return;}
      if(action==='uninstall'){routeTask=id;$('utility-title').textContent='卸载「'+task.title+'」？';$('utility-body').innerHTML='<p class="note">只移除本页示例任务。关联计划将暂停，运行记录保留；不会卸载真实任务。</p><div class="toolbar"><button class="button" type="button" data-confirm="stay">保留任务</button><button class="button danger" type="button" data-confirm="uninstall">卸载示例任务</button></div>';$('utility-body').querySelector('[data-confirm="stay"]').focus();return;}
    }
    if(button.dataset.planEdit)return editPlan(button.dataset.planEdit);
    if(button.hasAttribute('data-new-plan'))return editPlan();
    if(button.dataset.planToggle){const plan=plans.find(item=>item.id===button.dataset.planToggle);if(plan.paused&&planBlockReason(plan)){notify(planBlockReason(plan));return;}plan.paused=!plan.paused;const detail=route==='plan-detail',position=$('viewport').scrollTop;detail?planDetail(plan.id):showPlans();$('viewport').scrollTop=position;const control=document.querySelector(`[data-plan-toggle="${plan.id}"]`);control?.focus({preventScroll:true});control?.scrollIntoView({block:'nearest'});notify((plan.paused?'已暂停未来调度，当前执行不受影响':'已恢复未来调度')+'（仅本页示例）');return;}
    if(button.dataset.planDelete){routeTask=button.dataset.planDelete;openUtility('删除这个计划？','<p class="note">只删除本页中的示例计划，不影响任务及其运行记录。</p><div class="toolbar"><button class="button" type="button" data-confirm="stay">保留计划</button><button class="button danger" type="button" data-confirm="delete-plan">删除计划</button></div>',button);$('utility-body').querySelector('[data-confirm="stay"]').focus();return;}
    if(button.dataset.utility){
      const action=button.dataset.utility,id=routeTask,task=findTask(id);
      if(action==='uninstall'){if(run?.task===id||hasUnknown(id)){notify(run?.task===id?'请先停止当前任务，再卸载。':'结果未知，请先核对原运行记录，暂不卸载。');return;}$('utility-title').textContent='卸载「'+task.title+'」？';$('utility-body').innerHTML='<p class="note">从本页列表移除任务，保留本页运行记录。关联计划会暂停；不操作真实安装。</p><div class="toolbar"><button class="button" type="button" data-confirm="stay">保留任务</button><button class="button danger" type="button" data-confirm="uninstall">卸载示例任务</button></div>';$('utility-body').querySelector('[data-confirm="stay"]').focus();return;}
      closeUtility();
      if(action==='prepare')return openParams(id,document.querySelector(`[data-prepare="${id}"]`));
      if(action==='toggle'){if(run?.task===id||!task.enabled&&hasUnknown(id)){notify('请先停止当前任务或核对原运行记录。');return;}task.enabled=!task.enabled;if(!task.enabled)plans.forEach(plan=>{if(plan.task===id)plan.paused=true;});renderTasks();document.querySelector(`[data-manage="${id}"]`)?.focus({preventScroll:true});notify('任务已'+(task.enabled?'恢复':'停用')+'（仅示例）');return;}
      if(action==='scope'){selected=id;expanded=true;renderTasks();$('scope-panel').open=true;$('scope-panel').querySelector('summary').focus();return;}
    }
    if(button.dataset.confirm){
      const action=button.dataset.confirm,afterDiscard=discardAction;closeUtility();
      if(action==='discard')afterDiscard?.();
      if(action==='save-plan')commitPlan();
      if(action==='delete-plan'){plans=plans.filter(plan=>plan.id!==routeTask);detailReturnsManager&&planManagerOrigin?restoreManagerAfterPlan():showPlans();notify('计划已删除');}
      if(action==='uninstall'){const id=routeTask;if(run?.task===id||hasUnknown(id)){notify(run?.task===id?'请先停止当前任务，再卸载。':'结果未知，请先核对原运行记录，暂不卸载。');return;}tasks=tasks.filter(task=>task.id!==id);plans.forEach(plan=>{if(plan.task===id)plan.paused=true;});if(selected===id)selected=tasks[0]?.id;renderTasks();if(route==='manager'){renderManagerRows();$('manager-search').focus({preventScroll:true});}else(document.querySelector('[data-select]')||$('add-open')).focus({preventScroll:true});notify('示例任务已卸载，运行记录已保留');}
      return;
    }
    switch(button.id){
      case 'search-toggle':{const open=$('search-panel').hidden;$('search-panel').hidden=!open;button.setAttribute('aria-expanded',String(open));if(open)$('task-search').focus();else{$('task-search').value='';renderTasks();}break;}
      case 'search-reset':$('task-search').value='';renderTasks();$('task-search').focus();break;
      case 'add-open':case 'empty-add':openAdd(button);break;
      case 'add-close':closeAdd();break;
      case 'add-import':$('add-file').click();break;
      case 'add-catalog':homeTrigger=button;scrollTop=$('viewport').scrollTop;showCatalog();break;
      case 'catalog-show-task':{const id=routeTask;home();closeAdd();selected=id;expanded=true;activeRow=id;renderTasks();document.querySelector(`[data-select="${id}"]`)?.focus({preventScroll:true});break;}
      case 'manager-add':homeTrigger=$('task-manager-open');home();openAdd($('add-open'));break;
      case 'manager-reset':managerQuery='';managerFilter='all';$('manager-search').value='';document.querySelectorAll('[data-manager-filter]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.managerFilter==='all')));renderManagerRows();$('manager-search').focus();break;
      case 'task-manager-open':homeTrigger=button;scrollTop=$('viewport').scrollTop;openTaskManager(button);break;
      case 'schedule-open':scrollTop=$('viewport').scrollTop;homeTrigger=button;showPlans();break;
      case 'sub-back':if(route==='manager')returnFromManager();else if(route==='plan-form')leavePlan();else if(route==='plan-detail'&&detailReturnsManager){restoreManagerAfterPlan();}else if(route==='plan-detail'){showPlans();$('viewport').scrollTop=planListScroll;document.querySelector(`[data-plan="${planTrigger}"]`)?.focus({preventScroll:true});}else if(route==='catalog-detail'){const id=routeTask;showCatalog();document.querySelector(`[data-catalog-task="${id}"]`)?.focus({preventScroll:true});}else home();break;
      case 'plan-new':editPlan();break;
      case 'plan-cancel':leavePlan();break;
      case 'mode-form':setParamsMode('form');break;
      case 'mode-json':setParamsMode('json');break;
      case 'params-close':case 'params-cancel':closeParams();break;
      case 'params-run':startRun();break;
      case 'stop-run':finishRun('stopped');break;
      case 'open-original':$('history-panel').open=true;$('history-panel').querySelector('summary').focus();break;
      case 'utility-close':closeUtility();break;
      case 'demo-open':openUtility('演示状态','<p class="note">切换会重置任务、参数与当前模拟；计划仍保留在本页。</p><div class="scenario-list"><button type="button" data-scene="normal">正常任务列表</button><button type="button" data-scene="result-plain">完整结果（无需展开）</button><button type="button" data-scene="result-long">长结果（查看完整结果）</button><button type="button" data-scene="result-sensitive">敏感字段（查看与再隐藏）</button><button type="button" data-scene="empty">没有已安装任务</button><button type="button" data-scene="restricted">当前网页不可用</button><button type="button" data-scene="failed">上次运行失败</button><button type="button" data-scene="unknown">上次结果未知</button></div>',button);break;
    }
  });
  $('task-list').addEventListener('pointerover',event=>{const row=event.target.closest('[data-row]');if(row)setActive(row.dataset.row);});
  $('task-list').addEventListener('focusin',event=>{const row=event.target.closest('[data-row]');if(row)setActive(row.dataset.row);});
  $('task-search').addEventListener('input',renderTasks);
  $('search-panel').addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();$('search-toggle').click();$('search-toggle').focus();}});
  $('add-panel').addEventListener('keydown',event=>{if(event.key==='Escape'&&!event.isComposing){event.preventDefault();closeAdd();}});
  $('add-file').addEventListener('change',event=>{const files=[...event.target.files];event.target.value='';if(files.length)void previewFiles(files);});
  $('add-drop').addEventListener('keydown',event=>{if(event.target===$('add-drop')&&['Enter',' '].includes(event.key)&&!event.isComposing){event.preventDefault();$('add-file').click();}});
  $('add-drop').addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='copy';$('add-drop').classList.add('dragging');});
  $('add-drop').addEventListener('dragleave',event=>{if(!$('add-drop').contains(event.relatedTarget))$('add-drop').classList.remove('dragging');});
  $('add-drop').addEventListener('drop',event=>{event.preventDefault();$('add-drop').classList.remove('dragging');void previewFiles([...event.dataTransfer.files]);});
  // Keep accidental drops outside the intended preview zone from navigating
  // away from an unsaved plan. Selected file bytes are never executed.
  document.addEventListener('dragover',event=>{if([...event.dataTransfer.types].includes('Files'))event.preventDefault();});
  document.addEventListener('drop',event=>{if([...event.dataTransfer.types].includes('Files'))event.preventDefault();});
  $('params-dialog').addEventListener('cancel',event=>{event.preventDefault();closeParams();});
  // Match TaskRunSheet: only a complete click on the backdrop dismisses it.
  let paramsBackdropPress=false;
  const isParamsBackdrop=event=>{
    if(event.target!==event.currentTarget)return false;
    const {left,right,top,bottom}=event.currentTarget.getBoundingClientRect();
    return event.clientX<left||event.clientX>right||event.clientY<top||event.clientY>bottom;
  };
  $('params-dialog').addEventListener('pointerdown',event=>{paramsBackdropPress=event.button===0&&isParamsBackdrop(event);});
  $('params-dialog').addEventListener('pointercancel',()=>{paramsBackdropPress=false;});
  $('params-dialog').addEventListener('close',()=>{paramsBackdropPress=false;});
  $('params-dialog').addEventListener('click',event=>{
    const dismiss=paramsBackdropPress&&isParamsBackdrop(event);
    paramsBackdropPress=false;
    if(dismiss)closeParams();
  });
  $('utility-dialog').addEventListener('cancel',event=>{event.preventDefault();closeUtility();});
  // Native modal inertness protects the page. Wrap Tab explicitly so the last
  // control returns to the first instead of handing focus to browser chrome.
  for(const dialog of [$('params-dialog'),$('utility-dialog')])dialog.addEventListener('keydown',event=>{
    if(event.key!=='Tab')return;
    const controls=[...dialog.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')].filter(node=>node.getClientRects().length);
    const first=controls[0],last=controls.at(-1);
    if(!first)return;
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  });
  $('params-dialog').addEventListener('input',event=>{
    const task=findTask(paramsTask),draft=draftFor(task),input=event.target;
    if(input.id==='params-json')draft.raw=input.value;
    else if(input.dataset.param){draft.values[input.dataset.param]=input.type==='checkbox'?input.checked:input.type==='number'?Number(input.value):input.value;draft.raw=JSON.stringify(draft.values,null,2);}
    if(input.id===paramsErrorField){let error;try{error=input.id==='params-json'?validateParams(task,JSON.parse(input.value)):validateParams(task,draft.values,input.dataset.param);}catch{error={message:'JSON 格式有误，请检查引号、逗号和括号。'};}
      if(!error)clearParamsError();else $('params-error').textContent=error.message;}
  });
  $('sub-body').addEventListener('keydown',event=>{
    if(route!=='manager'||event.key!=='Escape'||event.defaultPrevented||event.isComposing||event.repeat||$('utility-dialog').open)return;
    event.preventDefault();
    if(event.target===$('manager-search')&&managerQuery){managerQuery='';event.target.value='';renderManagerRows();}
    else returnFromManager();
  });
  $('sub-body').addEventListener('input',event=>{
    const input=event.target;
    if(input.id==='manager-search'){managerQuery=input.value;renderManagerRows();return;}
    if(!input.dataset.planField)return;
    const field=input.dataset.planField,previousKind=planDraft.kind;
    planDraft[field]=field==='paused'?input.value==='paused':input.type==='checkbox'?input.checked:field==='weekday'?Number(input.value):input.value;
    if(field==='kind'){
      if(previousKind==='once')planTimeDraft.once=planDraft.time;else planTimeDraft.recurring=planDraft.time;
      planDraft.time=input.value==='once'?planTimeDraft.once:planTimeDraft.recurring;renderTimeSettings();
    }
    if(field==='task'){
      const task=findTask(input.value);$('plan-task-note').textContent=task?'版本 v1.0.0':'请选择已启用的任务';$('plan-url-help').textContent=task?'仅限 '+task.site+' 已审阅的网站范围。':'选择任务后核对可用网站。';
    }
    $('plan-rule-preview').innerHTML=icon('clock')+'<span>'+esc(planDraft.time?ruleText(planDraft):'选择执行日期和时间')+' · 北京时间（UTC+8）</span>';
    if(field==='paused')$('plan-save-result').textContent=(planDraft.paused?'保存后暂不触发。':'按以上规则安排未来调度。')+'不会停止当前任务。';
    if(planError){
      const relevant=input.id===planError.id||field==='kind'&&planError.id==='plan-time'||field==='task'&&['plan-task','plan-url'].includes(planError.id)||field==='paused'&&planError.id==='plan-task';
      if(relevant){const message=planFieldError(planError.id);if(message)presentPlanError({id:planError.id,message});else clearPlanError();}
    }
  });
  $('sub-body').addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='plan-form')savePlan();});
  $('history-panel').addEventListener('toggle',()=>{if(!$('history-panel').open)hideRevealed($('history-panel'));});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)hideRevealed();});
  window.addEventListener('pagehide',()=>{hideRevealed();fileRevision++;clearTimeout(runTimer);clearTimeout(toastTimer);});
  renderTasks();
})();
</script>
