<script>
// OFFLINE_INTERACTIVE_PROPOSAL: memory-only presentation, no Host/SDK or execution.
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const BAIDU = 'baidu-preview', baiduHome = 'https://www.baidu.com/';
  // Prototype supports a deliberately small JSON Schema profile, not an unrestricted validator.
  const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  const jsonEqual=(a,b)=>a===b||(Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&a.every((v,i)=>jsonEqual(v,b[i])));
  const copyValue=v=>Array.isArray(v)?v.map(copyValue):v;
  const failSchema=m=>{throw new Error('参数定义无效：'+m)};
  function compileTask(task){
    const s=task.paramsSchema,ui=task.paramsUi||{},config=ui.fields||{};
    if(!s||s.type!=='object'||s.additionalProperties!==false||!s.properties||Array.isArray(s.properties))failSchema('必须为封闭对象');
    if(Object.keys(s).some(k=>!['$schema','type','properties','required','additionalProperties','title','description'].includes(k)))failSchema('不支持的根级关键字');
    const keys=Object.keys(s.properties),req=s.required||[],order=ui.order||keys;
    if(!Array.isArray(req)||new Set(req).size!==req.length||req.some(k=>!keys.includes(k)))failSchema('required');
    if(task.paramsUi&&ui.version!==1)failSchema('未知 paramsUi 版本');
    if(Object.keys(ui).some(k=>!['version','order','fields'].includes(k)))failSchema('未知界面配置');
    if(!Array.isArray(order)||order.length!==keys.length||new Set(order).size!==keys.length||order.some(k=>!keys.includes(k))||Object.keys(config).some(k=>!keys.includes(k)))failSchema('字段顺序或界面字段不匹配');
    const primitive=['string','boolean','integer','number'];
    const fields=order.map(key=>{
      if(!/^[A-Za-z][A-Za-z0-9_]*$/.test(key)||['constructor','prototype'].includes(key))failSchema('不安全字段名 '+key);
      const p=s.properties[key],u=own(config,key)?config[key]:{},required=req.includes(key);
      if(!p||![...primitive,'array'].includes(p.type))failSchema(key+' 的类型');
      const allowed=['type','title','description','default','enum','const','minLength','maxLength','minimum','maximum','multipleOf','format','pattern','items','uniqueItems','minItems','maxItems'];
      if(Object.keys(p).some(k=>!allowed.includes(k)))failSchema(key+' 含不支持的校验关键字');
      if(Object.keys(u).some(k=>!['widget','placeholder','unit','optionLabels'].includes(k)))failSchema(key+' 含未知界面配置');
      const numeric=['integer','number'].includes(p.type);
      const string=p.type==='string';
      const enumValues=p.type==='array'?p.items?.enum:p.enum;
      if(p.type==='array'&&(!p.items||!primitive.includes(p.items.type)||!Array.isArray(enumValues)||p.uniqueItems!==true||Object.keys(p.items).some(k=>!['type','enum'].includes(k))||own(p,'const')||own(p,'enum')))failSchema(key+' 仅支持不重复的枚举数组');
      if(own(p,'enum')&&!Array.isArray(p.enum)||enumValues&&(!enumValues.length||enumValues.some((v,i)=>enumValues.slice(0,i).some(x=>jsonEqual(x,v)))))failSchema(key+' 枚举');
      if((own(p,'format')&&!['uri','date'].includes(p.format))||(!string&&['format','pattern','minLength','maxLength'].some(k=>own(p,k))))failSchema(key+' 的字符串格式');
      if(!numeric&&['minimum','maximum','multipleOf'].some(k=>own(p,k)))failSchema(key+' 的数字约束');
      if(p.type!=='array'&&['items','uniqueItems','minItems','maxItems'].some(k=>own(p,k)))failSchema(key+' 的数组约束');
      if(p.multipleOf!==undefined&&(!Number.isFinite(p.multipleOf)||p.multipleOf<=0)||p.minimum!==undefined&&!Number.isFinite(p.minimum)||p.maximum!==undefined&&!Number.isFinite(p.maximum)||p.minimum>p.maximum)failSchema(key+' 的数字范围');
      for(const k of ['minLength','maxLength','minItems','maxItems'])if(own(p,k)&&(!Number.isInteger(p[k])||p[k]<0))failSchema(key+' 的 '+k);
      if(p.minLength>p.maxLength||p.minItems>p.maxItems)failSchema(key+' 的长度范围');
      if(p.pattern!==undefined){try{new RegExp(p.pattern,'u')}catch{failSchema(key+' 的正则表达式')}}
      const inferred=p.type==='array'?'multi-checkbox':enumValues?'select':p.type==='boolean'?'checkbox':numeric?'number':p.format==='date'?'date':p.format==='uri'?'url':'text';
      const widget=u.widget||inferred;
      const compatible=p.type==='array'?['multi-checkbox']:enumValues?['select','radio']:p.type==='boolean'?['checkbox','switch']:numeric?['number','slider']:p.format==='date'?['date']:p.format==='uri'?['url']:['text','textarea','time'];
      if(!compatible.includes(widget))failSchema(key+' 控件与数据类型不一致');
      if(widget==='slider'&&(!Number.isFinite(p.minimum)||!Number.isFinite(p.maximum)||p.minimum>=p.maximum||!own(p,'default')||p.type==='number'&&!own(p,'multipleOf')||p.multipleOf!==undefined&&Math.abs(p.minimum/p.multipleOf-Math.round(p.minimum/p.multipleOf))>1e-9))failSchema(key+' 滑块需提供有效边界、步长与默认值');
      if(widget==='time'&&!p.pattern)failSchema(key+' 时刻需声明字符串约束');
      if(['checkbox','switch','multi-checkbox'].includes(widget)&&!own(p,'default'))failSchema(key+' 此控件需明确默认值，避免把未提供的值误作 false 或 []');
      if(u.optionLabels&&(!enumValues||!Array.isArray(u.optionLabels)||u.optionLabels.length!==enumValues.length||u.optionLabels.some(v=>typeof v!=='string')))failSchema(key+' 枚举显示名称');
      const fixedCandidate=own(p,'const')?p.const:p.enum?.length===1?p.enum[0]:undefined;
      const fixed=fixedCandidate!==undefined&&(required||own(p,'default'));
      const hasDefault=own(p,'default')||fixed;
      const field={key,label:p.title||key,required,fixed,hasDefault,value:own(p,'default')?copyValue(p.default):fixed?copyValue(fixedCandidate):undefined,help:p.description||'',schema:p,widget,options:enumValues||[],optionLabels:u.optionLabels||enumValues?.map(String)||[],placeholder:u.placeholder||'',unit:u.unit||''};
      if(hasDefault&&fieldIssue(field,field.value,false))failSchema(key+' 默认值违反约束');
      if(enumValues&&enumValues.some(v=>!matchesType(p.type==='array'?p.items.type:p.type,v)))failSchema(key+' 枚举类型');
      return field;
    });
    return {...task,fields};
  }
  function matchesType(t,v){return t==='integer'?Number.isSafeInteger(v):t==='number'?typeof v==='number'&&Number.isFinite(v):t==='array'?Array.isArray(v):typeof v===t;}
  function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T00:00:00Z');return Number.isFinite(d.valueOf())&&d.toISOString().slice(0,10)===v;}
  function validUrl(v){try{const url=new URL(v);return ['http:','https:'].includes(url.protocol)&&!!url.hostname&&!url.username&&!url.password&&!/\s/.test(v)}catch{return false}}
  function fieldIssue(f,v,editing){
    const p=f.schema,label=f.label;
    if(v===undefined)return !editing&&f.required?'请填写'+label+'。':null;
    if(!matchesType(p.type,v))return label+'的数据类型不正确。';
    if(f.fixed&&!jsonEqual(v,f.value))return label+'由脚本固定为 '+JSON.stringify(f.value)+'。';
    if(own(p,'const')&&!jsonEqual(v,p.const)||p.enum&&!p.enum.some(x=>jsonEqual(x,v)))return '请选择有效的'+label+'。';
    if(p.type==='string'){
      const length=[...v].length;
      if(f.required&&p.minLength>0&&!v.trim())return '请填写'+label+'。';
      if(length<(p.minLength??0)||length>(p.maxLength??Infinity))return label+'字符长度不符合要求。';
      if(p.format==='date'&&!validDate(v))return label+'必须为有效日期。';
      if(p.format==='uri'&&!validUrl(v))return label+'必须为有效的 HTTP(S) 网址。';
      if(p.pattern&&!new RegExp(p.pattern,'u').test(v))return label+'格式不正确。';
    }
    if(['integer','number'].includes(p.type)){
      if(v<(p.minimum??-Infinity)||v>(p.maximum??Infinity))return label+'超出允许范围。';
      if(p.multipleOf!==undefined&&Math.abs(v/p.multipleOf-Math.round(v/p.multipleOf))>1e-9)return label+'不符合步长 '+p.multipleOf+'。';
    }
    if(p.type==='array'){
      if(v.length<(p.minItems??0)||v.length>(p.maxItems??Infinity)||v.some(x=>!f.options.some(y=>jsonEqual(x,y)))||v.some((x,i)=>v.slice(0,i).some(y=>jsonEqual(x,y))))return label+'包含无效或重复的选项。';
    }
    return null;
  }
  // Missing values get declared defaults only; false, 0, [] and explicit strings are never truthiness-coerced.
  const initialParams=task=>Object.fromEntries(task.fields.filter(f=>f.hasDefault).map(f=>[f.key,copyValue(f.value)]));
  const normalizedParams=(task,value)=>({...initialParams(task),...Object.fromEntries(task.fields.filter(f=>own(value,f.key)).map(f=>[f.key,copyValue(value[f.key])]))});
  const fieldChanged=(f,v)=>!jsonEqual(f.value,v);
  const taskSeed = () => [
  {
    "id": "baidu-preview",
    "title": "百度搜索：前三条自然网页结果",
    "description": "按关键词搜索，不含广告 · 模拟",
    "site": "www.baidu.com",
    "enabled": true,
    "paramsSchema": {
      "type": "object",
      "properties": {
        "query": {
          "type": "string",
          "title": "搜索关键词",
          "minLength": 1,
          "maxLength": 120
        },
        "limit": {
          "type": "integer",
          "title": "结果数量",
          "enum": [
            3

      case 'add-catalog':homeTrigger=button;scrollTop=$('viewport').scrollTop;showCatalog();break;
      case 'catalog-show-task':{const id=routeTask;home();closeAdd();selected=id;expanded=true;activeRow=id;renderTasks();document.querySelector(`[data-select="${id}"]`)?.focus({preventScroll:true});break;}

  $('params-dialog').addEventListener('cancel',event=>{event.preventDefault();closeParams();});
  // Match TaskRunSheet: only a complete click on the backdrop dismisses it.
  let paramsBackdropPress=false;
  const isParamsBackdrop=event=>{
    if(event.target!==event.currentTarget)return false;
    const {left,right,top,bottom}=event.currentTarget.getBoundingClientRect();
    return event.clientX<left||event.clientX>right||event.clientY<top||event.clientY>bottom;
  };
  $('params-dialog').addEventListener('pointerdown',event=>{paramsBackdropPress=event.button===0&&isParamsBackdrop(event);});
  $('params-dialog').addEventListener('pointercancel',()=>{paramsBackdropPress=false;});
  $('params-dialog').addEventListener('close',()=>{paramsBackdropPress=false;});
  $('params-dialog').addEventListener('click',event=>{
    const dismiss=paramsBackdropPress&&isParamsBackdrop(event);
    paramsBackdropPress=false;
    if(dismiss)closeParams();
  });

  for(const dialog of [$('params-dialog'),$('utility-dialog')])dialog.addEventListener('keydown',event=>{
    if(event.key!=='Tab')return;
    const controls=[...dialog.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary')].filter(node=>node.getClientRects().length&&!node.closest('[inert]')&&(!node.closest('details:not([open])')||node.matches('summary')&&node.parentElement===node.closest('details:not([open])')));
    const first=controls[0],last=controls.at(-1);
    if(!first)return;
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
