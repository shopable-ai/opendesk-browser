/* Workflow R23.1 additive interaction and narrow layout overrides */
/* R23.1 progressive UX layer — retains the R15.3/R23 frame and existing icon language. */
:root{--surface:#fff;--canvas:#f7f9fc;--ink:#243450;--outline:#dce5ef;--secondary:#60748e;--assistant:#fff;--user:#e9f0ff;--primary:#365eda}
.device{position:relative;min-width:0;min-height:430px;height:min(700px,calc(100dvh - 180px));background:var(--canvas)}
.device .tabs{flex-shrink:0}
.device .title-bar{flex-shrink:0;min-height:54px}
.device .title-actions button{flex-shrink:0;min-width:36px;min-height:36px}
.device .content{display:block;overflow-y:auto;overscroll-behavior:contain;overflow-x:hidden;padding:16px 13px 18px;scrollbar-width:thin;min-height:0;flex:1}
.content:has(.intro){display:flex;flex-direction:column;justify-content:center}
.device .message.intro{max-width:340px;margin:auto;text-align:center;padding:18px 5px}
.device .chatline{background:var(--assistant);border:1px solid var(--outline);border-radius:12px;margin:8px 0;padding:12px 13px;font-size:12px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.device .chatline.user{background:var(--user);margin-left:clamp(10px,12%,45px);border-color:#d8e5ff}
.message-meta{display:block;font-size:10px;font-weight:650;color:var(--secondary);margin-bottom:5px}
.message-title{font-weight:700;display:block;margin:0 0 4px}
.content .phase-card{background:var(--surface);border:1px solid var(--outline);border-radius:11px;padding:12px 13px;margin:10px 0;color:var(--ink);line-height:1.62;font-size:11.5px}
.phase-card b{font-size:12px}.phase-card p{margin:5px 0}.phase-card .subtle{color:var(--secondary);font-size:10.5px}
.phase-indicator{width:8px;height:8px;display:inline-block;border-radius:50%;background:#4073dc;margin-right:7px;vertical-align:middle}
.phase-indicator.busy{animation:r23-pulse 1.3s ease-in-out infinite}
@keyframes r23-pulse{0%,100%{opacity:.4}50%{opacity:1}}
.content .r23-auth{background:#fff8eb;color:#624e30;border-color:#efd7ad}
.r23-auth dl{margin:8px 0 10px}.r23-auth dl div{display:flex;gap:9px;margin:5px 0}.r23-auth dt{flex:0 0 60px;font-weight:750}.r23-auth dd{min-width:0;margin:0;overflow-wrap:anywhere}
.content .r23-auth .row .btn{flex:initial;min-height:36px}
.detail-inline{margin-top:9px;padding-top:7px;border-top:1px solid var(--outline);font-size:11px}

.detail-inline p{line-height:1.6;margin:7px 0 0}
.inline-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
.inline-actions button{border:1px solid var(--outline);background:var(--surface);border-radius:8px;padding:7px 9px;color:#3c5d96;font-size:11px;font-weight:650;min-height:34px}
.inline-actions button.primary{background:var(--blue);color:white;border-color:var(--blue)}
.inline-actions button:disabled{opacity:.5;cursor:not-allowed}
.result-value{font-weight:750;color:#24694b;overflow-wrap:anywhere}
.safety-note{font-size:10.5px;color:var(--secondary);line-height:1.5;margin-top:8px}
.device .composer{flex:none;z-index:1;position:relative;background:var(--surface);padding:9px 11px 10px}
.device .compose-box{background:var(--surface);border-color:var(--outline);padding:9px 10px 7px}
.device .compose-box:focus-within{border-color:#6284df;box-shadow:0 0 0 2px #6284df21}
.device textarea{height:48px;min-height:48px;max-height:76px;resize:none;overflow-y:auto;line-height:1.5;color:var(--ink);font-size:12px}
.device .composer .compose-bottom{display:flex;align-items:center;justify-content:space-between}
.compose-hint{font-size:10px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.compose-actions{display:flex;align-items:center;gap:5px}
.device .composer .compose-bottom .send-btn.stop-mode{background:#eaf0fb;color:#334f80;border:1px solid #ccd8eb}

.r23-overmenu{position:absolute;right:8px;top:49px;z-index:15;width:min(252px,calc(100% - 18px));background:var(--surface);border:1px solid var(--outline);border-radius:11px;padding:6px;box-shadow:0 10px 24px #152d4a2b}
.r23-overmenu button{display:block;width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:10px;color:var(--ink);font-size:12px}

(() => {

  const stopIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  const data = {stage:'empty',connected:true,provider:'local_codex',mode:'standard',modeOpen:false,messages:[],pending:null,timer:null,requestSeq:0,
    value:'旧的预填内容',lastResult:null,firstCompleted:false,consent:null,documentChecks:0,siteGranted:true,
    sourceReady:{local_codex:true,cloud_responses:false,custom_https:false},shareApproved:{cloud_responses:false,custom_https:false},
    workflowId:1,nextWorkflowId:2,chatId:1,nextChatId:2,title:'新工作流',dirty:false,versions:[],revision:0,selectedRevision:null,
    historyOpen:false,settingsOpen:false,dialog:null,scenarioOnly:false,documentId:'demo-form:1',actionWarning:'',simulatedSubmits:0,simulatedNavigations:0,

  // Exactly three review-only conversations: no stored dialogue or privileged result.

    {title:'填写表单并读回',date:'今天 · 示例对话',summary:'把姓名填写为「给我一个亿的项目」并读回',ask:'请把姓名填写为给我一个亿的项目，并读取输入框内容，不要提交。'},

  ];

    submits:data.simulatedSubmits,navigations:data.simulatedNavigations,dirty:data.dirty,
    workflowId:data.workflowId,chatId:data.chatId,documentId:data.documentId,firstCompleted:data.firstCompleted,versions:data.versions.map(v=>({...v})),documentChecks:data.documentChecks,
    historyOpen:data.historyOpen,settingsOpen:data.settingsOpen,dialog:data.dialog,consent:!!data.consent,actionWarning:data.actionWarning,
     entryView:data.entryView,demoHistoryTitle:data.demoHistoryTitle});
  const shell = document.querySelector('.device');
  const settings = document.createElement('section');settings.id='r23-settings-panel';settings.className='r23-settings';settings.hidden=true;
  settings.setAttribute('aria-label','AI 设置（离线演示）');
  settings.innerHTML="\n<header class=\"r234-head\">\n  <button type=\"button\" class=\"r234-back\" data-action=\"close-settings\" id=\"r234-back\" aria-label=\"返回对话\" title=\"返回对话\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 18l-6-6 6-6\"/></svg></button>\n  <div class=\"r234-heading\"><h3>AI 设置</h3></div><span class=\"r234-status\">离线演示</span>\n</header>\n<div class=\"r234-body\" id=\"r234-body\">\n  <div class=\"r236-source-row\">\n    <fieldset class=\"r236-switch\">\n      <legend class=\"visually-hidden\">AI 来源</legend>\n      <label class=\"r236-option\"><input type=\"radio\" id=\"r236-native\" name=\"r236-source\" value=\"local_codex\" checked><span>Codex</span></label>\n      <label class=\"r236-option\"><input type=\"radio\" id=\"r236-https\" name=\"r236-source\" value=\"https\"><span>HTTPS 模型</span></label>\n    </fieldset>\n  </div>\n  <section id=\"r23-local-config\" class=\"r234-local-row\">\n    <div class=\"r238-native-state\"><span id=\"r23-native-status\" role=\"status\" data-state=\"ready\">Codex 已就绪</span></div>\n    <button id=\"r23-local-action\" class=\"r234-secondary\" type=\"button\" data-action=\"reconnect\">重新检查</button>\n  </section>\n  <section id=\"r23-remote-config\" class=\"r234-remote-config\" hidden>\n    <div class=\"r234-field\">\n      <label for=\"r23-endpoint\">接口地址</label>\n      <div class=\"r236-input-action\"><input id=\"r23-endpoint\" type=\"url\" inputmode=\"url\" spellcheck=\"false\" autocomplete=\"off\" maxlength=\"2048\" placeholder=\"https://.../v1/chat/completions\"><button type=\"button\" id=\"r236-clear-endpoint\" data-action=\"clear-endpoint\" aria-label=\"清空接口地址\" title=\"清空接口地址\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"/></svg></button></div>\n    </div>\n    <p class=\"r236-protocol-note\" id=\"r236-protocol-note\" role=\"status\">Responses API · 按接口路径自动识别</p>\n    <div class=\"r234-field\">\n      <label for=\"r23-model\">模型 ID</label>\n      <input id=\"r23-model\" type=\"text\" spellcheck=\"false\" autocomplete=\"off\" maxlength=\"120\" placeholder=\"model-id\">\n    </div>\n    <div class=\"r234-field\">\n      <label for=\"r23-api-key\">API Key</label>\n      <div class=\"r234-secret\"><input id=\"r23-api-key\" type=\"password\" autocomplete=\"new-password\" spellcheck=\"false\" placeholder=\"demo-...（仅演示密钥）\" aria-describedby=\"r234-key-help\"><button type=\"button\" id=\"r234-key-toggle\" data-action=\"toggle-api-key\" aria-label=\"显示 API Key\" title=\"显示 API Key\" aria-pressed=\"false\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z\"/><circle cx=\"12\" cy=\"12\" r=\"2.7\"/><path class=\"r234-eye-slash\" d=\"M3 3l18 18\"/></svg></button></div>\n    </div>\n    <p id=\"r234-key-help\" class=\"visually-hidden\">仅允许以 demo- 开头的虚拟密钥，切勿输入真实 API Key；预览不会联网。</p>\n    <div class=\"r234-validation\"><button type=\"button\" class=\"r234-secondary\" data-action=\"simulate-config\">检查配置</button><p id=\"r234-feedback\" class=\"r234-feedback\" role=\"status\" data-kind=\"idle\">未检查</p></div>\n  </section>\n  <section id=\"r23-share-config\" class=\"r234-share\" hidden>\n    <p id=\"r239-share-note\" class=\"r239-share-note\">网页摘要按本轮确认，不长期授权。</p>\n  </section>\n</div>";
  settings.classList.add('r239-sheet');
  settings.setAttribute('role','dialog');
  settings.setAttribute('aria-modal','true');
  settings.setAttribute('aria-labelledby','r239-sheet-title');
  settings.querySelector('.r234-heading h3').id='r239-sheet-title';
  settings.querySelector('.r234-status')?.remove();
  const sheetClose=settings.querySelector('#r234-back');
  sheetClose.setAttribute('aria-label','关闭 AI 设置');
  sheetClose.title='关闭 AI 设置';
  sheetClose.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.5l13 13m0-13-13 13"/></svg>';
  settings.querySelector('.r234-head').append(sheetClose);
  const settingsBackdrop=document.createElement('div');
  settingsBackdrop.id='r239-sheet-backdrop';settingsBackdrop.hidden=true;
  settingsBackdrop.setAttribute('aria-hidden','true');
  settingsBackdrop.addEventListener('click',()=>closeSheet());
  shell.append(settingsBackdrop,settings);
  const modal = document.createElement('div');modal.id='r23-modal-root';modal.className='r23-modal-backdrop';modal.hidden=true;shell.append(modal);
  const announcer=document.createElement('div');announcer.id='r23-announcer';announcer.className='visually-hidden';announcer.setAttribute('role','status');announcer.setAttribute('aria-live','polite');document.body.append(announcer);
  const initialBar = $('scenarios');
  scenarios.forEach(([id,label])=>{const b=document.createElement('button');b.type='button';b.dataset.scenario=id;b.setAttribute('aria-pressed','false');b.textContent=label;initialBar.append(b);});
  const resetButton=document.createElement('button');resetButton.type='button';resetButton.textContent='清空模拟数据';resetButton.dataset.action='reset';initialBar.append(resetButton);
  const prompt=$('prompt'),send=$('form').querySelector('.send-btn');
  prompt.rows=2;prompt.setAttribute('aria-describedby','r23-compose-hint');
  $('content').setAttribute('aria-live','off');
  
  $('settings').setAttribute('aria-expanded','false');$('settings').setAttribute('aria-controls','r23-settings-panel');
  const composeActions=$('form').querySelector('.compose-bottom');
  const left=document.createElement('div');left.className='r233-left';
  const sourceLabel=document.createElement('span');sourceLabel.id='r23-source-label';sourceLabel.textContent='Codex';
  sourceLabel.setAttribute('aria-live','polite');
  sourceLabel.setAttribute('aria-label','当前模型：Codex');
  sourceLabel.dir='auto';
  $('settings').classList.add('r233-settings-trigger');
  $('settings').setAttribute('aria-label','AI 设置');$('settings').title='AI 设置';
  left.append($('settings'),sourceLabel);
  const actionGroup=document.createElement('div');actionGroup.className='compose-actions';actionGroup.append(send);
  composeActions.append(left,actionGroup);
  const hint=document.createElement('span');hint.id='r23-compose-hint';hint.className='visually-hidden';hint.textContent='Enter 发送 · Shift+Enter 换行';$('form').append(hint);
  function announce(s){announcer.textContent=s;}
  let sheetClosingTimer=null;
  const sheetBackground=[
    shell.querySelector('.tabs'),shell.querySelector('.title-bar'),
    $('content'),$('form'),shell.querySelector('.foot-note'),
    document.querySelector('.scenario-bar'),document.querySelector('.r23-demo')
  ];
  function syncSheetLayer(){
    if(data.settingsOpen){
      if(sheetClosingTimer!==null){clearTimeout(sheetClosingTimer);sheetClosingTimer=null;}
      settings.classList.remove('r239-leaving');
      settingsBackdrop.classList.remove('r239-leaving');
      settings.hidden=false;settingsBackdrop.hidden=false;
    }else if(!settings.classList.contains('r239-leaving')){
      settings.hidden=true;settingsBackdrop.hidden=true;
    }
    for(const layer of sheetBackground)if(layer)layer.inert=data.settingsOpen;
    $('settings').setAttribute('aria-expanded',String(data.settingsOpen));
    syncComposerModelLabel();
  }
  function openSheet(){
    if(data.dialog)return;
    data.settingsOpen=true;
    syncSheetLayer();renderConfig();
    sheetClose.focus({preventScroll:true});
  }
  function closeSheet(){
    if(!data.settingsOpen)return;
    data.settingsOpen=false;
    settings.classList.add('r239-leaving');
    settingsBackdrop.classList.add('r239-leaving');
    syncSheetLayer();
    $('settings').focus({preventScroll:true});
    if(sheetClosingTimer!==null)clearTimeout(sheetClosingTimer);
    sheetClosingTimer=setTimeout(()=>{
      sheetClosingTimer=null;
      if(!data.settingsOpen){settings.hidden=true;settingsBackdrop.hidden=true;
        settings.classList.remove('r239-leaving');
        settingsBackdrop.classList.remove('r239-leaving');}
    },170);
  }

  function cancelTimer(){if(data.timer!==null){clearTimeout(data.timer);data.timer=null;}data.requestSeq++;}
  function timed(ms,cb){const seq=data.requestSeq;data.timer=setTimeout(()=>{data.timer=null;if(seq===data.requestSeq)cb();},ms);}
  function busy(){return data.stage==='planning'||data.stage==='running';}
  function isNative(){return data.provider==='local_codex';}
  function providerTitle(){return {local_codex:'Codex',cloud_responses:'HTTPS · Responses',custom_https:'HTTPS · Chat Completions'}[data.provider]||'未配置';}

  // One HTTPS form. Runtime adapter selection is derived only from endpoint path.
  // No network request, secret persistence or Provider/Host/Chrome permission changes.
  const defaultHttpsEndpoint='https://api.openai.com/v1/responses';
  const httpsConfig={endpoint:defaultHttpsEndpoint,model:'',key:''};
  function syncComposerModelLabel(){
    // The composer shows only a short model identity. The settings sheet retains
    // full provider, connection, and permission information.
    const name=isNative()?'Codex':httpsConfig.model.trim();
    sourceLabel.textContent=name;
    sourceLabel.hidden=!name;
    sourceLabel.title=name;
    if(name)sourceLabel.setAttribute('aria-label','当前模型：'+name);
    else sourceLabel.removeAttribute('aria-label');
  }
  let httpsFeedback={kind:'idle',text:'未检查'};
  function inferredHttpsSource(endpoint){
    try{return new URL(endpoint.trim()).pathname==='/v1/responses'?'cloud_responses':'custom_https';}
    catch{return 'custom_https';}
  }
  function captureConfig(){
    if(isNative())return;
    httpsConfig.endpoint=$('r23-endpoint').value;
    httpsConfig.model=$('r23-model').value;
    httpsConfig.key=$('r23-api-key').value;
    data.provider=inferredHttpsSource(httpsConfig.endpoint);
  }
  function syncProtocol(){
    if(isNative())return;
    $('r236-protocol-note').textContent=data.provider==='cloud_responses'
      ?'Responses API'
      :'Chat Completions';
    $('r236-clear-endpoint').hidden=!$('r23-endpoint').value;
  }
  function renderConfig(){
    const local=isNative();
    $('r236-native').checked=local;
    $('r236-https').checked=!local;
    $('r23-local-config').hidden=!local;
    $('r23-remote-config').hidden=local;
    $('r23-share-config').hidden=local;
    const nativeStatus=$('r23-native-status'),nativeAction=$('r23-local-action');
    nativeStatus.textContent=data.connected?'Codex 已就绪':'尚未连接 OpenDesk';
    nativeStatus.dataset.state=data.connected?'ready':'disconnected';
    nativeAction.textContent=data.connected?'重新检查':'连接 OpenDesk';
    if(local)return;
    $('r23-endpoint').value=httpsConfig.endpoint;
    $('r23-model').value=httpsConfig.model;
    $('r23-api-key').value=httpsConfig.key;
    $('r23-api-key').type='password';
    $('r234-key-toggle').setAttribute('aria-pressed','false');
    $('r234-key-toggle').setAttribute('aria-label','显示 API Key');
    $('r234-key-toggle').title='显示 API Key';
    $('r234-feedback').textContent=httpsFeedback.text;
    $('r234-feedback').dataset.kind=httpsFeedback.kind;
    $('r234-field-error')?.remove();
    for(const id of ['r23-endpoint','r23-model','r23-api-key'])$(id).removeAttribute('aria-invalid');
    $('r23-endpoint').removeAttribute('aria-describedby');
    $('r23-model').removeAttribute('aria-describedby');
    $('r23-api-key').setAttribute('aria-describedby','r234-key-help');
    syncProtocol();
  }
  function configEdited(event){
    $('r234-field-error')?.remove();
    for(const id of ['r23-endpoint','r23-model','r23-api-key'])$(id).removeAttribute('aria-describedby');
    $('r23-api-key').setAttribute('aria-describedby','r234-key-help');
    const previousEndpoint=httpsConfig.endpoint;
    captureConfig();
    syncComposerModelLabel();
    if(previousEndpoint!==httpsConfig.endpoint){
      // Never reuse the previous recipient's credential at another endpoint.
      httpsConfig.key='';
      $('r23-api-key').value='';
    }
    data.sourceReady.cloud_responses=false;data.sourceReady.custom_https=false;
    data.connected=false;
    data.shareApproved={cloud_responses:false,custom_https:false};
    data.consent=null;
    httpsFeedback={kind:'idle',text:'待检查'};
    $('r234-feedback').textContent=httpsFeedback.text;
    $('r234-feedback').dataset.kind='idle';
    for(const id of ['r23-endpoint','r23-model','r23-api-key'])$(id).removeAttribute('aria-invalid');
    syncProtocol();
  }
  function checkConfig(){
    if(isNative())return;
    captureConfig();
    const endpoint=httpsConfig.endpoint.trim(),model=httpsConfig.model.trim(),key=httpsConfig.key;
    let url=null,field='',error='';
    if(!endpoint){field='r23-endpoint';error='请输入接口地址。';}
    else{

    if(data.stage==='permission')return '<section class="phase-card"><b>网站授权已撤销（模拟）</b><p>请恢复网站访问范围；正式版仍需实际 Chrome 网站权限。</p><div class="r233-phase-actions"><button type="button" data-action="restore-site">模拟恢复网站授权</button></div></section>';
    if(data.stage==='sharing-required')return `<section class="phase-card" data-stage="sharing-required"><b>允许本轮网页摘要？</b><p>接收方：${safe(httpsConfig.endpoint)}<br>仅使用当前网页的非敏感语义摘要，不含密码或 API Key；本轮结束即失效。</p><div class="r233-phase-actions"><button type="button" class="primary" data-action="share-once">允许本轮并继续</button><button type="button" data-action="share-deny">不发送</button></div></section>`;
    if(data.stage==='readonly')return '<section class="phase-card"><b>只读模式已结束</b><p>没有填写、点击或提交。若需修改网页，请切换操作模式。</p></section>';
    if(data.stage==='result'&&data.scenarioOnly)return '<section class="phase-card" data-stage="result"><b>成功态 · 仅布局示意</b><p>尚未执行模拟填写。请从输入框发送任务，验证 DOM 读回。</p></section>';
    if(data.stage==='saved'&&data.scenarioOnly)return '<section class="phase-card" data-stage="saved"><b>保存态 · 仅布局示意</b><p>本页内存中的草稿版本：'+data.versions.length+'。</p></section>';
    if(data.stage==='failed'&&data.scenarioOnly)return '<section class="phase-card" data-stage="failed"><b>失败态 · 仅布局示意</b><p>此场景不会更新 DOM 或生成执行回执。</p></section>';
    if(data.stage==='unknown')return '<section class="phase-card" data-stage="unknown"><b>结果未知（模拟场景）</b><p>不会自动重放。检查当前值后，再决定后续动作。</p><div class="r233-phase-actions"><button type="button" data-action="inspect">检查模拟 DOM</button></div></section>';
    if(data.stage==='failed'&&!data.scenarioOnly)return '<section class="phase-card"><b>本轮没有执行预期操作</b><p>可以先检查输入框，再决定后续任务；不会自动重试。</p><div class="r233-phase-actions"><button type="button" data-action="inspect">检查输入框</button></div></section>';
    return '';
  }
  function historyHtml(){
    const actual=data.versions.slice(0,3).map(v=>`<button type="button" class="r2310-history-row" data-action="restore" data-id="${v.id}"><span class="r2310-item-main"><strong>${safe(v.title)}</strong><small>本次预览保存的工作流 · r${v.id}</small></span><span class="r2310-arrow" aria-hidden="true">›</span></button>`).join('');
    const examples=sampleConversations.slice(0,3).map((v,i)=>`<button type="button" class="r2310-history-row" data-action="open-demo-history" data-index="${i}"><span class="r2310-item-main"><strong>${safe(v.title)}</strong><small>${safe(v.summary)}</small><em>${safe(v.date)}</em></span><span class="r2310-arrow" aria-hidden="true">›</span></button>`).join('');
    return `<section class="r2310-history-view"><div class="r2310-history-head"><h3>最近对话</h3><button type="button" class="r2310-back" data-action="back" aria-label="返回对话">返回</button></div><div class="r2310-history-list">${actual||examples}</div><p class="r2310-history-foot">${actual?'展示本次预览内存草稿；打开不会自动执行。':'三条仅为演示对话，不含真实记录。打开后不执行网页操作。'}</p></section>`;
  }
  function introHtml(){
    if(data.entryView==='new-chat')return `<section class="message intro r2310-intro"><div class="hello-mark">✦</div><div class="hello-title">开始新对话</div><p class="muted">保留当前工作流和未发送的输入文字。<br>直接描述下一步即可。</p><div class="r2310-suggestions"><button type="button" data-action="fill-suggestion" data-example="followup">继续修改填写内容</button><button type="button" data-action="fill-suggestion" data-example="check">检查当前网页</button></div></section>`;
    if(data.entryView==='new-workflow')return `<section class="message intro r2310-intro"><div class="hello-mark">✦</div><div class="hello-title">创建新工作流</div><p class="muted">用一句话描述任务，或者选一个简单示例开始。</p><div class="r2310-suggestions"><button type="button" data-action="fill-suggestion" data-example="first">填写表单并读回</button><button type="button" data-action="fill-suggestion" data-example="read">只读提取网页信息</button></div></section>`;
    return `<section class="message intro"><div class="hello-mark">✦</div><div class="hello-title">想让浏览器帮你做什么？</div><p class="muted">直接描述任务，查看步骤与运行结果。</p>${data.dirty?'<div class="inline-actions" style="justify-content:center"><button type="button" data-action="save">保存未保存的工作流草稿</button></div>':''}</section>`;
  }
  function render(){const c=$('content'),nearBottom=c.scrollHeight-c.scrollTop-c.clientHeight<96;const oldScroll=c.scrollTop;
    const displayedMessages=data.scenarioOnly?[]:data.messages;
    if(data.historyOpen)c.innerHTML=historyHtml();
    else if(!displayedMessages.length&&(data.entryView||!['planning','approval','running','disconnected','result','failed','unknown','saved'].includes(data.stage)))c.innerHTML=introHtml();
    else c.innerHTML=displayedMessages.map(messageHtml).join('')+stageHtml();
    if(data.actionWarning&&!data.historyOpen)c.insertAdjacentHTML('beforeend',`<div class="r23-warning" role="alert">${safe(data.actionWarning)}</div>`);
    if(data.historyOpen||nearBottom)c.scrollTop=c.scrollHeight;else c.scrollTop=oldScroll;
    $('title').textContent=data.demoHistoryTitle||data.title;
    $('history').setAttribute('aria-expanded',String(data.historyOpen));
    const tag=$('tag'),hasSavedVersion=data.versions.some(v=>v.workflowId===data.workflowId);tag.hidden=!(data.dirty||hasSavedVersion);tag.textContent=data.dirty?'未保存':'已保存';
    send.innerHTML=busy()?stopIcon:sendIcon;send.classList.toggle('stop-mode',busy());send.type=busy()?'button':'submit';send.disabled=data.stage==='approval';
    send.setAttribute('aria-label',busy()?(data.stage==='planning'?'停止 AI 规划（模拟）':'停止浏览器模拟执行'):'发送并模拟任务');
    send.title=data.stage==='approval'?'请先处理授权请求':busy()?'停止当前模拟任务':'发送任务（仅模拟）';
    syncSheetLayer();
    renderConfig();
    renderDialog();
    document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',String(!data.historyOpen?b.dataset.scenario===data.stage:b.dataset.scenario==='history')));
    $('r23-width').setAttribute('aria-label','预览 Sidebar 宽度');
    document.body.dataset.stage=data.stage;
    syncReadback();
  }
  document.addEventListener('click',ev=>{
    const target=ev.target.closest('button');if(!target)return;
    if(data.dialog&&!modal.contains(target)){announce('请先处理未保存确认框');modal.querySelector('button')?.focus();return;}
    if(target.dataset.scenario){simulateScene(target.dataset.scenario);return;}
    const action=target.dataset.action;
    if(target.id==='history'){if(switchBlocked())return;data.historyOpen=true;data.settingsOpen=false;data.actionWarning='';render();return;}
    if(target.id==='settings'){data.settingsOpen?closeSheet():openSheet();return;}
    // A sandboxed srcdoc iframe may allow scripts but disallow form submission.
    // Handle trusted button clicks directly; prevent native submit to avoid double-send.
    if(target===send){ev.preventDefault();if(busy())stop();else if(!send.disabled)onSend();return;}
    if(!action)return;
    switch(action){
      case 'reset':attemptReset();break;
      case 'example-first':prompt.value=firstTask;prompt.focus();announce('第一轮指令已填入，按发送开始');break;
      case 'example-second':prompt.value=secondTask;prompt.focus();announce('第二轮指令已填入，按发送开始');break;
      case 'revoke-site':data.siteGranted=false;data.shareApproved={cloud_responses:false,custom_https:false};announce('模拟网站访问已撤销，后续不得写入');render();break;
      case 'restore-site':data.siteGranted=true;announce('模拟网站访问已恢复，未修改真实 Chrome 权限');render();break;
      case 'change-document':if(switchBlocked())break;data.documentId='demo-form:'+String(Number(data.documentId.split(':')[1]||1)+1);data.consent=null;data.shareApproved={cloud_responses:false,custom_https:false};announce('模拟文档已变化，相关摘要许可失效');render();break;
      case 'new-chat':newChat();break;
      case 'new-workflow':attemptNewWorkflow();break;
      case 'fill-suggestion':{
        const templates={first:firstTask,followup:secondTask,check:'只读检查当前网页表单输入框的值，告诉我结果，不提交也不跳转。',read:'请读取当前页面的标题和主要文字，整理为简短摘要，不点击任何按钮。'};
        if(!templates[target.dataset.example])break;
        prompt.value=templates[target.dataset.example];prompt.focus();announce('已填入示例指令，需手动点击发送才会运行离线模拟');break;
      }
      case 'open-demo-history':{
        if(switchBlocked())break;
        const sample=sampleConversations[Number(target.dataset.index)];if(!sample)break;
        cancelTimer();data.historyOpen=false;data.settingsOpen=false;data.dialog=null;data.entryView=null;
        data.demoHistoryTitle=sample.title;data.pending=null;data.scenarioOnly=false;data.chatId=data.nextChatId++;
        data.messages=[{role:'user',text:sample.ask},{role:'assistant',kind:'info',text:'这是历史对话的界面示例，不代表真实保存或执行。打开记录不会修改模拟表单，也不会请求 Provider。'}];
        data.stage='connected';render();prompt.focus();break;
      }
      case 'cancel-dialog':closeDialog();break;
      case 'save-then-proceed':proceedDialog(true);break;
      case 'discard-proceed':proceedDialog(false);break;
      case 'close-settings':closeSheet();break;
      case 'toggle-api-key':{const input=$('r23-api-key'),shown=input.type==='password';input.type=shown?'text':'password';target.title=shown?'隐藏 API Key':'显示 API Key';target.setAttribute('aria-label',target.title);target.setAttribute('aria-pressed',String(shown));break;}
      case 'reconnect':if(!isNative()){openSheet();announce('HTTPS 来源仅可做离线字段检查；不会测试真实连接');break;}
        if(!data.connected){data.connected=true;data.sourceReady.local_codex=true;data.stage=data.messages.length?'connected':'empty';data.scenarioOnly=false;render();}
        announce('离线预览：仅切换或展示 Codex 已就绪的产品界面；未调用 Native，也未实际检查连接。');break;
      case 'share-once':{
        if(data.stage!=='sharing-required'||isNative()||!data.pending)break;
        const pending=data.pending;
        if(pending.provider!==data.provider||pending.documentId!==data.documentId||pending.endpoint!==httpsConfig.endpoint||!data.siteGranted){
          data.pending=null;data.stage='failed';assistant('接收方、文档或网站权限已改变；本轮授权已取消，没有发送摘要。','warning');render();break;
        }
        data.shareApproved[data.provider]=true;
        data.consent={provider:data.provider,endpoint:httpsConfig.endpoint,documentId:data.documentId};
        data.stage='planning';completePlanning();
        announce('已确认本轮模拟摘要范围，不会实际向 AI 发送数据。');break;
      }
      case 'share-deny':if(data.stage==='sharing-required'){
        data.pending=null;data.stage='failed';data.consent=null;data.shareApproved={cloud_responses:false,custom_https:false};
        assistant('已拒绝本轮摘要，未发送给模型，也未修改网页。','warning');render();
      }break;
      case 'simulate-config':checkConfig();break;
      case 'clear-endpoint':$('r23-endpoint').value='';configEdited();$('r23-endpoint').focus();announce('已清空接口地址，可填写自定义 HTTPS 地址。');break;
      case 'clarify-fill':if(data.stage!=='clarifying'||data.pending?.type!=='clarify')break;data.pending={type:'fill',value:data.pending.value,round:data.firstCompleted?2:1,request:data.pending.request};data.stage='planning';announce('已确认目标，开始模拟规划');render();timed(320,completePlanning);break;
      case 'grant':grant();break;
      case 'deny':deny();break;
      case 'save':saveDraft();break;
      case 'back':data.historyOpen=false;render();prompt.focus();break;
      case 'restore':attemptRestore(Number(target.dataset.id));break;
      case 'inspect':data.scenarioOnly=false;data.documentChecks++;assistant('只读检查模拟 DOM：当前姓名输入值为「'+$('r23-name').value+'」。没有自动重放或更改网页。');announce('模拟 DOM 检查完成');render();$('r23-name').focus();break;
    }
  });
  let composing=false;
  prompt.addEventListener('compositionstart',()=>{composing=true;});prompt.addEventListener('compositionend',()=>{composing=false;});
  prompt.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey&&!composing&&!ev.isComposing&&ev.keyCode!==229){ev.preventDefault();if(!busy())onSend();}});
  document.addEventListener('keydown',ev=>{
    if(data.dialog&&ev.key==='Tab'){const els=[...modal.querySelectorAll('button:not([disabled])')];if(!els.length)return;const first=els[0],last=els[els.length-1];if(ev.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&(document.activeElement===last||!modal.contains(document.activeElement))){ev.preventDefault();first.focus();}return;}
    if(data.settingsOpen&&ev.key==='Tab'&&!data.dialog){
      const tabbables=[...settings.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
        .filter(el=>!el.closest('[hidden]')&&el.getClientRects().length>0);
      if(tabbables.length){
        const first=tabbables[0],last=tabbables[tabbables.length-1],active=document.activeElement;
        if(ev.shiftKey&&(active===first||!settings.contains(active))){ev.preventDefault();last.focus();}
        else if(!ev.shiftKey&&(active===last||!settings.contains(active))){ev.preventDefault();first.focus();}
      }
      return;
    }
    if(ev.key==='Escape'){
    if(data.dialog){ev.preventDefault();closeDialog();}
    else if(data.settingsOpen){ev.preventDefault();closeSheet();}
    
  }});
  $('form').addEventListener('submit',ev=>{ev.preventDefault();onSend();});
  for(const id of ['r236-native','r236-https'])$(id).addEventListener('change',ev=>{if(ev.target.checked)chooseSource(ev.target.value);});
  for(const id of ['r23-endpoint','r23-model','r23-api-key'])$(id).addEventListener('input',configEdited);
  $('r23-width').addEventListener('change',ev=>shell.style.setProperty('--r23-width',ev.target.value+'px'));
  $('r23-theme').addEventListener('click',ev=>{const dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light';ev.currentTarget.setAttribute('aria-pressed',String(dark));ev.currentTarget.textContent=dark?'浅色模式':'深色模式';});
  $('r23-name').addEventListener('input',()=>{data.value=$('r23-name').value;syncReadback();});
  render();
})();
</script>
</body>
</html>
