<script>

const paths={back:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',down:'<path d="m6 9 6 6 6-6"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 18v3h16v-3"/>',upload:'<path d="M12 16V4m-4 4 4-4 4 4M4 18v3h16v-3"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7m4-7v7"/>',check:'<path d="m4 12 5 5L20 6"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4v.1"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m14.5 14.5 5 5"/>'};

const actionButton=(a,html,variant='secondary',attrs='')=>`<button type="button" class="od-button od-button--${variant}" data-action="${a}" ${attrs}>${html}</button>`;

function packFor(lang){return ['empty','builtin'].includes(s.scenario)?undefined:s.packs[lang];}

 if(pack&&!stale)for(const [key,row] of Object.entries(pack.messages||{}))if(Object.hasOwn(source,key)&&row?.source===source[key])trans[key]=row.text;

function settings(){const usable=!['removed','readError'].includes(s.scenario);const displayOptions=[...new Set(['follow','zh-CN','en','ja','fr',...Object.keys(s.packs)])];return `${head('语言与翻译')}
<section class="section" aria-labelledby="ui-group"><h3 id="ui-group" class="section-title">界面语言</h3><div class="field-inline"><label class="od-field-label" for="ui-language">OpenDesk</label><select id="ui-language" class="od-field">${option('auto','跟随浏览器',s.ui==='auto')}${option('zh-CN','简体中文',s.ui==='zh-CN')}${option('zh-TW','繁體中文',s.ui==='zh-TW')}${option('en','English',s.ui==='en')}${option('ja','日本語',s.ui==='ja')}</select></div><p class="field-help">${s.ui==='auto'?'当前使用浏览器语言；缺少翻译时显示原文。':'当前已选择 '+esc(name(s.ui))+'（仅设计演练）。'}</p></section>
<section class="section" aria-labelledby="tool-group"><h3 id="tool-group" class="section-title">扩展语言</h3><div class="field-inline"><label class="od-field-label" for="tool-choose">扩展</label><select id="tool-choose" class="od-field" ${!usable?'disabled':''}>${option(demoTool,'网页笔记（演练）',true)}</select></div><div class="field-inline"><label class="od-field-label" for="tool-language">显示语言</label><select id="tool-language" class="od-field" ${!usable?'disabled':''}>${displayOptions.map(l=>option(l,l==='follow'?'跟随 OpenDesk':name(l),s.toolLang===l)).join('')}</select></div><p class="field-help">${s.toolLang==='follow'?'此扩展跟随 OpenDesk；不影响其他扩展。':'仅此扩展选择 '+esc(name(s.toolLang))+'；缺少翻译时回退原文。'}</p></section>
<section class="section"><button type="button" data-action="open-packs" class="nav-link"><span class="nav-symbol">${icon('folder')}</span><span class="nav-copy"><b>管理语言包</b><small>导入、制作、备份和删除语言包</small></span><span class="nav-chevron">${icon('right')}</span></button></section>
${s.scenario==='readError'?`<p role="alert" class="notice">无法读取扩展语言数据。请检查存储状态。</p>`:''}${s.scenario==='removed'?`<p role="alert" class="notice">此扩展已卸载。语言设置不可操作。</p>`:''}${notice()}`;}
function chosenTarget(){return s.target==='custom'?s.customTarget.trim():s.target;}
function packs(){const disabled=['removed','readError'].includes(s.scenario),locked=disabled||s.scenario==='unknown';const imported=['empty','builtin'].includes(s.scenario)?[]:Object.keys(s.packs).sort();const languageOptions=['en','ja','fr','de','es','zh-TW'];
return `${head('语言包')}
<section class="section"><div class="field-inline"><label class="od-field-label" for="resource-tool">扩展</label><select id="resource-tool" class="od-field" ${disabled?'disabled':''}>${option(demoTool,'网页笔记（演练）',true)}</select></div></section>
<section class="section" aria-labelledby="installed-title"><div class="section-head"><h3 class="section-title" id="installed-title">已导入语言包</h3><span class="section-detail">${imported.length} 个</span></div>
${imported.length?`<div class="pack-list">${imported.map(lang=>{const v=effective(lang);return `<div class="pack-row" data-stale="${v.stale}" data-pack="${esc(lang)}"><div class="pack-name"><strong>${esc(name(lang))} <span lang="en" class="field-help">${esc(lang)}</span></strong><small>${v.stale?'资源已过期，需更新':'已导入'} · ${v.translated}/${v.total} 条可用</small></div><span class="pack-actions">${iconButton('backup','备份 '+name(lang),'download',`data-lang="${esc(lang)}" ${disabled||s.scenario==='unknown'?'disabled':''}`)}${iconButton('ask-delete','删除 '+name(lang)+' 的导入语言包','trash',`data-lang="${esc(lang)}" ${locked?'disabled':''}`)}</span></div>`}).join('')}</div>`:`<p class="field-help">暂无额外导入的语言包。扩展自带的翻译仍可正常使用。</p>`}
${s.deleteConfirm?`<div class="inline-confirm" role="group" aria-label="确认删除语言包"><strong>删除 ${esc(name(s.deleteConfirm))} 导入包？</strong><p>删除后不影响扩展内置语言；已有备份不受影响。</p><div class="action-bar">${actionButton('delete','确认删除','danger',locked?'disabled':'')}${actionButton('cancel-delete','取消')}</div></div>`:''}</section>

<button type="button" class="create-toggle" data-action="toggle-compose" aria-expanded="${s.composerOpen}" ${disabled?'disabled':''}>没有现成语言包？制作新语言包 ${icon('right')}</button>
${s.composerOpen?`<div class="create-panel" aria-labelledby="create-title"><h3 id="create-title" class="section-title">制作语言包</h3>
<div class="inline-field"><label class="od-field-label" for="compose-target">翻译成</label><select id="compose-target" class="od-field" ${disabled?'disabled':''}>${languageOptions.map(lang=>option(lang,`${name(lang)} (${lang})`,s.target===lang)).join('')}${option('custom','其他语言…',s.target==='custom')}</select></div>
${s.target==='custom'?`<div class="inline-field"><label class="od-field-label" for="custom-locale">语言代码</label><input class="od-field" id="custom-locale" placeholder="例如 es-MX" value="${esc(s.customTarget)}" autocomplete="off" spellcheck="false"></div>`:''}
<p class="field-help">从当前扩展读取原文和必要字段，自动生成 JSON。仅填写模板中的 text 译文；可交给外部 AI 或人工完成，再返回上方导入。</p>
${actionButton('download-template',`${icon('download')} 下载翻译模板`,'secondary',disabled?'disabled':'')}
</div>`:''}</section>

${s.scenario==='removed'?`<p role="alert" class="notice">扩展已卸载。请返回扩展列表。</p>`:''}
${notice()}`;}
function resultView(){if(!s.preview)return head('导入预览');const raw=s.preview.pack,pack=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};const errors=s.preview.errors,canWrite=errors.length===0&&!['unknown','readError','removed'].includes(s.scenario);const keys=pack.messages&&typeof pack.messages==='object'&&!Array.isArray(pack.messages)?Object.keys(pack.messages):[];const have=Boolean(s.packs[pack.targetLocale]&&!['empty','builtin'].includes(s.scenario));const identityOk=pack.toolId===demoTool,localeOk=validLocale(pack.targetLocale)&&pack.targetLocale!=='zh-CN',hashOk=pack.sourceCatalogHash===digest,placeholderOk=!errors.some(x=>x.includes('占位符'));
return `${head('导入预览')}<section class="section"><div class="result-title ${canWrite?'good':'bad'}">${icon(canWrite?'check':'alert')}${canWrite?'文件校验通过':'文件未通过校验'}</div>${errors.length?`<div class="notice" role="alert">${errors.map(esc).join('；')}</div>`:''}<dl class="facts"><div class="fact"><dt>扩展</dt><dd class="${identityOk?'':'bad'}">${esc(pack.toolId||'缺失')}${identityOk?'':' · 不匹配'}</dd></div><div class="fact"><dt>语言</dt><dd class="${localeOk?'':'bad'}">${esc(name(pack.targetLocale)||'缺失')} (${esc(pack.targetLocale||'—')})${localeOk?'':' · 不匹配'}</dd></div><div class="fact"><dt>译文</dt><dd>${keys.length} 条</dd></div><div class="fact"><dt>原文哈希</dt><dd class="${hashOk?'good':'bad'}">${hashOk?'一致':'不一致，需更新'}</dd></div><div class="fact"><dt>占位符</dt><dd class="${placeholderOk?'good':'bad'}">${placeholderOk?'匹配':'不匹配'}</dd></div></dl></section>
<section class="section"><div class="section-head"><h3 class="section-title">译文对照</h3><span class="section-detail">前 ${Math.min(3,keys.length)} 条 / ${keys.length}</span></div><div class="data-list">${keys.slice(0,3).map(key=>{const row=pack.messages[key]||{};return `<div class="data-item"><div class="data-key">${esc(key)}</div><div class="data-copy"><span class="original">${esc(row.source)}</span><span>${esc(row.text)}</span></div></div>`;}).join('')}</div>${keys.length>3?`<p class="field-help">此处仅显示部分词条；正式导入必须校验全部词条。</p>`:''}</section>
<section class="section"><p class="page-footnote">${have?'目标语言已有导入包，本次确认会覆盖旧版本。':'确认后保存该语言包。'}不会自动切换扩展显示语言。</p><div class="preview-cta">${actionButton('confirm-import',have?'确认覆盖':'确认导入','primary',canWrite?'':'disabled')}${actionButton('cancel-import','取消')}</div></section>${notice()}`;}
function render(focus='',reset=false){const top=panel.scrollTop;const html=s.tab!=='扩展'?`${head(s.tab,false)}<p class="field-help">此设计文件仅演练扩展语言功能，请返回「扩展」。</p>`:s.view==='extensions'?extensions():s.view==='settings'?settings():s.view==='packs'?packs():resultView();$('content').innerHTML=`<div class="od-page">${html}</div>`;panel.scrollTop=reset?0:top;if(focus)$(focus)?.focus({preventScroll:true});}
function nav(view){s.scroll[s.view]=panel.scrollTop;s.view=view;s.menu=false;s.notice='';s.error='';s.deleteConfirm=null;if(view!=='preview')s.preview=null;render('view-heading',true);}
function focusAction(action){document.querySelector(`#content [data-action="${action}"]`)?.focus({preventScroll:true});}
function back(){if(s.deleteConfirm){s.deleteConfirm=null;render();focusAction('ask-delete');return;}if(s.composerOpen&&s.view==='packs'){s.composerOpen=false;render();focusAction('toggle-compose');return;}if(s.view==='preview'){s.view='packs';s.preview=null;render('',true);panel.scrollTop=s.scroll.packs||0;focusAction('import-file');return;}if(s.view==='packs'){s.view='settings';render('',true);panel.scrollTop=s.scroll.settings||0;focusAction('open-packs');return;}if(s.view==='settings'){s.view='extensions';render('',true);panel.scrollTop=s.scroll.extensions||0;focusAction('more');return;}s.menu=false;render();focusAction('more');}
function download(obj,filename){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download=filename;document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function placeholders(text){return (String(text||'').match(/\{[a-zA-Z][a-zA-Z0-9]*\}/g)||[]).sort().join('|');}
function taskFor(lang){let already={...(builtin[lang]||{})};const pack=packFor(lang);if(pack&&pack.sourceCatalogHash===digest)for(const [key,row] of Object.entries(pack.messages||{}))if(Object.hasOwn(source,key)&&row?.source===source[key])already[key]=row.text;
const missing=Object.keys(source).filter(key=>!Object.hasOwn(already,key));return {translationKeys:missing,instructions:'Translate only translationKeys into targetLocale. Preserve every source, key, identity, locale, sourceCatalogHash and placeholder; plain text only. This local JSON is a DESIGN REVIEW sample, not a production translation task.',schema:{format:'opendesk.locale-pack.v1',maxBytes:262144,maxMessages:160},pack:makePackage(lang,already)};}
function validLocale(code){try{return typeof code==='string'&&Intl.getCanonicalLocales(code)[0]===code;}catch{return false;}}
function validate(pack){const errors=[];if(!pack||typeof pack!=='object'||Array.isArray(pack))return ['JSON 根节点应为对象'];const expected=['format','toolId','sourceLocale','targetLocale','sourceCatalogHash','messages'].sort().join(',');if(Object.keys(pack).sort().join(',')!==expected)errors.push('字段缺失或包含多余字段');if(pack.format!=='opendesk.locale-pack.v1')errors.push('格式标识不正确');if(pack.toolId!==demoTool)errors.push('扩展身份不匹配');if(pack.sourceLocale!=='zh-CN')errors.push('原文语言不匹配');if(!validLocale(pack.targetLocale)||pack.targetLocale==='zh-CN')errors.push('目标语言应为规范 BCP47 代码');if(pack.sourceCatalogHash!==digest)errors.push('原文哈希不匹配（资源过期）');
if(!pack.messages||typeof pack.messages!=='object'||Array.isArray(pack.messages)){errors.push('messages 不是对象');return errors;}const items=Object.entries(pack.messages);if(items.length>160)errors.push('词条数超过 160');if(!items.length)errors.push('没有译文');for(const [key,row] of items){if(!Object.hasOwn(source,key)){errors.push('未知词条：'+key);break;}if(!row||typeof row!=='object'||Array.isArray(row)||Object.keys(row).sort().join(',')!=='source,text'){errors.push('词条字段不匹配：'+key);break;}if(row.source!==source[key]){errors.push('原文已变化：'+key);break;}if(typeof row.text!=='string'||!row.text.trim()||row.text.length>380||/[<>\x00-\x1f\x7f-\x9f\u202a-\u202e]/u.test(row.text)||/^(?:javascript|data|file|https?):/i.test(row.text)){errors.push('非法纯文本译文：'+key);break;}if(placeholders(row.source)!==placeholders(row.text)){errors.push('占位符不匹配：'+key);break;}}
return errors;}
async function readFile(file){if(!file)return;s.error='';if(file.size>262144){s.error='文件超过 256 KiB，请选择更小的 JSON 语言包。';render();return;}let contents;try{contents=await file.text();}catch{s.error='读取文件失败，请重新选择。';render();return;}let pack;try{pack=JSON.parse(contents);}catch{s.error='JSON 无效，请检查格式。';render();return;}if(pack&&typeof pack==='object'&&!Array.isArray(pack)&&pack.pack&&pack.translationKeys){s.error='这是待翻译资料，不是已完成的语言包。请补齐 pack.messages 的译文，并单独保存 pack 为 JSON 后导入。';render();return;}s.preview={pack,errors:validate(pack)};nav('preview');}
$('content').addEventListener('change',event=>{const id=event.target.id,value=event.target.value;if(id==='ui-language'){s.ui=value;s.notice='已在设计预览中更改界面语言；未写入 Chrome。';render('ui-language');}if(id==='tool-language'){s.toolLang=value;s.notice='已在设计预览中更改扩展语言；未写入 Chrome。';render('tool-language');}if(id==='compose-target'){s.target=value;s.notice='';s.error='';render(value==='custom'?'custom-locale':'compose-target');}if(id==='import-file-input'){void readFile(event.target.files?.[0]);event.target.value='';}});
$('content').addEventListener('input',event=>{if(event.target.id==='custom-locale')s.customTarget=event.target.value;});
$('content').addEventListener('click',event=>{const btn=event.target.closest('button');if(!btn)return;const action=btn.dataset.action;switch(action){case'back':s.composerOpen=false;back();break;case'more':s.menu=!s.menu;render();(s.menu?document.querySelector('#content [role="menuitem"]'):document.querySelector('#content [data-action="more"]'))?.focus({preventScroll:true});break;case'close-menu':s.menu=false;render();focusAction('more');break;case'open-settings':nav('settings');break;case'open-packs':nav('packs');break;case'toggle-compose':s.composerOpen=!s.composerOpen;render(s.composerOpen?'compose-target':'');if(!s.composerOpen)focusAction('toggle-compose');break;
case'download-template':{const language=chosenTarget();if(!validLocale(language)||language==='zh-CN'){s.error='请输入有效的目标语言代码（例如 de、es-MX），不能与原文语言相同。';render(s.target==='custom'?'custom-locale':'compose-target');break;}const task=taskFor(language);const pack=JSON.parse(JSON.stringify(task.pack));for(const key of task.translationKeys)pack.messages[key].text='';download(pack,`${demoTool}.${language}.locale-template.json`);s.notice=`已生成 ${name(language)} 模板，${task.translationKeys.length} 个待补译词条留空。只需填写 text；仍需导入和校验。`;s.error='';render();break;}
case'import-file':$('import-file-input')?.click();break;
case'backup':{const lang=btn.dataset.lang,pack=packFor(lang);if(pack){download(pack,`${demoTool}.${lang}.locale-pack.json`);s.notice=`已下载 ${name(lang)} 的演练语言包备份。`;render();}break;}
case'ask-delete':{const lang=btn.dataset.lang;if(!packFor(lang)||['unknown','readError','removed'].includes(s.scenario))break;s.deleteConfirm=lang;render();focusAction('cancel-delete');break;}
case'cancel-delete':s.deleteConfirm=null;render();focusAction('ask-delete');break;
case'delete':{if(!s.deleteConfirm||['unknown','readError','removed'].includes(s.scenario))return;const lang=s.deleteConfirm;delete s.packs[lang];s.deleteConfirm=null;s.notice=`仅从预览内存中删除 ${name(lang)} 的导入包，内置资源不变。`;render();break;}
case'cancel-import':back();break;
case'confirm-import':{if(!s.preview||s.preview.errors.length||['unknown','readError','removed'].includes(s.scenario))return;const pack=JSON.parse(JSON.stringify(s.preview.pack));if(['empty','builtin'].includes(s.scenario)){s.packs={};s.scenario='normal';$('qa-scenario').value='normal';}s.packs[pack.targetLocale]=pack;const readback=s.packs[pack.targetLocale];if(readback?.sourceCatalogHash!==digest){s.error='内存读回不一致，未确认保存。';render();return;}s.view='packs';s.preview=null;s.notice='已在预览内存中保存并读回；未写入 Chrome，也未切换显示语言。';render('view-heading',true);break;}
case'recheck':{s.scenario='normal';$('qa-scenario').value='normal';s.notice='演练状态已恢复；正式版需要真实存储读回才能解除写入保护。';s.error='';render('view-heading');break;}default:break;}});
$('content').addEventListener('dragover',event=>{const zone=event.target.closest('#import-zone');if(!zone||zone.disabled)return;event.preventDefault();event.dataTransfer.dropEffect='copy';zone.dataset.drag='true';});

window.addEventListener('keydown',event=>{if(event.key!=='Escape'||event.target.closest('.review-controls')||event.target.matches('select'))return;if(s.menu){event.preventDefault();s.menu=false;render();focusAction('more');return;}if(s.view!=='extensions'||s.deleteConfirm||s.composerOpen){event.preventDefault();back();}});
document.querySelector('.app-tabs').addEventListener('click',event=>{const btn=event.target.closest('[data-tab]');if(!btn)return;s.tab=btn.dataset.tab;s.menu=false;document.querySelectorAll('.app-tabs [data-tab]').forEach(item=>{const selected=item===btn;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1;});render('',true);});
document.querySelector('.app-tabs').addEventListener('keydown',event=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(event.key))return;event.preventDefault();const tabs=[...document.querySelectorAll('.app-tabs [data-tab]')];let index=tabs.indexOf(document.activeElement);if(event.key==='Home')index=0;else if(event.key==='End')index=tabs.length-1;else index=(index+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length;tabs[index].click();tabs[index].focus({preventScroll:true});});
