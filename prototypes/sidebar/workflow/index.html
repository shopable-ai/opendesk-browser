    if(data.stage==='planning')return `<section class="phase-card" data-stage="planning"><b><span class="phase-indicator busy"></span>AI 正在规划（模拟）</b><p>分析用户本轮要求，准备定位姓名输入框、填写并重新读取。</p><span class="subtle">不会点击提交，也不会跳转。可在底部随时停止。</span></section>`;
    if(data.stage==='approval')return `<section class="r23-auth" data-stage="approval"><b>允许将本页语义摘要提供给 AI？（模拟）</b><dl><div><dt>接收方</dt><dd>${isNative()?'本机 Codex（模拟会话）':'Cloud Responses（外部服务示例）'}</dd></div><div><dt>站点</dt><dd>http://127.0.0.1:43111</dd></div><div><dt>文档</dt><dd>/demo-form.html · 模拟身份 ${safe(data.documentId)}</dd></div><div><dt>范围</dt><dd>最多 24 项语义节点及必要文本，不包含 Cookie、截图或完整网址</dd></div></dl><p>仅批准网页摘要披露；填写动作仍需当前用户指令、文档校验与正式执行权限。</p><div class="inline-actions"><button type="button" class="primary" data-action="grant">允许本次摘要（模拟）</button><button type="button" data-action="deny">拒绝</button></div></section>`;
    if(data.stage==='running')return `<section class="phase-card" data-stage="running"><b><span class="phase-indicator busy"></span>正在操作模拟网页</b><p>定位姓名输入框 → 填写「${safe(data.pending?.value||'')}」→ 读取并核对。</p><span class="subtle">执行完成才更新下方模拟 DOM。可以点击底部停止。</span></section>`;
    if(data.stage==='disconnected')return `<section class="phase-card" data-stage="disconnected"><b>AI 连接暂不可用（模拟）</b><p>本地会话未就绪，当前不执行任务。可恢复演示连接或打开 AI 设置。</p><div class="inline-actions"><button type="button" data-action="reconnect">模拟恢复连接</button></div></section>`;
    if(data.stage==='result'&&data.scenarioOnly)return `<section class="phase-card" data-stage="result"><b>执行成功态 · 布局示意</b><p>这里只预览成功消息的布局，尚未执行模拟填写，不产生成功回执。</p><p class="subtle">请从输入框发送第一轮和第二轮指令完成可验证演示。</p></section>`;
    if(data.stage==='saved'&&data.scenarioOnly)return `<section class="phase-card" data-stage="saved"><b>版本保存态 · 布局示意</b><p>已保存 ${data.versions.length} 个本页内存草稿版本。点击历史入口查看。</p></section>`;
    if(data.stage==='failed'&&data.scenarioOnly)return `<section class="phase-card" data-stage="failed"><b>执行失败态 · 布局示意</b><p>失败时说明原因和下一步，不暗示写入成功。</p></section>`;
    if(data.stage==='unknown')return `<section class="phase-card" data-stage="unknown"><b>结果无法确认（场景演示）</b><p>不能确定是否已经对网页产生副作用。不会自动重放任务。</p><div class="inline-actions"><button type="button" data-action="inspect">查看模拟目标网页</button></div></section>`;
    if(data.stage==='failed'&&!data.scenarioOnly)return `<section class="phase-card"><b>此轮任务没有完成</b><p>你可以查看模拟目标输入框的当前值，再决定是否重新发送；本页不会自动重试。</p><div class="inline-actions"><button type="button" data-action="inspect">检查输入框</button></div></section>`;
    if(data.stage==='stopped')return ''; 
    return '';
  }
  function historyHtml(){const cards=data.versions.length?data.versions.map(v=>`<section class="history"><b>${safe(v.title)} · 工作流 #${v.workflowId} · r${v.id}</b><small>${safe(v.created)} · 仅保存于本页内存 · ${safe(v.status)}</small><button type="button" class="btn link" data-action="restore" data-id="${v.id}">恢复这个草稿 →</button></section>`).join(''):'<section class="panel"><p class="muted">还没有已保存版本。完成模拟任务后，可显式保存草稿。</p></section>';
    return `<div class="r23-history-heading"><h3>工作流历史版本（模拟）</h3><button type="button" class="btn alt" data-action="back">返回对话</button></div>${cards}<p class="hint">版本只在主动打开时展示，不自动运行；模拟保存不写入磁盘。</p>`;}
  function render(){const c=$('content'),nearBottom=c.scrollHeight-c.scrollTop-c.clientHeight<96;const oldScroll=c.scrollTop;
    const displayedMessages=data.scenarioOnly?[]:data.messages;
    if(data.historyOpen)c.innerHTML=historyHtml();
    else if(!displayedMessages.length&&!['planning','approval','running','disconnected','result','failed','unknown','saved'].includes(data.stage))c.innerHTML=`<section class="message intro"><div class="hello-mark">✦</div><div class="hello-title">想让浏览器帮你做什么？</div><p class="muted">用一句话描述任务，按需授权，完成后核对结果。<br>本页仅模拟两轮姓名输入框任务。</p><p class="hint">${data.connected?'● AI 已就绪（仅模拟）':'○ AI 未连接'}</p>${data.dirty?'<div class="inline-actions" style="justify-content:center"><button type="button" data-action="save">保存未保存的工作流草稿</button></div>':''}</section>`;
    else c.innerHTML=displayedMessages.map(messageHtml).join('')+stageHtml();
    if(data.actionWarning&&!data.historyOpen)c.insertAdjacentHTML('beforeend',`<div class="r23-warning" role="alert">${safe(data.actionWarning)}</div>`);
    if(data.historyOpen||nearBottom)c.scrollTop=c.scrollHeight;else c.scrollTop=oldScroll;
    $('title').textContent=data.title;
    const tag=$('tag'),hasSavedVersion=data.versions.some(v=>v.workflowId===data.workflowId);tag.hidden=!(data.dirty||hasSavedVersion);tag.textContent=data.dirty?'未保存':'已保存';
    send.innerHTML=busy()?stopIcon:sendIcon;send.classList.toggle('stop-mode',busy());send.type=busy()?'button':'submit';send.disabled=data.stage==='approval';
    send.setAttribute('aria-label',busy()?(data.stage==='planning'?'停止 AI 规划（模拟）':'停止浏览器模拟执行'):'发送并模拟任务');
    send.title=data.stage==='approval'?'请先处理授权请求':busy()?'停止当前模拟任务':'发送任务（仅模拟）';
    $('settings').setAttribute('aria-expanded',String(data.settingsOpen));
    settings.hidden=!data.settingsOpen;
    $('r23-provider').value=data.provider;
    $('r23-provider-notice').textContent=isNative()?'同一 Native 会话与 Origin 的已批准摘要范围可复用披露决定，但每轮重新核验当前文档。':'HTTPS / Cloud 不继承本机 Codex 摘要授权，必须重新明确同意披露。';
    renderDialog();
    document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',String(!data.historyOpen?b.dataset.scenario===data.stage:b.dataset.scenario==='history')));
    $('r23-width').setAttribute('aria-label','预览 Sidebar 宽度');
    document.body.dataset.stage=data.stage;
    syncReadback();
  }
  document.addEventListener('click',ev=>{
    const target=ev.target.closest('button');if(!target)return;
    if(data.dialog&&!modal.contains(target)){announce('请先处理未保存确认框');modal.querySelector('button')?.focus();return;}
    if(target.dataset.scenario){simulateScene(target.dataset.scenario);return;}
    const action=target.dataset.action;
    if(target.id==='history'){if(switchBlocked())return;data.historyOpen=true;data.settingsOpen=false;data.actionWarning='';render();return;}
    if(target.id==='settings'){data.settingsOpen=!data.settingsOpen;render();if(data.settingsOpen)$('r23-provider').focus();else prompt.focus();return;}
    if(target===send&&busy()){stop();return;}
    if(!action)return;
    switch(action){
      case 'reset':reset();break;
      case 'example-first':prompt.value=firstTask;prompt.focus();announce('第一轮指令已填入，按发送开始');break;
      case 'example-second':prompt.value=secondTask;prompt.focus();announce('第二轮指令已填入，按发送开始');break;
      case 'revoke-consent':data.consent=null;announce('已撤销模拟摘要授权，下轮需重新审批');break;
      case 'change-document':if(switchBlocked())break;data.documentId='demo-form:'+String(Number(data.documentId.split(':')[1]||1)+1);data.consent=null;announce('已切换模拟文档，旧授权不再适用');render();break;
      case 'new-chat':newChat();break;
      case 'new-workflow':attemptNewWorkflow();break;
      case 'cancel-dialog':closeDialog();break;
      case 'save-then-proceed':proceedDialog(true);break;
      case 'discard-proceed':proceedDialog(false);break;
      case 'close-settings':data.settingsOpen=false;render();prompt.focus();break;
      case 'reconnect':data.connected=true;data.stage=data.messages.length?'connected':'empty';data.scenarioOnly=false;announce('模拟 AI 已恢复连接');render();prompt.focus();break;
      case 'grant':grant();break;
      case 'deny':deny();break;
      case 'save':saveDraft();break;
      case 'back':data.historyOpen=false;render();prompt.focus();break;
      case 'restore':attemptRestore(Number(target.dataset.id));break;
      case 'inspect':$('r23-name').focus();break;
    }
  });
  let composing=false;
  prompt.addEventListener('compositionstart',()=>{composing=true;});prompt.addEventListener('compositionend',()=>{composing=false;});
  prompt.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey&&!composing&&!ev.isComposing&&ev.keyCode!==229){ev.preventDefault();if(!busy())onSend();}});
  document.addEventListener('keydown',ev=>{
    if(data.dialog&&ev.key==='Tab'){const els=[...modal.querySelectorAll('button:not([disabled])')];if(!els.length)return;const first=els[0],last=els[els.length-1];if(ev.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&(document.activeElement===last||!modal.contains(document.activeElement))){ev.preventDefault();first.focus();}return;}
    if(ev.key==='Escape'){
    if(data.dialog){ev.preventDefault();closeDialog();}
    else if(data.settingsOpen){ev.preventDefault();data.settingsOpen=false;render();$('settings').focus();}
    
  }});
  $('form').addEventListener('submit',ev=>{ev.preventDefault();onSend();});
  $('r23-provider').addEventListener('change',ev=>{data.provider=ev.target.value;data.consent=null;render();$('r23-provider').focus();announce('已切换模拟模型接收方，摘要许可不能继承');});
  $('r23-width').addEventListener('change',ev=>shell.style.setProperty('--r23-width',ev.target.value+'px'));
  $('r23-theme').addEventListener('click',ev=>{const dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light';ev.currentTarget.setAttribute('aria-pressed',String(dark));ev.currentTarget.textContent=dark?'浅色模式':'深色模式';});
  $('r23-name').addEventListener('input',()=>{data.value=$('r23-name').value;syncReadback();});
  document.addEventListener('pointerdown',ev=>{if(data.settingsOpen&&!settings.contains(ev.target)&&!$('settings').contains(ev.target)){data.settingsOpen=false;render();}});
  render();
})();
</script>
</body>
</html>
