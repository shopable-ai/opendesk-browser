<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenDesk Browser · Workflow R23 审阅候选（离线模拟）</title>
<!-- UI_SIMULATION: ten display scenarios; not an AI provider, extension permission,
     actual RunHost, native receipt, persistent save, or multi-origin workflow. -->
<style>
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;font-size:13px;color:#243450;background:#edf2f9;--blue:#365eda;--border:#dce5ef;--muted:#7a8ba1}
*{box-sizing:border-box}
body{margin:0}
button,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #3968dc;outline-offset:2px}
.scenario-bar{padding:15px 18px;background:#fff;border-bottom:1px solid #dfe6f0}
.scenario-bar h1{font-size:15px;margin:0 0 3px}
.scenario-bar p{font-size:11px;color:#728198;margin:0 0 12px}
.scenarios{display:flex;gap:5px;flex-wrap:wrap}
.scenarios button{border:1px solid var(--border);background:#f8faff;padding:7px 9px;color:#587293;border-radius:7px;font-size:11px}
.scenarios button[aria-pressed=true]{background:#3765d0;border-color:#3765d0;color:#fff;font-weight:750}
.device{margin:18px auto;max-width:392px;height:min(720px,calc(100dvh - 190px));min-height:540px;display:flex;flex-direction:column;background:#f7f9fc;border:1px solid #dce3ef;border-radius:13px;overflow:hidden;box-shadow:0 12px 32px #172c4e17}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-bottom:1px solid var(--border)}
.tabs span{font-size:11px;text-align:center;padding:13px 2px;color:#7a879d}
.tabs .current{border-bottom:2px solid var(--blue);color:#315dbd;font-weight:750}
.title-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;padding:10px 12px;border-bottom:1px solid var(--border)}
.title-bar h2{font-size:14px;margin:0 0 3px;max-width:170px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.title-bar p{font-size:10px;color:var(--muted);margin:0}
.title-actions{display:flex;align-items:center;gap:5px}
.title-actions span{color:#647c9b;font-size:10px;border:1px solid var(--border);padding:4px 6px;border-radius:13px}
.title-actions button{background:#fff;border:1px solid var(--border);border-radius:6px;color:#46668e;padding:6px;font-size:10px}
.content{flex:1;min-height:0;padding:13px 11px;overflow-y:auto;scrollbar-width:thin}
.message,.panel{background:#fff;border:1px solid var(--border);border-radius:11px;padding:13px;margin-bottom:10px}
.hello-mark{display:grid;place-items:center;width:30px;height:30px;background:#eaf1ff;border-radius:9px;color:#4269bd;margin-bottom:11px}
.hello-title{font-size:14px;font-weight:780;margin:0 0 6px}
.muted{font-size:11px;color:#72839b;line-height:1.65;margin:0}
.chatline{border-radius:9px;background:#f1f5fb;padding:10px;font-size:11.5px;margin:7px 0;line-height:1.55}
.chatline.user{margin-left:28px;background:#e8efff}
.hint{font-size:10.5px;color:#8997aa;line-height:1.5;margin:6px 0 0}
h3{font-size:12px;margin:0 0 9px}
.step{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #eef1f6}
.step:last-child{border-bottom:none}
.count{height:23px;width:23px;display:grid;place-items:center;background:#ecf2fe;color:#3866b9;border-radius:7px;flex:none;font-size:11px;font-weight:750}
.step.done .count{background:#e6f7ee;color:#2b8762}
.step b{font-size:11.5px;font-weight:750;display:block}
.step small{display:block;font-size:10.5px;color:#8191a7;margin-top:3px;line-height:1.45}
.btn{background:var(--blue);color:white;border:1px solid var(--blue);border-radius:8px;padding:9px 12px;font-size:11.5px;font-weight:740}
.btn.alt{background:#eef3fc;color:#3f6197;border-color:#d8e4f5}
.btn.link{background:transparent;border:0;color:#3e64af;padding:6px 1px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.row .btn{flex:1}
.mini-form{background:#f7faff;border:1px solid #e7edf6;border-radius:9px;padding:10px;color:#5a6d89;font-size:11px;margin:10px 0}
.notice{background:#fff4e1;border:1px solid #f0dcb6;color:#835c1b;padding:11px;border-radius:9px;font-size:11.5px;line-height:1.6;margin-bottom:10px}
.ok{background:#ecf8f2;border:1px solid #cae9d7;color:#28704e;padding:11px;border-radius:9px;font-size:11.5px;line-height:1.6;margin-bottom:10px}
pre{font:11px/1.55 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;background:#f5f7fa;padding:10px;border-radius:7px;margin:0}
.history{border:1px solid var(--border);border-radius:9px;padding:12px;background:#fff;margin-bottom:9px}
.history small{color:#8695a7;display:block;margin-top:4px}
.composer{background:#fff;border-top:1px solid var(--border);padding:10px}
.compose-box{border:1px solid #dce5f0;background:#fafcff;border-radius:10px;padding:9px}
textarea{border:0;resize:vertical;outline:0;background:transparent;min-height:49px;max-height:80px;width:100%;display:block;font-size:12px;color:#344863}
.compose-bottom{display:flex;gap:8px;justify-content:space-between;align-items:center}
.compose-bottom small{font-size:10px;color:#8d9bad}
.compose-bottom button{background:#3765d0;color:#fff;border:0;border-radius:7px;padding:7px 10px;font-size:11px}
.foot-note{font-size:10.5px;color:#697b94;text-align:center;padding:0 12px 13px}
@media(max-width:460px){.device{margin:0;border-radius:0;max-width:none;min-height:500px;height:calc(100dvh - 145px)}.scenario-bar{padding:10px}.scenarios{max-height:100px;overflow:auto}.scenarios button{padding:5px 7px}}

.title-bar{min-height:49px;padding:6px 12px}
.title-bar h2{margin:0;font-size:13px}
.title-actions{gap:4px}
.title-actions .icon-btn,.compose-bottom .icon-btn{display:grid;place-items:center;width:36px;height:36px;min-height:36px;border:1px solid transparent;color:#536b8b;background:transparent;border-radius:9px;padding:0}
.icon-btn:hover{background:#e9f0fb;color:#365eda}
.icon-btn svg,.send-btn svg{display:block;width:18px;height:18px;pointer-events:none}
.title-actions span[hidden]{display:none}
.composer .compose-bottom{justify-content:flex-end;gap:5px}
.composer .compose-bottom .send-btn{display:grid;place-items:center;width:36px;height:36px;min-height:36px;padding:0;border-radius:10px;background:#365eda;color:#fff;border:0}
.message.intro{border:0;background:transparent;text-align:center;margin:auto 0;padding:18px 8px}
.message.intro .hello-mark{margin:0 auto 12px}
.content:has(.intro){display:flex;flex-direction:column;justify-content:center}
.settings-panel{background:#f8faff;border:1px solid #dce6f7;border-radius:10px;padding:12px;margin-bottom:10px}

.r23-auth{border:1px solid #edd7ae;background:#fff8e8;border-radius:10px;padding:12px;margin:8px 0;font-size:11.5px;line-height:1.6}
.r23-auth p{margin:7px 0}
.r23-details{margin-top:10px;border-top:1px solid var(--border);padding-top:9px;font-size:11px;line-height:1.7}
.r23-details summary{cursor:pointer;color:#496bb0}
.r23-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0;align-items:center;font-size:11px;color:var(--muted)}
.r23-toolbar button,.r23-toolbar select{border:1px solid var(--border);padding:7px;border-radius:7px;background:#fff;color:#4d6385}
.device{width:var(--r23-width,420px);max-width:100%}
.r23-demo{max-width:420px;margin:10px auto 22px;border:1px dashed var(--border);padding:12px;background:#fff;border-radius:10px;font-size:11px}
.r23-demo label{display:block;margin:9px 0}.r23-demo input{display:block;margin-top:6px;border:1px solid var(--border);border-radius:7px;padding:8px;width:100%}
.r23-demo p{color:var(--muted);line-height:1.6}
body[data-theme=dark]{--border:#42516c;--muted:#b4c4da;color:#eaf1fb;background:#101929}
body[data-theme=dark] .scenario-bar,body[data-theme=dark] .device,body[data-theme=dark] .title-bar,body[data-theme=dark] .composer,body[data-theme=dark] .tabs,body[data-theme=dark] .message,body[data-theme=dark] .panel,body[data-theme=dark] .r23-demo{background:#1e2e45;color:#eaf1fb;border-color:#42516c}
body[data-theme=dark] .chatline,body[data-theme=dark] .compose-box,body[data-theme=dark] textarea,body[data-theme=dark] .r23-toolbar button,body[data-theme=dark] .r23-toolbar select{background:#283d5b;color:#eaf1fb;border-color:#42516c}
body[data-theme=dark] .r23-auth,body[data-theme=dark] .notice{background:#443724;color:#fae1a4}
body[data-theme=dark] .ok{background:#214536;color:#caf1da}
body[data-theme=dark] .muted,body[data-theme=dark] .hint{color:#c2cee0}

</style>
</head>
<body>
<div class="scenario-bar">
<h1>R23 · 工作流对话候选（尚待用户确认）</h1>
<p>直接继承 R15.3 紧凑预览的视觉基础；切换场景检查对话、授权与反馈。本页不连接 AI、Native 或 RunHost，不代表当前正式 UI。</p>
<div id="scenarios" class="scenarios" role="group" aria-label="选择工作流产品状态"></div><div class="r23-toolbar"><label>宽度 <select id="r23-width"><option>360</option><option selected>420</option><option>520</option></select> px</label><button type="button" id="r23-theme" aria-pressed="false">深色模式</button><span>真实 200% 缩放仍需 Chrome 验证。</span></div>
</div>
<div class="device" aria-label="浏览器扩展侧边栏布局预览">
  <nav class="tabs" aria-label="Sidebar 一级导航"><span>我的</span><span>扩展</span><span class="current">工作流</span><span>开发</span><span>云控</span></nav>
  <header class="title-bar"><div><h2 id="title">新工作流</h2></div>
  <div class="title-actions"><span id="tag" hidden></span><button type="button" class="icon-btn" id="history" title="历史版本和设置" aria-label="历史版本和设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button><button type="button" class="icon-btn" id="new" title="新对话或新工作流" aria-label="新对话或新工作流"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"></path></svg></button></div></header>
  <main id="content" class="content" aria-live="polite"></main>
  <form id="form" class="composer"><div class="compose-box"><label for="prompt" class="visually-hidden">描述任务</label><textarea id="prompt" placeholder="描述要自动完成的任务…" aria-label="输入工作流需求"></textarea><div class="compose-bottom"><button type="button" id="settings" class="icon-btn" aria-label="配置 AI 模型" title="AI 设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h9m6 0h1M4 17h1m6 0h9"></path><circle cx="16" cy="7" r="3"></circle><circle cx="8" cy="17" r="3"></circle></svg></button><button type="submit" class="send-btn" aria-label="发送并模拟任务" title="发送并执行（仅模拟）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5m-7 7 7-7 7 7"></path></svg></button></div></div></form>
  <p class="foot-note">R23 设计候选 · 仅模拟，不生成真实运行回执或浏览器副作用</p>
</div>
<script>
(function(){
 const scenarios=[['empty','空页面'],['connected','已连接'],['disconnected','未连接'],['planning','AI 执行中'],['approval','授权要求'],['running','执行中'],['result','执行成功'],['failed','执行失败'],['saved','已保存工作流'],['history','历史版本']];
 const labels={unconfigured:'新草稿',empty:'新草稿',planning:'规划中',proposal:'建议待确认',draft:'未保存',running:'运行中',result:'已完成',failed:'失败',saved:'草稿 r3',history:'历史版本'};
 const state={mode:'empty',request:'',settingsOpen:false,requests:[],value:'旧的预填内容'};
 const query=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'' :'&#39;'}[c]));
 const steps=[['填写搜索关键词','使用参数 keyword'],['点击搜索按钮','验证按钮可操作后再点击'],['等待并读取结果','取得真实返回值']];
 const stepList=(completed=false)=>'<section class="panel"><h3>执行步骤 · 3 步</h3>'+steps.map(([name,sub],i)=>'<div class="step'+(completed?' done':'')+'"><span class="count">'+(completed?'✓':i+1)+'</span><div><b>'+name+'</b><small>'+sub+'</small></div></div>').join('')+'<div class="row" style="margin-top:10px"><button type="button" class="btn alt" data-next="draft">编辑步骤</button><button type="button" class="btn" data-next="running">模拟运行</button></div></section>';
 function content(){
   switch(state.mode){
   case 'disconnected':return '<section class="message intro"><div class="hello-mark">✦</div><div class="hello-title">想自动完成什么操作？</div><p class="muted">描述需求，整理成可复用的操作步骤。</p><div class="row" style="justify-content:center;margin-top:8px"><button type="button" class="btn link" data-next="draft">手动创建步骤</button></div></section>';
   case 'empty':return '<section class="message intro"><div class="hello-mark">✦</div><div class="hello-title">想自动完成什么操作？</div><p class="muted">描述需求，整理成可复用的操作步骤。</p></section>';
   case 'planning':return '<div class="chatline user">'+esc(state.request)+'</div><section class="message"><p class="muted">✦ AI 正在规划本轮低风险操作（模拟）…</p><p class="hint">正式产品只在获批的文档和 RunHost 权限内运行。</p><button type="button" class="btn alt" data-next="approval">演示需要摘要授权 →</button></section>';
   case 'approval':return '<div class="chatline user">'+esc(state.request)+'</div><section class="r23-auth"><b>允许读取本次网页摘要？</b><p>接收方：本机 Codex · 网站：http://127.0.0.1:43111 · 当前主文档</p><p>数据范围：最多 24 项语义节点及相关文字。不含 Cookie、截图或完整 URL；摘要授权不等于提交或导航权限。</p><div class="row"><button type="button" class="btn" data-next="running">允许本次摘要（模拟）</button><button type="button" class="btn alt" data-next="failed">拒绝</button></div></section>';
   case 'connected':return '<section class="message intro"><div class="hello-mark">✓</div><div class="hello-title">Codex 已就绪（模拟）</div><p class="muted">描述要完成的浏览器任务；成功后可选择保存。步骤与技术数据默认不展开。</p></section>';
   case 'running':return '<div class="chatline user">'+esc(state.request)+'</div><section class="panel"><h3>正在执行（模拟）</h3><p class="muted">真实产品通过原 Compiler / Authority / RunHost，并在取得真实 inputValue() 读回后报告成功。</p><div class="row"><button type="button" class="btn alt" data-next="failed">模拟 Stop</button><button type="button" class="btn" data-next="result">模拟完成与读回</button></div></section>';
   case 'result':return '<div class="chatline user">'+esc(state.request)+'</div><div class="ok">✓ 仅模拟：实际值 = '+esc(state.value)+'。输入框与预期一致，提交 0 次，跳转 0 次。</div><section class="panel"><div class="row"><button type="button" class="btn alt" data-next="saved">显式保存（模拟）</button><button type="button" class="btn alt" data-details="true">查看步骤与技术细节</button></div><details id="r23-details" class="r23-details" hidden><summary>步骤与回执边界</summary><p>识别输入框 → 填写用户明确值 → inputValue() → 等值核对。模拟并无真实 runId / resultId / sourceHash。</p></details></section>';
   case 'failed':return '<div class="chatline user">'+esc(state.request)+'</div><div class="notice"><b>执行未确认（模拟）</b><p>拒绝、Stop 或未知副作用都不会自动重试，请先核对网页实际状态。</p></div>';
   case 'saved':return '<div class="ok">✓ 草稿版本已保存。保存≠验证成功≠安装。</div><section class="panel"><h3>搜索并提取结果 · r3</h3><p class="muted">单站点 · 3 步 · 1 个输入参数</p><div class="mini-form">keyword：无线键盘</div><div class="row"><button type="button" class="btn alt" data-next="history">查看版本</button><button type="button" class="btn" data-next="running">不经 AI 重复运行</button></div></section>';
   case 'history':return '<section class="panel"><h3>已保存的工作流</h3><div class="history"><b>搜索并提取结果 · r3</b><small>最新 · 草稿，未安装</small><button type="button" class="btn link" data-next="saved">打开此版本 →</button></div><div class="history"><b>搜索并提取结果 · r2</b><small>旧版本 · 独立冻结</small><button type="button" class="btn link" data-next="saved">打开此版本 →</button></div><p class="hint">历史只在用户主动打开时出现，默认界面不展示版本下拉框与刷新按钮。</p></section>';
   }
   return '';
 }
 function render(){
   query('content').innerHTML=state.requests.slice(0,-1).map(request=>'<div class="chatline user">'+esc(request)+'</div><div class="chatline">模拟完成上一轮；不会代表正式执行证据。</div>').join('')+content();
   if(state.settingsOpen){
     const panel=document.createElement('section');
     panel.className='settings-panel';
     const label=document.createElement('h3');label.textContent='AI 设置（模拟）';
     const summary=document.createElement('p');summary.className='muted';
     summary.textContent='真实产品需要配置 HTTPS 模型、获得数据发送同意。本原型不连接或保存信息。';
     const proceed=document.createElement('button');proceed.type='button';proceed.className='btn alt';proceed.dataset.next='empty';proceed.textContent='模拟完成配置';
     panel.append(label,summary,proceed);query('content').prepend(panel);
   }
   const badge=query('tag');badge.hidden=!['saved','history'].includes(state.mode);
   badge.textContent=state.mode==='saved'?'已保存':'';
   query('title').textContent=state.mode==='saved'||state.mode==='history'?'搜索并提取结果':'新工作流';
   document.querySelectorAll('[data-scenario]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.scenario===state.mode)));
 }
 for(const [mode,label] of scenarios){const button=document.createElement('button');button.type='button';button.dataset.scenario=mode;button.setAttribute('aria-pressed','false');button.textContent=label;query('scenarios').append(button);}
 document.addEventListener('click',event=>{
   const scenario=event.target.closest('[data-scenario]');
   const next=event.target.closest('[data-next]');
   if(scenario){state.mode=scenario.dataset.scenario;state.settingsOpen=false;}
   else if(next){if(next.dataset.next==='result'){state.value=state.request.includes('项目已启动')?'项目已启动':state.request.includes('给我一个亿的项目')?'给我一个亿的项目':'（不支持的预览指令）';const input=query('r23-name');if(input)input.value=state.value;if(query('r23-readback'))query('r23-readback').textContent='模拟读回：'+state.value+'；提交 0 次，跳转 0 次';}state.mode=next.dataset.next;state.settingsOpen=false;}
   else if(event.target.closest('[data-details]')){const d=query('r23-details');d.hidden=!d.hidden;d.open=!d.hidden;return;}
   else if(event.target.closest('button')?.id==='history')state.mode='history';
   else if(event.target.closest('button')?.id==='new'){state.mode='empty';state.requests=[];state.settingsOpen=false;}
   else if(event.target.closest('button')?.id==='settings')state.settingsOpen=!state.settingsOpen;
   else return;
   render();
 });
 query('form').addEventListener('submit',event=>{
   event.preventDefault();
   state.request=query('prompt').value.trim()||'搜索关键词并提取结果';
   state.requests.push(state.request);state.mode='planning';state.settingsOpen=false;
   render();
 });
 render();
})();
</script>
<section class="r23-demo" aria-label="扩展外部模拟网页"><b>模拟目标网页</b> · 127.0.0.1:43111/demo-form.html（非真实访问）<label for="r23-name">姓名输入框<input id="r23-name" value="旧的预填内容"></label><button type="button" disabled>提交（预览禁用）</button><p id="r23-readback">模拟读回：旧的预填内容；提交 0 次，跳转 0 次</p></section><script>(function(){document.getElementById("r23-width").addEventListener("change",e=>document.querySelector(".device").style.setProperty("--r23-width",e.target.value+"px"));document.getElementById("r23-theme").addEventListener("click",e=>{const b=document.body,dark=b.dataset.theme!=="dark";b.dataset.theme=dark?"dark":"light";e.currentTarget.setAttribute("aria-pressed",String(dark));e.currentTarget.textContent=dark?"浅色模式":"深色模式";});})();</script></body>
</html>
