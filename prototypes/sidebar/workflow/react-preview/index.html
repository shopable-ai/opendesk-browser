/* Develop: related od-stack rows use 8px; separate sections use 16px; card padding is owned by the design system. */
#workspace-content #workbench-develop{display:grid;gap:var(--space-4);align-content:start}
#workspace-content #workbench-develop>.developer-target,#workspace-content #workbench-develop>.developer-editor{margin:0;padding:0}

.developer-source-switch[data-mode=local]>span{color:var(--sub);font-weight:400}

.local-project-switch-track{position:relative;display:inline-block;flex:none;width:34px;height:20px;border-radius:var(--radius-pill);background:#b4c1d1;transition:background-color .12s}

/* Reserve a fixed right inset for every Dev dropdown arrow, including truncated project names. */
#workbench-develop select{-webkit-appearance:none;appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--od-sub) 50%),linear-gradient(135deg,var(--od-sub) 50%,transparent 50%);background-repeat:no-repeat;background-position:right 17px center,right 11px center;background-size:6px 6px,6px 6px;text-overflow:ellipsis;white-space:nowrap}
/* R29: intrinsic trailing choices, with 28px visuals inside 36px radio targets.

#page-component-editor-tools{margin:0;min-width:0}
#page-component-framework{display:flex;align-items:center;flex-wrap:wrap;column-gap:var(--space-2);row-gap:var(--space-1);width:100%;border:0;padding:0;margin:0;min-width:0}
