<script>
(()=>{'use strict';const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];

function scriptRow(t){return `<article class="item"><div class="itemgrid"><span class="scripticon">${icons.search}</span><div class="grow" style="overflow:hidden"><button class="itemtitle" data-action="detail" data-id="${t.id}">${safe(t.name)}</button><div class="itemsub"><span>${t.site}</span><span class="dot ${t.state==='attention'?'warn':''}"></span><span>${status(t.state)}</span></div></div><div class="itembtns"><button class="icon" data-action="fav" data-id="${t.id}" aria-label="${t.fav?'取消收藏':'收藏'}" title="${t.fav?'取消收藏':'收藏'}" style="${t.fav?'color:#365eda':''}">${icons.star}</button><button class="icon play" data-action="prepare" data-id="${t.id}" ${t.state!=='ready'?'disabled':''} aria-label="运行${safe(t.name)}" title="准备运行">${icons.play}</button><button class="icon" data-action="more" data-id="${t.id}" aria-label="更多操作" title="更多操作">${icons.more}</button></div></div>${s.more===t.id?`<div class="submenu"><button data-action="detail" data-id="${t.id}">查看详情</button><button data-action="fav" data-id="${t.id}">${t.fav?'取消收藏':'收藏'}</button><button data-action="scope">查看任务授权</button><button data-action="host">宿主管理（模拟）</button></div>`:''}${s.detail===t.id?`<div class="detail"><strong>任务详情</strong><span>Task ID：${t.id}</span><span>网站：https://${t.site}/</span><p class="muted">安装与执行权限需由可信宿主核验。</p><div class="group">${btn('收起','close-detail')}${btn('准备运行','prepare-'+t.id,'primary')}</div></div>`:''}${s.staged===t.id?`<div class="detail"><strong>确认模拟手动运行</strong><span>保存原步骤不等于任务已执行。</span><div class="group">${btn('取消','cancel-run')}${btn('确认（模拟）','confirm-run','primary')}</div></div>`:''}</article>`}
function scripts(){let arr=tasks.filter(t=>(s.filter==='all'||s.filter==='ready'&&t.state==='ready'||s.filter==='attention'&&t.state==='attention'||s.filter==='favorite'&&t.fav)&&[t.name,t.site,t.id].some(v=>v.toLowerCase().includes(s.search.toLowerCase())));if(s.sort==='favorite')arr.sort((a,b)=>Number(b.fav)-Number(a.fav));else arr.sort((a,b)=>a.name.localeCompare(b.name));return `<div class="searchrow"><div class="searchbox">${icons.search}<input id="search" class="field" aria-label="搜索脚本" placeholder="搜索脚本或网站" type="search" value="${safe(s.search)}"></div><button class="square" data-action="filter" title="筛选与排序" aria-label="筛选与排序" aria-expanded="${s.filterOpen}">${icons.filter}</button><button class="square" data-action="add" aria-label="添加脚本" title="添加脚本">${icons.plus}</button>${s.filterOpen?`<div class="filterpop"><label>状态<select id="filter-select"><option value="all" ${s.filter==='all'?'selected':''}>全部</option><option value="ready" ${s.filter==='ready'?'selected':''}>可运行</option><option value="attention" ${s.filter==='attention'?'selected':''}>需处理</option><option value="favorite" ${s.filter==='favorite'?'selected':''}>收藏</option></select></label><label>排序<select id="sort-select"><option value="favorite" ${s.sort==='favorite'?'selected':''}>收藏优先</option><option value="name" ${s.sort==='name'?'selected':''}>名称</option></select></label><div class="group">${btn('重置','clear-filter')}${btn('完成','filter-close','primary')}</div></div>`:''}</div><div class="list">${arr.map(scriptRow).join('')||'<div class="panel muted">没有匹配脚本。清除搜索或调整筛选。</div>'}</div>`}
function history(){return `<div class="stack"><p class="muted">手动原请求摘要 · 自动任务结果在「当前任务」核对</p>${block(`<div>${s.records.map(r=>`<div class="rec"><div class="row"><div class="grow" style="overflow:hidden"><strong>${safe(r.name)}</strong><div class="fine">${r.time} · ${status(r.state)}</div></div><span class="dot ${r.state==='success'?'':r.state}"></span><button class="icon" data-action="record" data-id="${r.id}" title="查看记录证据" aria-label="查看记录证据">${icons.chevron}</button></div>${s.record===r.id?`<div class="recmore"><p>${safe(r.description)}</p><p>执行、网页结果、持久保存与回传不可混同。</p>${btn('查询原请求（模拟）','query')}${r.state==='unknown'?'<strong style="color:#946422">UNKNOWN 禁止自动重试</strong>':''}</div>`:''}</div>`).join('')}</div>`)}</div>`}
function settings(){return `<div class="stack">${block(`<div class="stack-sm"><strong>应用偏好</strong><p class="muted">外观、脚本默认筛选及其他显示偏好。</p></div>`)}${block(`<div class="stack-sm"><strong>自动运行管理</strong><p class="muted">运行与授权集中管理，不重复放置 Switch。</p>${btn('查看运行与授权','runtime')}</div>`)}${block(`<div class="stack-sm"><strong>安装与开发</strong><p class="muted">创建、升级、卸载由宿主可信界面完成。</p></div>`)}</div>`}
function drawerBody(){if(s.sheet==='current')return `${block(`<div class="stack-sm"><strong>${{ready:'当前没有待处理任务',running:'任务正在执行',pending:'任务等待授权',unknown:'UNKNOWN · 等待对账',failed:'连接或运行异常'}[s.scenario]}</strong>${s.scenario==='ready'?'<p class="muted">空闲状态不出现停止按钮。</p>':'<p class="muted">百度搜索 · 原聊天（模拟） · www.baidu.com</p>'}${s.scenario==='unknown'?'<div class="alert">只读对账，禁止重放。</div>':''}<div class="group">${['running','unknown','failed'].includes(s.scenario)?btn('查询原请求','query'):''}${s.scenario==='pending'?btn('审核授权','scope','primary'):''}${s.scenario==='running'?btn('停止…','stop'):''}</div></div>`)}<details class="panel"><summary>监听与连接恢复</summary><p class="muted">只读检查原请求，不重新运行。</p></details>`;if(s.sheet==='grants')return `${block(`<div class="stack-sm"><strong>任务授权</strong><div class="grid"><dt>脚本</dt><dd>百度搜索 · v1.1.4</dd><dt>发起来源</dt><dd>chatgpt.com</dd><dt>目标网站</dt><dd>www.baidu.com</dd><dt>参数</dt><dd>query 可变，limit:3 固定</dd></div><p class="muted">${s.grant?'已模拟批准':'未批准'}；自动运行 Switch 仍在外部唯一位置。</p><div class="group">${btn('审核（模拟）','edit-grant')}${btn('撤销（模拟）','revoke')}</div>${s.grantEdit?`<label class="muted">精确目标<input id="grant-url" class="field" value="${safe(s.grantUrl)}"></label><div class="group">${btn('取消','cancel-grant')}${btn('审核保存','save-grant','primary')}</div>`:''}</div>`)}`;return `${block(`<div class="stack-sm"><strong>ChatGPT 一次能力接入</strong><p class="muted">1. 核对固定任务与授权范围。</p><p class="muted">2. 在新聊天接入一次能力说明。</p><p class="muted">3. 正常提出需求，核对真实回执。</p></div>`)}`;}
function drawer(){return `<div class="drawer" role="dialog" aria-modal="true" aria-label="运行与授权"><header class="drawerhead"><strong>运行与授权</strong><span class="statusline">自动运行 · ${s.enabled?'已开启':'已关闭'}</span><button class="icon" id="close" aria-label="关闭运行与授权" title="关闭">✕</button></header><div class="drawerbody"><div class="drawertabs">${[['current','当前任务'],['grants','任务授权'],['help','使用说明']].map(([k,v])=>`<button role="tab" data-sheet="${k}" aria-selected="${s.sheet===k}">${v}</button>`).join('')}</div>${drawerBody()}</div></div>`;}
function render(){ $('#device').style.width=s.width+'px';$('#widthlabel').textContent=s.width+'px';$('#autotitle').textContent=s.enabled?'自动触发已开启':'自动触发已暂停';$('#autonote').textContent=({ready:'仅对已批准的新任务生效',running:'有任务正在执行 · 查看进度',pending:'待批准 · 尚未执行',unknown:'UNKNOWN · 核对原请求',failed:'连接异常 · 请检查'})[s.scenario];$('#switch').setAttribute('aria-checked',String(s.enabled));$('#runtime').dataset.attention=String(s.scenario!=='ready');$('#runtime').setAttribute('aria-expanded',String(s.open));$$('#tabs button').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===s.tab));b.tabIndex=b.dataset.tab===s.tab?0:-1});$('#body').innerHTML=({overview,scripts,history,settings})[s.tab]();$('#cover').hidden=!s.open;$('#cover').innerHTML=s.open?drawer():'';$$('#scenarios button').forEach(b=>b.classList.toggle('active',b.dataset.state===s.scenario));$$('#widths button').forEach(b=>b.classList.toggle('active',Number(b.dataset.width)===s.width));$('#feedback').textContent=s.notice||'点击脚本右侧三个图标、搜索筛选或运行抽屉。';}
function act(a,id){if(['overview','scripts','history','settings'].includes(a)){s.tab=a;s.filterOpen=false;s.more=null;render();return}if(a==='filter'){s.filterOpen=!s.filterOpen;render();return}if(a==='filter-close'){s.filterOpen=false;render();return}if(a==='clear-filter'){s.filter='all';s.sort='favorite';render();return}if(a==='detail'){s.detail=s.detail===id?null:id;s.more=null;render();return}if(a==='close-detail'){s.detail=null;render();return}if(a==='fav'){const t=tasks.find(x=>x.id===id);if(t)t.fav=!t.fav;render();return}if(a==='more'){s.more=s.more===id?null:id;render();return}if(a==='prepare'||a.startsWith('prepare-')){s.staged=id||a.slice(8);s.more=null;s.detail=null;render();return}if(a==='cancel-run'){s.staged=null;render();return}if(a==='confirm-run'){const task=tasks.find(x=>x.id===s.staged);s.records.unshift({id:'preview-'+(s.records.length+1),name:task?.name||'模拟任务',time:'刚刚',state:'pending',description:'仅模拟原请求提交，未操作真实网页。'});s.staged=null;s.tab='history';s.notice='演示记录已写入内存，不代表真实执行';render();return}if(a==='record'){s.record=s.record===id?null:id;s.tab='history';render();return}if(a==='runtime'){returnFocus=document.activeElement;s.open=true;s.sheet='current';render();$('#close')?.focus();return}if(a==='scope'){s.open=true;s.sheet='grants';s.more=null;render();return}if(a==='help'){s.open=true;s.sheet='help';render();return}if(a==='close'){s.open=false;render();returnFocus?.focus();return}if(a==='reset'){s=base();render();return}if(a==='edit-grant'){s.grantEdit=true;render();return}if(a==='cancel-grant'){s.grantEdit=false;render();return}if(a==='save-grant'){s.grantEdit=false;s.grant=true;s.notice='模拟批准已保存，不影响真实权限';render();return}if(a==='revoke'){s.grant=false;s.notice='模拟撤销已记录，不影响真实权限';render();return}if(a==='query'){s.notice='模拟只读查询，未访问真实 Run/Result';render();return}if(a==='add'||a==='host'||a==='back'){s.notice='原宿主管理不属于预览执行范围';render();return}if(a==='stop'){s.scenario='unknown';s.notice='模拟停止后的状态仍未知，需要原请求对账';render();return}}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return; if(b.id==='switch'){s.enabled=!s.enabled;render();return}if(b.id==='runtime'){act('runtime');return}if(b.id==='close'){act('close');return}if(b.dataset.tab){s.tab=b.dataset.tab;render();return}if(b.dataset.sheet){s.sheet=b.dataset.sheet;render();return}if(b.dataset.state){s.scenario=b.dataset.state;render();return}if(b.dataset.width){s.width=Number(b.dataset.width);render();return}if(b.dataset.action){act(b.dataset.action,b.dataset.id);return}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){const p=ev.target.selectionStart;s.search=ev.target.value;render();let el=$('#search');el?.focus();el?.setSelectionRange(p,p)}if(ev.target.id==='grant-url')s.grantUrl=ev.target.value});document.addEventListener('change',ev=>{if(ev.target.id==='filter-select'){s.filter=ev.target.value;render()}if(ev.target.id==='sort-select'){s.sort=ev.target.value;render()}});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(s.open){ev.preventDefault();act('close')}else if(s.filterOpen){s.filterOpen=false;render()}else if(s.more){s.more=null;render()}return}if(['ArrowLeft','ArrowRight','Home','End'].includes(ev.key)&&ev.target.closest('#tabs button')){ev.preventDefault();const arr=['overview','scripts','history'];let i=arr.indexOf(s.tab),j=ev.key==='Home'?0:ev.key==='End'?2:(i+(ev.key==='ArrowRight'?1:2))%3;s.tab=arr[j];render();$$('#tabs button')[j]?.focus()}});render();})();
</script></body></html>
