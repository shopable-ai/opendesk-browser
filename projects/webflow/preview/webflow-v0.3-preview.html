<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const paths={plus:'M12 5v14M5 12h14',search:'m21 21-4.4-4.4M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z',filter:'M4 7h16M7 12h10M10 17h4',chev:'m9 18 6-6-6-6',left:'m15 18-6-6 6-6M9 12h11',check:'m5 12 4 4L19 6',globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM3 12h18M12 3c3 4 3 14 0 18M12 3c-3 4-3 14 0 18',code:'m8 8-4 4 4 4m8-8 4 4-4 4m-3-12-2 16',book:'M4 5c3-1 6-.7 8 1 2-1.7 5-2 8-1v14c-3-1-6-.7-8 1-2-1.7-5-2-8-1V5Zm8 1v14',star:'m12 3 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9L12 3Z',info:'M12 17v-5m0-4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z',alert:'M12 3 2 20h20L12 3Zm0 7v4m0 3h.01',arrow:'M5 12h14m-6-6 6 6-6 6',x:'M5 5l14 14M19 5 5 19',layers:'m4 8 8-5 8 5-8 5-8-5Zm0 5 8 5 8-5',clock:'M12 6v6l4 2m5-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0'};
const ic=(key,small=false)=>`<svg aria-hidden="true" class="ico${small?' sm':''}" viewBox="0 0 24 24"><path d="${paths[key]||paths.info}"/></svg>`;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pins=[{id:'google.search.top3',name:'Google 搜索',desc:'搜索并提取前三条自然结果',site:'google.com',url:'https://www.google.com/',version:'1.0.0',owner:'OpenDesk',kind:'pin',installed:true,delegated:true,verified:true},{id:'baidu.search.top3',name:'百度搜索',desc:'搜索并提取前三条自然结果',site:'baidu.com',url:'https://www.baidu.com/',version:'1.1.1',owner:'OpenDesk',kind:'pin',installed:true,delegated:true,verified:true}];
const samples=[{id:'catalog.page.extract',name:'网页正文提取',desc:'提取公开页面的正文与标题',site:'example.org',url:'https://example.org/',version:'1.0.0',owner:'示例发布者',kind:'catalog',installed:false,delegated:false,verified:true},{id:'catalog.price.watch',name:'商品价格检查',desc:'收集页面的公开标价信息',site:'store.example',url:'https://store.example/',version:'1.2.0',owner:'示例发布者',kind:'catalog',installed:false,delegated:false,verified:true},{id:'catalog.news.summary',name:'新闻信息整理',desc:'从网页提取信息用于摘要',site:'news.example',url:'https://news.example/',version:'0.8.0',owner:'示例发布者',kind:'catalog',installed:true,delegated:false,verified:true},{id:'catalog.unverified',name:'未知来源任务',desc:'来源尚未完成核验',site:'unknown.example',url:'https://unknown.example/',version:'0.1.0',owner:'来源未知',kind:'catalog',installed:false,delegated:false,verified:false}];
const names=['网页资料检索','产品价格核对','表单信息整理','订单状态查询','文章标题提取','公开数据对照','候选页面核查','网页内容摘要','任务结果整理','文章链接收集','市场链接汇总','数据导出预检'];
let state;
let runTimers=[];
const clearRunTimers=()=>{runTimers.forEach(t=>clearTimeout(t));runTimers=[]};
function reset(){clearRunTimers();state={design:$('devDesign').value,width:$('devWidth').value,count:Number($('devCount').value),scenario:$('devScenario').value,outcome:$('devOutcome').value,theme:document.body.dataset.theme,page:'scripts',stage:'list',search:'',addSearch:'',catalog:false,filterOpen:false,status:'all',favoriteOnly:false,updatesOnly:false,sort:'recommended',favoriteIds:new Set(),detailId:null,reviewAck:false,receipt:null,installed:new Set(),disabled:new Set(),pageNumber:1,addPage:1,help:false,menuFrom:null,unknownIds:new Set(),wizardStep:0,run:null,runHistory:[],runQuery:'',runCount:0,runEntry:'scripts',detailFrom:'scripts'}; $('screen').dataset.width=state.width;render()}
const mockRecords=[];
function tasks(){let rows=pins.map(x=>({...x,installed:state.installed.has('removed:'+x.id)?false:true,permission:true,enabled:!state.disabled.has(x.id),update:false,unknown:state.unknownIds.has(x.id)}));
if(state.scenario==='uninstalled')rows[0].installed=state.installed.has(rows[0].id);
if(state.scenario==='permission')rows[0].permission=false;
if(state.scenario==='disabled')rows[0].enabled=false;
if(state.scenario==='updated')rows[0].update=true;
if(state.scenario==='unverified')rows[0].verified=false;
if(state.scenario==='unknown')rows[0].unknown=true;
if(state.count===0)return [];
if(state.count>2)for(let i=0;i<state.count-2;i++){let base=samples[i%3];rows.push({...base,id:'fixture.'+i,name:names[i%names.length]+(i>=12?' '+(i+1):''),kind:'fixture',installed:i%5!==0,delegated:false,verified:i%13!==0,permission:i%11!==0,enabled:i%9!==0,update:i%7===0,unknown:i%31===0})}
return rows;
}
function catalogue(){const p=tasks().filter(x=>x.kind==='pin');return [...p,...samples.map(x=>({...x,installed:x.installed||state.installed.has(x.id),permission:true,enabled:true,update:false,unknown:state.unknownIds.has(x.id)}))]}
function status(x){
 const r=state.run;
 if(r&&r.taskId===x.id&&r.version===x.version){
   if(['submitting','running'].includes(r.state))return {txt:'执行中',class:'warn',key:'running'};
   if(r.state==='unknown')return {txt:'待核对',class:'warn',key:'attention'};
 }
 if(x.unknown)return {txt:'待核对',class:'warn',key:'attention'};
 if(!x.verified)return {txt:'来源异常',class:'bad',key:'attention'};
 if(!x.installed)return {txt:'未安装',class:'',key:'attention'};
 if(!x.delegated)return {txt:'未委托',class:'',key:'attention'};
 if(!x.permission)return {txt:'权限不足',class:'warn',key:'attention'};
 if(!x.enabled)return {txt:'已停用',class:'',key:'disabled'};
 if(x.update)return {txt:'版本变化',class:'warn',key:'attention'};
 return {txt:'可运行',class:'ok',key:'available'};
}
function matches(x,q){let s=q.trim().toLocaleLowerCase();return !s||[x.name,x.desc,x.site,x.id,x.owner].some(y=>String(y).toLocaleLowerCase().includes(s))}
function sortRows(rows){return rows.sort((a,b)=>state.sort==='name'?a.name.localeCompare(b.name,'zh-CN'):state.sort==='site'?a.site.localeCompare(b.site):Number(state.favoriteIds.has(b.id))-Number(state.favoriteIds.has(a.id))||a.name.localeCompare(b.name,'zh-CN'))}
function filterRows(){return sortRows(tasks().filter(x=>matches(x,state.search)&&(!state.favoriteOnly||state.favoriteIds.has(x.id))&&(!state.updatesOnly||x.update)&&(state.status==='all'||status(x).key===state.status)))}
function addRows(){return catalogue().filter(x=>matches(x,state.addSearch))}
function row(x,scope='scripts'){
 const st=status(x),add=scope==='add';
 const label=add?(x.installed&&x.delegated?'已委托':x.installed?'已安装':'未安装'):st.txt;
 const r=state.run,linked=r&&r.taskId===x.id&&r.version===x.version;
 const tracking=linked&&['submitting','running'].includes(r.state),unknown=linked&&r.state==='unknown';
 const ready=!add&&x.kind==='pin'&&st.key==='available';
 const actionName=tracking||unknown?'view-run':ready?'open-run':'detail';
 const actionLabel=tracking?'查看进度':unknown?'核对结果':ready?'运行':'查看原因';
 const style=ready?'is-primary':tracking?'is-progress':'is-quiet';
 return `<article class="scriptrow" data-task="${esc(x.id)}"><div class="rowicon">${ic(x.kind==='catalog'?'book':'globe')}</div><div class="rowcontent"><div class="rowtitle"><button class="titlelink" type="button" data-action="detail" data-id="${esc(x.id)}" data-scope="${scope}">${esc(x.name)}</button>${state.favoriteIds.has(x.id)&&!add?`<span class="star" title="已收藏">${ic('star',true)}</span>`:''}</div><div class="rowdesc" title="${esc(x.desc)}">${esc(x.desc)}</div><div class="rowmeta"><span class="site" title="${esc(x.site)}">${esc(x.site)}</span><span class="separator"></span><span class="status ${add&&x.installed&&x.delegated?'ok':st.class}">${esc(label)}</span></div></div><div class="rowtools">${add?'':`<button class="rowrun ${style}" type="button" data-action="${actionName}" data-id="${esc(x.id)}" data-scope="scripts" aria-label="${esc(actionLabel+'：'+x.name)}">${actionLabel}</button>`}<button class="rowaction" type="button" data-action="detail" data-id="${esc(x.id)}" data-scope="${scope}" aria-label="查看${esc(x.name)}详情" title="查看详情">${ic('chev',true)}</button></div></article>`;
}
function pageTop(){return `<div class="pagehead"><div><h1>脚本</h1><p class="subtext">查找并管理自动化任务</p></div><button class="primary" type="button" data-action="start-add">${ic('plus',true)}添加</button></div>`}
function searchBox(val,id,placeholder){return `<div class="searchbox">${ic('search',true)}<label for="${id}" class="sr">${esc(placeholder)}</label><input id="${id}" type="search" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder)}" value="${esc(val)}">${val?`<button type="button" class="clear" data-action="clear-${id==='scriptSearch'?'search':'addsearch'}" aria-label="清空搜索">${ic('x',true)}</button>`:''}</div>`}
function filters(){const active=state.status!=='all'||state.favoriteOnly||state.updatesOnly||state.sort!=='recommended';return `<div class="filterholder" id="filterholder"><button class="filterbtn" type="button" id="filterButton" aria-label="筛选与排序" aria-haspopup="dialog" aria-expanded="${state.filterOpen}" aria-controls="filterPanel" data-action="toggle-filter" title="筛选与排序">${ic('filter')}${active?'<span class="filterdot" aria-hidden="true"></span>':''}</button><div class="filterpop" id="filterPanel" role="dialog" aria-label="筛选与排序" ${state.filterOpen?'':'hidden'}><div class="filtertitle"><span>筛选与排序</span><button type="button" class="iconbtn" style="width:26px;height:26px" aria-label="关闭筛选" data-action="close-filter">${ic('x',true)}</button></div><div class="filtergroup"><label for="filterStatus">状态</label><select id="filterStatus"><option value="all" ${state.status==='all'?'selected':''}>全部状态</option><option value="available" ${state.status==='available'?'selected':''}>可运行</option><option value="attention" ${state.status==='attention'?'selected':''}>需关注</option><option value="disabled" ${state.status==='disabled'?'selected':''}>已停用</option></select></div><div class="filtergroup"><label for="filterSort">排序</label><select id="filterSort"><option value="recommended" ${state.sort==='recommended'?'selected':''}>收藏优先</option><option value="name" ${state.sort==='name'?'selected':''}>名称</option><option value="site" ${state.sort==='site'?'selected':''}>网站</option></select></div><label class="filtercheck"><input type="checkbox" id="filterFavorites" ${state.favoriteOnly?'checked':''}>只看收藏</label><label class="filtercheck"><input type="checkbox" id="filterUpdates" ${state.updatesOnly?'checked':''}>仅看有更新</label><div class="filterfoot"><button type="button" class="text-link" data-action="clear-filters">清除筛选</button><button type="button" class="secondary" data-action="close-filter">完成</button></div></div></div>`}
function scriptsPage(){const results=filterRows(),start=(state.pageNumber-1)*20,visible=results.slice(start,start+20),pages=Math.max(1,Math.ceil(results.length/20));state.pageNumber=Math.min(state.pageNumber,pages);return `<div class="content">${pageTop()}<div class="searchline">${searchBox(state.search,'scriptSearch','搜索任务或网站')}${filters()}</div><div class="resultmeta"><span id="resultsCount" role="status" aria-live="polite">${results.length} 个脚本</span>${state.status!=='all'||state.favoriteOnly||state.updatesOnly||state.sort!=='recommended'?'<button class="text-link" type="button" data-action="clear-filters">重置条件</button>':''}</div><div id="resultsList">${results.length?`<div class="scriptlist">${visible.map(x=>row(x)).join('')}</div>`:`<div class="empty"><div class="emptyicon">${ic(state.count===0?'layers':'search')}</div><h2>${state.count===0&&!state.search?'还没有脚本':'没有找到匹配任务'}</h2><p>${state.count===0&&!state.search?'添加可用于 Web Flow 的任务，开始使用自动化。':'尝试其他关键词，或清除筛选条件。'}</p><button class="secondary" type="button" data-action="${state.count===0&&!state.search?'start-add':'clear-all'}">${state.count===0&&!state.search?'添加脚本':'清除条件'}</button></div>`}</div>${pages>1?`<div class="pagination"><button class="secondary" data-action="page-prev" type="button" ${state.pageNumber===1?'disabled':''}>上一页</button><span>${state.pageNumber} / ${pages}</span><button class="secondary" data-action="page-next" type="button" ${state.pageNumber===pages?'disabled':''}>下一页</button></div>`:''}</div>`}
function addHeader(){return `<div class="newhead"><button type="button" class="backbtn" data-action="back-scripts">${ic('left',true)}返回脚本</button><h1>添加脚本</h1><p class="subtext">查找任务，查看适用范围并继续</p></div>`}
function groupedAdd(){const list=addRows(),a=list.filter(x=>x.delegated),b=list.filter(x=>!x.delegated&&x.installed),c=list.filter(x=>!x.delegated&&!x.installed);return `<div class="sectionbar"><span class="sectionlabel">可用于 Web Flow</span><span class="tiny">${a.length} 项</span></div><div class="scriptlist">${a.length?a.map(x=>row(x,'add')).join(''):`<p class="subtext" style="padding:16px 0">没有符合条件的任务</p>`}</div>${state.catalog?`<div class="sectionbar"><span class="sectionlabel">OpenDesk 任务目录 · 示例</span><button type="button" class="text-link" data-action="hide-catalog">收起</button></div><div class="scriptlist">${[...b,...c].map(x=>row(x,'add')).join('')||'<p class="subtext" style="padding:16px 0">暂无匹配任务</p>'}</div>`:`<div class="sectionbar" style="margin-top:26px"><span class="sectionlabel">更多方式</span></div><button type="button" class="simpleentry" data-action="browse-catalog"><span class="entryicon">${ic('book')}</span><span class="grow"><strong>浏览任务目录</strong><p>通过 OpenDesk 审阅和安装新任务</p></span><span class="entrychev">${ic('chev',true)}</span></button><button type="button" class="simpleentry" data-action="create-task"><span class="entryicon">${ic('code')}</span><span class="grow"><strong>创建自己的脚本</strong><p>使用宿主的开发工具</p></span><span class="entrychev">${ic('chev',true)}</span></button>`}</div>`}
function addPage(){if(state.design==='c'&&state.wizardStep===0)return `<div class="content">${addHeader()}<h2 style="margin-top:26px">你想怎样添加？</h2><div class="choicecards"><button class="choicecard" data-action="wizard-installed"><span class="entryicon">${ic('layers')}</span><span class="grow"><strong>选择当前可用任务</strong><p>查看已固定委托的任务</p></span>${ic('chev',true)}</button><button class="choicecard" data-action="browse-catalog"><span class="entryicon">${ic('book')}</span><span class="grow"><strong>从任务目录添加</strong><p>原任务目录完成安装审阅</p></span>${ic('chev',true)}</button><button class="choicecard" data-action="create-task"><span class="entryicon">${ic('code')}</span><span class="grow"><strong>创建新脚本</strong><p>到 OpenDesk 开发工作台</p></span>${ic('chev',true)}</button></div></div>`;
return `<div class="content">${addHeader()}<div class="searchline">${searchBox(state.addSearch,'addSearch','搜索脚本、用途或网站')}</div><div class="resultmeta"><span>${addRows().length} 项结果</span>${state.addSearch?'<button class="text-link" data-action="clear-addsearch" type="button">清空</button>':''}</div>${addRows().length?groupedAdd():`<div class="empty"><div class="emptyicon">${ic('search')}</div><h2>没有找到任务</h2><p>试试其他名称，或清除当前搜索。</p><button type="button" class="secondary" data-action="clear-addsearch">清空搜索</button></div>`}${state.catalog?'<p class="tip">本页目录项为离线演示数据。正式安装和可委托范围由 OpenDesk 宿主审核。</p>':''}</div>`}
function reviewed(){return catalogue().concat(tasks().filter(x=>x.kind==='fixture')).find(x=>x.id===state.detailId)}
function detailPage(){const x=reviewed();if(!x)return scriptsPage();if(state.detailFrom==='scripts')return scriptDetailPage(x);const z=status(x),eligible=x.kind==='pin'&&!x.installed&&x.verified&&!x.unknown&&!x.update;const catalogInstall=x.kind!=='pin'&&!x.installed&&x.verified&&!x.unknown;const canInstall=eligible||catalogInstall;let msg='',noticeType='';

 const id=state.run.clientRequestId,simOutcome=state.run.simOutcome;
 const later=(ms,fn)=>runTimers.push(setTimeout(()=>{
   if(!state.run||state.run.clientRequestId!==id||!['submitting','running'].includes(state.run.state))return;
   fn();rememberRun();
   if(['run-progress','run-result'].includes(state.stage)||state.stage==='list'&&['scripts','history'].includes(state.page))render();
 },ms));
 later(420,()=>{state.run.submitted=true;state.run.state='running';});
 later(1450,()=>{
   state.run.state=simOutcome==='success'?'completed':simOutcome==='failed'?'failed':'unknown';
   if(state.run.state==='failed')state.run.error='E_DEMO_FAILED：预设演示失败，没有真实网页执行';

   const busy=state.run&&['submitting','running'].includes(state.run.state);
   if(state.stage!=='run-setup'||!x||x.kind!=='pin'||status(x).key!=='available'||!q||q.length>120||busy){
     if($('runFormError'))$('runFormError').textContent='无法执行：请检查权限、关键词与其他活动请求。';return;
   }
   clearRunTimers();
   state.run={clientRequestId:'demo:webflow:'+String(++state.runCount).padStart(4,'0'),taskId:x.id,version:x.version,name:x.name,site:x.site,query:q,state:'submitting',submitted:false,simOutcome:state.outcome,auditChecks:0,error:''};
   state.stage='run-progress';rememberRun();render();scheduleRun();return;
 }
 case'view-run':
   if(!state.run||state.run.taskId!==id)return;
   state.stage=['submitting','running'].includes(state.run.state)?'run-progress':'run-result';
   state.detailId=id;render();requestAnimationFrame(()=>$('runHeading')?.focus());return;
 case'view-history-run':{
   const past=state.runHistory.find(x=>x.clientRequestId===id);if(!past)return;
   if(!state.run||state.run.clientRequestId!==id)state.run={...past};
   state.detailId=state.run.taskId;state.stage=['submitting','running'].includes(state.run.state)?'run-progress':'run-result';render();return;
 }
 case'stop-run':
   if(!state.run||!['submitting','running'].includes(state.run.state))return;
   clearRunTimers();state.run.state='unknown';state.run.error='停止请求已提出，但无真实副作用撤销证据';rememberRun();state.stage='run-result';render();return;
 case'check-run':
   if(!state.run||state.run.state!=='unknown')return;
   state.run.auditChecks++;rememberRun();render();requestAnimationFrame(()=>$('runHeading')?.focus());return;
 case'toggle-filter':state.filterOpen=!state.filterOpen;render(true);if(state.filterOpen)requestAnimationFrame(()=>$('filterStatus')?.focus());return;
 case'close-filter':state.filterOpen=false;render();$('filterButton')?.focus();return;
 case'clear-filters':state.filterOpen=false;state.status='all';state.favoriteOnly=false;state.updatesOnly=false;state.sort='recommended';state.pageNumber=1;render();$('filterButton')?.focus();return;
 case'clear-all':state.search='';state.status='all';state.favoriteOnly=false;state.updatesOnly=false;state.sort='recommended';state.pageNumber=1;render();$('scriptSearch')?.focus();return;
 case'clear-search':state.search='';state.pageNumber=1;render();$('scriptSearch')?.focus();return;
 case'clear-addsearch':state.addSearch='';render();$('addSearch')?.focus();return;
 case'page-prev':state.pageNumber=Math.max(1,state.pageNumber-1);render();return;
 case'page-next':state.pageNumber++;render();return;
 case'help':navigate('help');return;
 case'settings':navigate('settings');return;
 case'confirm-install':{
   const t=currentById(state.detailId);if(!state.reviewAck||!t||t.installed||!t.verified||t.unknown)return;
   const outcome=state.outcome;state.receipt={name:t.name,id:t.id,outcome,delegated:t.delegated};
   if(outcome==='success')state.installed.add(t.id);
   if(outcome==='unknown')state.unknownIds.add(t.id);
   mockRecords.unshift({name:t.name,outcome});state.stage='receipt';render();return;
 }
 case'finish-receipt':state.stage='list';state.page='scripts';render();return;
 default:return;
 }
}
document.addEventListener('click',ev=>{let target=ev.target.closest('[data-action]');if(target){ev.preventDefault();action(target.dataset.action,target.dataset.id,target.dataset.scope);return}if(state.filterOpen&&!ev.target.closest('#filterholder')){state.filterOpen=false;render(true)}});
document.addEventListener('submit',ev=>{if(ev.target.id==='runForm'){ev.preventDefault();action('confirm-run')}});
document.addEventListener('input',ev=>{if(ev.isComposing)return;if(ev.target.id==='runQuery'){state.runQuery=ev.target.value;const b=$('confirmRun');if(b)b.disabled=!state.runQuery.trim()||Boolean(state.run&&['submitting','running'].includes(state.run.state));if($('runFormError'))$('runFormError').textContent='';return;}if(ev.target.id==='scriptSearch'){state.search=ev.target.value;state.pageNumber=1;render(true)}else if(ev.target.id==='addSearch'){state.addSearch=ev.target.value;render(true)}});
document.addEventListener('compositionend',ev=>{if(ev.target.id==='runQuery'){state.runQuery=ev.target.value;const b=$('confirmRun');if(b)b.disabled=!state.runQuery.trim();return;}if(ev.target.id==='scriptSearch'||ev.target.id==='addSearch'){let q=ev.target.id==='scriptSearch'?'search':'addSearch';state[q]=ev.target.value;render(true)}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='filterStatus')state.status=t.value;else if(t.id==='filterSort')state.sort=t.value;else if(t.id==='filterFavorites')state.favoriteOnly=t.checked;else if(t.id==='filterUpdates')state.updatesOnly=t.checked;else if(t.id==='reviewAck'){state.reviewAck=t.checked;render(true);return}else return;state.pageNumber=1;render(true)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(state.filterOpen){ev.preventDefault();action('close-filter');return}if(state.stage==='run-setup'){ev.preventDefault();action('return-run');return}if(state.stage==='run-progress'||state.stage==='run-result'){ev.preventDefault();action('back-scripts');return}if(state.stage==='detail'){ev.preventDefault();action(state.detailFrom==='add'?'back-add':'back-scripts');return}if(state.stage==='create'||state.stage==='receipt'){ev.preventDefault();action('back-add');return}if(state.stage==='add'){ev.preventDefault();action('back-scripts');return}}if(ev.key==='/'&&state.stage==='list'&&state.page==='scripts'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){ev.preventDefault();$('scriptSearch')?.focus()}if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'||ev.key==='Home'||ev.key==='End'){const tabs=[...document.querySelectorAll('.tab')];const i=tabs.indexOf(document.activeElement);if(i>=0){ev.preventDefault();let n=ev.key==='Home'?0:ev.key==='End'?tabs.length-1:(i+(ev.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;state.page=tabs[n].dataset.page;state.stage='list';render();document.querySelectorAll('.tab')[n].focus()}}});
document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{state.page=el.dataset.page;state.stage='list';state.filterOpen=false;render()}));
$('devDesign').addEventListener('change',e=>{state.design=e.target.value;state.wizardStep=0;state.stage='list';state.page='scripts';state.catalog=false;$('devDescription').textContent=state.design==='a'?'A · 一个搜索入口，优先显示已可用任务；目录和创建是次级路径。':state.design==='b'?'B · 快速命令弹层，减少页面跳转，但 320px 空间和焦点管理成本更高。':'C · 先选择添加方式，再搜索任务；理解成本低，但完成路径更长。';render()});
$('devWidth').addEventListener('change',e=>{$('screen').dataset.width=e.target.value;state.width=e.target.value});$('devCount').addEventListener('change',e=>{state.count=Number(e.target.value);state.stage='list';state.search='';render()});$('devScenario').addEventListener('change',e=>{state.scenario=e.target.value;state.stage='list';state.page='scripts';render()});$('devOutcome').addEventListener('change',e=>{state.outcome=e.target.value});$('devTheme').addEventListener('click',()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';$('devTheme').textContent=document.body.dataset.theme==='dark'?'浅色':'深色'});$('devReset').addEventListener('click',()=>{document.body.dataset.theme='light';$('devTheme').textContent='深色';reset()});
reset();
})();
</script>
</body>
</html>
