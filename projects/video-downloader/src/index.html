<main class="vd" aria-label="视频下载">
  <div class="vd-head">
    <span>当前网页媒体</span>
    <button type="button" id="vd-detect" aria-label="检测当前网页" title="检测当前网页">↻ 检测</button>
  </div>
  <p id="vd-message" role="status" aria-live="polite">点击检测当前网页的 HTML5 视频。</p>
  <div id="vd-list" class="vd-list" aria-label="检测到的媒体"></div>
  <section class="vd-job" aria-label="下载任务">
    <div class="vd-job-top"><strong>下载状态</strong><span id="vd-state">未开始</span></div>
    <progress id="vd-progress" max="100" value="0" aria-label="下载进度"></progress>
    <p id="vd-info">MP4/WebM 直接下载；完整非加密 HLS 按清晰度下载分段。支持的 H.264/AAC HLS 自动封装为 MP4，不重新编码。</p>
    <button id="vd-stop" type="button" disabled>停止下载</button>
  </section>
  <p class="vd-foot">仅保存有权下载的非 DRM 视频。Chrome 下载完成不等于已验证可播放。</p>
</main>
