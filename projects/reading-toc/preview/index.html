  --space-2:8px;

  --od-light-warning-border:#dcc58a;
  --od-light-warning-ink:#76501b;
  --od-warning-bg:var(--od-light-warning-bg);

  --od-page-gutter:11px;

  --od-dark-ink:#e9eef7;
  --od-dark-sub:#b3c1d3;
  --od-dark-line:#374457;
  --od-dark-brand:#3566ba;
  --od-dark-paper:#151c28;
  --od-dark-bg:#101722;
  --od-dark-input-border:#6d809b;
  --od-dark-accent-ink:#9dc1ff;

  --od-input-border:var(--input);--od-focus:var(--ring);--od-accent-ink:var(--foreground);--od-muted:var(--muted);

/* R20/R23 Sidebar primitives and page base; semantic values are in design-tokens.css.
 * Scoped to the trusted Sidebar and tool tab, NOT reusable in Workspace/Options. */
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;font-size:13px;line-height:1.45;color:var(--od-ink);background:var(--od-bg);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;min-width:0}
body{display:flex;flex-direction:column;margin:0;background:var(--od-bg)}
h1,h2,h3{margin:0;letter-spacing:-.015em}
p{margin:var(--space-2) 0;overflow-wrap:anywhere}
/* Emphasis inside a paragraph changes weight, never its size or semantic ink. */
p :is(strong,b){font-size:inherit;color:inherit;font-weight:650}
main{min-width:0}
section{min-width:0}
.hint,aside{font-size:var(--od-note-size);color:var(--od-sub)}
.identity{font:var(--od-meta-size)/1.5 ui-monospace,monospace;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin:var(--space-2) 0;min-width:0}
label{display:block;margin:var(--space-2) 0 var(--space-1)}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--od-input-border);border-radius:var(--radius-control);background:var(--od-paper);color:var(--od-ink);font:inherit;padding:var(--space-2) var(--space-3)}
input,select{min-height:36px}
input[type=checkbox]{width:auto;min-height:0;margin-right:6px}
textarea{display:block;margin:var(--space-2) 0 var(--space-3);font:var(--od-note-size)/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical;tab-size:2}
pre{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;max-height:300px;overflow:auto;background:var(--od-muted);padding:var(--space-2);border-radius:var(--radius-control);font:var(--od-meta-size)/1.55 ui-monospace,monospace}
button{max-width:100%;border:0;border-radius:var(--radius-control);background:var(--od-brand);color:var(--od-on-brand);padding:var(--space-2) var(--space-3);min-height:34px;font:inherit;cursor:pointer;overflow-wrap:anywhere}
button:disabled{opacity:.48;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(.97)}
details{margin:var(--space-2) 0}
summary{cursor:pointer;color:var(--od-ink);overflow-wrap:anywhere}
details>section{margin-top:var(--space-3)}
:focus-visible{outline:2px solid var(--od-focus);outline-offset:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;clip-path:inset(50%)}

.od-toolbar{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.od-page-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);min-height:var(--od-icon-size);min-width:0}

@media(max-width:240px){.od-page-head{flex-wrap:wrap}.od-page-actions{flex-wrap:wrap;max-width:100%}}
.od-stack{display:grid;gap:var(--space-2);min-width:0}

.od-surface{min-width:0;background:var(--od-paper);border:1px solid var(--od-line);border-radius:var(--radius-surface)}

/* Sandbox consumers receive this public slice without the document button reset. */
.od-button:disabled,.od-icon-button:disabled{opacity:.48;cursor:not-allowed}
/* Opt-in unframed icon action for compact product toolbars.

.od-icon-button--quiet{border-color:transparent;background:transparent}

<script id="od-preview-shell-behavior">/* Offline shell only. No installation, permission, storage or network APIs. */
(()=>{
  'use strict';
  const byId=id=>document.getElementById(id);
  const config=JSON.parse(byId('opendesk-preview-shell-data').textContent);
  const decode=value=>new TextDecoder().decode(Uint8Array.from(atob(value),char=>char.charCodeAt(0)));
  const trustedFrameHtml=config.frameBase64?decode(config.frameBase64):null;
  const iframe=byId('opendesk-preview-frame');
  const nav=[...document.querySelectorAll('.workbench-nav [role="tab"]')].filter(tab=>!tab.hidden);
  const panels={detail:byId('od-preview-extension-detail'),list:byId('od-preview-return'),
    other:byId('od-preview-other'),uninstalled:byId('od-preview-uninstalled')};
  const back=byId('sidebar-tool-back'),remove=byId('sidebar-tool-remove');
  const modal=byId('od-preview-confirm-uninstall');
  let extensionPage='detail';
  const scenario=byId('od-preview-scenario'),theme=byId('od-preview-theme');
  function currentFrameHtml(){
    const key=scenario?.value+':'+theme?.value;
    return config.variants?.[key]?decode(config.variants[key]):trustedFrameHtml;
  }
  function resetPreview(){
    if(iframe)iframe.srcdoc=currentFrameHtml();
    byId('od-preview-app')?.dispatchEvent(new Event('opendesk-preview-reset'));
    extensionPage='detail';activateTab(byId('tab-tools'));
    const feedback=byId('od-preview-controls-feedback');
    if(feedback)feedback.textContent='仅重置离线模拟数据；没有修改真实权限或工具。';
  }
  for(const field of [scenario,theme])field?.addEventListener('change',()=>{
    if(!config.variants?.[scenario?.value+':'+theme?.value])return;
    resetPreview();
  });
  byId('od-preview-restore')?.addEventListener('click',()=>{
    if(scenario)scenario.value=config.scenario;
    if(theme)theme.value=config.theme;
    resetPreview();
  });
  byId('sidebar-tool-title').textContent=config.title;
  remove.disabled=false;
  remove.closest('.sidebar-tool-header-actions').hidden=false;
  // This preview must never claim the real tool and its stored data will be removed.
  remove.setAttribute('aria-label','模拟卸载当前工具（不会删除真实数据）');
  remove.title='模拟卸载（不会删除真实数据）';
  if(iframe)iframe.srcdoc=trustedFrameHtml;
  function showPanel(name,tab){
    for(const [id,node] of Object.entries(panels))node.hidden=id!==name;
    panels[name].setAttribute('aria-labelledby',tab.id);
  }
  function activateTab(tab){
    if(!tab||!nav.includes(tab))return;
    for(const current of nav){
      const active=current===tab;
      current.setAttribute('aria-selected',String(active));
      // Remap production aria-controls to the panels which actually exist in this mock.
      current.setAttribute('aria-controls',current.id==='tab-tools'?
        panels[extensionPage].id:panels.other.id);
      current.tabIndex=active?0:-1;
    }
    if(tab.id==='tab-tools')showPanel(extensionPage,tab);
    else{
      byId('od-preview-other-title').textContent=tab.textContent.trim()+' · 预览占位';
      showPanel('other',tab);
    }
  }
  nav.forEach(tab=>{
    tab.addEventListener('click',()=>activateTab(tab));
    tab.addEventListener('keydown',event=>{
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
      event.preventDefault();
      const index=nav.indexOf(tab);
      const target=event.key==='Home'?nav[0]:event.key==='End'?nav.at(-1):
        nav[(index+(event.key==='ArrowLeft'?-1:1)+nav.length)%nav.length];
      activateTab(target);target.focus();
    });
  });
  activateTab(byId('tab-tools'));
  back.addEventListener('click',()=>{
    if(!back.dispatchEvent(new CustomEvent('opendesk-preview-back',{cancelable:true})))return;
    extensionPage='list';activateTab(byId('tab-tools'));
    byId('od-preview-reopen').focus();
  });
  byId('od-preview-reopen').addEventListener('click',()=>{
    extensionPage='detail';activateTab(byId('tab-tools'));back.focus();
  });
  byId('od-preview-to-extensions').addEventListener('click',()=>{
    activateTab(byId('tab-tools'));byId('tab-tools').focus();
  });
  remove.addEventListener('click',()=>modal.showModal());
  // The close event fires for both the cancel button and the native Escape key.
  modal.addEventListener('close',()=>{
    if(extensionPage==='detail'&&!panels.detail.hidden)remove.focus();
  });
  byId('od-preview-cancel-uninstall').addEventListener('click',()=>modal.close());
  byId('od-preview-accept-uninstall').addEventListener('click',()=>{
    extensionPage='uninstalled';
    modal.close();
    if(iframe)iframe.srcdoc='';activateTab(byId('tab-tools'));
    byId('od-preview-reset').focus();
  });
  byId('od-preview-reset').addEventListener('click',()=>{
    if(iframe)iframe.srcdoc=currentFrameHtml();
    byId('od-preview-app')?.dispatchEvent(new Event('opendesk-preview-reset'));
    extensionPage='detail';activateTab(byId('tab-tools'));back.focus();
  });
})();

</script>

 const decode=value=>new TextDecoder().decode(Uint8Array.from(atob(value),c=>c.charCodeAt(0)));
 const post=(kind,value)=>iframe.contentWindow?.postMessage({kind,...value},'*');
 function sync(){
  post('opendesk-toc-preview-locale',{locale:language.value});
  post('opendesk-toc-preview-scenario',{scenario:scenario.value});
  post('opendesk-toc-preview-site',{site:site.value,collapsed:collapsedBySite[site.value]===true});
 }
 function changeSurface(){
  siteControl.hidden=surface.value!=='page-overlay';
  const value=frames[surface.value];
  if(!value)return;
  const content=decode(value);
  if(iframe.srcdoc!==content)iframe.srcdoc=content;
  else sync();
  output.textContent='已显示'+(surface.value==='page-overlay'?'可信网页悬浮 view.js':'正式沙箱工具 UI')+'；章节内容与动作均为离线模拟。';
 }
 surface.addEventListener('change',changeSurface);
 language.addEventListener('change',()=>{sync();output.textContent='已更新模拟应用语言；不会刷新或翻译网页章节。';});
 scenario.addEventListener('change',()=>{sync();output.textContent='已切换模拟状态；未读取网页或调用 Chrome 接口。';});
 site.addEventListener('change',()=>{
  post('opendesk-toc-preview-site',{site:site.value,collapsed:collapsedBySite[site.value]===true});
  output.textContent='模拟网站 '+site.value.toUpperCase()+'：'+(collapsedBySite[site.value]===true?'恢复收起状态':'默认展开')+'，与其他网站独立。';
 });
 iframe.addEventListener('load',sync);
 document.getElementById('od-preview-reset').addEventListener('click',changeSurface);
 window.addEventListener('message',event=>{
  if(event.source!==iframe.contentWindow)return;
  if(event.data?.kind==='opendesk-toc-preview-collapse'&&
     (event.data.site==='a'||event.data.site==='b')&&typeof event.data.collapsed==='boolean'){
   collapsedBySite[event.data.site]=event.data.collapsed;
   output.textContent='模拟网站 '+event.data.site.toUpperCase()+' 已'+(event.data.collapsed?'收起':'展开')+'；仅本网站记忆。';
   return;
  }
  if(event.data?.kind==='opendesk-toc-preview-navigation'&&typeof event.data.label==='string')
   output.textContent='模拟章节定位：'+event.data.label.slice(0,150)+'（未操作实际网页）';
 });
 changeSurface();
})();
