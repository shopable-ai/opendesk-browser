<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="od-preview-kind" content="DESIGN_REVIEW_ONLY_NOT_SOURCE_PARITY">
  <title>Mouse Gestures · 极简 Side Panel 交互预览</title>
  <!--
    OD-MOUSE-GESTURES-R4-MINIMAL-SIDEPANEL
    设计稿；不是 OpenDesk 已安装代码、授权回执或真实右键手势。
    视觉依据：
      src/ui/design-tokens.css (OpenDesk R23 semantic tokens)
      src/ui/design-system.css (od-button / od-icon-button / od-collection)
      docs/api/sidebar-tool-development.zh-CN.md (侧栏标题与简洁内容)
      .agents/skills/opendesk-ui-preview/SKILL.md (模拟隔离及证据边界)
    已安装授权由原 Installer / Page Authority 管理；本页面不申请任何权限。
    单一滑块仅改变本页内存。刷新后恢复开启的演示初始状态。
    当前 R1 Demo 仅验证左滑后退；其他方向仅为规划示意。
  -->
  <style>
    :root {
      --od-ink:#1b2c49; --od-sub:#5b6e86; --od-line:#dfe6ef;
      --od-brand:#365eda; --od-paper:#fff; --od-bg:#fff;
      --od-focus:#365eda; --od-muted:#f5f7fb;
      --od-on-brand:#fff; --od-input-border:#7f8da1;
      --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
      --radius-control:8px; --radius-surface:12px; --od-icon-size:34px;
      --od-body-size:13px; --od-note-size:12px; --od-meta-size:11px;
      font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
      color:var(--od-ink); background:var(--od-bg); color-scheme:light;
    }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    body { margin:0; min-width:0; min-height:100vh; background:#f5f7fb; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    :focus-visible { outline:2px solid var(--od-focus); outline-offset:2px; }
    h1,h2,p { margin:0; }
    .preview-viewport { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 12px; }
    .preview-device { width:min(360px,100%); min-height:440px; border:1px solid var(--od-line);
      border-radius:var(--radius-surface); overflow:hidden; background:var(--od-paper);
      box-shadow:0 10px 36px #1b2c490e; }
    .od-page-head { min-height:51px; display:flex; align-items:center; gap:var(--space-2);
      padding:var(--space-2) var(--space-3); border-bottom:1px solid var(--od-line); }
    .od-page-title { flex:1; min-width:0; font-size:var(--od-body-size); font-weight:650; }
    .od-icon-button { display:inline-grid; place-items:center; flex:none;
      width:var(--od-icon-size); height:var(--od-icon-size); padding:0;
      border:1px solid transparent; border-radius:var(--radius-control);
      background:transparent; color:var(--od-sub); }
    .od-icon-button:hover { background:var(--od-muted); }
    .od-icon-button svg { width:18px; height:18px; fill:none; stroke:currentColor;
      stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .od-page { padding:var(--space-4) var(--space-3); }
    .setting-row { display:flex; align-items:center; justify-content:space-between;
      gap:var(--space-3); min-height:48px; }
    .setting-copy { min-width:0; }
    .setting-copy label { font-size:var(--od-body-size); font-weight:650; display:block; }
    .od-note { color:var(--od-sub); font-size:var(--od-note-size); line-height:1.55; }
    .setting-copy .od-note { margin-top:var(--space-1); }
    .mg-switch { appearance:none; -webkit-appearance:none; flex:none; position:relative;
      width:38px; height:22px; margin:0; border:0; border-radius:999px;
      background:#9ba9bd; cursor:pointer; transition:background .12s ease; }
    .mg-switch:before { content:""; position:absolute; width:18px; height:18px; top:2px;
      left:2px; border-radius:50%; background:#fff; box-shadow:0 1px 3px #0003;
      transition:transform .12s ease; }
    .mg-switch:checked { background:var(--od-brand); }
    .mg-switch:checked:before { transform:translateX(16px); }
    .mg-switch:focus-visible { outline:2px solid var(--od-focus); outline-offset:3px; }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:var(--space-2);
      padding-top:var(--space-4); margin-top:var(--space-4); margin-bottom:var(--space-3);
      border-top:1px solid var(--od-line); }
    .section-head h2 { font-size:var(--od-note-size); font-weight:650; }
    .section-head .od-note { font-size:var(--od-meta-size); }
    .od-collection { display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
      gap:var(--space-2); margin:0; padding:0; list-style:none; }
    .od-collection-row { display:flex; align-items:center; gap:var(--space-2);
      min-width:0; padding:var(--space-2); border:1px solid var(--od-line);
      border-radius:var(--radius-control); background:var(--od-muted); }
    .gesture-arrow { display:grid; place-items:center; flex:none; width:26px; height:26px;
      border-radius:calc(var(--radius-control) - 2px); background:var(--od-paper);
      color:var(--od-brand); font-size:19px; font-weight:700; }
    .gesture-label { min-width:0; font-size:var(--od-note-size); white-space:nowrap; }
    .hint { margin-top:var(--space-4); color:var(--od-sub); font-size:var(--od-meta-size); }
    .preview-caption { max-width:360px; margin-top:var(--space-3); color:#65758f;
      font-size:var(--od-meta-size); text-align:center; line-height:1.55; }
    .od-button { display:inline-flex; align-items:center; justify-content:center;
      min-height:36px; padding:var(--space-2) var(--space-3); border-radius:var(--radius-control);
      border:1px solid var(--od-brand); background:var(--od-brand); color:var(--od-on-brand); font-weight:650; }
    .od-button--secondary { background:var(--od-muted); color:var(--od-ink); border-color:var(--od-input-border); }
    .extension-list { padding:var(--space-4) var(--space-3); }
    .extension-list .od-note { margin:var(--space-2) 0 var(--space-3); }
    @media (max-width:300px) {
      .preview-viewport { padding:8px 4px; }
      .od-collection { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion:reduce) {
      .mg-switch,.mg-switch:before { transition:none; }
    }
  </style>
</head>
<body>
  <div class="preview-viewport">
    <div class="preview-device" aria-label="OpenDesk Side Panel 模拟预览">
      <header class="od-page-head">
        <button id="back" class="od-icon-button" type="button" aria-label="返回扩展列表" title="返回扩展列表">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1 id="host-title" class="od-page-title">鼠标手势</h1>
      </header>
      <main>
        <section id="gesture-panel" class="od-page" aria-labelledby="host-title">
          <div class="setting-row">
            <div class="setting-copy">
              <label for="gesture-enabled">开启鼠标手势</label>
              <p class="od-note">按住右键拖动，快速操作网页</p>
            </div>
            <input id="gesture-enabled" class="mg-switch" type="checkbox" role="switch"
              aria-label="开启鼠标手势" checked>
          </div>
          <div class="section-head">
            <h2 id="gesture-list-title">默认手势</h2>
            <span class="od-note">操作说明</span>
          </div>
          <ul class="od-collection" aria-labelledby="gesture-list-title">
            <li class="od-collection-row"><span class="gesture-arrow" aria-hidden="true">←</span><span class="gesture-label">后退</span></li>
            <li class="od-collection-row"><span class="gesture-arrow" aria-hidden="true">→</span><span class="gesture-label">前进</span></li>
            <li class="od-collection-row"><span class="gesture-arrow" aria-hidden="true">↑</span><span class="gesture-label">刷新</span></li>
            <li class="od-collection-row"><span class="gesture-arrow" aria-hidden="true">↓</span><span class="gesture-label">到底</span></li>
          </ul>
          <p class="hint">松开右键执行 · Esc 取消</p>
        </section>
        <section id="extension-list" class="extension-list" hidden aria-label="扩展列表（模拟）">
          <p class="od-note">扩展列表 · 导航模拟</p>
          <button id="reopen" type="button" class="od-button od-button--secondary">打开鼠标手势</button>
        </section>
      </main>
    </div>
    <p class="preview-caption">设计预览 · 唯一滑块只改变本页内存。默认假设安装范围已授权，不会请求权限或执行 Chrome 操作。当前 R1 仅验证「← 后退」，其余动作为产品规划。</p>
  </div>
  <script>
    (() => {
      'use strict';
      const toggle = document.getElementById('gesture-enabled');
      const back = document.getElementById('back');
      const panel = document.getElementById('gesture-panel');
      const list = document.getElementById('extension-list');
      const reopen = document.getElementById('reopen');
      const title = document.getElementById('host-title');
      function sync() {
        toggle.setAttribute('aria-checked', String(toggle.checked));
      }
      toggle.addEventListener('change', sync);
      back.addEventListener('click', () => {
        panel.hidden = true;
        list.hidden = false;
        back.hidden = true;
        title.textContent = '扩展';
        reopen.focus();
      });
      reopen.addEventListener('click', () => {
        list.hidden = true;
        panel.hidden = false;
        back.hidden = false;
        title.textContent = '鼠标手势';
        toggle.focus();
      });
      sync();
    })();
  </script>
</body>
</html>
