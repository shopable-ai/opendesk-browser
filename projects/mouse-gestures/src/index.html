<section class="mg-panel" aria-label="鼠标手势">
  <div class="mg-setting-row">
    <div class="mg-setting-copy"><label for="gesture-enabled">开启鼠标手势</label>
      <p class="mg-note">在已授权网页上使用鼠标手势</p></div>
    <input id="gesture-enabled" class="mg-switch" type="checkbox" role="switch"
      aria-label="开启鼠标手势" aria-describedby="gesture-help" checked disabled>
  </div>
  <div class="mg-section-head"><h2 id="gesture-list-title">默认手势</h2></div>
  <ul class="mg-list" aria-labelledby="gesture-list-title">
    <li class="mg-item"><span class="mg-arrow" aria-hidden="true">←</span><span>后退</span></li>
    <li class="mg-item"><span class="mg-arrow" aria-hidden="true">→</span><span>前进</span></li>
    <li class="mg-item"><span class="mg-arrow" aria-hidden="true">↑</span><span>刷新</span></li>
    <li class="mg-item"><span class="mg-arrow" aria-hidden="true">↓</span><span>到底</span></li>
  </ul>
  <p id="gesture-help" class="mg-hint">右键拖动，松开执行 · Esc 取消</p>
  <details class="mg-preferences">
    <summary>操作偏好</summary>
    <div class="mg-preference-row">
      <label for="gesture-trigger">触发方式</label>
      <select id="gesture-trigger" disabled>
        <option value="right">右键拖动（默认）</option>
        <option value="alt-left">Option / Alt + 左键拖动</option>
      </select>
    </div>
    <div class="mg-preference-row">
      <label for="gesture-menu-policy">网页右键菜单</label>
      <select id="gesture-menu-policy" aria-describedby="gesture-menu-help" disabled>
        <option value="native-first">原生菜单优先（默认）</option>
        <option value="gesture-first">手势优先（需主动启用）</option>
      </select>
    </div>
    <p id="gesture-menu-help" class="mg-note">默认保留普通右键菜单。若 macOS 在拖动前就弹出菜单，手势可能无法开始；可改用 Option / Alt + 左键或手动启用手势优先。</p>
    <label class="mg-trace-option" for="gesture-trace"><input id="gesture-trace" type="checkbox" checked disabled>显示轨迹与动作提示</label>
    <div class="mg-combo-setting">
      <span class="mg-combo-title">组合手势动作</span>
      <div class="mg-combo-fields">
        <label for="gesture-combo">方向组合</label>
        <select id="gesture-combo" disabled>
          <option value="left-down">先向左，再向下</option>
          <option value="left-up">先向左，再向上</option>
          <option value="right-down">先向右，再向下</option>
          <option value="right-up">先向右，再向上</option>
          <option value="up-right">先向上，再向右</option>
          <option value="up-left">先向上，再向左</option>
          <option value="down-right">先向下，再向右</option>
          <option value="down-left">先向下，再向左</option>
        </select>
        <label for="gesture-combo-action">执行动作</label>
        <select id="gesture-combo-action" disabled>
          <option value="none">未配置（不执行）</option>
          <option value="left">后退</option>
          <option value="right">前进</option>
          <option value="up">刷新</option>
          <option value="down">滚动到底部</option>
        </select>
      </div>
      <p class="mg-note">只有完成两段并松开，才执行已保存的动作。</p>
    </div>
  </details>
  <p id="gesture-error" class="mg-error" role="alert" hidden></p>
</section>
