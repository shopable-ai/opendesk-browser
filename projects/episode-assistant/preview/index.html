<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>连播助手 · 最小交互预览</title>
<style>body{margin:0;padding:24px 12px;background:light-dark(#f4f5f7,#16191d);color-scheme:light dark}#od-watch-preview{max-width:800px;margin:0 auto}@media(max-width:400px){body{padding:12px 4px}}</style>
</head>
<body>
<div id="od-watch-preview" class="viz-dotted-background">
  <div id="od-preview-meta" class="od-preview-meta">独立交互预览 · 模拟数据 · 非正式功能</div>
  <aside id="od-sidebar" class="od-sidebar" aria-label="连播助手侧栏"></aside>
  <section class="od-simulator" aria-label="模拟播放器">
    <div class="od-player-toolbar"><button id="od-play" type="button">播放</button><span class="od-clock"><span id="od-current-time">00:30</span><span class="od-muted"> / </span><span id="od-total-time">45:00</span></span><select id="od-episode" aria-label="模拟集数"><option value="3">第03集</option><option value="4">第04集</option><option value="5">第05集</option></select></div>
    <input id="od-progress" class="od-play-progress" type="range" min="0" max="2700" value="30" step="1" aria-label="模拟播放器播放位置">
    <div class="od-player-caption"><span>模拟播放</span><span id="od-play-state">暂停</span></div>
    <details class="od-demo" id="od-demo"><summary>演示场景</summary><div class="od-demo-content">
      <label for="od-scenario">场景<select id="od-scenario"><option value="empty">首次空白</option><option value="standard">常用片头 / 片尾</option><option value="short">短视频 · 3分钟</option><option value="interval">特殊区间 / 保留彩蛋</option><option value="exception">本集关闭片头</option><option value="unknown">时长未知</option><option value="invalid">非法区间</option><option value="autodemonstration">自动跳过 / 撤销</option></select></label>
      <div class="od-demo-row"><label for="od-width">侧栏宽度<select id="od-width"><option value="360">360 px</option><option value="320">320 px</option><option value="400">400 px</option></select></label><label for="od-speed">模拟速度<select id="od-speed"><option value="1">1×</option><option value="10">10×</option><option value="60">60×</option></select></label></div>
      <div class="od-demo-row"><input id="od-seek-time" type="text" inputmode="numeric" value="00:30" aria-label="模拟定位时间（分:秒）"><button id="od-seek" type="button">定位播放</button></div>
      <div class="od-demo-buttons"><button id="od-advance" type="button" disabled>推进10秒</button><button id="od-duration" type="button">时长未知</button><button id="od-version" type="button">切换版本</button></div>
      <details class="od-saved"><summary>查看保存值</summary><div id="od-saved-values"></div></details>
      <div class="od-adapter-note">CHAT_ADAPTER_NOT_SOURCE_HTML<br>示例仅保留在本次预览，刷新重置。</div>
    </div></details>
  </section>
</div>
<style>

#od-watch-preview .od-demo-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}#od-watch-preview .od-demo-row input{width:100%}#od-watch-preview .od-demo-row button{font-size:12px}

<script>
/* Local interaction simulator only. No browser-extension or website APIs. */
class ContinuityModel {
  constructor() {
    this._bases = {};
    this._restored = new Set();
    this._zeroOpportunity = false;
    this.s = {};
    this._loadScenario('empty');
  }
  static copy(v) {
    if (Array.isArray(v)) return v.map(ContinuityModel.copy);
    if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, ContinuityModel.copy(x)]));
    return v;
  }
  static blank() {
    return {intro:{enabled:true,mode:'start',start:0,end:null},outro:{enabled:true,mode:'tail',tail:null,start:null,end:null},autoNext:true};
  }
  static standard() {
    return {intro:{enabled:true,mode:'start',start:0,end:90},outro:{enabled:true,mode:'tail',tail:90,start:null,end:null},autoNext:true};
  }
  copy(v) { return ContinuityModel.copy(v); }
  identity() { return `demo:星海航线|s1|e${this.s.episode}|${this.s.version}`; }
  _workIdentity() { return `demo:星海航线|s1|${this.s.version}`; }
  _notice(text, kind='info') { this.s.status=text; this.s.statusKind=kind; }
  _duration(n=this.s.episode) { return ({3:2700,4:2880,5:null})[n] ?? null; }
  _setBaseline() {
    this._draftBaseline=this.copy(this.s.draft);
    this.s.dirty=false; this.s.touched=[]; this._restored.clear();
    this.s.draftContext={identity:this.identity(),scope:this.s.scope};
  }
  _loadDraft() {
    this.s.draft=this.copy(this.s.scope==='work'?this.s.base:this.effective());
    this._setBaseline();
  }
  effective() {
    const r=this.copy(this.s.base), o=this.s.overrides[this.identity()]||{};
    for(const key of ['intro','outro','autoNext']) if(Object.prototype.hasOwnProperty.call(o,key)) r[key]=this.copy(o[key]);
    return r;
  }
  sources() {
    const o=this.s.overrides[this.identity()]||{}, r=this.effective(), result={};
    for(const k of ['intro','outro','autoNext']) {
      const hasValue=n=>n!==null&&n!==undefined&&n!=='';
      const configured=k==='autoNext'||(k==='outro'&&r.outro.mode==='tail'?hasValue(r.outro.tail):
        hasValue(r[k].end)&&(r[k].mode==='start'||hasValue(r[k].start)));
      result[k]=Object.prototype.hasOwnProperty.call(o,k)?'本集例外':
        (configured?'作品默认':'未设置');
    }
    return result;
  }
  edit(key, patch) {
    if(!['intro','outro','autoNext'].includes(key)) return false;
    if(this.s.draftContext.identity!==this.identity()||this.s.draftContext.scope!==this.s.scope) {
      this._notice('草稿属于其他内容或保存范围，请返回原内容处理。','error'); return false;
    }
    if(key==='autoNext') this.s.draft[key]=Boolean(patch);
    else this.s.draft[key]={...this.s.draft[key],...patch};
    this._restored.delete(key);
    if(!this.s.touched.includes(key)) this.s.touched.push(key);
    this.s.dirty=true; this.s.pending=null; this._zeroOpportunity=false;
    this._notice('有未保存修改；调整不会移动播放位置。');
    return true;
  }
  setMode(key,mode) {
    const r=this.s.draft[key], old=this.range(key), d=this.s.duration;
    if(key==='intro') {
      if(!['start','interval'].includes(mode)) return false;
      return this.edit(key,mode==='start'?{mode,start:0}:{mode,start:Number.isFinite(r.start)?r.start:0});
    }
    if(key==='outro') {
      if(!['tail','interval'].includes(mode)) return false;
      return this.edit(key,mode==='interval'?{mode,start:old?old[0]:r.start,end:old?old[1]:r.end}:
        {mode,tail:Number.isFinite(d)&&Number.isFinite(r.start)?d-r.start:r.tail});
    }
    return false;
  }
  range(key,rules=this.s.draft) {
    const r=rules[key]; if(!r) return null;
    let a,b;
    if(key==='intro') { a=r.mode==='start'?0:r.start; b=r.end; }
    else if(r.mode==='tail') { if(!Number.isFinite(this.s.duration)||!Number.isFinite(r.tail))return null; a=this.s.duration-r.tail;b=this.s.duration; }
    else {a=r.start;b=r.end;}
    return Number.isFinite(a)&&Number.isFinite(b)?[a,b]:null;
  }
  endpointValue(key,part,rules=this.s.draft) {
    if(!['intro','outro'].includes(key)||!['start','end'].includes(part))return null;
    const r=rules[key];
    if(key==='intro')return part==='start'&&r.mode==='start'?0:r[part];
    if(r.mode!=='tail')return r[part];
    if(!Number.isFinite(this.s.duration))return null;
    if(part==='end')return this.s.duration;
    return r.tail===null||r.tail===undefined?null:this.s.duration-r.tail;
  }
  setEndpoint(key,part,value,options={}) {
    if(!['intro','outro'].includes(key)||!['start','end'].includes(part))return false;
    const r=this.s.draft[key],d=this.s.duration;
    if(key==='intro') {
      const start=part==='start'?value:this.endpointValue(key,'start');
      const end=part==='end'?value:this.endpointValue(key,'end');
      return this.edit(key,{mode:start===0?'start':'interval',start,end});
    }
    if(part==='end') {
      const start=this.endpointValue(key,'start');
      if(Number.isFinite(d)&&value===d&&options.bindEnd!==false) {
        return this.edit(key,{mode:'tail',tail:start===null||start===undefined?null:d-start,start:null,end:null});
      }
      return this.edit(key,{mode:'interval',start,end:value});
    }
    if(r.mode==='tail') {
      if(!Number.isFinite(d)){this._notice('时长未知，片尾时间保留，待时长可用后调整。','warning');return false;}
      return this.edit(key,{tail:value===null||value===undefined?null:d-value});
    }
    return this.edit(key,{start:value});
  }
  isUnconfigured(key,rules=this.s.draft) {
    const r=rules[key],missing=n=>n===null||n===undefined||n==='';
    if(key==='intro')return missing(r.end)&&(r.mode==='start'||r.start===0||missing(r.start));
    return r.mode==='tail'?missing(r.tail):missing(r.start)&&missing(r.end);
  }
  validation(rules=this.s.draft) {
    const v={intro:[],outro:[],general:[],warnings:[],valid:true}, d=this.s.duration;
    for(const key of ['intro','outro']) {

}

function rowHTML(key){

 return `<section class="od-time-section" data-section="${key}"><div class="od-row-title"><label for="od-toggle-${key}">${names[key]}</label><span id="od-window-label-${key}" class="od-window-label">${windowLabel(key)}</span>${overridden?'<span class="od-exception">本集例外</span>':''}<button id="od-calibrate-${key}" class="od-link od-calibrate-toggle" type="button" data-action="calibrate" data-key="${key}" aria-expanded="${ui.calibrating===key}" ${unavailable(key)&&ui.calibrating!==key?'disabled':''}>${ui.calibrating===key?'收起校准':'校准'}</button><label class="od-switch"><input id="od-toggle-${key}" type="checkbox" data-toggle="${key}" ${r.enabled?'checked':''} aria-label="跳过${names[key]}"></label></div>${track}<div class="od-endpoint-readouts">${fieldHTML(key,'start')}${fieldHTML(key,'end')}</div>${calibrationHTML(key)}<div id="od-error-${key}" class="od-error" ${v[key].length?'':'hidden'}>${esc(v[key][0]||'')}</div></section>`;

function moreHTML(){const s=model.s,o=s.overrides[model.identity()]||{};return `<div class="od-more" id="od-more-panel" ${ui.more?'':'hidden'}><div class="od-version-note">适用：${esc(s.version)}</div><div class="od-restore-row">${s.scope==='episode'?['intro','outro','autoNext'].filter(k=>Object.prototype.hasOwnProperty.call(o,k)).map(k=>`<button id="od-restore-${k}" type="button" class="od-link" data-action="restore" data-key="${k}">恢复${names[k]||'连播'}默认</button>`).join(''):Object.keys(o).length?'<button id="od-adjust-episode" type="button" class="od-link" data-action="adjust-episode">查看本集例外</button>':''}<button id="od-close" type="button" class="od-link" data-action="close">收起侧栏</button></div></div>`;}

function sidebarHTML(){
 const s=model.s,v=validation();

 return `<header class="od-header"><div class="od-title-row"><h3>连播助手</h3><button id="od-more" type="button" class="od-link" data-action="more" aria-expanded="${ui.more}" aria-controls="od-more-panel">${ui.more?'收起更多':'更多'}</button></div><div id="od-content-identity" class="od-work">${identityText()}</div>${moreHTML()}</header><div class="od-rows">${rowHTML('intro')}${rowHTML('outro')}<div class="od-auto"><label for="od-auto-next">自动下一集</label>${Object.prototype.hasOwnProperty.call(s.overrides[model.identity()]||{},'autoNext')?'<span class="od-exception">本集例外</span>':''}<label class="od-switch"><input id="od-auto-next" type="checkbox" data-toggle="autoNext" ${s.draft.autoNext?'checked':''} aria-label="自动下一集"></label></div></div><footer class="od-save-zone"><div class="od-save-actions"><button id="od-save" type="button" class="od-primary" data-action="save" ${s.dirty&&v.valid?'':'disabled'}>${s.scope==='work'?'保存本作品设置':'仅保存本集'}</button><button id="od-scope-switch" type="button" class="od-link" data-action="scope">${s.scope==='work'?'调整本集':'作品默认'}</button><button id="od-cancel" type="button" class="od-link" data-action="cancel" ${s.dirty?'':'hidden'}>取消修改</button></div></footer>${statusHTML()}${transitionHTML()}`;

function syncStatus(){
 const s=model.s,v=validation(),host=q('#od-status');if(!host)return;let text='',kind='',actions=[];
 if(s.transition)text='';
 else if(v.general.length){text=v.general[0];kind='od-error-state';}
 else if(v.intro.length||v.outro.length)text='';
 else if(s.exempt.length)text=Number.isFinite(s.duration)&&s.time>=s.duration?'本集结束，查看保护保留。':'正在查看'+s.exempt.map(k=>names[k]).join('、');
 else if(!Number.isFinite(s.duration)){text='时长未知，片尾暂不可校准或跳过。';kind='od-warning';}
 else if(v.warnings.length){text=v.warnings[0];kind='od-warning';}
 else if(s.dirty)text='有未保存修改';
 else if(s.pending)text='准备进入第'+s.pending.nextEpisode+'集';
 else if(s.statusKind==='warning'){text=s.status;kind='od-warning';}
 else if(s.undo)text='已跳过'+names[s.undo.key];
 else if(Number.isFinite(s.duration)&&s.time>=s.duration&&!s.playing)text='本集已结束';
 else if(s.statusKind==='error'){text=s.status;kind='od-error-state';}
 if(s.returnAnchor)actions.push('<button id="od-return" type="button" data-action="return">返回原位置</button>');else if(s.undo)actions.push('<button id="od-undo" type="button" data-action="undo">撤销跳过</button>');

 const actionHost=q('#od-status-actions'),html=actions.join('');if(ui.actionsHost!==actionHost||ui.actionsSignature!==html){actionHost.innerHTML=html;ui.actionsHost=actionHost;ui.actionsSignature=html;}
}
function syncSave(){const s=model.s,v=validation(),b=q('#od-save');if(b){b.disabled=!s.dirty||!v.valid;b.textContent=!s.dirty&&ui.savedContext===contextKey()?(s.scope==='work'?'本作品设置已保存':'本集设置已保存'):(s.scope==='work'?'保存本作品设置':'仅保存本集');}const c=q('#od-cancel');if(c)c.hidden=!s.dirty;syncStatus();}
function syncCalibration(){
 for(const key of ['intro','outro']){
  const part=ui.selected[key],suffix=part==='start'?'开始':'结束',n=value(key,part),v=validation(),mark=q('#od-mark-'+key),preview=q('#od-preview-'+key);
  all(`[data-endpoint-label^="${key}-"]`).forEach(el=>el.classList.toggle('od-selected',el.dataset.endpointLabel===key+'-'+part));
  all(`[data-interval-key="${key}"]`).forEach(el=>el.classList.toggle('od-active-point',el.dataset.endpoint===part));
  for(const p of ['start','end']){const b=q('#od-target-'+key+'-'+p);if(b)b.setAttribute('aria-pressed',String(p===part));}
  if(mark){mark.setAttribute('aria-label','用当前播放时间标记'+names[key]+suffix);mark.disabled=unavailable(key);}
  if(preview){const finalEnd=key==='outro'&&part==='end'&&Number.isFinite(model.s.duration)&&n===model.s.duration;preview.textContent=finalEnd?'不定位视频结尾':'查看'+names[key]+suffix+(Number.isFinite(n)?' '+fmt(n):'');preview.disabled=unavailable(key)||finalEnd||!model.range(key)||v[key].length>0;}
 }
}
function syncErrors(){const v=validation();for(const key of ['intro','outro']){const e=q('#od-error-'+key);if(e){e.hidden=!v[key].length;e.textContent=v[key][0]||'';}all(`[data-time-key="${key}"]`).forEach(el=>el.setAttribute('aria-invalid',String(v[key].length>0)));all(`[data-interval-key="${key}"]`).forEach(el=>el.setAttribute('aria-invalid',String(v[key].length>0)));}}

 const w=windowFor(key),a=value(key,'start'),b=value(key,'end'),disabled=unavailable(key),valid=!disabled&&Number.isFinite(a)&&Number.isFinite(b)&&a<b,pct=n=>Math.max(0,Math.min(100,(n-w[0])/(w[1]-w[0])*100));
 all(`[data-time-key="${key}"]`).forEach(el=>{if(el!==origin)el.value=disabled?'':inputValue(key,el.dataset.timePart);el.disabled=disabled;el.setAttribute('placeholder',disabled?'—':'分:秒');el.setAttribute('aria-label',fieldAria(key,el.dataset.timePart));});
 all(`[data-interval-key="${key}"]`).forEach(el=>{const part=el.dataset.endpoint,n=value(key,part),set=Number.isFinite(n)&&!disabled;el.min=w[0];el.max=w[1];if(el!==origin)el.value=set?n:part==='start'?w[0]:w[1];el.disabled=disabled;el.classList.toggle('od-empty',!set);el.setAttribute('aria-valuetext',disabled?'时长未知':set?fmt(n):'未设置，拖动建立端点');});
 const fill=q('#od-dual-fill-'+key);if(fill){fill.style.left=(valid?pct(a):0)+'%';fill.style.width=(valid?Math.max(0,pct(b)-pct(a)):0)+'%';}
 const windowTag=q('#od-window-label-'+key);if(windowTag)windowTag.textContent=windowLabel(key);
 const label=q('#od-label-'+key+'-end');if(label)label.textContent=endpointLabel(key,'end');

 syncErrors();syncCalibration();syncSave();
}
function syncPlayer(){
 const s=model.s;q('#od-preview-meta').textContent='聊天交互候选 · 非正式模板 · '+(s.scenario==='standard'?'常用示例（模拟数据）':s.scenario==='short'?'短视频示例（模拟数据）':'模拟数据');q('#od-current-time').textContent=fmt(s.time);q('#od-total-time').textContent=Number.isFinite(s.duration)?fmt(s.duration):'未知';const identity=q('#od-content-identity');if(identity)identity.textContent=identityText();
 q('#od-play').textContent=s.playing?'暂停':'播放';q('#od-play-state').textContent=s.pending?'准备换集':s.playing?'播放中':'暂停';q('#od-advance').disabled=!s.playing;q('#od-progress').disabled=!Number.isFinite(s.duration);q('#od-progress').max=Number.isFinite(s.duration)?s.duration:1;q('#od-progress').value=Number.isFinite(s.duration)?s.time:0;

 q('#od-duration').textContent=Number.isFinite(s.duration)?'时长未知':'提供模拟时长';q('#od-version').textContent=s.version==='标准版 A'?'切换版本 B':'返回版本 A';

 q('#od-saved-values').innerHTML=`<div class="od-saved-row"><span>版本</span><span>${esc(s.version)}</span></div><div class="od-saved-row"><span>片头</span><span>${rangeText('intro',r)} · ${r.intro.enabled?'开':'关'}</span></div><div class="od-saved-row"><span>片尾保存值</span><span>${r.outro.mode==='tail'?'最后 '+fmt(r.outro.tail):rangeText('outro',r)} · ${r.outro.enabled?'开':'关'}</span></div><div class="od-saved-row"><span>本集片尾范围</span><span>${rangeText('outro',r)}</span></div><div class="od-saved-row"><span>本集例外</span><span>${Object.keys(o).map(k=>names[k]||'连播').join('、')||'无'}</span></div>`;

function render(keepFocus=true){const old=document.activeElement,id=old&&root.contains(old)?old.id:null;let selection=null;try{selection=[old.selectionStart,old.selectionEnd];}catch(e){}ui.rendering=true;q('#od-sidebar').innerHTML=sidebarHTML();syncErrors();syncCalibration();syncSave();syncPlayer();if(keepFocus&&id){let el=q('#'+id);if(!el||el.disabled)el=q('#od-scope-switch')||q('#od-open');if(el){el.focus({preventScroll:true});if(el.id===id&&selection&&selection[0]!==null&&el.setSelectionRange)try{el.setSelectionRange(selection[0],selection[1]);}catch(e){}}}ui.rendering=false;}
function resetUI(){ui.selected={intro:'end',outro:'start'};ui.calibrating=null;ui.more=false;ui.raw={};ui.windows={};ui.savedContext=null;}
function take(fn){const id=model.identity(),sc=model.s.scenario,scope=model.s.scope;fn();if(id!==model.identity()||sc!==model.s.scenario)resetUI();else if(scope!==model.s.scope){ui.raw={};ui.windows={};ui.savedContext=null;}render();}
function selectPoint(key,part){ui.selected[key]=part;syncCalibration();}
function commitInput(el){const key=el.dataset.timeKey;if(!key)return;const part=el.dataset.timePart;if(Number.isFinite(value(key,part))){clearRaw(key,part);el.value=inputValue(key,part);}windowFor(key,true);syncRow(key,el);}
root.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;const action=b.dataset.action,key=b.dataset.key;
 if(action==='more'){ui.more=!ui.more;render();return;}
 if(action==='calibrate'){ui.calibrating=ui.calibrating===key?null:key;render();return;}
 if(action==='target'){selectPoint(key,b.dataset.part);return;}
 if(action==='save'){take(()=>{const c=contextKey();if(model.save()){ui.savedContext=c;ui.raw={};}});return;}
 if(action==='scope'){take(()=>model.requestScope(model.s.scope==='work'?'episode':'work'));return;}
 if(action==='cancel'){ui.raw={};ui.windows={};take(()=>model.cancel());return;}
 if(action==='mark'){clearRaw(key,ui.selected[key]);take(()=>model.mark(key,ui.selected[key]));windowFor(key,true);syncRow(key);return;}
 if(action==='preview'){take(()=>model.preview(key,ui.selected[key]));return;}
 if(action==='restore'){clearRaw(key);ui.windows={};take(()=>model.restore(key));return;}
 if(action==='adjust-episode'){take(()=>model.requestScope('episode'));return;}
 if(action==='return'){take(()=>model.returnPosition());return;}
 if(action==='undo'){take(()=>model.undoSkip());return;}
 if(action==='resume-auto'){take(()=>model.resumeAutomatic());return;}
 if(action==='close'){take(()=>model.closePanel());return;}
 if(action==='open'){take(()=>model.openPanel());return;}
 if(action==='stay'){take(()=>model.resolveTransition('stay'));return;}
 if(action==='discard'){ui.raw={};ui.windows={};take(()=>model.resolveTransition('discard'));return;}
 if(b.id==='od-play')take(()=>model.togglePlay());
 if(b.id==='od-advance')take(()=>model.advance(10));
 if(b.id==='od-seek'){const n=parseTime(q('#od-seek-time').value);if(Number.isFinite(n))take(()=>model.seek(n));else{model.s.status='请输入有效时间，例如12:00。';model.s.statusKind='error';syncStatus();}}
 if(b.id==='od-duration'){take(()=>model.setDuration(Number.isFinite(model.s.duration)?null:model.s.scenario==='short'?180:({3:2700,4:2880,5:2640})[model.s.episode]));ui.windows={};render();}
 if(b.id==='od-version')take(()=>model.requestVersion());
});
root.addEventListener('input',event=>{
 const el=event.target;if(el.disabled)return;
 if(el.id==='od-progress'){model.seek(Number(el.value));syncPlayer();syncStatus();return;}
 if(el.dataset.timeKey){const key=el.dataset.timeKey,part=el.dataset.timePart;ui.raw[el.id]=el.value;setEndpoint(key,part,parseTime(el.value));ui.savedContext=null;selectPoint(key,part);syncRow(key,el);return;}
 if(el.dataset.intervalKey){const key=el.dataset.intervalKey,part=el.dataset.endpoint,intended=Number(el.value),n=constrainHandle(key,part,intended);if(n===null){el.value=Number.isFinite(value(key,part))?value(key,part):windowFor(key)[part==='start'?0:1];return;}el.value=n;setEndpoint(key,part,n,intended);clearRaw(key,part);ui.savedContext=null;selectPoint(key,part);syncRow(key,el);}
});
root.addEventListener('change',event=>{
 const el=event.target;if(el.disabled)return;
 if(el.id==='od-scenario')take(()=>model.loadScenario(el.value));
 else if(el.id==='od-episode')take(()=>model.requestEpisode(Number(el.value)));
 else if(el.id==='od-width')root.style.setProperty('--od-side-width',el.value+'px');
 else if(el.id==='od-speed')ui.speed=Number(el.value);
 else if(el.dataset.toggle){const key=el.dataset.toggle;ui.savedContext=null;take(()=>model.edit(key,key==='autoNext'?el.checked:{enabled:el.checked}));}

root.addEventListener('focusin',event=>{if(ui.rendering)return;const el=event.target,key=el.dataset.timeKey||el.dataset.intervalKey;if(key)selectPoint(key,el.dataset.timePart||el.dataset.endpoint);});

root.addEventListener('pointerup',()=>{ui.dragging=null;});
root.addEventListener('keydown',event=>{
 const el=event.target,key=el.dataset.timeKey||el.dataset.intervalKey;if(!key||el.disabled)return;

 event.preventDefault();const part=el.dataset.timePart||el.dataset.endpoint,step=['ArrowUp','ArrowRight'].includes(event.key)?1:-1,w=windowFor(key),base=Number.isFinite(value(key,part))?value(key,part):part==='start'?w[0]:w[1],intended=Math.max(0,base+step);let n=intended;

const timer=setInterval(()=>{if(!root.isConnected){clearInterval(timer);return;}if(!model.s.playing)return;const id=model.identity();model.advance(ui.speed);if(model.identity()!==id){resetUI();render(false);}else{syncPlayer();syncStatus();}},1000);
root.preview={model,ui,render,parseTime,formatTime:fmt,commitInput,windowFor};
render(false);
})();
