<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI New Chat · 项目新标签页 R1</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f5f5f5;color:#202020;font:14px/1.5 system-ui,sans-serif}button,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #3975dd;outline-offset:2px}button{background:none;border:0}h1{font-size:20px;margin:0 0 4px}p{margin:0}.wrap{max-width:1080px;margin:auto}.muted{color:#777;font-size:12px}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:14px 0}.controls button,.controls select{border:1px solid #ccc;border-radius:7px;padding:6px 9px;background:#fff}.browser{--panel:#f8f8f8;--surface:#fff;--ink:#242424;--sub:#777;--line:#e5e5e5;--hover:#eaeaea;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 26px #0000000a}.browser.dark{--panel:#171717;--surface:#212121;--ink:#ededed;--sub:#aaa;--line:#383838;--hover:#333}.tabs{display:flex;gap:3px;padding:8px 8px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;min-height:40px}.tab{display:flex;align-items:center;gap:4px;border-radius:8px 8px 0 0;padding:0 6px;flex:none;max-width:220px;min-width:100px}.tab[aria-selected=true]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}.tab button{padding:6px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab .close{padding:4px;flex:none}.address{font:12px/1.5 system-ui;padding:7px 13px;color:var(--sub);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work{display:grid;grid-template-columns:282px minmax(0,1fr);min-height:410px}.work.collapsed{grid-template-columns:0 minmax(0,1fr)}aside{overflow:hidden;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px}.collapsed aside{visibility:hidden;padding:0;border:0}.brand{display:flex;align-items:center;justify-content:space-between;padding:5px 7px 14px;font-weight:650}.section{font-size:12px;color:var(--sub);padding:13px 8px 5px}.line{position:relative;display:flex;align-items:center;height:36px;border-radius:7px;gap:3px;padding:0 4px 0 7px}.line:hover,.line:focus-within{background:var(--hover)}.label{display:flex;align-items:center;gap:7px;flex:1;min-width:0;padding:0;text-align:left;height:32px}.label span:last-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.actions{display:flex;align-items:center;gap:2px;flex:none;visibility:hidden;pointer-events:none}.line:hover .actions,.line:focus-within .actions{visibility:visible;pointer-events:auto}.icon{width:26px;height:26px;display:grid;place-items:center;border-radius:5px;padding:0;flex:none;color:var(--sub)}.icon:hover{background:var(--line);color:var(--ink)}.icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.extra:disabled{opacity:.45;cursor:not-allowed}.history{font-size:12px;color:var(--sub);padding:5px 8px 5px 24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.menu{position:absolute;z-index:3;right:4px;top:34px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px;box-shadow:0 8px 18px #0002}.menu button{display:block;padding:7px 9px;text-align:left;white-space:nowrap}.menu button:hover{background:var(--hover)}main{min-width:0;display:flex;flex-direction:column;padding:16px 24px 22px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}.top button{padding:4px;border-radius:4px}.pill{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:12px;padding:2px 8px}.thread{flex:1;width:100%;max-width:580px;margin:30px auto 18px}.bubble{margin-left:auto;max-width:90%;width:fit-content;padding:10px 15px;background:var(--hover);border-radius:15px}.reply{margin-top:24px;line-height:1.8}.running{color:var(--sub);font-size:12px;margin-top:10px}.running:before{content:'●';color:#36a269;margin-right:6px}.empty{padding:32px 0;text-align:center;font-size:23px;font-weight:600}.composer{max-width:580px;width:100%;margin:auto;border:1px solid var(--line);border-radius:17px;padding:9px 12px;display:flex;align-items:end;gap:8px}.composer textarea{flex:1;min-width:0;resize:vertical;border:0;background:transparent;min-height:44px;color:var(--ink)}.send{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--surface);flex:none}.feedback{padding:9px 12px;margin-top:10px;background:#fff;border:1px solid #ddd;border-radius:8px;font-size:12px;min-height:37px}.feedback.error{border-color:#bc7777;color:#922}.footer{margin-top:10px;line-height:1.7}.hidden{display:none!important}@media(max-width:620px){body{padding:8px}.work{grid-template-columns:182px minmax(0,1fr)}main{padding:10px}.icon{width:23px}.actions{gap:0}.line{padding-left:4px}.label{gap:3px}.empty{font-size:17px}.thread{margin-top:16px}.pill{display:none}}
</style></head>
<body><div class="wrap"><h1>AI New Chat · 项目新标签页</h1><p class="muted">交互原型 · 所有浏览器、项目和消息行为均为本地模拟；不访问 ChatGPT、不发送真实消息。</p>
<div class="controls"><button id="theme" aria-pressed="false">深色模式</button><button id="language" aria-pressed="false">English</button><button id="enable" aria-pressed="true">扩展：已启用</button><button id="redraw">模拟 SPA 重绘</button><select id="scenario" aria-label="模拟异常"><option value="ok">正常场景</option><option value="missing">项目失效</option><option value="blocked">打开失败</option><option value="unknown">打开结果未知</option></select><button id="reset">重置</button></div>
<div class="browser" id="browser"><div class="tabs" id="tabs" role="tablist" aria-label="模拟浏览器标签页"></div><div class="address" id="address"></div><div class="work" id="work"><aside aria-label="模拟 ChatGPT 导航"><div class="brand">ChatGPT <button id="collapse" aria-label="收起侧栏">◧</button></div><div id="nav"></div></aside><main><div class="top"><span><button id="expand" class="hidden" aria-label="展开侧栏">◧</button><strong id="context"></strong></span><span class="pill" id="state"></span></div><div class="thread" id="thread"></div><div class="composer"><textarea id="draft" aria-label="消息草稿" placeholder="输入消息…"></textarea><button class="send" id="send" aria-label="模拟发送">↑</button></div></main></div></div>
<div class="feedback" id="feedback" role="status" aria-live="polite">鼠标经过项目行，点击 ↗；也可 Tab 聚焦项目行，再 Tab 进入快捷按钮。</div><p class="footer muted">验证：在新标签页输入草稿，切回 A，原草稿和模拟运行状态仍在；首次模拟发送才增加历史。快速重复点击不会重复开页。官方按钮则模拟原标签页导航。</p></div>
<script>
const $=id=>document.getElementById(id);const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h7v7M20 4l-9 9M19 14v5H5V5h5"/></svg>';const pencil='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l4-1 12-12-4-4L4 15z"/></svg>';const projects=[{id:'p1',name:'OpenDesk Browser',open:true},{id:'p2',name:'研发工作流',open:false},{id:'p3',name:'研发工作流',open:false},{id:'p4',name:'长期架构与交互设计研究项目',open:false}];const names={p1:'OpenDesk Browser',p2:'研发工作流',p3:'研发工作流',p4:'长期架构与交互设计研究项目'};let tabs,active,next,enabled,english,history,locks,menu,collapsed;const tr=(zh,en)=>english?en:zh;function initial(){english=false;tabs=[{id:'A',project:'p1',title:'A · '+tr('代码开发','Development'),draft:tr('未发送草稿：继续检查边界条件。','Unsent draft: check edge cases.'),running:true,old:true}];active='A';next=1;enabled=true;english=false;history={p1:['代码开发','需求分析'],p2:[],p3:[],p4:[],ordinary:[]};locks=new Map();menu=null;collapsed=false;projects.forEach((p,i)=>p.open=i===0);$('scenario').value='ok';$('browser').classList.remove('dark');$('theme').setAttribute('aria-pressed','false');render();say('原标签页 A 正在模拟生成。')}
function say(s,error=false){$('feedback').textContent=s;$('feedback').classList.toggle('error',error)}function name(p){return p?names[p]:tr('普通对话','New chat')}function button(label,body,fn,cls='icon'){const b=document.createElement('button');b.type='button';b.className=cls;b.title=label;b.setAttribute('aria-label',label);b.innerHTML=body;b.onclick=e=>{e.stopPropagation();fn(e)};return b}function current(){return tabs.find(t=>t.id===active)}function nav(){const root=$('nav');root.replaceChildren();function row(p){const line=document.createElement('div');line.className='line';line.dataset.project=p?.id||'ordinary';const label=button(p?name(p.id):tr('新聊天','New chat'),'<span aria-hidden="true">'+(p?(p.open?'▾':'▸'):'✎')+'</span><span></span>',()=>{if(p){p.open=!p.open;nav()}else native(null)},'label');label.lastChild.textContent=p?name(p.id):tr('新聊天','New chat');line.append(label);const actions=document.createElement('div');actions.className='actions';if(p)actions.append(button(tr('官方：项目新对话','Native project chat'),pencil,()=>native(p.id)));if(enabled){const b=button(p?tr('在新标签页创建项目对话','New project chat in tab'):tr('在新标签页创建普通对话','New chat in tab'),icon,()=>openTab(p?.id||null),'icon extra');actions.append(b)}if(p)actions.append(button(tr('官方项目菜单','Native project menu'),'•••',()=>{menu=menu===p.id?null:p.id;nav()}));line.append(actions);if(p&&menu===p.id){const m=document.createElement('div');m.className='menu';m.append(button(tr('新项目对话（当前页）','New project chat (same tab)'),tr('新项目对话（当前页）','New project chat (same tab)'),()=>native(p.id),''));line.append(m)}root.append(line);if(p?.open)for(const h of history[p.id]){const el=document.createElement('div');el.className='history';el.textContent=h;root.append(el)}}row(null);const h=document.createElement('div');h.className='section';h.textContent=tr('项目','Projects');root.append(h);projects.forEach(row);const rec=document.createElement('div');rec.className='section';rec.textContent=tr('最近对话','Recents');root.append(rec);for(const h of history.ordinary){const el=document.createElement('div');el.className='history';el.textContent=h;root.append(el)}}
function make(p,id){return {id,project:p,title:id+' · '+name(p),draft:'',running:false,old:false,first:false,reply:''}}function openTab(p){if(!enabled)return;const key=p||'ordinary',mode=$('scenario').value;if(p&&mode==='missing'){say(tr('项目不可用：没有创建标签页。','Project unavailable; no tab opened.'),true);return}if(locks.get(key)===Infinity||Date.now()-(locks.get(key)||0)<600){say(tr('重复点击已忽略；未知结果请先核对。','Duplicate ignored; inspect any unknown result first.'),true);return}if(mode==='blocked'){say(tr('模拟打开失败：原页面未改变。','Simulated failure; source unchanged.'),true);return}if(mode==='unknown'){locks.set(key,Infinity);say(tr('模拟结果未知：禁止自动重试；先核对浏览器标签。','Unknown result; inspect tabs before retrying.'),true);return}locks.set(key,Date.now());const id=next<26?String.fromCharCode(65+next):'T'+next;next++;tabs.push(make(p,id));active=id;render();say(tr('模拟打开 '+id+'；目标：','Opened simulated '+id+'; target: ')+name(p)+ (p?' ['+p+']':'')+tr('。原标签页未修改。','; source unchanged.'))}function native(p){const id=active;tabs[tabs.findIndex(t=>t.id===id)]=make(p,id);menu=null;render();say(tr('模拟官方导航：当前标签页被切换。','Native action simulated: current tab replaced.'))}
function render(){const t=current();$('tabs').replaceChildren();for(const item of tabs){const el=document.createElement('div');el.className='tab';el.setAttribute('role','tab');el.setAttribute('aria-selected',String(item.id===active));const b=button(item.title,'',()=>{active=item.id;render()},'');b.textContent=item.title;el.append(b);if(item.id!=='A')el.append(button(tr('关闭标签页','Close tab'),'×',()=>{tabs=tabs.filter(v=>v.id!==item.id);if(active===item.id)active='A';render()},'close'));$('tabs').append(el)}$('address').textContent='chatgpt.com · '+(t.project?'mock-project/'+t.project:'mock-ordinary')+' · '+(t.old?'existing':t.first?'conversation':'new');$('context').textContent=name(t.project);$('state').textContent=t.running?tr('正在生成（模拟）','Generating (mock)'):tr('独立对话','Independent chat');$('thread').replaceChildren();if(t.old||t.first){const b=document.createElement('div');b.className='bubble';b.textContent=t.old?tr('请继续完善当前业务代码。','Continue improving the code.'):t.reply;$('thread').append(b);const q=document.createElement('div');q.className='reply';q.textContent=tr('已进入当前任务的处理流程。','Processing this task.');$('thread').append(q);if(t.running){const s=document.createElement('div');s.className='running';s.textContent=tr('AI 正在继续生成（模拟）','AI is generating (mock)');$('thread').append(s)}}else{const e=document.createElement('div');e.className='empty';e.textContent=t.project?name(t.project):tr('有什么可以帮你？','What can I help with?');$('thread').append(e)}$('draft').value=t.draft;$('draft').placeholder=tr('输入消息…','Message…');$('enable').textContent=enabled?tr('扩展：已启用','Extension: on'):tr('扩展：已停用','Extension: off');$('enable').setAttribute('aria-pressed',String(enabled));$('language').setAttribute('aria-pressed',String(english));$('language').textContent=english?'中文':'English';$('work').classList.toggle('collapsed',collapsed);$('expand').classList.toggle('hidden',!collapsed);nav()}
$('draft').oninput=e=>{current().draft=e.target.value};$('send').onclick=()=>{const t=current();if(!t.draft.trim())return;t.reply=t.draft;t.draft='';if(!t.old&&!t.first){history[t.project||'ordinary'].push(t.reply.slice(0,36));if(t.project)projects.find(p=>p.id===t.project).open=true;t.first=true}t.running=true;render();say(tr('仅模拟用户主动发送，历史已更新。','Mock user send only; history updated.'))};$('theme').onclick=()=>{$('browser').classList.toggle('dark');const d=$('browser').classList.contains('dark');$('theme').setAttribute('aria-pressed',String(d));$('theme').textContent=d?'浅色模式':'深色模式'};$('language').onclick=()=>{english=!english;render()};$('enable').onclick=()=>{enabled=!enabled;render();say(enabled?'模拟启用':'模拟停用：快捷按钮已清理')};$('redraw').onclick=()=>{nav();say('模拟重绘：重新挂载唯一快捷入口。')};$('collapse').onclick=()=>{collapsed=true;render()};$('expand').onclick=()=>{collapsed=false;render()};$('reset').onclick=()=>{initial();$('theme').textContent='深色模式'};initial();
</script></body></html>
