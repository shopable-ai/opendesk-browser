<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Hover actions fixture</title>
<style>
body{font-family:Arial;margin:30px}.item{width:320px;display:flex;align-items:center;gap:4px;margin:8px 0;background:#f5f6f8;border-radius:8px;padding:4px 8px;min-height:34px}.item a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#344;text-decoration:none}.native{border:0;background:#e6e9ef;border-radius:5px;width:25px;height:26px;cursor:pointer}
#project-row .native{opacity:0;pointer-events:none}#project-row:hover .native,#project-row:focus-within .native{opacity:1;pointer-events:auto}
</style></head><body><nav id="sidebar"><button id="global-new" aria-label="New chat">+ 新聊天</button>
  <div class="item" id="project-row"><a id="project-title" href="/g/g-p-6abf8a999a548191919851197b47446f/project">Project One</a>
    <button class="native" id="native-plus" aria-label="New chat in project">+</button></div>
  <div class="item" id="project-only"><a href="/g/g-p-4abf8a999a548191919851197b47446f/project">Project without native button</a></div>
  <div class="item" id="project-dynamic"><a id="dynamic-title" href="/g/g-p-5abf8a999a548191919851197b47446f/project">Project with dynamic +</a></div>
</nav>
<script type="module">
import {installNewChatButtons} from '../../src/buttons.js';
const disposers=[];
const owner={
  on(target,type,handler){target.addEventListener(type,handler);const off=()=>target.removeEventListener(type,handler);disposers.push(off);return off},
  onDispose(fn){disposers.push(fn)},
  setTimeout:window.setTimeout.bind(window),
  setInterval(fn,delay){const id=window.setInterval(fn,delay);disposers.push(()=>window.clearInterval(id));return id},
  observe(target,cb,options){const observer=new MutationObserver(cb);observer.observe(target,options);disposers.push(()=>observer.disconnect());return observer}
};
const state={calls:[],native:0,owner};
const fakeWindow={location:{href:'https://chatgpt.com/c/old-conversation'},open:(...args)=>{state.calls.push(args);return null}};
state.dispose=()=>{disposers.slice().reverse().forEach(off=>off())};
document.querySelector('#native-plus').addEventListener('click',()=>state.native++);
document.querySelector('#global-new').addEventListener('click',()=>state.native++);
const dynamic=document.querySelector('#project-dynamic');
dynamic.addEventListener('pointerenter',()=>{
  if(dynamic.querySelector('button'))return;
  const btn=document.createElement('button');btn.id='dynamic-plus';btn.className='native';btn.setAttribute('aria-label','在项目中新建聊天');btn.textContent='+';
  btn.addEventListener('click',()=>state.native++);
  dynamic.append(btn);
});
dynamic.addEventListener('pointerleave',()=>dynamic.querySelector('button')?.remove());
state.mount=installNewChatButtons({doc:document,win:fakeWindow,owner});
window.__fixture=state;
</script></body></html>
