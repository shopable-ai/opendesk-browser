<script>
(function(){
const root=document.getElementById('br31'); if(!root||root.dataset.ready)return;root.dataset.ready='1';
const app=root.querySelector('#br31-app'),device=root.querySelector('#br31-device');
const shapes={settings:'M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8',plus:'M12 5v14M5 12h14',copy:'M8 8h12v12H8zM16 8V4H4v12h4',trash:'M4 7h16M10 3h4M6 7l1 14h10l1-14M10 11v6m4-6v6',stop:'M6 6h12v12H6z',play:'m8 5 11 7-11 7z',refresh:'M20 11a8 8 0 0 0-14-5L3 9M3 4v5h5M4 13a8 8 0 0 0 14 5l3-3M21 20v-5h-5',edit:'M12 20h9M16.5 3.5l4 4L9 19l-5 1 1-5L16.5 3.5z',external:'M12 5H5v14h14v-7M11 13 21 3m-7 0h7v7',monitor:'M3 4h18v13H3zM8 21h8m-4-4v4',chevron:'m9 5 7 7-7 7',alert:'m12 3 10 18H2L12 3zm0 7v4m0 3h.01',layers:'M12 3 2 8l10 5 10-5-10-5zm-10 10 10 5 10-5m-20 5 10 5 10-5',back:'m15 18-6-6 6-6M9 12h12',check:'m5 12 5 5L20 7'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${shapes[n]||shapes.chevron}"/></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clone=v=>JSON.parse(JSON.stringify(v));
const native={ua:'native',lang:'system',tz:'system',geo:'off',viewport:'native'};
const presets=[{id:'original',short:'原始',name:'原始浏览器环境',config:native},{id:'us',short:'美国',name:'美国 · 桌面 Chrome',config:{ua:'windows',lang:'en-US',tz:'America/New_York',geo:'nyc',viewport:'desktop'}},{id:'de',short:'德国',name:'德国 · 桌面 Chrome',config:{ua:'mac',lang:'de-DE',tz:'Europe/Berlin',geo:'berlin',viewport:'desktop'}},{id:'jp',short:'日本',name:'日本 · 移动测试',config:{ua:'mac',lang:'ja-JP',tz:'Asia/Tokyo',geo:'tokyo',viewport:'mobile'}}];
const values={ua:[['native','保持原始 Chrome'],['windows','Chrome · Windows'],['mac','Chrome · macOS'],['linux','Chrome · Linux']],lang:[['system','系统语言'],['zh-CN','简体中文 zh-CN'],['en-US','English en-US'],['de-DE','Deutsch de-DE'],['ja-JP','日本語 ja-JP']],tz:[['system','系统时区'],['Asia/Shanghai','Asia/Shanghai'],['America/New_York','America/New_York'],['Europe/Berlin','Europe/Berlin'],['Asia/Tokyo','Asia/Tokyo']],viewport:[['native','原始视口'],['desktop','桌面 1366 × 768'],['mobile','移动 390 × 844']]};
const sample=[{id:'p-work',name:'工作 Chrome',config:{ua:'mac',lang:'zh-CN',tz:'Asia/Shanghai',geo:'off',viewport:'desktop'}},{id:'p-japan',name:'日本移动测试',config:{ua:'mac',lang:'ja-JP',tz:'Asia/Tokyo',geo:'off',viewport:'mobile'}}];
const s={width:360,zoom:1,theme:'light',scene:'ok',tab:'config',page:'normal',view:null,mod:null,notice:'',status:'idle',active:null,profiles:sample,drafts:{},logs:[],checks:0};
const profile=id=>presets.find(p=>p.id===id)||s.profiles.find(p=>p.id===id);
const stateLocked=()=>['applied','unknown','invalidated'].includes(s.status);
const info=()=>s.status==='applied'?['已应用 · 有限核验','good','当前网页有模拟会话；停止后才能修改参数。']:s.status==='restored'?['已停止 · 有限恢复','good','模拟网页字段已恢复；HTTP 请求头未核验。']:s.status==='denied'?['未授权','warn','授权失败未改变网页；请通过原有权限入口处理。']:s.status==='unknown'?['执行结果未知','bad','禁止自动重试，先独立核对真实状态。']:s.status==='invalidated'?['目标文档已变化','warn','旧会话不能向新网页重放操作。']:['未应用','','保存配置与应用到网页是两个不同操作。'];
function initEditor(id){if(s.view?.dirty){s.drafts[s.view.source]=clone(s.view)}const p=profile(id);const source='preset:'+id;const found=s.drafts[source];s.view=found?clone(found):{source,id,name:p.name,config:clone(p.config),dirty:false,builtin:!!presets.find(x=>x.id===id)};}
initEditor('us');
const label=(field,x)=>values[field].find(([v])=>v===x)?.[1]||x;
const iconButton=(act,name,title,extra='')=>`<button type="button" class="br31-icon ${extra}" data-act="${act}" title="${esc(title)}" aria-label="${esc(title)}">${ic(name)}</button>`;
function statusCard(){const [title,dot,note]=info();return `<div class="br31-session"><div class="br31-sessionhead"><div><span class="br31-site">当前网页 · example.com <span class="br31-muted" style="font-size:9px;font-weight:400">模拟</span></span><span class="br31-status"><i class="br31-dot ${dot}"></i>${title}</span></div><button type="button" class="br31-restore" data-act="${s.status==='unknown'||s.status==='invalidated'?'review':'restore'}" ${s.status==='idle'||s.status==='restored'||s.status==='denied'?'disabled':''}>${ic('refresh')}${s.status==='unknown'||s.status==='invalidated'?'核对状态':'停止并恢复网页'}</button></div><p class="br31-sessionnote">${note}</p></div>`;}
function nav(){return `<nav class="br31-tabs" role="tablist" aria-label="主功能"><button id="br31-tab-config" aria-selected="${s.tab==='config'}" aria-controls="br31-panel-config" role="tab" data-act="tab" data-tab="config">配置</button><button id="br31-tab-profiles" aria-selected="${s.tab==='profiles'}" aria-controls="br31-panel-profiles" role="tab" data-act="tab" data-tab="profiles">我的环境</button><button id="br31-tab-detect" aria-selected="${s.tab==='detect'}" aria-controls="br31-panel-detect" role="tab" data-act="tab" data-tab="detect">检测</button></nav>`;}
function field(k,title){return `<div class="br31-field"><label for="br31-${k}">${title}</label><select id="br31-${k}" data-field="${k}" ${stateLocked()?'disabled':''}>${values[k].map(([id,t])=>`<option value="${id}" ${s.view.config[k]===id?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;}
function configPage(){const e=s.view;const saved=s.profiles.some(p=>p.id===e.id);const original=Object.keys(native).every(k=>e.config[k]===native[k]);const locked=stateLocked();return `<section class="br31-scroll" role="tabpanel" id="br31-panel-config" aria-labelledby="br31-tab-config"><div class="br31-heading"><strong>环境配置</strong><div class="br31-actions"><button type="button" class="br31-mini" data-act="new" ${locked?'disabled':''}>${ic('plus')} 新建</button><button class="br31-icon" data-act="copy" aria-label="复制当前配置" title="复制当前配置" ${locked?'disabled':''}>${ic('copy')}</button></div></div><div class="br31-pretitle">快速预设 · 选择后可直接修改参数</div><div class="br31-presets">${presets.map(p=>`<button type="button" class="${e.source==='preset:'+p.id?'active':''}" data-act="preset" data-id="${p.id}" ${locked?'disabled':''}>${p.short}</button>`).join('')}</div><div class="br31-preselect"><span>当前正在编辑</span><strong>${esc(e.name)} ${e.dirty?'<span class="br31-chip warn">未保存</span>':''}</strong></div><div class="br31-field"><label for="br31-name">环境名称</label><input id="br31-name" data-field="name" type="text" maxlength="24" value="${esc(e.name)}" ${locked?'disabled':''}></div><div class="br31-sectionline"><strong>网页环境参数</strong><button class="br31-linkbtn" data-act="reset-params" type="button" ${locked?'disabled':''}>${ic('refresh')} 恢复原始参数</button></div>${field('ua','浏览器标识 / UA、UA-CH')}${field('lang','网页语言')}${field('tz','时区')}${field('viewport','视口')}<details class="br31-details"><summary>地理位置与支持范围</summary><p class="br31-fieldnote">预设包含定位值「${esc(e.config.geo)}」，但当前 Host 不支持地理位置修改。HTTP Accept-Language 未独立验证，公网 IP 和真实设备不改变。</p></details><p class="br31-fieldnote">「恢复原始参数」只重置此表单，<b>不会恢复已修改的网页</b>。恢复网页请使用顶部「停止并恢复网页」。</p><button class="br31-pro" type="button" data-act="pro">${ic('layers')}<span><strong>了解完整浏览器环境方案</strong><small>独立 Profile / Cookie 隔离 / 代理 · 自愿了解</small></span>${ic('chevron')}</button></section><footer class="br31-footer"><button class="br31-secondary br31-save" data-act="save" type="button" ${locked?'disabled':''}>${ic('check')} <span class="br31-wide">${saved?'保存修改':'保存为环境'}</span><span class="br31-short">保存</span></button><button class="br31-primary" type="button" data-act="apply" ${locked||original?'disabled':''}>${ic('play')} <span class="br31-wide">应用到当前网页</span><span class="br31-short">应用</span></button></footer>`;}
function managerPage(){return `<section class="br31-scroll" role="tabpanel" id="br31-panel-profiles" aria-labelledby="br31-tab-profiles"><div class="br31-heading"><strong>我的环境 <span class="br31-count">${s.profiles.length}/20</span></strong><button class="br31-mini" type="button" data-act="new" ${stateLocked()?'disabled':''}>${ic('plus')} 新建</button></div><p class="br31-hint">这里只管理已保存的自定义档案。点击行载入「配置」后，可以编辑或应用。原始/美国/德国/日本内置预设在「配置」页选择。</p><div class="br31-list">${s.profiles.length?s.profiles.map(p=>{const deviceType=p.config.viewport==='mobile'?'手机':'桌面';return `<div class="br31-row"><button type="button" class="br31-rowmain" data-act="load" data-id="${esc(p.id)}" ${stateLocked()?'disabled':''}><span class="br31-ico">${ic('monitor')}</span><span class="br31-rowtext"><strong>${esc(p.name)}</strong><small>${deviceType} · ${esc(p.config.lang)} · ${esc(p.config.tz)}</small></span>${ic('chevron')}</button>${iconButton('delete-request:'+p.id,'trash','删除 '+p.name)}</div>`}).join(''):'<p class="br31-hint" style="padding:12px">没有已保存的档案。到配置页创建。</p>'}</div><p class="br31-hint">管理的是网页参数档案，不会创建隔离 Cookie 的浏览器 Profile。删除档案不会停止已经运行的环境会话。</p></section>`;}
function detectPage(){const c=s.status==='applied'&&s.active?s.active.config:native;const rows=[['User-Agent 示例',label('ua',c.ua)],['UA-CH','未独立核验'],['网页语言',label('lang',c.lang)],['时区',label('tz',c.tz)],['视口',label('viewport',c.viewport)],['自动化状态信号','未采集'],['HTTP Accept-Language','不可验证'],['公网 IP / TLS','不由本扩展控制']];return `<section class="br31-scroll" role="tabpanel" id="br31-panel-detect" aria-labelledby="br31-tab-detect"><div class="br31-heading"><strong>基础环境检测</strong><span class="br31-count">模拟读数</span></div><div class="br31-help">详细前后对比、报告和原始 JSON 继续由独立 HTTP 检测页负责。这里不会用本地模拟值冒充可信 Host 读回。</div><div class="br31-report">${rows.map(([k,v])=>`<div class="br31-detectrow"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div><div class="br31-footer" style="position:static;border:0;padding:11px 0;box-shadow:none"><button class="br31-primary" type="button" data-act="detect">${ic('refresh')} 重新检测</button><a class="br31-secondary" href="http://127.0.0.1:43111/browser-fingerprint.html" target="_blank" rel="noopener noreferrer">${ic('external')} 独立检测页</a></div><p class="br31-fieldnote">需要本地 HTTP 检测服务启动。${s.checks?'已模拟重新检测 '+s.checks+' 次。':''}</p></section>`;}
function proPage(){const rows=[['UA / 语言 / 时区','部分支持','通常支持'],['独立浏览器 Profile','不支持','通常支持'],['Cookie / 存储隔离','不支持','通常支持'],['代理 / IP','不支持','依产品而定'],['Canvas / WebGL 修改','不提供','依产品而定']];return `<section class="br31-scroll"><div class="br31-heading"><button type="button" class="br31-mini" data-act="back">${ic('back')} 返回配置</button><strong>专业环境方案</strong></div><div class="br31-help">网页配置与完整浏览器 Profile 不同。此处是了解能力的自愿入口，不影响免费功能。</div><table class="br31-table"><thead><tr><th>能力</th><th>本扩展</th><th>专业产品</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table><a href="https://gologin.com/" class="br31-external" target="_blank" rel="noopener noreferrer">GoLogin 官方网站 ${ic('external')}</a><a href="https://www.adspower.com/" class="br31-external" target="_blank" rel="noopener noreferrer">AdsPower 官方网站 ${ic('external')}</a><p class="br31-fieldnote">官网链接不含联盟推广参数。自研高级版候补尚无真实接收渠道，本原型不收集联系方式。</p></section>`;}
function settingsPage(){return `<section class="br31-scroll"><div class="br31-heading"><button class="br31-mini" data-act="back" type="button">${ic('back')} 返回</button><strong>设置与诊断</strong></div><details class="br31-details"><summary>运行记录（${s.logs.length}/18）</summary>${s.logs.length?s.logs.map(x=>`<div class="br31-log">${esc(x)}</div>`).join(''):'<p>暂无模拟记录。</p>'}</details><details class="br31-details"><summary>授权与恢复说明</summary><p>真实执行仅针对当前授权 Tab / Document；结果未知或目标已变化时，不得重复应用或向新网页重放恢复。模拟页面不调用任何 Host API。</p></details></section>`;}
function modal(){if(!s.mod)return '';return `<div class="br31-overlay"><div class="br31-modal" role="dialog" aria-modal="true" aria-label="删除档案确认"><strong>删除「${esc(profile(s.mod)?.name||'此档案')}」？</strong><p>只删除自定义档案，不修改当前网页或历史证据。</p><div class="br31-modalbuttons"><button data-act="cancel-delete">取消</button><button class="danger" data-act="confirm-delete">删除</button></div></div></div>`;}
function render(){root.dataset.theme=s.theme;device.style.width=(s.width/s.zoom)+'px';device.style.zoom=String(s.zoom);device.classList.toggle('narrow',s.width/s.zoom<230);app.style.minHeight='0';app.style.height=(665/s.zoom)+'px';app.innerHTML=`<header class="br31-head"><div class="br31-logo">◉</div><div class="br31-name"><strong>浏览器指纹</strong><small>Browser Fingerprint · 环境配置</small></div>${iconButton('settings','settings','设置与诊断')}</header>${statusCard()}${nav()}${s.page==='pro'?proPage():s.page==='settings'?settingsPage():s.tab==='profiles'?managerPage():s.tab==='detect'?detectPage():configPage()}${s.notice?`<div class="br31-toast" role="status" aria-live="polite">${esc(s.notice)}</div>`:''}${modal()}`;if(s.mod)app.querySelector('[data-act=cancel-delete]')?.focus();}
function openTab(t){s.page='normal';s.tab=t;s.notice='';render()}
function newEditor(){if(stateLocked())return;if(s.view?.dirty)s.drafts[s.view.source]=clone(s.view);s.view={source:'new',id:null,name:'自定义环境',config:clone(native),dirty:true,builtin:false};openTab('config');}
function copyEditor(){if(stateLocked())return;if(s.view?.dirty)s.drafts[s.view.source]=clone(s.view);s.view={source:'new',id:null,name:(s.view.name+' 副本').slice(0,24),config:clone(s.view.config),dirty:true,builtin:false};openTab('config');}
function selectPreset(id){if(stateLocked())return;initEditor(id);openTab('config');}
function loadSaved(id){if(stateLocked())return;if(s.view?.dirty)s.drafts[s.view.source]=clone(s.view);const p=profile(id);const source='profile:'+id;s.view=s.drafts[source]?clone(s.drafts[source]):{source,id,name:p.name,config:clone(p.config),dirty:false,builtin:false};openTab('config');}
function save(){if(stateLocked())return;const e=s.view;const name=e.name.trim();if(!name||name.length>24){s.notice='名称需要 1–24 字符。';render();return;}if(s.profiles.some(p=>p.id!==e.id&&p.name.toLowerCase()===name.toLowerCase())){s.notice='已存在同名环境。';render();return;}const existing=s.profiles.find(p=>p.id===e.id);if(existing){existing.name=name;existing.config=clone(e.config)}else{if(s.profiles.length>=20){s.notice='最多保存 20 个自定义环境。';render();return;}const id='p-'+Math.random().toString(36).slice(2,10);s.profiles.unshift({id,name,config:clone(e.config)});e.id=id;}delete s.drafts[e.source];e.source='profile:'+e.id;e.builtin=false;e.name=name;e.dirty=false;s.notice='模拟保存完成，未写入真实存储。';render();}
function originalParams(){if(stateLocked())return;s.view.config=clone(native);s.view.dirty=true;s.notice='只恢复表单参数；没有改变当前网页。';render();}
function apply(){if(stateLocked())return;const e=s.view;if(Object.keys(native).every(k=>e.config[k]===native[k])){s.notice='原始配置无需应用。需要恢复网页请点击顶部恢复操作。';render();return;}const result=s.scene;if(result==='ok'){s.status='applied';s.active={name:e.name,config:clone(e.config)};}else{s.status=result;s.active=null;}s.logs.unshift('模拟应用 · '+e.name+' · '+({ok:'已应用 / 有限核验',denied:'未授权',unknown:'结果未知',invalidated:'文档失效'}[result]));s.logs=s.logs.slice(0,18);s.notice=result==='ok'?'已模拟应用；这是演示，未修改真实网页。':result==='denied'?'模拟未授权：未执行修改。':'结果未知或文档失效，禁止重复副作用。';render();}
function restore(){if(s.status!=='applied')return;s.status='restored';s.active=null;s.logs.unshift('模拟停止 · 网页字段有限恢复');s.logs=s.logs.slice(0,18);s.notice='模拟停止与有限恢复。真实场景仍需可信 Host 独立核验。';render();}
function action(act,el){if(act.startsWith('delete-request:')){const id=act.split(':')[1];s.mod=id;render();return;}switch(act){case'tab':openTab(el.dataset.tab);return;case'new':newEditor();return;case'copy':copyEditor();return;case'preset':selectPreset(el.dataset.id);return;case'load':loadSaved(el.dataset.id);return;case'save':save();return;case'reset-params':originalParams();return;case'apply':apply();return;case'restore':restore();return;case'review':s.notice='仅能独立核对旧会话；本模拟不自动重新应用或恢复。';render();return;case'detect':s.checks++;s.notice='模拟刷新：未读取真实网页。';render();return;case'pro':s.page='pro';s.tab='config';s.notice='';render();return;case'settings':s.page='settings';s.notice='';render();return;case'back':s.page='normal';render();return;case'cancel-delete':s.mod=null;render();return;case'confirm-delete':{const id=s.mod;s.profiles=s.profiles.filter(p=>p.id!==id);delete s.drafts['profile:'+id];s.mod=null;if(s.view.id===id){s.view={source:'new',id:null,name:'自定义环境',config:clone(s.view.config),dirty:true,builtin:false};}s.notice='模拟删除已保存档案；不会停止网页上的已应用环境。';render();return;}}}
app.addEventListener('click',ev=>{const btn=ev.target.closest('[data-act]');if(btn&&!btn.disabled){ev.preventDefault();action(btn.dataset.act,btn)}});
app.addEventListener('input',ev=>{if(ev.target.dataset.field==='name'){s.view.name=ev.target.value;s.view.dirty=true;const text=app.querySelector('.br31-preselect strong');if(text)text.textContent=s.view.name+' · 未保存';}});
app.addEventListener('change',ev=>{const field=ev.target.dataset.field;if(field&&field!=='name'){s.view.config[field]=ev.target.value;s.view.dirty=true;render();}});
app.addEventListener('keydown',ev=>{if(s.mod&&ev.key==='Escape'){s.mod=null;render();return;}if(ev.target.matches('[role=tab]')&&['ArrowRight','ArrowLeft','Home','End'].includes(ev.key)){ev.preventDefault();const options=['config','profiles','detect'],i=options.indexOf(s.tab);const target=ev.key==='Home'?0:ev.key==='End'?2:ev.key==='ArrowRight'?(i+1)%3:(i+2)%3;openTab(options[target]);app.querySelector('[data-tab='+options[target]+']')?.focus();}});
root.querySelector('#br31-width').addEventListener('change',e=>{s.width=Number(e.target.value);render();});
root.querySelector('#br31-zoom').addEventListener('change',e=>{s.zoom=Number(e.target.value);render();});
root.querySelector('#br31-scenario').addEventListener('change',e=>{s.scene=e.target.value;s.notice='下次应用将模拟此回执。';render();});
root.querySelector('#br31-reset').addEventListener('click',()=>{s.status='idle';s.active=null;s.notice='已重置模拟执行状态，真实 Host 状态未改变。';render();});
root.querySelector('#br31-theme').addEventListener('click',e=>{s.theme=s.theme==='light'?'dark':'light';e.currentTarget.textContent=s.theme==='light'?'☾':'☀';render();});
render();
})();
</script></body></html>
