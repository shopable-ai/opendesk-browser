}
#clip-notes .clip-notes-head,#clip-notes-status{flex-shrink:0}
#clip-notes-status{max-height:1.55em;overflow:auto}
#clip-note-reader:not([hidden]),#clip-note-editor:not([hidden]){
 display:flex;flex:0 1 auto;flex-direction:column;min-height:0;max-height:100%;overflow:hidden
}
#clip-note-reader .clip-read-head,#clip-note-reader .clip-read-actions,
#clip-note-editor .clip-editor-head,#clip-note-origin,
#clip-note-editor .clip-editor-actions,#clip-note-unsaved{flex-shrink:0}
#clip-note-reader h2{font-size:15px;line-height:1.4;margin:9px 0 5px}
#clip-note-read-origin{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-reader-content{min-height:0;flex:1 1 auto;overflow:auto;overscroll-behavior:contain}
#clip-note-read-body{
 display:block;width:100%;height:auto;min-height:0;max-height:none;
 margin:9px 0;overflow:visible;
 background:var(--paper)
}
#clip-note-editor #clip-note-body{
 field-sizing:content;resize:none;min-height:24px;max-height:none;
 flex:0 1 auto;overflow:auto;overscroll-behavior:contain
}
#clip-note-reader .clip-remove-confirm{top:auto;bottom:44px}
#clip-notes[data-view=editing] #clip-note-list[hidden]{
 display:grid!important;flex:0 1 72px;min-height:0;max-height:72px;
 opacity:.35;pointer-events:none;overflow:hidden
}
/* At narrow effective widths (including browser zoom), keep all three actions
   in one row so the reader retains space for scrollable content. */
@container(max-width:220px){
 .clip-read-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
 .clip-read-actions button{flex-direction:column;min-width:0;padding:3px 1px;gap:1px;font-size:11px}
}
@media(pointer:coarse){.clip-note-buttons{opacity:1;pointer-events:auto}
 .clip-note-card:focus-within .clip-note-buttons{opacity:1;pointer-events:auto}}
@media(max-width:360px){
 .clip{padding:9px}
 #clip-source,.clip-preview:not(.clip-note-read-body){height:130px}
 .clip-note-card{padding:8px}
 .clip-read-actions{gap:4px}
 .clip-read-actions button{font-size:11px;padding:5px}
 .clip-filter-wrap{max-width:88px}
 #clip-kind-filter{max-width:61px}
}
@media(max-height:560px){
 #clip-notes[data-view=editing] #clip-note-list[hidden]{display:none!important}
 #clip-note-reader h2{margin:5px 0 2px}
 #clip-note-read-body{margin:6px 0}
 #clip-note-editor .clip-hint{margin:4px 0}
}
@media(prefers-color-scheme:dark){
 .clip-note-card{background:var(--layer)}
 .clip-note-buttons button.clip-icon-button{background:var(--paper)}
 .clip-note-buttons button.clip-danger:hover{background:var(--od-negative-bg);color:var(--od-negative);border-color:var(--od-negative)}
 .clip-remove-confirm{background:var(--paper)}
}
@media(prefers-reduced-motion:reduce){.clip-note-buttons{transition:none}}

/* Only official integrated hosts hide redundant inner headers.
   Independent tool pages/previews retain their original accessible navigation. */
.clip.clip-hosted{border:0;border-radius:0;padding-top:4px}
.clip.clip-hosted .clip-brand,
.clip.clip-hosted #clip-title,
.clip.clip-hosted .clip-notes-head,
.clip.clip-hosted .clip-editor-head,
.clip.clip-hosted .clip-read-head{display:none!important}
.clip.clip-hosted .clip-note-editor,
.clip.clip-hosted .clip-note-reader{margin-top:0}
.clip-note-excerpt:empty{display:none}

/* The official integrated Host supplies the whole workspace, while the
 * existing reader/editor retain their content scrolling and tool navigation. */
#tool-root[data-opendesk-height-mode="workspace"] .clip{
  min-height:var(--opendesk-host-available-height);
}

/* Anchor help to the top of the workspace at both the local and host entry. */
.clip-head{position:relative;min-width:0}.clip-brand span{max-width:100%}
.clip-context-help{flex:none;margin-inline-start:auto;color:var(--od-sub)}
#clip-home[data-header-help="true"] .clip-head{height:0;margin:0}
#clip-home[data-header-help="true"] .clip-context-help>summary{display:none}
.clip-context-help>summary{display:flex;align-items:center;justify-content:center;width:32px;height:32px;list-style:none;cursor:pointer;border:1px solid transparent;border-radius:var(--radius-control)}
.clip-context-help>summary::-webkit-details-marker{display:none}
.clip-context-help>summary:hover,.clip-context-help[open]>summary{color:var(--od-accent-ink);background:var(--od-muted);border-color:var(--od-line)}
.clip-help-panel{position:absolute;z-index:12;inset-block-start:calc(100% + 4px);inset-inline-end:0;width:min(288px,100%);padding:12px;border:1px solid var(--od-line);border-radius:var(--radius-control);background:var(--od-paper);box-shadow:0 8px 22px color-mix(in srgb,var(--od-ink) 12%,transparent);font-size:var(--od-note-size);line-height:1.55}
.clip-help-panel>strong{display:block;color:var(--od-ink);font-weight:600}
.clip-context-help #clip-selection-hint{max-width:100%;overflow-wrap:anywhere;margin:6px 0 0;font-size:var(--od-note-size)}
.clip-backup-menu{position:relative;margin-left:auto}
.clip-backup-menu>summary{list-style:none;min-height:30px;display:flex;align-items:center;cursor:pointer;font-size:var(--od-note-size);color:var(--od-sub)}
.clip-backup-menu>summary::-webkit-details-marker{display:none}
.clip-backup-menu[open]>button{position:absolute;z-index:8;right:0;top:100%;width:max-content;max-width:min(220px,84vw);border:1px solid var(--od-line);background:var(--od-paper);box-shadow:0 8px 22px color-mix(in srgb,var(--od-ink) 12%,transparent)}
