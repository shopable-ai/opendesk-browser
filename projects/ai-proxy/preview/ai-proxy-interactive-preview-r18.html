<body>
<header class="studio-header">
 <div class="studio-header-inner">
  <div class="studio-brand"><div class="studio-mark">AP</div><div><h1>AI Proxy · 侧边栏入口优化</h1><p>R18 · 代理选择与实际应用分离 · PC 设置页面保持不变</p></div></div>
  <div class="studio-controls" role="group" aria-label="预览控制">
   <span class="control-label">方案对比</span>
   <div class="segments" role="group" aria-label="优化前后对比"><button id="mode-before" data-ui="before" aria-pressed="false">优化前</button><button id="mode-after" data-ui="after" aria-pressed="true">优化后</button></div>
   <label class="visually-hidden" for="scene">运行状态</label><select id="scene" class="scenario-select"><option value="normal">正常使用</option><option value="empty">首次使用</option><option value="error">连接异常</option><option value="conflict">扩展冲突</option><option value="unknown">状态未知</option></select>
   <button id="reset" class="reset-btn" title="重置预览" aria-label="重置预览"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 2.8-6.5M3 4v5h5"/></svg> 重置</button>
  </div>
 </div>
</header>
<main class="studio-body" id="app" aria-live="off"></main>
<div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<script>
'use strict';
const icons={
  arrowLeft:'<path d="m14 6-6 6 6 6M8 12h13"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M10 2h4l.6 2.3 1.7.9 2.2-.9 2.2 3.2-1.6 1.9v2.6l1.6 1.9-2.2 3.2-2.2-.9-1.7.9L14 21h-4l-.6-2.3-1.7-.9-2.2.9-2.2-3.2L5 13.6V11L3.4 9.1l2.2-3.2 2.2.9 1.7-.9z"/>',plus:'<path d="M12 5v14M5 12h14"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',link:'<path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.2 1.2M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.2-1.2"/>',network:'<rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M7.5 20.5h9m-4.5-4v4"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',shield:'<path d="m12 2 8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/>',route:'<path d="M6 4h6a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h9"/><circle cx="6" cy="4" r="2"/><circle cx="18" cy="20" r="2"/>',folder:'<path d="M3 6h6l2 2h10v11H3z"/>',check:'<path d="m4 12 5 5L20 6"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7.5 7.5 0 0 1 12-3l2.5 2M18.5 15a7.5 7.5 0 0 1-12 3L4 16"/>',play:'<path d="m8 5 11 7-11 7z"/>',pause:'<path d="M8 5v14m8-14v14"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',external:'<path d="M7 17 17 7M9 7h8v8"/>',alert:'<path d="M12 3 2 21h20zM12 9v5m0 3h.01"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',list:'<path d="M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01"/>',file:'<path d="M5 2h10l5 5v15H5zM14 2v6h6"/>',wifi:'<path d="M2 8a15 15 0 0 1 20 0M5 12a11 11 0 0 1 14 0M9 16a6 6 0 0 1 6 0"/><circle cx="12" cy="20" r="1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',server:'<rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01"/>',book:'<path d="M12 6a7 7 0 0 0-9-2v15a7 7 0 0 1 9 2 7 7 0 0 1 9-2V4a7 7 0 0 0-9 2M12 6v15"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',chev:'<path d="m9 18 6-6-6-6"/>',edit:'<path d="m4 20 4.5-1 11-11-3.5-3.5-11 11L4 20zM14 6l3.5 3.5"/>'};
const icon=(key,size=18)=>`<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[key]||icons.info}</svg>`;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const initial=()=>({comparison:'after',scene:'normal',view:'side',section:'profiles',mode:'profile',selected:'p1',applied:true,activeMode:'profile',activeProfile:'p1',switchingTo:null,site:'example.com',profiles:[{id:'p1',name:'香港节点 · 主用',host:'proxy.example.com:7890',scheme:'SOCKS5'},{id:'p2',name:'美国节点 · 备用',host:'us.example.net:1080',scheme:'SOCKS5'},{id:'p3',name:'本地 Clash',host:'127.0.0.1:7890',scheme:'HTTP'}],subs:[{id:'s1',name:'我的订阅',url:'https://example.com/my-subscription',enabled:true}],rules:[{id:'r1',domain:'example.com',target:'香港节点 · 主用',enabled:true}],editor:null,diagnosticRan:false,diagCount:0,notice:'',siteEditor:false,navTab:'扩展',subTab:'sources',startup:false});
let s=initial();let toastTimer=null;let switchRevision=0;const app=document.getElementById('app');
const popToast=(message)=>{const t=document.getElementById('toast');t.innerHTML=`${icon('info',16)}<span>${escapeHtml(message)}</span>`;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2800)};
const profilesNow=()=>s.scene==='empty'?[]:s.profiles;
const modeLabels={profile:'使用代理',rules:'按规则',direct:'直接连接',system:'跟随系统'};
const modeIcons={profile:'server',rules:'route',direct:'network',system:'gear'};
const profileName=id=>s.profiles.find(p=>p.id===id)?.name||'未选择代理';
const desiredRoute=()=>s.mode==='profile'?profileName(s.selected):modeLabels[s.mode];
const activeRoute=()=>s.activeMode==='profile'?profileName(s.activeProfile):modeLabels[s.activeMode];
const isPending=()=>s.applied && (s.mode!==s.activeMode || (s.mode==='profile' && s.selected!==s.activeProfile));
const status=()=>{
 const before=s.comparison==='before'||s.view==='pc';
 const normal=before
  ? {label:s.applied?'正在运行':'已暂停',description:s.applied?'已由本扩展管理浏览器代理':'已保留选择，尚未应用',tone:s.applied?'ok':'warn',button:s.applied?'暂停':'启用'}
  : s.switchingTo
    ? {label:'正在切换',description:'正在切换至 '+profileName(s.switchingTo)+'（离线模拟）',tone:'warn',button:'切换中…'}
    : s.applied
      ? {label:'正在运行',description:'当前线路：'+activeRoute(),tone:'ok',button:isPending()?'应用更改':'暂停'}
      : {label:'已暂停',description:'已选：'+desiredRoute()+' · 尚未启用',tone:'warn',button:s.mode==='profile'&&!s.selected?'选择代理':'启用'};
 const map={normal,empty:{label:'尚未配置',description:'添加代理或订阅来源后开始使用',tone:'warn',button:'添加代理'},error:{label:'连接异常',description:'代理不可用，请检查连接设置',tone:'bad',button:'重试'},conflict:{label:'无法接管',description:'浏览器代理正在由其他扩展管理',tone:'bad',button:'查看原因'},unknown:{label:'状态尚未确认',description:'结果未知，需要核查当前状态',tone:'warn',button:'刷新状态'}};
 return map[s.scene];
};
function renderSide(){
 const st=status();const list=profilesNow(); const inError=['error','conflict','unknown'].includes(s.scene);
 return `<div class="stage-layout">
 <div class="preview-col"><div class="frame-note"><strong>侧边栏 · ${s.comparison==='before'?'优化前':'优化后'}</strong><span>400 px · 可交互模拟</span></div>
 <div class="side-frame">
  <nav class="workbench-tabs" role="tablist" aria-label="OpenDesk 工作台">${['我的','扩展','工作流','开发','云控'].map(n=>`<button data-action="host-tab" data-value="${n}" role="tab" aria-selected="${s.navTab===n}">${n}</button>`).join('')}</nav>
  <div class="tool-host-header"><button class="icon-btn" data-action="back-list" title="返回扩展列表" aria-label="返回扩展列表">${icon('arrowLeft')}</button><span class="host-title">AI Proxy</span><span class="host-glyph" aria-label="AI 对话">AI</span><button class="icon-btn" data-action="go-pc" data-section="profiles" title="管理设置" aria-label="管理设置">${icon('gear')}</button></div>
  ${s.navTab!=='扩展'?`<div class="side-placeholder">${icon('folder',30)}<h3>${escapeHtml(s.navTab)}</h3><p>其他工作台内容不属于 AI Proxy 本轮改动范围</p><button class="secondary-btn" data-action="host-tab" data-value="扩展">返回扩展</button></div>`:
  `<div class="side-body" id="sidebar-scroll">
   <section class="proxy-section" data-section="modes"><div class="section-head"><h3>连接方式</h3><div class="section-actions"><button class="icon-btn" data-action="start-add" title="添加代理" aria-label="添加代理">${icon('plus')}</button><button class="icon-btn" data-action="go-pc" data-section="profiles" title="管理设置" aria-label="管理设置">${icon('gear')}</button></div></div>
    <div class="mode-grid" role="group" aria-label="代理模式">${Object.entries(modeLabels).map(([k,v])=>`<button class="mode-btn" data-action="set-mode" data-value="${k}" aria-pressed="${s.mode===k}" ${s.switchingTo?'disabled':''}>${icon(modeIcons[k])}<span>${v}</span></button>`).join('')}</div>
   </section>
   <section class="proxy-section" data-section="runtime"><div class="status-box"><div class="status-copy"><div class="status-top"><span class="dot ${st.tone}"></span>${st.label}</div><span class="status-desc">${st.description}</span></div><button class="primary-btn" data-action="status-button" ${s.switchingTo?'disabled aria-busy="true"':''}>${st.button}</button></div>
    ${s.scene==='normal'?(s.comparison==='before'
       ? `<p class="runtime-tip">当前选择：${escapeHtml(desiredRoute())}${s.applied?' · 已应用':' · 尚未应用'}</p>`
       : isPending() && !s.switchingTo
         ? `<p class="runtime-tip is-pending">仍在使用：${escapeHtml(activeRoute())}；待应用：${escapeHtml(desiredRoute())}</p>`
         : !s.applied ? `<p class="runtime-tip">已预选线路，点击「启用」后生效。</p>` : ''):''}
    ${inError&&s.comparison==='after'?`<div class="diagnostic-inline"><span style="color:#a86d0d">${icon('alert',17)}</span><p>${s.scene==='conflict'?'发现代理控制冲突':s.scene==='unknown'?'当前代理状态需要核验':'连接异常，可查看详细排查信息'}</p><button data-action="go-pc" data-section="diagnostic">网络诊断 ${icon('external',13)}</button></div>`:''}
    ${inError&&s.comparison==='before'?`<p class="error-note">${s.scene==='conflict'?'浏览器代理受其他扩展控制':s.scene==='unknown'?'无法确认操作结果':'代理连接失败'}</p>`:''}
   </section>
   <section class="proxy-section" data-section="proxies"><div class="section-head"><h3>${list.length?'我的代理':'订阅与本地客户端'}${list.length?`<span class="count">${list.length}</span>`:''}</h3>${list.length?`<button class="icon-btn" data-action="go-pc" data-section="profiles" title="管理全部 · 打开 PC 管理" aria-label="管理全部">${icon('server')}</button>`:''}</div>
     ${list.length?`<div class="profile-list">${list.slice(0,4).map(p=>{
       const chosen=s.mode==='profile'&&s.selected===p.id;
       const active=s.applied && s.scene==='normal' && s.activeMode==='profile'&&s.activeProfile===p.id;
       const unavailable=s.scene==='conflict'||s.scene==='unknown'||Boolean(s.switchingTo);
       const label=s.comparison==='before'?(chosen?'已选择':'使用'):
         s.switchingTo===p.id?'切换中…':active?'使用中':chosen?'待启用':s.applied?'切换':'选择';
       return `<button class="profile-row" data-action="select-profile" data-value="${p.id}" aria-pressed="${chosen}" aria-current="${s.comparison==='after'&&active}" aria-label="${escapeHtml(p.name+'，'+label)}" ${s.comparison==='after'&&unavailable?'disabled':''}><span class="profile-badge">${p.scheme==='SOCKS5'?'S':'H'}</span><span class="profile-details"><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.scheme)} · ${escapeHtml(p.host)}</small></span><span class="profile-action ${s.switchingTo===p.id?'is-busy':active?'is-live':chosen?'is-planned':''}">${s.comparison==='after'&&active?icon('check',13):''}${label}</span></button>`;
     }).join('')}</div><button class="add-proxy-btn" data-action="start-add">${icon('plus',15)}添加代理</button>${s.comparison==='after'&&!s.applied&&s.scene==='normal'?`<p class="profile-hint">当前仅选择代理，尚未启用浏览器代理。</p>`:''}`:
     `<p class="empty-intro">尚未有可用代理，可以从以下方式开始：</p><div class="empty-actions"><button data-action="go-pc" data-section="subscriptions" data-editor="new-sub"><span class="empty-action-title">${icon('link',16)}导入订阅</span><small>通过订阅链接添加</small></button><button data-action="start-local"><span class="empty-action-title">${icon('network',16)}本地客户端</span><small>Clash / sing-box</small></button></div>`}
   </section>
   <section class="proxy-section" data-section="site"><div class="section-head"><h3>当前网站</h3><button class="icon-btn" data-action="go-pc" data-section="rules" title="管理网站规则 · 打开 PC 管理" aria-label="管理网站规则">${icon('route')}</button></div><div class="site-domain">${icon('globe',16)}<span>${escapeHtml(s.site)}</span></div><div class="site-context">当前页面 · 仅显示示例域名</div><dl class="site-routing"><dt>浏览器设置</dt><dd>${s.applied?(s.comparison==='before'?modeLabels[s.mode]:modeLabels[s.activeMode]):'跟随系统'}</dd><dt>预期线路</dt><dd>${escapeHtml(desiredRoute())}</dd></dl><p class="site-help">切换规则或代理后，可能需要明确应用才会生效。</p><div class="site-actions"><button class="secondary-btn" data-action="site-rule">${icon('plus',14)}为此网站添加规则</button><button class="secondary-btn" data-action="refresh-site">${icon('refresh',14)}刷新网站</button></div></section>
   <details class="mini-disclosure"><summary>高级代理功能</summary><div class="mini-content">轮换计划、PAC 和更多配置保留在 PC 管理中。<button class="ghost-btn" data-action="go-pc" data-section="profiles">管理高级选项 ${icon('external',13)}</button></div></details>
   <p class="legal">只管理浏览器代理设置，不会改变设备的全局代理。</p>
  </div>
  ${s.comparison==='before'?`<nav class="legacy-footer" aria-label="底部固定操作"><button data-action="go-pc" data-section="subscriptions">订阅来源<span class="outer">↗</span></button><button data-action="go-pc" data-section="diagnostic">网络诊断<span class="outer">↗</span></button></nav>`:''}`}
 </div></div>
 <aside class="review-col" aria-label="改动对照说明"><div class="review-card"><div class="review-head"><span class="review-index">${s.comparison==='before'?'旧':'新'}</span><h2>${s.comparison==='before'?'旧版：按钮语义容易误解':'R18：切换状态清晰可控'}</h2></div>
 ${s.comparison==='before'?`<div class="review-item">${icon('alert',17)}<div><strong>低频动作固定占据位置</strong><p>不论是否需要诊断，两个大按钮始终在底部占据一整行。</p></div></div><div class="review-item">${icon('alert',17)}<div><strong>与设置入口重复</strong><p>订阅和诊断本身就是 PC 管理栏目，又被放在侧栏底部。</p></div></div><div class="review-item">${icon('alert',17)}<div><strong>操作优先级不清晰</strong><p>用户容易把配置、排障和代理启停理解成同一等级。</p></div></div>`:
 `<div class="review-item">${icon('check',17)}<div><strong>移除底部常驻双按钮</strong><p>代理状态、列表和当前网站保持原有结构，底部不再抢占高度。</p></div></div><div class="review-item">${icon('check',17)}<div><strong>订阅：放在需要它的位置</strong><p>未配置时提供「导入订阅」；其他时候通过 PC 管理集中维护。</p></div></div><div class="review-item">${icon('check',17)}<div><strong>诊断：只在出现问题时提示</strong><p>异常、控制冲突或状态未知时，在运行状态附近给出直接入口。</p></div></div>`}
 <div class="review-divider"></div><div class="review-footer">R18 同时优化了「我的代理」点击切换：运行中单击其他代理完成模拟切换；暂停时仅预选，点击启用才生效。切换期间保留旧的已应用线路，连接方式更改也不会误报暂停。PC 管理页面代码与样式保留 R17 原样。所有操作均为内存模拟。</div><div class="review-test"><button data-action="scene-shortcut" data-value="normal">正常</button><button data-action="scene-shortcut" data-value="empty">首次使用</button><button data-action="scene-shortcut" data-value="error">连接异常</button></div>
 <div class="legend">${s.comparison==='after'?'建议体验：正常运行时点击「美国节点 · 备用」，观察「切换中 → 使用中」；再暂停后选择「本地 Clash」，确认不会自动启用。也可点击直接连接，查看待应用状态。':'旧版点击其他代理后会把运行状态直接改成「已暂停」，无法区分已选和实际线路。'}</div>
 </div></aside></div>`;
}
function managementHeader(title,description,button=''){return `<div class="pc-heading"><div><div class="pc-breadcrumb">AI Proxy / 管理 / ${escapeHtml(title)}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(description)}</p></div>${button}</div>`}
function profileContent(){return `${managementHeader('我的代理','集中管理代理服务器、分组和连接配置。',`<button class="primary-btn" data-action="edit" data-editor="new-proxy">${icon('plus',15)} 添加代理</button>`)}
<div class="pc-grid"><div class="stat-card"><p>已保存代理</p><div class="value">${s.profiles.length}</div><p>本次预览数据</p></div><div class="stat-card"><p>当前选择</p><div class="value" style="font-size:15px;margin-top:13px">${escapeHtml(s.profiles.find(p=>p.id===s.selected)?.name||'暂无')}</div><p>选择与应用分开</p></div><div class="stat-card"><p>管理范围</p><div class="value" style="font-size:16px;margin-top:12px">浏览器代理</div><p>非设备全局代理</p></div></div>
<div class="pc-card"><header><div><h3>代理列表</h3><p>这里管理所有代理，侧栏只提供高频快捷选择。</p></div></header><div class="pc-list">${s.profiles.map(p=>`<div class="pc-list-row"><div class="p-icon">${icon('server')}</div><div class="info"><strong>${escapeHtml(p.name)}</strong><p>${escapeHtml(p.scheme)} · ${escapeHtml(p.host)}</p></div>${s.selected===p.id?'<span class="tag">已选择</span>':'<span class="tag neutral">可用</span>'}<button class="secondary-btn" data-action="select-profile" data-value="${p.id}">选择</button></div>`).join('')||`<div class="blank-slab">尚未添加代理</div>`}</div>
<div style="display:flex;gap:8px;justify-content:flex-start;margin-top:14px"><button class="ghost-btn" data-action="go-pc" data-section="subscriptions">${icon('link',15)}添加订阅来源 ${icon('external',12)}</button></div></div>${renderEditor()}`}
function rulesContent(){return `${managementHeader('网站规则','为指定网站选择代理、直连或按默认线路处理。',`<button class="primary-btn" data-action="edit" data-editor="new-rule">${icon('plus',15)} 新建规则</button>`)}<div class="pc-card"><header><div><h3>网站规则</h3><p>精确匹配与子域名规则统一管理。</p></div></header><div class="pc-list">${s.rules.length?s.rules.map(r=>`<div class="pc-list-row"><span class="p-icon">${icon('globe')}</span><div class="info"><strong>${escapeHtml(r.domain)}</strong><p>使用：${escapeHtml(r.target)} · 包含子域名</p></div><span class="tag">已启用</span></div>`).join(''):`<div class="blank-slab">还没有网站规则</div>`}</div></div>${renderEditor()}`}
function subscriptionsContent(){return `${managementHeader('订阅与客户端','管理订阅来源及本地代理客户端。不是日常连接的快捷开关。',`<button class="primary-btn" data-action="edit" data-editor="new-sub">${icon('plus',15)} 新增订阅来源</button>`)}<nav class="subnav" role="tablist"><button data-action="subtab" data-value="sources" aria-selected="${s.subTab==='sources'}">订阅来源</button><button data-action="subtab" data-value="local" aria-selected="${s.subTab==='local'}">本地客户端</button></nav>${s.subTab==='sources'?`<div class="pc-card"><header><div><h3>已保存的订阅</h3><p>这里展示的是本次交互演示的数据，不代表真实订阅已联网同步。</p></div><span class="tag neutral">${s.subs.length} 条</span></header><div class="pc-list">${s.subs.map(sub=>`<div class="pc-list-row"><div class="p-icon">${icon('link')}</div><div class="info"><strong>${escapeHtml(sub.name)}</strong><p>${escapeHtml(sub.url)}</p></div><span class="tag neutral">演示来源</span></div>`).join('')||'<div class="blank-slab">尚未保存订阅</div>'}</div></div>`:`<div class="pc-card"><header><div><h3>本地客户端</h3><p>配置 Clash、sing-box 等本地代理应用的监听端口。</p></div><button class="secondary-btn" data-action="edit" data-editor="new-local">${icon('plus',14)} 添加客户端</button></header><div class="pc-list"><div class="pc-list-row"><span class="p-icon">${icon('network')}</span><div class="info"><strong>示例本地客户端</strong><p>SOCKS5 · 127.0.0.1:7890（演示）</p></div><span class="tag neutral">未验证</span></div></div></div>`}${renderEditor()}`}
function diagnosticsContent(){const diagSt=status();const ran=s.diagnosticRan;return `${managementHeader('网络诊断','集中查看状态、权限与排障信息。仅在需要时从侧边栏快捷进入。',`<button class="primary-btn" data-action="run-diag">${icon('refresh',15)} ${ran?'重新模拟检测':'模拟检测'}</button>`)}<div class="notice warning" style="margin-bottom:18px">本页是离线交互预览。点击模拟检测不会连接网站、检测真实网络或改变代理配置。</div><div class="pc-grid"><div class="stat-card"><p>代理状态</p><div class="value" style="font-size:17px;margin-top:11px">${diagSt.label}</div><p>${diagSt.description}</p></div><div class="stat-card"><p>浏览器控制</p><div class="value" style="font-size:17px;margin-top:11px">${s.scene==='conflict'?'被其他扩展接管':'未执行实测'}</div><p>仅读取模拟状态</p></div><div class="stat-card"><p>诊断结果</p><div class="value" style="font-size:17px;margin-top:11px">${ran?'已模拟':'尚未检测'}</div><p>${ran?`第 ${s.diagCount} 次模拟`:'等待用户主动操作'}</p></div></div><div class="pc-card"><header><div><h3>诊断项目</h3><p>诊断时应先检查状态，不直接更改浏览器代理。</p></div></header><div class="diag-row"><span class="diag-icon">${icon('shield',16)}</span><div><strong>扩展控制权</strong><p>是否有其他扩展管理系统代理设置</p></div><span class="diag-status ${ran&&s.scene!=='conflict'?'good':''}">${ran?(s.scene==='conflict'?'模拟：存在冲突':'模拟：未发现冲突'):'待检测'}</span></div><div class="diag-row"><span class="diag-icon">${icon('server',16)}</span><div><strong>代理配置</strong><p>地址、协议、端口与选择状态</p></div><span class="diag-status ${ran&&s.scene==='normal'?'good':''}">${ran?(s.scene==='empty'?'模拟：尚未配置':s.scene==='error'?'模拟：代理无响应':'模拟：已读取配置'):'待检测'}</span></div><div class="diag-row"><span class="diag-icon">${icon('wifi',16)}</span><div><strong>目标网络连通性</strong><p>离线预览不发起真实网络请求</p></div><span class="diag-status">不执行</span></div></div><div class="pc-card" style="background:#fafcff"><h3>下一步建议</h3><p class="muted" style="font-size:12px;margin-top:8px">${s.scene==='conflict'?'检查其他代理扩展或浏览器的代理控制来源。':s.scene==='error'?'检查代理地址、端口及本地客户端是否正常启动。':s.scene==='unknown'?'先确认实际运行状态，再决定是否重试。':s.scene==='empty'?'先添加代理或订阅来源，再进行连接诊断。':'如需查看详细配置，可以进入「我的代理」或「订阅与客户端」。'}</p><button class="ghost-btn" style="margin-top:10px" data-action="go-pc" data-section="profiles">查看代理配置 ${icon('external',13)}</button></div>`}
function backupContent(){return `${managementHeader('导入与备份','配置的导入、导出与恢复集中在这里。')}<div class="pc-card"><header><div><h3>导出模拟配置</h3><p>导出本次演示中的代理名称、网站规则与订阅示例，不包含真实凭据。</p></div><button class="secondary-btn" data-action="export">${icon('download',15)} 导出 JSON</button></header><div class="notice info">本预览导出的数据仅包含您在此演示页面中创建的信息。</div></div><div class="pc-card"><header><div><h3>从文件导入</h3><p>正式产品可以在这里验证结构与敏感字段。本预览不读取或写入真实扩展存储。</p></div></header><div class="blank-slab">当前只展示导入位置，不对真实配置进行变更</div></div>`}
function generalContent(){return `${managementHeader('通用设置','管理界面行为与一般使用偏好。')}<div class="pc-card"><header><div><h3>基础偏好</h3><p>设置仅影响本次页面的模拟数据。</p></div></header><div class="diag-row"><span class="diag-icon">${icon('globe',17)}</span><div><strong>界面语言</strong><p>当前预览使用简体中文</p></div><span class="tag neutral">简体中文</span></div><div class="diag-row"><span class="diag-icon">${icon('play',17)}</span><div><strong>打开扩展时显示状态</strong><p>预览内偏好开关</p></div><input class="switch" data-action="toggle-startup" aria-label="打开扩展时显示状态" type="checkbox" ${s.startup?'checked':''}></div><div class="diag-row"><span class="diag-icon">${icon('info',17)}</span><div><strong>隐私与安全</strong><p>不在网页中直接暴露代理凭据</p></div><span class="tag">建议开启</span></div></div>`}
function officialContent(){return `${managementHeader('可选官方网络','了解与官方网络相关的可选能力和说明。')}<div class="pc-card"><header><div><h3>官方网络</h3><p>这是独立的扩展管理栏目，不在日常代理侧栏底部显示。</p></div></header><div class="notice info">交互设计预览不连接官方服务，也不代表实际套餐、权限或网络状态。</div></div>`}
function renderEditor(){if(!s.editor)return '';const e=s.editor;let body='';let heading='';if(e==='new-proxy'){heading='添加代理';body=`<div class="form-grid"><div class="field"><label for="edit-name">名称</label><input id="edit-name" name="name" placeholder="例如：自用代理" required></div><div class="field"><label for="edit-scheme">代理协议</label><select id="edit-scheme" name="scheme"><option>HTTP</option><option>HTTPS</option><option>SOCKS5</option></select></div><div class="field"><label for="edit-host">服务器地址</label><input id="edit-host" name="host" placeholder="proxy.example.com" required></div><div class="field"><label for="edit-port">端口</label><input id="edit-port" name="port" type="number" min="1" max="65535" placeholder="7890" required></div></div>`}
else if(e==='new-sub'){heading='新增订阅来源';body=`<div class="form-grid"><div class="field"><label for="edit-name">来源名称</label><input id="edit-name" name="name" placeholder="例如：我的订阅" required></div><div class="field"><label for="edit-type">来源类型</label><select id="edit-type" name="type"><option value="subscription">订阅链接</option></select></div><div class="field full"><label for="edit-url">订阅链接</label><input id="edit-url" name="url" type="url" placeholder="https://example.com/subscription" required><span class="help">演示模式仅记录文本，不向该地址发送请求。</span></div></div>`}
else if(e==='new-local'){heading='添加本地客户端';body=`<div class="form-grid"><div class="field"><label for="edit-name">客户端名称</label><input id="edit-name" name="name" placeholder="例如：我的 Clash" required></div><div class="field"><label for="edit-port">监听端口</label><input id="edit-port" name="port" type="number" min="1" max="65535" placeholder="7890" required></div></div>`}
else if(e==='new-rule'){heading='新增网站规则';body=`<div class="form-grid"><div class="field"><label for="edit-domain">网站域名</label><input id="edit-domain" name="domain" value="${escapeHtml(s.site)}" required></div><div class="field"><label for="edit-target">线路</label><select id="edit-target" name="target"><option value="直连">直连</option>${s.profiles.map(p=>`<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join('')}</select></div></div>`}
else return '';
return `<div class="pc-card" id="editor" style="border-color:#b5c7f0;background:#fbfcff"><header><h3>${heading}</h3><button class="icon-btn" aria-label="取消编辑" title="取消编辑" data-action="cancel-editor">${icon('close')}</button></header><form id="editor-form" data-editor="${e}">${body}<div class="form-actions"><button class="secondary-btn" type="button" data-action="cancel-editor">取消</button><button class="primary-btn" type="submit">保存（模拟）</button></div></form></div>`}
const sectionInfo={profiles:['我的代理','server'],rules:['网站规则','route'],subscriptions:['订阅与客户端','link'],backup:['导入与备份','folder'],diagnostic:['网络诊断','network'],general:['通用设置','gear'],official:['可选官方网络','globe']};
function renderPc(){const titles={profiles:profileContent,rules:rulesContent,subscriptions:subscriptionsContent,backup:backupContent,diagnostic:diagnosticsContent,general:generalContent,official:officialContent};return `<div class="pc-wrapper"><div class="pc-top"><span class="pc-logo">AP</span><div><h2>AI Proxy</h2><span>管理中心 · PC 视图</span></div><div class="push"></div><span class="tag neutral" style="margin-right:8px">离线模拟</span><button class="secondary-btn" data-action="back-side">${icon('arrowLeft',15)} 返回侧栏</button></div><div class="pc-layout"><nav class="pc-nav" aria-label="设置导航"><div class="nav-label">管理导航</div>${Object.entries(sectionInfo).map(([k,[label,i]])=>`<button aria-current="${s.section===k?'page':'false'}" data-action="pc-section" data-section="${k}">${icon(i)}${label}</button>`).join('')}</nav><div class="pc-content" id="pc-scroll">${titles[s.section]()}</div></div></div>`}
function render(){const sideTop=document.getElementById('sidebar-scroll')?.scrollTop??0;const pcTop=document.getElementById('pc-scroll')?.scrollTop??0;document.getElementById('mode-before').setAttribute('aria-pressed',String(s.comparison==='before'));document.getElementById('mode-after').setAttribute('aria-pressed',String(s.comparison==='after'));document.getElementById('scene').value=s.scene;app.innerHTML=s.view==='side'?renderSide():renderPc();const scrollSide=document.getElementById('sidebar-scroll');if(scrollSide)scrollSide.scrollTop=sideTop;const scrollPc=document.getElementById('pc-scroll');if(scrollPc)scrollPc.scrollTop=pcTop;document.title=`AI Proxy · ${s.comparison==='before'?'优化前':'优化后'} · ${s.view==='side'?'侧边栏':'PC管理'}交互预览`}
function selectScene(value){
 switchRevision++; s.switchingTo=null; s.scene=value;
 if(value==='empty'){s.applied=false;s.selected='';s.mode='profile';s.activeProfile='';s.activeMode='profile'}
 else if(value==='normal'){
   s.mode='profile';s.selected=s.profiles[0]?.id||'';s.applied=true;
   s.activeMode='profile';s.activeProfile=s.selected;
 }else{s.applied=false;}
 s.editor=null;s.diagnosticRan=false;render();
}
function goPC(section,editor){s.view='pc';s.section=section||'profiles';s.editor=editor||null;if(s.section!=='subscriptions')s.subTab='sources';render();if(s.editor)document.getElementById('editor')?.scrollIntoView({block:'nearest'})}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
 if(action==='host-tab'){s.navTab=el.dataset.value;render()}
 else if(action==='back-list'){s.navTab='扩展';popToast('当前仅预览 AI Proxy；扩展列表未在本稿中重建')}
 else if(action==='go-pc'){goPC(el.dataset.section,el.dataset.editor)}
 else if(action==='back-side'){if(s.editor){popToast('请先保存或取消当前编辑');return;}s.view='side';render()}
 else if(action==='pc-section'){if(s.editor){popToast('请先保存或取消当前编辑');return;}s.section=el.dataset.section;s.diagnosticRan=false;render()}
 else if(action==='set-mode'){
   if(s.switchingTo)return;
   if(s.view==='side' && s.comparison==='after' && ['conflict','unknown'].includes(s.scene)){
     popToast('当前状态不可确认，请先查看网络诊断');return;
   }
   s.mode=el.dataset.value;
   if(s.comparison==='before' && s.scene==='normal')s.applied=false;
   render();popToast(s.view==='side'&&s.comparison==='after'&&isPending()?'已预选连接方式，原线路仍在运行；点击「应用更改」后生效':'已预选连接方式；未执行真实代理应用');
 }
 else if(action==='select-profile'){
   const target=el.dataset.value,proxy=s.profiles.find(p=>p.id===target);
   if(!proxy||s.switchingTo)return;
   // PC demonstration is deliberately untouched, as approved by the user.
   if(s.view==='pc'||s.comparison==='before'){
     s.selected=target;s.mode='profile';s.applied=false;s.scene='normal';render();popToast('已选择代理，未应用到真实浏览器');
   }else if(['conflict','unknown'].includes(s.scene)){
     popToast('当前代理控制状态不可确认，请先查看网络诊断');
   }else if(s.scene!=='normal'){
     s.selected=target;s.mode='profile';s.applied=false;render();popToast('已预选代理，连接异常未解除；请先排查');
   }else if(s.applied){
     if(s.activeMode==='profile'&&s.activeProfile===target){
       s.selected=target;s.mode='profile';render();popToast('当前已使用该代理（模拟），无需重复切换');
     }else{
       s.selected=target;s.mode='profile';s.switchingTo=target;
       const revision=++switchRevision;
       render();
       setTimeout(()=>{
         if(revision!==switchRevision||s.switchingTo!==target||s.scene!=='normal')return;
         s.activeMode='profile';s.activeProfile=target;s.applied=true;s.switchingTo=null;
         render();popToast('模拟切换完成：'+proxy.name+'（未操作真实浏览器）');
       },300);
     }
   }else{
     s.selected=target;s.mode='profile';render();popToast('已预选 '+proxy.name+'，点击「启用」后才会生效（模拟）');
   }
 }
 else if(action==='status-button'){
   if(s.switchingTo)return;
   if(s.scene==='empty')goPC('profiles','new-proxy');
   else if(s.scene==='normal'){
     if(s.comparison==='before') {s.applied=!s.applied;render();popToast('仅变更预览中的运行状态');}
     else if(s.applied && isPending()){
       if(s.mode==='profile'&&!s.selected){popToast('请先选择代理');return;}
       s.activeMode=s.mode;if(s.mode==='profile')s.activeProfile=s.selected;
       render();popToast('已应用预选线路（模拟），未操作真实浏览器');
     }else if(s.applied){s.applied=false;render();popToast('已暂停（仅模拟）；当前代理选择仍保留');}
     else if(s.mode==='profile'&&!s.selected){
       document.querySelector('[data-section="proxies"]')?.scrollIntoView({block:'nearest'});
       popToast('请先选择一个代理');
     }else{
       s.applied=true;s.activeMode=s.mode;if(s.mode==='profile')s.activeProfile=s.selected;
       render();popToast('已启用当前选择（仅模拟）；未操作真实浏览器');
     }
   }else if(s.scene==='conflict')goPC('diagnostic');
   else if(s.scene==='error')popToast('本预览不发起真实代理重试；请查看网络诊断');
   else goPC('diagnostic');
 }
 else if(action==='start-add'){goPC('profiles','new-proxy')}
 else if(action==='start-local'){s.subTab='local';goPC('subscriptions','new-local')}
 else if(action==='site-rule'){goPC('rules','new-rule')}
 else if(action==='refresh-site'){popToast('已刷新模拟网站信息：'+s.site)}
 else if(action==='scene-shortcut'){document.getElementById('scene').value=el.dataset.value;selectScene(el.dataset.value)}
 else if(action==='edit'){s.editor=el.dataset.editor;render();document.getElementById('editor')?.scrollIntoView({block:'nearest',behavior:'smooth'});document.getElementById('editor')?.querySelector('input')?.focus({preventScroll:true})}
 else if(action==='cancel-editor'){s.editor=null;render()}
 else if(action==='subtab'){s.subTab=el.dataset.value;s.editor=null;render()}
 else if(action==='run-diag'){s.diagnosticRan=true;s.diagCount++;render();popToast('模拟检测完成；未访问真实网络')}
 else if(action==='export'){const data=JSON.stringify({previewOnly:true,profiles:s.profiles,rules:s.rules,subscriptions:s.subs},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ai-proxy-preview-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);popToast('已导出本次演示数据')}
});
document.addEventListener('submit',event=>{if(event.target.id!=='editor-form')return;event.preventDefault();const form=event.target;const data=Object.fromEntries(new FormData(form));const editor=form.dataset.editor;
 if(editor==='new-proxy'){const name=String(data.name).trim(),host=String(data.host).trim(),port=Number(data.port);if(!name||!host||!Number.isInteger(port)||port<1||port>65535)return;const id='p'+Date.now();s.profiles.push({id,name,scheme:data.scheme,host:host+':'+port});s.selected=id;s.scene='normal';s.applied=false}
 else if(editor==='new-sub'){const name=String(data.name).trim(),url=String(data.url).trim();if(!name||!/^https?:\/\//.test(url))return;s.subs.push({id:'s'+Date.now(),name,url,enabled:true});s.subTab='sources'}
 else if(editor==='new-rule'){const domain=String(data.domain).trim();if(!domain)return;s.rules.push({id:'r'+Date.now(),domain,target:String(data.target),enabled:true})}
 else if(editor==='new-local'){const port=Number(data.port);if(!Number.isInteger(port)||port<1||port>65535)return;s.profiles.push({id:'p'+Date.now(),name:String(data.name).trim(),scheme:'SOCKS5',host:'127.0.0.1:'+port});s.scene='normal';s.applied=false}
 s.editor=null;render();popToast('已保存到本次预览内存；未修改真实配置');});
document.addEventListener('change',event=>{if(event.target.id==='scene')selectScene(event.target.value);if(event.target.dataset.action==='toggle-startup'){s.startup=event.target.checked;popToast('预览偏好已更新')}});
document.querySelectorAll('[data-ui]').forEach(el=>el.addEventListener('click',()=>{s.comparison=el.dataset.ui;render()}));
document.getElementById('reset').addEventListener('click',()=>{switchRevision++;s=initial();render();popToast('已恢复初始预览')});
render();
</script>
</body>
</html>
