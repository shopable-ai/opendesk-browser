<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AI Proxy 浏览器代理管理器：无需账号的交互原型，所有连接结果均为模拟。">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>AI Proxy · 浏览器扩展交互原型</title>
<style>
html,body{margin:0;padding:0}
#ai-proxy-app{color-scheme:light dark;--ap-bg:light-dark(#f3f5f8,#15191f);--ap-surface:light-dark(#ffffff,#20262f);--ap-soft:light-dark(#f7f8fb,#282f3a);--ap-ink:light-dark(#202736,#f0f2f8);--ap-muted:light-dark(#606a79,#aeb8c9);--ap-line:light-dark(#dce1e9,#424c5c);--ap-control-line:light-dark(#838fa2,#8493a8);--ap-accent:light-dark(#414fca,#b4bdff);--ap-accent-fill:light-dark(#edf0ff,#303958);--ap-on-accent:light-dark(#ffffff,#171f3b);--ap-good:light-dark(#196542,#92dbb5);--ap-good-bg:light-dark(#edf7f1,#1d3930);--ap-warn:light-dark(#855300,#ffd18d);--ap-warn-bg:light-dark(#fff5e3,#41321f);--ap-bad:light-dark(#ae303c,#ffb0b9);--ap-bad-bg:light-dark(#fff0f1,#432932);--ap-shadow:0 12px 40px light-dark(#26345212,#00000035);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;color:var(--ap-ink);background:var(--ap-bg);min-height:680px;isolation:isolate;text-align:left}
#ai-proxy-app[data-theme="light"]{color-scheme:light}
#ai-proxy-app[data-theme="dark"]{color-scheme:dark}
#ai-proxy-app *,#ai-proxy-app *::before,#ai-proxy-app *::after{box-sizing:border-box}
#ai-proxy-app [hidden]{display:none!important}
#ai-proxy-app button,#ai-proxy-app input,#ai-proxy-app select,#ai-proxy-app textarea{font:inherit;color:inherit}
#ai-proxy-app button,#ai-proxy-app select,#ai-proxy-app input[type=checkbox],#ai-proxy-app input[type=radio]{cursor:pointer}
#ai-proxy-app button{border:0;background:none}
#ai-proxy-app button:disabled{cursor:not-allowed;color:var(--ap-muted);opacity:.62}
#ai-proxy-app :focus-visible{outline:3px solid var(--ap-accent);outline-offset:3px}
#ai-proxy-app h1,#ai-proxy-app h2,#ai-proxy-app h3,#ai-proxy-app p{margin:0}
#ai-proxy-app h1{font-size:23px;line-height:1.35;font-weight:650;letter-spacing:-.5px}
#ai-proxy-app h2{font-size:18px;font-weight:650;line-height:1.4}
#ai-proxy-app h3{font-size:14px;font-weight:600}
#ai-proxy-app .ap-muted{color:var(--ap-muted)}
#ai-proxy-app .ap-small{font-size:12px;line-height:1.5}
#ai-proxy-app .ap-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
#ai-proxy-app .ap-row{display:flex;align-items:center;gap:10px;min-width:0}
#ai-proxy-app .ap-between{justify-content:space-between}
#ai-proxy-app .ap-wrap{flex-wrap:wrap}
#ai-proxy-app .ap-stack{display:grid;gap:14px}
#ai-proxy-app .ap-grow{flex:1;min-width:0}
#ai-proxy-app .ap-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 13px;border:1px solid var(--ap-line);border-radius:7px;background:var(--ap-surface);font-size:13px;font-weight:550;white-space:normal;line-height:1.4;text-decoration:none}
#ai-proxy-app .ap-button:hover:not(:disabled){background:var(--ap-soft);border-color:var(--ap-muted)}
#ai-proxy-app .ap-primary{color:var(--ap-on-accent);background:var(--ap-accent);border-color:var(--ap-accent)}
#ai-proxy-app .ap-primary:hover:not(:disabled){background:var(--ap-accent);filter:brightness(.95)}
#ai-proxy-app .ap-quiet{border-color:transparent;background:transparent;color:var(--ap-muted);padding:6px 9px}
#ai-proxy-app .ap-link{padding:3px 0;color:var(--ap-accent);font-size:12px;font-weight:550;text-decoration:none}
#ai-proxy-app .ap-link:hover{text-decoration:underline;text-underline-offset:3px}
#ai-proxy-app .ap-danger{color:var(--ap-bad)}
#ai-proxy-app .ap-tag{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;font-size:11px;line-height:1.65;border-radius:4px;background:var(--ap-soft);color:var(--ap-muted);white-space:nowrap}
#ai-proxy-app .ap-tag.accent{background:var(--ap-accent-fill);color:var(--ap-accent)}
#ai-proxy-app .ap-tag.good{background:var(--ap-good-bg);color:var(--ap-good)}
#ai-proxy-app .ap-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
#ai-proxy-app .ap-input,#ai-proxy-app .ap-select,#ai-proxy-app .ap-textarea{display:block;width:100%;min-width:0;border:1px solid var(--ap-control-line);border-radius:7px;background:var(--ap-surface);padding:8px 10px;min-height:38px;line-height:1.4}
#ai-proxy-app .ap-input::placeholder,#ai-proxy-app .ap-textarea::placeholder{color:var(--ap-muted);opacity:1}
#ai-proxy-app .ap-input:disabled{background:var(--ap-soft)}
#ai-proxy-app .ap-textarea{resize:vertical;min-height:205px;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;tab-size:2}
#ai-proxy-app .ap-field{display:grid;gap:6px;min-width:0}
#ai-proxy-app .ap-label{font-size:13px;font-weight:550}
#ai-proxy-app .ap-check{display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer}
#ai-proxy-app .ap-check input{accent-color:var(--ap-accent);margin:3px 0 0;flex:none}
#ai-proxy-app .ap-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
#ai-proxy-app .ap-notice{display:grid;gap:4px;padding:11px 13px;border-radius:7px;background:var(--ap-soft);font-size:12px;color:var(--ap-muted);overflow-wrap:anywhere}
#ai-proxy-app .ap-notice.warning{background:var(--ap-warn-bg);color:var(--ap-warn)}
#ai-proxy-app .ap-notice.error{background:var(--ap-bad-bg);color:var(--ap-bad)}
#ai-proxy-app .ap-notice.success{background:var(--ap-good-bg);color:var(--ap-good)}
#ai-proxy-app .ap-notice strong{font-size:13px;font-weight:600}
#ai-proxy-app .ap-rule{height:1px;background:var(--ap-line);margin:3px 0;border:0}
#ai-proxy-app .preview-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 24px;background:var(--ap-surface);border-bottom:1px solid var(--ap-line);flex-wrap:wrap}
#ai-proxy-app .preview-brand{font-size:13px;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
#ai-proxy-app .preview-brand span{font-weight:400;color:var(--ap-muted);font-size:12px}
#ai-proxy-app .scene-nav{display:flex;align-items:center;padding:3px;gap:3px;background:var(--ap-soft);border-radius:8px}
#ai-proxy-app .scene-nav :is(button,a[data-preview-link]){font-size:12px;padding:6px 13px;border-radius:5px;color:var(--ap-muted);min-height:31px}
#ai-proxy-app .scene-nav :is(button,a[data-preview-link])[aria-pressed=true]{color:var(--ap-ink);background:var(--ap-surface);box-shadow:0 1px 3px #00000010;font-weight:600}
#ai-proxy-app .preview-tools{display:flex;align-items:center;gap:6px}
#ai-proxy-app .preview-tools select{font-size:12px;border:0;background:var(--ap-surface);padding:6px 4px;max-width:85px}
#ai-proxy-app .preview-note{display:flex;justify-content:space-between;gap:10px;padding:10px 26px;color:var(--ap-muted);font-size:11px;flex-wrap:wrap}
#ai-proxy-app .preview-stage{padding:12px 24px 26px;max-width:1160px;margin:auto}
#ai-proxy-app .popup-stage{width:380px;max-width:100%;margin:0 auto}
#ai-proxy-app .preview-caption{font-size:11px;letter-spacing:.3px;color:var(--ap-muted);display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 9px}
#ai-proxy-app .extension-tab-preview{max-width:1040px;margin:0 auto 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px;border:1px solid var(--ap-line);border-radius:9px;background:var(--ap-surface);color:var(--ap-muted)}
#ai-proxy-app .extension-tab-preview .ap-tag{color:var(--ap-accent);background:var(--ap-accent-fill)}
#ai-proxy-app .extension-tab-preview code{font-size:11px;color:var(--ap-ink);overflow-wrap:anywhere}
#ai-proxy-app .extension-tab-preview .ap-link{margin-left:auto}

#ai-proxy-app .popup{width:380px;max-width:100%;max-height:600px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--ap-line);border-radius:11px;background:var(--ap-surface);box-shadow:var(--ap-shadow);font-size:13px;scrollbar-width:thin}
#ai-proxy-app .popup-head{padding:16px 17px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#ai-proxy-app .product-brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:650;letter-spacing:-.3px}
#ai-proxy-app .brand-mark{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:7px;background:var(--ap-ink);color:var(--ap-surface);font-size:11px;letter-spacing:-.7px;font-weight:700;line-height:1}
#ai-proxy-app .popup-section{padding:12px 17px;border-top:1px solid var(--ap-line)}
#ai-proxy-app .popup-mode{padding:0 17px 12px}
#ai-proxy-app .mode-label{display:flex;justify-content:space-between;gap:8px;color:var(--ap-muted);font-size:11px;margin-bottom:7px}
#ai-proxy-app .mode-group{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:3px;gap:2px;background:var(--ap-soft);border:0;margin:0;border-radius:7px}
#ai-proxy-app .mode-group label{position:relative;cursor:pointer;min-width:0}
#ai-proxy-app .mode-group input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
#ai-proxy-app .mode-group span{display:block;padding:7px 2px;text-align:center;font-size:12px;border-radius:5px;color:var(--ap-muted);white-space:nowrap;min-height:32px;pointer-events:none}
#ai-proxy-app .mode-group input:checked+span{background:var(--ap-accent);color:var(--ap-on-accent);font-weight:600}
#ai-proxy-app .mode-group input:focus-visible+span{outline:3px solid var(--ap-accent);outline-offset:2px}
#ai-proxy-app .popup-fixed{margin-top:9px;font-size:12px}
#ai-proxy-app .status-lines{display:grid;gap:7px;padding:10px 12px;background:var(--ap-soft);border-radius:7px}
#ai-proxy-app .status-line{display:flex;align-items:center;justify-content:space-between;gap:9px;min-height:20px;font-size:12px}
#ai-proxy-app .status-key{color:var(--ap-muted);white-space:nowrap}
#ai-proxy-app .status-value{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap;text-align:right;font-weight:500}
#ai-proxy-app .status-value.good{color:var(--ap-good)}
#ai-proxy-app .status-value.bad{color:var(--ap-bad)}
#ai-proxy-app .status-value.warning{color:var(--ap-warn)}
#ai-proxy-app .popup-status{padding:0 17px 12px}
#ai-proxy-app .site-domain{font-size:14px;font-weight:600;overflow-wrap:anywhere;margin-top:4px}
#ai-proxy-app .site-route{display:flex;align-items:center;gap:8px;margin-top:9px;min-width:0}
#ai-proxy-app .route-arrow{font-size:17px;color:var(--ap-accent)}
#ai-proxy-app .route-name{font-weight:650;font-size:15px;overflow-wrap:anywhere}
#ai-proxy-app .route-detail{color:var(--ap-muted);font-size:11px;margin:3px 0 11px;overflow-wrap:anywhere}
#ai-proxy-app .site-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ai-proxy-app .site-actions .ap-button{font-size:12px;min-height:33px;padding:6px 8px}
#ai-proxy-app .favorite-header{display:flex;align-items:center;justify-content:space-between;color:var(--ap-muted);font-size:11px;margin-bottom:5px}
#ai-proxy-app .favorite-list{display:grid;gap:1px}
#ai-proxy-app .favorite{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border-radius:6px;text-align:left;min-height:49px}
#ai-proxy-app .favorite:hover{background:var(--ap-soft)}
#ai-proxy-app .favorite[aria-pressed=true]{background:var(--ap-accent-fill)}
#ai-proxy-app .proxy-letter{display:flex;align-items:center;justify-content:center;border:1px solid var(--ap-line);border-radius:6px;width:29px;height:29px;flex:none;font-size:12px;color:var(--ap-muted);background:var(--ap-surface)}
#ai-proxy-app .favorite-name{font-weight:550;font-size:12px;overflow-wrap:anywhere}
#ai-proxy-app .favorite-endpoint{font-size:11px;color:var(--ap-muted);line-height:1.45;overflow-wrap:anywhere}
#ai-proxy-app .favorite-indicator{color:var(--ap-accent);font-size:11px;white-space:nowrap}
#ai-proxy-app .popup-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 17px;border-top:1px solid var(--ap-line);gap:10px;font-size:11px;color:var(--ap-muted)}
#ai-proxy-app .options-shell{background:var(--ap-surface);border:1px solid var(--ap-line);border-radius:10px;box-shadow:var(--ap-shadow);min-height:552px;overflow:hidden;max-width:1040px;margin:0 auto}
#ai-proxy-app .options-top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ap-line);padding:19px 22px}
#ai-proxy-app .options-layout{display:grid;grid-template-columns:172px minmax(0,1fr);min-height:478px}
#ai-proxy-app .options-nav{padding:17px 12px;border-right:1px solid var(--ap-line);display:flex;flex-direction:column;gap:4px;background:var(--ap-soft)}
#ai-proxy-app .options-nav :is(button,a[data-preview-link]){display:flex;align-items:center;gap:9px;text-align:left;font-size:13px;padding:9px 11px;min-height:38px;border-radius:6px;color:var(--ap-muted)}
#ai-proxy-app .options-nav :is(button,a[data-preview-link]):hover{background:var(--ap-surface)}
#ai-proxy-app .options-nav :is(button,a[data-preview-link])[aria-current=page]{color:var(--ap-accent);background:var(--ap-accent-fill);font-weight:600}
#ai-proxy-app .nav-glyph{width:16px;text-align:center;font-size:15px}
#ai-proxy-app .options-body{padding:24px 26px;min-width:0}
#ai-proxy-app .page-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
#ai-proxy-app .page-heading p{font-size:12px;color:var(--ap-muted);margin-top:5px}
#ai-proxy-app .profile-list{border-top:1px solid var(--ap-line)}
#ai-proxy-app .profile-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:13px;align-items:center;padding:17px 0;border-bottom:1px solid var(--ap-line)}
#ai-proxy-app .profile-row .proxy-letter{width:32px;height:34px}
#ai-proxy-app .profile-title{font-size:14px;font-weight:600;display:flex;gap:7px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
#ai-proxy-app .profile-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:5px;font-size:11px;color:var(--ap-muted)}
#ai-proxy-app .profile-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#ai-proxy-app .profile-actions .ap-button{min-height:30px;padding:5px 8px;font-size:12px}
#ai-proxy-app .star-button{font-size:19px;color:var(--ap-muted);padding:2px 4px;min-width:30px;min-height:30px}
#ai-proxy-app .star-button[aria-pressed=true]{color:var(--ap-accent)}
#ai-proxy-app .page-footer{margin-top:19px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ap-muted)}
#ai-proxy-app .empty-state{padding:32px 18px;background:var(--ap-soft);border-radius:8px;display:grid;justify-items:start;gap:10px}
#ai-proxy-app .empty-state p{font-size:12px;color:var(--ap-muted)}
#ai-proxy-app .rules-list{display:grid;gap:0;border-top:1px solid var(--ap-line)}
#ai-proxy-app .rule-row{display:grid;grid-template-columns:22px minmax(0,1.45fr) minmax(90px,1fr) 53px auto;gap:9px;align-items:center;padding:13px 0;border-bottom:1px solid var(--ap-line);font-size:12px}
#ai-proxy-app .rule-row input[type=checkbox]{accent-color:var(--ap-accent);width:15px;height:15px;margin:0}
#ai-proxy-app .rule-domain{font-weight:550;overflow-wrap:anywhere}
#ai-proxy-app .rule-row .ap-button{font-size:11px;padding:4px 6px;min-height:29px}
#ai-proxy-app .rule-row .ap-select{font-size:12px;padding:5px 7px;min-height:30px}
#ai-proxy-app .rule-head{font-size:11px;color:var(--ap-muted);padding:8px 0}
#ai-proxy-app .rule-route{overflow-wrap:anywhere}
#ai-proxy-app .rule-priority{width:53px;padding:5px 6px;min-height:31px;font-size:12px}
#ai-proxy-app .temporary-list{display:grid;gap:7px;margin-bottom:14px}
#ai-proxy-app .route-tester{border:1px solid var(--ap-line);padding:14px;border-radius:8px;margin:19px 0}
#ai-proxy-app .route-tester .ap-row{align-items:flex-end}
#ai-proxy-app .import-preview{margin-top:16px;display:grid;gap:11px}
#ai-proxy-app .issue-list{margin:0;padding-left:19px;display:grid;gap:5px;color:var(--ap-muted);font-size:12px;max-height:200px;overflow:auto;overflow-wrap:anywhere}
#ai-proxy-app .import-files{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#ai-proxy-app .file-label{cursor:pointer;position:relative}
#ai-proxy-app .file-label input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
#ai-proxy-app .import-summary{display:flex;gap:15px;flex-wrap:wrap;font-size:13px}
#ai-proxy-app .diagnostic-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--ap-line);border-radius:8px;overflow:hidden;margin-bottom:18px}
#ai-proxy-app .diagnostic-cell{padding:15px;border-bottom:1px solid var(--ap-line);min-width:0}
#ai-proxy-app .diagnostic-cell:nth-child(odd){border-right:1px solid var(--ap-line)}
#ai-proxy-app .diagnostic-cell:nth-last-child(-n+2){border-bottom:0}
#ai-proxy-app .diagnostic-cell strong{display:block;margin-top:5px;font-size:14px;font-weight:550;overflow-wrap:anywhere}
#ai-proxy-app .diagnostic-result{min-height:105px;background:var(--ap-soft);border-radius:8px;padding:17px;display:grid;gap:6px;align-content:start}
#ai-proxy-app .diagnostic-result.success{color:var(--ap-good);background:var(--ap-good-bg)}
#ai-proxy-app .diagnostic-result.error{color:var(--ap-bad);background:var(--ap-bad-bg)}
#ai-proxy-app .diagnostic-result strong{font-size:15px}
#ai-proxy-app .scenario-box{margin-top:18px;border-top:1px solid var(--ap-line);padding-top:15px;display:grid;gap:12px}
#ai-proxy-app .settings-row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:17px 0;border-bottom:1px solid var(--ap-line)}
#ai-proxy-app .settings-row p{margin-top:4px;font-size:12px;color:var(--ap-muted);max-width:430px}
#ai-proxy-app .settings-row .ap-select{max-width:125px}
#ai-proxy-app .welcome{max-width:630px;margin:13px auto 0;padding:32px 35px;background:var(--ap-surface);border:1px solid var(--ap-line);border-radius:11px;box-shadow:var(--ap-shadow)}
#ai-proxy-app .welcome-intro{margin:26px 0 22px}
#ai-proxy-app .welcome-intro h1{font-size:27px}
#ai-proxy-app .welcome-intro p{color:var(--ap-muted);font-size:13px;margin-top:10px;max-width:480px}
#ai-proxy-app .welcome-action{width:100%;text-align:left;display:flex;align-items:center;gap:15px;border:1px solid var(--ap-line);border-radius:8px;padding:17px;margin-top:11px;background:var(--ap-surface)}
#ai-proxy-app .welcome-action:hover{border-color:var(--ap-accent);background:var(--ap-soft)}
#ai-proxy-app .welcome-action strong{display:block;font-size:15px;font-weight:550}
#ai-proxy-app .welcome-action small{display:block;color:var(--ap-muted);font-size:12px;margin-top:3px}
#ai-proxy-app .welcome-action .action-number{color:var(--ap-accent);font-size:18px;font-weight:500}
#ai-proxy-app .welcome-optional{padding:17px 0;margin:10px 0;border-bottom:1px solid var(--ap-line);display:flex;align-items:center;justify-content:space-between;gap:10px}
#ai-proxy-app .welcome-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px;color:var(--ap-muted);margin-top:20px}
#ai-proxy-app dialog{border:1px solid var(--ap-line);border-radius:12px;padding:0;background:var(--ap-surface);color:var(--ap-ink);box-shadow:0 24px 75px #00000040;width:470px;max-width:calc(100% - 32px);max-height:calc(100% - 40px);overflow:auto;font:inherit}
#ai-proxy-app dialog::backdrop{background:#111b2e66}
#ai-proxy-app[data-scene=popup] dialog{width:348px}
#ai-proxy-app .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:19px 21px 0}

<body>
<div id="ai-proxy-app" data-theme="auto" data-scene="popup" data-width="desktop">
  <header class="preview-top">
    <div class="preview-brand">AI Proxy <span>交互原型</span></div>
    <nav class="scene-nav" aria-label="预览场景">
      <button type="button" data-action="scene" data-scene="sidepanel" aria-pressed="false">Side Panel</button>
      <button type="button" data-action="scene" data-scene="popup" aria-pressed="true">Popup · 历史</button>
      <button type="button" data-action="scene" data-scene="options" aria-pressed="false">完整设置</button>
      <button type="button" data-action="scene" data-scene="welcome" aria-pressed="false">首次打开</button>
    </nav>
    <div class="preview-tools">
      <select id="preview-theme" aria-label="外观主题"><option value="auto">自动主题</option><option value="light">浅色</option><option value="dark">深色</option></select>
      <button type="button" class="ap-button ap-quiet preview-copy" data-action="copy-preview-link" title="复制当前页面链接" aria-label="复制当前页面链接"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 .1l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7-.1l-3 3a5 5 0 0 0 7 7l2-2"/></svg></button>
      <button type="button" class="ap-button ap-quiet" data-action="reset">重置演示</button>
    </div>
  </header>
  <div class="preview-note"><span>离线原型 · 不修改浏览器代理或访问网络</span><span>所有连接与检测结果均为模拟</span></div>
  <nav class="r11ScenarioBar" aria-label="R11 四个真实原型场景"><span>R11 · 模拟预览</span><a href="#options/subscriptions?demo=active">双来源订阅</a><a href="#options/official?demo=active">有效官方套餐</a><a href="#sidepanel?demo=guest">未登录侧边栏</a><a href="#sidepanel?demo=selected">已选官方线路</a></nav>
  <main id="preview-stage" class="preview-stage" aria-label="浏览器扩展原型"></main>
  <div id="prototype-toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="prototype-modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
</div>
<script>
/*
 * AI Proxy UI R1 — offline prototype helpers.
 * Embed before the UI script: const state = ProxyCore.seed();
 * Every function is synchronous and returns new values without changing input.
 * No DOM, network, extension API, persistence, or real connectivity is used here.
 * validateProxy may return a password for the UI's separate in-memory credential
 * map. Import, merge and export never transfer password or other secret fields.
 */
const ProxyCore = (() => {
  'use strict';

  const PROTOCOLS = ['http', 'https', 'socks4', 'socks5'];
  const MODES = ['system', 'direct', 'fixed', 'rules'];
  const SOURCES = ['manual', 'demo', 'import'];
  const ID = /^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/;
  const own = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
  const record = obj => obj !== null && typeof obj === 'object' && !Array.isArray(obj);
  const fail = error => ({ ok: false, value: null, error });
  const pass = value => ({ ok: true, value, error: '' });
  const list = value => Array.isArray(value) ? value : [];
  const cleanId = value => typeof value === 'string' && ID.test(value);
  const isIp = host => host.startsWith('[') || /^\d+\.\d+\.\d+\.\d+$/.test(host);
  const nextId = (prefix, items) => {
    const occupied = new Set(list(items).map(item => item.id));
    let index = 1;
    while (occupied.has(`${prefix}-${index}`)) index += 1;
    return `${prefix}-${index}`;
  };

  function seed() {
    return {
      proxies: [
        { id: 'local', name: '本地代理', protocol: 'http', host: '127.0.0.1', port: 7890, username: '', password: '', favorite: true, source: 'demo' },
        { id: 'work', name: '工作代理', protocol: 'https', host: 'proxy.example.com', port: 443, username: '', password: '', favorite: true, source: 'demo' },
        { id: 'socks', name: '备用 SOCKS', protocol: 'socks5', host: '127.0.0.1', port: 1080, username: '', password: '', favorite: true, source: 'demo' }
      ],
      pacProfiles:[{id:'pac-example',name:'PAC 示例',pacText:"function FindProxyForURL(url, host) { return 'PROXY 127.0.0.1:7890'; }"}],
      rules: [
        { id: 'rule-docs', host: 'docs.example.com', includeSubdomains: false, action: 'proxy', proxyId: 'work', priority: 10, enabled: true },
        { id: 'rule-example', host: 'example.org', includeSubdomains: true, action: 'proxy', proxyId: 'local', priority: 20, enabled: true },
        { id: 'rule-intranet', host: 'intranet.example.com', includeSubdomains: false, action: 'direct', proxyId: null, priority: 30, enabled: true }
      ],
      temporary: [],
      settings: { mode: 'rules', selectedProxyId: 'work', selectedKind:'proxy', selectedPacId:null, defaultAction: 'direct', defaultProxyId: null },
      host: 'docs.example.com'
    };
  }

  function normalizeHost(input) {
    if (typeof input !== 'string') return fail('请输入域名或完整 HTTP/HTTPS 网址。');
    const text = input.trim();
    if (!text) return fail('域名不能为空。');
    if (text.length > 4096) return fail('输入过长，请只填写域名或网址。');
    if (/[\s\u0000-\u001f\u007f\\]/u.test(text)) return fail('域名或网址不能包含空格、控制字符或反斜线。');

    let parsed;
    const fullUrl = /^[A-Za-z][A-Za-z\d+.-]*:\/\//.test(text);
    try {
      if (fullUrl) {
        parsed = new URL(text);
        if (!['http:', 'https:'].includes(parsed.protocol)) return fail('仅支持 HTTP/HTTPS 网站，不能使用浏览器内部页或其他协议。');
        if (parsed.username || parsed.password) return fail('网址不能包含用户名或密码。');
      } else {
        if (/[/?#@%]/.test(text)) return fail('请输入纯域名，或带 http://、https:// 的完整网址；不要包含凭证。');
        let candidate = text;
        if (text.includes(':') && !text.startsWith('[')) {
          if ((text.match(/:/g) || []).length < 2) return fail('域名中不要填写端口；IPv6 地址可以使用方括号。');
          candidate = `[${text}]`;
        }
        if (candidate.startsWith('[') && (!candidate.endsWith(']') || candidate.indexOf(']') !== candidate.length - 1)) return fail('IPv6 主机中不要附带端口；请将端口填写在独立字段。');
        parsed = new URL(`https://${candidate}`);
        if (parsed.username || parsed.password || parsed.port || parsed.pathname !== '/' || parsed.search || parsed.hash) return fail('请输入域名或 IP 地址，不要附带端口、路径或凭证。');
      }
    } catch (_) {
      return fail('域名或 IP 地址格式不正确。');
    }

    let host = parsed.hostname.toLowerCase();
    if (!host.startsWith('[')) host = host.replace(/\.$/, '');
    if (!host || host.length > 253) return fail('域名无效或长度超过 253 个字符。');
    if (host.startsWith('[')) return pass(host);
    const labels = host.split('.');
    if (labels.some(label => !/^[a-z\d](?:[a-z\d-]{0,61}[a-z\d])?$/i.test(label))) return fail('域名标签仅能包含字母、数字与中间的连字符；不支持通配符或空标签。');
    return pass(host);
  }

  function validateProxy(data, existing = [], id) {
    if (!record(data)) return fail('代理配置必须是一个对象。');
    if (own(data, 'favorite') && typeof data.favorite !== 'boolean') return fail('favorite 收藏字段必须是布尔值 true 或 false。');
    const proxies = list(existing);
    const name = typeof data.name === 'string' ? data.name.trim() : '';
    if (!name || [...name].length > 48) return fail('代理名称需要 1–48 个字符。');
    if (/[\u0000-\u001f\u007f]/.test(name)) return fail('代理名称不能包含控制字符。');
    const proxyId = id || data.id || nextId('proxy', proxies);
    if (!cleanId(proxyId)) return fail('代理标识只能使用 1–64 位字母、数字、短横线与下划线。');
    if (proxies.some(proxy => proxy.id !== id && proxy.id === proxyId)) return fail('代理标识已存在，请使用新的标识。');
    if (proxies.some(proxy => proxy.id !== id && String(proxy.name).toLocaleLowerCase() === name.toLocaleLowerCase())) return fail('已存在同名代理，请使用不同名称。');
    const protocol = typeof data.protocol === 'string' ? data.protocol.toLowerCase() : '';
    if (!PROTOCOLS.includes(protocol)) return fail('仅支持 HTTP、HTTPS、SOCKS4 和 SOCKS5 代理。');
    if (typeof data.host !== 'string' || /[:][/][/]|[/?#@\\]/.test(data.host)) return fail('代理主机只填写域名或 IP，协议、端口与凭证请分别填写。');
    const host = normalizeHost(data.host);
    if (!host.ok) return host;
    const port = typeof data.port === 'number' ? data.port : typeof data.port === 'string' && /^\d+$/.test(data.port.trim()) ? Number(data.port.trim()) : NaN;
    if (!Number.isInteger(port) || port < 1 || port > 65535) return fail('端口必须是 1–65535 之间的整数。');
    const username = data.username == null ? '' : typeof data.username === 'string' ? data.username.trim() : null;
    const password = data.password == null ? '' : typeof data.password === 'string' ? data.password : null;
    if (username === null || password === null) return fail('用户名与密码必须是文本。');
    if (/[\u0000-\u001f\u007f]/.test(username)) return fail('用户名不能包含控制字符。');
    if (protocol.startsWith('socks') && (username || password)) return fail('Chrome 不支持 SOCKS 用户名密码认证；请清空凭证，或改用支持认证的 HTTP/HTTPS 代理。');
    return pass({ id: proxyId, name, protocol, host: host.value, port, username, password, favorite: data.favorite !== false, source: SOURCES.includes(data.source) ? data.source : 'manual' });
  }


  function validatePac(data,existing=[],id){
    if(!record(data))return fail('PAC 配置无效。');
    const name=typeof data.name==='string'?data.name.trim():'',pacText=typeof data.pacText==='string'?data.pacText.trim():'';
    const pacId=id||data.id||nextId('pac',existing);
    if(!name||name.length>48||/[\u0000-\u001f\u007f]/.test(name))return fail('PAC 名称必须为 1–48 字符。');
    if(!cleanId(pacId)||list(existing).some(x=>x.id!==id&&(x.id===pacId||x.name.toLowerCase()===name.toLowerCase())))return fail('PAC 名称或标识重复。');
    if(!pacText||utf8Length(pacText)>32768)return fail('PAC 文本不能为空或超过 32KiB。');
    if(!/\bfunction\s+FindProxyForURL\s*\(\s*url\s*,\s*host\s*\)/.test(pacText)||!/\breturn\b/.test(pacText))return fail('未发现标准 FindProxyForURL(url, host) 和 return；这不是语法或安全验证。');
    return pass({id:pacId,name,pacText});
  }
  function validateRule(data, state, id) {
    if (!record(data)) return fail('网站规则必须是一个对象。');
    if (own(data, 'includeSubdomains') && typeof data.includeSubdomains !== 'boolean') return fail('includeSubdomains 子域范围必须是布尔值 true 或 false。');
    if (own(data, 'enabled') && typeof data.enabled !== 'boolean') return fail('enabled 启用字段必须是布尔值 true 或 false。');
    const rules = list(state && state.rules);
    const ruleId = id || data.id || nextId('rule', rules);
    if (!cleanId(ruleId)) return fail('规则标识只能使用 1–64 位字母、数字、短横线与下划线。');
    if (rules.some(rule => rule.id !== id && rule.id === ruleId)) return fail('规则标识已存在，请使用新的标识。');
    if (typeof data.host !== 'string' || /[:][/][/]|[/?#@\\]/.test(data.host)) return fail('网站规则只填写域名或 IP，不支持协议、路径、查询串或凭证。');
    const normalized = normalizeHost(data.host);
    if (!normalized.ok) return normalized;
    const host = normalized.value;
    const includeSubdomains = data.includeSubdomains === true;
    if (isIp(host) && includeSubdomains) return fail('IP 地址没有子域名，请使用“仅此域名”范围。');
    if (rules.some(rule => rule.id !== id && rule.host === host && rule.includeSubdomains === includeSubdomains)) return fail('已存在相同域名和范围的规则，请编辑原规则或使用不同范围。');
    const priority = typeof data.priority === 'number' ? data.priority : typeof data.priority === 'string' && /^\d+$/.test(data.priority.trim()) ? Number(data.priority.trim()) : NaN;
    if (!Number.isInteger(priority) || priority < 1 || priority > 9999) return fail('规则优先级必须是 1–9999 之间的整数；数字越小越优先。');
    if (!['direct', 'proxy'].includes(data.action)) return fail('规则动作仅支持直连或使用指定代理。');
    const proxyId = data.action === 'proxy' ? data.proxyId : null;
    if (data.action === 'proxy' && !list(state && state.proxies).some(proxy => proxy.id === proxyId)) return fail('规则引用的代理不存在，请先添加或选择有效代理。');
    return pass({ id: ruleId, host, includeSubdomains, action: data.action, proxyId, priority, enabled: data.enabled !== false });
  }

  function route(state, now = Date.now()) {
    const settings = state && state.settings || {};
    const answer = (action, proxyId, source, detail, ruleId = null, temporaryId = null) => {
      const proxy = list(state && state.proxies).find(item => item.id === proxyId);
      if (action === 'proxy' && !proxy) return { action: 'unavailable', proxyId, name: '代理配置不可用', source, detail: '引用的代理不存在；请修正规则或选择，不会自动改为直连。', ruleId, temporaryId };
      return { action, proxyId: action === 'proxy' ? proxyId : null, name: action === 'proxy' ? proxy.name : action === 'system' ? '由系统决定' : action === 'unavailable' ? '无法计算路由' : action === 'pac' ? '由 PAC 决定' : '直连', source, detail, ruleId, temporaryId };
    };
    if (settings.mode === 'system') return answer('system', null, '系统设置', '跟随操作系统代理设置；本原型不知道系统实际出口。');
    if (settings.mode === 'direct') return answer('direct', null, '手动模式', '在浏览器代理层直连；不代表绕过系统 VPN。');
    if(settings.mode==='fixed'&&settings.selectedKind==='pac'){
      const p=list(state.pacProfiles).find(x=>x.id===settings.selectedPacId);
      return p?{...answer('pac',null,'PAC 配置',p.name+' · 脚本未执行，实际出口未知，可能 DIRECT。'),pacId:p.id}:answer('unavailable',null,'PAC 配置缺失','不会自动直连。');
    }
    if (settings.mode === 'fixed') return answer('proxy', settings.selectedProxyId, '指定配置', '固定代理模式不使用网站规则。');
    if (settings.mode !== 'rules') return answer('unavailable', null, '模式无效', '请选择有效的代理模式。');
    const hostResult = normalizeHost(state.host);
    if (!hostResult.ok) return answer('unavailable', null, '网站无效', hostResult.error);
    const host = hostResult.value;
    const temporary = list(state.temporary).filter(item => item.host === host && Number.isFinite(item.expiresAt) && item.expiresAt > now).slice(-1)[0];
    if (temporary) return answer(temporary.action, temporary.proxyId, '临时覆盖', `仅 ${host}，同域所有标签页；到期后恢复永久规则。`, null, temporary.id);
    const rules = list(state.rules).map((rule, index) => ({ rule, index })).filter(({ rule }) => rule.enabled !== false).sort((a, b) => a.rule.priority - b.rule.priority || a.index - b.index);
    for (const { rule } of rules) {
      const match = host === rule.host || rule.includeSubdomains && host.endsWith(`.${rule.host}`);
      if (match) return answer(rule.action, rule.proxyId, '网站规则', `${rule.host} · ${rule.includeSubdomains ? '域名及子域' : '精确域名'} · 优先级 ${rule.priority}`, rule.id);
    }
    return answer(settings.defaultAction === 'proxy' ? 'proxy' : 'direct', settings.defaultProxyId, '默认动作', '没有命中网站规则；这不是代理失败后的回退。');
  }

  function references(state, id) {
    const found = [];
    const settings = state.settings || {};
    if (settings.mode === 'fixed' && (!settings.selectedKind || settings.selectedKind === 'proxy') && settings.selectedProxyId === id) found.push('当前指定代理模式');
    if (settings.defaultAction === 'proxy' && settings.defaultProxyId === id) found.push('网站规则的默认代理');
    for (const rule of list(state.rules)) if (rule.action === 'proxy' && rule.proxyId === id) found.push(`网站规则：${rule.host}${rule.enabled === false ? '（已停用）' : ''}`);
    const now = Date.now();
    for (const temporary of list(state.temporary)) if (temporary.action === 'proxy' && temporary.proxyId === id && temporary.expiresAt > now) found.push(`临时覆盖：${temporary.host}`);
    return found;
  }

  function proxyData(proxy, includeSource = true) {
    const result = { id: proxy.id, name: proxy.name, protocol: proxy.protocol, host: proxy.host, port: proxy.port, username: typeof proxy.username === 'string' ? proxy.username : '', favorite: proxy.favorite !== false };
    if (includeSource) result.source = SOURCES.includes(proxy.source) ? proxy.source : 'manual';
    return result;
  }

  function ruleData(rule) {
    return { id: rule.id, host: rule.host, includeSubdomains: rule.includeSubdomains === true, action: rule.action, proxyId: rule.action === 'proxy' ? rule.proxyId : null, priority: rule.priority, enabled: rule.enabled !== false };
  }

  function settingsData(settings) {
    return { mode: settings.mode, selectedProxyId: settings.selectedProxyId || null, defaultAction: settings.defaultAction === 'proxy' ? 'proxy' : 'direct', defaultProxyId: settings.defaultAction === 'proxy' ? settings.defaultProxyId || null : null };
  }

  function exportConfig(state) {
    return { schemaVersion: 1, proxies: list(state.proxies).map(proxy => proxyData(proxy)), rules: list(state.rules).map(ruleData), settings: settingsData(state.settings || {}) };
  }

  function utf8Length(text) {
    let bytes = 0;
    for (const character of text) {
      const point = character.codePointAt(0);
      bytes += point <= 0x7f ? 1 : point <= 0x7ff ? 2 : point <= 0xffff ? 3 : 4;
    }
    return bytes;
  }

  function analyzeImport(text, state) {
    const report = { ok: false, error: '', proxies: [], rules: [], settings: null, issues: [], summary: { addedProxies: 0, addedRules: 0, skippedProxies: 0, skippedRules: 0, issueCount: 0, settingsIgnored: false } };
    const stop = error => { report.error = error; return report; };
    if (typeof text !== 'string' || !text.trim()) return stop('请先粘贴或选择 AI Proxy v1 JSON 配置。');
    if (utf8Length(text) > 256 * 1024) return stop('配置超过 256 KiB，请拆分为较小文件。');
    let input;
    try { input = JSON.parse(text); } catch (_) { return stop('JSON 格式错误，请检查括号、逗号与引号。'); }
    if (!record(input) || input.schemaVersion !== 1) return stop('本原型只支持 schemaVersion 为数字 1 的 AI Proxy JSON；其他产品备份需要独立转换器。');
    if (own(input, 'proxies') && !Array.isArray(input.proxies)) return stop('proxies 必须是数组。');
    if (own(input, 'rules') && !Array.isArray(input.rules)) return stop('rules 必须是数组。');
    const proxyRows = list(input.proxies);
    const ruleRows = list(input.rules);
    if (proxyRows.length > 200 || ruleRows.length > 1000) return stop('单次最多导入 200 个代理及 1000 条网站规则。');
    const issue = (path, reason) => report.issues.push({ path, reason });
    const ignoredReason = key => /password|token|credential|secret|authorization/i.test(key) ? '敏感字段不会导入或回显，请在代理编辑表单中重新填写凭证。' : /pac|subscription|script|url/i.test(key) ? '本轮不支持此字段；不会下载、执行 PAC 或远程订阅。' : '本轮不支持此字段，已忽略。';
    const unknown = (obj, known, path) => {
      for (const key of Object.keys(obj)) if (!known.includes(key)) issue(`${path}${key}`, ignoredReason(key));
    };
    unknown(input, ['schemaVersion', 'proxies', 'rules', 'settings'], '');
    const existingProxies = list(state && state.proxies);
    const existingRules = list(state && state.rules);
    const rejectedIds = new Set();
    const seenIds = new Set();
    const endpoint = proxy => `${proxy.protocol}://${proxy.host}:${proxy.port}\n${proxy.username || ''}`;
    const safeDuplicateIds = new Set();

    proxyRows.forEach((row, index) => {
      const path = `proxies[${index}]`;
      const skip = reason => {
        report.summary.skippedProxies += 1;
        issue(path, reason);

      };

      unknown(row, ['id', 'name', 'protocol', 'host', 'port', 'username', 'favorite', 'source'], `${path}.`);

        host: row.host,

      }
      const validated = validateProxy(clean, existingProxies.concat(report.proxies));
      if (!validated.ok) { skip(validated.error); return; }

      report.proxies.push(proxyData({ ...validated.value, source: 'import' }));
      safeDuplicateIds.add(normalized.id);
      if (!row.id) issue(`${path}.id`, '未提供标识，已为此次新增项生成可见的唯一标识。');
    });

    const available = existingProxies.concat(report.proxies);
    const seenRuleIds = new Set();
    ruleRows.forEach((row, index) => {
      const path = `rules[${index}]`;
      const skip = reason => { report.summary.skippedRules += 1; issue(path, reason); };
      if (!record(row)) { skip('规则项必须是对象，已跳过。'); return; }
      unknown(row, ['id', 'host', 'includeSubdomains', 'action', 'proxyId', 'priority', 'enabled'], `${path}.`);

      if (row.id && seenRuleIds.has(row.id)) { skip('文件中出现重复规则标识，已跳过重复项。'); return; }
      if (row.id) seenRuleIds.add(row.id);
      if (row.action === 'proxy' && rejectedIds.has(row.proxyId)) { skip('规则依赖未导入的冲突或无效代理，已跳过。'); return; }
      const clean = { id: row.id || nextId('import-rule', existingRules.concat(report.rules)), host: row.host, includeSubdomains: own(row, 'includeSubdomains') ? row.includeSubdomains : false, action: row.action, proxyId: row.proxyId, priority: row.priority, enabled: own(row, 'enabled') ? row.enabled : true };

      if (!row.id) issue(`${path}.id`, '未提供标识，已为此次新增项生成可见的唯一标识。');
    });

    if (own(input, 'settings')) {
      report.summary.settingsIgnored = true;
      issue('settings', '运行设置仅识别供预览；导入不会改变当前模式、选中代理或默认动作。');
      if (!record(input.settings)) issue('settings', '运行设置必须是对象，已忽略。');
      else {
        unknown(input.settings, ['mode', 'selectedProxyId', 'defaultAction', 'defaultProxyId'], 'settings.');
        const settings = settingsData(input.settings);
        const selectionOk = settings.selectedProxyId === null || available.some(proxy => proxy.id === settings.selectedProxyId) && !rejectedIds.has(settings.selectedProxyId);
        const defaultOk = input.settings.defaultAction === 'direct' || input.settings.defaultAction === 'proxy' && available.some(proxy => proxy.id === settings.defaultProxyId) && !rejectedIds.has(settings.defaultProxyId);
        if (!MODES.includes(settings.mode)) issue('settings.mode', '未知运行模式，设置已忽略。');
        else if (!selectionOk || settings.mode === 'fixed' && !settings.selectedProxyId) issue('settings.selectedProxyId', '设置引用的代理不存在或未被导入，设置已忽略。');
        else if (!defaultOk) issue('settings.defaultProxyId', '默认动作或代理引用无效，设置已忽略。');
        else report.settings = settings;
      }
    }
    report.ok = true;
    report.summary.addedProxies = report.proxies.length;
    report.summary.addedRules = report.rules.length;
    report.summary.issueCount = report.issues.length;
    return report;
  }

  function mergeImport(state, report) {
    // Whitelist every copied field. Secrets remain in the UI's separate Map.
    const result = {
      proxies: list(state.proxies).map(proxy => proxyData(proxy)),
      pacProfiles:list(state.pacProfiles).map(p=>({id:p.id,name:p.name,pacText:p.pacText})),
      rules: list(state.rules).map(ruleData),
      temporary: list(state.temporary).map(item => ({ id: item.id, host: item.host, action: item.action, proxyId: item.action === 'proxy' ? item.proxyId : null, expiresAt: item.expiresAt })),
      settings:{...settingsData(state.settings||{}),selectedKind:state.settings?.selectedKind||'proxy',selectedPacId:state.settings?.selectedPacId||null},
      host: state.host
    };
    if (!report || !report.ok) return result;
    // Revalidate a report against current state in case the preview became old.
    const rechecked = analyzeImport(JSON.stringify({ schemaVersion: 1, proxies: list(report.proxies).map(proxy => proxyData(proxy)), rules: list(report.rules).map(ruleData) }), result);
    if (!rechecked.ok) return result;
    result.proxies.push(...rechecked.proxies.map(proxy => proxyData({ ...proxy, source: 'import' })));
    result.rules.push(...rechecked.rules.map(ruleData));
    return result;
  }

  return { seed, normalizeHost, validateProxy, validatePac, validateRule, route, references, analyzeImport, mergeImport, exportConfig };
})();

  function validateHost(value){
    if(typeof value!=="string"||!value.trim()||value.length>2048||/[\\\s\u0000-\u001f]/.test(value))return null;
    let url;try{url=new URL(/^https:\/\//i.test(value) ? value : "https://"+value);}catch(_){return null;}
    if(url.protocol!=="https:"||url.username||url.password||url.port)return null;
    const host=url.hostname.toLowerCase().replace(/\.$/,"");
    if(!host.includes(".")||host.length>253||host.endsWith(".local")||host.includes("localhost")||!host.split(".").every(x=>/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(x)))return null;
    // Never probe IP literals from this preview; the real adapter still needs DNS rebinding guards.
    if(/^\d{1,3}(?:\.\d{1,3}){3}$/.test(host))return null;
    return host;
  }

  function review(form){

    const test=validateUrl(raw||previous||'');
    if(!test.ok){showError(test.error);return;}
    if([...secretUrls.entries()].some(([key,u])=>key!==id&&u===test.url)){showError('此订阅地址已存在。');return;}
    if(current&&isSelected()&&selectedProvider()?.id===id&&raw&&test.url!==previous){showError('此来源正在使用，请先切换其他配置再更换订阅链接。');return;}

    const serial = ++probeSerial;

on class="ap-button" type="submit" value="save">仅保存</button>'}<button class="ap-button ap-primary" type="submit" value="${editing ? 'save' : 'use'}">${editing ? '保存修改' : '保存并选择'}</button></div></form>`,{type:'proxy',id:editing?.id});

    else if(action==='confirm-delete-pac'){state.pacProfiles=state.pacProfiles.filter(p=>p.id!==id);closeModal();invalidate(false);notify('PAC 已删除。');}
    else if(action==='pac-example'){$('#pac-text').value=ProxyCore.seed().pacProfiles[0].pacText;notify('已填入示例，尚未执行。');}
    else if (scene==='sidepanel'&&!modal.open&&(action==='add-proxy'||action==='tp-local')) R83.beginAdd(action==='tp-local'?'local':'server');
    else if (action === 'add-proxy' || action === 'edit-proxy') { if (scene === 'popup') openPage('proxies'); openProxyEditor(id); }
    else if (action === 'welcome-add') { openPage('proxies'); openProxyEditor(); }
    else if (action === 'favorite') { const proxy = state.proxies.find(item=>item.id === id); if (proxy) { proxy.favorite = !proxy.favorite; render(); notify(proxy.favorite ? '已收藏到常用代理。' : '已取消收藏。'); } }
    else if (action === 'delete-proxy') openDeleteProxy(id);
    else if (action === 'confirm-delete-proxy') {
      if (ProxyCore.references(state,id).length) { closeModal(); openDeleteProxy(id); return; }
      state.proxies = state.proxies.filter(proxy=>proxy.id !== id); credentials.delete(id);
      if (state.settings.selectedProxyId === id) state.settings.selectedProxyId = state.proxies[0]?.id || null;
      closeModal(); invalidate(false); notify('代理已删除；没有更改网站规则的路由。');
    }
    else if (action === 'manage-references') { closeModal(); openPage('rules'); }
    else if (action === 'add-rule') openRuleEditor();
    else if (action === 'edit-rule') openRuleEditor(id);
    else if (action === 'quick-rule') openRuleEditor(undefined,true);
    else if (action === 'prioritize-rule') { modalContext.moveFirst = true; $('#rule-priority').value = '1'; $('#rule-form').elements.enabled.checked = true; updateRulePreview(); }
    else if (action === 'clear-site-override') { const checked = candidateRule($('#rule-form')); modalContext.removeTemporaryHost = modalContext.quick ? state.host : checked.ok ? checked.value.host : null; updateRulePreview(); }
    else if (action === 'delete-rule') {
      const rule = state.rules.find(item=>item.id === id);
      if (!rule) return;
      showModal('删除网站规则？',`<div class="modal-body"><p>${escape(rule.host)}</p><p class="ap-small ap-muted">删除后将重新匹配后续规则或默认动作。</p><div class="modal-actions"><button class="ap-button" data-action="close-modal" autofocus>取消</button><button class="ap-button ap-danger" data-action="confirm-delete-rule" data-id="${escape(id)}">删除规则</button></div></div>`);
    }
    else if (action === 'confirm-delete-rule') { state.rules = state.rules.filter(rule=>rule.id !== id); closeModal(); invalidate(false); notify('网站规则已删除；更改待应用，保留已启用配置。'); }
    else if (action === 'use-rules') setMode('rules');
    else if (action === 'temporary') openTemporary();
    else if (action === 'remove-temporary') { state.temporary = state.temporary.filter(item=>item.id !== id); invalidate(false); notify('临时覆盖已撤销；更改待应用，保留已启用配置。'); }
    else if (action === 'change-site') openSiteEditor();
    else if (action === 'probe') startProbe();
    else if (action === 'reapply') invalidate(true);
    else if (action === 'restore-control') { control = 'owned'; applicationScenario = 'success'; invalidate(true); }
    else if (action === 'load-example') { importReadSerial += 1; importText = JSON.stringify(exampleImport,null,2); importReport = null; render(); notify('已填入示例；点击解析预览查看支持项与跳过字段。'); }
    else if (action === 'parse-import') { importText = $('#import-text').value; importReport = ProxyCore.analyzeImport(importText,state); render(); notify(importReport.ok ? '解析完成，请查看预览后确认。' : importReport.error); }
    else if (action === 'cancel-import') { importReport = null; render(); notify('已取消预览，当前配置保持不变。'); }
    else if (action === 'confirm-import') {
      const checked = ProxyCore.analyzeImport(importText,state);
      if (!checked.ok) { importReport = checked; render(); return; }
      const before = state.proxies.length+state.rules.length;
      state = ProxyCore.mergeImport(state,checked);
      const count = state.proxies.length+state.rules.length-before;
      importReport = null; importText = ''; importReadSerial += 1;
      invalidate(false); notify(`已导入 ${count} 个支持项；当前模式与默认动作保持不变，密码未导入。`);
    }
    else if (action === 'export') exportBackup();
    else if (action === 'service') openService();
    else if (R83.act(button)) {}
    else if (R6.act(button)) {}
    else if (R5.act(button)) {}
    else if (ThirdParty.act(button)) {}
    else if (R3.act(button)) {}
    else if (action === 'reset') openReset();
    else if (action === 'confirm-reset') reset();
    else if (action === 'close-modal') closeModal();
  });
  root.addEventListener('change',event => {
    const element = event.target;
    if (R83.changed(element) || ThirdParty.changed(element) || R3.changed(element)) return;
    if (modalContext?.type === 'rule' && element.closest('#rule-form')) { if (element.id === 'rule-priority') modalContext.moveFirst = false; updateRulePreview(); }
    if (element.name === 'proxy-mode') setMode(element.value);
    else if (element.id === 'popup-proxy' || element.id === 'r6-config-select') selectConfig(element.value);
    else if (element.id === 'preview-theme' || element.id === 'settings-theme') { theme = element.value; render(); }
    else if (element.id === 'preview-width') { width = element.value; render(); }
    else if (element.id === 'proxy-protocol') updateProtocolForm(true);
    else if (element.id === 'probe-scenario') { probeScenario = element.value; notify('已设置下一次探测情景。点击开始检测后生效。'); }
    else if (element.id === 'control-scenario') { control = ['other','policy'].includes(element.value) ? element.value : 'owned'; applicationScenario = element.value === 'failed' ? 'failed' : 'success'; invalidate(false); }
    else if (element.dataset.ruleEnabled) { const rule = state.rules.find(item=>item.id === element.dataset.ruleEnabled); if (rule) { rule.enabled = element.checked; invalidate(false); } }
    else if (element.dataset.priority) {
      const rule = state.rules.find(item=>item.id === element.dataset.priority);
      if (!rule) return;
      const result = ProxyCore.validateRule({...rule,priority:element.value},state,rule.id);
      if (!result.ok) { element.value = rule.priority; notify(result.error); return; }
      rule.priority = result.value.priority; invalidate(false);
    }
    else if (element.id === 'default-route') { state.settings.defaultAction = element.value === 'direct' ? 'direct' : 'proxy'; state.settings.defaultProxyId = element.value === 'direct' ? null : element.value; invalidate(false); }
    else if (element.id === 'import-file') {
      const readSerial = ++importReadSerial;
      const file = element.files[0];
      if (!file) return;
      if (file.size > 256*1024) { notify('文件超过 256 KiB，未读取。请拆分文件。'); element.value = ''; return; }
      const reader = new FileReader();
      reader.onload = () => { if (readSerial !== importReadSerial) return; importText = String(reader.result); importReport = null; if (scene === 'options' && optionsPage === 'import') render(); notify('文件已读取，尚未导入。请先解析预览。'); };
      reader.onerror = () => { if (readSerial === importReadSerial) notify('文件读取失败，请重新选择。'); };
      reader.readAsText(file);
    }
  });
  root.addEventListener('input',event => {
    if (R83.input(event.target)) return;
    if (event.target.id === 'import-text') { importReadSerial += 1; importText = event.target.value; importReport = null; const preview = $('#import-preview'); if (preview) preview.innerHTML = ''; }
    else if (modalContext?.type === 'rule' && event.target.closest('#rule-form')) { if (event.target.id === 'rule-priority') modalContext.moveFirst = false; updateRulePreview(); }
  });
  root.addEventListener('paste',event=>R83.pasted(event));
  root.addEventListener('toggle',event=>R83.toggled(event.target),true);
  root.addEventListener('keydown',event=>R83.keydown(event));
  root.addEventListener('submit',event => {
    event.preventDefault();
    const form = event.target;
    if (R83.submitted(form,event.submitter)) return;
    if (form.id === 'proxy-form') submitProxy(form,event.submitter?.value || 'save');
    else if(form.id==='pac-form')submitPac(form);
    else if (form.id === 'rule-form') submitRule(form);
    else if (form.id === 'temporary-form') submitTemporary(form);
    else if (form.id === 'host-form') submitHost(form,true);
    else if (form.id === 'site-form') submitHost(form,false);
    else if (ThirdParty.submitted(form)) {}
    else if (R3.submitted(form)) {}
  });
  modal.addEventListener('cancel',event=>{ event.preventDefault(); closeModal(); });
  setInterval(() => {
    const now = Date.now();
    if (state.temporary.some(item=>item.expiresAt <= now)) {
      state.temporary = state.temporary.filter(item=>item.expiresAt > now);
      invalidate(false); notify('临时覆盖已到期；更改待应用，旧探测已清除。');
    }
    root.querySelectorAll('[data-expiry]').forEach(element=>{ element.textContent = `剩余 ${Math.max(1,Math.ceil((Number(element.dataset.expiry)-now)/60000))} 分钟`; });
  },1000);
  PreviewLinks.mount();
  // Historical Popup fixture only; Side Panel and Options deep links do not auto-apply.
  if(scene==='popup')applyConfiguration();
})();

</script>
</body>
</html>
