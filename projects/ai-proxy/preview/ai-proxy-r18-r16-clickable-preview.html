<script>
(()=>{'use strict';
const shapes={arrow:'<path d="m14 6-6 6 6 6M8 12h13"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="m10 2 4 0 .6 2.3 2 1 2.3-.9 2 3.2-1.5 1.9v2.6l1.5 1.9-2 3.2-2.3-.9-2 1L14 21h-4l-.6-2.3-2-1-2.3.9-2-3.2L4.6 13.5v-3l-1.5-1.9 2-3.2 2.3.9 2-1z"/>',plus:'<path d="M12 5v14M5 12h14"/>',server:'<rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01"/>',route:'<path d="M6 4h7a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h9"/><circle cx="6" cy="4" r="2"/><circle cx="18" cy="20" r="2"/>',network:'<rect x="2" y="3" width="20" height="13" rx="2"/><path d="M8 21h8m-4-5v5"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',check:'<path d="m4 12 5 5L20 6"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M5 9a7 7 0 0 1 13-2l2 2M19 15a7 7 0 0 1-13 2l-2-2"/>',shield:'<path d="m12 2 8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/>',folder:'<path d="M3 6h6l2 2h10v11H3z"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>',edit:'<path d="m4 20 4.5-1 11-11-3.5-3.5-11 11L4 20zM14 6l3.5 3.5"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/>',star:'<path d="m12 2 3 6 6.5 1-4.7 4.6 1.1 6.7-5.9-3.1-6 3.1 1.2-6.7L2.5 9 9 8z"/>',alert:'<path d="M12 3 2 21h20zM12 9v5m0 3h.01"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ico=(name,size=18)=>`<span class="icon" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]||shapes.info}</svg></span>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fresh=()=>({view:'side',compare:'after',scene:'normal',hostTab:'扩展',section:'proxies',mode:'profile',selected:'p1',applied:true,activeMode:'profile',activeProfile:'p1',switching:null,profiles:[{id:'p1',name:'香港节点 · 主用',scheme:'SOCKS5',host:'proxy.example.com',port:7890,favorite:true},{id:'p2',name:'美国节点 · 备用',scheme:'SOCKS5',host:'us.example.net',port:1080,favorite:true},{id:'p3',name:'本地 Clash',scheme:'HTTP',host:'127.0.0.1',port:7890,favorite:false}],rules:[{id:'r1',domain:'example.com',target:'p1',includeSubdomains:true,priority:10,enabled:true}],subs:[{id:'s1',name:'我的订阅',url:'https://example.com/my-subscription',enabled:true}],site:'example.com',subtab:'sources',language:'zh-CN',startup:false,theme:'light',diagRan:false,diagScenario:'success',diagnosticCount:0,previewImport:'',notice:'',dirty:false});
let s=fresh(), modalAction=null,toastTimer=null,switchSerial=0,diagSerial=0,nextId=4,sidePos=0;
const app=document.getElementById('app'); const modeNames={profile:'使用代理',rules:'按规则',direct:'直接连接',system:'跟随系统'};const modeIcon={profile:'server',rules:'route',direct:'network',system:'gear'};
const profile=id=>s.profiles.find(p=>p.id===id);const pname=id=>profile(id)?.name||'未选择代理';const planned=()=>s.mode==='profile'?pname(s.selected):modeNames[s.mode];const live=()=>s.activeMode==='profile'?pname(s.activeProfile):modeNames[s.activeMode];const pending=()=>s.applied&&(s.mode!==s.activeMode||(s.mode==='profile'&&s.selected!==s.activeProfile));const endpoint=p=>`${p.scheme} · ${p.host}:${p.port}`;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2800)}
const btn=(name,action,cl='btn',attrs='')=>`<button class="${cl}" type="button" data-action="${action}" ${attrs}>${name}</button>`;
function status(){ if(s.scene==='empty')return {label:'尚未配置',desc:'添加代理或订阅来源后开始使用',tone:'warn',button:'添加代理'};if(s.scene==='error')return {label:'连接异常',desc:'代理不可用，请检查连接设置',tone:'red',button:'重试'};if(s.scene==='conflict')return {label:'无法接管',desc:'浏览器代理正在由其他扩展管理',tone:'red',button:'查看原因'};if(s.scene==='unknown')return {label:'状态尚未确认',desc:'结果未知，需要核查当前状态',tone:'warn',button:'刷新状态'};if(s.switching)return {label:'正在切换',desc:'正在切换至 '+pname(s.switching)+'（离线模拟）',tone:'warn',button:'切换中…'};if(s.applied)return {label:'正在运行',desc:'当前线路：'+live(),tone:'green',button:pending()?'应用更改':'暂停'};return {label:'已暂停',desc:'已选：'+planned()+' · 尚未启用',tone:'warn',button:s.mode==='profile'&&!s.selected?'选择代理':'启用'} }
function renderSide(){const st=status();const list=s.scene==='empty'?[]:s.profiles;return `<div class="side-layout"><div class="side-shell"><div class="frame-note"><strong>侧边栏 · ${s.compare==='before'?'优化前':'优化后'}</strong><span>400 px · 可交互模拟</span></div><div class="side-frame"><nav class="host-tabs" aria-label="OpenDesk 工作台">${['我的','扩展','工作流','开发','云控'].map(n=>`<button type="button" data-action="host-tab" data-id="${n}" class="${n===s.hostTab?'active':''}">${n}</button>`).join('')}</nav><div class="host-head">${btn(ico('arrow'),'back-host','icon-btn','aria-label="返回扩展列表"')}<span class="name">AI Proxy</span><span class="ai">AI</span>${btn(ico('gear'),'open-pc','icon-btn','data-id="proxies" aria-label="管理设置" title="管理设置"')}</div>${s.hostTab!=='扩展'?`<div style="padding:40px 20px;text-align:center"><h3>${esc(s.hostTab)}</h3><p class="muted">非 AI Proxy 工作台内容未在预览中重建</p><div class="below">${btn('返回扩展','back-host')}</div></div>`:`<div class="side-scroll" id="sideScroll"><section class="side-section"><div class="section-head"><strong>连接方式</strong><span class="section-actions">${btn(ico('plus'),'add-proxy','icon-btn','aria-label="添加代理"')}${btn(ico('gear'),'open-pc','icon-btn','data-id="proxies" aria-label="管理设置"')}</span></div><div class="mode-grid">${Object.entries(modeNames).map(([key,label])=>`<button class="mode ${s.mode===key?'active':''}" type="button" data-action="mode" data-id="${key}" ${s.switching?'disabled':''}>${ico(modeIcon[key])}<span>${label}</span></button>`).join('')}</div></section><section class="side-section"><div class="status-card"><div class="status-copy"><div class="status-top"><span class="dot ${st.tone}"></span>${esc(st.label)}</div><span class="status-desc">${esc(st.desc)}</span></div>${btn(st.button,'status','btn primary',s.switching?'disabled':'')}</div>${s.scene==='normal'&&pending()?`<p class="status-help pending">仍在使用：${esc(live())}；待应用：${esc(planned())}</p>`:''}${s.scene==='normal'&&!s.applied?'<p class="status-help">已预选线路，点击「启用」后才生效。</p>':''}${['error','conflict','unknown'].includes(s.scene)?`<div class="alert-inline">${ico('alert')}<span class="text">${s.scene==='conflict'?'发现代理控制冲突':'请查看连接诊断'}</span>${btn('网络诊断 ↗','open-pc','btn sm','data-id="diagnostics"')}</div>`:''}</section><section class="side-section"><div class="section-head"><strong>${list.length?'我的代理':'订阅与本地客户端'}${list.length?`<span class="count">${list.length}</span>`:''}</strong>${list.length?btn(ico('server'),'open-pc','icon-btn','data-id="proxies" aria-label="管理全部" title="管理全部"'):''}</div>${list.length?`<div class="proxy-list">${list.slice(0,4).map(p=>{const chosen=s.selected===p.id&&s.mode==='profile',actual=s.applied&&s.activeMode==='profile'&&s.activeProfile===p.id&&!s.switching,label=s.switching===p.id?'切换中…':actual?'使用中':chosen?'待启用':s.applied?'切换':'选择';return `<button class="proxy-choice ${chosen?'chosen':''}" type="button" data-action="pick" data-id="${esc(p.id)}" ${['conflict','unknown'].includes(s.scene)||s.switching?'disabled':''}><span class="letter">${p.scheme.startsWith('SOCKS')?'S':'H'}</span><span class="summary"><strong>${esc(p.name)}</strong><small>${esc(endpoint(p))}</small></span><span class="action ${actual?'current':''}">${actual?ico('check',12):''}${label}</span></button>`}).join('')}</div>${btn(ico('plus',15)+' 添加代理','add-proxy','add-wide')}`:`<p class="muted" style="font-size:11px">尚无代理配置，可以先添加：</p><div class="empty-actions"><button type="button" data-action="add-sub">${ico('link')}<strong>导入订阅</strong><small>通过订阅链接添加</small></button><button type="button" data-action="add-local">${ico('network')}<strong>本地客户端</strong><small>Clash / sing-box</small></button></div>`}</section><section class="side-section"><div class="section-head"><strong>当前网站</strong>${btn(ico('route'),'open-pc','icon-btn','data-id="rules" aria-label="管理网站规则"')}</div><div class="site-domain">${ico('globe',16)} ${esc(s.site)}</div><div class="site-meta">当前页面 · 仅显示示例域名</div><dl class="site-details"><dt>浏览器设置</dt><dd>${esc(s.applied?modeNames[s.activeMode]:'跟随系统')}</dd><dt>预期线路</dt><dd>${esc(planned())}</dd></dl><p class="status-help">切换规则或代理后，可能需要明确应用才会生效。</p><div class="site-actions">${btn(ico('plus',14)+' 为此网站添加规则','site-rule')}${btn(ico('refresh',14)+' 刷新网站','refresh-site')}</div></section><details class="disclosure"><summary>高级代理功能</summary><div style="margin-top:7px">轮换计划、PAC 和更多配置保留在 PC 管理中。${btn('管理高级选项 ↗','open-pc','btn ghost sm','data-id="proxies"')}</div></details><p class="legal">只管理浏览器代理设置，不会改变设备的全局代理。</p></div>${s.compare==='before'?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px;border-top:1px solid var(--line)">${btn('订阅来源 ↗','open-pc','btn sm','data-id="thirdparty"')}${btn('网络诊断 ↗','open-pc','btn sm','data-id="diagnostics"')}</div>`:''}</div></div>`}<aside class="review"><div class="review-card"><div class="review-head"><span class="review-num">${s.compare==='after'?'新':'旧'}</span><h3>${s.compare==='after'?'R18 · 侧栏高频操作':'R18 · 旧版对照'}</h3></div>${(s.compare==='after'?[['移除底部常驻双按钮','订阅和诊断都归入 PC 管理。'],['代理选择与应用分离','运行中点其他代理，可模拟切换；暂停时只预选。'],['设置页完整复用 R16','点击齿轮体验七个管理栏目。']]:[['底部占位过大','订阅与诊断常驻，挤占主界面。'],['操作状态不够明显','选择代理和启用代理的语义容易混淆。'],['管理入口分散','低频操作散落在侧边栏。']]).map(([a,b])=>`<div class="review-item">${ico(s.compare==='after'?'check':'alert',18)}<div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}<div class="review-summary">本文件为离线、可点击的便携演示。切换线路、管理配置、探测和导入导出都不接管实际浏览器网络。</div><div class="review-hint"><strong>建议体验：</strong> 点击侧栏右上方齿轮进入 PC 设置；在代理配置管理页面尝试“添加代理 / 编辑 / 删除”，再返回侧栏查看结果。</div></div></aside></div>`}
const navs=[['proxies','代理配置','server'],['rules','网站规则','route'],['thirdparty','订阅管理','link'],['import','导入备份','folder'],['diagnostics','网络诊断','network'],['general','通用设置','gear'],['official','官方网络','globe']];
function heading(title,desc,action=''){return `<div class="page-heading"><div><p class="eyebrow">设置</p><h2>${title}</h2><p>${desc}</p></div>${action}</div>`}
function pcModes(){return `<div class="panel"><div class="panel-head"><div><h3>代理模式</h3><p>选择连接方式不会自动改变浏览器代理，需明确应用。</p></div><span class="tag blue">模拟配置</span></div><div class="pc-mode-grid">${Object.entries(modeNames).map(([id,title])=>`<button class="pc-mode ${s.mode===id?'active':''}" data-action="mode" data-id="${id}" type="button">${ico(modeIcon[id],17)}${title}</button>`).join('')}</div><div class="apply-row"><div class="muted" style="font-size:11.5px">${s.applied?'当前已应用：'+esc(live())+'。':'尚未启用浏览器代理。'}${pending()?' 已选择：'+esc(planned())+'（待应用）':''}</div><div class="actions">${btn(s.applied?'暂停':'启用','status','btn sm')}${btn('应用配置','apply','btn primary sm',!pending()?'disabled':'')}</div></div></div>`}
function pcProxies(){return `${heading('代理与配置','自己的代理，随时添加和切换。',btn(ico('plus',15)+' 添加代理','add-proxy','btn primary'))}${pcModes()}<div class="panel"><div class="panel-head"><div><h3>代理服务器 <span class="tag">${s.profiles.length} 项</span></h3><p>这里集中管理代理；侧栏只负责高频切换。</p></div>${btn('导入订阅 ↗','open-pc','btn ghost sm','data-id="thirdparty"')}</div><div class="proxy-table">${s.profiles.map(p=>`<div class="table-row"><span class="letter">${p.scheme.startsWith('SOCKS')?'S':'H'}</span><div class="table-main"><div class="name">${esc(p.name)}${p.id===s.selected&&s.mode==='profile'?'<span class="tag blue">已选择</span>':''}<span class="tag">示例</span></div><p class="mono">${esc(endpoint(p))} · 无认证 · 手动添加</p></div><div class="table-actions">${btn(p.favorite?'★':'☆','favorite','btn sm','data-id="'+esc(p.id)+'" aria-label="收藏"')}${btn('选择配置','pick-pc','btn sm','data-id="'+esc(p.id)+'"')}${btn('编辑','edit-proxy','btn sm','data-id="'+esc(p.id)+'"')}${btn('删除','delete-proxy','btn sm danger','data-id="'+esc(p.id)+'"')}</div></div>`).join('')}</div>${s.profiles.length?'':'<div class="empty-state"><strong>还没有代理配置</strong><span>点击添加代理开始使用</span></div>'}<p class="pc-section-help">SOCKS 在 Chrome 中不支持用户名密码认证；模拟数据仅保存在当前页面。</p></div><div class="panel soft"><div class="panel-head"><div><h3>PAC 配置</h3><p>高级能力与网站规则独立。本预览不执行任何 PAC 脚本。</p></div>${btn('＋ 新建 PAC','pac-info','btn sm')}</div><div class="notice">PAC 可能返回 DIRECT；任何执行、下载及真实网络操作均不属于本次 UI 预览。</div></div>`}
function pcRules(){return `${heading('网站规则','从上到下匹配，优先级数字越小越高。',btn(ico('plus',15)+' 添加规则','add-rule','btn primary'))}<div class="panel"><div class="panel-head"><div><h3>网站分流</h3><p>可启用、编辑和删除规则；修改后需要应用配置才生效。</p></div></div><div class="rule-table"><div class="table-row heading"><span>启用</span><span>域名与范围</span><span>使用线路</span><span>优先级</span><span>操作</span></div>${s.rules.map(r=>`<div class="table-row"><input type="checkbox" data-change="rule-enabled" data-id="${esc(r.id)}" ${r.enabled?'checked':''} aria-label="启用规则 ${esc(r.domain)}"><div class="table-main"><strong>${esc(r.domain)}</strong><p>${r.includeSubdomains?'域名及子域名':'仅此域名'}</p></div><span class="route">${r.target==='direct'?'直连':esc(pname(r.target))}</span><input class="priority" type="number" min="1" max="9999" data-change="rule-priority" data-id="${esc(r.id)}" value="${r.priority}" aria-label="优先级"><span class="table-actions">${btn('编辑','edit-rule','btn sm','data-id="'+esc(r.id)+'"')}${btn('删除','delete-rule','btn sm danger','data-id="'+esc(r.id)+'"')}</span></div>`).join('')}</div>${s.rules.length?'':'<div class="empty-state">还没有网站规则</div>'}</div><div class="panel soft"><div class="panel-head"><div><h3>测试网站规则</h3><p>仅模拟计算，不会修改网站或发出网络请求。</p></div></div><div class="fields"><label class="field"><span>网站地址</span><input id="ruleTestDomain" value="${esc(s.site)}" placeholder="example.com"></label><div style="align-self:end">${btn('计算','test-rule')}</div></div><div id="ruleResult" class="notice below">输入网址并点击计算，查看预期匹配线路。</div></div>`}
function pcSubscriptions(){return `${heading('订阅管理','管理订阅来源和本地代理入口。',btn(ico('plus',15)+' 导入订阅','add-sub','btn primary'))}<div class="subtabs"><button data-action="subtab" data-id="sources" class="${s.subtab==='sources'?'active':''}" type="button">订阅来源</button><button data-action="subtab" data-id="local" class="${s.subtab==='local'?'active':''}" type="button">本地客户端</button></div>${s.subtab==='sources'?`<div class="panel"><div class="panel-head"><div><h3>已保存的订阅</h3><p>本页演示只保存订阅地址，不发起请求，也不解析真实节点。</p></div><span class="tag">${s.subs.length} 条</span></div><div class="proxy-table">${s.subs.map(x=>`<div class="table-row">${ico('link')}<div class="table-main"><div class="name">${esc(x.name)} <span class="tag">未同步</span></div><p>${esc(new URL(x.url).hostname)}</p></div><div class="table-actions">${btn('查看','view-sub','btn sm','data-id="'+esc(x.id)+'"')}${btn('移除','delete-sub','btn sm danger','data-id="'+esc(x.id)+'"')}</div></div>`).join('')}</div>${s.subs.length?'':'<div class="empty-state">暂无订阅来源</div>'}</div>`:`<div class="panel"><div class="panel-head"><div><h3>本地代理客户端</h3><p>Clash / sing-box 等应用的 HTTP 或 SOCKS5 本地端口。</p></div>${btn('添加客户端','add-local','btn sm')}</div><div class="notice">本地客户端须自行运行。本原型不会启动 Clash、sing-box，也不验证本地端口。</div><div class="below">${s.profiles.filter(p=>p.host==='127.0.0.1').map(p=>`<div class="settings-row"><span class="description"><strong>${esc(p.name)}</strong><p>${esc(endpoint(p))}</p></span><span class="tag">未验证</span></div>`).join('')}</div></div>`}<div class="panel soft"><div class="panel-head"><div><h3>接入说明</h3><p>订阅导入与实际网络连通是不同步骤。</p></div></div><div class="notice">正式扩展的联网获取、协议兼容和启用授权依赖真实实现；本页均不执行。</div></div>`}
function pcBackup(){return `${heading('导入备份','导出与导入分开处理；先预览数据，再由用户确认。')}<div class="fields"><div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>导入备份</h3><p>仅解析 AI Proxy 示例 JSON，最大 256 KiB。</p></div></div><label class="field"><span>配置内容</span><textarea id="importText" placeholder='粘贴包含 proxies / rules 的 JSON'>${esc(s.previewImport)}</textarea></label><div class="below">${btn('填入示例','import-example','btn sm')} ${btn('解析预览','import-check','btn primary sm')}</div><div id="importResult" class="below"></div></div><div class="panel" style="margin-top:0"><div class="panel-head"><div><h3>导出备份</h3><p>导出代理和规则的演示配置，不包含凭据。</p></div></div>${btn(ico('download',15)+' 导出无密码 JSON','export','btn')}<p class="pc-section-help">PAC 文本和任何账号密码不会写入备份。</p><div class="line"></div><h3>兼容范围</h3><p class="muted below" style="font-size:12px">本便携预览使用简化 schema，不声称与正式业务导入器逐字段一致。</p></div></div>`}
function pcDiagnostics(){return `${heading('连接诊断','分开检查选择、应用和线路状态。所有结果均为模拟。')}<div class="stats"><div class="stat"><small>用户选择</small><strong style="font-size:12px">${esc(planned())}</strong></div><div class="stat"><small>配置应用</small><strong>${s.applied?'已应用':'未应用'}</strong></div><div class="stat"><small>代理控制权</small><strong>${s.scene==='conflict'?'存在冲突':'未实际检测'}</strong></div><div class="stat"><small>探测结果</small><strong>${s.diagRan?(s.diagScenario==='success'?'模拟通过':s.diagScenario==='auth'?'认证错误':'模拟失败'):'尚未检测'}</strong></div></div><div class="notice warn">离线预览：不会访问网络、检测真实代理、读取浏览器系统权限或更改实际出口。</div><div class="panel"><div class="panel-head"><div><h3>检测线路</h3><p>只有用户主动点击后才生成一次模拟结果。</p></div></div><div class="fields"><label class="field"><span>下一次探测结果</span><select id="diagScenario"><option value="success" ${s.diagScenario==='success'?'selected':''}>成功 · 126 ms（模拟）</option><option value="failure" ${s.diagScenario==='failure'?'selected':''}>失败 · 连接超时</option><option value="auth" ${s.diagScenario==='auth'?'selected':''}>认证错误 · HTTP 407</option></select></label><label class="field"><span>控制情景</span><select id="diagScene"><option value="normal" ${s.scene==='normal'?'selected':''}>可管理</option><option value="error" ${s.scene==='error'?'selected':''}>线路异常</option><option value="conflict" ${s.scene==='conflict'?'selected':''}>其他扩展管理</option><option value="unknown" ${s.scene==='unknown'?'selected':''}>状态未知</option></select></label></div><div class="below">${btn('开始检测','probe','btn primary')} ${btn('重新应用配置','apply','btn')}</div><div class="below notice">${s.diagRan?`第 ${s.diagnosticCount} 次检测：${s.diagScenario==='success'?'模拟线路正常（126 ms）':s.diagScenario==='auth'?'模拟 HTTP 407 认证错误':'模拟网络超时'}。`: '尚未检测。点击“开始检测”查看模拟结果。'}</div></div>`}
function pcGeneral(){return `${heading('通用设置','管理界面行为和基础使用偏好。')}<div class="panel"><div class="panel-head"><div><h3>基础偏好</h3><p>仅在本次预览内存中生效。</p></div></div><div class="settings-row">${ico('globe',20)}<div class="description"><strong>界面语言</strong><p>切换语言暂为演示，实际文字仍使用简体中文</p></div><select id="language" class="select"><option value="zh-CN" ${s.language==='zh-CN'?'selected':''}>简体中文</option><option value="zh-TW" ${s.language==='zh-TW'?'selected':''}>繁體中文</option><option value="en" ${s.language==='en'?'selected':''}>English</option></select></div><div class="settings-row">${ico('refresh',20)}<div class="description"><strong>打开扩展时显示状态</strong><p>保留运行摘要的显示偏好</p></div><input type="checkbox" id="startup" class="switch" ${s.startup?'checked':''}></div><div class="settings-row">${ico('shield',20)}<div class="description"><strong>隐私与安全</strong><p>不在网页中直接暴露代理凭据</p></div><span class="tag green">已保持</span></div><div class="settings-row">${ico('gear',20)}<div class="description"><strong>外观</strong><p>统一使用当前 PC 管理的浅色配色</p></div><span class="tag">浅色</span></div></div>`}
function pcOfficial(){return `${heading('官方网络','了解可选的官方服务，不影响免费代理管理。')}<div class="panel"><div class="panel-head"><div><h3>官方网络服务</h3><p>这是独立的扩展管理栏目，不混入日常代理快速操作。</p></div><span class="tag">可选服务</span></div><div class="notice">此交互预览不连接真实账号、查询套餐、创建订单或进行支付。任何展示都不代表已开通权益。</div><div class="stats"><div class="stat"><small>账号状态</small><strong>未验证</strong></div><div class="stat"><small>订阅状态</small><strong>未验证</strong></div><div class="stat"><small>可用线路</small><strong>—</strong></div><div class="stat"><small>连接权限</small><strong>未授予</strong></div></div>${btn('了解账号接入说明','official-info','btn')}</div>`}
const pageContent={proxies:pcProxies,rules:pcRules,thirdparty:pcSubscriptions,import:pcBackup,diagnostics:pcDiagnostics,general:pcGeneral,official:pcOfficial};
function renderPc(){const name=navs.find(x=>x[0]===s.section)?.[1]||'代理配置';return `<div class="pc-stage"><div class="pc-preview-head"><strong>PC 设置 · R16 完整管理工作台</strong><span>七个栏目 · 离线可交互</span></div><div class="pc-frame"><div class="pc-top"><span class="pc-icon">AI</span><div><div class="pc-title">AI Proxy</div><div class="pc-subtitle">设置 · 浏览器代理管理</div></div><div class="spacer"></div><span class="tag green">免费 · 无需账号</span>${btn(ico('arrow',15)+' 返回侧边栏','back-side','btn sm','aria-label="返回侧边栏"')}</div><div class="connection-bar"><div class="connection-facts"><span><span class="dot ${s.applied?'green':'warn'}"></span> 配置应用：<strong>${s.applied?'已应用':'尚未应用'} · 模拟</strong></span><span class="separator"></span><span>当前选择：<strong>${esc(planned())}</strong></span></div>${btn('查看连接状态 ↗','open-pc','btn ghost sm','data-id="diagnostics"')}</div><div class="pc-layout"><nav class="pc-nav" aria-label="PC 设置导航"><div class="pc-nav-title">管理中心</div>${navs.map(([key,label,icon])=>`<button type="button" data-action="open-pc" data-id="${key}" class="${key===s.section?'active':''}" ${key===s.section?'aria-current="page"':''}>${ico(icon)} ${label}</button>`).join('')}</nav><div class="pc-content" id="pcContent">${pageContent[s.section]()}</div></div></div><div class="footer-note">本页为交互示意，不访问外部网络、不执行 PAC、不更改真实浏览器代理。正式代码以仓库 R18 / R16 HTML 为准。</div></div>`}
function syncToolbar(){document.querySelectorAll('[data-compare]').forEach(x=>x.classList.toggle('active',x.dataset.compare===s.compare));document.getElementById('scene').value=s.scene;document.getElementById('compare').hidden=s.view==='pc';document.getElementById('scene').hidden=s.view==='pc'}
function render(){const side=document.getElementById('sideScroll');if(side)sidePos=side.scrollTop;app.innerHTML=s.view==='side'?renderSide():renderPc();if(s.view==='side'){const el=document.getElementById('sideScroll');if(el)el.scrollTop=sidePos}syncToolbar();document.title=`AI Proxy · ${s.view==='side'?'R18 侧栏':'R16 PC 设置'} · 交互预览`}
function openPc(id='proxies'){s.view='pc';s.section=navs.some(n=>n[0]===id)?id:'proxies';render()}
function openModal(title,body,action){modalAction=action;document.getElementById('modal').innerHTML=`<div class="modal-head"><h2 id="modalTitle">${esc(title)}</h2>${btn(ico('close'),'close-modal','icon-btn','aria-label="关闭"')}</div>${body}`;document.getElementById('modalShade').hidden=false;document.getElementById('modal').querySelector('input,select,button')?.focus({preventScroll:true})}
function closeModal(){document.getElementById('modalShade').hidden=true;document.getElementById('modal').innerHTML='';modalAction=null}
function proxyModal(id,local=false){const p=profile(id);openPc('proxies');openModal(p?'编辑代理':local?'添加本地客户端':'添加代理',`<form id="proxyForm"><div class="fields"><label class="field"><span>名称 <b style="color:#bd4658">*</b></span><input name="name" maxlength="48" value="${esc(p?.name|| (local?'本地客户端':''))}" placeholder="例如：自用代理" required autofocus></label><label class="field"><span>代理协议</span><select name="scheme"><option ${p?.scheme==='HTTP'?'selected':''}>HTTP</option><option ${p?.scheme==='HTTPS'?'selected':''}>HTTPS</option><option ${p?.scheme==='SOCKS5'||local?'selected':''}>SOCKS5</option><option ${p?.scheme==='SOCKS4'?'selected':''}>SOCKS4</option></select></label><label class="field"><span>服务器地址 <b style="color:#bd4658">*</b></span><input name="host" value="${esc(p?.host||(local?'127.0.0.1':''))}" placeholder="proxy.example.com" required></label><label class="field"><span>端口 <b style="color:#bd4658">*</b></span><input type="number" name="port" min="1" max="65535" value="${esc(p?.port||'')}" placeholder="7890" required></label></div><div class="notice below">保存仅修改本次交互预览的数据，不会自动启用代理。</div><div class="form-foot">${btn('取消','close-modal') }<button class="btn primary" type="submit">保存配置（模拟）</button></div></form>`,{type:'proxy',id:id||null})}
function ruleModal(id,quick=false){openPc('rules');const r=s.rules.find(r=>r.id===id);openModal(r?'编辑网站规则':'添加网站规则',`<form id="ruleForm"><div class="fields"><label class="field span2"><span>网站域名 <b style="color:#bd4658">*</b></span><input name="domain" value="${esc(r?.domain||(quick?s.site:''))}" placeholder="example.com" required maxlength="253" autofocus></label><label class="field"><span>匹配范围</span><select name="scope"><option value="exact" ${!r?.includeSubdomains?'selected':''}>仅此域名</option><option value="sub" ${r?.includeSubdomains?'selected':''}>域名及其子域</option></select></label><label class="field"><span>使用线路</span><select name="target"><option value="direct" ${r?.target==='direct'?'selected':''}>直连</option>${s.profiles.map(p=>`<option value="${esc(p.id)}" ${r?.target===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field"><span>优先级</span><input type="number" name="priority" min="1" max="9999" value="${r?.priority||10}" required></label><label class="field" style="justify-content:end"><span class="checklabel"><input type="checkbox" name="enabled" ${!r||r.enabled?'checked':''}> 启用规则</span></label></div><div class="form-foot">${btn('取消','close-modal')}<button type="submit" class="btn primary">保存规则（模拟）</button></div></form>`,{type:'rule',id:id||null})}
function addSub(){openPc('thirdparty');openModal('导入订阅来源',`<form id="subForm"><div class="fields"><label class="field span2"><span>来源名称</span><input name="name" placeholder="例如：我的订阅" maxlength="48" required autofocus></label><label class="field span2"><span>订阅 URL</span><input name="url" type="url" placeholder="https://example.com/subscription" required></label></div><div class="notice warn below">仅保存 URL 文本，不下载配置或联网请求。</div><div class="form-foot">${btn('取消','close-modal')}<button class="btn primary" type="submit">保存来源（模拟）</button></div></form>`,{type:'sub'})}
function apply(){if(['conflict','unknown'].includes(s.scene)){openPc('diagnostics');toast('无法确认代理控制状态，请先核查');return}if(s.mode==='profile'&&!profile(s.selected)){toast('请先选择代理');return}s.applied=true;s.scene='normal';s.activeMode=s.mode;if(s.mode==='profile')s.activeProfile=s.selected;s.dirty=false;render();toast('配置已应用到预览（模拟）；没有修改真实浏览器')}
function statusClick(){if(s.scene==='empty'){proxyModal();return}if(s.scene==='conflict'||s.scene==='unknown'){openPc('diagnostics');return}if(s.scene==='error'){openPc('diagnostics');return}if(s.switching)return;if(s.applied&&pending()){apply();return}if(s.applied){s.applied=false;render();toast('已暂停（仅模拟），代理选择保留');return}apply()}
function pick(id,pc=false){if(!profile(id)||s.switching)return;if(['conflict','unknown'].includes(s.scene)){toast('代理控制状态尚未确认，请查看网络诊断');return}s.selected=id;s.mode='profile';s.dirty=true;if(pc||!s.applied||s.scene!=='normal'){render();toast('已选择配置，尚未应用');return}if(s.activeMode==='profile'&&s.activeProfile===id){render();toast('当前已经在使用该代理（模拟）');return}s.switching=id;const n=++switchSerial;render();setTimeout(()=>{if(n!==switchSerial||s.switching!==id)return;s.switching=null;s.applied=true;s.activeMode='profile';s.activeProfile=id;s.dirty=false;render();toast('模拟切换完成：'+pname(id))},320)}
function routeFor(domain){const sorted=[...s.rules].filter(r=>r.enabled).sort((a,b)=>a.priority-b.priority);const r=sorted.find(r=>r.domain===domain||(r.includeSubdomains&&domain.endsWith('.'+r.domain)));return r?(r.target==='direct'?'直连':pname(r.target)):'未匹配 · 跟随默认线路'}
function downloadJson(){const data={schemaVersion:1,proxies:s.profiles.map(p=>({id:p.id,name:p.name,protocol:p.scheme.toLowerCase(),host:p.host,port:p.port})),rules:s.rules.map(r=>({...r})),settings:{mode:s.mode,selectedProxyId:s.selected}};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ai-proxy-preview-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('演示 JSON 已导出，不含凭据')}
function confirmDelete(kind,id){const isProxy=kind==='proxy',item=isProxy?profile(id):kind==='rule'?s.rules.find(r=>r.id===id):s.subs.find(x=>x.id===id);if(!item)return;if(isProxy&&(s.selected===id||s.activeProfile===id||s.rules.some(r=>r.target===id))){openModal('代理仍在使用中',`<p style="font-size:12px;line-height:1.7">“${esc(item.name)}”正在被当前选择、已应用线路或网站规则引用。请先调整相关配置后再删除。</p><div class="form-foot">${btn('关闭','close-modal')} ${btn('查看网站规则','open-rules','btn primary')}</div>`,null);return}openModal('确认删除？',`<p style="font-size:12px;line-height:1.7">确认从本次预览中删除 “${esc(item.name||item.domain)}” 吗？</p><p class="muted below" style="font-size:11px">此操作仅改变本页内存数据，不会影响真实扩展。</p><div class="form-foot">${btn('取消','close-modal')}${btn('删除（模拟）','confirm-delete','btn danger','data-kind="'+kind+'" data-id="'+esc(id)+'"')}</div>`,null)}
app.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;switch(a){case'host-tab':s.hostTab=id;render();break;case'back-host':s.hostTab='扩展';render();toast('当前仅演示 AI Proxy');break;case'open-pc':openPc(id);break;case'back-side':s.view='side';render();document.querySelector('[data-action="open-pc"]')?.focus();break;case'mode':if(['conflict','unknown'].includes(s.scene)){toast('请先核查代理控制状态');return}s.mode=id;if(s.mode==='profile'&&!s.selected)s.selected=s.profiles[0]?.id||'';s.dirty=true;render();toast('仅预选连接方式，尚未自动应用');break;case'status':statusClick();break;case'apply':apply();break;case'pick':pick(id);break;case'pick-pc':pick(id,true);break;case'add-proxy':proxyModal();break;case'edit-proxy':proxyModal(id);break;case'delete-proxy':confirmDelete('proxy',id);break;case'favorite':{const p=profile(id);if(p)p.favorite=!p.favorite;render();break}case'site-rule':ruleModal(null,true);break;case'add-rule':ruleModal();break;case'edit-rule':ruleModal(id);break;case'delete-rule':confirmDelete('rule',id);break;case'add-sub':addSub();break;case'add-local':proxyModal(null,true);break;case'subtab':s.subtab=id;render();break;case'delete-sub':confirmDelete('sub',id);break;case'view-sub':{const sub=s.subs.find(x=>x.id===id);openModal('订阅详情',`<div class="notice"><strong>${esc(sub?.name)}</strong><p class="below">已记录域名：${esc(sub?new URL(sub.url).hostname:'')}</p><p class="below">状态：未联网同步</p></div><div class="form-foot">${btn('关闭','close-modal')}</div>`,null);break}case'refresh-site':toast('已刷新模拟网站信息：'+s.site);break;case'test-rule':{const v=document.getElementById('ruleTestDomain')?.value.trim().replace(/^https?:\/\//,'').split('/')[0].toLowerCase();if(v)document.getElementById('ruleResult').textContent=`${v} → ${routeFor(v)}（仅模拟规则计算）`;break}case'pac-info':case'official-info':openModal('说明',`<div class="notice">此能力在交互预览中仅保留说明入口，不实际执行 PAC、登录、订阅购买或代理网络请求。</div><div class="form-foot">${btn('关闭','close-modal')}</div>`,null);break;case'export':downloadJson();break;case'import-example':s.previewImport=JSON.stringify({schemaVersion:1,proxies:[{id:'import1',name:'导入演示代理',protocol:'http',host:'192.0.2.10',port:8080}],rules:[]},null,2);render();toast('已填入示例 JSON');break;case'import-check':{const input=document.getElementById('importText');s.previewImport=input?.value||'';const result=document.getElementById('importResult');if(s.previewImport.length>256*1024){result.innerHTML='<div class="notice error">文件超过 256 KiB</div>';break}try{const v=JSON.parse(s.previewImport);const count=Array.isArray(v.proxies)?v.proxies.length:0;if(!Array.isArray(v.proxies)&&!Array.isArray(v.rules))throw Error('缺少 proxies / rules 数组');result.innerHTML=`<div class="notice">解析完成：${count} 个代理候选。此预览仅支持基础字段，请确认后再导入。</div><div class="below">${btn('确认导入（模拟）','import-confirm','btn primary sm')}</div>`}catch(e){result.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}break}case'import-confirm':{try{const v=JSON.parse(s.previewImport);let added=0;for(const row of Array.isArray(v.proxies)?v.proxies:[]){const name=String(row.name||'').trim(),host=String(row.host||'').trim(),port=Number(row.port),scheme=String(row.protocol||'http').toUpperCase();if(!name||!host||!Number.isInteger(port)||port<1||port>65535||!['HTTP','HTTPS','SOCKS4','SOCKS5'].includes(scheme))continue;s.profiles.push({id:'p'+(++nextId),name:name.slice(0,48),host:host.slice(0,240),port,scheme,favorite:false});added++}s.previewImport='';render();toast(`已导入 ${added} 项（仅模拟），未启用代理`)}catch{toast('解析失败，未导入')}break}case'probe':s.diagRan=true;s.diagnosticCount++;render();toast('模拟检测已完成，没有请求网络');break;default:break}});
document.getElementById('modalShade').addEventListener('click',e=>{if(e.target.id==='modalShade')closeModal();const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;const id=el.dataset.id;if(a==='close-modal')closeModal();else if(a==='open-rules'){closeModal();openPc('rules')}else if(a==='confirm-delete'){const kind=el.dataset.kind;if(kind==='proxy')s.profiles=s.profiles.filter(x=>x.id!==id);else if(kind==='rule')s.rules=s.rules.filter(x=>x.id!==id);else if(kind==='sub')s.subs=s.subs.filter(x=>x.id!==id);closeModal();s.dirty=true;render();toast('已从本次预览内存删除')}});
document.getElementById('modalShade').addEventListener('submit',e=>{e.preventDefault();const form=e.target,values=Object.fromEntries(new FormData(form));if(form.id==='proxyForm'){const name=String(values.name||'').trim(),host=String(values.host||'').trim(),port=Number(values.port),scheme=String(values.scheme||'HTTP');if(!name||!host||!Number.isInteger(port)||port<1||port>65535){toast('请检查名称、地址、端口');return}const p=profile(modalAction?.id);if(p){Object.assign(p,{name,host,port,scheme})}else{s.profiles.push({id:'p'+(++nextId),name,host,port,scheme,favorite:false})}s.dirty=true;closeModal();s.scene='normal';render();toast('代理配置已保存（模拟），尚未应用')}else if(form.id==='ruleForm'){const domain=String(values.domain||'').trim().toLowerCase(),priority=Number(values.priority);if(!/^[a-z0-9.-]+$/.test(domain)||!Number.isInteger(priority)||priority<1||priority>9999){toast('请检查域名及优先级');return}let r=s.rules.find(r=>r.id===modalAction?.id);if(!r){r={id:'r'+(++nextId)};s.rules.push(r)}Object.assign(r,{domain,priority,target:values.target,includeSubdomains:values.scope==='sub',enabled:!!form.elements.enabled.checked});closeModal();s.dirty=true;render();toast('网站规则已保存（模拟），尚未应用')}else if(form.id==='subForm'){try{const url=new URL(String(values.url||''));if(url.protocol!=='https:')throw Error('请使用 HTTPS 订阅地址');const name=String(values.name||'').trim();if(!name)throw Error('请输入名称');s.subs.push({id:'s'+(++nextId),name,url:url.href,enabled:true});closeModal();render();toast('订阅来源已保存（模拟），未联网同步')}catch(e){toast(e.message)}}});
document.getElementById('app').addEventListener('change',e=>{const el=e.target,kind=el.dataset.change;if(kind==='rule-enabled'){const r=s.rules.find(r=>r.id===el.dataset.id);if(r){r.enabled=el.checked;s.dirty=true;toast('规则已更新，待应用')}}else if(kind==='rule-priority'){const r=s.rules.find(r=>r.id===el.dataset.id);const v=Number(el.value);if(r&&Number.isInteger(v)&&v>=1&&v<=9999){r.priority=v;s.dirty=true;toast('优先级已更新，待应用')}else if(r){el.value=r.priority}}else if(el.id==='diagScenario'){s.diagScenario=el.value;s.diagRan=false;toast('已设置下一次模拟探测情景')}else if(el.id==='diagScene'){s.scene=el.value;s.diagRan=false;render()}else if(el.id==='language'){s.language=el.value;toast('语言偏好已记录，本便携预览仍使用简体中文')}else if(el.id==='startup'){s.startup=el.checked;toast('预览偏好已更新')}});
document.querySelectorAll('[data-compare]').forEach(el=>el.addEventListener('click',()=>{s.compare=el.dataset.compare;render()}));document.getElementById('scene').addEventListener('change',e=>{switchSerial++;s.switching=null;s.scene=e.target.value;if(s.scene==='empty'){s.applied=false;s.mode='profile';s.selected=''}else if(s.scene==='normal'){s.applied=true;s.mode='profile';s.selected=s.profiles[0]?.id||'';s.activeMode='profile';s.activeProfile=s.selected}else s.applied=false;s.diagRan=false;render()});
document.getElementById('reset').addEventListener('click',()=>{switchSerial++;diagSerial++;s=fresh();sidePos=0;closeModal();render();toast('已恢复初始预览')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modalShade').hidden)closeModal()});
render();
})();
</script>
</body>
</html>
