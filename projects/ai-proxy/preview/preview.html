/* AP-PC-PARITY-RULES-DIAGNOSTICS: reference styles scoped to these two PC surfaces.
 * Mirrored from ai-proxy-extension-preview.html (#options/rules and #options/diagnostics).
 * Existing OpenDesk shell, sidebar, subscriptions and other screens are untouched. */
.pc-parity{
  --ap-bg:#f5f7fb;--ap-surface:#fff;--ap-soft:#f6f8fb;
  --ap-ink:var(--ink);--ap-muted:var(--sub);--ap-line:var(--line);
  --ap-control-line:#8593a9;--ap-accent:var(--brand);
  --ap-accent-fill:var(--brand-light);--ap-on-accent:#fff;
  --ap-good:#196542;--ap-good-bg:#edf7f1;
  --ap-warn:#855300;--ap-warn-bg:#fff5e3;
  --ap-bad:#ae303c;--ap-bad-bg:#fff0f1;
  color:var(--ap-ink);font-size:14px;min-width:0;
}
.pc-parity *{box-sizing:border-box}
.pc-parity .ap-button{cursor:pointer}
.pc-parity .ap-button:disabled{opacity:1;background:#eef2f7;border-color:#dce3ec;color:#56677f;filter:none;cursor:not-allowed}
.pc-parity .ap-primary{color:var(--ap-on-accent)}
.pc-parity .ap-primary:hover:not(:disabled){color:var(--ap-on-accent)}
.pc-parity :where(button,input,select,summary):focus-visible{outline:2px solid var(--ap-accent);outline-offset:2px}
.pc-parity .ap-muted{color:var(--ap-muted)}
.pc-parity .ap-small{font-size:12px;line-height:1.5}
.pc-parity .ap-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
.pc-parity .ap-row{display:flex;align-items:center;gap:10px;min-width:0}
.pc-parity .ap-between{justify-content:space-between}
.pc-parity .ap-wrap{flex-wrap:wrap}
.pc-parity .ap-stack{display:grid;gap:14px}
.pc-parity .ap-grow{flex:1;min-width:0}
.pc-parity .ap-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 13px;border:1px solid #cbd5e1;border-radius:8px;background:var(--ap-surface);color:var(--ap-ink);font-size:13px;font-weight:600;white-space:normal;line-height:1.4;text-align:center;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
.pc-parity .ap-button:hover:not(:disabled){background:#f1f5ff;border-color:#a9bce2}

/* OD-AI-PROXY-ALWAYS-VISIBLE-ICON-ACTIONS-R2
   Actions stay visible on PC and touch. Absolute placement + permanent text
   inset ensures no hover reflow or text overlap; narrow containers use row 2. */
.pc-proxy-table{container-type:inline-size}
.pc-proxy-row.table-row{
  position:relative;grid-template-columns:34px minmax(0,1fr);gap:13px;
  min-height:66px;padding:10px 164px 10px 9px;
}
.pc-proxy-row .table-main{min-width:0;overflow:hidden}
.pc-proxy-row .table-main .name{min-width:0;display:flex;flex-wrap:nowrap;align-items:center;gap:7px}
.pc-proxy-row .pc-proxy-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:680}
.pc-proxy-row .table-main .tag{flex:none;white-space:nowrap}
.pc-proxy-row .pc-proxy-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;overflow-wrap:normal}
.pc-proxy-row .pc-proxy-actions{
  position:absolute;top:50%;right:8px;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:flex-end;gap:3px;
  padding:4px;border:1px solid var(--line);border-radius:9px;
  background:var(--white);opacity:1;visibility:visible;pointer-events:auto;
}
.pc-proxy-row:hover .pc-proxy-actions,.pc-proxy-row:focus-within .pc-proxy-actions{
  background:var(--white);border-color:#cbd5e6
}
.pc-proxy-row .pc-proxy-icon-btn,.pc-list-icon-btn{
  display:inline-grid;place-items:center;flex:none;
  width:32px;height:32px;min-width:32px;min-height:32px;
  padding:0;border:1px solid transparent;border-radius:7px;
  background:transparent;color:#64748b;cursor:pointer;
}
.pc-proxy-row .pc-proxy-icon-btn:hover,.pc-list-icon-btn:hover,
.pc-proxy-row .pc-proxy-icon-btn:focus-visible,.pc-list-icon-btn:focus-visible{
  background:var(--brand-light);color:var(--brand)
}
.pc-proxy-row .pc-proxy-icon-btn.is-selected{color:var(--green);background:#eaf7f1}
.pc-proxy-row .pc-proxy-icon-btn.is-favorite{color:var(--brand)}
.pc-proxy-row .pc-proxy-icon-btn.is-favorite svg{fill:currentColor}
.pc-proxy-row .pc-proxy-icon-btn.is-danger:hover,.pc-list-icon-btn.is-danger:hover,
.pc-proxy-row .pc-proxy-icon-btn.is-danger:focus-visible,.pc-list-icon-btn.is-danger:focus-visible{
  background:#fff1f3;color:var(--red)
}
.pc-proxy-row .pc-proxy-icon-btn:focus-visible,.pc-list-icon-btn:focus-visible{
  outline:2px solid var(--brand);outline-offset:2px
}
.pc-list-actions{display:flex;align-items:center;justify-content:flex-end;gap:3px}
.pc-parity .rule-row .pc-list-actions{display:flex;align-items:center;gap:3px;justify-content:flex-end}
.pc-parity .rule-row .pc-list-icon-btn{min-height:32px;padding:0}
@container (max-width:430px){
  .pc-proxy-row.table-row{grid-template-columns:30px minmax(0,1fr);padding:10px 9px;gap:7px 10px}
  .pc-proxy-row .pc-proxy-actions{
    position:static;grid-column:2;grid-row:2;transform:none;
    justify-self:start;background:var(--soft);border-color:var(--line);
    padding:3px
  }
}
@media(pointer:coarse){
  .pc-proxy-row .pc-proxy-icon-btn,.pc-list-icon-btn{width:36px;height:36px;min-width:36px;min-height:36px}
}

/* Small-width diagnostics: keep actions readable and in flow. */
@media(max-width:390px){
 .pc-parity .nd-hero{padding:18px 15px}
 .pc-parity .nd-hero-flag{min-width:0;justify-content:space-between}
 .pc-parity .nd-panel{padding:15px}
 .pc-parity .nd-page .r3-site-row{grid-template-columns:minmax(0,1fr);gap:9px}
 .pc-parity .nd-page .r3-site-title,.pc-parity .nd-page .r3-site-result{grid-column:1}
 .pc-parity .nd-row-actions{justify-content:flex-start;flex-wrap:wrap}
 .pc-parity .nd-actions .ap-button{max-width:100%;flex:1 1 auto}
 .pc-parity .nd-shortcut{flex-wrap:wrap}
 .pc-parity .nd-shortcut>.ap-button{margin-left:auto}
}
@media(pointer:coarse){.pc-parity .nd-page .ap-button,.pc-parity .ap-secondary{min-height:40px}}

<body>
<header class="app-header"><div class="header-inner"><div class="brand"><div class="brand-mark">AP</div><div><h1>AI Proxy · 侧边栏 + PC 设置</h1><p>R18 侧边栏 × R16 PC 管理 · 可交互预览</p></div></div><div class="toolbar"><span class="toolbar-label">方案对比</span><div class="segments" id="compare"><button type="button" data-compare="before">优化前</button><button type="button" data-compare="after" class="active">优化后</button></div><select id="scene" class="select" aria-label="运行场景"><option value="normal">正常使用</option><option value="empty">首次使用</option><option value="error">连接异常</option><option value="conflict">扩展冲突</option><option value="unknown">状态未知</option></select><button id="reset" class="btn sm" type="button">↺ 重置</button></div></div></header>
<main id="app" class="stage"></main>
<div id="modalShade" class="modal-shade" hidden><div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(()=>{'use strict';
const shapes={arrow:'<path d="m14 6-6 6 6 6M8 12h13"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="m10 2 4 0 .6 2.3 2 1 2.3-.9 2 3.2-1.5 1.9v2.6l1.5 1.9-2 3.2-2.3-.9-2 1L14 21h-4l-.6-2.3-2-1-2.3.9-2-3.2L4.6 13.5v-3l-1.5-1.9 2-3.2 2.3.9 2-1z"/>',plus:'<path d="M12 5v14M5 12h14"/>',server:'<rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01"/>',route:'<path d="M6 4h7a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h9"/><circle cx="6" cy="4" r="2"/><circle cx="18" cy="20" r="2"/>',network:'<rect x="2" y="3" width="20" height="13" rx="2"/><path d="M8 21h8m-4-5v5"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',check:'<path d="m4 12 5 5L20 6"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M5 9a7 7 0 0 1 13-2l2 2M19 15a7 7 0 0 1-13 2l-2-2"/>',shield:'<path d="m12 2 8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/>',folder:'<path d="M3 6h6l2 2h10v11H3z"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>',edit:'<path d="m4 20 4.5-1 11-11-3.5-3.5-11 11L4 20zM14 6l3.5 3.5"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/>',star:'<path d="m12 2 3 6 6.5 1-4.7 4.6 1.1 6.7-5.9-3.1-6 3.1 1.2-6.7L2.5 9 9 8z"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',alert:'<path d="M12 3 2 21h20zM12 9v5m0 3h.01"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ico=(name,size=18)=>`<span class="icon" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]||shapes.info}</svg></span>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fresh=()=>({view:'side',compare:'after',scene:'normal',hostTab:'扩展',section:'proxies',mode:'profile',selected:'p1',applied:true,activeMode:'profile',activeProfile:'p1',switching:null,profiles:[{id:'p1',name:'香港节点 · 主用',scheme:'SOCKS5',host:'proxy.example.com',port:7890,favorite:true},{id:'p2',name:'美国节点 · 备用',scheme:'SOCKS5',host:'us.example.net',port:1080,favorite:true},{id:'p3',name:'本地 Clash',scheme:'HTTP',host:'127.0.0.1',port:7890,favorite:false}],rules:[{id:'r1',domain:'example.com',target:'p1',includeSubdomains:true,priority:10,enabled:true}],subs:[{id:'s1',name:'我的订阅',url:'https://example.com/my-subscription',enabled:true}],site:'example.com',subtab:'sources',language:'zh-CN',startup:false,theme:'light',diagRan:false,diagScenario:'success',diagnosticCount:0,previewImport:'',notice:'',dirty:false});
let s=fresh(), modalAction=null,toastTimer=null,switchSerial=0,diagSerial=0,nextId=4,sidePos=0;
const app=document.getElementById('app'); const modeNames={profile:'使用代理',rules:'按规则',direct:'直接连接',system:'跟随系统'};const modeIcon={profile:'server',rules:'route',direct:'network',system:'gear'};
const profile=id=>s.profiles.find(p=>p.id===id);const pname=id=>profile(id)?.name||'未选择代理';const planned=()=>s.mode==='profile'?pname(s.selected):modeNames[s.mode];const live=()=>s.activeMode==='profile'?pname(s.activeProfile):modeNames[s.activeMode];const pending=()=>s.applied&&(s.dirty||s.mode!==s.activeMode||(s.mode==='profile'&&s.selected!==s.activeProfile));const endpoint=p=>`${p.scheme} · ${p.host}:${p.port}`;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2800)}
const btn=(name,action,cl='btn',attrs='')=>`<button class="${cl}" type="button" data-action="${action}" ${attrs}>${name}</button>`;
const listIcon=(action,id,glyph,label,danger=false)=>
  `<button type="button" class="pc-list-icon-btn${danger?' is-danger':''}" data-action="${action}" data-id="${esc(id)}" title="${esc(label)}" aria-label="${esc(label)}">${ico(glyph,16)}</button>`;
function status(){ if(s.scene==='empty')return {label:'尚未配置',desc:'添加代理或订阅来源后开始使用',tone:'warn',button:'添加代理'};if(s.scene==='error')return {label:'连接异常',desc:'代理不可用，请检查连接设置',tone:'red',button:'重试'};if(s.scene==='conflict')return {label:'无法接管',desc:'浏览器代理正在由其他扩展管理',tone:'red',button:'查看原因'};if(s.scene==='unknown')return {label:'状态尚未确认',desc:'结果未知，需要核查当前状态',tone:'warn',button:'刷新状态'};if(s.switching)return {label:'正在切换',desc:'正在切换至 '+pname(s.switching)+'（离线模拟）',tone:'warn',button:'切换中…'};if(s.applied)return {label:'正在运行',desc:'当前线路：'+live(),tone:'green',button:pending()?'应用更改':'暂停'};return {label:'已暂停',desc:'已选：'+planned()+' · 尚未启用',tone:'warn',button:s.mode==='profile'&&!s.selected?'选择代理':'启用'} }
function renderSide(){const st=status();const list=s.scene==='empty'?[]:s.profiles;return `<div class="side-layout"><div class="side-shell"><div class="frame-note"><strong>侧边栏 · ${s.compare==='before'?'优化前':'优化后'}</strong><span>400 px · 可交互模拟</span></div><div class="side-frame"><nav class="host-tabs" aria-label="OpenDesk 工作台">${['我的','扩展','工作流','开发','云控'].map(n=>`<button type="button" data-action="host-tab" data-id="${n}" class="${n===s.hostTab?'active':''}">${n}</button>`).join('')}</nav><div class="host-head">${btn(ico('arrow'),'back-host','icon-btn','aria-label="返回扩展列表"')}<span class="name">AI Proxy</span><span class="ai">AI</span>${btn(ico('gear'),'open-pc','icon-btn','data-id="proxies" aria-label="管理设置" title="管理设置"')}</div>${s.hostTab!=='扩展'?`<div style="padding:40px 20px;text-align:center"><h3>${esc(s.hostTab)}</h3><p class="muted">非 AI Proxy 工作台内容未在预览中重建</p><div class="below">${btn('返回扩展','back-host')}</div></div>`:`<div class="side-scroll" id="sideScroll"><section class="side-section"><div class="section-head"><strong>连接方式</strong><span class="section-actions">${btn(ico('plus'),'add-proxy','icon-btn','aria-label="添加代理"')}${btn(ico('gear'),'open-pc','icon-btn','data-id="proxies" aria-label="管理设置"')}</span></div><div class="mode-grid">${Object.entries(modeNames).map(([key,label])=>`<button class="mode ${s.mode===key?'active':''}" type="button" data-action="mode" data-id="${key}" ${s.switching?'disabled':''}>${ico(modeIcon[key])}<span>${label}</span></button>`).join('')}</div></section><section class="side-section"><div class="status-card"><div class="status-copy"><div class="status-top"><span class="dot ${st.tone}"></span>${esc(st.label)}</div><span class="status-desc">${esc(st.desc)}</span></div>${btn(st.button,'status','btn primary',s.switching?'disabled':'')}</div>${s.scene==='normal'&&pending()?`<p class="status-help pending">仍在使用：${esc(live())}；待应用：${esc(planned())}</p>`:''}${s.scene==='normal'&&!s.applied?'<p class="status-help">已预选线路，点击「启用」后才生效。</p>':''}${['error','conflict','unknown'].includes(s.scene)?`<div class="alert-inline">${ico('alert')}<span class="text">${s.scene==='conflict'?'发现代理控制冲突':'请查看连接诊断'}</span>${btn('网络诊断 ↗','open-pc','btn sm','data-id="diagnostics"')}</div>`:''}</section><section class="side-section"><div class="section-head"><strong>${list.length?'我的代理':'订阅与本地客户端'}${list.length?`<span class="count">${list.length}</span>`:''}</strong>${list.length?btn(ico('server'),'open-pc','icon-btn','data-id="proxies" aria-label="管理全部" title="管理全部"'):''}</div>${list.length?`<div class="proxy-list">${list.slice(0,4).map(p=>{const chosen=s.selected===p.id&&s.mode==='profile',actual=s.applied&&s.activeMode==='profile'&&s.activeProfile===p.id&&!s.switching,label=s.switching===p.id?'切换中…':actual?'使用中':chosen?'待启用':s.applied?'切换':'选择';return `<button class="proxy-choice ${chosen?'chosen':''}" type="button" data-action="pick" data-id="${esc(p.id)}" ${['conflict','unknown'].includes(s.scene)||s.switching?'disabled':''}><span class="letter">${p.scheme.startsWith('SOCKS')?'S':'H'}</span><span class="summary"><strong>${esc(p.name)}</strong><small>${esc(endpoint(p))}</small></span><span class="action ${actual?'current':''}">${actual?ico('check',12):''}${label}</span></button>`}).join('')}</div>${btn(ico('plus',15)+' 添加代理','add-proxy','add-wide')}`:`<p class="muted" style="font-size:11px">尚无代理配置，可以先添加：</p><div class="empty-actions"><button type="button" data-action="add-sub">${ico('link')}<strong>导入订阅</strong><small>通过订阅链接添加</small></button><button type="button" data-action="add-local">${ico('network')}<strong>本地客户端</strong><small>Clash / sing-box</small></button></div>`}</section><section class="side-section"><div class="section-head"><strong>当前网站</strong>${btn(ico('route'),'open-pc','icon-btn','data-id="rules" aria-label="管理网站规则"')}</div><div class="site-domain">${ico('globe',16)} ${esc(s.site)}</div><div class="site-meta">当前页面 · 仅显示示例域名</div><dl class="site-details"><dt>浏览器设置</dt><dd>${esc(s.applied?modeNames[s.activeMode]:'跟随系统')}</dd><dt>预期线路</dt><dd>${esc(planned())}</dd></dl><p class="status-help">切换规则或代理后，可能需要明确应用才会生效。</p><div class="site-actions">${btn(ico('plus',14)+' 为此网站添加规则','site-rule')}${btn(ico('refresh',14)+' 刷新网站','refresh-site')}</div></section><details class="disclosure"><summary>高级代理功能</summary><div style="margin-top:7px">轮换计划、PAC 和更多配置保留在 PC 管理中。${btn('管理高级选项 ↗','open-pc','btn ghost sm','data-id="proxies"')}</div></details><p class="legal">只管理浏览器代理设置，不会改变设备的全局代理。</p></div>${s.compare==='before'?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px;border-top:1px solid var(--line)">${btn('订阅来源 ↗','open-pc','btn sm','data-id="thirdparty"')}${btn('网络诊断 ↗','open-pc','btn sm','data-id="diagnostics"')}</div>`:''}</div></div>`}<aside class="review"><div class="review-card"><div class="review-head"><span class="review-num">${s.compare==='after'?'新':'旧'}</span><h3>${s.compare==='after'?'R18 · 侧栏高频操作':'R18 · 旧版对照'}</h3></div>${(s.compare==='after'?[['移除底部常驻双按钮','订阅和诊断都归入 PC 管理。'],['代理选择与应用分离','运行中点其他代理，可模拟切换；暂停时只预选。'],['设置页完整复用 R16','点击齿轮体验七个管理栏目。']]:[['底部占位过大','订阅与诊断常驻，挤占主界面。'],['操作状态不够明显','选择代理和启用代理的语义容易混淆。'],['管理入口分散','低频操作散落在侧边栏。']]).map(([a,b])=>`<div class="review-item">${ico(s.compare==='after'?'check':'alert',18)}<div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}<div class="review-summary">本文件为离线、可点击的便携演示。切换线路、管理配置、探测和导入导出都不接管实际浏览器网络。</div><div class="review-hint"><strong>建议体验：</strong> 点击侧栏右上方齿轮进入 PC 设置；在代理配置管理页面尝试“添加代理 / 编辑 / 删除”，再返回侧栏查看结果。</div></div></aside></div>`}
const navs=[['proxies','代理配置','server'],['rules','网站规则','route'],['thirdparty','订阅管理','link'],['import','导入备份','folder'],['diagnostics','网络诊断','network'],['general','通用设置','gear'],['official','官方网络','globe']];
function heading(title,desc,action=''){return `<div class="page-heading"><div><p class="eyebrow">设置</p><h2>${title}</h2><p>${desc}</p></div>${action}</div>`}
function pcModes(){return `<div class="panel"><div class="panel-head"><div><h3>代理模式</h3><p>选择连接方式不会自动改变浏览器代理，需明确应用。</p></div><span class="tag blue">模拟配置</span></div><div class="pc-mode-grid">${Object.entries(modeNames).map(([id,title])=>`<button class="pc-mode ${s.mode===id?'active':''}" data-action="mode" data-id="${id}" type="button">${ico(modeIcon[id],17)}${title}</button>`).join('')}</div><div class="apply-row"><div class="muted" style="font-size:11.5px">${s.applied?'当前已应用：'+esc(live())+'。':'尚未启用浏览器代理。'}${pending()?' 已选择：'+esc(planned())+'（待应用）':''}</div><div class="actions">${btn(s.applied?'暂停':'启用','status','btn sm')}${btn('应用配置','apply','btn primary sm',!pending()?'disabled':'')}</div></div></div>`}
function pcProxies(){
  const iconButton=(p,action,icon,label,extra='',pressed=null)=>{
    const status=pressed===null?'':` aria-pressed="${pressed}"`;
    return `<button type="button" class="pc-proxy-icon-btn ${extra}" data-action="${action}" data-id="${esc(p.id)}" title="${esc(label)}" aria-label="${esc(label)}"${status}>${ico(icon,16)}</button>`;
  };
  const rows=s.profiles.map(p=>{
    const chosen=s.mode==='profile'&&s.selected===p.id;
    const favoriteLabel=(p.favorite?'取消收藏：':'收藏：')+p.name;
    const chooseLabel=(chosen?'已选择代理：':'选择代理：')+p.name;
    return `<div class="table-row pc-proxy-row" data-proxy-id="${esc(p.id)}">

function normalizeRuleTestHost(raw){
  const value=String(raw||'').trim();
  if(!value||value.length>2048||/[\\\s\x00-\x1f]/.test(value))return null;
  try{
    const url=new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(value)?value:'https://'+value);
    if(!['http:','https:'].includes(url.protocol)||url.username||url.password)return null;
    const host=url.hostname.toLowerCase().replace(/\.$/,'');
    if(!host||host.length>253||/[^a-z0-9.\-\[\]:]/.test(host))return null;
    return host;
  }catch{return null}
}
function previewRuleExplanation(raw){

  const indexed=[...s.rules].filter(r=>r.enabled).sort((a,b)=>a.priority-b.priority);
  const rule=indexed.find(r=>r.domain===host||(r.includeSubdomains&&host.endsWith('.'+r.domain)));
  if(rule){
    return {label:rule.target==='direct'?'直连':pname(rule.target),
      detail:'网站规则 · '+rule.domain+' · '+(rule.includeSubdomains?'域名及子域':'精确域名')+' · 优先级 '+rule.priority};
  }
  return {label:s.ruleDefault&&s.ruleDefault!=='direct'?pname(s.ruleDefault):'直连',detail:'默认动作 · 未匹配任何已启用规则'};

function diagnosticBatchStart(ids){
  diagnosticModel();
  if(!diagnosticReady()){toast(diagnosticMessage()||'请先启用配置');return}
  if(diagBatch)return;
  const idsUnique=[...new Set(ids)].filter(id=>id.startsWith('current:')||s.diagSites.some(x=>x.id===id)).slice(0,10);
  if(!idsUnique.length){toast('请先收藏至少一个网站');return}
  const job={ids:idsUnique,index:0,kind:s.diagOutcome,signature:s.diagSignature};
  diagBatch=job;
  for(const id of idsUnique)delete s.diagRecords[id];
  const step=()=>{
    if(diagBatch!==job||s.diagSignature!==job.signature)return;
    if(job.index>=job.ids.length){diagBatch=null;render();toast('模拟检测完成，真实可达性仍未知');return}
    const id=job.ids[job.index++];
    const info=diagnosticOutcomes()[job.kind]||diagnosticOutcomes().ok;
    s.diagRecords[id]={kind:job.kind,ms:info[2]===null?null:120+job.index*24,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),signature:job.signature};
    render();diagBatchTimer=setTimeout(step,360);
  };
  render();diagBatchTimer=setTimeout(step,220);
}
function diagnosticSpeedStart(kind){
  diagnosticModel();
  if(!diagnosticReady()||diagSpeedTask){toast(diagnosticMessage()||'检测正在进行');return}
  if(!['latency','download'].includes(kind))return;
  const job={kind,step:0,signature:s.diagSignature,scenario:s.diagSpeedScenario};
  diagSpeedTask=job;
  const step=()=>{
    if(diagSpeedTask!==job||s.diagSignature!==job.signature)return;
    job.step++;
    if(job.step>=3){
      s.diagSpeed[kind]=job.scenario==='timeout'?'超时（模拟）':kind==='latency'?(job.scenario==='slow'?'486 ms（模拟）':'126 ms（模拟）'):(job.scenario==='slow'?'9.4 Mbps（模拟）':'52.8 Mbps（模拟）');
      diagSpeedTask=null;render();toast('仅模拟测速，未发送真实请求');return;
    }
    render();diagSpeedTimer=setTimeout(step,350);
  };
  render();diagSpeedTimer=setTimeout(step,350);
}
function diagnosticCancel(){
  if(diagBatch){clearTimeout(diagBatchTimer);diagBatch=null}
  if(diagSpeedTask){clearTimeout(diagSpeedTimer);diagSpeedTask=null}
  render();toast('已取消模拟检测；保留已完成结果');
}
function diagnosticAddSite(value){
  diagnosticModel();
  const raw=String(value||'').trim();
  if(!raw||raw.length>2048||/[\s\\\x00-\x1f]/.test(raw)){toast('请输入合法的公网 HTTPS 网站域名');return}
  let url;
  try{url=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw)}catch{toast('域名格式不正确');return}
  const host=url.hostname.toLowerCase().replace(/\.$/,'');
  if(url.protocol!=='https:'||url.username||url.password||url.port||host.length>253||
    !host.includes('.')||host.startsWith('[')||/^\d+\.\d+\.\d+\.\d+$/.test(host)||
    /(^localhost$|\.(local|localhost|internal|test|invalid)$)/.test(host)||
    !host.split('.').every(x=>/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(x))){
    toast('仅支持公网 HTTPS 域名，不接受 IP、内网、端口或凭据');return;
  }
  if(s.diagSites.some(x=>x.host===host)){toast('网站已在列表中');return}
  if(s.diagSites.length>=30){toast('最多添加 30 个网站');return}
  s.diagSites.push({id:'custom-'+host,name:host,host,selected:true,priority:2,custom:true});
  render();toast('已加入本地收藏，不联网');
}

function restorePreviewHash(){
  const raw=String(location.hash||'');
  let view='side',section='proxies',tab='overview';
  if(/^#options\//.test(raw)){
    const parts=raw.slice(9).split('/');
    const matched=Object.entries(previewPages).find(([,slug])=>slug===parts[0]);
    if(matched&&parts.length<=(parts[0]==='diagnostics'?2:1)){
      view='pc';section=matched[0];
      if(section==='diagnostics'&&['overview','ai','top','speed','proxy'].includes(parts[1]))tab=parts[1];
    }
  }else if(raw==='#sidepanel'||raw==='#')view='side';
  previewRestoring=true;
  try{s.view=view;s.section=section;if(section==='diagnostics')s.diagView=tab;render()}finally{previewRestoring=false}
}

function openModal(title,body,action){modalAction=action;document.getElementById('modal').innerHTML=`<div class="modal-head"><h2 id="modalTitle">${esc(title)}</h2>${btn(ico('close'),'close-modal','icon-btn','aria-label="关闭"')}</div>${body}`;document.getElementById('modalShade').hidden=false;document.getElementById('modal').querySelector('input,select,button')?.focus({preventScroll:true})}
function closeModal(){document.getElementById('modalShade').hidden=true;document.getElementById('modal').innerHTML='';modalAction=null}
function proxyModal(id,local=false){const p=profile(id);openPc('proxies');openModal(p?'编辑代理':local?'添加本地客户端':'添加代理',`<form id="proxyForm"><div class="fields"><label class="field"><span>名称 <b style="color:#bd4658">*</b></span><input name="name" maxlength="48" value="${esc(p?.name|| (local?'本地客户端':''))}" placeholder="例如：自用代理" required autofocus></label><label class="field"><span>代理协议</span><select name="scheme"><option ${p?.scheme==='HTTP'?'selected':''}>HTTP</option><option ${p?.scheme==='HTTPS'?'selected':''}>HTTPS</option><option ${p?.scheme==='SOCKS5'||local?'selected':''}>SOCKS5</option><option ${p?.scheme==='SOCKS4'?'selected':''}>SOCKS4</option></select></label><label class="field"><span>服务器地址 <b style="color:#bd4658">*</b></span><input name="host" value="${esc(p?.host||(local?'127.0.0.1':''))}" placeholder="proxy.example.com" required></label><label class="field"><span>端口 <b style="color:#bd4658">*</b></span><input type="number" name="port" min="1" max="65535" value="${esc(p?.port||'')}" placeholder="7890" required></label></div><div class="notice below">保存仅修改本次交互预览的数据，不会自动启用代理。</div><div class="form-foot">${btn('取消','close-modal') }<button class="btn primary" type="submit">保存配置（模拟）</button></div></form>`,{type:'proxy',id:id||null})}
function ruleModal(id,quick=false){openPc('rules');const r=s.rules.find(r=>r.id===id);openModal(r?'编辑网站规则':'添加网站规则',`<form id="ruleForm"><div class="fields"><label class="field span2"><span>网站域名 <b style="color:#bd4658">*</b></span><input name="domain" value="${esc(r?.domain||(quick?s.site:''))}" placeholder="example.com" required maxlength="253" autofocus></label><label class="field"><span>匹配范围</span><select name="scope"><option value="exact" ${!r?.includeSubdomains?'selected':''}>仅此域名</option><option value="sub" ${r?.includeSubdomains?'selected':''}>域名及其子域</option></select></label><label class="field"><span>使用线路</span><select name="target"><option value="direct" ${r?.target==='direct'?'selected':''}>直连</option>${s.profiles.map(p=>`<option value="${esc(p.id)}" ${r?.target===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field"><span>优先级</span><input type="number" name="priority" min="1" max="9999" value="${r?.priority||10}" required></label><label class="field" style="justify-content:end"><span class="checklabel"><input type="checkbox" name="enabled" ${!r||r.enabled?'checked':''}> 启用规则</span></label></div><div class="form-foot">${btn('取消','close-modal')}<button type="submit" class="btn primary">保存规则（模拟）</button></div></form>`,{type:'rule',id:id||null})}
function addSub(){openPc('thirdparty');openModal('导入订阅来源',`<form id="subForm"><div class="fields"><label class="field span2"><span>来源名称</span><input name="name" placeholder="例如：我的订阅" maxlength="48" required autofocus></label><label class="field span2"><span>订阅 URL</span><input name="url" type="url" placeholder="https://example.com/subscription" required></label></div><div class="notice warn below">仅保存 URL 文本，不下载配置或联网请求。</div><div class="form-foot">${btn('取消','close-modal')}<button class="btn primary" type="submit">保存来源（模拟）</button></div></form>`,{type:'sub'})}
function apply(){if(['conflict','unknown'].includes(s.scene)){openPc('diagnostics');toast('无法确认代理控制状态，请先核查');return}if(s.mode==='profile'&&!profile(s.selected)){toast('请先选择代理');return}s.applied=true;s.scene='normal';s.activeMode=s.mode;if(s.mode==='profile')s.activeProfile=s.selected;s.dirty=false;render();toast('配置已应用到预览（模拟）；没有修改真实浏览器')}
function statusClick(){if(s.scene==='empty'){proxyModal();return}if(s.scene==='conflict'||s.scene==='unknown'){openPc('diagnostics');return}if(s.scene==='error'){openPc('diagnostics');return}if(s.switching)return;if(s.applied&&pending()){apply();return}if(s.applied){s.applied=false;render();toast('已暂停（仅模拟），代理选择保留');return}apply()}
function pick(id,pc=false){if(!profile(id)||s.switching)return;if(['conflict','unknown'].includes(s.scene)){toast('代理控制状态尚未确认，请查看网络诊断');return}s.selected=id;s.mode='profile';s.dirty=true;if(pc||!s.applied||s.scene!=='normal'){render();toast('已选择配置，尚未应用');return}if(s.activeMode==='profile'&&s.activeProfile===id){render();toast('当前已经在使用该代理（模拟）');return}s.switching=id;const n=++switchSerial;render();setTimeout(()=>{if(n!==switchSerial||s.switching!==id)return;s.switching=null;s.applied=true;s.activeMode='profile';s.activeProfile=id;s.dirty=false;render();toast('模拟切换完成：'+pname(id))},320)}
function routeFor(domain){const sorted=[...s.rules].filter(r=>r.enabled).sort((a,b)=>a.priority-b.priority);const r=sorted.find(r=>r.domain===domain||(r.includeSubdomains&&domain.endsWith('.'+r.domain)));return r?(r.target==='direct'?'直连':pname(r.target)):(s.ruleDefault&&s.ruleDefault!=='direct'?pname(s.ruleDefault):'直连（默认）')}
function downloadJson(){const data={schemaVersion:1,proxies:s.profiles.map(p=>({id:p.id,name:p.name,protocol:p.scheme.toLowerCase(),host:p.host,port:p.port})),rules:s.rules.map(r=>({...r})),settings:{mode:s.mode,selectedProxyId:s.selected,defaultAction:s.ruleDefault&&s.ruleDefault!=='direct'?'proxy':'direct',defaultProxyId:s.ruleDefault&&s.ruleDefault!=='direct'?s.ruleDefault:null}};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ai-proxy-preview-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('演示 JSON 已导出，不含凭据')}
function confirmDelete(kind,id){const isProxy=kind==='proxy',item=isProxy?profile(id):kind==='rule'?s.rules.find(r=>r.id===id):s.subs.find(x=>x.id===id);if(!item)return;if(isProxy&&(s.selected===id||s.activeProfile===id||s.rules.some(r=>r.target===id))){openModal('代理仍在使用中',`<p style="font-size:12px;line-height:1.7">“${esc(item.name)}”正在被当前选择、已应用线路或网站规则引用。请先调整相关配置后再删除。</p><div class="form-foot">${btn('关闭','close-modal')} ${btn('查看网站规则','open-rules','btn primary')}</div>`,null);return}openModal('确认删除？',`<p style="font-size:12px;line-height:1.7">确认从本次预览中删除 “${esc(item.name||item.domain)}” 吗？</p><p class="muted below" style="font-size:11px">此操作仅改变本页内存数据，不会影响真实扩展。</p><div class="form-foot">${btn('取消','close-modal')}${btn('删除（模拟）','confirm-delete','btn danger','data-kind="'+kind+'" data-id="'+esc(id)+'"')}</div>`,null)}
app.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;switch(a){case'host-tab':s.hostTab=id;render();break;case'back-host':s.hostTab='扩展';render();toast('当前仅演示 AI Proxy');break;case'open-pc':openPc(id);break;case'back-side':s.view='side';render();document.querySelector('[data-action="open-pc"]')?.focus();break;case'mode':if(['conflict','unknown'].includes(s.scene)){toast('请先核查代理控制状态');return}s.mode=id;if(s.mode==='profile'&&!s.selected)s.selected=s.profiles[0]?.id||'';s.dirty=true;render();toast('仅预选连接方式，尚未自动应用');break;case'status':statusClick();break;case'apply':apply();break;case'pick':pick(id);break;case'pick-pc':pick(id,true);break;case'add-proxy':proxyModal();break;case'edit-proxy':proxyModal(id);break;case'delete-proxy':confirmDelete('proxy',id);break;case'favorite':{const p=profile(id);if(p)p.favorite=!p.favorite;render();break}case'site-rule':ruleModal(null,true);break;case'add-rule':ruleModal();break;case'edit-rule':ruleModal(id);break;case'delete-rule':confirmDelete('rule',id);break;case'add-sub':addSub();break;case'add-local':proxyModal(null,true);break;case'subtab':s.subtab=id;render();break;case'delete-sub':confirmDelete('sub',id);break;case'view-sub':{const sub=s.subs.find(x=>x.id===id);openModal('订阅详情',`<div class="notice"><strong>${esc(sub?.name)}</strong><p class="below">已记录域名：${esc(sub?new URL(sub.url).hostname:'')}</p><p class="below">状态：未联网同步</p></div><div class="form-foot">${btn('关闭','close-modal')}</div>`,null);break}case'refresh-site':toast('已刷新模拟网站信息：'+s.site);break;case'test-rule':{s.ruleTestHost=document.getElementById('ruleTestDomain')?.value||'';render();break}case'pac-info':case'official-info':openModal('说明',`<div class="notice">此能力在交互预览中仅保留说明入口，不实际执行 PAC、登录、订阅购买或代理网络请求。</div><div class="form-foot">${btn('关闭','close-modal')}</div>`,null);break;case'export':downloadJson();break;case'import-example':s.previewImport=JSON.stringify({schemaVersion:1,proxies:[{id:'import1',name:'导入演示代理',protocol:'http',host:'192.0.2.10',port:8080}],rules:[]},null,2);render();toast('已填入示例 JSON');break;case'import-check':{const input=document.getElementById('importText');s.previewImport=input?.value||'';const result=document.getElementById('importResult');if(s.previewImport.length>256*1024){result.innerHTML='<div class="notice error">文件超过 256 KiB</div>';break}try{const v=JSON.parse(s.previewImport);const count=Array.isArray(v.proxies)?v.proxies.length:0;if(!Array.isArray(v.proxies)&&!Array.isArray(v.rules))throw Error('缺少 proxies / rules 数组');result.innerHTML=`<div class="notice">解析完成：${count} 个代理候选。此预览仅支持基础字段，请确认后再导入。</div><div class="below">${btn('确认导入（模拟）','import-confirm','btn primary sm')}</div>`}catch(e){result.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}break}case'import-confirm':{try{const v=JSON.parse(s.previewImport);let added=0;for(const row of Array.isArray(v.proxies)?v.proxies:[]){const name=String(row.name||'').trim(),host=String(row.host||'').trim(),port=Number(row.port),scheme=String(row.protocol||'http').toUpperCase();if(!name||!host||!Number.isInteger(port)||port<1||port>65535||!['HTTP','HTTPS','SOCKS4','SOCKS5'].includes(scheme))continue;s.profiles.push({id:'p'+(++nextId),name:name.slice(0,48),host:host.slice(0,240),port,scheme,favorite:false});added++}s.previewImport='';render();toast(`已导入 ${added} 项（仅模拟），未启用代理`)}catch{toast('解析失败，未导入')}break}case'diag-view':{if(['overview','ai','top','speed','proxy'].includes(id)){s.diagView=id;render()}break}
case'diag-top':s.diagLimit=id==='10'?10:5;render();break;
case'diag-one':diagnosticBatchStart([id]);break;
case'diag-current':diagnosticBatchStart(['current:'+s.site]);break;
case'diag-all':diagnosticBatchStart(s.diagSites.filter(x=>x.selected).sort((a,b)=>b.priority-a.priority).map(x=>x.id));break;
case'diag-speed':diagnosticSpeedStart(id);break;
case'diag-cancel':diagnosticCancel();break;
case'diag-remove-site':{const x=s.diagSites.find(x=>x.id===id&&x.custom);if(x){s.diagSites=s.diagSites.filter(item=>item.id!==id);delete s.diagRecords[id];render()}break}
case'probe':if(s.section==='diagnostics'&&!diagnosticReady()){toast(diagnosticMessage()||'请先启用并应用配置');break;}s.diagRan=true;s.diagnosticCount++;render();toast('模拟检测已完成，没有请求网络');break;default:break}});
document.getElementById('modalShade').addEventListener('click',e=>{if(e.target.id==='modalShade')closeModal();const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;const id=el.dataset.id;if(a==='close-modal')closeModal();else if(a==='open-rules'){closeModal();openPc('rules')}else if(a==='confirm-delete'){const kind=el.dataset.kind;if(kind==='proxy')s.profiles=s.profiles.filter(x=>x.id!==id);else if(kind==='rule')s.rules=s.rules.filter(x=>x.id!==id);else if(kind==='sub')s.subs=s.subs.filter(x=>x.id!==id);closeModal();s.dirty=true;render();toast('已从本次预览内存删除')}});
document.getElementById('modalShade').addEventListener('submit',e=>{e.preventDefault();const form=e.target,values=Object.fromEntries(new FormData(form));if(form.id==='proxyForm'){const name=String(values.name||'').trim(),host=String(values.host||'').trim(),port=Number(values.port),scheme=String(values.scheme||'HTTP');if(!name||!host||!Number.isInteger(port)||port<1||port>65535){toast('请检查名称、地址、端口');return}const p=profile(modalAction?.id);if(p){Object.assign(p,{name,host,port,scheme})}else{s.profiles.push({id:'p'+(++nextId),name,host,port,scheme,favorite:false})}s.dirty=true;closeModal();s.scene='normal';render();toast('代理配置已保存（模拟），尚未应用')}else if(form.id==='ruleForm'){const domain=String(values.domain||'').trim().toLowerCase(),priority=Number(values.priority);if(!/^[a-z0-9.-]+$/.test(domain)||!Number.isInteger(priority)||priority<1||priority>9999){toast('请检查域名及优先级');return}let r=s.rules.find(r=>r.id===modalAction?.id);if(!r){r={id:'r'+(++nextId)};s.rules.push(r)}Object.assign(r,{domain,priority,target:values.target,includeSubdomains:values.scope==='sub',enabled:!!form.elements.enabled.checked});closeModal();s.dirty=true;render();toast('网站规则已保存（模拟），尚未应用')}else if(form.id==='subForm'){try{const url=new URL(String(values.url||''));if(url.protocol!=='https:')throw Error('请使用 HTTPS 订阅地址');const name=String(values.name||'').trim();if(!name)throw Error('请输入名称');s.subs.push({id:'s'+(++nextId),name,url:url.href,enabled:true});closeModal();render();toast('订阅来源已保存（模拟），未联网同步')}catch(e){toast(e.message)}}});
document.getElementById('app').addEventListener('submit',e=>{if(e.target.id==='diagnosticAddSite'){e.preventDefault();diagnosticAddSite(e.target.elements.host.value)}});
document.getElementById('app').addEventListener('change',e=>{const el=e.target,kind=el.dataset.change;if(kind==='rule-enabled'){const r=s.rules.find(r=>r.id===el.dataset.id);if(r){r.enabled=el.checked;s.dirty=true;render();toast('规则已更新，待应用')}}else if(kind==='rule-priority'){const r=s.rules.find(r=>r.id===el.dataset.id);const v=Number(el.value);if(r&&Number.isInteger(v)&&v>=1&&v<=9999){r.priority=v;s.dirty=true;render();toast('优先级已更新，待应用')}else if(r){el.value=r.priority}}else if(el.id==='ruleDefaultRoute'){if(el.value==='direct'||s.profiles.some(p=>p.id===el.value)){s.ruleDefault=el.value;s.dirty=true;render();toast('默认路由已保存，等待明确应用')}}else if(el.id==='diagOutcome'){if(diagnosticOutcomes()[el.value])s.diagOutcome=el.value}else if(el.id==='diagSpeedScenario'){if(['normal','slow','timeout'].includes(el.value))s.diagSpeedScenario=el.value}else if(kind==='diagnostic-pick'){const x=s.diagSites?.find(x=>x.id===el.dataset.id);if(x){x.selected=el.checked;render()}}else if(kind==='diagnostic-priority'){const x=s.diagSites?.find(x=>x.id===el.dataset.id);if(x){x.priority=Number(el.value)===2?2:1;render()}}else if(el.id==='diagScenario'){s.diagScenario=el.value;s.diagRan=false;toast('已设置下一次模拟探测情景')}else if(el.id==='diagScene'){s.scene=el.value;s.diagRan=false;render()}else if(el.id==='language'){s.language=el.value;toast('语言偏好已记录，本便携预览仍使用简体中文')}else if(el.id==='startup'){s.startup=el.checked;toast('预览偏好已更新')}});
document.querySelectorAll('[data-compare]').forEach(el=>el.addEventListener('click',()=>{s.compare=el.dataset.compare;render()}));document.getElementById('scene').addEventListener('change',e=>{switchSerial++;s.switching=null;s.scene=e.target.value;if(s.scene==='empty'){s.applied=false;s.mode='profile';s.selected=''}else if(s.scene==='normal'){s.applied=true;s.mode='profile';s.selected=s.profiles[0]?.id||'';s.activeMode='profile';s.activeProfile=s.selected}else s.applied=false;s.diagRan=false;render()});
document.getElementById('reset').addEventListener('click',()=>{switchSerial++;diagSerial++;if(diagBatch){clearTimeout(diagBatchTimer);diagBatch=null}if(diagSpeedTask){clearTimeout(diagSpeedTimer);diagSpeedTask=null}s=fresh();sidePos=0;closeModal();render();toast('已恢复初始预览')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modalShade').hidden)closeModal()});
restorePreviewHash();
})();
</script>
