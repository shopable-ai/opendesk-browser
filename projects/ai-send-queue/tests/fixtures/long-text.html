<!doctype html>
<meta charset="utf-8">
<title>Send Queue real DOM fixture</title>
<style>
  body { margin: 30px; font: 16px/1.5 sans-serif; }
  #composer-parent { width: min(700px, 100%); margin-top: 240px; }
  form, input-area-v2 { display: block; margin: 0; }
  .surface { border-radius: 28px; background: #eee; padding: 16px; }
  input-area-v2 .surface { overflow: hidden; }
  #scrollport { max-height: 150px; overflow: auto; }
  #prompt-textarea { min-height: 24px; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; }
  #toolbar { display: flex; justify-content: flex-end; align-items: center; margin-top: 16px; }
  #native-send { width: 34px; height: 34px; border: 0; border-radius: 50%; }
</style>
<p>This local fixture uses the real view, site adapter and engine. Its UI owner, route and paste-accepting editor are test doubles; it is not an installed USER_SCRIPT or ChatGPT acceptance test. Nothing sends a message.</p>
<div id="composer-parent">
  <form><div class="surface">
    <div id="scrollport"><div id="prompt-textarea" contenteditable="true" role="textbox"></div></div>
    <div id="toolbar"><button id="native-send" type="button" data-testid="send-button" aria-label="Send">↑</button></div>
  </div></form>
</div>
<div id="simulated-history"></div>
<script type="module">
  import {createQueueView} from '../../src/page/view.js';
  import {createChatGPTSite,createGeminiSite} from '../../src/page/site.js';
  import {createQueueEngine} from '../../src/page/engine.js';

  const css=await (await fetch('../../assets/queue.css')).text();
  const bytes=new Uint8Array(await (await fetch('../../assets/crown-premium.webp')).arrayBuffer());
  const crown='data:image/webp;base64,'+btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));
  const managed=[],disposals=[];
  function createPageUI({id}){
    const host=document.createElement('div');host.dataset.fixtureUi=id;document.body.append(host);
    const shadowRoot=host.attachShadow({mode:'open'}),content=document.createElement('div');shadowRoot.append(content);
    let active=true;
    const ui={host,content,shadowRoot,active:()=>active,
      addStyle(text){const style=document.createElement('style');style.textContent=text;shadowRoot.prepend(style);},
      on:(node,type,callback)=>node.addEventListener(type,callback),
      destroy(){active=false;host.remove();}};
    managed.push(ui);return ui;
  }
  const owner={content:{ownerDocument:document},getAsset:path=>path.endsWith('.webp')?crown:css,
    onDispose:fn=>disposals.push(fn),setTimeout};
  const params=new URLSearchParams(location.search);
  const fifoMode=params.has('fifo'),gemini=fifoMode&&params.get('site')==='gemini';
  const win={location:gemini?{origin:'https://gemini.google.com',pathname:'/app/fixture'}:
    {origin:'https://chatgpt.com',pathname:'/c/fixture-20261110'},
    getComputedStyle:node=>getComputedStyle(node),getSelection:()=>getSelection(),
    HTMLTextAreaElement,HTMLInputElement,InputEvent,DataTransfer,ClipboardEvent};win.top=win;
  const editor=document.querySelector('#prompt-textarea'),send=document.querySelector('#native-send');
  const history=document.querySelector('#simulated-history');
  const geminiReply=()=>{
    const reply=document.createElement('model-response');
    reply.innerHTML='<message-content><div class="markdown">模拟回复</div></message-content>'+
      '<message-actions><button aria-label="Copy">Copy</button></message-actions>';
    return reply;
  };
  const geminiUser=text=>{
    const user=document.createElement('user-query');
    user.innerHTML='<div class="query-text"><h5 class="cdk-visually-hidden screen-reader-user-query-label" hidden></h5></div>';
    const query=user.firstElementChild;query.firstElementChild.textContent='You said '+text;
    for(const value of text.split('\n')){
      const line=document.createElement('p');line.className='query-text-line';line.textContent=' '+value+' ';query.append(line);
    }
    return user;
  };
  const geminiTurn=(id,...children)=>{
    const turn=document.createElement('div');turn.className='conversation-container';
    turn.id=id.toString(16).padStart(16,'0');turn.append(...children);return turn;
  };
  if(gemini){
    const chat=document.createElement('chat-window'),form=document.createElement('input-area-v2');
    const wrapper=document.createElement('rich-textarea');
    const old=document.querySelector('form');
    old.replaceWith(form);form.append(...old.childNodes);
    const scrollport=document.querySelector('#scrollport');scrollport.replaceWith(wrapper);wrapper.append(scrollport);
    document.querySelector('#toolbar').classList.add('input-buttons-wrapper-bottom');
    editor.className='ql-editor';send.setAttribute('aria-label','Send message');
    history.before(chat);chat.append(document.querySelector('#composer-parent'),history);
    history.append(geminiTurn(1,geminiUser('之前的提问'),geminiReply()));
  }
  // A tiny editor that accepts plaintext paste using native editing/undo. It
  // intentionally has Chromium's DIV/BR layout rather than ChatGPT's schema.
  document.querySelector('#prompt-textarea').addEventListener('paste',event=>{
    event.preventDefault();document.execCommand('insertText',false,event.clipboardData.getData('text/plain'));
  });
  const site=(gemini?createGeminiSite:createChatGPTSite)({doc:document,win});
  let time=0;
  let view;
  const engine=createQueueEngine({site,clock:()=>time,change:()=>view?.render(site.inspect())});
  if(!fifoMode)for(let i=0;i<4;i++){engine.enqueue('完整队列正文🙂 '+i,site.inspect().route);engine.pause('q'+(i+1));}
  view=createQueueView({owner,createPageUI,assets:[],engine,trustedActions:true,actions:{
    enqueue({paused}){
      const snap=site.inspect(),taken=site.clearForQueue(snap);
      if(taken.ok)engine.enqueue(taken.text,snap.route,{paused});
    },
    pause:engine.pause,resume:engine.resume
  }});
  const replies=[],simulatedSends=[];
  let clicks=0;
  if(fifoMode)send.addEventListener('click',()=>{
    const {editor,draft}=site.inspect();
    const user=gemini?geminiUser(draft):document.createElement('p');
    const reply=gemini?geminiReply():document.createElement('p');
    if(gemini)reply.setAttribute('aria-busy','true');
    else{
      user.dataset.messageAuthorRole='user';user.textContent=draft;
      reply.dataset.messageAuthorRole='assistant';reply.dataset.talvtTurnState='in_progress';
      reply.textContent='模拟回复';
    }
    if(gemini)history.append(geminiTurn(simulatedSends.length+2,user,reply));
    else history.append(user,reply);
    simulatedSends.push(draft);replies.push(reply);editor.replaceChildren();
    send.dataset.testid='stop-button';send.setAttribute('aria-label',gemini?'Stop response':'Stop');
  });
  else send.addEventListener('click',()=>clicks++);
  const frame=()=>new Promise(requestAnimationFrame);
  const check=(value,message)=>{if(!value)throw Error(message);};
  const body=length=>{
    const unit='中文🙂 code()\n\n空行与空格 \n',n=length-4;
    return '  '+unit.repeat(Math.floor(n/unit.length))+'文'.repeat(n%unit.length)+'  ';
  };
  window.runQueueBrowserChecks=async()=>{
    const results=[],queued=engine.view().items;
    for(const text of [body(1000),body(8192),'  \u00a0开头🙂\n\n```js\nconst url = "https://example.test/a";\n```\n尾行\n']){
      const length=text.length;
      const editor=site.inspect().editor;editor.textContent='';
      check(site.restore(text,''),'contenteditable restore rejected '+length);
      await frame();
      check(site.inspect().draft===text,'contenteditable restore changed text '+length);
      const scrollport=document.querySelector('#scrollport');
      for(const width of [700,380]){
        document.querySelector('#composer-parent').style.width=width+'px';
        for(const offset of [0,scrollport.scrollHeight/2,scrollport.scrollHeight]){
          scrollport.scrollTop=offset;await frame();
          check(view.place(site.inspect()),'queue hidden at '+length+'/'+width+'/'+offset);view.render();
          check(site.inspect().draft===text,'layout changed draft');
          check(managed.every(ui=>ui.host.isConnected&&getComputedStyle(ui.host).display!=='none'),'managed UI hidden');
        }
      }
      check(JSON.stringify(engine.view().items)===JSON.stringify(queued),'layout changed queue bodies');
      const selected=site.clearForQueue(site.inspect());
      check(selected.ok&&selected.text===text,'clear lost content');await frame();
      check(site.inspect().draft==='','clear did not survive frame');
      check(site.reclaimToComposer(text,site.inspect()).ok,'takeback rejected');await frame();
      check(site.inspect().draft===text,'takeback lost content');
      results.push({length,exact:true,widths:[700,380],scrollPositions:3});
    }
    const editor=site.inspect().editor;editor.textContent='';
    editor.addEventListener('input',()=>{const replacement=editor.cloneNode();editor.replaceWith(replacement);},{once:true});
    check(site.restore(body(1000),'')===false,'detached editor incorrectly confirmed restore');
    check(site.inspect().draft==='','replacement editor must remain empty');
    check(clicks===0,'fixture unexpectedly clicked send');
    return {status:'PASS',results,detachedRestoreRejected:true,sendClicks:clicks,evidence:'real DOM fixture, no install'};
  };
  window.runQueueWaitingBrowserChecks=async()=>{
    const text='输入框有空白字符，清空后队列会自动继续';
    engine.resume('q1'); // No timers/ticks: this fixture cannot dispatch a message.
    const before=JSON.stringify(engine.view().items),results=[];
    for(const width of [700,380,320]){
      document.querySelector('#composer-parent').style.width=width+'px';
      engine.wait(text);check(view.place(site.inspect()),'waiting panel not placed');view.render();
      await frame();
      const panel=managed.find(ui=>ui.host.dataset.fixtureUi.endsWith('.list')).shadowRoot;
      const status=panel.querySelector('.sq-waiting'),box=status.getBoundingClientRect();
      check(status.getAttribute('role')==='status'&&status.textContent===text,'missing persistent wait reason');
      check(status.scrollWidth<=status.clientWidth+1,'waiting reason overflows '+width);
      check(box.height>0&&box.width>0,'waiting reason invisible');
      check(site.inspect().draft==='','feedback wrote to native composer');
      check(JSON.stringify(engine.view().items)===before,'feedback changed queue');
      results.push({width,statusWidth:box.width,statusHeight:box.height});
    }
    engine.wait('');view.render();
    check(!managed.some(ui=>ui.shadowRoot.querySelector('.sq-waiting')),'stale waiting reason');
    check(clicks===0,'waiting feedback sent a message');
    engine.wait(text);view.render();
    return {status:'PASS',results,sendClicks:clicks,evidence:'LOCAL_SOURCE_NOT_INSTALLED'};
  };
  if(fifoMode)window.fifoFixture={
    step(ms){time+=ms;engine.tick();},
    finishReply(){
      if(gemini)replies.at(-1).removeAttribute('aria-busy');
      else replies.at(-1).dataset.talvtTurnState='complete';
      send.dataset.testid='send-button';send.setAttribute('aria-label',gemini?'Send message':'Send');
    },
    state:()=>({sends:[...simulatedSends],draft:site.inspect().draft,
      items:engine.view().items.map(({text,state})=>({text,state})), reason:engine.view().reason})
  };
  window.queueFixture={
    fit:()=>view.place(site.inspect()),
    clear:()=>view.hide(),
    state:()=>({queue:engine.view().items.map(({text,state})=>({text,state})),draft:site.inspect().draft,sendClicks:clicks})
  };
  window.fixtureReady=true;
</script>
