<body>
<div id="od-watch-preview" class="viz-dotted-background">
  <div id="od-preview-meta" class="od-preview-meta">聊天交互候选 · 非正式模板 · 模拟数据</div>
  <aside id="od-sidebar" class="od-surface od-theme-shadcn" aria-label="连播助手侧栏"></aside>
</div>

<script>
/* Local interaction simulator only. No browser-extension or website APIs. */
class ContinuityModel {
  constructor() {
    this._bases = {};
    this._restored = new Set();
    this._zeroOpportunity = false;
    this.s = {};
    this._loadScenario('empty');
  }
  static copy(v) {
    if (Array.isArray(v)) return v.map(ContinuityModel.copy);
    if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, ContinuityModel.copy(x)]));
    return v;
  }
  static blank() {
    return {intro:{enabled:true,mode:'start',start:0,end:null},outro:{enabled:true,mode:'tail',tail:null,start:null,end:null},autoNext:true};
  }
  static standard() {
    return {intro:{enabled:true,mode:'start',start:0,end:90},outro:{enabled:true,mode:'tail',tail:90,start:null,end:null},autoNext:true};
  }
  copy(v) { return ContinuityModel.copy(v); }
  identity() { return `demo:星海航线|s1|e${this.s.episode}|${this.s.version}`; }
  _workIdentity() { return `demo:星海航线|s1|${this.s.version}`; }
  _notice(text, kind='info') { this.s.status=text; this.s.statusKind=kind; }
  _duration(n=this.s.episode) { return ({3:2700,4:2880,5:null})[n] ?? null; }
  _setBaseline() {
    this._draftBaseline=this.copy(this.s.draft);
    this.s.dirty=false; this.s.touched=[]; this._restored.clear();
    this.s.draftContext={identity:this.identity(),scope:this.s.scope};
  }
  _loadDraft() {
    this.s.draft=this.copy(this.s.scope==='work'?this.s.base:this.effective());
    this._setBaseline();
  }
  effective() {
    const r=this.copy(this.s.base), o=this.s.overrides[this.identity()]||{};
    for(const key of ['intro','outro','autoNext']) if(Object.prototype.hasOwnProperty.call(o,key)) r[key]=this.copy(o[key]);
    return r;
  }
  sources() {
    const o=this.s.overrides[this.identity()]||{}, r=this.effective(), result={};
    for(const k of ['intro','outro','autoNext']) {
      const hasValue=n=>n!==null&&n!==undefined&&n!=='';
      const configured=k==='autoNext'||(k==='outro'&&r.outro.mode==='tail'?hasValue(r.outro.tail):
        hasValue(r[k].end)&&(r[k].mode==='start'||hasValue(r[k].start)));
      result[k]=Object.prototype.hasOwnProperty.call(o,k)?'本集例外':
        (configured?'作品默认':'未设置');
    }
    return result;
  }
  edit(key, patch) {
    if(!['intro','outro','autoNext'].includes(key)) return false;
    if(this.s.draftContext.identity!==this.identity()||this.s.draftContext.scope!==this.s.scope) {
      this._notice('草稿属于其他内容或保存范围，请返回原内容处理。','error'); return false;
    }
    if(key==='autoNext') this.s.draft[key]=Boolean(patch);
    else this.s.draft[key]={...this.s.draft[key],...patch};
    this._restored.delete(key);
    if(!this.s.touched.includes(key)) this.s.touched.push(key);
    this.s.dirty=true; this.s.pending=null; this._zeroOpportunity=false;
    this._notice('有未保存修改；调整不会移动播放位置。');
    return true;
  }
  setMode(key,mode) {
    const r=this.s.draft[key], old=this.range(key), d=this.s.duration;
    if(key==='intro') {
      if(!['start','interval'].includes(mode)) return false;
      return this.edit(key,mode==='start'?{mode,start:0}:{mode,start:Number.isFinite(r.start)?r.start:0});
    }
    if(key==='outro') {
      if(!['tail','interval'].includes(mode)) return false;
      return this.edit(key,mode==='interval'?{mode,start:old?old[0]:r.start,end:old?old[1]:r.end}:
        {mode,tail:Number.isFinite(d)&&Number.isFinite(r.start)?d-r.start:r.tail});
    }
    return false;
  }
  range(key,rules=this.s.draft) {
    const r=rules[key]; if(!r) return null;
    let a,b;
    if(key==='intro') { a=r.mode==='start'?0:r.start; b=r.end; }
    else if(r.mode==='tail') { if(!Number.isFinite(this.s.duration)||!Number.isFinite(r.tail))return null; a=this.s.duration-r.tail;b=this.s.duration; }
    else {a=r.start;b=r.end;}
    return Number.isFinite(a)&&Number.isFinite(b)?[a,b]:null;
  }
  endpointValue(key,part,rules=this.s.draft) {
    if(!['intro','outro'].includes(key)||!['start','end'].includes(part))return null;
    const r=rules[key];
    if(key==='intro')return part==='start'&&r.mode==='start'?0:r[part];
    if(r.mode!=='tail')return r[part];
    if(!Number.isFinite(this.s.duration))return null;
    if(part==='end')return this.s.duration;
    return r.tail===null||r.tail===undefined?null:this.s.duration-r.tail;
  }
  setEndpoint(key,part,value,options={}) {
    if(!['intro','outro'].includes(key)||!['start','end'].includes(part))return false;
    const r=this.s.draft[key],d=this.s.duration;
    if(key==='intro') {
      const start=part==='start'?value:this.endpointValue(key,'start');
      const end=part==='end'?value:this.endpointValue(key,'end');
      return this.edit(key,{mode:start===0?'start':'interval',start,end});
    }
    if(part==='end') {
      const start=this.endpointValue(key,'start');
      if(Number.isFinite(d)&&value===d&&options.bindEnd!==false) {
        return this.edit(key,{mode:'tail',tail:start===null||start===undefined?null:d-start,start:null,end:null});
      }
      return this.edit(key,{mode:'interval',start,end:value});
    }
    if(r.mode==='tail') {
      if(!Number.isFinite(d)){this._notice('时长未知，片尾时间保留，待时长可用后调整。','warning');return false;}
      return this.edit(key,{tail:value===null||value===undefined?null:d-value});
    }
    return this.edit(key,{start:value});
  }
  isUnconfigured(key,rules=this.s.draft) {
    const r=rules[key],missing=n=>n===null||n===undefined||n==='';
    if(key==='intro')return missing(r.end)&&(r.mode==='start'||r.start===0||missing(r.start));
    return r.mode==='tail'?missing(r.tail):missing(r.start)&&missing(r.end);
  }
  validation(rules=this.s.draft) {
    const v={intro:[],outro:[],general:[],warnings:[],valid:true}, d=this.s.duration;
    for(const key of ['intro','outro']) {
      const r=rules[key], list=v[key], isTail=key==='outro'&&r.mode==='tail',unconfigured=this.isUnconfigured(key,rules);
      const fields=isTail?['tail']:(key==='intro'&&r.mode==='start'?['end']:['start','end']);
      if((key==='intro'&&!['start','interval'].includes(r.mode))||(key==='outro'&&!['tail','interval'].includes(r.mode)))list.push('请选择一种有效时间模式。');
      for(const f of fields) {
        const n=r[f], label=({tail:'开始时间',start:'开始时间',end:'结束时间'})[f];
        if(n===null||n===undefined||n==='') {if(r.enabled&&!unconfigured)list.push(`请设置${label}。`);continue;}
        if(f==='tail') {
          if(!Number.isFinite(n)||!Number.isInteger(n))list.push('请输入有效的开始时间。');
          else if(n<=0)list.push('开始必须早于结束。');
          else if(Number.isFinite(d)&&n>d)list.push('开始不能早于 00:00。');
          continue;
        }
        if(!Number.isFinite(n)||!Number.isInteger(n)||n<0)list.push(`${label}需要是有效的非负整秒。`);
        else if(Number.isFinite(d)&&n>d)list.push(`${label}不能超过本集时长。`);
      }
      const range=this.range(key,rules);
      if(range) {
        if(range[0]<0)list.push('开始不能早于 00:00。');
        if(range[0]>=range[1])list.push('开始必须早于结束。');
        if(Number.isFinite(d)&&range[1]>d)list.push('结束不能超过本集时长。');
        if(r.enabled&&Number.isFinite(d)&&range[0]===0&&range[1]>=d)list.push('该设置会跳过整集，请缩小范围。');
      }
      if(r.enabled&&!unconfigured&&!Number.isFinite(d))v.warnings.push(key==='outro'?'时长未知：片尾设置保留，暂不定位或执行。':'时长未知：片头设置保留，待核对可用范围。');
    }
    const i=this.range('intro',rules),o=this.range('outro',rules);
    if(rules.intro.enabled&&rules.outro.enabled&&i&&o&&i[0]<o[1]&&o[0]<i[1]) {
      v.intro.push('片头与片尾范围重叠，请调整。');v.outro.push('片尾与片头范围重叠，请调整。');
    }
    if(Number.isFinite(d)&&!v.intro.length&&!v.outro.length) {
      const active=[['intro',i],['outro',o]].filter(([key,r])=>rules[key].enabled&&r);
      const total=active.reduce((sum,[,r])=>sum+r[1]-r[0],0);
      if(total>=d)v.general.push('这些设置合计会跳过整集，请保留正片范围。');
      else if(total>=d*.8) {
        const label=active.length===2?'片头与片尾合计':active[0][0]==='intro'?'片头范围':'片尾范围';
        v.warnings.push(`演示提醒：${label}跳过本集约 ${Math.round(total/d*100)}%，请确认仍保留需要观看的内容；可以保存。`);
      }
    }
    v.valid=!v.intro.length&&!v.outro.length&&!v.general.length;
    return v;
  }
  _prospectiveEffective() {
    if(this.s.scope==='episode')return this.s.draft;
    const result=this.copy(this.s.draft),o=this.s.overrides[this.identity()]||{};
    for(const k of ['intro','outro','autoNext'])if(Object.prototype.hasOwnProperty.call(o,k))result[k]=this.copy(o[k]);
    return result;
  }
  save() {
    const v=this.validation(), e=this.validation(this._prospectiveEffective());
    if(!v.valid||!e.valid) {this._notice(!v.valid?'请先修正时间设置。':'作品默认与本集例外发生冲突，请先检查本集设置。','error');return false;}
    if(this.s.draftContext.identity!==this.identity()||this.s.draftContext.scope!==this.s.scope){this._notice('原草稿身份已改变，不能保存到当前内容。','error');return false;}
    if(!this.s.dirty){this.s.transition=null;return true;}
    if(this.s.scope==='work') {
      this.s.base=this.copy(this.s.draft);this._bases[this._workIdentity()]=this.copy(this.s.base);
    } else {
      const o={...(this.s.overrides[this.identity()]||{})};
      for(const k of this.s.touched) {if(this._restored.has(k))delete o[k];else o[k]=this.copy(this.s.draft[k]);}
      if(Object.keys(o).length)this.s.overrides[this.identity()]=o;else delete this.s.overrides[this.identity()];
    }
    this.s.ruleRevision++;this.s.pending=null;this.s.transition=null;this._zeroOpportunity=false;this._loadDraft();
    this._notice((this.s.scope==='work'?'已保存本作品当前季设置':'已保存本集例外')+'；播放位置不变，不补跳。','ok');
    return true;
  }
  cancel() { this._loadDraft();this.s.pending=null;this.s.transition=null;this._zeroOpportunity=false;this._notice('已取消修改，原有规则与本次手动查看豁免保留。');return true; }
  restore(key) {
    if(this.s.scope!=='episode'||!['intro','outro','autoNext'].includes(key))return false;
    this.s.draft[key]=this.copy(this.s.base[key]);this._restored.add(key);
    if(!this.s.touched.includes(key))this.s.touched.push(key);
    this.s.dirty=true;this.s.pending=null;this._zeroOpportunity=false;
    this._notice('保存后，该项目恢复继承作品默认。');return true;
  }
  _request(kind,target) {
    this.s.pending=null;
    if(this.s.dirty){this.s.transition={kind,target};this._notice('有未保存修改，请选择继续编辑或舍弃后切换。','warning');return false;}
    return this._transition(kind,target);
  }
  requestScope(scope){if(!['work','episode'].includes(scope)||scope===this.s.scope)return true;return this._request('scope',scope);}
  requestEpisode(n){n=Number(n);if(![3,4,5].includes(n))return false;if(n===this.s.episode)return true;return this._request('episode',n);}
  requestVersion(){return this._request('version',this.s.version==='标准版 A'?'版本 B':'标准版 A');}
  resolveTransition(action) {
    const t=this.s.transition;if(!t)return false;
    this.s.transition=null;
    if(action==='stay'){this._notice('保留草稿，继续在原内容与范围编辑。');return true;}
    if(action!=='discard')return false;

 all(`[data-time-key="${key}"]`).forEach(el=>{if(el!==origin)el.value=disabled?'':inputValue(key,el.dataset.timePart);el.disabled=disabled;el.setAttribute('placeholder',disabled?'—':'分:秒');el.setAttribute('aria-label',fieldAria(key,el.dataset.timePart));});
 all(`[data-interval-key="${key}"]`).forEach(el=>{const part=el.dataset.endpoint,n=value(key,part),set=Number.isFinite(n)&&!disabled;el.min=w[0];el.max=w[1];if(el!==origin)el.value=set?n:part==='start'?w[0]:w[1];el.disabled=disabled;el.classList.toggle('od-empty',!set);el.setAttribute('aria-valuetext',disabled?'时长未知':set?fmt(n):'未设置，拖动建立端点');});
 const fill=q('#od-dual-fill-'+key);if(fill){fill.style.left=(valid?pct(a):0)+'%';fill.style.width=(valid?Math.max(0,pct(b)-pct(a)):0)+'%';}
 const windowTag=q('#od-window-label-'+key);if(windowTag)windowTag.textContent=windowLabel(key);
 const label=q('#od-label-'+key+'-end');if(label)label.textContent=endpointLabel(key,'end');
 const toggle=q('#od-toggle-'+key);if(toggle)toggle.checked=model.s.draft[key].enabled;
 syncErrors();syncCalibration();syncSave();
}
function render(keepFocus=true){const old=document.activeElement,id=old&&root.contains(old)?old.id:null;let selection=null;try{selection=[old.selectionStart,old.selectionEnd];}catch(e){}ui.rendering=true;q('#od-sidebar').innerHTML=sidebarHTML();syncErrors();syncCalibration();syncSave();if(keepFocus&&id){let el=q('#'+id);if(!el||el.disabled)el=q('#od-scope-switch')||q('#od-open');if(el){el.focus({preventScroll:true});if(el.id===id&&selection&&selection[0]!==null&&el.setSelectionRange)try{el.setSelectionRange(selection[0],selection[1]);}catch(e){}}}ui.rendering=false;}
function resetUI(){ui.selected={intro:'end',outro:'start'};ui.calibrating=null;ui.more=false;ui.raw={};ui.windows={};ui.savedContext=null;}
function take(fn){const id=model.identity(),sc=model.s.scenario,scope=model.s.scope;fn();if(id!==model.identity()||sc!==model.s.scenario)resetUI();else if(scope!==model.s.scope){ui.raw={};ui.windows={};ui.savedContext=null;}render();}
function selectPoint(key,part){ui.selected[key]=part;syncCalibration();}
function commitInput(el){const key=el.dataset.timeKey;if(!key)return;const part=el.dataset.timePart;if(Number.isFinite(value(key,part))){clearRaw(key,part);el.value=inputValue(key,part);}windowFor(key,true);syncRow(key,el);}
root.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;const action=b.dataset.action,key=b.dataset.key;


 if(action==='target'){selectPoint(key,b.dataset.part);return;}
 if(action==='save'){take(()=>{const c=contextKey();if(model.save()){ui.savedContext=c;ui.raw={};}});return;}
 if(action==='scope'){take(()=>model.requestScope(model.s.scope==='work'?'episode':'work'));return;}
 if(action==='cancel'){ui.raw={};ui.windows={};take(()=>model.cancel());return;}
 if(action==='mark'){clearRaw(key,ui.selected[key]);take(()=>model.mark(key,ui.selected[key]));windowFor(key,true);syncRow(key);return;}
 if(action==='preview'){take(()=>model.preview(key,ui.selected[key]));return;}
 if(action==='restore'){clearRaw(key);ui.windows={};take(()=>model.restore(key));return;}
 if(action==='adjust-episode'){take(()=>model.requestScope('episode'));return;}
 if(action==='return'){take(()=>model.returnPosition());return;}
 if(action==='undo'){take(()=>model.undoSkip());return;}
 if(action==='resume-auto'){take(()=>model.resumeAutomatic());return;}
 if(action==='close'){take(()=>model.closePanel());return;}
 if(action==='open'){take(()=>model.openPanel());return;}
 if(action==='stay'){take(()=>model.resolveTransition('stay'));return;}
 if(action==='discard'){ui.raw={};ui.windows={};take(()=>model.resolveTransition('discard'));return;}
});
root.addEventListener('input',event=>{
 const el=event.target;if(el.disabled)return;
 if(el.dataset.timeKey){const key=el.dataset.timeKey,part=el.dataset.timePart;ui.raw[el.id]=el.value;setEndpoint(key,part,parseTime(el.value));ui.savedContext=null;selectPoint(key,part);syncRow(key,el);return;}
 if(el.dataset.intervalKey){const key=el.dataset.intervalKey,part=el.dataset.endpoint,intended=Number(el.value),n=constrainHandle(key,part,intended);if(n===null){el.value=Number.isFinite(value(key,part))?value(key,part):windowFor(key)[part==='start'?0:1];return;}el.value=n;setEndpoint(key,part,n,intended);clearRaw(key,part);ui.savedContext=null;selectPoint(key,part);syncRow(key,el);}
});
root.addEventListener('change',event=>{
 const el=event.target;if(el.disabled)return;
 if(el.dataset.toggle){const key=el.dataset.toggle;ui.savedContext=null;take(()=>model.edit(key,key==='autoNext'?el.checked:{enabled:el.checked}));}
 else if(el.dataset.timeKey)commitInput(el);
});
root.addEventListener('focusin',event=>{if(ui.rendering)return;const el=event.target,key=el.dataset.timeKey||el.dataset.intervalKey;if(key)selectPoint(key,el.dataset.timePart||el.dataset.endpoint);});
root.addEventListener('pointerdown',event=>{const el=event.target;if(el.dataset.intervalKey&&!el.disabled){ui.dragging=el.dataset.intervalKey;selectPoint(el.dataset.intervalKey,el.dataset.endpoint);}});
root.addEventListener('pointerup',()=>{ui.dragging=null;});
root.addEventListener('keydown',event=>{
 const el=event.target,key=el.dataset.timeKey||el.dataset.intervalKey;if(!key||el.disabled)return;
 if(event.key==='Enter'&&el.dataset.timeKey){event.preventDefault();commitInput(el);return;}
 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)||(el.dataset.timeKey&&['ArrowLeft','ArrowRight'].includes(event.key)))return;
 event.preventDefault();const part=el.dataset.timePart||el.dataset.endpoint,step=['ArrowUp','ArrowRight'].includes(event.key)?1:-1,w=windowFor(key),base=Number.isFinite(value(key,part))?value(key,part):part==='start'?w[0]:w[1],intended=Math.max(0,base+step);let n=intended;
 if(el.dataset.intervalKey){n=constrainHandle(key,part,n);if(n===null)return;el.value=n;}
 setEndpoint(key,part,n,intended);clearRaw(key,part);ui.savedContext=null;selectPoint(key,part);if(el.dataset.timeKey)windowFor(key,true);syncRow(key);
});
root.preview={model,ui,render,parseTime,formatTime:fmt,commitInput,windowFor};
render(false);
})();

</script>
</body>
