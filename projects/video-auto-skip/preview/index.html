/* Shared offline design primitives — no external packages, no native app shell.
   Scoped to the original preview, attached after original CSS. */
html,body{color-scheme:light;background:#f4f6fa}
#od-watch-preview {
  color-scheme:light;
  --ui-ink:#1c2d49;--ui-sub:#6b7b93;--ui-accent:#365ed9;--ui-paper:#fff;
  --ui-line:#dfe5ef;--ui-focus:#4669dc;--ui-bad:#b8324a;
  --od-bg:#fff;--od-text:var(--ui-ink);--od-muted:var(--ui-sub);
  --od-line:var(--ui-line);--od-soft:#f5f8fc;--od-accent:var(--ui-accent);
  --od-on-accent:#fff;--od-error:var(--ui-bad);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#od-watch-preview .od-preview-meta{font-size:11px;margin-bottom:9px;padding:0;letter-spacing:0}
#od-watch-preview .od-sidebar{background:var(--ui-paper);border-color:var(--ui-line);box-shadow:0 12px 32px #2034580d;isolation:isolate}
#od-watch-preview .od-identity-row{min-height:24px;gap:8px;align-items:center}
#od-watch-preview .od-work{font-weight:550;letter-spacing:-.01em;line-height:1.45;font-size:12px}
#od-watch-preview .od-rows{gap:0}
#od-watch-preview .od-row-title{min-height:27px;gap:5px}
#od-watch-preview .od-row-title>label:first-child{font-size:14px;line-height:1.2;font-weight:650;color:var(--ui-ink);white-space:nowrap}
#od-watch-preview .od-window-label{font-size:10px;color:var(--ui-sub);flex:1;line-height:1.1}
#od-watch-preview .od-exception{font-size:10px}
#od-watch-preview .od-toggle-couple{display:inline-flex;align-items:center;gap:5px;min-height:30px;cursor:pointer;user-select:none;flex:none}
#od-watch-preview .od-toggle-copy{font-size:12px;color:var(--ui-sub);white-space:nowrap;font-weight:520;line-height:1}
#od-watch-preview .od-toggle-couple:hover .od-toggle-copy{color:var(--ui-ink)}
#od-watch-preview .od-toggle-couple:focus-within .od-toggle-copy{color:var(--ui-accent)}
#od-watch-preview .od-switch{width:34px;height:30px;flex:0 0 34px}
#od-watch-preview .od-switch input{width:32px;height:18px;background:#c6cfde;border:1px solid #bdc7d7;border-radius:12px;cursor:pointer;position:relative}
#od-watch-preview .od-switch input:before{top:2px;left:2px;width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:0 1px 2px #13243b35;transition:transform .12s}
#od-watch-preview .od-switch input:checked{background:var(--ui-accent);border-color:var(--ui-accent)}
#od-watch-preview .od-switch input:checked:before{transform:translateX(14px);background:#fff}
#od-watch-preview .od-switch input:focus-visible{outline:2px solid #6592ff;outline-offset:3px}
/* Exactly one *visual* time source: values in editable input boxes.
   Track shows geometry only, with no text, tick values, S/E letters, tooltips, or duplicates. */
#od-watch-preview .od-dual-track{height:36px;position:relative;margin:2px 9px 0;overflow:visible}
#od-watch-preview .od-dual-line,#od-watch-preview .od-dual-fill{
  position:absolute;top:18px;height:4px;border-radius:999px;pointer-events:none;
}
#od-watch-preview .od-dual-line{left:0;right:0;background:#dce4f0}
#od-watch-preview .od-dual-fill{background:#9db8fa}
#od-watch-preview .od-dual-track.od-inverted .od-dual-line{background:#f1cbd3}
#od-watch-preview .od-dual-range{top:2px;height:36px;left:-9px;width:calc(100% + 18px);pointer-events:none;z-index:2;}
#od-watch-preview .od-dual-range.od-active-point{z-index:3}
#od-watch-preview .od-dual-range::-webkit-slider-runnable-track{height:4px;background:transparent;border:0}
#od-watch-preview .od-dual-range::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;width:18px;height:18px;box-sizing:border-box;
  border:2px solid var(--ui-accent);border-radius:50%;background:var(--ui-accent);
  margin-top:-7px;pointer-events:auto;cursor:ew-resize;
  box-shadow:0 0 0 2px var(--ui-paper),0 1px 3px #102b5660;
}
#od-watch-preview .od-dual-range::-moz-range-track{height:4px;background:transparent;border:0}
#od-watch-preview .od-dual-range::-moz-range-thumb{
  width:14px;height:14px;box-sizing:content-box;border:2px solid var(--ui-accent);
  border-radius:50%;background:var(--ui-accent);pointer-events:auto;cursor:ew-resize;
  box-shadow:0 0 0 2px var(--ui-paper),0 1px 3px #102b5660;
}
/* Equal round thumb silhouettes; solid = set, hollow = unset. Start/end subtly color-linked to fields. */
#od-watch-preview .od-dual-range[data-endpoint=start]::-webkit-slider-thumb{border-color:#4066ce;background:#4066ce}
#od-watch-preview .od-dual-range[data-endpoint=start]::-moz-range-thumb{border-color:#4066ce;background:#4066ce}
#od-watch-preview .od-dual-range[data-endpoint=end]::-webkit-slider-thumb{border-color:#147fa6;background:#147fa6;border-radius:50%}
#od-watch-preview .od-dual-range[data-endpoint=end]::-moz-range-thumb{border-color:#147fa6;background:#147fa6;border-radius:50%}
#od-watch-preview .od-dual-range.od-empty::-webkit-slider-thumb{background:var(--ui-paper);border-color:#8391a7}
#od-watch-preview .od-dual-range.od-empty::-moz-range-thumb{background:var(--ui-paper);border-color:#8391a7}
#od-watch-preview .od-dual-range.od-active-point:not(.od-empty)::-webkit-slider-thumb{
 box-shadow:0 0 0 2px var(--ui-paper),0 0 0 5px #b9cbff,0 1px 3px #1f387150}
#od-watch-preview .od-dual-range.od-active-point:not(.od-empty)::-moz-range-thumb{
 box-shadow:0 0 0 2px var(--ui-paper),0 0 0 5px #b9cbff,0 1px 3px #1f387150}
#od-watch-preview .od-dual-range:focus-visible{outline:0}
#od-watch-preview .od-dual-range:focus-visible::-webkit-slider-thumb{
 outline:2px solid var(--ui-focus);outline-offset:5px}
#od-watch-preview .od-dual-range:focus-visible::-moz-range-thumb{
 outline:2px solid var(--ui-focus);outline-offset:5px}
#od-watch-preview .od-dual-range:disabled{opacity:.48}
/* Near or crossed thumbs: stagger vertical hit targets rather than cover either thumb. */
#od-watch-preview .od-dual-track.od-near{height:54px}

#od-watch-preview .od-dual-track.od-near .od-dual-range[data-endpoint=end]::-moz-range-thumb{transform:translateY(12px)}

#od-watch-preview .od-endpoint-readouts label.od-time-field{

#od-watch-preview .od-r10-reason{margin:0 0 6px;color:#536a88;}
#od-watch-preview .od-r10-compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin:0 0 7px;}
#od-watch-preview .od-r10-compare>div{min-width:0;padding:6px;background:white;border:1px solid #e7ecf4;border-radius:6px;}
#od-watch-preview .od-r10-compare dt{color:#718198;font-size:10px;margin:0 0 2px;}
#od-watch-preview .od-r10-compare dd{margin:0;color:#253d5c;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;font-weight:600;}
#od-watch-preview .od-r10-meta{margin:0 0 6px;font-size:10px;color:#6b7b91;}
#od-watch-preview .od-r10-actions{display:flex;gap:5px;flex-wrap:wrap;}
#od-watch-preview .od-r10-actions button{min-height:29px;padding:4px 8px;border-radius:6px;font-size:11px;flex:0 1 auto;max-width:100%;white-space:normal;}
#od-watch-preview .od-r10-actions .od-r10-confirm{border-color:#b9caed;background:#f0f5ff;color:#2d518f;}
@media(max-width:340px){
 #od-watch-preview .od-r10-compare{gap:4px;}
 #od-watch-preview .od-r10-review{padding:7px 6px;}
 #od-watch-preview .od-r10-actions button{padding:4px 6px;}
}

function r10LayoutChecks(){
