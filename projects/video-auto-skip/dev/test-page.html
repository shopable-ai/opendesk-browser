<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连播助手 · 本地真实视频测试 · 第 __EPISODE__ 集</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222;background:#f6f7f9}
    *{box-sizing:border-box}
    body{max-width:800px;margin:24px auto;padding:0 18px}
    h1{font-size:22px;margin:0 0 8px}
    p{color:#555;line-height:1.55;margin:8px 0 16px}
    main{background:white;padding:20px;border:1px solid #ddd;border-radius:12px}
    video{display:block;width:100%;max-height:440px;background:#171923;border-radius:8px}
    nav,.controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:14px 0}
    a,button{font:inherit}
    nav a,.controls a,button{border:1px solid #bbb;background:#fff;border-radius:7px;padding:7px 12px;color:#222;text-decoration:none;cursor:pointer}
    nav a[aria-current="page"]{background:#1f2937;color:white;border-color:#1f2937}
    button:hover,a[href]:hover{border-color:#555}
    a:not([href]){color:#888;cursor:default}
    label{display:inline-flex;align-items:center;gap:7px}
    h2{font-size:16px;margin:20px 0 8px}
    dl{display:grid;grid-template-columns:max-content 1fr;gap:7px 14px;font-size:14px;margin:0}
    dt{color:#666}
    dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
    #event-log{background:#f7f8fa;border:1px solid #eee;border-radius:7px;padding:11px 14px;min-height:95px;white-space:pre-wrap;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}
    .hint{font-size:13px;color:#666}
    @media (max-width:540px){main{padding:12px}body{margin:10px auto}dl{grid-template-columns:1fr;gap:3px}dt{margin-top:8px}}
  </style>
</head>
<body>
<main data-od-series="dev-video-lab" data-od-title="连播助手本地测试剧"
      data-od-season="1" data-od-episode="__EPISODE__" data-od-order="__EPISODE__" data-od-line="__LINE__">
  <h1>连播助手 · 本地视频联调</h1>
  <p>第 __EPISODE__ 集 · __LINE__ · 原生播放器。自动跳过、保存和连播由真实扩展执行，本页只提供媒体与观察信息。</p>
  <video data-od-feature controls playsinline muted preload="auto"
         src="/video-auto-skip-fixture/media/__CLIP__.webm" width="640" height="360"></video>
  <nav data-od-playlist-complete aria-label="测试选集">
    <a href="/video-auto-skip-fixture/ep-1" data-od-episode="1" data-od-order="1" data-od-line="primary">第 1 集 · 60 秒</a>
    <a href="/video-auto-skip-fixture/ep-2" data-od-episode="2" data-od-order="2" data-od-line="primary">第 2 集 · 60 秒</a>
    <a href="/video-auto-skip-fixture/ep-3" data-od-episode="3" data-od-order="3" data-od-line="primary">第 3 集 · 75 秒</a>
  </nav>
  <div class="controls">
    <a id="manual-next">手动下一集</a>
    <button type="button" id="from-start">从头播放</button>
    <button type="button" id="before-tail">定位到结尾前 8 秒</button>
    <button type="button" id="reload-media">重载当前视频</button>
    <button type="button" id="swap-source">同节点换源（60/75 秒）</button>
  </div>
  <label><input type="checkbox" id="play-after-next"> 下一集到达后由测试网站尝试播放</label>
  <p class="hint">定位按钮属于手动操作。要重测首次自动跳过，请刷新页面；「最后 5 秒」规则可先定位到结尾前 8 秒，再正常播放。</p>
  <h2>实际媒体状态</h2>
  <dl>
    <dt>当前集</dt><dd id="episode-state">第 __EPISODE__ 集</dd>
    <dt>实际时长 / 进度</dt><dd id="video-time">等待加载</dd>
    <dt>播放状态</dt><dd id="video-state">加载中</dd>
    <dt>下一集导航请求 / 已到达</dt><dd id="navigation-count">0 / 0</dd>
    <dt>扩展规则及命中</dt><dd>未接通：请在正式侧栏核对；本页不读取扩展私有状态</dd>
  </dl>
  <h2>事件日志 <button type="button" id="clear-log">清空本次日志</button></h2>
  <div id="event-log" role="log" aria-live="off"></div>
</main>
<script>
(() => {
  "use strict";
  const root = document.querySelector("main");
  const video = root.querySelector("video[data-od-feature]");
  const episode = Number(root.dataset.odOrder);
  const prefix = "/video-auto-skip-fixture";
  const key = "od.video-auto-skip.dev-test.r1";
  const defaultSrc = video.getAttribute("src");
  const otherSrc = prefix + "/media/" + (episode === 3 ? "one" : "three") + ".webm";
  const nType = performance.getEntriesByType("navigation")[0]?.type;
  const blank = () => ({requests: 0, arrivals: 0, events: [], pending: null, autoPlay: false});
  let store = blank();
  try {
    const previous = JSON.parse(sessionStorage.getItem(key));
    if (previous && typeof previous === "object") {
      store.requests = Number.isSafeInteger(previous.requests) && previous.requests >= 0 ? previous.requests : 0;
      store.arrivals = Number.isSafeInteger(previous.arrivals) && previous.arrivals >= 0 ? previous.arrivals : 0;
      store.events = Array.isArray(previous.events) ? previous.events.filter(item => typeof item === "string").slice(-12) : [];
      store.pending = previous.pending ?? null;
      store.autoPlay = previous.autoPlay === true;
    }
  } catch { /* Session storage is optional diagnostic data. */ }
  const save = () => { try { sessionStorage.setItem(key, JSON.stringify(store)); } catch { /* Read-only fallback. */ } };
  const time = value => Number.isFinite(value) ? value.toFixed(3) + "s" : "未知";
  const count = document.querySelector("#navigation-count");
  const logBox = document.querySelector("#event-log");
  const mediaTime = document.querySelector("#video-time");
  const mediaState = document.querySelector("#video-state");
  const autoplay = document.querySelector("#play-after-next");
  const showCounts = () => { count.textContent = String(store.requests) + " / " + String(store.arrivals) + "（包含手动导航，不表示扩展成功）"; };
  const log = text => {
    store.events.push(new Date().toLocaleTimeString("zh-CN", {hour12: false}) + " " + text);
    store.events = store.events.slice(-12);
    logBox.textContent = store.events.join("\n");
    save();
  };
  let startedFromNext = false;
  const prior = store.pending;
  if (prior && nType === "navigate" && prior.to === episode && prior.from === episode - 1 &&
      Date.now() - prior.at < 60000 && document.referrer.startsWith(location.origin + prefix + "/ep-")) {
    store.arrivals++;
    startedFromNext = true;
  }
  store.pending = null;
  save();
  showCounts();
  logBox.textContent = store.events.join("\n");
  if (startedFromNext) log("已到达第 " + episode + " 集（仅为页面导航回执，尚未证明起播）");
  const update = () => {
    mediaTime.textContent = time(video.duration) + " / " + time(video.currentTime);
    mediaState.textContent = video.error ? "错误 " + video.error.code :
      video.networkState === HTMLMediaElement.NETWORK_NO_SOURCE ? "无媒体源" :
      video.ended ? "播放结束" : video.seeking ? "正在定位" :
      video.readyState === 0 ? "加载中" : video.paused ? "已暂停" : "播放中";
  };
  update();
  root.querySelectorAll("nav a").forEach(link => {
    if (Number(link.dataset.odOrder) === episode) link.setAttribute("aria-current", "page");
  });
  const manualNext = document.querySelector("#manual-next");
  if (episode < 3) manualNext.href = prefix + "/ep-" + (episode + 1);
  else { manualNext.removeAttribute("href"); manualNext.textContent = "已是最后一集"; }
  function observeNavigation(destination) {
    let url;
    try { url = new URL(destination, location.href); } catch { return; }
    const match = /^\/video-auto-skip-fixture\/ep-([1-3])$/.exec(url.pathname);
    if (!match || url.origin !== location.origin || url.search || url.hash || Number(match[1]) !== episode + 1) return;
    store.requests++;
    store.pending = {from: episode, to: episode + 1, at: Date.now()};
    save();
    showCounts();
    log("下一集导航请求：第 " + episode + " → 第 " + (episode + 1) + " 集（触发方未知）");
  }
  if (window.navigation?.addEventListener) {
    window.navigation.addEventListener("navigate", event => observeNavigation(event.destination.url));
  } else {
    root.querySelectorAll("a[href]").forEach(link =>
      link.addEventListener("click", () => observeNavigation(link.href)));
  }
  autoplay.checked = store.autoPlay;
  let arrivalPlayRequested = false;
  const maybePlayAfterArrival = () => {
    if (arrivalPlayRequested || !startedFromNext || !store.autoPlay ||
        video.readyState < HTMLMediaElement.HAVE_METADATA) return;
    arrivalPlayRequested = true;
    startedFromNext = false;
    setTimeout(() => {
      video.play().then(() => log("网站自动起播已获浏览器接受"),
        error => log("网站自动起播失败：" + error.name));
    }, 800);
  };
  autoplay.addEventListener("change", () => { store.autoPlay = autoplay.checked; save(); maybePlayAfterArrival(); });
  const events = ["loadstart", "loadedmetadata", "durationchange", "play", "playing", "pause", "seeking", "seeked", "ended", "error", "emptied"];
  let previousPosition = 0;
  let originOfSeek = null;
  for (const name of events) video.addEventListener(name, () => {
    if (name === "seeking") originOfSeek = previousPosition;
    if (name === "seeked") {
      log("seeked " + time(originOfSeek) + " → " + time(video.currentTime) + "（原因待侧栏确认）");
      originOfSeek = null;
    } else if (name === "error") log("error code=" + (video.error?.code ?? "未知"));
    else if (name !== "durationchange") log(name + " @ " + time(video.currentTime) + " D=" + time(video.duration));
    update();
    if (name === "loadedmetadata") maybePlayAfterArrival();
  });
  video.addEventListener("timeupdate", () => { previousPosition = video.currentTime; update(); });
  const play = () => video.play().catch(error => log("播放失败：" + error.name));
  document.querySelector("#from-start").addEventListener("click", () => {
    video.currentTime = 0;
    log("用户从头播放；已跳过区间中的手动回看仍应受扩展保护");
    void play();
  });
  document.querySelector("#before-tail").addEventListener("click", () => {
    if (!Number.isFinite(video.duration) || video.duration <= 8) { log("真实时长尚未可用，未定位"); return; }
    video.pause();
    video.currentTime = video.duration - 8;
    log("用户定位到距真实结尾 8 秒；请手动播放跨越片尾规则起点");
  });
  document.querySelector("#reload-media").addEventListener("click", () => {
    video.load();
    log("用户重载当前 video 元素（不重载文档）");
  });
  let swapped = false;
  document.querySelector("#swap-source").addEventListener("click", () => {
    swapped = !swapped;
    video.src = swapped ? otherSrc : defaultSrc;
    video.load();
    log("同一个 video 换源，等待实际 loadedmetadata；作品和集数不变");
  });
  document.querySelector("#clear-log").addEventListener("click", () => {
    store.events = [];
    save();
    logBox.textContent = "";
  });
  // Fast local media may load metadata before the inline listener is attached.
  maybePlayAfterArrival();
})();
</script>
</body>
</html>
