<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频会员 · 交互预览（演示）</title><link rel="stylesheet" href="../src/style.css">
<style>body{margin:0;background:#e8edf4;color:#1d2b44;font:13px system-ui,sans-serif}.fixture{max-width:440px;min-width:280px;margin:20px auto;background:#f8fafc;border-radius:16px;box-shadow:0 16px 50px rgba(22,43,76,.15);overflow:hidden}.fixture-controls{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px;background:#e7edf6}.fixture-controls strong{margin-right:auto}.fixture-controls button{border:1px solid #c4d0e0;background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}.fixture-controls button[aria-pressed=true]{background:#365eda;color:#fff}.fixture-note{color:#53647e;padding:0 12px 12px;margin:0;font-size:11px}@media(max-width:470px){.fixture{margin:0;min-height:100vh;border-radius:0}}@media(prefers-color-scheme:dark){body{background:#131a25}.fixture{background:#1e293b;color:#e9eef7}.fixture-controls{background:#26354a}.fixture-note{color:#b5c6db}}</style>
</head><body><div class="fixture"><div class="fixture-controls"><strong>视频会员 · 交互预览</strong><button data-demo="tencent" aria-pressed="true">视频页</button><button data-demo="unknown" aria-pressed="false">非视频页</button><button data-demo="error" aria-pressed="false">读取异常</button></div>
<div id="tool-root"><main class="vp" aria-label="视频会员">
  <section class="vp-current">
    <div class="vp-topline"><span class="vp-eyebrow">当前视频网页</span><button id="vp-refresh" class="vp-icon" type="button" title="重新识别" aria-label="重新识别">↻</button></div>
    <strong id="vp-title" class="vp-title">正在识别…</strong>
    <div class="vp-subline"><span id="vp-provider" class="vp-pill">待检测</span><span id="vp-page-state">读取当前网页</span></div>
    <div class="vp-actions"><a id="vp-open" class="vp-primary" href="#" target="_blank" rel="noopener noreferrer" hidden>原站观看 ↗</a><button id="vp-copy" class="vp-secondary" type="button" disabled>分享影片链接</button></div>
    <label id="vp-manual-wrap" class="vp-manual" hidden>手动复制链接<input id="vp-manual" readonly aria-label="手动复制的视频网页链接"></label>
  </section>
  <nav class="vp-tabs" aria-label="功能切换"><button type="button" data-vp-tab="watch" aria-pressed="true">观看</button><button type="button" data-vp-tab="member" aria-pressed="false">会员</button></nav>
  <section id="vp-watch" class="vp-section" aria-label="观看与异常处理">
    <div class="vp-section-title">观看路径<span>不接管原播放器</span></div>
    <div class="vp-route"><span class="vp-route-icon">▶</span><div><strong>原站官方播放器</strong><small>沿用自己的登录及订阅</small></div><span id="vp-route-state" class="vp-route-state">待识别</span></div>
    <div class="vp-route vp-muted"><span class="vp-route-icon">◇</span><div><strong>授权备用播放服务</strong><small>需版权方或服务方许可</small></div><span class="vp-route-state">未接入</span></div>
    <details class="vp-help"><summary>播放异常？</summary><p>检查网络、原平台登录及会员权益；可在原站重新打开。暂不提供 DRM 绕过或第三方盗播来源。</p><button id="vp-recheck" class="vp-secondary" type="button">重新检查网页</button></details>
  </section>
  <section id="vp-member" class="vp-section" aria-label="会员管理" hidden>
    <div class="vp-section-title">我的会员记录<span>仅保存于本机</span></div>
    <form id="vp-member-form" class="vp-form">
      <label>视频网站<select id="vp-member-provider"><option value="tencent">腾讯视频</option><option value="iqiyi">爱奇艺</option><option value="youku">优酷</option><option value="mango">芒果 TV</option><option value="bilibili">哔哩哔哩</option></select></label>
      <label>到期日期<input id="vp-member-expiry" type="date" required></label>
      <button id="vp-member-save" class="vp-primary" type="submit" disabled>保存</button>
    </form>
    <div id="vp-member-list" class="vp-members" aria-live="polite">正在读取本机记录…</div>
    <div class="vp-promo"><strong>会员优惠与好友邀请</strong><p>仅接入官方或经授权合作渠道，不提供未获许可的账号池或代充服务。</p><span>合作入口 · 未开放</span></div>
  </section>
  <p id="vp-flash" class="vp-flash" role="status" aria-live="polite" hidden></p>
</main>
</div>
<p class="fixture-note">演示数据。无真实 VIP 解析、会员权益验证、备援线路或支付服务。</p></div>
<script>
(function(){
 const pages={tencent:{status:'available',title:'示例影视作品 · 第 12 集 - 腾讯视频',url:'https://v.qq.com/x/cover/sample/video.html?vid=example&utm_source=demo'},unknown:{status:'available',title:'示例网页',url:'https://example.org/learn'},error:null};
 let scenario='tencent',rows=[],etag='0'.repeat(64);
 const root=document.getElementById('tool-root');
 window.OpenDeskTool={root,request:async(operation,args={})=>{
  await Promise.resolve();
  if(operation==='currentPage.info'){if(scenario==='error')throw Error('模拟：网页访问被拒绝');return pages[scenario];}
  if(operation==='storage.get')return {value:rows,etag};
  if(operation==='storage.set'){
   if(args.ifMatch!==etag)throw Error('模拟：其他窗口修改');
   rows=structuredClone(args.value);etag=etag[0]==='0'?'1'.repeat(64):'0'.repeat(64);return {etag};
  }
  throw Error('预览未实现操作 '+operation);
 },setState:()=>{}};
 for(const button of document.querySelectorAll('[data-demo]'))button.addEventListener('click',()=>{
  scenario=button.dataset.demo;
  for(const item of document.querySelectorAll('[data-demo]'))item.setAttribute('aria-pressed',String(item===button));
  root.dispatchEvent(new Event('opendesk-page-changed'));
 });
})();
</script><script src="../src/main.js"></script></body></html>
