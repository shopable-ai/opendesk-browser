<main class="video-speed" aria-label="视频倍速控制">
  <section class="video-speed-head" aria-label="当前视频">
    <div class="video-speed-meter">
      <strong id="speed-current" aria-live="polite">—</strong>
      <span id="speed-state" role="status" aria-live="polite">正在检测当前网页…</span>
    </div>
    <button id="speed-refresh" class="speed-icon" type="button" title="重新检测视频" aria-label="重新检测视频">↻</button>
  </section>
  <div class="speed-presets" role="group" aria-label="选择播放倍速">
    <button type="button" data-speed="0.75">0.75×</button>
    <button type="button" data-speed="1">1×</button>
    <button type="button" data-speed="1.25">1.25×</button>
    <button type="button" data-speed="1.5">1.5×</button>
    <button type="button" data-speed="1.75">1.75×</button>
    <button type="button" data-speed="2">2×</button>
    <button type="button" data-speed="3">3×</button>
    <button type="button" data-speed="4">4×</button>
  </div>
  <div class="speed-adjust" role="group" aria-label="微调倍速">
    <button type="button" id="speed-minus" aria-label="减慢 0.25 倍">−</button>
    <button type="button" id="speed-reset" aria-label="恢复正常 1 倍">1×</button>
    <button type="button" id="speed-plus" aria-label="加快 0.25 倍">＋</button>
  </div>
  <p id="speed-message" role="status" aria-live="polite" hidden></p>
</main>
