<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频倍速 · OpenDesk Side Panel 交互预览</title>
<style>
*{box-sizing:border-box}html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#f4f6fa;color:#23314a}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #88a7ff;outline-offset:2px}
.workbench{max-width:1020px;margin:auto;padding:20px 16px}.titlebar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.titlebar h1{font-size:18px;margin:0 0 4px}.titlebar small,.hint{font-size:11px;color:#6a7b95}.demo-mark{font-size:11px;border:1px solid #d9e1ed;border-radius:99px;padding:6px 10px;background:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:14px;align-items:start}.stage{background:#edf1f8;border:1px solid #dbe3ee;border-radius:14px;padding:12px 9px 24px;display:flex;align-items:center;flex-direction:column;min-width:0;gap:12px}.stage-head{width:100%;display:flex;justify-content:space-between;font-size:11px;color:#667792}
.panel{--surface:#fff;--ink:#1c2b46;--sub:#6a7b94;--line:#dee5ef;--soft:#f5f7fb;--hero:#f3f6ff;--accent:#3c60d6;--selected:#3c60d6;--good:#16806c;--warn:#986a19;--bad:#b14854;--hover:#edf2ff;color:var(--ink);background:var(--surface);width:min(100%,var(--width,400px));min-width:0;border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 26px #1829421a;overflow:hidden;transition:width .18s}
.panel.dark{--surface:#182130;--ink:#edf3ff;--sub:#a7b4cb;--line:#344258;--soft:#202c3e;--hero:#223048;--accent:#9cb6ff;--selected:#526fd1;--good:#7de3c7;--warn:#f7cb7d;--bad:#fa9ba7;--hover:#2a3a54}
.host{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 14px;font-size:13px;font-weight:700}.host-mark{width:24px;height:24px;border-radius:7px;background:#395ed4;color:white;display:grid;place-items:center;font-size:14px}.tool{padding:13px;container-type:inline-size}.icon{border:0;background:transparent;color:var(--sub);width:34px;height:34px;flex:none;padding:0;border-radius:8px;font-size:24px;line-height:1}.icon:hover:not(:disabled){background:var(--hover)}.icon:disabled{opacity:.4;cursor:not-allowed}
.meter{background:linear-gradient(145deg,var(--hero),var(--surface) 90%);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.meter-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub)}.meter-actions{display:flex;align-items:center;gap:8px;margin-left:auto}.state{font-size:11px;white-space:nowrap;color:var(--good)}.state:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:middle}.state[data-kind=warn]{color:var(--warn)}.state[data-kind=bad]{color:var(--bad)}.state[data-kind=neutral]{color:var(--sub)}.meter-main{text-align:center;white-space:nowrap;line-height:1.13;min-height:80px;font-variant-numeric:tabular-nums}.rate{font-size:66px;font-weight:750;letter-spacing:-3px}.unit{font-size:26px;color:var(--sub);padding-left:5px}.meter-foot{border-top:1px solid var(--line);padding-top:8px;font-size:12px;line-height:1.5;color:var(--sub);overflow-wrap:anywhere}.meter-foot[data-kind=warn]{color:var(--warn)}.meter-foot[data-kind=bad]{color:var(--bad)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:16px 1px 8px;gap:6px}.section-title strong{font-size:12px}.section-title span{color:var(--sub);font-size:11px}.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.preset,.step{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:41px;padding:3px 0;font-size:13px;white-space:nowrap}.preset:hover:not(:disabled),.step:hover:not(:disabled){background:var(--hover);border-color:var(--accent)}.preset[aria-pressed=true]{background:var(--selected);color:#fff;border-color:var(--selected);font-weight:700}.preset[data-pending=true]{background:var(--hero);color:var(--accent);border:1px dashed var(--accent)}.preset:disabled,.step:disabled{opacity:.4;cursor:not-allowed}.adjust{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}.step{font-size:22px}.adjust-hint{display:grid;place-items:center;border-radius:8px;background:var(--soft);font-size:12px;color:var(--sub)}
.shortcuts{margin-top:17px;border:1px solid var(--line);border-radius:12px;padding:11px 12px}.short-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:650}.toggle{width:40px;height:23px;border-radius:20px;border:0;padding:3px;background:var(--line)}.toggle:before{content:"";display:block;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .15s}.toggle[aria-checked=true]{background:#385fdb}.toggle[aria-checked=true]:before{transform:translateX(17px)}.keys{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;font-size:11px;color:var(--sub)}.keys.off{opacity:.43}kbd{font:650 11px ui-monospace,monospace;min-width:21px;height:21px;padding:1px 5px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;display:inline-flex;justify-content:center;align-items:center;margin-right:4px}.footer{margin-top:12px;text-align:center;font-size:10px;color:var(--sub)}
.lab{background:#fff;border:1px solid #dfe5ee;border-radius:12px;padding:13px}.lab h2{font-size:13px;margin:0 0 16px}.lab-group{margin-bottom:15px}.lab label{display:block;font-size:11px;font-weight:700;margin-bottom:7px}.widths{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.widths button,.themes button,.keys-try button{background:transparent;border:1px solid #dfe5ee;border-radius:7px;min-height:34px;color:#5c6b83}.widths button{font-size:10px;padding:0}.themes{display:grid;grid-template-columns:1fr 1fr;gap:5px}.themes button{font-size:11px}.widths [aria-pressed=true],.themes [aria-pressed=true]{background:#eef2ff;border-color:#6989ea;color:#365bd6;font-weight:700}.lab select{width:100%;border:1px solid #dfe5ee;border-radius:8px;min-height:37px;padding:4px;background:#fff;color:#24324a;font-size:11px}.keys-try{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.keys-try button{font-size:11px}.result{border-top:1px solid #e4e9f1;padding-top:10px;color:#586984;font-size:11px;line-height:1.5}
@container(max-width:245px){.meter{padding:9px}.meter-head{flex-wrap:wrap}.meter-main{min-height:50px}.rate{font-size:clamp(27px,17cqw,43px);letter-spacing:-1px}.unit{font-size:16px}.presets{grid-template-columns:repeat(2,minmax(0,1fr))}.preset,.step{min-height:35px}.adjust{grid-template-columns:35px minmax(0,1fr) 35px;gap:4px}.adjust-hint{font-size:10px}}
@media(max-width:720px){.layout{grid-template-columns:1fr}.stage{padding:10px 6px}.lab{max-width:520px;width:100%}.demo-mark{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="workbench">
<div class="titlebar"><div><h1>视频倍速 · Side Panel</h1><small>交互设计预览 · 页面状态全部为模拟，不会访问 Chrome 或视频网站</small></div><span class="demo-mark">UI R1.2</span></div>
<div class="layout">
<div class="stage"><div class="stage-head"><span>● 侧边栏预览</span><span id="width-label">400 CSS px</span></div>
<section class="panel" id="panel" style="--width:400px" aria-label="视频倍速应用">
<header class="host"><span class="host-mark">▶</span><span>视频倍速</span></header>
<div class="tool">
<section class="meter" aria-label="当前实际倍速"><div class="meter-head"><span>当前实际倍速</span><div class="meter-actions"><span class="state" id="state">已读回</span><button class="icon" id="refresh" type="button" title="重新检测视频" aria-label="重新检测视频">↻</button></div></div><div class="meter-main"><span id="actual" class="rate" role="status" aria-live="polite">1.00</span><span id="unit" class="unit">×</span></div><div class="meter-foot" id="message" role="status" aria-live="polite">✓ 已读取网页当前播放速度</div></section>
<div class="section-title"><strong>播放速度</strong><span>点击立即设置</span></div>
<div class="presets" role="group" aria-label="倍速预设"><button class="preset" data-speed="0.75">0.75×</button><button class="preset" data-speed="1">1×</button><button class="preset" data-speed="1.25">1.25×</button><button class="preset" data-speed="1.5">1.5×</button><button class="preset" data-speed="1.75">1.75×</button><button class="preset" data-speed="2">2×</button><button class="preset" data-speed="3">3×</button><button class="preset" data-speed="4">4×</button></div>
<div class="section-title"><strong>精细调整</strong><span>每次 0.25×</span></div>
<div class="adjust" role="group" aria-label="倍速微调"><button class="step" id="minus" aria-label="减慢 0.25 倍">−</button><span class="adjust-hint">0.25× — 4×</span><button class="step" id="plus" aria-label="加快 0.25 倍">+</button></div>
<section class="shortcuts"><div class="short-row"><span>⌨ 快捷键</span><button class="toggle" id="toggle" role="switch" aria-label="启用快捷键" aria-checked="true"></button></div><div class="keys" id="keys"><span><kbd>S</kbd>减速</span><span><kbd>D</kbd>加速</span><span><kbd>R</kbd>恢复 1×</span></div></section>
<div class="footer">模拟读回 · 不会操作真实视频</div></div>
</section></div>
<aside class="lab"><h2>原型状态模拟器</h2>
<div class="lab-group"><label>侧边栏宽度</label><div class="widths" id="widths"><button data-width="320">320</button><button data-width="360">360</button><button data-width="400" aria-pressed="true">400</button><button data-width="440">440</button><button data-width="520">520</button></div></div>
<div class="lab-group"><label>主题</label><div class="themes" id="themes"><button data-theme="light" aria-pressed="true">☀ 浅色</button><button data-theme="dark">☾ 深色</button></div></div>
<div class="lab-group"><label for="scenario">视频状态</label><select id="scenario"><option value="ready">已检测 · 1×</option><option value="success">成功读回 · 2×</option><option value="loading">检测中</option><option value="submitting">正在提交倍速</option><option value="none">没有 HTML5 视频</option><option value="permission">网站权限不足</option><option value="iframe">部分 iframe 不可访问</option><option value="override">播放器覆盖设置</option><option value="changed">网页切换 / 文档失效</option><option value="off">工具已停用</option></select><p id="hint" class="hint">单击预设即可模拟真实倍速读回。</p></div>
<div class="lab-group"><label>模拟键盘</label><div class="keys-try"><button data-key="s">S −0.25</button><button data-key="d">D +0.25</button><button data-key="r">R 1×</button></div><p class="hint">支持直接键盘按 S / D / R；关闭滑块后无效。</p></div>
<div id="result" class="result" role="status" aria-live="polite">就绪 · 当前实际 1.00×</div>
</aside></div></main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),buttons=[...document.querySelectorAll('[data-speed]')];
const state={mode:'ready',actual:1,target:null,busy:false,enabled:true,last:'',serial:0};
const fmt=n=>Number.isFinite(n)?n.toFixed(2):'—';
const guidance={ready:'已检测 HTML5 视频',success:'成功读回 2×',loading:'正在检测当前网页视频',submitting:'请求中，未验证结果',none:'请播放视频并重新检测',permission:'需要 Chrome 网站访问权限',iframe:'部分嵌入视频不可访问',override:'网站播放器覆盖了目标倍速',changed:'当前文档已失效，请刷新',off:'工具已停用'};
const available=()=>['ready','success','iframe','override'].includes(state.mode)&&Number.isFinite(state.actual)&&!state.busy;
function log(message){$('result').textContent=message;}
function paint(){
const m=state.mode,old=$('actual').textContent;
$('actual').textContent=fmt(state.actual);$('unit').hidden=!Number.isFinite(state.actual);
let title='已读回',kind='',detail='视频播放中 · 已读回',tone='';
if(state.busy||m==='submitting'){title='待验证';kind='warn';tone='warn';detail='目标 '+fmt(state.target??2)+'× · 正在等待网页独立读回';}
else if(m==='loading'){title='检测中';kind='warn';detail='正在检测当前网页视频…';}
else if(m==='none'){title='无视频';kind='neutral';detail='开始播放视频后点击刷新';}
else if(m==='permission'){title='无权限';kind='bad';tone='bad';detail='请授予 Chrome 网站访问权限后重试';}
else if(m==='iframe'){title='部分可用';kind='warn';tone='warn';detail='部分 iframe 不可访问；只控制可访问视频';}
else if(m==='override'){title='未生效';kind='bad';tone='bad';detail='目标 '+fmt(state.target??2)+'× · 播放器覆盖，实际仍为 '+fmt(state.actual)+'×';}
else if(m==='changed'){title='需重新检测';kind='warn';tone='warn';detail='网页已经切换，请重新检测';}
else if(m==='off'){title='已停用';kind='neutral';detail='工具已停用，不能控制视频';}
else if(state.last)detail=state.last+' · 已读回 '+fmt(state.actual)+'×';
$('state').textContent=title;$('state').dataset.kind=kind;$('message').textContent=detail;$('message').dataset.kind=tone;
buttons.forEach(b=>{let v=Number(b.dataset.speed);b.disabled=!available();b.setAttribute('aria-pressed',String(v===state.actual));b.dataset.pending=String((state.busy||m==='submitting')&&v===state.target);});
$('minus').disabled=!available()||state.actual<=.25;$('plus').disabled=!available()||state.actual>=4;$('refresh').disabled=state.busy||m==='loading'||m==='off';
$('toggle').disabled=m==='off';$('toggle').setAttribute('aria-checked',String(state.enabled));$('keys').classList.toggle('off',!state.enabled);
}
function scene(mode){
state.serial++;state.mode=mode;state.busy=false;state.target=null;state.last='';
state.actual={ready:1,success:2,loading:null,submitting:1,none:null,permission:null,iframe:1.5,override:1,changed:null,off:null}[mode];
if(mode==='submitting'||mode==='override')state.target=2;
if(mode==='success')state.last='模拟操作';
$('scenario').value=mode;$('hint').textContent=guidance[mode];paint();log('已切换模拟状态 · '+guidance[mode]);
}
function setRate(requested,source){
if(!available()){log('不可操作 · 请检查当前视频');return;}
let rate=Math.min(4,Math.max(.25,Math.round(requested*4)/4));
if(rate===state.actual&&state.mode!=='override'){log('无需修改 · 当前实际 '+fmt(rate)+'×');return;}
let serial=++state.serial;state.target=rate;state.busy=true;state.last=source;paint();log('已提交 '+fmt(rate)+'× · 等待独立读回');
setTimeout(()=>{
if(serial!==state.serial)return;
state.busy=false;
if(state.mode==='override'){state.actual=1;paint();log('设置未生效 · 实际仍为 '+fmt(state.actual)+'×');}
else{state.actual=rate;if(state.mode==='success')state.mode='ready';paint();log('已独立读回 · '+source+' → '+fmt(rate)+'×');}
},390);
}
function key(name){if(!state.enabled){log('快捷键已关闭，数字按钮仍可使用');return;}if(!available()){log('当前状态不可使用快捷键');return;}if(name==='s')setRate(state.actual-.25,'快捷键 S');if(name==='d')setRate(state.actual+.25,'快捷键 D');if(name==='r')setRate(1,'快捷键 R');}
buttons.forEach(b=>b.addEventListener('click',()=>setRate(Number(b.dataset.speed),'预设 '+b.textContent)));
$('minus').addEventListener('click',()=>setRate(state.actual-.25,'减速按钮'));$('plus').addEventListener('click',()=>setRate(state.actual+.25,'加速按钮'));
$('toggle').addEventListener('click',()=>{state.enabled=!state.enabled;paint();log(state.enabled?'快捷键已开启':'快捷键已关闭');});
$('scenario').addEventListener('change',e=>scene(e.target.value));
$('refresh').addEventListener('click',()=>{let old=state.mode,id=++state.serial;state.mode='loading';state.busy=false;state.actual=null;paint();log('正在重新检测…');setTimeout(()=>{if(id!==state.serial)return;scene(['none','permission','iframe','override'].includes(old)?old:'ready');},600);});
document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{$('panel').style.setProperty('--width',b.dataset.width+'px');$('width-label').textContent=b.dataset.width+' CSS px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));
document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{$('panel').classList.toggle('dark',b.dataset.theme==='dark');document.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>key(b.dataset.key)));
document.addEventListener('keydown',e=>{if(e.repeat||e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.defaultPrevented||e.target.closest?.('input,textarea,select,[contenteditable]'))return;const k=e.key.toLowerCase();if(['s','d','r'].includes(k)){e.preventDefault();key(k);}});
paint();
})();
</script>
</body>
</html>
