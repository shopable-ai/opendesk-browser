<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-opendesk-preview'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="od-preview-source" content="{{SOURCE}}">
  <title>{{TITLE}} · OpenDesk 交互预览</title>
  <!-- 静态设计文档快照；不得把这份宿主 CSS 注入实际工具 iframe。 -->
  <style id="od-preview-tokens">{{TOKENS}}</style>
  <style id="od-preview-components">{{COMPONENTS}}</style>
  <style id="od-preview-frame">
    /* This standalone document owns its scroll; no extension runtime is loaded. */
    html,body{height:auto;min-height:100%;overflow:auto}
    .preview-shell{width:100%;max-width:600px;margin-inline:auto;padding:var(--od-page-gutter);display:grid;gap:var(--space-4)}
    .preview-controls{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2)}
    .preview-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
    .preview-row>span{min-width:0;overflow-wrap:anywhere}
    .preview-actions{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2)}
    .preview-heading{display:grid;gap:var(--space-2)}
  </style>
</head>
<body>
<main class="preview-shell">
  <aside class="od-alert" aria-label="预览范围">交互预览 · 模拟数据 · 未安装。保存与删除只改变本页内存；关闭后清空。</aside>
  <div id="preview-state" class="preview-controls" role="group" aria-label="模拟状态">
    <span class="od-note">模拟状态</span>
    <button type="button" class="od-button" data-state="ready" aria-pressed="true">正常</button>
    <button type="button" class="od-button od-button--secondary" data-state="empty" aria-pressed="false">空数据</button>
    <button type="button" class="od-button od-button--secondary" data-state="error" aria-pressed="false">读取失败</button>
    <button type="button" class="od-button od-button--secondary" data-state="revoked" aria-pressed="false">授权撤销</button>
    <button type="button" class="od-button od-button--secondary" data-state="busy" aria-pressed="false">处理中</button>
    <button type="button" class="od-button od-button--secondary" data-state="long" aria-pressed="false">长文本</button>
  </div>
  <!-- 模型可编辑区域：仅工具内容；保留单一标题、od-* 组件、label 与状态语义。 -->
  <section id="od-preview-app" class="od-stack" aria-label="工具交互预览">
    <header class="od-page-head"><h1 class="od-page-title">{{TITLE}}</h1></header>
    <p id="app-status" class="od-note" role="status" aria-live="polite">示例内容已就绪。</p>
    <section id="list-view" class="od-stack" data-view="list">
      <div class="od-page-head"><h2 class="od-page-title">我的条目</h2><div class="od-page-actions"><button id="reset-items" type="button" class="od-icon-button" aria-label="重置模拟数据" title="重置模拟数据"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button><button id="create-item" type="button" class="od-button">新建</button></div></div>
      <div id="item-list" class="od-stack"></div>
    </section>
    <form id="form-view" class="od-stack od-surface od-surface--padded" data-view="form" hidden novalidate>
      <h2 id="form-title" class="od-title" tabindex="-1">新建条目</h2>
      <div><label for="item-title">名称</label><input id="item-title" class="od-field" maxlength="80" required aria-describedby="item-error"><p id="item-error" class="od-field-error" role="alert" hidden>请输入名称。</p></div>
      <div class="preview-actions"><button id="save-item" type="submit" class="od-button">保存</button><button id="cancel-form" type="button" class="od-button od-button--secondary">取消</button></div>
    </form>
    <section id="confirm-view" class="od-stack od-surface od-surface--padded" data-view="confirm" aria-labelledby="confirm-title" hidden>
      <h2 id="confirm-title" class="od-title" tabindex="-1">删除这条记录？</h2><p id="confirm-copy" class="od-body"></p>
      <div class="preview-actions"><button id="confirm-delete" type="button" class="od-button od-button--danger">确认删除</button><button id="cancel-delete" type="button" class="od-button od-button--secondary">取消</button></div>
    </section>
    <details class="od-disclosure od-disclosure--flat"><summary>预览说明</summary><p class="od-note">模拟授权状态不代表申请或取得真实权限。实际安装与运行须经既有工具 Host。</p></details>
  </section>
</main>
<!-- 模型可编辑区域：本地交互模拟；不连接真实 SDK、存储、网站或文件。 -->
<script id="od-preview-behavior" nonce="opendesk-preview">
(() => {
  'use strict';
  const root = document.getElementById('od-preview-app');
  const get = id => root.querySelector('#' + id);
  const state = document.getElementById('preview-state');
  const stateButtons = [...state.querySelectorAll('[data-state]')];
  const initial = () => [{id:1,title:'示例记录'}, {id:2,title:'准备下一次操作'}];
  let items = initial(), nextId = 3, editing = null, removing = null, returnFocus = 'create-item', returnScroll = 0, previewState = 'ready';
  const status = text => { get('app-status').textContent = text; };
  function show(view) {
    for (const panel of root.querySelectorAll('[data-view]')) panel.hidden = panel.dataset.view !== view;
    for (const button of stateButtons) button.disabled = view !== 'list';
  }
  function restoreFocus() {
    window.scrollTo({top:returnScroll,behavior:'instant'});
    const target = document.getElementById(returnFocus) || get('create-item');
    target.focus({preventScroll:true}); target.scrollIntoView({block:'nearest'});
  }
  function button(text, id, action, dangerous = false) {
    const el = document.createElement('button'); el.type = 'button'; el.id = id;
    el.className = 'od-button ' + (dangerous ? 'od-button--danger' : 'od-button--secondary');
    el.textContent = text; el.addEventListener('click', action); return el;
  }
  function render() {
    const list = get('item-list'); list.replaceChildren();
    const blocked = ['error','revoked','busy'].includes(previewState);
    get('create-item').disabled = blocked;
    get('reset-items').disabled = blocked;
    get('app-status').setAttribute('role', ['error','revoked'].includes(previewState) ? 'alert' : 'status');
    const messages = {error:'读取失败，请切回正常状态重试。',revoked:'授权已撤销，请在实际扩展中重新授权。',busy:'正在处理模拟操作…'};
    status(blocked ? messages[previewState] : items.length ? '示例内容已就绪。' : '暂无条目，可点击新建。');
    if (blocked) return;
    for (const item of items) {
      const row = document.createElement('div'); row.className = 'preview-row od-surface od-surface--padded';
      const title = document.createElement('span'); title.className = 'od-body'; title.textContent = item.title;
      const actions = document.createElement('div'); actions.className = 'preview-actions';
      const editId = 'edit-' + item.id, removeId = 'remove-' + item.id;
      actions.append(button('编辑', editId, () => openForm(item, editId)), button('删除', removeId, () => {
        removing = item.id; returnFocus = removeId; returnScroll = window.scrollY; get('confirm-copy').textContent = item.title;
        show('confirm'); get('cancel-delete').focus();
      }, true)); row.append(title, actions); list.append(row);
    }
  }
  function openForm(item, origin) {
    editing = item?.id ?? null; returnFocus = origin; returnScroll = window.scrollY;
    get('form-title').textContent = item ? '编辑条目' : '新建条目';
    get('item-title').value = item?.title ?? ''; get('item-title').removeAttribute('aria-invalid');
    get('item-error').hidden = true; show('form'); get('item-title').focus();
  }
  get('create-item').addEventListener('click', () => openForm(null, 'create-item'));
  get('form-view').addEventListener('submit', event => {
    event.preventDefault(); const title = get('item-title').value.trim();
    if (!title) { get('item-error').hidden = false; get('item-title').setAttribute('aria-invalid','true'); get('item-title').focus(); return; }
    if (editing === null) items.push({id:nextId++,title}); else items.find(item => item.id === editing).title = title;
    show('list'); render(); status('已保存到本页模拟数据。'); restoreFocus();
  });
  get('cancel-form').addEventListener('click', () => { show('list'); restoreFocus(); });
  get('cancel-delete').addEventListener('click', () => { show('list'); restoreFocus(); });
  root.addEventListener('keydown', event => {
    if (event.key === 'Escape' && (!get('form-view').hidden || !get('confirm-view').hidden)) {
      event.preventDefault(); show('list'); restoreFocus();
    }
  });
  get('reset-items').addEventListener('click', () => {
    items = initial(); nextId = 3; render(); status('模拟数据已重置。'); get('reset-items').focus();
  });
  get('confirm-delete').addEventListener('click', () => {
    items = items.filter(item => item.id !== removing); show('list'); render(); status('已从本页模拟数据删除。'); restoreFocus();
  });
  for (const stateButton of stateButtons) stateButton.addEventListener('click', () => {
    previewState = stateButton.dataset.state;
    for (const button of stateButtons) {
      const selected = button === stateButton;
      button.setAttribute('aria-pressed', String(selected)); button.classList.toggle('od-button--secondary', !selected);
    }
    items = previewState === 'empty' ? [] : previewState === 'long' ? Array.from({length:24}, (_, i) => ({id:i+1,title:'第' + (i+1) + '条很长的中文名称与链接 https://example.invalid/' + 'long-text-'.repeat(14)})) : initial();
    nextId = Math.max(0,...items.map(item => item.id)) + 1; show('list'); render();
  });
  render();
})();
</script>
</body>
</html>
