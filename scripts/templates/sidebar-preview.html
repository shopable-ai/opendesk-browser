  <style id="od-preview-frame">
    /* This standalone document owns its scroll; no extension runtime is loaded. */
    html,body{height:auto;min-height:100%;overflow:auto}
    #od-preview-app{padding:var(--space-3);background:var(--od-bg);color:var(--od-ink);min-width:0;overflow-wrap:anywhere}
    .preview-controls{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2)}
    .preview-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
    .preview-row>span{min-width:0;overflow-wrap:anywhere}
    .preview-actions{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2)}
    .preview-heading{display:grid;gap:var(--space-2)}
    .preview-sections{display:grid;gap:var(--space-4);min-width:0}
    .preview-actions-code{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
    /* Reading design only: geometry, not component appearance. Article and
       simulated device own separate scroll areas; no runtime CSS is copied. */
    .preview-reading-shell:has(.preview-reading-workbench){max-width:1360px}
    .preview-reading-workbench{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,390px);gap:var(--space-4);align-items:start}
    .preview-reading-page,.preview-reading-device{min-width:0}
    .preview-reading-stage{position:relative;min-height:680px;overflow:hidden}
    .preview-reading-article{height:680px;overflow:auto;padding:var(--space-4);padding-inline-end:304px;overscroll-behavior:contain}
    .preview-reading-chapter{min-height:240px;display:grid;align-content:start;gap:var(--space-3);scroll-margin-top:var(--space-4)}
    .preview-reading-overlay{position:absolute;inset-block-start:var(--space-4);inset-inline-end:var(--space-4);width:272px;max-width:calc(100% - var(--space-4) * 2);max-height:calc(100% - var(--space-4) * 2);overflow:auto}
    .preview-reading-overlay[data-dock="bottom-right"]{inset-block-start:auto;inset-block-end:var(--space-4)}
    .preview-reading-overlay[data-dock="top-left"]{inset-inline-start:var(--space-4);inset-inline-end:auto}
    .preview-reading-overlay[data-dock="bottom-left"]{inset-block-start:auto;inset-block-end:var(--space-4);inset-inline-start:var(--space-4);inset-inline-end:auto}
    .preview-reading-handle{touch-action:none;cursor:move}
    .preview-reading-device{min-height:680px;max-height:960px;overflow:auto;overscroll-behavior:contain}
    .preview-reading-flow{display:grid;gap:var(--space-4);align-content:start}
    .preview-reading-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-width:0;flex-wrap:wrap}
    .preview-reading-row>span{flex:1;min-width:0}
    .preview-reading-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
    .preview-reading-modes{width:100%;flex-wrap:wrap}
    .preview-reading-modes>button{flex:1;white-space:nowrap}
    .preview-reading-list{display:grid;gap:var(--space-1)}
    .preview-reading-list>button{justify-content:flex-start;text-align:start}
    .preview-reading-list>button[data-depth="2"]{margin-inline-start:var(--space-3);max-width:calc(100% - var(--space-3))}
    .preview-reading-diagnostics{grid-column:1/-1}
    .preview-reading-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-3)}
    @media(max-width:900px){.preview-reading-workbench{grid-template-columns:minmax(0,1fr)}.preview-reading-article{padding-inline-end:var(--space-4);padding-block-start:320px}.preview-reading-device{max-height:none}}
  </style>
<aside id="od-preview-controls" class="preview-diagnostic-area" aria-label="应用外部离线预览辅助区"><details class="od-disclosure od-surface od-surface--padded" open><summary>预览辅助 · 仅模拟，不属于工具</summary><p class="od-note">状态切换与恢复会重置本页模拟数据。未保存编辑期间禁用切换；取消后可继续演示。</p>
  <div id="preview-state" class="preview-controls" role="group" aria-label="模拟状态">
    <span class="od-note">模拟状态</span>
    <button type="button" class="od-button" data-state="ready" aria-pressed="true">已授权</button>
    <button type="button" class="od-button od-button--secondary" data-state="empty" aria-pressed="false">空数据</button>
    <button type="button" class="od-button od-button--secondary" data-state="error" aria-pressed="false">读取失败</button>
    <button type="button" class="od-button od-button--secondary" data-state="denied" aria-pressed="false">未授权</button>
    <button type="button" class="od-button od-button--secondary" data-state="revoked" aria-pressed="false">授权撤销</button>
    <button type="button" class="od-button od-button--secondary" data-state="busy" aria-pressed="false">处理中</button>
    <button type="button" class="od-button od-button--secondary" data-state="long" aria-pressed="false">长文本</button>
  </div>
<div class="preview-controls"><label for="od-design-theme">工具主题<select id="od-design-theme" class="od-field"><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="reset-items" type="button" class="od-button od-button--secondary">恢复初始预览</button></div><p class="od-note">宿主外壳始终为浅色。未授权和撤权仅演示界面状态，不申请真实权限。</p></details></aside>
  <section id="od-preview-app" class="preview-sections" aria-label="工具交互预览">
    <p id="app-status" class="od-note" role="status" aria-live="polite">示例内容已就绪。</p>
    <section id="list-view" class="od-stack" data-view="list">
      <div class="od-page-head"><h2 class="od-page-title">我的条目</h2><div class="od-page-actions"><button id="refresh-items" type="button" class="od-icon-button" aria-label="刷新条目" title="刷新条目"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button><button id="create-item" type="button" class="od-button">新建</button></div></div>
      <div id="item-list" class="od-stack"></div>
    </section>
    <form id="form-view" class="od-shared-card" data-view="form" hidden novalidate><div class="od-shared-card-content preview-sections">
      <h2 id="form-title" class="od-title" tabindex="-1">新建条目</h2>
      <div class="od-form-field"><label for="item-title" class="od-field-label">名称</label><input id="item-title" class="od-field" maxlength="80" required aria-describedby="item-help item-error"><p id="item-help" class="od-field-help">用于在列表中识别条目，最多 80 个字符。</p><p id="item-error" class="od-field-error" role="alert" hidden>请输入名称。</p></div>
      <div class="preview-actions"><button id="save-item" type="submit" class="od-button od-button--primary">保存</button><button id="cancel-form" type="button" class="od-button od-button--secondary">取消</button></div>
    </div></form>
    <section id="confirm-view" class="od-shared-card" data-view="confirm" aria-labelledby="confirm-title" hidden><div class="od-shared-card-content od-stack">
      <h2 id="confirm-title" class="od-title" tabindex="-1">删除这条记录？</h2><p id="confirm-copy" class="od-body"></p>
      <p class="od-note">删除后此条目将从本页列表移除。</p>
      <div class="preview-actions"><button id="cancel-delete" type="button" class="od-button od-button--secondary">取消</button><button id="confirm-delete" type="button" class="od-button od-button--danger">确认删除</button></div>
    </div></section>
  </section>
<script id="od-preview-behavior" nonce="opendesk-preview">
(() => {
  'use strict';
  const root = document.getElementById('od-preview-app');
  const get = id => root.querySelector('#' + id);
  const state = document.getElementById('preview-state');
  const stateButtons = [...state.querySelectorAll('[data-state]')];
  const initial = () => [{id:1,title:'示例记录'}, {id:2,title:'准备下一次操作'}];
  let items = initial(), nextId = 3, editing = null, removing = null, returnFocus = 'create-item', returnScroll = 0, previewState = 'ready';
  const status = text => { get('app-status').textContent = text; };
  function show(view) {
    for (const panel of root.querySelectorAll('[data-view]')) panel.hidden = panel.dataset.view !== view;
    for (const button of stateButtons) button.disabled = view !== 'list';
    document.getElementById('reset-items').disabled = view !== 'list';
    document.getElementById('od-design-theme').disabled = view !== 'list';
  }
  function restoreFocus() {
    window.scrollTo({top:returnScroll,behavior:'instant'});
    const target = document.getElementById(returnFocus) || get('create-item');
    target.focus({preventScroll:true}); target.scrollIntoView({block:'nearest'});
  }
  function button(text, id, action, dangerous = false) {
    const el = document.createElement('button'); el.type = 'button'; el.id = id;
    el.className = 'od-button ' + (dangerous ? 'od-button--quiet' : 'od-button--secondary');
    el.textContent = text; el.addEventListener('click', action); return el;
  }
  function render() {
    const list = get('item-list'); list.replaceChildren();
    const blocked = ['error','denied','revoked','busy'].includes(previewState);
    get('create-item').disabled = blocked;
    get('refresh-items').disabled = blocked;
    get('app-status').setAttribute('role', ['error','revoked'].includes(previewState) ? 'alert' : 'status');
    get('app-status').className = blocked ? 'od-alert ' + (previewState === 'error' ? 'od-alert--error' : ['denied','revoked'].includes(previewState) ? 'od-alert--warning' : '') : items.length ? 'od-note' : 'od-alert';
    root.setAttribute('aria-busy', String(previewState === 'busy'));
    const messages = {error:'读取失败，请切回正常状态重试。',denied:'尚未授权，当前内容不可读取。',revoked:'授权已撤销，当前操作已停止。',busy:'正在处理模拟操作…'};
    status(previewState === 'long' ? '这是一条用于演示自然换行的长状态提示，保留完整说明及恢复路径：https://example.invalid/' + 'long-context-'.repeat(16) : blocked ? messages[previewState] : items.length ? '示例内容已就绪。' : '暂无条目，可点击新建。');
    if (blocked) return;
    for (const item of items) {
      const row = document.createElement('div'); row.className = 'od-shared-card';
      const content = document.createElement('div'); content.className = 'od-shared-card-content preview-row';
      const title = document.createElement('span'); title.className = 'od-body'; title.textContent = item.title;
      const actions = document.createElement('div'); actions.className = 'preview-actions';
      const editId = 'edit-' + item.id, removeId = 'remove-' + item.id;
      actions.append(button('编辑', editId, () => openForm(item, editId)), button('删除', removeId, () => {
        removing = item.id; returnFocus = removeId; returnScroll = window.scrollY; get('confirm-copy').textContent = item.title;
        show('confirm'); get('cancel-delete').focus();
      }, true)); content.append(title, actions); row.append(content); list.append(row);
    }
  }
  function openForm(item, origin) {
    editing = item?.id ?? null; returnFocus = origin; returnScroll = window.scrollY;
    get('form-title').textContent = item ? '编辑条目' : '新建条目';
    get('item-title').value = item?.title ?? ''; get('item-title').removeAttribute('aria-invalid');
    get('item-error').hidden = true; show('form'); get('item-title').focus();
  }
  get('create-item').addEventListener('click', () => openForm(null, 'create-item'));
  get('item-title').addEventListener('input', () => {
    if (!get('item-title').value.trim()) return;
    get('item-title').removeAttribute('aria-invalid'); get('item-error').hidden = true;
  });
  get('form-view').addEventListener('submit', event => {
    event.preventDefault(); const title = get('item-title').value.trim();
    if (!title) { get('item-error').hidden = false; get('item-title').setAttribute('aria-invalid','true'); get('item-title').focus(); return; }
    if (editing === null) items.push({id:nextId++,title}); else items.find(item => item.id === editing).title = title;
    show('list'); render(); status('已保存到本页模拟数据。'); restoreFocus();
  });
  get('cancel-form').addEventListener('click', () => { show('list'); restoreFocus(); });
  get('cancel-delete').addEventListener('click', () => { show('list'); restoreFocus(); });
  root.addEventListener('keydown', event => {
    if (event.key === 'Escape' && (!get('form-view').hidden || !get('confirm-view').hidden)) {
      event.preventDefault(); show('list'); restoreFocus();
    }
  });
  function reset() {
    previewState = 'ready'; items = initial(); nextId = 3; editing = removing = null;
    root.dataset.previewTheme = 'light'; document.getElementById('od-design-theme').value = 'light';
    for (const button of stateButtons) {
      const selected = button.dataset.state === 'ready';
      button.setAttribute('aria-pressed', String(selected)); button.classList.toggle('od-button--secondary', !selected);
    }
    show('list'); render();
  }
  document.getElementById('reset-items').addEventListener('click', reset);
  root.addEventListener('opendesk-preview-reset', reset);
  get('refresh-items').addEventListener('click', () => { render(); status('条目已刷新。'); });
  document.getElementById('od-design-theme').addEventListener('change', event => {
    if (['light','dark'].includes(event.target.value)) root.dataset.previewTheme = event.target.value;
  });
  get('confirm-delete').addEventListener('click', () => {
    items = items.filter(item => item.id !== removing); show('list'); render(); status('已从本页模拟数据删除。'); restoreFocus();
  });
  for (const stateButton of stateButtons) stateButton.addEventListener('click', () => {
    previewState = stateButton.dataset.state;
    for (const button of stateButtons) {
      const selected = button === stateButton;
      button.setAttribute('aria-pressed', String(selected)); button.classList.toggle('od-button--secondary', !selected);
    }
    items = previewState === 'empty' ? [] : previewState === 'long' ? Array.from({length:24}, (_, i) => ({id:i+1,title:'第' + (i+1) + '条很长的中文名称与链接 https://example.invalid/' + 'long-text-'.repeat(14)})) : initial();
    nextId = Math.max(0,...items.map(item => item.id)) + 1; show('list'); render();
  });
  root.dataset.previewTheme = 'light'; render();
})();
</script>
