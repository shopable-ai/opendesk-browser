<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma MCP 测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .test-section h2 {
            color: #495057;
            margin-bottom: 15px;
            font-size: 20px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .info-item {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 4px;
            border-left: 4px solid #667eea;
        }

        .info-item strong {
            color: #495057;
            display: inline-block;
            min-width: 120px;
        }

        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 14px;
            line-height: 1.5;
            max-height: 400px;
            overflow-y: auto;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .config-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #2196F3;
        }

        .config-info code {
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Figma MCP 测试页面</h1>
        <p class="subtitle">测试 Figma API 连接和数据获取功能</p>

        <div class="config-info">
            <strong>📌 配置信息：</strong><br>
            API Key: <code>figd_ff51...****</code><br>
            测试文件: <code>Figma Community 示例文件</code>
        </div>

        <div id="status" class="status loading">
            <span class="spinner"></span>
            准备测试 Figma API 连接...
        </div>

        <div class="test-section">
            <h2>🧪 测试操作</h2>
            <button onclick="testBasicAPI()">测试基本 API 连接</button>
            <button onclick="testFileInfo()">获取文件信息</button>
            <button onclick="testComponents()">获取组件列表</button>
            <button onclick="testStyles()">获取样式信息</button>
            <button onclick="clearResults()">清空结果</button>
        </div>

        <div class="test-section" id="results" style="display: none;">
            <h2>📊 测试结果</h2>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const FIGMA_API_KEY = 'figd_ff51KewtRt3g_jz0KZYaQUFjBEcg9f91j1oB2ugY';
        const TEST_FILE_KEY = 'c0FbKTs4ZOMVSZBNE09pxw'; // Figma Community 示例文件
        let fileData = null;

        function updateStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            
            if (type === 'loading') {
                statusDiv.innerHTML = `<span class="spinner"></span>${message}`;
            } else if (type === 'success') {
                statusDiv.innerHTML = `✅ ${message}`;
            } else if (type === 'error') {
                statusDiv.innerHTML = `❌ ${message}`;
            }
        }

        function showResults(content) {
            const resultsDiv = document.getElementById('results');
            const resultContent = document.getElementById('resultContent');
            resultsDiv.style.display = 'block';
            resultContent.innerHTML = content;
        }

        function clearResults() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'none';
            updateStatus('已清空测试结果', 'success');
            setTimeout(() => {
                updateStatus('准备测试 Figma API 连接...', 'loading');
            }, 2000);
        }

        async function fetchFigmaAPI(endpoint) {
            // 注意：由于浏览器的 CORS 限制，直接调用 Figma API 可能会失败
            // 这里展示如何在支持 CORS 的环境中使用
            const response = await fetch(`https://api.figma.com/v1${endpoint}`, {
                method: 'GET',
                headers: {
                    'X-Figma-Token': FIGMA_API_KEY
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            return await response.json();
        }

        async function testBasicAPI() {
            updateStatus('正在连接 Figma API...', 'loading');
            
            try {
                // 由于 CORS 限制，这里提供模拟数据和说明
                updateStatus('⚠️ 浏览器 CORS 限制', 'error');
                
                const content = `
                    <div class="info-item">
                        <strong>⚠️ CORS 限制说明：</strong><br>
                        由于浏览器的 CORS 安全策略，无法直接从前端调用 Figma API。<br>
                        <br>
                        <strong>✅ 解决方案：</strong><br>
                        1. 使用 Node.js 脚本测试（运行 test-figma-mcp.js）<br>
                        2. 使用后端代理服务器<br>
                        3. 使用 Chrome 扩展（当前项目的方式）<br>
                        4. 使用 MCP 服务器（推荐）
                    </div>
                    <div class="info-item">
                        <strong>📝 配置文件位置：</strong><br>
                        <code>demo/mcp-config.json</code>
                    </div>
                    <div class="info-item">
                        <strong>🔧 运行测试命令：</strong><br>
                        <code>node demo/test-figma-mcp.js</code>
                    </div>
                    <pre>{
  "mcpServers": {
    "figma": {
      "command": "npx",
      "args": [
        "-y",
        "@modelcontextprotocol/server-figma",
        "--figma-api-key=figd_ff51..."
      ]
    }
  }
}</pre>
                `;
                
                showResults(content);
                
            } catch (error) {
                updateStatus(`API 连接失败: ${error.message}`, 'error');
                showResults(`<div class="info-item"><strong>错误：</strong> ${error.message}</div>`);
            }
        }

        function testFileInfo() {
            updateStatus('获取文件信息...', 'loading');
            
            const content = `
                <div class="info-item">
                    <strong>📄 模拟文件信息：</strong><br><br>
                    <strong>文件名：</strong> Figma Design System<br>
                    <strong>文件 Key：</strong> ${TEST_FILE_KEY}<br>
                    <strong>版本：</strong> 1234567890<br>
                    <strong>最后修改：</strong> ${new Date().toISOString()}<br>
                </div>
                <div class="info-item">
                    <strong>💡 提示：</strong><br>
                    要获取真实数据，请运行：<br>
                    <code>node demo/test-figma-mcp.js</code>
                </div>
            `;
            
            showResults(content);
            updateStatus('文件信息展示（模拟数据）', 'success');
        }

        function testComponents() {
            const content = `
                <div class="info-item">
                    <strong>🧩 组件测试：</strong><br>
                    此功能需要通过 MCP 服务器或 Node.js 脚本访问。
                </div>
                <div class="info-item">
                    <strong>示例组件：</strong><br>
                    • Button (Primary, Secondary, Disabled)<br>
                    • Input (Text, Number, Password)<br>
                    • Card (Default, Elevated, Outlined)<br>
                    • Navigation (Header, Sidebar, Footer)
                </div>
            `;
            
            showResults(content);
            updateStatus('组件信息展示（模拟数据）', 'success');
        }

        function testStyles() {
            const content = `
                <div class="info-item">
                    <strong>🎨 样式测试：</strong><br>
                    此功能需要通过 MCP 服务器或 Node.js 脚本访问。
                </div>
                <div class="info-item">
                    <strong>示例样式：</strong><br>
                    <strong>颜色：</strong><br>
                    • Primary: #667eea<br>
                    • Secondary: #764ba2<br>
                    • Success: #28a745<br>
                    • Error: #dc3545<br>
                    <br>
                    <strong>字体：</strong><br>
                    • Heading: Inter Bold 32px<br>
                    • Body: Inter Regular 16px<br>
                    • Caption: Inter Regular 14px
                </div>
            `;
            
            showResults(content);
            updateStatus('样式信息展示（模拟数据）', 'success');
        }

        // 页面加载时初始化
        window.onload = function() {
            updateStatus('✅ 页面已加载，点击按钮开始测试', 'success');
        };
    </script>
</body>
</html>
