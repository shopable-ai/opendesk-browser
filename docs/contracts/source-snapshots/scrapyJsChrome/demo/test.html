        /* Extracted Styles */
.search-layout.clearfix {
  /* LAYOUT */
  display: block;
  position: static;
  visibility: visible;
  vertical-align: baseline;

  /* BOX */
  width: 1100px;
  height: 594.188px;
  min-width: 0px;
  min-height: 0px;
  box-sizing: border-box;
  object-fit: fill;
  object-position: 50% 50%;

  /* SPACING */
  padding-top: 0px;
  padding-right: 0px;
  padding-bottom: 0px;
  padding-left: 0px;
  margin-top: 0px;
  margin-right: 0px;
  margin-bottom: 0px;
  margin-left: 0px;

  /* BORDER */
  border-top-width: 0px;
  border-right-width: 0px;
  border-bottom-width: 0px;
  border-left-width: 0px;
  border-top-left-radius: 0px;
  border-top-right-radius: 0px;
  border-bottom-left-radius: 0px;
  border-bottom-right-radius: 0px;
  outline-width: 0px;
  outline-color: rgb(24, 25, 28);
  outline-offset: 0px;

  /* BACKGROUND */
  background-color: rgba(0, 0, 0, 0);
  background-position: 0% 0%;
  background-repeat: repeat;
  background-attachment: scroll;
  background-clip: border-box;
  background-origin: padding-box;

  /* TEXT */
  color: rgb(24, 25, 28);
  font-size: 14px;
  font-weight: 400;
  font-family: -apple-system, "system-ui", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  line-height: 17.5px;
  text-align: left;
  text-decoration: rgb(24, 25, 28);
  text-decoration-color: rgb(24, 25, 28);
  text-decoration-style: solid;
  text-indent: 0px;
  text-overflow: clip;
  word-spacing: 0px;
  writing-mode: horizontal-tb;
  direction: ltr;

  /* FLEX */
  flex-direction: row;
  flex-wrap: nowrap;
  flex-grow: 0;
  flex-shrink: 1;
  order: 0;

  /* GRID */
  grid-auto-flow: row;

  /* EFFECTS */
  opacity: 1;
  transform-origin: 550px 297.094px;
  transform-style: flat;
  transition-property: all;
  transition-duration: 0s;
  transition-timing-function: ease;
  transition-delay: 0s;
  animation-duration: 0s;
  animation-timing-function: ease;
  animation-delay: 0s;
  animation-iteration-count: 1;
  animation-play-state: running;

  /* OVERFLOW */
  overflow-x: visible;
  overflow-y: visible;

  /* LIST */
  list-style-type: disc;
  list-style-position: outside;

  /* TABLE */
  border-collapse: separate;
  caption-side: top;
  empty-cells: show;

  /* INTERACTION */
  cursor: crosshair;

}
