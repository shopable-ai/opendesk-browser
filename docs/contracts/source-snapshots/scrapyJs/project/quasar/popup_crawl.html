<!DOCTYPE html>
<html>
<head>
    <title>Data Scraper</title>
    <meta charset="utf-8">
    <meta name="description" content="网页爬虫scrapyjs可视化工具">

  <!-- 使用 jsdelivr CDN -->
<!--     <link href="https://cdn.jsdelivr.net/npm/quasar@2.12.7/dist/quasar.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.12.7/dist/quasar.umd.min.js"></script> -->
    
    <link href="../assets/css/quasar.min.css" rel="stylesheet">
    <script src="../assets/js/core/tb-bridge.js"></script>

    
    <!-- Material Icons from Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/quasar@2.12.7/dist/icon-set/material-icons.umd.min.js" rel="stylesheet">
    
    
    <style>
        body {
            width: 760px;
            height: 560px;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 13px;
            color: #333;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .code-editor {
            width: 100%;
            height: calc(100% - 16px);
            min-height: 300px;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            resize: none;
            background: #f8f9fa;
            box-sizing: border-box;
        }

        .q-table__container {
            height: calc(100vh - 250px);
            overflow: auto;
        }

        .q-btn {
            text-transform: none;
        }

        .q-card {
            box-shadow: none;
            border: 1px solid #e0e0e0;
        }
        
        .q-tabs {
            min-height: 32px;
            margin-bottom: 0;
        }
        
        .q-tab-panels {
            background: white;
            height: calc(100vh - 420px);
            min-height: 150px;
            border: 1px solid #ddd;
            border-top: none;
        }
        
        .q-tab {
            min-height: 32px;
            padding: 0 12px;
            font-size: 13px;
        }
        
        .q-tab-panel {
            padding: 8px;
        }
        
        .data-table-container {
            height: 100%;
            overflow: auto;
        }
    </style>

</head>
<body>
    <div id="q-app">
        <div class="q-pa-md">
            <div class="row q-col-gutter-sm">
                <!-- Operation buttons -->
                <div class="col-12">
                    <q-btn color="primary" class="full-width q-mb-sm" @click="tryAnotherTable" :loading="loading">
                        {{ loading ? '加载中' : '选择数据表格' }}
                    </q-btn>
                    <q-btn color="primary" class="full-width q-mb-sm" @click="locateNextButton" :loading="locating">
                        {{ locating ? '选择中' : '定位下一页按钮' }}
                    </q-btn>
                    <q-btn color="primary" class="full-width q-mb-sm" @click="startCrawl" :loading="crawling">
                        {{ crawling ? '采集中' : '开始采集' }}
                    </q-btn>
                </div>

                <!-- Export buttons -->
                <div class="col-12">
                    <div class="row q-col-gutter-sm">
                        <div class="col">
                            <q-btn color="teal" class="full-width" @click="exportCsv">
                                <q-icon left name="save_alt"/>CSV
                            </q-btn>
                        </div>
                        <div class="col">
                            <q-btn color="teal" class="full-width" @click="exportJson">
                                <q-icon left name="save_alt"/>JSON
                            </q-btn>
                        </div>
                        <div class="col">
                            <q-btn color="teal" class="full-width" @click="copyAll">
                                <q-icon left name="content_copy"/>复制
                            </q-btn>
                        </div>
                    </div>
                </div>

                <!-- Settings panel -->
                <div class="col-12">
                    <q-card class="q-pa-md">
                        <div class="row q-col-gutter-md">
                            <div class="col-12">
                                <q-checkbox v-model="settings.infiniteScroll" label="无限滚动" />
                            </div>
                            <div class="col-6">
                                <q-input 
                                    v-model.number="settings.minDelay" 
                                    type="number" 
                                    label="最小延迟" 
                                    min="0"
                                    dense
                                    suffix="秒"
                                />
                            </div>
                            <div class="col-6">
                                <q-input 
                                    v-model.number="settings.maxDelay" 
                                    type="number" 
                                    label="最大延迟" 
                                    min="0"
                                    dense
                                    suffix="秒"
                                />
                            </div>
                        </div>
                    </q-card>
                </div>

                <!-- Status bar -->
                <div class="col-12">
                    <q-banner class="bg-grey-2">
                        <template v-slot:avatar>
                            <q-icon name="info" color="primary" />
                        </template>
                        已采集页数: {{stats.pagesScrapped}} | 
                        数据条数: {{stats.rowsCollected}} | 
                        运行时间: {{stats.workingTime}}s
                    </q-banner>
                </div>
            </div>

            <!-- Tabs -->
            <div class="q-mt-sm">
                <q-tabs
                    v-model="activeTab"
                    class="text-primary"
                    active-color="primary"
                    indicator-color="primary"
                    dense
                    narrow-indicator
                    no-caps
                >
                    <q-tab name="data" label="数据预览" />
                    <q-tab name="config" label="配置" />
                    <q-tab name="code" label="代码" />
                </q-tabs>

                <q-tab-panels v-model="activeTab" animated>
                    <q-tab-panel name="data" class="q-pa-none">
                        <div class="data-table-container">
                            <q-table
                                :rows="tableData"
                                :columns="tableColumns"
                                row-key="id"
                                dense
                                :pagination="{ rowsPerPage: 0 }"
                            />
                        </div>
                    </q-tab-panel>

                    <q-tab-panel name="config">
                        <q-input
                            v-model="configText"
                            type="textarea"
                            class="code-editor"
                            @update:model-value="updateConfig"
                            filled
                        />
                    </q-tab-panel>

                    <q-tab-panel name="code">
                        <q-input
                            v-model="generatedCode"
                            type="textarea"
                            class="code-editor"
                            readonly
                            filled
                        />
                    </q-tab-panel>
                </q-tab-panels>
            </div>
        </div>
    </div>

    <script src="../assets/js/libs/vue.global.min.js"></script>
    <script src="../assets/js/libs/quasar.umd.min.js"></script>


    <script src="popup_crawl.js" defer></script>

</body>
</html>
