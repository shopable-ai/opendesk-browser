<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>R5.2 Controlled Locator Acceptance</title><style>body{font:14px sans-serif;margin:16px}main{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:900px}section,form{border:1px solid #bbb;padding:8px;margin:0}input,textarea,button{font:inherit;padding:4px;margin:3px}input,textarea{width:160px}.covered{position:relative;display:inline-block}.overlay{position:absolute;inset:0;background:#9998}#moving{animation:move 1s linear infinite alternate}@keyframes move{to{transform:translateX(40px)}}output{display:inline-block;margin:3px}.bulk{font-size:1px}</style><h1>受控 Locator 与观察测试</h1><main>
<section id="container" aria-label="普通容器"><label for="native-input">原生标签</label><input id="native-input" value="old native"><output id="value-native"></output><label for="area">多行输入</label><textarea id="area">old textarea</textarea><output id="value-area"></output><button id="redraw">重绘后提交</button><button id="container-button">同名</button></section>
<form aria-label="范围表单" onsubmit="event.preventDefault()"><input id="aria-input" aria-label="ARIA 输入" value="PRIVATE_INPUT_VALUE"><output id="value-aria"></output><span id="reference">引用标签</span><input id="referenced" aria-labelledby="reference" value="old referenced"><output id="value-reference"></output><button id="form-button" type="button">同名</button></form>
<div role="dialog" aria-label="设置面板"><button id="dialog-button">同名</button><label for="password">密码</label><input id="password" type="password" value="PASSWORD_VALUE_MUST_NOT_LEAK"><input aria-label="私人字段" value="PRIVATE_UNNECESSARY_INPUT"></div>
<section><button id="disabled" disabled>原生禁用</button><button id="aria-disabled" aria-disabled="true">ARIA 禁用</button><label for="readonly">原生只读</label><input id="readonly" readonly value="unchanged"><label for="aria-readonly">ARIA 只读</label><input id="aria-readonly" aria-readonly="true" value="unchanged"><button id="no-pointer" style="pointer-events:none">无指针事件</button><span class="covered"><button id="covered">被遮挡</button><span class="overlay"></span></span><button id="moving">动画按钮</button></section>
</main><p id="counts"></p><div id="bulk"></div><script>
const counts={};const show=()=>document.querySelector('#counts').textContent=JSON.stringify(counts);show();
for(const [id,out]of [['native-input','value-native'],['area','value-area'],['aria-input','value-aria'],['referenced','value-reference']])document.getElementById(id).addEventListener('input',e=>{document.getElementById(out).textContent=e.target.value;counts['input:'+id]=(counts['input:'+id]||0)+1;show()});
document.querySelector('main').addEventListener('click',e=>{if(e.target.tagName==='BUTTON'){counts[e.target.id]=(counts[e.target.id]||0)+1;show()}});
document.getElementById('native-input').addEventListener('input',()=>{const old=document.getElementById('redraw'),next=old.cloneNode(true);next.disabled=true;old.replaceWith(next);setTimeout(()=>next.disabled=false,180)});
for(let i=0;i<7000;i++){const x=document.createElement('div');x.className='bulk';document.getElementById('bulk').append(x)}
</script></html>
