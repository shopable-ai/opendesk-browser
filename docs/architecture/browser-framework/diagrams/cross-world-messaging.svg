<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1083" viewBox="0 0 1460 1083" role="img" aria-label="跨运行世界消息与事件 · 已实现 / 待补边界"><title>跨运行世界消息与事件 · 已实现 / 待补边界</title><desc>实线表示当前源码已有明确消费者；虚线表示推荐补齐的固定任务触发合同</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#758AA4"/></marker></defs><rect x="0" y="0" width="1460" height="1083" fill="#FAFCFF"/><rect x="0" y="0" width="1460" height="9" fill="#239276"/><text x="54" y="65" font-size="33" fill="#162841" font-weight="750" text-anchor="start">跨运行世界消息与事件 · 已实现 / 待补边界</text><text x="54" y="99" font-size="18" fill="#5F7189" font-weight="500" text-anchor="start">实线表示当前源码已有明确消费者；虚线表示推荐补齐的固定任务触发合同</text><rect x="36" y="125" width="1388" height="243" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/><rect x="36" y="125" width="1388" height="50" rx="16" fill="#E8F9F1" stroke="#E8F9F1" stroke-width="1.5"/><text x="58" y="158" font-size="22" fill="#17845F" font-weight="750" text-anchor="start">1 · 网站 MAIN 的 SDK 请求：已实现的 CustomEvent 通信</text><rect x="58" y="202" width="247" height="113" rx="14" fill="#F6F8FA" stroke="#D4DEE7" stroke-width="1.5"/><text x="76" y="235" font-size="17" fill="#33445E" font-weight="700" text-anchor="start">网页按钮 / 网站 JS</text><text x="76" y="264" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">OpenDeskSDK.call()</text><path d="M305 258 L329 258" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="334" y="202" width="247" height="113" rx="14" fill="#F6F8FA" stroke="#D4DEE7" stroke-width="1.5"/><text x="352" y="235" font-size="17" fill="#33445E" font-weight="700" text-anchor="start">DOM CustomEvent</text><text x="352" y="264" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">SDK_REQUEST_EVENT</text><path d="M581 258 L605 258" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="610" y="202" width="247" height="113" rx="14" fill="#F6F8FA" stroke="#D4DEE7" stroke-width="1.5"/><text x="628" y="235" font-size="17" fill="#33445E" font-weight="700" text-anchor="start">Content ISOLATED</text><text x="628" y="264" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">agents/page-relay.js</text><path d="M857 258 L881 258" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="886" y="202" width="247" height="113" rx="14" fill="#F6F8FA" stroke="#D4DEE7" stroke-width="1.5"/><text x="904" y="235" font-size="17" fill="#33445E" font-weight="700" text-anchor="start">Background Broker</text><text x="904" y="264" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">来源/方法/授权校验</text><path d="M1133 258 L1157 258" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1162" y="202" width="247" height="113" rx="14" fill="#EBFBF4" stroke="#A8E2C5" stroke-width="1.5"/><text x="1180" y="235" font-size="17" fill="#16825E" font-weight="700" text-anchor="start">受控服务</text><text x="1180" y="264" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">HTTP / KV / 通知</text><text x="64" y="350" font-size="16" fill="#376A59" font-weight="500" text-anchor="start">返回：服务结果 → Background/Relay → SDK_RESULT_EVENT → 原网页 Promise；它是白名单 RPC，不是任意跨环境 Event Bus。</text><rect x="36" y="398" width="1388" height="202" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/><rect x="36" y="398" width="1388" height="50" rx="16" fill="#EAF3FF" stroke="#EAF3FF" stroke-width="1.5"/><text x="58" y="431" font-size="22" fill="#236BC5" font-weight="750" text-anchor="start">2 · Controller 内部命令链：已实现</text><rect x="58" y="472" width="247" height="96" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="76" y="505" font-size="17" fill="#185FB6" font-weight="700" text-anchor="start">Worker main() / page</text><text x="76" y="534" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">受控用户代码</text><path d="M305 516 L329 516" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="334" y="472" width="247" height="96" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="352" y="505" font-size="17" fill="#185FB6" font-weight="700" text-anchor="start">private MessagePort</text><text x="352" y="534" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">不可由网站直接访问</text><path d="M581 516 L605 516" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="610" y="472" width="247" height="96" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="628" y="505" font-size="17" fill="#185FB6" font-weight="700" text-anchor="start">RunHost / Authority</text><text x="628" y="534" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">runId / 目标 / 版本约束</text><path d="M857 516 L881 516" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="886" y="472" width="247" height="96" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="904" y="505" font-size="17" fill="#185FB6" font-weight="700" text-anchor="start">Native Driver</text><text x="904" y="534" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">Page Session / userScripts</text><path d="M1133 516 L1157 516" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1162" y="472" width="247" height="96" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="1180" y="505" font-size="17" fill="#185FB6" font-weight="700" text-anchor="start">获准网页操作</text><text x="1180" y="534" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">指定 documentId</text><rect x="36" y="627" width="1388" height="192" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/><rect x="36" y="627" width="1388" height="50" rx="16" fill="#F2ECFE" stroke="#F2ECFE" stroke-width="1.5"/><text x="58" y="660" font-size="22" fill="#7C59C3" font-weight="750" text-anchor="start">3 · Sidebar Tool 的宿主桥：已实现</text><rect x="58" y="698" width="320" height="102" rx="14" fill="#F5F1FF" stroke="#CDC0F8" stroke-width="1.5"/><text x="76" y="731" font-size="17" fill="#704FBD" font-weight="700" text-anchor="start">工具 iframe 沙箱</text><text x="76" y="760" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">OpenDeskTool.request()</text><path d="M378 744 L398 744" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="405" y="698" width="320" height="102" rx="14" fill="#F5F1FF" stroke="#CDC0F8" stroke-width="1.5"/><text x="423" y="731" font-size="17" fill="#704FBD" font-weight="700" text-anchor="start">postMessage</text><text x="423" y="760" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">instance / toolId / requestId</text><path d="M725 744 L745 744" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="752" y="698" width="320" height="102" rx="14" fill="#F5F1FF" stroke="#CDC0F8" stroke-width="1.5"/><text x="770" y="731" font-size="17" fill="#704FBD" font-weight="700" text-anchor="start">可信 Side Panel</text><text x="770" y="760" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">安装身份 / 能力检查</text><path d="M1072 744 L1092 744" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1099" y="698" width="320" height="102" rx="14" fill="#F5F1FF" stroke="#CDC0F8" stroke-width="1.5"/><text x="1117" y="731" font-size="17" fill="#704FBD" font-weight="700" text-anchor="start">有限 Browser SDK</text><text x="1117" y="760" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">具体授权服务 / UI</text><rect x="36" y="844" width="1388" height="183" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/><rect x="36" y="844" width="1388" height="50" rx="16" fill="#FFF0DF" stroke="#FFF0DF" stroke-width="1.5"/><text x="58" y="877" font-size="22" fill="#C76A14" font-weight="750" text-anchor="start">4 · 网页按钮 → 固定已安装 Controller Task：建议补齐，当前非通用公开 API</text><rect x="58" y="908" width="320" height="98" rx="14" fill="#FFF4E7" stroke="#F4C895" stroke-width="1.5"/><text x="76" y="941" font-size="16" fill="#B55E09" font-weight="700" text-anchor="start">Page UI 点击</text><text x="76" y="970" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">仅允许可信声明动作</text><path d="M378 954 L398 954" fill="none" stroke="#9A8FA1" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="405" y="908" width="320" height="98" rx="14" fill="#FFF4E7" stroke="#F4C895" stroke-width="1.5"/><text x="423" y="941" font-size="16" fill="#B55E09" font-weight="700" text-anchor="start">有界 command</text><text x="423" y="970" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">taskRef + 固定版本 + 参数</text><path d="M725 954 L745 954" fill="none" stroke="#9A8FA1" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="752" y="908" width="320" height="98" rx="14" fill="#FFF4E7" stroke="#F4C895" stroke-width="1.5"/><text x="770" y="941" font-size="16" fill="#B55E09" font-weight="700" text-anchor="start">受信 Host 确认</text><text x="770" y="970" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">重新验证 origin/document</text><path d="M1072 954 L1092 954" fill="none" stroke="#9A8FA1" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="1099" y="908" width="320" height="98" rx="14" fill="#FFF4E7" stroke="#F4C895" stroke-width="1.5"/><text x="1117" y="941" font-size="16" fill="#B55E09" font-weight="700" text-anchor="start">原有 RunHost</text><text x="1117" y="970" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">执行固定任务、查询 result</text><text x="66" y="1030" font-size="16" fill="#AF6316" font-weight="500" text-anchor="start">不得把网页自定义事件本身当授权；不接收任意代码，不绕过安装、Chrome 手势、撤权、幂等与未知副作用防重放。</text><text x="1422" y="1063" font-size="14" text-anchor="end" fill="#8492A4">OpenDesk Browser · Architecture reference · 2026-10-14</text></svg