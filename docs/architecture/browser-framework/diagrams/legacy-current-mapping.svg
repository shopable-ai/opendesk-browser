<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="980" viewBox="0 0 1460 980" role="img" aria-label="旧版 → 新版 · 职责迁移对照"><title>旧版 → 新版 · 职责迁移对照</title><desc>同一个用户用途可以迁移，但执行位置、授权与 JS 全局对象不能混为一谈</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#758AA4"/></marker></defs><rect x="0" y="0" width="1460" height="980" fill="#FAFCFF"/><rect x="0" y="0" width="1460" height="9" fill="#4D6BC7"/><text x="54" y="65" font-size="33" fill="#162841" font-weight="750" text-anchor="start">旧版 → 新版 · 职责迁移对照</text><text x="54" y="99" font-size="18" fill="#5F7189" font-weight="500" text-anchor="start">同一个用户用途可以迁移，但执行位置、授权与 JS 全局对象不能混为一谈</text><rect x="40" y="127" width="658" height="55" rx="14" fill="#FFEAD5" stroke="#F1C495" stroke-width="1.5"/><text x="67" y="162" font-size="25" fill="#A75D0D" font-weight="760" text-anchor="start">旧版 src-bex</text><rect x="762" y="127" width="658" height="55" rx="14" fill="#E6F1FF" stroke="#A9C9F5" stroke-width="1.5"/><text x="788" y="162" font-size="25" fill="#185FB4" font-weight="760" text-anchor="start">新版 OpenDesk Browser</text><rect x="40" y="204" width="658" height="101" rx="14" fill="#FFF4E7" stroke="#F4C895" stroke-width="1.5"/><text x="58" y="237" font-size="21" fill="#B55E09" font-weight="700" text-anchor="start">Background + ChromePage</text><text x="58" y="266" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">直接在背景执行自动化</text><path d="M701 253 L755 253" fill="none" stroke="#71839d" stroke-width="3"  marker-end="url(#arrow)"/><text x="727" y="241" font-size="14" fill="#4D647E" font-weight="600" text-anchor="middle">职责继承</text><rect x="762" y="204" width="658" height="101" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="780" y="237" font-size="21" fill="#185FB6" font-weight="700" text-anchor="start">Controller Worker + page</text><text x="780" y="266" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">由 RunHost / Authority 受控运行</text><rect x="40" y="326" width="658" height="101" rx="14" fill="#FFF4E7" stroke="#F4C895" stroke-width="1.5"/><text x="58" y="359" font-size="21" fill="#B55E09" font-weight="700" text-anchor="start">my-content-script.ts</text><text x="58" y="388" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">Content 注入 JS，增强网页</text><path d="M701 375 L755 375" fill="none" stroke="#71839d" stroke-width="3"  marker-end="url(#arrow)"/><text x="727" y="363" font-size="14" fill="#4D647E" font-weight="600" text-anchor="middle">执行世界变更</text><rect x="762" y="326" width="658" height="101" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="780" y="359" font-size="21" fill="#185FB6" font-weight="700" text-anchor="start">Page USER_SCRIPT + document</text><text x="780" y="388" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">在网页隔离世界增强 DOM</text><rect x="40" y="448" width="658" height="101" rx="14" fill="#FFF4E7" stroke="#F4C895" stroke-width="1.5"/><text x="58" y="481" font-size="21" fill="#B55E09" font-weight="700" text-anchor="start">brige.js + axiosx + CustomEvent</text><text x="58" y="510" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">网站经 Content 请求后台</text><path d="M701 497 L755 497" fill="none" stroke="#71839d" stroke-width="3"  marker-end="url(#arrow)"/><text x="727" y="485" font-size="14" fill="#4D647E" font-weight="600" text-anchor="middle">受信 Bridge</text><rect x="762" y="448" width="658" height="101" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="780" y="481" font-size="21" fill="#185FB6" font-weight="700" text-anchor="start">Page SDK → Relay → Broker</text><text x="780" y="510" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">请求格式 / 来源 / 授权 / 回执</text><rect x="40" y="570" width="658" height="101" rx="14" fill="#FFF4E7" stroke="#F4C895" stroke-width="1.5"/><text x="58" y="603" font-size="21" fill="#B55E09" font-weight="700" text-anchor="start">网页 executeInBg → eval</text><text x="58" y="632" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">网页可交任意 JS 到特权背景</text><path d="M701 619 L755 619" fill="none" stroke="#C54848" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="727" y="607" font-size="14" fill="#BD4141" font-weight="600" text-anchor="middle">危险能力拒绝</text><rect x="762" y="570" width="658" height="101" rx="14" fill="#FFF1F0" stroke="#F4AAA8" stroke-width="1.5"/><text x="780" y="603" font-size="21" fill="#BC3633" font-weight="700" text-anchor="start">固定 Task → RunHost（待补入口）</text><text x="780" y="632" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">raw executeScript 被明确拒绝</text><rect x="40" y="692" width="658" height="101" rx="14" fill="#FFF4E7" stroke="#F4C895" stroke-width="1.5"/><text x="58" y="725" font-size="21" fill="#B55E09" font-weight="700" text-anchor="start">多独立 vendor JS 文件</text><text x="58" y="754" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">lodash / moment / axios 等</text><path d="M701 741 L755 741" fill="none" stroke="#71839d" stroke-width="3"  marker-end="url(#arrow)"/><text x="727" y="729" font-size="14" fill="#4D647E" font-weight="600" text-anchor="middle">File-First 适配</text><rect x="762" y="692" width="658" height="101" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="780" y="725" font-size="21" fill="#185FB6" font-weight="700" text-anchor="start">独立资源 + Catalog + SHA</text><text x="780" y="754" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">按环境加载，复用字节非全局</text><rect x="41" y="836" width="1379" height="110" rx="14" fill="#F1F5FC" stroke="#C8D8EB" stroke-width="1.5"/><text x="62" y="873" font-size="21" fill="#214D86" font-weight="750" text-anchor="start">一句话记忆</text><text x="62" y="905" font-size="17" fill="#3F526F" font-weight="500" text-anchor="start">Controller：网页外部自动化（page）  ｜  Page：网页内部增强（document）  ｜  Background：可信服务</text><text x="62" y="930" font-size="17" fill="#3F526F" font-weight="500" text-anchor="start">Sidebar Tool：独立沙箱；它与 Content Script、Controller Worker 均不是同一 JavaScript 执行环境。</text><text x="1422" y="960" font-size="14" text-anchor="end" fill="#8492A4">OpenDesk Browser · Architecture reference · 2026-10-14</text></svg>