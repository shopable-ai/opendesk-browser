<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="985" viewBox="0 0 1460 985" role="img" aria-label="新版 OpenDesk Browser · 执行位置与调用链"><title>新版 OpenDesk Browser · 执行位置与调用链</title><desc>Controller Worker、Page USER_SCRIPT、Background SW、Sidebar Tool 彼此隔离</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#758AA4"/></marker></defs><rect x="0" y="0" width="1460" height="985" fill="#FAFCFF"/><rect x="0" y="0" width="1460" height="9" fill="#1D64C4"/><text x="54" y="65" font-size="33" fill="#162841" font-weight="750" text-anchor="start">新版 OpenDesk Browser · 执行位置与调用链</text><text x="54" y="99" font-size="18" fill="#5F7189" font-weight="500" text-anchor="start">Controller Worker、Page USER_SCRIPT、Background SW、Sidebar Tool 彼此隔离</text><rect x="36" y="132" width="1390" height="400" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/><rect x="36" y="132" width="1390" height="50" rx="16" fill="#EAF3FF" stroke="#EAF3FF" stroke-width="1.5"/><text x="58" y="165" font-size="22" fill="#236BC5" font-weight="750" text-anchor="start">A · Controller：从网页外部驱动浏览器</text><rect x="55" y="220" width="250" height="125" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="73" y="253" font-size="18" fill="#185FB6" font-weight="700" text-anchor="start">1 用户入口</text><text x="73" y="282" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">Side Panel 开发 / MCP</text><text x="73" y="303" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">或已安装 Controller Task</text><path d="M305 275 L325 275" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="331" y="220" width="250" height="125" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="349" y="253" font-size="18" fill="#185FB6" font-weight="700" text-anchor="start">2 可信宿主</text><text x="349" y="282" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">RunHost + 原 Authority</text><text x="349" y="303" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">绑定程序/目标/权限</text><path d="M581 275 L601 275" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="607" y="220" width="250" height="125" rx="14" fill="#F5F1FF" stroke="#CDC0F8" stroke-width="1.5"/><text x="625" y="253" font-size="18" fill="#704FBD" font-weight="700" text-anchor="start">3 隔离执行</text><text x="625" y="282" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">sandbox iframe</text><text x="625" y="303" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">Dedicated Worker 执行 main()</text><path d="M857 275 L877 275" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="883" y="220" width="250" height="125" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="901" y="253" font-size="18" fill="#185FB6" font-weight="700" text-anchor="start">4 网页能力</text><text x="901" y="282" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">Worker 内的 page 代理</text><text x="901" y="303" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">MessagePort → Host/Broker</text><path d="M1133 275 L1153 275" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1159" y="220" width="250" height="125" rx="14" fill="#EFF6FF" stroke="#B9D6FF" stroke-width="1.5"/><text x="1177" y="253" font-size="18" fill="#185FB6" font-weight="700" text-anchor="start">5 真实效果</text><text x="1177" y="282" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">Native Driver / Page Session</text><text x="1177" y="303" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">明确 tab/frame/document</text><rect x="56" y="367" width="1348" height="128" rx="14" fill="#EEF5FF" stroke="#C3D5ED" stroke-width="1.5"/><text x="78" y="401" font-size="19" fill="#175DAF" font-weight="750" text-anchor="start">结果 / 生命周期</text><text x="78" y="430" font-size="17" fill="#455A73" font-weight="500" text-anchor="start">Controller main() 能使用 page / params / axiosx，但没有网页 document 和特权 chrome API。</text><text x="78" y="455" font-size="17" fill="#455A73" font-weight="500" text-anchor="start">执行结束通过 RunHost 结算 runId、resultId、revision 并释放 Worker；用户代码不在 Background SW 直接执行。</text><rect x="36" y="558" width="1390" height="190" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/><rect x="36" y="558" width="1390" height="50" rx="16" fill="#E8F9F1" stroke="#E8F9F1" stroke-width="1.5"/><text x="58" y="591" font-size="22" fill="#17845F" font-weight="750" text-anchor="start">B · Page USER_SCRIPT：在网页自身执行和增强 DOM</text><rect x="56" y="625" width="320" height="104" rx="14" fill="#EBFBF4" stroke="#A8E2C5" stroke-width="1.5"/><text x="74" y="658" font-size="17" fill="#16825E" font-weight="700" text-anchor="start">用户入口</text><text x="74" y="687" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">在当前网页试运行</text><text x="74" y="708" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">或已安装 Page Program</text><path d="M376 679 L396 679" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="403" y="625" width="320" height="104" rx="14" fill="#EBFBF4" stroke="#A8E2C5" stroke-width="1.5"/><text x="421" y="658" font-size="17" fill="#16825E" font-weight="700" text-anchor="start">指定网页的 USER_SCRIPT</text><text x="421" y="687" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">隔离世界内运行 JS</text><text x="421" y="708" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">具备 document / DOM</text><path d="M723 679 L743 679" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="750" y="625" width="320" height="104" rx="14" fill="#EBFBF4" stroke="#A8E2C5" stroke-width="1.5"/><text x="768" y="658" font-size="17" fill="#16825E" font-weight="700" text-anchor="start">网页 UI</text><text x="768" y="687" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">按钮 / Shadow DOM</text><text x="768" y="708" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">createPageUI / React / Vue</text><path d="M1070 679 L1090 679" fill="none" stroke="#758AA4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1097" y="625" width="320" height="104" rx="14" fill="#EBFBF4" stroke="#A8E2C5" stroke-width="1.5"/><text x="1115" y="658" font-size="17" fill="#16825E" font-weight="700" text-anchor="start">预览与安装回执</text><text x="1115" y="687" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">previewId / documentId</text><text x="1115" y="708" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">sourceHash / pageRules</text><rect x="36" y="772" width="1390" height="176" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/><rect x="36" y="772" width="1390" height="50" rx="16" fill="#F2ECFE" stroke="#F2ECFE" stroke-width="1.5"/><text x="58" y="805" font-size="22" fill="#7C59C3" font-weight="750" text-anchor="start">C · 可信基础设施与工具沙箱（不等于 Controller/Page）</text><rect x="57" y="841" width="335" height="80" rx="14" fill="#F6F8FA" stroke="#D4DEE7" stroke-width="1.5"/><text x="75" y="874" font-size="17" fill="#33445E" font-weight="700" text-anchor="start">Background SW</text><text x="75" y="903" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">受信事件、授权、服务</text><rect x="411" y="841" width="335" height="80" rx="14" fill="#F6F8FA" stroke="#D4DEE7" stroke-width="1.5"/><text x="429" y="874" font-size="17" fill="#33445E" font-weight="700" text-anchor="start">Broker / Authority</text><text x="429" y="903" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">精确来源、权限、状态</text><rect x="765" y="841" width="335" height="80" rx="14" fill="#F5F1FF" stroke="#CDC0F8" stroke-width="1.5"/><text x="783" y="874" font-size="17" fill="#704FBD" font-weight="700" text-anchor="start">Sidebar Tool 沙箱</text><text x="783" y="903" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">OpenDeskTool / postMessage</text><rect x="1117" y="841" width="290" height="80" rx="14" fill="#F6F8FA" stroke="#D4DEE7" stroke-width="1.5"/><text x="1135" y="874" font-size="17" fill="#33445E" font-weight="700" text-anchor="start">Native / Storage</text><text x="1135" y="903" font-size="15" fill="#40516A" font-weight="500" text-anchor="start">本地接入、固定结果</text><text x="1422" y="965" font-size="14" text-anchor="end" fill="#8492A4">OpenDesk Browser · Architecture reference · 2026-10-14</text></svg>