name = "opendesk-analytics"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
POSTHOG_HOST = "https://eu.i.posthog.com"

[[d1_databases]]
binding = "DB"
database_name = "opendesk-analytics"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_UUID"

[triggers]
crons = ["*/5 * * * *"]

# Set secrets: wrangler secret put POSTHOG_PROJECT_TOKEN
# and wrangler secret put RATE_SALT (>=24 random characters).
# Provision a real custom HTTPS route separately.
